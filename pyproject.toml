[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civora-core-runtime"
version = "0.1.0"
description = "Deterministic core runtime for CIVORA"
requires-python = ">=3.10"

[project.scripts]
civora = "civora.cli:entrypoint"
civora-remediation = "civora.remediation_cli:entrypoint"

[tool.setuptools.packages.find]
include = ["civora*"]
exclude = ["schemas*", "tests*", "docs*"]
