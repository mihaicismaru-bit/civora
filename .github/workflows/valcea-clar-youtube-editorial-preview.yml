name: VÂLCEA CLAR YouTube Editorial Preview

on:
  pull_request:
    paths:
      - "valcea-clar/social/youtube_editorial_v1.py"
      - "valcea-clar/social/social_common.py"
      - "valcea-clar/social/story_visuals.json"
      - "valcea-clar/social/story_video_media.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editorial/publication_holds.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-youtube-editorial-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install deterministic YouTube renderer
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Validate video registry contract
        run: |
          python -m json.tool valcea-clar/social/story_video_media.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('valcea-clar/social/story_video_media.json').read_text(encoding='utf-8'))
          policy=value.get('policy') or {}
          required=(
              'story_specific_only','real_video_only','synthetic_video_forbidden',
              'editor_approval_required','subject_match_required','rights_metadata_required',
              'poster_frame_must_come_from_same_real_video_package',
              'thumbnail_may_not_exist_without_ready_video',
          )
          if any(policy.get(key) is not True for key in required):
              raise SystemExit('YouTube real-video registry fail-closed policy drift')
          print(f"YouTube real-video registry: PASS ({len(value.get('stories',{}))} current video packages)")
          PY
      - name: Self-test YouTube packaging and truthful thumbnail renderer
        run: python valcea-clar/social/youtube_editorial_v1.py --self-test
      - name: Build YouTube editorial previews
        run: python valcea-clar/social/youtube_editorial_v1.py
      - name: Validate durable-video fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('valcea-clar/social/previews/youtube-v1/manifest.json').read_text(encoding='utf-8'))
          if value.get('execution_mode')!='PREVIEW_ONLY_NO_NETWORK_CALLS':
              raise SystemExit('YouTube preview network-call guard missing')
          if value.get('rendering_version')!='youtube-editorial-v1.1':
              raise SystemExit('YouTube premium rendering version mismatch')
          if value.get('video_registry')!='valcea-clar/social/story_video_media.json':
              raise SystemExit('YouTube approved-video registry lineage missing')
          products={p['story_id']:p for p in value.get('products',[]) if isinstance(p,dict)}
          held={'olanesti-bridge-monitor','derived-council-gambling-20260723'}
          if set(products) & held:
              raise SystemExit(f'editorial hold leaked into YouTube previews: {sorted(set(products) & held)}')
          for product in products.values():
              if product.get('real_video_required') is not True or product.get('synthetic_filler_forbidden') is not True:
                  raise SystemExit('YouTube real-video integrity guard missing')
              if product.get('thumbnail_requires_ready_video') is not True or product.get('truthful_thumbnail_required') is not True:
                  raise SystemExit('YouTube truthful-thumbnail guard missing')
              if product.get('verbatim_cross_platform_reuse_allowed') is not False:
                  raise SystemExit('YouTube cross-platform reuse guard missing')
              if product.get('status')!='READY' and product.get('preview_file'):
                  raise SystemExit('YouTube HOLD/HOLD_MEDIA product received a standalone thumbnail')
          jpgs=list(Path('valcea-clar/social/previews/youtube-v1').glob('*.jpg'))
          if value.get('ready')==0 and jpgs:
              raise SystemExit(f'YouTube manufactured thumbnails without READY video: {jpgs}')
          print(f"YouTube editorial preview v1.1: PASS ({value['ready']} READY / {value['held']} HOLD)")
          PY
      - name: Upload YouTube editorial preview
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-youtube-editorial-v1-1-${{ github.run_id }}
          path: valcea-clar/social/previews/youtube-v1
          if-no-files-found: error
          retention-days: 14
