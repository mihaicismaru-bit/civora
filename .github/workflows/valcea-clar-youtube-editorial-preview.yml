name: VÂLCEA CLAR YouTube Editorial Preview

on:
  pull_request:
    paths:
      - "valcea-clar/social/youtube_editorial_v1.py"
      - "valcea-clar/social/story_visuals.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-youtube-editorial-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Self-test YouTube packaging
        run: python valcea-clar/social/youtube_editorial_v1.py --self-test
      - name: Build YouTube editorial previews
        run: python valcea-clar/social/youtube_editorial_v1.py
      - name: Validate durable-video fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('valcea-clar/social/previews/youtube-v1/manifest.json').read_text(encoding='utf-8'))
          if value.get('execution_mode')!='PREVIEW_ONLY_NO_NETWORK_CALLS':
              raise SystemExit('YouTube preview network-call guard missing')
          products={p['story_id']:p for p in value.get('products',[]) if isinstance(p,dict)}
          gov=products.get('florile-govorei-20260816')
          if not gov or gov.get('status')!='HOLD':
              raise SystemExit('Florile Govorei YouTube thin-story gate failed')
          lum=products.get('luminos-fest-zavoi-20260815')
          if not lum or lum.get('status')!='HOLD_MEDIA' or lum.get('hold_reason')!='current_subject_video_or_visual_sequence_required':
              raise SystemExit('Luminos YouTube current-media gate failed')
          ola=products.get('olanesti-bridge-monitor')
          if not ola or ola.get('status')!='HOLD_MEDIA' or ola.get('format_family')!='document_explainer':
              raise SystemExit('Olănești YouTube document-explainer fixture failed')
          if ola.get('title')!='44,37 mil. lei pe Olănești: ce se construiește lângă Omniasig':
              raise SystemExit('Olănești YouTube title failed')
          if ola.get('thumbnail_text')!='44,37 MIL. LEI PE OLĂNEȘTI':
              raise SystemExit('Olănești YouTube thumbnail promise failed')
          chapters=' '.join(str(c.get('text','')) for c in ola.get('chapters',[]) if isinstance(c,dict))
          for expected in ('SMIS 334436','nu permit atribuirea exactă'):
              if expected not in chapters:
                  raise SystemExit(f'Olănești YouTube script missing: {expected}')
          for product in products.values():
              if product.get('real_video_required') is not True or product.get('synthetic_filler_forbidden') is not True:
                  raise SystemExit('YouTube real-video integrity guard missing')
              if product.get('verbatim_cross_platform_reuse_allowed') is not False:
                  raise SystemExit('YouTube cross-platform reuse guard missing')
          print(f"YouTube editorial preview: PASS ({value['ready']} READY / {value['held']} HOLD)")
          PY
      - name: Upload YouTube editorial preview
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-youtube-editorial-v1-${{ github.run_id }}
          path: valcea-clar/social/previews/youtube-v1
          if-no-files-found: error
          retention-days: 14
