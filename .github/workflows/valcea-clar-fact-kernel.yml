name: VÂLCEA CLAR Fact Kernel Builder

# Single production writer for editorial/facts_registry.json. Adapter sequencing
# lives in fact_kernel_orchestrator.py; this workflow only schedules, validates
# and persists one verified transaction.
on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
  pull_request:
    paths:
      - 'valcea-clar/scripts/fact_kernel_orchestrator.py'
      - 'valcea-clar/scripts/council_*.py'
      - 'valcea-clar/scripts/*kernel*.py'
      - 'valcea-clar/scripts/primary_source_*.py'
      - 'valcea-clar/scripts/gambling_dossier_*.py'
      - 'valcea-clar/scripts/compose_structured_alerts.py'
      - 'valcea-clar/scripts/promote_manual_publish_queue.py'
      - 'valcea-clar/scripts/merge_supplemental_facts.py'
      - 'valcea-clar/scripts/editorial_lifecycle_normalizer.py'
      - 'valcea-clar/scripts/prune_volatile_json_changes.py'
      - 'valcea-clar/editorial/structured_alert_events.json'
      - 'valcea-clar/editorial/manual_publish_queue.json'
      - 'valcea-clar/editorial/supplemental_facts_registry.json'
      - 'valcea-clar/editorial/festival_dossiers_*.json'
      - 'valcea-clar/editorial/performing_arts_dossiers_*.json'
      - 'valcea-clar/editorial/gambling_ramnicu_2026_dossier.json'
      - 'valcea-clar/editorial/editorial_manual.json'
      - '.github/workflows/valcea-clar-fact-kernel.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/fact_kernel_orchestrator.py'
      - 'valcea-clar/scripts/council_*.py'
      - 'valcea-clar/scripts/*kernel*.py'
      - 'valcea-clar/scripts/primary_source_*.py'
      - 'valcea-clar/scripts/gambling_dossier_*.py'
      - 'valcea-clar/scripts/compose_structured_alerts.py'
      - 'valcea-clar/scripts/promote_manual_publish_queue.py'
      - 'valcea-clar/scripts/merge_supplemental_facts.py'
      - 'valcea-clar/scripts/editorial_lifecycle_normalizer.py'
      - 'valcea-clar/scripts/prune_volatile_json_changes.py'
      - 'valcea-clar/editorial/structured_alert_events.json'
      - 'valcea-clar/editorial/manual_publish_queue.json'
      - 'valcea-clar/editorial/supplemental_facts_registry.json'
      - 'valcea-clar/editorial/festival_dossiers_*.json'
      - 'valcea-clar/editorial/performing_arts_dossiers_*.json'
      - 'valcea-clar/editorial/gambling_ramnicu_2026_dossier.json'
      - 'valcea-clar/editorial/editorial_manual.json'
      - '.github/workflows/valcea-clar-fact-kernel.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-fact-kernel-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  fact-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate canonical fact orchestrator
        run: |
          python -m py_compile \
            valcea-clar/scripts/fact_kernel_orchestrator.py \
            valcea-clar/scripts/promote_manual_publish_queue.py \
            valcea-clar/scripts/prune_volatile_json_changes.py
          python valcea-clar/scripts/fact_kernel_orchestrator.py --self-test
          python valcea-clar/scripts/fact_kernel_orchestrator.py --check
          python valcea-clar/scripts/prune_volatile_json_changes.py --self-test

      - name: Build one verified fact transaction
        if: github.event_name != 'pull_request'
        run: python valcea-clar/scripts/fact_kernel_orchestrator.py --build

      - name: Persist verified fact products once
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vâlcea-clar-fact-kernel[bot]'
          git config user.email 'valcea-clar-fact-kernel@users.noreply.github.com'

          files=(
            valcea-clar/editorial/facts_registry.json
            valcea-clar/editorial/fact_kernel_registry.json
            valcea-clar/editorial/council_watch_rm_valcea_state.json
            valcea-clar/editorial/council_docmanager_structure.json
            valcea-clar/editorial/council_docmanager_document_structure.json
            valcea-clar/editorial/council_decision_document_corpus.json
            valcea-clar/editorial/council_decision_graph.json
            valcea-clar/editorial/council_investigation_leads.json
            valcea-clar/editorial/scm_program_structure.json
          )

          json_files=()
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then json_files+=("$file"); fi
          done
          if [ "${#json_files[@]}" -gt 0 ]; then
            python valcea-clar/scripts/prune_volatile_json_changes.py \
              --ignore-key generated_at \
              --ignore-key generated_at_utc \
              --ignore-key observed_at \
              --ignore-key updated_at \
              --ignore-key checked_at \
              --ignore-key detected_at \
              "${json_files[@]}"
          fi

          for file in "${files[@]}"; do
            if [ -e "$file" ]; then git add "$file"; fi
          done

          if git diff --cached --quiet; then
            echo 'No semantic verified fact change to persist.'
            exit 0
          fi

          git commit -m 'Refresh VÂLCEA CLAR verified fact products'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo 'Could not persist fact transaction without conflict.' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Upload bounded fact diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-fact-kernel-${{ github.run_id }}
          path: |
            valcea-clar/editorial/council_docmanager_structure.json
            valcea-clar/editorial/council_docmanager_document_structure.json
            valcea-clar/editorial/council_decision_document_corpus.json
            valcea-clar/editorial/scm_program_structure.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report ownership
        if: always()
        run: |
          echo 'Fact ownership: one orchestrator / one facts writer / one persist boundary.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live Newsroom consumes successful Fact Kernel completion; no fact adapter publishes directly.' >> "$GITHUB_STEP_SUMMARY"
