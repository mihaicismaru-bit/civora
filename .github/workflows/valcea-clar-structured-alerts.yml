name: VÂLCEA CLAR Structured Primary Alerts

# Rapid T1 ingest owns only the verified event stream. It must never mutate the
# canonical facts registry directly. A changed structured_alert_events.json push
# triggers Fact Kernel, which is the single facts writer, then Live Newsroom.
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'local-news-os/core/structured_alert_ingest.py'
      - 'local-news-os/core/structured_alert_runtime.py'
      - 'local-news-os/core/structured_heat_interruption_parser.py'
      - 'local-news-os/core/structured_electricity_interruption_parser.py'
      - 'local-news-os/core/structured_electricity_schedule_adapter.py'
      - 'local-news-os/instances/valcea/structured_alert_pack.json'
      - 'local-news-os/instances/valcea/source_pack.json'
      - 'valcea-clar/scripts/compose_structured_alerts.py'
      - 'valcea-clar/scripts/prune_volatile_json_changes.py'
      - 'valcea-clar/scripts/persistence_profiles.json'
      - '.github/workflows/valcea-clar-structured-alerts.yml'
  pull_request:
    paths:
      - 'local-news-os/core/structured_alert_ingest.py'
      - 'local-news-os/core/structured_alert_runtime.py'
      - 'local-news-os/core/structured_heat_interruption_parser.py'
      - 'local-news-os/core/structured_electricity_interruption_parser.py'
      - 'local-news-os/core/structured_electricity_schedule_adapter.py'
      - 'local-news-os/instances/valcea/structured_alert_pack.json'
      - 'local-news-os/instances/valcea/source_pack.json'
      - 'valcea-clar/scripts/compose_structured_alerts.py'
      - 'valcea-clar/scripts/prune_volatile_json_changes.py'
      - 'valcea-clar/scripts/persistence_profiles.json'
      - '.github/workflows/valcea-clar-structured-alerts.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-structured-alerts-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  structured-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate structured-alert contracts offline
        run: |
          python -m py_compile \
            local-news-os/core/structured_alert_ingest.py \
            local-news-os/core/structured_alert_runtime.py \
            local-news-os/core/structured_heat_interruption_parser.py \
            local-news-os/core/structured_electricity_interruption_parser.py \
            local-news-os/core/structured_electricity_schedule_adapter.py \
            valcea-clar/scripts/compose_structured_alerts.py \
            valcea-clar/scripts/prune_volatile_json_changes.py
          python local-news-os/core/structured_alert_runtime.py --self-test
          python valcea-clar/scripts/compose_structured_alerts.py --self-test
          python valcea-clar/scripts/prune_volatile_json_changes.py --self-test

      # Distribuție Oltenia publishes the Vâlcea schedule as weekly PDFs.
      # The adapter was live-probed on exact-head before activation; pin the
      # small extractor so production uses the same deterministic path.
      - name: Install electricity PDF extraction dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'pypdf==6.0.0'

      - name: Live-probe electricity weekly documents on pull request
        if: github.event_name == 'pull_request'
        run: |
          python local-news-os/core/structured_electricity_schedule_adapter.py \
            --live-probe-url 'https://www.distributieoltenia.ro/en/support/planned-maintenance-and-fault-correction/valcea.html'

      - name: Ingest current structured primary alerts
        run: |
          python local-news-os/core/structured_alert_runtime.py \
            --instance valcea \
            --output valcea-clar/editorial/structured_alert_events.json

      - name: Validate event-to-fact composition without writing facts
        run: |
          python valcea-clar/scripts/compose_structured_alerts.py \
            --events valcea-clar/editorial/structured_alert_events.json \
            --facts-registry valcea-clar/editorial/facts_registry.json \
            --no-write

      - name: Validate runtime output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          events=json.loads(Path('valcea-clar/editorial/structured_alert_events.json').read_text(encoding='utf-8'))
          assert events['contract']=='LOCAL_NEWS_OS_STRUCTURED_ALERT_EVENTS_V1'
          assert events['events_are_reader_stories'] is False
          assert events['publication_authority']=='PRIMARY_STRUCTURED_EVENT_ONLY'
          for row in events.get('events',[]):
              assert row.get('source_tier')=='T1'
              assert row.get('source_url')
              assert row.get('body_sha256')
              parser=row.get('parser')
              if parser == 'RO_INFOTRAFIC_DETAIL_V1':
                  assert row.get('issued_at')
                  assert row.get('source_time_basis') == 'official_issue_time'
              elif parser == 'RO_UTILITY_WATER_INTERRUPTION_LISTING_V1':
                  assert row.get('event_start') and row.get('event_end')
                  assert row.get('source_time_basis') == 'official_service_window'
                  assert (row.get('structured') or {}).get('utility') == 'water'
                  assert row.get('reader_copy_generated') is False
              elif parser == 'RO_UTILITY_HEAT_INTERRUPTION_LISTING_V1':
                  assert row.get('event_start') and row.get('event_end')
                  assert row.get('source_time_basis') == 'official_service_window'
                  assert (row.get('structured') or {}).get('utility') == 'district_heat'
                  assert row.get('reader_copy_generated') is False
              elif parser == 'RO_UTILITY_ELECTRICITY_INTERRUPTION_LISTING_V1':
                  assert row.get('event_start') and row.get('event_end')
                  assert row.get('source_time_basis') == 'official_service_window'
                  structured=row.get('structured') or {}
                  assert structured.get('utility') == 'electricity'
                  assert structured.get('affected_locality')
                  assert structured.get('affected_scope')
                  assert structured.get('schedule_start') and structured.get('schedule_end')
                  assert row.get('reader_copy_generated') is False
              else:
                  raise AssertionError(f'unsupported structured alert parser: {parser}')
          print({'status':'PASS','events':events.get('event_count',0)})
          PY

      - name: Persist only the verified structured event stream
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/editorial/structured_alert_events.json /tmp/valcea-structured-alert-events.json
          git config user.name 'vâlcea-clar-structured-alerts[bot]'
          git config user.email 'valcea-clar-structured-alerts@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p valcea-clar/editorial
            cp /tmp/valcea-structured-alert-events.json valcea-clar/editorial/structured_alert_events.json
            python valcea-clar/scripts/prune_volatile_json_changes.py \
              --profile structured_alerts \
              valcea-clar/editorial/structured_alert_events.json
            git add valcea-clar/editorial/structured_alert_events.json
            if git diff --cached --quiet; then
              echo 'Structured primary event stream has no semantic change.'
              exit 0
            fi
            git commit -m 'Refresh VÂLCEA CLAR structured primary events'
            if git push origin HEAD:main; then
              echo 'Fact Kernel will consume this durable event change via its push trigger.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not persist structured primary events without conflict.' >&2
          exit 1
