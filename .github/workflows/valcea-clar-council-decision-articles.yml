name: VÂLCEA CLAR Council Decision Articles

# One Council pipeline owns: latest adopted-HCL selection -> official document
# resolution -> article materialization -> evergreen lifecycle normalization.
on:
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/council_watch_rm_valcea_state.json'
      - 'valcea-clar/scripts/council_decision_document_resolver.py'
      - 'valcea-clar/scripts/council_decision_article_engine.py'
      - 'valcea-clar/scripts/council_decision_fulltext_enricher.py'
      - 'valcea-clar/scripts/council_decision_fulltext_enricher_v2.py'
      - 'valcea-clar/scripts/council_claim_attribution_normalizer.py'
      - 'valcea-clar/scripts/editorial_lifecycle_normalizer.py'
      - 'valcea-clar/scripts/council_watch_rm_valcea.py'
      - 'valcea-clar/scripts/council_watch_rm_valcea_v2.py'
      - '.github/workflows/valcea-clar-council-decision-articles.yml'
  pull_request:
    paths:
      - 'valcea-clar/scripts/council_decision_document_resolver.py'
      - 'valcea-clar/scripts/council_decision_article_engine.py'
      - 'valcea-clar/scripts/council_decision_fulltext_enricher.py'
      - 'valcea-clar/scripts/council_decision_fulltext_enricher_v2.py'
      - 'valcea-clar/scripts/council_claim_attribution_normalizer.py'
      - 'valcea-clar/scripts/editorial_lifecycle_normalizer.py'
      - 'valcea-clar/scripts/council_watch_rm_valcea_v2.py'
      - '.github/workflows/valcea-clar-council-decision-articles.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: valcea-clar-council-decision-articles-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate consolidated HCL contracts
        run: |
          python -m py_compile \
            valcea-clar/scripts/council_decision_document_resolver.py \
            valcea-clar/scripts/council_decision_article_engine.py \
            valcea-clar/scripts/council_decision_fulltext_enricher.py \
            valcea-clar/scripts/council_decision_fulltext_enricher_v2.py \
            valcea-clar/scripts/council_claim_attribution_normalizer.py \
            valcea-clar/scripts/editorial_lifecycle_normalizer.py \
            valcea-clar/scripts/council_watch_rm_valcea_v2.py
          python valcea-clar/scripts/council_watch_rm_valcea_v2.py --self-test
          python valcea-clar/scripts/council_decision_document_resolver.py --self-test
          python valcea-clar/scripts/council_decision_article_engine.py --self-test
          python valcea-clar/scripts/council_decision_fulltext_enricher.py --self-test
          python valcea-clar/scripts/council_decision_fulltext_enricher_v2.py --self-test
          python valcea-clar/scripts/council_claim_attribution_normalizer.py --self-test
          python valcea-clar/scripts/editorial_lifecycle_normalizer.py --self-test

      - name: Select latest official adopted-decision date
        if: github.event_name != 'pull_request'
        run: python valcea-clar/scripts/council_watch_rm_valcea_v2.py

      - name: Resolve latest-meeting official HCL documents
        if: github.event_name != 'pull_request'
        run: python valcea-clar/scripts/council_decision_document_resolver.py --live --apply

      - name: Preview latest-meeting article set
        run: python valcea-clar/scripts/council_decision_article_engine.py

      - name: Materialize one article per adopted HCL and investigation graph
        if: github.event_name != 'pull_request'
        run: python valcea-clar/scripts/council_decision_article_engine.py --apply

      - name: Upgrade articles from official documents and normalize lifecycle
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s valcea-clar/editorial/council_decision_document_corpus.json ]; then
            python valcea-clar/scripts/council_decision_fulltext_enricher_v2.py --apply
            python valcea-clar/scripts/council_claim_attribution_normalizer.py --apply
          else
            echo 'Full official HCL corpus not materialized yet; register-safe articles remain valid.'
          fi
          python valcea-clar/scripts/editorial_lifecycle_normalizer.py --apply
          python valcea-clar/scripts/editorial_writer.py --check

      - name: Persist consolidated HCL products conflict-safe
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/editorial/facts_registry.json /tmp/hcl-facts.json
          cp valcea-clar/editorial/council_decision_graph.json /tmp/hcl-graph.json
          cp valcea-clar/editorial/council_investigation_leads.json /tmp/hcl-leads.json
          cp valcea-clar/editorial/council_watch_rm_valcea_state.json /tmp/hcl-watch-state.json
          if [ -s valcea-clar/editorial/council_decision_document_corpus.json ]; then
            cp valcea-clar/editorial/council_decision_document_corpus.json /tmp/hcl-document-corpus.json
          fi

          git config user.name 'valcea-clar-council-articles[bot]'
          git config user.email 'valcea-clar-council-articles@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p valcea-clar/editorial
            cp /tmp/hcl-facts.json valcea-clar/editorial/facts_registry.json
            cp /tmp/hcl-graph.json valcea-clar/editorial/council_decision_graph.json
            cp /tmp/hcl-leads.json valcea-clar/editorial/council_investigation_leads.json
            cp /tmp/hcl-watch-state.json valcea-clar/editorial/council_watch_rm_valcea_state.json
            git add \
              valcea-clar/editorial/facts_registry.json \
              valcea-clar/editorial/council_decision_graph.json \
              valcea-clar/editorial/council_investigation_leads.json \
              valcea-clar/editorial/council_watch_rm_valcea_state.json
            if [ -s /tmp/hcl-document-corpus.json ]; then
              cp /tmp/hcl-document-corpus.json valcea-clar/editorial/council_decision_document_corpus.json
              git add valcea-clar/editorial/council_decision_document_corpus.json
            fi
            if git diff --cached --quiet; then
              echo 'HCL article products already current.'
              exit 0
            fi
            git commit -m 'Refresh VÂLCEA CLAR adopted HCL pipeline'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during HCL persist; retrying ${attempt}/5."
            sleep $((attempt * 2))
          done
          echo 'Could not persist HCL products.' >&2
          exit 1

      - name: Dispatch live newsroom after material HCL change
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run valcea-clar-newsroom-live.yml --ref main

      - name: Report consolidated Council pipeline
        if: always()
        run: |
          echo 'Target meeting is selected from the newest date actually present in the official adopted-HCL register.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Official documents, stable article URLs, attribution and evergreen lifecycle now share one Council control plane.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Register-only fallback remains fail-closed when a document cannot be resolved.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cross-decision patterns create private investigation leads, never automatic allegations.' >> "$GITHUB_STEP_SUMMARY"
