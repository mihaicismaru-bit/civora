name: VÂLCEA CLAR WhatsApp Editorial Outbox

on:
  workflow_run:
    workflows: ["VÂLCEA CLAR Social Publication Engine"]
    types: [completed]
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "valcea-clar/social/whatsapp_editorial_v1.py"
      - "valcea-clar/social/whatsapp_editorial_materialize.py"
      - "valcea-clar/social/whatsapp_outbox.json"
      - "valcea-clar/social/whatsapp_state.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-whatsapp-editorial.yml"

permissions:
  contents: write

concurrency:
  group: valcea-clar-whatsapp-editorial-outbox
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh canonical main for non-PR runs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Self-test WhatsApp editorial product
        run: |
          python valcea-clar/social/whatsapp_editorial_v1.py --self-test
          python valcea-clar/social/whatsapp_editorial_materialize.py --self-test

      - name: Materialize canonical WhatsApp editorial outbox
        run: python valcea-clar/social/whatsapp_editorial_materialize.py | tee /tmp/whatsapp-editorial-materialize.json

      - name: Validate canonical WhatsApp high-value fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          outbox=json.loads(Path('valcea-clar/social/whatsapp_outbox.json').read_text(encoding='utf-8'))
          state=json.loads(Path('valcea-clar/social/whatsapp_state.json').read_text(encoding='utf-8'))
          items={str(i.get('story_id')):i for i in outbox.get('items',[]) if isinstance(i,dict)}
          if outbox.get('platform')!='whatsapp' or outbox.get('editorial_product_version')!='whatsapp-editorial-v1.0':
              raise SystemExit('WhatsApp canonical editorial outbox version mismatch')
          if state.get('direct_publication_enabled') is not False:
              raise SystemExit('WhatsApp state falsely claims direct publication')
          if state.get('direct_publication_blocker')!='whatsapp_verified_access_and_recipient_scope_not_configured':
              raise SystemExit('WhatsApp access/recipient blocker missing')
          gov=items.get('florile-govorei-20260816')
          if not gov or gov.get('status')!='hold':
              raise SystemExit('Florile Govorei WhatsApp high-value HOLD failed')
          lum=items.get('luminos-fest-zavoi-20260815')
          if not lum or lum.get('status')!='outbox_ready' or lum.get('distribution_class')!='weekend_utility':
              raise SystemExit('Luminos WhatsApp weekend utility failed')
          if 'Intrarea este liberă' not in lum.get('message',''):
              raise SystemExit('Luminos WhatsApp utility fact missing')
          ola=items.get('olanesti-bridge-monitor')
          if not ola or ola.get('status')!='outbox_ready' or ola.get('distribution_class')!='essential_public_interest':
              raise SystemExit('Olănești WhatsApp essential public-interest product failed')
          text=ola.get('message','')
          for expected in ('44,37 mil. lei','Ralunic + Dimex-2000 Company','SMIS 334436'):
              if expected not in text:
                  raise SystemExit(f'Olănești WhatsApp missing {expected}')
          if int(ola.get('priority') or 0) < 85:
              raise SystemExit('Olănești WhatsApp priority too low')
          for item in items.values():
              if item.get('status')=='outbox_ready':
                  if item.get('recipient_scope_required_before_dispatch') is not True:
                      raise SystemExit('WhatsApp recipient-scope gate missing')
                  if item.get('low_frequency') is not True:
                      raise SystemExit('WhatsApp low-frequency invariant missing')
                  if item.get('verbatim_cross_platform_reuse_allowed') is not False:
                      raise SystemExit('WhatsApp cross-platform reuse guard missing')
                  if item.get('fake_urgency_forbidden') is not True:
                      raise SystemExit('WhatsApp fake-urgency guard missing')
                  if len(str(item.get('message') or '')) > 900:
                      raise SystemExit('WhatsApp message budget exceeded')
          print(f"WhatsApp canonical editorial outbox: PASS ({len(items)} products)")
          PY

      - name: Persist WhatsApp editorial state conflict-safe
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          rm -rf /tmp/whatsapp-editorial-state
          mkdir -p /tmp/whatsapp-editorial-state/valcea-clar/social
          cp valcea-clar/social/whatsapp_outbox.json /tmp/whatsapp-editorial-state/valcea-clar/social/whatsapp_outbox.json
          cp valcea-clar/social/whatsapp_state.json /tmp/whatsapp-editorial-state/valcea-clar/social/whatsapp_state.json
          git config user.name "valcea-clar-whatsapp-engine[bot]"
          git config user.email "valcea-clar-whatsapp-engine@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/whatsapp-editorial-state/valcea-clar/social/whatsapp_outbox.json valcea-clar/social/whatsapp_outbox.json
            cp /tmp/whatsapp-editorial-state/valcea-clar/social/whatsapp_state.json valcea-clar/social/whatsapp_state.json
            git add valcea-clar/social/whatsapp_outbox.json valcea-clar/social/whatsapp_state.json
            if git diff --cached --quiet; then
              echo "No WhatsApp editorial changes to persist."
              exit 0
            fi
            git commit -m "Persist VÂLCEA CLAR WhatsApp editorial outbox"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload WhatsApp editorial audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-whatsapp-editorial-${{ github.run_id }}
          path: |
            /tmp/whatsapp-editorial-materialize.json
            valcea-clar/social/whatsapp_outbox.json
            valcea-clar/social/whatsapp_state.json
          if-no-files-found: warn
          retention-days: 14
