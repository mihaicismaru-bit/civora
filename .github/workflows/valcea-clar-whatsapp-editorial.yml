name: VÂLCEA CLAR WhatsApp Editorial Compatibility Check

# WhatsApp is OUTBOX_ONLY in the canonical channel registry. The canonical
# Social Publication Engine already materializes the WhatsApp editorial product.
# Keep only regression coverage here; no autonomous scheduling or main writes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/social/whatsapp_editorial_v1.py'
      - 'valcea-clar/social/whatsapp_editorial_materialize.py'
      - 'valcea-clar/social/build_outbox_only_story_products.py'
      - 'valcea-clar/social/channel_registry.json'
      - '.github/workflows/valcea-clar-whatsapp-editorial.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-whatsapp-editorial-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate WhatsApp editorial product
        run: |
          python valcea-clar/social/whatsapp_editorial_v1.py --self-test
          python valcea-clar/social/whatsapp_editorial_materialize.py --self-test
          python valcea-clar/social/whatsapp_editorial_materialize.py
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('valcea-clar/social/whatsapp_state.json').read_text(encoding='utf-8'))
          outbox=json.loads(Path('valcea-clar/social/whatsapp_outbox.json').read_text(encoding='utf-8'))
          assert state.get('direct_publication_enabled') is False
          assert state.get('interruption_budget_per_cycle') == 1
          assert outbox.get('platform') == 'whatsapp'
          assert len([x for x in outbox.get('items', []) if isinstance(x, dict) and x.get('status') == 'outbox_ready']) <= 1
          print(f"WhatsApp OUTBOX_ONLY compatibility: PASS ({len(outbox.get('items', []))} products)")
          PY
