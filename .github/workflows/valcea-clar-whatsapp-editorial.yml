name: VÂLCEA CLAR WhatsApp Editorial Outbox

on:
  workflow_run:
    workflows: ["VÂLCEA CLAR Social Publication Engine"]
    types: [completed]
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "valcea-clar/social/whatsapp_editorial_v1.py"
      - "valcea-clar/social/whatsapp_editorial_materialize.py"
      - "valcea-clar/social/whatsapp_channel_presence.json"
      - "valcea-clar/social/whatsapp_outbox.json"
      - "valcea-clar/social/whatsapp_state.json"
      - "valcea-clar/social/telegram_outbox.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-whatsapp-editorial.yml"

permissions:
  contents: write

concurrency:
  group: valcea-clar-whatsapp-editorial-outbox
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh canonical main for non-PR runs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Self-test WhatsApp editorial product and interruption budget
        run: |
          python valcea-clar/social/whatsapp_editorial_v1.py --self-test
          python valcea-clar/social/whatsapp_editorial_materialize.py --self-test

      - name: Materialize canonical WhatsApp editorial outbox
        run: python valcea-clar/social/whatsapp_editorial_materialize.py | tee /tmp/whatsapp-editorial-materialize.json

      - name: Validate one-message budget and native differentiation
        run: |
          python - <<'PY'
          import difflib
          import json
          import re
          from pathlib import Path

          outbox = json.loads(Path('valcea-clar/social/whatsapp_outbox.json').read_text(encoding='utf-8'))
          state = json.loads(Path('valcea-clar/social/whatsapp_state.json').read_text(encoding='utf-8'))
          presence = json.loads(Path('valcea-clar/social/whatsapp_channel_presence.json').read_text(encoding='utf-8'))
          telegram = json.loads(Path('valcea-clar/social/telegram_outbox.json').read_text(encoding='utf-8'))
          result = json.loads(Path('/tmp/whatsapp-editorial-materialize.json').read_text(encoding='utf-8'))

          items = {
              str(item.get('story_id')): item
              for item in outbox.get('items', [])
              if isinstance(item, dict) and item.get('story_id')
          }
          tg = {
              str(item.get('story_id')): item
              for item in telegram.get('items', [])
              if isinstance(item, dict) and item.get('story_id')
          }

          if outbox.get('platform') != 'whatsapp' or outbox.get('editorial_product_version') != 'whatsapp-editorial-v1.1':
              raise SystemExit('WhatsApp canonical editorial outbox version mismatch')
          if state.get('editorial_product_version') != 'whatsapp-editorial-v1.1':
              raise SystemExit('WhatsApp canonical state version mismatch')
          if outbox.get('interruption_budget_per_cycle') != 1 or state.get('interruption_budget_per_cycle') != 1:
              raise SystemExit('WhatsApp interruption budget is not executable')
          if state.get('direct_publication_enabled') is not False:
              raise SystemExit('WhatsApp state falsely claims direct publication')
          if state.get('direct_publication_blocker') != 'whatsapp_verified_access_and_recipient_scope_not_configured':
              raise SystemExit('WhatsApp backward-compatible direct-messaging blocker missing')

          presence_url = str(presence.get('url') or '')
          if presence.get('status') != 'active' or not presence_url:
              raise SystemExit('WhatsApp public Channel presence is not canonical')
          public_channel = state.get('public_channel') or {}
          if public_channel.get('active') is not True or public_channel.get('url') != presence_url:
              raise SystemExit('WhatsApp public Channel is not projected into runtime state')
          if public_channel.get('direct_publication_enabled') is not False:
              raise SystemExit('WhatsApp public Channel falsely claims verified direct automation')

          expected_policy = 'highest_public_utility_and_urgency_then_editorial_priority_then_story_id'
          if outbox.get('selection_policy') != expected_policy:
              raise SystemExit('WhatsApp utility-first selection policy missing from outbox')
          if state.get('selection_policy') != expected_policy or result.get('selection_policy') != expected_policy:
              raise SystemExit('WhatsApp selection policy drifted across materialized state')

          ready = [item for item in items.values() if item.get('status') == 'outbox_ready']
          ready_ids = sorted(str(item.get('story_id')) for item in ready)
          selected = sorted(str(value) for value in (outbox.get('active_selected_story_ids') or []))
          state_selected = sorted(str(value) for value in (state.get('active_selected_story_ids') or []))
          result_selected = sorted(str(value) for value in (result.get('selected_story_ids') or []))

          if len(ready) > 1 or len(selected) > 1 or int(result.get('ready') or 0) > 1:
              raise SystemExit(f'WhatsApp interruption budget exceeded: ready={len(ready)} selected={len(selected)}')
          if int(result.get('ready') or 0) != len(ready):
              raise SystemExit('WhatsApp materializer ready count disagrees with canonical outbox')
          if selected != ready_ids:
              raise SystemExit(f'WhatsApp selected IDs disagree with READY items: selected={selected} ready={ready_ids}')
          if selected != state_selected or selected != result_selected:
              raise SystemExit(
                  f'WhatsApp selection drift across outbox/state/result: outbox={selected} state={state_selected} result={result_selected}'
              )

          def normalize(value):
              value = re.sub(r'https://\S+', '', str(value).lower())
              value = re.sub(r'[^a-z0-9ăâîșț ]+', ' ', value)
              return ' '.join(value.split())

          for story_id, item in items.items():
              status = item.get('status')
              is_selected = story_id in selected
              if bool(item.get('selected_for_cycle')) != is_selected:
                  raise SystemExit(f'WhatsApp selected_for_cycle drift for {story_id}')
              if status == 'outbox_ready':
                  if item.get('selection_rank') != 1:
                      raise SystemExit(f'WhatsApp selected item must have rank 1: {story_id}')
                  if item.get('recipient_scope_required_before_dispatch') is not True:
                      raise SystemExit('WhatsApp recipient-scope compatibility gate missing')
                  if item.get('low_frequency') is not True or item.get('interruption_budget_per_cycle') != 1:
                      raise SystemExit('WhatsApp low-frequency invariant missing')
                  if item.get('verbatim_cross_platform_reuse_allowed') is not False:
                      raise SystemExit('WhatsApp cross-platform reuse guard missing')
                  if item.get('fake_urgency_forbidden') is not True:
                      raise SystemExit('WhatsApp fake-urgency guard missing')
                  message = str(item.get('message') or '')
                  if len(message) > 700:
                      raise SystemExit('WhatsApp message budget exceeded')
                  if '•' in message:
                      raise SystemExit('WhatsApp copied Telegram bullet-list presentation')
                  sibling = tg.get(story_id) or {}
                  tg_text = str(sibling.get('message') or '')
                  if tg_text:
                      similarity = difflib.SequenceMatcher(None, normalize(message), normalize(tg_text)).ratio()
                      if similarity >= 0.88:
                          raise SystemExit(f'WhatsApp is too close to Telegram copy for {story_id}: similarity={similarity:.3f}')
              elif is_selected:
                  raise SystemExit(f'WhatsApp selected item is not READY: {story_id}')

          print(
              f"WhatsApp editorial v1.1: PASS ({len(items)} durable products; "
              f"{len(ready)} selected interruption; public Channel active)"
          )
          PY

      - name: Persist WhatsApp editorial state conflict-safe
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          rm -rf /tmp/whatsapp-editorial-state
          mkdir -p /tmp/whatsapp-editorial-state/valcea-clar/social
          cp valcea-clar/social/whatsapp_outbox.json /tmp/whatsapp-editorial-state/valcea-clar/social/whatsapp_outbox.json
          cp valcea-clar/social/whatsapp_state.json /tmp/whatsapp-editorial-state/valcea-clar/social/whatsapp_state.json
          git config user.name "valcea-clar-whatsapp-engine[bot]"
          git config user.email "valcea-clar-whatsapp-engine@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/whatsapp-editorial-state/valcea-clar/social/whatsapp_outbox.json valcea-clar/social/whatsapp_outbox.json
            cp /tmp/whatsapp-editorial-state/valcea-clar/social/whatsapp_state.json valcea-clar/social/whatsapp_state.json
            git add valcea-clar/social/whatsapp_outbox.json valcea-clar/social/whatsapp_state.json
            if git diff --cached --quiet; then
              echo "No WhatsApp editorial changes to persist."
              exit 0
            fi
            git commit -m "Persist VÂLCEA CLAR WhatsApp editorial outbox"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload WhatsApp editorial audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-whatsapp-editorial-v1-1-${{ github.run_id }}
          path: |
            /tmp/whatsapp-editorial-materialize.json
            valcea-clar/social/whatsapp_channel_presence.json
            valcea-clar/social/whatsapp_outbox.json
            valcea-clar/social/whatsapp_state.json
          if-no-files-found: warn
          retention-days: 14
