name: TEMP PARTENER Ask provenance QA

on:
  push:
    branches: [partener/frontend-ask-provenance-20260819-1142]
    paths:
      - 'partener-eu/web/ask-partener-v2.js'
      - 'partener-eu/ops/test_public_product_v3.py'
      - '.github/workflows/tmp-partener-ask-provenance-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check partener-eu/web/home-novice-v1.js
          node --check partener-eu/web/public-product-v3.js
          node --check partener-eu/web/people-policy-v1.js
          node --check partener-eu/web/ask-partener-v2.js
      - name: Public product and Ask contracts
        run: |
          python partener-eu/ops/test_home_novice.py
          python partener-eu/ops/test_public_product_v3.py
          python partener-eu/ops/test_ask_partener_v2.py
      - name: Persist branch QA receipt
        run: |
          printf 'PASS\nhead=%s\nchecked=%s\n' "$GITHUB_SHA" "ask-partener-v2.js test_public_product_v3.py" > partener-eu/.qa-ask-provenance-branch
          git config user.name "civora-qa-bot"
          git config user.email "civora-qa-bot@users.noreply.github.com"
          git add partener-eu/.qa-ask-provenance-branch
          git commit -m "ci: record PARTENER Ask provenance QA"
          git push origin HEAD:${GITHUB_REF_NAME}
