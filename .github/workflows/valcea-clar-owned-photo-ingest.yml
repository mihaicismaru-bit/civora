name: VÂLCEA CLAR Owned Photo Drive Ingest

# CI validates the fail-closed owned-photo contract. Live connected-Drive
# discovery/semantic ingest is handled by the bounded hourly operator bridge;
# native GitHub Drive credentials remain an optional future runtime path.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/social/owned_photo_drive_config.json'
      - 'valcea-clar/social/owned_photo_drive_snapshot.json'
      - 'valcea-clar/social/owned_photo_registry.json'
      - 'valcea-clar/social/owned_photo_semantic_labels.json'
      - 'valcea-clar/social/owned_photo_semantic_auto_policy.json'
      - 'valcea-clar/social/owned_photo_live_acceptance.json'
      - 'valcea-clar/social/owned_photo_semantic_registry.py'
      - 'valcea-clar/social/owned_photo_match_policy.json'
      - 'valcea-clar/social/owned_photo_story_candidates.json'
      - 'valcea-clar/social/owned_photo_materialization_requests.json'
      - 'valcea-clar/social/drive_owned_photo_ingest.py'
      - 'valcea-clar/social/owned_photo_story_matcher.py'
      - 'valcea-clar/social/materialize_owned_photo_story.py'
      - 'valcea-clar/site/story_archive.json'
      - 'valcea-clar/social/story_visuals.json'
      - '.github/workflows/valcea-clar-owned-photo-ingest.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-owned-photo-drive-ingest-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VALCEA_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VALCEA_DRIVE_SERVICE_ACCOUNT_JSON }}
      VALCEA_DRIVE_BEARER_TOKEN: ${{ secrets.VALCEA_DRIVE_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate semantic auto-ingest policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('valcea-clar/social/owned_photo_semantic_auto_policy.json').read_text(encoding='utf-8'))
          assert p['enabled'] is True
          assert p['publication_authority'] == 'NONE'
          assert p['story_assignment_authority'] == 'NONE'
          assert p['source_inbox_category'] == '00_INBOX_NEW_PHOTOS'
          assert float(p['auto_confirm_threshold']) >= 0.95
          policy=p['policy']
          required=(
              'visual_review_required',
              'exact_entity_requires_independent_anchor',
              'exact_place_requires_location_or_landmark_anchor',
              'person_identity_inference_forbidden',
              'biometric_identification_forbidden',
              'people_may_only_set_privacy_flags',
              'story_event_identity_inference_forbidden',
              'semantic_identity_does_not_imply_story_subject_match',
              'auto_confirmed_assets_remain_candidate_only',
              'auto_move_confirmed_asset_to_curated_category',
              'ambiguous_assets_stay_in_inbox',
              'ambiguous_assets_never_enter_story_matching',
              'delete_on_reject_forbidden',
              'no_photo_is_better_than_false_relevance',
          )
          for key in required:
              assert policy[key] is True, key
          assert len(p['allowed_target_categories']) == 7
          fallback=p['ambiguous_fallback']
          assert fallback['category'] == '00_INBOX_NEW_PHOTOS'
          assert fallback['publication_authority'] == 'NONE'
          assert fallback['subject_match'] is False
          assert fallback['editor_approved'] is False
          assert fallback['publication_eligible'] is False
          print({'status':'PASS','auto_confirm_threshold':p['auto_confirm_threshold']})
          PY

      - name: Validate controlled live data-plane acceptance receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('valcea-clar/social/owned_photo_live_acceptance.json').read_text(encoding='utf-8'))
          assert r['publication_authority'] == 'NONE'
          assert r['result'] == 'PASS_DATA_PLANE'
          assert r['mode'] == 'connected_runtime_controlled_canary'
          assert r['scheduler_result'] in {'ARMED_NOT_YET_OBSERVED','PASS_SCHEDULED_RUN'}
          c=r['canary']
          assert c['source_file_id'] != c['canary_file_id']
          assert c['ingest_folder_id']
          assert c['target_category'] == '05_UNDE_IESIM'
          assert c['semantic_scope'] == 'exact_entity'
          assert float(c['semantic_confidence']) >= 0.95
          assert c['story_subject_match'] is False
          assert c['editor_approved'] is False
          assert c['publication_eligible'] is False
          assert 'visible_signage' in c['evidence']
          required_steps={
              'copy_created_unique_drive_file_id_in_00_inbox',
              'inbox_listing_detected_canary',
              'raw_jpeg_fetch_succeeded',
              'visual_semantic_identity_confirmed',
              'bounded_parent_move_to_curated_category_succeeded',
              'test_canary_deleted_after_acceptance',
              'inbox_verified_empty_after_cleanup',
              'target_category_verified_back_to_original_five_assets',
          }
          assert required_steps <= set(r['observed_steps'])
          assert all(r['safety_assertions'].values())
          post=r['postconditions']
          assert post['live_owned_photo_count'] == 48
          assert post['inbox_count'] == 0
          assert post['05_UNDE_IESIM_count'] == 5
          assert post['original_source_file_present'] is True
          print({'status':'PASS','result':r['result'],'scheduler_result':r['scheduler_result']})
          PY

      - name: Validate owned-photo ingest, semantics, matching and materialization gate offline
        run: |
          set -euo pipefail
          python -m py_compile \
            valcea-clar/social/drive_owned_photo_ingest.py \
            valcea-clar/social/owned_photo_semantic_registry.py \
            valcea-clar/social/owned_photo_story_matcher.py \
            valcea-clar/social/materialize_owned_photo_story.py
          python valcea-clar/social/drive_owned_photo_ingest.py --self-test
          python valcea-clar/social/owned_photo_semantic_registry.py --self-test
          python valcea-clar/social/owned_photo_story_matcher.py --self-test
          python valcea-clar/social/materialize_owned_photo_story.py --self-test
          python valcea-clar/social/drive_owned_photo_ingest.py --from-snapshot
          python valcea-clar/social/drive_owned_photo_ingest.py --validate-only
          python valcea-clar/social/owned_photo_semantic_registry.py --write
          python valcea-clar/social/owned_photo_story_matcher.py
          python valcea-clar/social/owned_photo_story_matcher.py --validate-only
          python valcea-clar/social/materialize_owned_photo_story.py --validate-only

      - name: Detect optional native Drive credential
        id: credential
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -n "${VALCEA_DRIVE_SERVICE_ACCOUNT_JSON:-}" || -n "${VALCEA_DRIVE_BEARER_TOKEN:-}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Native GitHub Drive credential absent; connected hourly bridge remains the live discovery path.'
          fi

      - name: Install service-account authentication dependency
        if: github.event_name != 'pull_request' && steps.credential.outputs.configured == 'true' && env.VALCEA_DRIVE_SERVICE_ACCOUNT_JSON != ''
        run: python -m pip install --disable-pip-version-check google-auth==2.40.3

      - name: Probe live inventory with optional native credential
        if: github.event_name != 'pull_request' && steps.credential.outputs.configured == 'true'
        run: |
          set -euo pipefail
          python valcea-clar/social/drive_owned_photo_ingest.py
          python valcea-clar/social/drive_owned_photo_ingest.py --validate-only
          # Any newly discovered image without a semantic label must fail here;
          # native runtime does not invent image meaning without visual review.
          python valcea-clar/social/owned_photo_semantic_registry.py --write
          python valcea-clar/social/owned_photo_story_matcher.py
          python valcea-clar/social/owned_photo_story_matcher.py --validate-only
          python valcea-clar/social/materialize_owned_photo_story.py --validate-only

      - name: Enforce candidate-only and semantic identity contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('valcea-clar/social/owned_photo_registry.json').read_text(encoding='utf-8'))
          semantic=json.loads(Path('valcea-clar/social/owned_photo_semantic_registry.json').read_text(encoding='utf-8'))
          ambiguous=json.loads(Path('valcea-clar/social/owned_photo_ambiguous_review_queue.json').read_text(encoding='utf-8'))
          queue=json.loads(Path('valcea-clar/social/owned_photo_story_candidates.json').read_text(encoding='utf-8'))
          requests=json.loads(Path('valcea-clar/social/owned_photo_materialization_requests.json').read_text(encoding='utf-8'))

          assert registry['publication_authority'] == 'NONE'
          assert registry['candidate_only'] is True
          assert registry['automatic_story_assignment_forbidden'] is True
          for asset in registry['assets']:
              assert asset['kind'] == 'photograph'
              assert asset['synthetic'] is False
              assert asset['subject_match'] is False
              assert asset['editor_approved'] is False
              assert asset['publication_eligible'] is False
              assert asset['publication_authority'] == 'NONE'

          assert semantic['publication_authority'] == 'NONE'
          assert semantic['automatic_story_assignment_allowed'] is False
          assert semantic['semantic_label_is_not_story_assignment'] is True
          assert semantic['story_subject_match_inherited_from_semantics'] is False
          summary=semantic['summary']
          assert summary['asset_count'] == registry['summary']['asset_count']
          assert summary['confirmed'] + summary['ambiguous'] + summary['rejected'] == summary['asset_count']
          # Preserve the fully-confirmed curated bootstrap while allowing future
          # unknown inbox photos to remain ambiguous/fail-closed.
          assert summary['confirmed'] >= 48
          assert ambiguous['summary']['ambiguous_count'] == summary['ambiguous']
          assert len(ambiguous['items']) == summary['ambiguous']
          semantic_ids=set()
          for asset in semantic['assets']:
              assert asset['drive_file_id'] not in semantic_ids
              semantic_ids.add(asset['drive_file_id'])
              if asset['review_status'] == 'confirmed':
                  assert asset['semantic_confidence'] >= 0.85
              elif asset['review_status'] == 'ambiguous':
                  assert asset['semantic_scope'] == 'ambiguous_entity'
                  assert asset['category'] == '00_INBOX_NEW_PHOTOS'
              assert asset['rights_basis'] == 'owned_by_valcea_clar'
              assert asset['subject_match'] is False
              assert asset['editor_approved'] is False
              assert asset['publication_eligible'] is False
              assert asset['publication_authority'] == 'NONE'
              assert asset['automatic_story_assignment'] is False
              assert 'visual_review' in asset['evidence']
          assert semantic_ids == {asset['drive_file_id'] for asset in registry['assets']}

          assert queue['publication_authority'] == 'NONE'
          assert queue['candidate_only'] is True
          assert queue['automatic_story_assignment_forbidden'] is True
          assert queue['category_match_is_not_subject_match'] is True
          assert queue.get('semantic_match_is_not_subject_match', True) is True
          for story in queue['stories'].values():
              assert story['automatic_story_assignment'] is False
              assert story['publication_authority'] == 'NONE'
              for candidate in story['candidates']:
                  assert candidate['subject_match'] is False
                  assert candidate['editor_approved'] is False
                  assert candidate['publication_eligible'] is False
                  assert candidate['publication_authority'] == 'NONE'
                  assert candidate['requires_visual_confirmation'] is True
                  assert candidate['rights_reconfirmation_required'] is True

          assert requests['publication_authority'] == 'EXPLICIT_EDITOR_REQUEST_ONLY'
          assert requests['automatic_materialization_allowed'] is False
          assert requests['automatic_story_assignment_allowed'] is False
          print({
              'status':'PASS',
              'asset_count':registry['summary']['asset_count'],
              'semantic_summary':summary,
              'ambiguous_count':ambiguous['summary']['ambiguous_count'],
              'story_candidate_summary':queue['summary'],
              'active_materialization_requests':sum(
                  1 for row in requests['requests']
                  if isinstance(row,dict) and row.get('status')=='approved_for_materialization'
              ),
          })
          PY

      - name: Confirm CI has no autonomous main-write path
        run: |
          echo 'PASS: this workflow has contents:read and performs validation/probing only.'
