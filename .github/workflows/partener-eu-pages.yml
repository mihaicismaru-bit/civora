name: PARTENER.EU Pages
on:
  push:
    branches: [main]
    paths:
      - 'partener-eu/web/**'
      - '.github/workflows/partener-eu-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: partener-eu/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p partener-eu/deployment
          python - <<'PY'
          import json, os, datetime
          with open('partener-eu/deployment/latest.json','w',encoding='utf-8') as f:
              json.dump({
                  'status':'LIVE',
                  'page_url':os.environ['PAGE_URL'],
                  'deployed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'git_sha':os.environ.get('GITHUB_SHA')
              },f,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partener-eu/deployment/latest.json
          git diff --cached --quiet || git commit -m 'Record PARTENER.EU Pages deployment'
          git push
