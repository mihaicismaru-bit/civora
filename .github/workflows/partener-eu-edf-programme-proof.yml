name: PARTENER.EU EDF Programme Intelligence Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eu_direct_edf_programme_intelligence_registry.json'
      - 'partener-eu/ingest/eu_direct_edf_programme_intelligence.py'
      - 'partener-eu/ingest/eu_direct_edf_programme_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_edf_programme_intelligence.py'
      - 'partener-eu/ops/test_eu_direct_edf_programme_reconcile.py'
      - 'partener-eu/ops/run_edf_programme_canonical.py'
      - '.github/workflows/partener-eu-edf-programme-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  edf-programme-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile EDF canonical programme lane
        run: |
          python -m json.tool partener-eu/ingest/eu_direct_edf_programme_intelligence_registry.json >/dev/null
          python -m py_compile \
            partener-eu/ingest/eu_direct_edf_programme_intelligence.py \
            partener-eu/ingest/eu_direct_edf_programme_reconcile.py \
            partener-eu/ops/test_eu_direct_edf_programme_intelligence.py \
            partener-eu/ops/test_eu_direct_edf_programme_reconcile.py \
            partener-eu/ops/run_edf_programme_canonical.py

      - name: Validate fail-closed EDF programme semantics and reconciliation
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: |
          python partener-eu/ops/test_eu_direct_edf_programme_intelligence.py
          python partener-eu/ops/test_eu_direct_edf_programme_reconcile.py -v

      - name: Run canonical EDF programme intelligence with history and LKG
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EDF_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-edf-proof
        run: python partener-eu/ops/run_edf_programme_canonical.py

      - name: Upload bounded EDF replay proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-edf-programme-proof-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: /tmp/partener-eu-eu-direct-programme-intelligence/edf-programme
          if-no-files-found: error
          retention-days: 7
