name: PARTENER.EU MIPE Fixer Idempotence Proof

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/partener-cleanup-phase6-fixer-proof-20260822'
    paths:
      - 'partener-eu/ingest/mipe_resilient_ingest.py'
      - 'partener-eu/ops/fix_mipe_*.py'
      - 'partener-eu/ops/audit_mipe_fixer_idempotence.py'
      - '.github/workflows/partener-eu-mipe-fixer-idempotence.yml'
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/ingest/mipe_resilient_ingest.py'
      - 'partener-eu/ops/fix_mipe_*.py'
      - 'partener-eu/ops/audit_mipe_fixer_idempotence.py'
      - '.github/workflows/partener-eu-mipe-fixer-idempotence.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-mipe-fixer-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile proof tool
        run: python -m py_compile partener-eu/ops/audit_mipe_fixer_idempotence.py
      - name: Prove fixer idempotence and source restoration
        run: python partener-eu/ops/audit_mipe_fixer_idempotence.py
      - name: Enforce immutable-source contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('partener-eu/ops/mipe_fixer_idempotence.json').read_text(encoding='utf-8'))
          assert p['status']=='PASS', p
          assert p['beforeSha256']==p['afterSha256'], p
          assert p['mutated'] is False, p
          assert p['restorationVerified'] is True, p
          assert p['allFixersRan'] is True, p
          print('MIPE fixer idempotence: PASS', p['beforeSha256'])
          PY
      - name: Persist proof to cleanup branch
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name 'partener-cleanup-audit[bot]'
          git config user.email 'partener-cleanup-audit@users.noreply.github.com'
          git add partener-eu/ops/mipe_fixer_idempotence.json
          if git diff --cached --quiet; then
            echo 'Fixer proof unchanged.'
            exit 0
          fi
          git commit -m 'PARTENER cleanup: persist MIPE fixer idempotence proof'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: partener-mipe-fixer-idempotence
          path: partener-eu/ops/mipe_fixer_idempotence.json
          if-no-files-found: error
