name: VÂLCEA CLAR ISU Preventive Information

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/isu_valcea_preventive_info_signal_adapter.py'
      - '.github/workflows/valcea-clar-isu-preventive-info.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/isu_valcea_preventive_info_signal_adapter.py'
      - '.github/workflows/valcea-clar-isu-preventive-info.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-isu-preventive-info-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile ISU Vâlcea preventive-information adapter
        run: python -m py_compile valcea-clar/scripts/isu_valcea_preventive_info_signal_adapter.py
      - name: Run ISU Vâlcea fail-closed preventive-information regressions
        run: python valcea-clar/scripts/isu_valcea_preventive_info_signal_adapter.py --self-test
