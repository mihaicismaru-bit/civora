name: CIVORA Scope Drift

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "local-news-os/**"
      - "valcea-clar/**"
      - ".github/workflows/local-news-os-*.yml"
      - ".github/workflows/valcea-clar-*.yml"
      - ".github/workflows/civora-scope-drift.yml"
      - ".github/workflows/civora-persistence-reconciliation.yml"

permissions:
  contents: read
  statuses: write

# Preserve exact-head evidence: a later scheduled observer must never cancel the
# read-only fingerprint run for an earlier main head.
concurrency:
  group: civora-scope-drift-${{ github.sha }}
  cancel-in-progress: false

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compute current CIVORA scope fingerprint
        run: |
          python local-news-os/core/repository_scope_fingerprint.py \
            --ref "$GITHUB_SHA" \
            --output /tmp/civora-scope-current.json
          cat /tmp/civora-scope-current.json
      - name: Classify this push when a prior head exists
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python local-news-os/core/repository_scope_fingerprint.py \
            --base-ref "$BEFORE_SHA" \
            --ref "$GITHUB_SHA" \
            --output /tmp/civora-scope-compare.json
          cat /tmp/civora-scope-compare.json
      - name: Upload scope evidence
        uses: actions/upload-artifact@v7
        with:
          name: civora-scope-drift-${{ github.run_id }}
          path: |
            /tmp/civora-scope-current.json
            /tmp/civora-scope-compare.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish exact-head scope status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -o /dev/null \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"civora/scope-drift\",\"description\":\"Exact-head CIVORA scope evidence passed\",\"target_url\":\"${RUN_URL}\"}"
