name: LOCAL NEWS OS Reread Spend Reservation Recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/social/reread_spend_reservation_recovery.py"
      - "local-news-os/social/reread_spend_reauthorization.py"
      - "local-news-os/social/fleet_metrics_authorization_seal_with_reread_spend.py"
      - "local-news-os/social/authorization_sealed_harvest_receipt.py"
      - "local-news-os/social/test_reread_spend_reservation_recovery.py"
      - "local-news-os/social/test_reread_spend_reauthorization.py"
      - "local-news-os/social/test_reread_attempt_provenance_binding.py"
      - ".github/workflows/local-news-os-reread-spend-reservation-recovery.yml"
      - ".github/workflows/valcea-clar-observed-metrics-harvest.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/social/reread_spend_reservation_recovery.py"
      - "local-news-os/social/reread_spend_reauthorization.py"
      - "local-news-os/social/fleet_metrics_authorization_seal_with_reread_spend.py"
      - "local-news-os/social/authorization_sealed_harvest_receipt.py"
      - "local-news-os/social/test_reread_spend_reservation_recovery.py"
      - "local-news-os/social/test_reread_spend_reauthorization.py"
      - "local-news-os/social/test_reread_attempt_provenance_binding.py"
      - ".github/workflows/local-news-os-reread-spend-reservation-recovery.yml"
      - ".github/workflows/valcea-clar-observed-metrics-harvest.yml"

permissions:
  contents: read

concurrency:
  group: local-news-os-reread-spend-reservation-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile RESERVED spend recovery boundary
        run: |
          python -m py_compile \
            local-news-os/social/reread_spend_reservation_recovery.py \
            local-news-os/social/reread_spend_reauthorization.py \
            local-news-os/social/fleet_metrics_authorization_seal_with_reread_spend.py \
            local-news-os/social/authorization_sealed_harvest_receipt.py \
            local-news-os/social/test_reread_spend_reservation_recovery.py

      - name: Run RESERVED spend recovery acceptance
        working-directory: local-news-os/social
        run: python test_reread_spend_reservation_recovery.py

      - name: Run reread spend regression
        working-directory: local-news-os/social
        run: python test_reread_spend_reauthorization.py

      - name: Run reread attempt provenance regression
        working-directory: local-news-os/social
        run: python test_reread_attempt_provenance_binding.py

      - name: Verify recovery remains receipt-only, secret-free and zero-paid
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'local-news-os/social')
          import reread_spend_reauthorization as spend
          spend.install()
          import reread_spend_reservation_recovery as recovery
          recovery.install()
          guards = recovery.recovery_guards()
          required = {
              'reserved_release_requires_expired_claimed_receipt': True,
              'active_lease_release_allowed': False,
              'network_start_receipt_forces_spent': True,
              'ambiguous_reservation_release_allowed': False,
              'release_evidence_persisted_before_reservation_removal': True,
              'reservation_removal_compare_and_swap': True,
              'provider_network_call_performed_by_recovery': False,
              'credential_values_read': False,
              'credential_values_persisted': False,
              'provider_payload_persisted': False,
              'publication_blocked_by_analytics': False,
              'zero_paid_dependency': True,
          }
          for key, expected in required.items():
              if guards.get(key) is not expected:
                  raise SystemExit(f'reservation recovery guard mismatch: {key}={guards.get(key)!r}')
          print('REREAD_SPEND_RESERVATION_RECOVERY_GUARDS_PASS')
          PY
