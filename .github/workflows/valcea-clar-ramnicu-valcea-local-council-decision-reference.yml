name: VÂLCEA CLAR Râmnicu Vâlcea Local Council Decision References

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/ramnicu_valcea_local_council_decision_reference_adapter.py'
      - '.github/workflows/valcea-clar-ramnicu-valcea-local-council-decision-reference.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/ramnicu_valcea_local_council_decision_reference_adapter.py'
      - '.github/workflows/valcea-clar-ramnicu-valcea-local-council-decision-reference.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-ramnicu-valcea-local-council-decision-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile Râmnicu Vâlcea Local Council decision reference adapter
        run: python -m py_compile valcea-clar/scripts/ramnicu_valcea_local_council_decision_reference_adapter.py
      - name: Run Râmnicu Vâlcea Local Council decision fail-closed regressions
        run: python valcea-clar/scripts/ramnicu_valcea_local_council_decision_reference_adapter.py --self-test
