name: PARTENER.EU Verified Source Registry

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/ingest/source_registry.json'
      - 'partener-eu/ingest/source_registry_probe.py'
      - 'partener-eu/ingest/data_plane_contract.json'
      - 'partener-eu/ingest/interreg_programming_intelligence.py'
      - 'partener-eu/ingest/interreg_programming_live_fetch.py'
      - 'partener-eu/ingest/interreg_call.py'
      - 'partener-eu/ingest/interreg_call_live_fetch.py'
      - 'partener-eu/ops/test_source_registry_low_info.py'
      - 'partener-eu/ops/test_source_registry_alias_fallback.py'
      - 'partener-eu/ops/test_source_registry_external_expansion.py'
      - 'partener-eu/ops/test_interreg_programming_intelligence.py'
      - 'partener-eu/ops/test_interreg_programming_live_fetch.py'
      - 'partener-eu/ops/test_interreg_call.py'
      - 'partener-eu/ops/test_interreg_call_live_fetch.py'
      - '.github/workflows/partener-eu-source-registry.yml'
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/source_registry.json'
      - 'partener-eu/ingest/source_registry_probe.py'
      - 'partener-eu/ingest/data_plane_contract.json'
      - 'partener-eu/ingest/interreg_programming_intelligence.py'
      - 'partener-eu/ingest/interreg_programming_live_fetch.py'
      - 'partener-eu/ingest/interreg_call.py'
      - 'partener-eu/ingest/interreg_call_live_fetch.py'
      - 'partener-eu/ops/test_source_registry_low_info.py'
      - 'partener-eu/ops/test_source_registry_alias_fallback.py'
      - 'partener-eu/ops/test_source_registry_external_expansion.py'
      - 'partener-eu/ops/test_interreg_programming_intelligence.py'
      - 'partener-eu/ops/test_interreg_programming_live_fetch.py'
      - 'partener-eu/ops/test_interreg_call.py'
      - 'partener-eu/ops/test_interreg_call_live_fetch.py'
      - '.github/workflows/partener-eu-source-registry.yml'
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: write

concurrency:
  group: partener-eu-source-registry
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout is exact event head
        id: exact-head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "FAIL checkout drift: expected $EXPECTED_SHA got $ACTUAL_SHA" >&2
            exit 2
          fi
          echo "Exact event head verified: $ACTUAL_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Regression — low-information HTML shells fail closed
        run: python partener-eu/ops/test_source_registry_low_info.py

      - name: Regression — declared official aliases are transport-only fallbacks
        run: python partener-eu/ops/test_source_registry_alias_fallback.py

      - name: Regression — external source and future-programming taxonomy stays fail-closed
        run: python partener-eu/ops/test_source_registry_external_expansion.py

      - name: Regression — Interreg programming dates override stale open copy
        run: python partener-eu/ops/test_interreg_programming_intelligence.py

      - name: Regression — live Interreg programming evidence remains non-authorizing
        run: python partener-eu/ops/test_interreg_programming_live_fetch.py

      - name: Regression — Interreg exact-call proof stays fail-closed
        run: python partener-eu/ops/test_interreg_call.py

      - name: Regression — live Interreg exact-call evidence stays bounded and fail-closed
        run: python partener-eu/ops/test_interreg_call_live_fetch.py

      - name: Probe classified official sources without changing facts
        run: python partener-eu/ingest/source_registry_probe.py

      - name: Capture live Interreg programming evidence without changing facts
        run: |
          python partener-eu/ingest/interreg_programming_live_fetch.py \
            --out /tmp/interreg-programming-live-evidence.json \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Validate live Interreg programming receipt stays fail-closed
        run: |
          python - <<'PY'
          import json, sys
          p='/tmp/interreg-programming-live-evidence.json'
          d=json.load(open(p, encoding='utf-8'))
          if d.get('publication_effect') != 'NONE' or d.get('canonical_corpus_mutation') is not False or d.get('publish_authorized') is not False:
              print('FAIL unsafe Interreg programming envelope')
              sys.exit(2)
          rows={row.get('source_id'): row for row in d.get('rows', [])}
          rohu=rows.get('SRC-INTERREG-ROHU')
          if not rohu or rohu.get('fetch_status') != 'PASS':
              print('FAIL current official Romania-Hungary programme page was not read successfully')
              sys.exit(2)
          obs=rohu.get('normalized') or {}
          if obs.get('observation_state') != 'CONSULTATION_CLOSED' or obs.get('consultation_end') != '2026-08-01':
              print('FAIL Romania-Hungary programming dates did not override stale open copy:', obs)
              sys.exit(2)
          if obs.get('not_a_call') is not True or obs.get('open_call_authorized') is not False or obs.get('publish_authorized') is not False:
              print('FAIL Romania-Hungary programming observation became authorizing:', obs)
              sys.exit(2)

          romd=rows.get('SRC-INTERREG-ROMD-2028-2034')
          if not romd:
              print('FAIL Romania-Moldova 2028-2034 programming source missing from live evidence')
              sys.exit(2)
          if romd.get('publication_effect') != 'NONE' or romd.get('publish_authorized') is not False or romd.get('material_fact_use') is not False:
              print('FAIL Romania-Moldova transport/evidence row became authorizing:', romd)
              sys.exit(2)
          romd_state='FETCH_FAILED'
          if romd.get('fetch_status') == 'PASS':
              romd_obs=romd.get('normalized') or {}
              if romd_obs.get('programme_family') != 'Interreg Romania-Republic of Moldova 2028-2034':
                  print('FAIL Romania-Moldova programme identity drift:', romd_obs)
                  sys.exit(2)
              if romd_obs.get('observation_state') == 'OPEN_CALL' or romd_obs.get('not_a_call') is not True or romd_obs.get('open_call_authorized') is not False or romd_obs.get('publish_authorized') is not False:
                  print('FAIL Romania-Moldova programming observation became authorizing:', romd_obs)
                  sys.exit(2)
              romd_state=romd_obs.get('observation_state')
          elif romd.get('fetch_status') == 'FAIL':
              if not romd.get('error_type') or romd.get('normalized'):
                  print('FAIL Romania-Moldova transport failure is not explicit/fail-closed:', romd)
                  sys.exit(2)
          else:
              print('FAIL Romania-Moldova has invalid live fetch state:', romd)
              sys.exit(2)
          print(json.dumps({'summary': d.get('observation_states', {}), 'rohu_state': obs.get('observation_state'), 'rohu_end': obs.get('consultation_end'), 'romd_state': romd_state}, ensure_ascii=False))
          PY

      - name: Upload bounded Interreg programming evidence
        uses: actions/upload-artifact@v4
        with:
          name: partener-interreg-programming-live-evidence
          path: /tmp/interreg-programming-live-evidence.json
          retention-days: 7
          if-no-files-found: error

      - name: Capture live Interreg exact-call evidence without changing facts
        run: |
          python partener-eu/ingest/interreg_call_live_fetch.py \
            --out /tmp/interreg-call-live-evidence.json \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Validate live Interreg exact-call receipt stays fail-closed
        run: |
          python - <<'PY'
          import json, sys
          p='/tmp/interreg-call-live-evidence.json'
          d=json.load(open(p, encoding='utf-8'))
          if d.get('publication_effect') != 'NONE' or d.get('canonical_corpus_mutation') is not False or d.get('publish_authorized') is not False:
              print('FAIL unsafe Interreg exact-call envelope')
              sys.exit(2)
          rows=d.get('rows', [])
          if d.get('fetch_pass', 0) < 1:
              print('FAIL no exact official Interreg call page was read successfully')
              sys.exit(2)
          for row in rows:
              if row.get('publish_authorized') is not False or row.get('material_fact_use') is not False:
                  print('FAIL exact-call evidence row became authorizing:', row.get('probe_id'))
                  sys.exit(2)
              obs=row.get('normalized')
              if not obs:
                  continue
              if obs.get('observation_state') == 'OPEN_CALL':
                  print('FAIL historical exact-call control classified OPEN_CALL:', row.get('probe_id'))
                  sys.exit(2)
              if obs.get('publish_authorized') is not False or obs.get('material_fact_use') is not False or obs.get('publication_effect') != 'NONE':
                  print('FAIL exact-call normalized receipt became authorizing:', row.get('probe_id'))
                  sys.exit(2)
              if obs.get('raw_hash') != row.get('raw_hash'):
                  print('FAIL exact-call raw hash detached from receipt:', row.get('probe_id'))
                  sys.exit(2)
          print(json.dumps({'fetch_pass': d.get('fetch_pass'), 'fetch_fail': d.get('fetch_fail'), 'states': d.get('observation_states', {})}, ensure_ascii=False))
          PY

      - name: Upload bounded Interreg exact-call evidence
        uses: actions/upload-artifact@v4
        with:
          name: partener-interreg-call-live-evidence
          path: /tmp/interreg-call-live-evidence.json
          retention-days: 7
          if-no-files-found: error

      - name: Validate fail-closed policy
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p='partener-eu/ingest/state/source_registry_health.json'
          d=json.load(open(p, encoding='utf-8'))
          bad=[]
          missing=[]
          unsafe_shell=[]
          for x in d.get('sources', []):
              if x.get('semantic_hash_changed') and x.get('material_fact_use') and x.get('publish_material_fact_update') is not False:
                  bad.append(x.get('id'))
              if x.get('resolution_task_required'):
                  tp=Path('partener-eu/validation/resolution-tasks') / f"{x.get('id')}.json"
                  if not tp.exists():
                      missing.append(x.get('id'))
              if x.get('quality_issue') == 'LOW_INFORMATION_HTML_SHELL' and (x.get('semantic_hash_changed') or x.get('resolution_task_required')):
                  unsafe_shell.append(x.get('id'))
          if bad or missing or unsafe_shell:
              print('FAIL fail-closed:', {'unsafe': bad, 'missing_tasks': missing, 'unsafe_shells': unsafe_shell})
              sys.exit(2)
          print(json.dumps(d.get('summary', {}), ensure_ascii=False))
          PY

      - name: Persist source health ledger and resolution tasks conflict-safe
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp partener-eu/ingest/state/source_registry_health.json /tmp/source_registry_health.json
          rm -rf /tmp/source-resolution-tasks
          mkdir -p /tmp/source-resolution-tasks
          if [ -d partener-eu/validation/resolution-tasks ]; then
            cp -a partener-eu/validation/resolution-tasks/. /tmp/source-resolution-tasks/
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/source_registry_health.json partener-eu/ingest/state/source_registry_health.json
            mkdir -p partener-eu/validation/resolution-tasks
            cp -a /tmp/source-resolution-tasks/. partener-eu/validation/resolution-tasks/ || true
            python partener-eu/ingest/intelligence_index.py
            git add partener-eu/ingest/state/source_registry_health.json partener-eu/ingest/state/intelligence_index.json partener-eu/validation/resolution-tasks
            if git diff --cached --quiet; then
              echo 'No source-registry health or resolution-task changes.'
              exit 0
            fi
            git commit -m 'Persist verified source registry health and resolution tasks'
            if git push origin HEAD:main; then exit 0; fi
            echo "main advanced during source-registry persistence; retrying ${attempt}/5."
            sleep $((attempt * 2))
          done
          echo 'Unable to persist source-registry outputs after five attempts.' >&2
          exit 1
