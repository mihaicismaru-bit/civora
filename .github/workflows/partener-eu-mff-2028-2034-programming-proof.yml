name: PARTENER.EU MFF 2028-2034 Programming Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eu_direct_mff_2028_2034_programming_registry.json'
      - 'partener-eu/ingest/eu_direct_mff_2028_2034_programming_watch.py'
      - 'partener-eu/ops/test_eu_direct_mff_2028_2034_programming_watch.py'
      - '.github/workflows/partener-eu-mff-2028-2034-programming-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mff-programming-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile registry adapter and regression
        run: |
          python -m json.tool partener-eu/ingest/eu_direct_mff_2028_2034_programming_registry.json >/dev/null
          python -m py_compile \
            partener-eu/ingest/eu_direct_mff_2028_2034_programming_watch.py \
            partener-eu/ops/test_eu_direct_mff_2028_2034_programming_watch.py

      - name: Validate fail-closed programming semantics
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: python partener-eu/ops/test_eu_direct_mff_2028_2034_programming_watch.py

      - name: Prepare replay root
        run: |
          ROOT=/tmp/partener-eu-mff-2028-2034-programming-proof
          rm -rf "$ROOT"
          mkdir -p "$ROOT/current" "$ROOT/previous"

      - name: Restore previous same-branch programming snapshot when inventory-compatible
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, pathlib, urllib.parse, urllib.request, zipfile

          repo=os.environ['REPOSITORY']; branch=os.environ['HEAD_BRANCH']; token=os.environ['GH_TOKEN']
          root=pathlib.Path('/tmp/partener-eu-mff-2028-2034-programming-proof/previous')
          registry=json.loads(pathlib.Path('partener-eu/ingest/eu_direct_mff_2028_2034_programming_registry.json').read_text(encoding='utf-8'))
          current_ids={str(row['source_id']) for row in registry['sources']}
          api=f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=30) as response:
              artifacts=json.load(response).get('artifacts') or []
          prefix='partener-eu-mff-2028-2034-programming-history-'
          chosen=None
          for artifact in artifacts:
              workflow_run=artifact.get('workflow_run') or {}
              if artifact.get('expired') or not str(artifact.get('name') or '').startswith(prefix):
                  continue
              if workflow_run.get('head_branch') != branch:
                  continue
              chosen=artifact
              break

          class StripCrossHostAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  redirected=super().redirect_request(req, fp, code, msg, response_headers, newurl)
                  if redirected is not None:
                      old_host=(urllib.parse.urlparse(req.full_url).hostname or '').casefold()
                      new_host=(urllib.parse.urlparse(newurl).hostname or '').casefold()
                      if old_host != new_host:
                          for name in ('Authorization','Accept','X-GitHub-Api-Version'):
                              redirected.remove_header(name)
                  return redirected

          found=False
          metadata={'artifact_id':chosen.get('id') if chosen else None,'artifact_name':chosen.get('name') if chosen else None,'head_sha':(chosen.get('workflow_run') or {}).get('head_sha') if chosen else None,'head_branch':branch,'inventory_compatible':False,'restore_reason':'NO_PREVIOUS_ARTIFACT'}
          if chosen:
              request=urllib.request.Request(chosen['archive_download_url'], headers=headers)
              opener=urllib.request.build_opener(StripCrossHostAuthRedirect())
              with opener.open(request, timeout=60) as response:
                  payload=response.read()
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  candidate=next((name for name in archive.namelist() if name.endswith('eu-direct-mff-2028-2034-programming-snapshot.json')), None)
                  if candidate:
                      raw=archive.read(candidate)
                      previous=json.loads(raw)
                      previous_ids={str(row.get('source_id') or '') for row in (previous.get('evidence') or [])}
                      metadata['previous_source_ids']=sorted(previous_ids)
                      metadata['current_source_ids']=sorted(current_ids)
                      if previous_ids == current_ids:
                          root.mkdir(parents=True, exist_ok=True)
                          (root/'eu-direct-mff-2028-2034-programming-snapshot.json').write_bytes(raw)
                          found=True
                          metadata['inventory_compatible']=True
                          metadata['restore_reason']='SAME_SOURCE_INVENTORY'
                      else:
                          root.mkdir(parents=True, exist_ok=True)
                          (root/'previous-incompatible-source-inventory.json').write_bytes(raw)
                          metadata['restore_reason']='SOURCE_INVENTORY_CHANGED_BASELINE_REQUIRED'
                  else:
                      metadata['restore_reason']='ARTIFACT_WITHOUT_MFF_SNAPSHOT'
          root.mkdir(parents=True, exist_ok=True)
          (root/'restore-metadata.json').write_text(json.dumps(metadata, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'previous_found={str(found).lower()}\n')
          print(json.dumps({'previous_found':found,'artifact_id':metadata['artifact_id'],'inventory_compatible':metadata['inventory_compatible'],'restore_reason':metadata['restore_reason']}, sort_keys=True))
          PY

      - name: Acquire fresh official MFF programming evidence
        env:
          PREVIOUS_FOUND: ${{ steps.restore.outputs.previous_found }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-mff-2028-2034-programming-proof
          ARGS=()
          if [[ "$PREVIOUS_FOUND" == "true" ]]; then
            ARGS+=(--previous "$ROOT/previous/eu-direct-mff-2028-2034-programming-snapshot.json")
          fi
          python partener-eu/ingest/eu_direct_mff_2028_2034_programming_watch.py \
            --registry partener-eu/ingest/eu_direct_mff_2028_2034_programming_registry.json \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output-dir "$ROOT/current" \
            "${ARGS[@]}"

      - name: Enforce live programming-only boundary
        env:
          PREVIOUS_FOUND: ${{ steps.restore.outputs.previous_found }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path('/tmp/partener-eu-mff-2028-2034-programming-proof/current')
          snapshot=json.loads((root/'eu-direct-mff-2028-2034-programming-snapshot.json').read_text(encoding='utf-8'))
          reconciliation=json.loads((root/'eu-direct-mff-2028-2034-programming-reconciliation.json').read_text(encoding='utf-8'))
          assert snapshot['schema']=='PARTENER_EU_EU_DIRECT_MFF_2028_2034_PROGRAMMING_WATCH_V1'
          assert snapshot['source_family']=='PROGRAMMING_PIPELINE'
          assert snapshot['programme_family']=='EU_DIRECT_2028_2034'
          assert snapshot['observation_state']=='PROGRAMMING_PIPELINE'
          assert snapshot['source_count']==6
          assert snapshot['healthy_source_count'] + snapshot['degraded_source_count'] == 6
          previous_found=os.environ.get('PREVIOUS_FOUND')=='true'
          if not previous_found:
              assert snapshot['healthy_source_count']==6 and snapshot['degraded_source_count']==0
          flags=('material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized','canonical_corpus_mutation')
          assert all(snapshot[key] is False for key in flags)
          assert snapshot['publication_effect']=='NONE'
          expected={
              'MFF-2028-2034-COMMISSION-ROOT',
              'ECF-COM-2025-555',
              'HORIZON-2028-2034-COM-2025-543',
              'ERASMUS-2028-2034-COM-2025-549',
              'CEF-2028-2034-COM-2025-547',
              'SINGLE-MARKET-CUSTOMS-2028-2034-COM-2025-590',
          }
          assert {row['source_id'] for row in snapshot['evidence']}==expected
          procedure_rows=0
          for row in snapshot['evidence']:
              assert row['observation_state'] in {'PROPOSAL','CONSULTATION','PLANNED','PROGRAMMING_PROCESS'}
              assert all(row[key] is False for key in flags)
              health=row['source_health']
              if row.get('procedure_identifier'):
                  procedure_rows += 1
              if health['health_state']=='HEALTHY':
                  assert health['http_status']==200 and health['lkg_required'] is False
                  assert re.fullmatch(r'[0-9a-f]{64}', health['raw_sha256'])
                  assert re.fullmatch(r'[0-9a-f]{64}', row['semantic_fingerprint'])
                  if row.get('procedure_identifier'):
                      assert row['semantics']['procedure_state'] in {'ONGOING','UNKNOWN_NON_AUTHORIZING'}
              else:
                  assert health['health_state']=='DEGRADED' and health['lkg_required'] is True
                  assert row['semantic_fingerprint'] is None and row['semantics'] is None
          assert procedure_rows==5
          if previous_found:
              assert reconciliation['reconciliation_state'] in {
                  'NO_CHANGE','TRANSPORT_OR_CONTENT_DRIFT_ONLY',
                  'PROGRAMMING_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING'}
              if snapshot['degraded_source_count'] and reconciliation['semantic_change_count']==0:
                  assert reconciliation['reconciliation_state']=='TRANSPORT_OR_CONTENT_DRIFT_ONLY'
                  assert reconciliation['transport_or_content_change_count'] >= 1
                  assert reconciliation['pipeline_watch_candidate'] is False
                  assert reconciliation['source_health_watch_candidate'] is True
                  assert reconciliation['lkg_reference_required'] is True
                  assert reconciliation['lkg_reference_available'] is True
                  assert reconciliation['lkg_reference_is_current_truth'] is False
          else:
              assert reconciliation['reconciliation_state']=='BASELINE_CAPTURED_NON_AUTHORIZING'
              assert reconciliation['semantic_change_count']==0
              assert reconciliation['transport_or_content_change_count']==0
              assert reconciliation['pipeline_watch_candidate'] is False
          assert all(reconciliation[key] is False for key in flags)
          assert reconciliation['publication_effect']=='NONE'
          print(json.dumps({
              'source_health':snapshot['source_health'], 'healthy_sources':snapshot['healthy_source_count'],
              'degraded_sources':snapshot['degraded_source_count'],
              'reconciliation_state':reconciliation['reconciliation_state'],
              'semantic_change_count':reconciliation['semantic_change_count'],
              'transport_or_content_change_count':reconciliation['transport_or_content_change_count'],
              'open_call_authorized':False, 'publication_effect':'NONE',
          }, sort_keys=True))
          PY

      - name: Stage compact comparison history with LKG preservation
        env:
          PREVIOUS_FOUND: ${{ steps.restore.outputs.previous_found }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil
          root=pathlib.Path('/tmp/partener-eu-mff-2028-2034-programming-proof')
          current=root/'current'/'eu-direct-mff-2028-2034-programming-snapshot.json'
          previous=root/'previous'/'eu-direct-mff-2028-2034-programming-snapshot.json'
          snapshot=json.loads(current.read_text(encoding='utf-8'))
          history=root/'history'
          history.mkdir(exist_ok=True)
          preserve_previous=int(snapshot.get('degraded_source_count') or 0)>0
          if preserve_previous:
              assert os.environ.get('PREVIOUS_FOUND')=='true' and previous.exists()
              shutil.copy2(previous, history/'eu-direct-mff-2028-2034-programming-snapshot.json')
              selected='PREVIOUS_HEALTHY_LKG'
          else:
              shutil.copy2(current, history/'eu-direct-mff-2028-2034-programming-snapshot.json')
              selected='CURRENT_HEALTHY'
          (history/'history-selection.json').write_text(json.dumps({
              'selected':selected,
              'current_degraded_source_count':snapshot.get('degraded_source_count'),
              'lkg_is_current_truth':False,
          }, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({'history_selected':selected,'lkg_is_current_truth':False}, sort_keys=True))
          PY

      - name: Upload compact programming history
        uses: actions/upload-artifact@v4
        with:
          name: partener-eu-mff-2028-2034-programming-history-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: /tmp/partener-eu-mff-2028-2034-programming-proof/history/
          if-no-files-found: error
          retention-days: 7

      - name: Upload bounded replay proof
        uses: actions/upload-artifact@v4
        with:
          name: partener-eu-mff-2028-2034-programming-proof-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: /tmp/partener-eu-mff-2028-2034-programming-proof/
          if-no-files-found: error
          retention-days: 7
