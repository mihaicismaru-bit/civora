name: VÂLCEA CLAR Performing Arts Promotion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/performing_arts_monitor_registry.json'
      - 'valcea-clar/editorial/performing_arts_update_candidates.json'
      - 'valcea-clar/scripts/promote_performing_arts_monitors.py'
      - '.github/workflows/valcea-clar-performing-arts-promotion.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: valcea-clar-performing-arts-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate general monitor promotion
        run: python valcea-clar/scripts/promote_performing_arts_monitors.py --check
      - name: Promote into general monitor registry
        run: python valcea-clar/scripts/promote_performing_arts_monitors.py
      - name: Persist general monitor registry conflict-safe
        shell: bash
        run: |
          set -euo pipefail
          path='valcea-clar/editorial/monitor_registry.json'
          if git diff --quiet -- "$path"; then
            echo 'General monitor registry already contains performing arts state.'
          else
            cp "$path" /tmp/monitor_registry.json
            git config user.name 'vâlcea-clar-performing-arts-promotion[bot]'
            git config user.email 'valcea-clar-performing-arts-promotion@users.noreply.github.com'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/monitor_registry.json "$path"
              git add "$path"
              if git diff --cached --quiet; then break; fi
              git commit -m 'Promote performing arts into VÂLCEA CLAR general monitors'
              if git push origin HEAD:main; then break; fi
              sleep $((attempt * 2))
            done
          fi
      - name: Dispatch general Editorial Opportunity Engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          code=$(curl -sS -o /tmp/opportunity-dispatch.txt -w '%{http_code}' -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/valcea-clar-editorial-opportunity-engine.yml/dispatches" \
            -d "$payload")
          if [ "$code" != '204' ]; then
            echo "Opportunity Engine dispatch failed with HTTP ${code}." >&2
            cat /tmp/opportunity-dispatch.txt >&2 || true
            exit 1
          fi
