name: PARTENER P11 Regenerate Once

on:
  push:
    branches:
      - partener-expired-open-projection-guard-20260923
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate P11 public projection
        run: |
          python partener-eu/p11/build_public_projection.py
          python partener-eu/p11/build_public_projection.py --check
          python partener-eu/p11/test_expired_open_projection.py
      - name: Persist regenerated projection
        shell: bash
        run: |
          git add partener-eu/web/p11-public-data.js
          if git diff --cached --quiet; then
            echo "Projection already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(partener): regenerate P11 projection"
          git push origin HEAD:partener-expired-open-projection-guard-20260923
