name: PARTENER.EU Web QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'partener-eu/web/**'
      - 'partener-eu/ops/test_web_hygiene.py'
      - 'partener-eu/ops/test_public_boot_performance.py'
      - 'partener-eu/ops/test_frontend_regression.py'
      - 'partener-eu/ops/test_brand_civic_intelligence_v1.py'
      - 'partener-eu/web/brand-civic-intelligence-v1.css'
      - 'partener-eu/web/brand-mark-v1.svg'
      - 'partener-eu/ops/build_public_static_pages.py'
      - 'partener-eu/ops/test_public_static_pages.py'
      - 'partener-eu/ops/test_home_concierge_vnext.py'
      - 'partener-eu/ops/check_public_site.py'
      - 'partener-eu/ops/test_public_site_transport.py'
      - 'partener-eu/ops/test_public_product_v3.py'
      - 'partener-eu/ops/test_ask_partener_v2.py'
      - 'partener-eu/ops/test_ask_eligibility_projection.js'
      - 'partener-eu/ops/test_home_freshness_guard.mjs'
      - 'partener-eu/ops/test_public_language.py'
      - 'partener-eu/ops/test_decision_products.py'
      - 'partener-eu/ops/test_consultant_workspace_v3.py'
      - 'partener-eu/ops/test_consultant_crud_v4.py'
      - 'partener-eu/ops/test_consultant_runtime_v5.py'
      - '.github/workflows/partener-eu-web-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/web/**'
      - 'partener-eu/ops/test_web_hygiene.py'
      - 'partener-eu/ops/test_public_boot_performance.py'
      - 'partener-eu/ops/test_frontend_regression.py'
      - 'partener-eu/ops/test_brand_civic_intelligence_v1.py'
      - 'partener-eu/web/brand-civic-intelligence-v1.css'
      - 'partener-eu/web/brand-mark-v1.svg'
      - 'partener-eu/ops/build_public_static_pages.py'
      - 'partener-eu/ops/test_public_static_pages.py'
      - 'partener-eu/ops/test_home_concierge_vnext.py'
      - 'partener-eu/ops/check_public_site.py'
      - 'partener-eu/ops/test_public_site_transport.py'
      - 'partener-eu/ops/test_public_product_v3.py'
      - 'partener-eu/ops/test_ask_partener_v2.py'
      - 'partener-eu/ops/test_ask_eligibility_projection.js'
      - 'partener-eu/ops/test_home_freshness_guard.mjs'
      - 'partener-eu/ops/test_public_language.py'
      - 'partener-eu/ops/test_decision_products.py'
      - 'partener-eu/ops/test_consultant_workspace_v3.py'
      - 'partener-eu/ops/test_consultant_crud_v4.py'
      - 'partener-eu/ops/test_consultant_runtime_v5.py'
      - '.github/workflows/partener-eu-web-qa.yml'

permissions:
  contents: read

concurrency:
  group: partener-eu-web-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Repository, public-shell and boot-performance hygiene
        run: |
          python partener-eu/ops/test_web_hygiene.py
          python partener-eu/ops/test_public_boot_performance.py
          python partener-eu/ops/test_frontend_regression.py
          python partener-eu/ops/test_brand_civic_intelligence_v1.py
          python partener-eu/ops/test_public_static_pages.py
          python partener-eu/ops/test_public_site_transport.py

      - name: Homepage and Ask contracts
        run: |
          python partener-eu/ops/test_home_concierge_vnext.py
          python partener-eu/ops/test_public_product_v3.py
          python partener-eu/ops/test_ask_partener_v2.py
          node partener-eu/ops/test_ask_eligibility_projection.js

      - name: Consultant lazy-load and runtime contracts
        run: |
          python partener-eu/ops/test_consultant_workspace_v3.py
          python partener-eu/ops/test_consultant_crud_v4.py
          python partener-eu/ops/test_consultant_runtime_v5.py

      - name: Public semantics and freshness
        run: |
          python partener-eu/ops/test_public_language.py
          node partener-eu/ops/test_home_freshness_guard.mjs
          python partener-eu/ops/test_decision_products.py

      - name: Syntax-check active web control modules
        run: |
          python -m py_compile partener-eu/ops/build_public_static_pages.py
          python -m py_compile partener-eu/ops/test_public_static_pages.py
          node --check partener-eu/web/app.js
          node --check partener-eu/web/public-heavy-loader-v1.js
          node --check partener-eu/web/ask-partener-v2.js
          node --check partener-eu/web/consultant-loader-v1.js
          node --check partener-eu/web/consultant-workspace-v3.js
          node --check partener-eu/web/consultant-onboarding-v3.js
          node --check partener-eu/web/consultant-mysmis-v1.js
          node --check partener-eu/web/decision-intelligence-v2.js
          node --check partener-eu/web/home-freshness-guard-v1.js
          node --check partener-eu/web/home-concierge-vnext.js
          node --check partener-eu/web/public-product-v3.js
          node --check partener-eu/web/people-policy-v1.js
