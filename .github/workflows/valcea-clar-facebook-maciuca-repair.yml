name: VÂLCEA CLAR Facebook Măciuca Photo Repair

on:
  push:
    branches:
      - fix/valcea-facebook-live-photo-gate-20260827
    paths:
      - ".github/workflows/valcea-clar-facebook-maciuca-repair.yml"

permissions:
  contents: write

concurrency:
  group: valcea-clar-facebook-maciuca-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic renderer dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Fetch approved real photographs
        run: python valcea-clar/social/fetch_approved_photos.py

      - name: Publish repaired Măciuca story with validated photo
        env:
          VALCEA_FB_PAGE_ID: "1234360446430980"
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/maciuca-photo-repair.json
          import json
          import os
          import sys
          sys.path.insert(0, 'valcea-clar/social')
          import facebook_editorial_publish as editorial
          import facebook_publish as legacy
          import facebook_text_fallback as fallback

          story_id = 'maciuca-ziua-regalitatii-2027-colocviu-bjai-20260827'
          key = editorial.state_key(story_id)
          state = editorial.load(editorial.STATE, {'schema_version':'3.0','published':{}})
          published = state.get('published') if isinstance(state.get('published'), dict) else {}
          if key in published:
              print(json.dumps({'status':'ALREADY_REPAIRED','story_id':story_id,'facebook_post_id':published[key].get('facebook_post_id')}, ensure_ascii=False))
              raise SystemExit(0)

          product = editorial._fixture_product(story_id)
          ready, reason = fallback.public_story_ready(str(product['canonical_url']))
          if not ready:
              raise SystemExit(f'public route not ready: {reason}')

          page_id = os.environ['VALCEA_FB_PAGE_ID'].strip()
          supplied = (os.environ.get('VALCEA_META_PAGE_ACCESS_TOKEN') or os.environ.get('VALCEA_FB_PAGE_ACCESS_TOKEN') or '').strip()
          if not supplied:
              raise SystemExit('missing Meta page token')
          version = os.environ.get('VALCEA_FB_GRAPH_VERSION','v26.0').strip() or 'v26.0'
          page_token, identity = legacy.resolve_page_token(page_id, supplied, version)
          post_id = editorial.graph_editorial_photo_post(page_id=page_id, token=page_token, version=version, product=product)
          editorial.persist_publication(state, product, post_id)
          print(json.dumps({
              'status':'REPAIRED_WITH_PHOTO',
              'story_id':story_id,
              'facebook_post_id':post_id,
              'canonical_url':product['canonical_url'],
              'asset_path':product['asset']['rendered_path'],
              'source_credit':product['asset']['source_photo']['credit'],
              'public_readback':'PASS',
              'token_source':identity.get('source'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Persist repaired state and editorial asset to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "valcea-clar-social-repair[bot]"
          git config user.email "valcea-clar-social-repair@users.noreply.github.com"
          git add valcea-clar/social/facebook_state.json
          git add valcea-clar/site/runtime/media/social/editorial/facebook/
          if git diff --cached --quiet; then
            echo "No Măciuca repair state delta to persist."
            exit 0
          fi
          git commit -m "Repair Măciuca Facebook post with validated photo"
          git push origin HEAD:fix/valcea-facebook-live-photo-gate-20260827

      - name: Upload repair receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-maciuca-photo-repair-${{ github.run_id }}
          path: /tmp/maciuca-photo-repair.json
          if-no-files-found: warn
          retention-days: 3
