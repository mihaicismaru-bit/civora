name: PARTENER.EU Pages Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partener-eu-pages-diagnostic.yml'

permissions:
  contents: read
  pages: read

concurrency:
  group: partener-eu-pages-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Pages API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p partener-eu/deployment
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pages || true)
          python - "$code" <<'PY'
          import json,sys,datetime
          code=sys.argv[1]
          try:
              body=json.load(open('/tmp/pages.json',encoding='utf-8'))
          except Exception:
              body={}
          out={
              'http_status':int(code) if code.isdigit() else None,
              'pages_exists':code=='200',
              'status':body.get('status'),
              'html_url':body.get('html_url'),
              'cname':body.get('cname'),
              'https_enforced':body.get('https_enforced'),
              'protected_domain_state':body.get('protected_domain_state'),
              'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'api_message':body.get('message')
          }
          json.dump(out,open('partener-eu/deployment/pages-diagnostic.json','w',encoding='utf-8'),indent=2)
          PY
      - name: Upload Pages diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: partener-pages-diagnostic
          path: partener-eu/deployment/pages-diagnostic.json
          retention-days: 7
          if-no-files-found: error

  persist:
    if: github.event_name == 'workflow_dispatch'
    needs: diagnose
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: partener-pages-diagnostic
          path: /tmp/partener-pages-diagnostic
      - name: Persist Pages diagnostic from explicit manual recovery
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(find /tmp/partener-pages-diagnostic -type f -name 'pages-diagnostic.json' -print -quit)
          test -n "$SOURCE"
          cp "$SOURCE" /tmp/pages-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p partener-eu/deployment
            cp /tmp/pages-diagnostic.json partener-eu/deployment/pages-diagnostic.json
            git add partener-eu/deployment/pages-diagnostic.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record PARTENER.EU Pages diagnostic [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
