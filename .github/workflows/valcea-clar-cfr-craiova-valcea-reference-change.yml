name: VÂLCEA CLAR CFR Craiova Vâlcea Reference Change

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/cfr_craiova_valcea_reference_change_state.py'
      - '.github/workflows/valcea-clar-cfr-craiova-valcea-reference-change.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/cfr_craiova_valcea_reference_change_state.py'
      - '.github/workflows/valcea-clar-cfr-craiova-valcea-reference-change.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-cfr-craiova-valcea-reference-change-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile CFR Craiova Vâlcea reference change detector
        run: python -m py_compile valcea-clar/scripts/cfr_craiova_valcea_reference_change_state.py
      - name: Run CFR Craiova Vâlcea reference change fail-closed regressions
        run: python valcea-clar/scripts/cfr_craiova_valcea_reference_change_state.py --self-test
