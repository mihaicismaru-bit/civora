name: LOCAL NEWS OS vNext Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/vnext/**"
      - ".github/workflows/local-news-os-vnext.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/vnext/**"
      - ".github/workflows/local-news-os-vnext.yml"

permissions:
  contents: read

jobs:
  validate-vnext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile generic vNext core
        run: |
          python -m py_compile \
            local-news-os/vnext/core/instance_model.py \
            local-news-os/vnext/core/runtime_store.py \
            local-news-os/vnext/core/site_runtime.py \
            local-news-os/vnext/core/source_adapters.py \
            local-news-os/vnext/core/signal_engine.py

      - name: Validate frozen product contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('local-news-os/vnext/PRODUCT_CONTRACT_V2.json').read_text(encoding='utf-8'))
          assert c['status'] == 'FROZEN'
          rules = c['non_negotiable_rules']
          assert rules['SITE_OWNS_RUNTIME']['runtime_authority'] == 'site_application_database'
          assert rules['SITE_OWNS_RUNTIME']['forbidden_runtime_authorities']
          assert rules['CORE_KNOWS_NO_LOCALITY']['core_may_read_locality_only_from_instance_config'] is True
          assert c['architecture']['development_release_plane']['may_block_validated_production_runtime'] is False
          assert c['architecture']['persistence_control_plane']['may_block_validated_production_runtime'] is False
          assert c['replication_contract']['code_fork_allowed'] is False
          assert c['product_kpis']['hard_acceptance']['soak_hours_without_routine_intervention'] == 48
          print('VNEXT_PRODUCT_CONTRACT_PASS')
          PY

      - name: Validate tenant instance model invariants
        run: python local-news-os/vnext/core/instance_model.py --self-test

      - name: Build production and second-instance manifests with the same core
        run: |
          python local-news-os/vnext/core/instance_model.py valcea --output /tmp/first.json
          python local-news-os/vnext/core/instance_model.py test-county --output /tmp/second.json
          cat /tmp/first.json
          cat /tmp/second.json

      - name: Prove site-owned runtime and instance isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('/tmp/first.json').read_text(encoding='utf-8'))
          b = json.loads(Path('/tmp/second.json').read_text(encoding='utf-8'))
          for item in (a, b):
              assert item['runtime']['owner'] == 'site_application'
              assert item['runtime']['repository_runtime_state_enabled'] is False
              assert item['runtime']['newsroom'] == {'path': '/newsroom', 'private': True}
              assert 'state_root' not in item['runtime']
              assert 'output_root' not in item['runtime']
              assert 'live_feed' not in item['runtime']
          assert a['instance_id'] != b['instance_id']
          assert a['publication']['canonical_domain'] != b['publication']['canonical_domain']
          assert a['config_sha256'] != b['config_sha256']
          second = json.dumps(b, ensure_ascii=False).lower()
          for forbidden in ('vâlcea', 'valcea', 'râmnicu', 'ramnicu', 'valceaclar.ro'):
              assert forbidden not in second, forbidden
          print('VNEXT_DUAL_INSTANCE_ISOLATION_PASS')
          PY

      - name: Validate site-owned runtime database and append-only event ledger
        run: python local-news-os/vnext/core/runtime_store.py --self-test

      - name: Validate generic source adapter core
        run: python local-news-os/vnext/core/source_adapters.py --self-test

      - name: Validate site-owned Signal Engine
        run: python local-news-os/vnext/core/signal_engine.py --self-test

      - name: Validate private site newsroom and fail-closed authentication
        run: python local-news-os/vnext/core/site_runtime.py --self-test

      - name: Validate source packs through the same adapter core
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('local-news-os/vnext/core').resolve()))
          import source_adapters as module
          schema = json.loads(Path('local-news-os/vnext/schemas/source_pack.schema.json').read_text(encoding='utf-8'))
          adapter_enum = schema['properties']['sources']['items']['properties']['adapter']['enum']
          assert set(adapter_enum) == module.SUPPORTED_ADAPTERS
          for instance_id in ('valcea', 'test-county'):
              path = Path(f'local-news-os/vnext/instances/{instance_id}/packs/sources.json')
              pack = json.loads(path.read_text(encoding='utf-8'))
              definitions = module.validate_source_pack(pack, instance_id)
              assert all(item.adapter in module.SUPPORTED_ADAPTERS for item in definitions)
          neutral = json.loads(Path('local-news-os/vnext/instances/test-county/packs/sources.json').read_text(encoding='utf-8'))
          assert {item['adapter'] for item in neutral['sources']} == {'RSS_ATOM', 'JSON_API'}
          print('VNEXT_SOURCE_PACK_CONTRACT_PASS')
          PY

      - name: Assert runtime schema is database-only
        shell: bash
        run: |
          set -euo pipefail
          test -f local-news-os/vnext/runtime/schema.sql
          ! grep -Eiq 'git_state_path|state_root|live-feed|current_edition|output_root' local-news-os/vnext/runtime/schema.sql
          grep -q "runtime_owner TEXT NOT NULL CHECK (runtime_owner = 'site_application')" local-news-os/vnext/runtime/schema.sql
          grep -q "runtime_events is append-only" local-news-os/vnext/runtime/schema.sql
          echo 'VNEXT_RUNTIME_DATABASE_CONTRACT_PASS'

      - name: Assert signals are site-owned and non-publishing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CREATE TABLE IF NOT EXISTS signals' local-news-os/vnext/runtime/schema.sql
          grep -q "publication_authority TEXT NOT NULL CHECK (publication_authority = 'NONE')" local-news-os/vnext/runtime/schema.sql
          grep -q 'material_fact_ready INTEGER NOT NULL DEFAULT 0 CHECK (material_fact_ready = 0)' local-news-os/vnext/runtime/schema.sql
          grep -q 'fact_kernel_ready INTEGER NOT NULL DEFAULT 0 CHECK (fact_kernel_ready = 0)' local-news-os/vnext/runtime/schema.sql
          grep -q 'SIGNAL_DISCOVERED' local-news-os/vnext/core/signal_engine.py
          grep -q '/newsroom/api/signals' local-news-os/vnext/core/site_runtime.py
          ! grep -Eiq 'git_state_path|state_root|live-feed|current_edition|output_root' local-news-os/vnext/core/signal_engine.py
          echo 'VNEXT_SIGNAL_BOUNDARY_PASS'

      - name: Assert newsroom is private and site-owned
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'LOCAL_NEWS_NEWSROOM_TOKEN' local-news-os/vnext/core/site_runtime.py
          grep -q 'newsroom_auth_not_configured' local-news-os/vnext/core/site_runtime.py
          grep -q 'no-store, private' local-news-os/vnext/core/site_runtime.py
          grep -q 'noindex, nofollow, noarchive' local-news-os/vnext/core/site_runtime.py
          ! grep -Eiq 'git_state_path|state_root|live-feed|current_edition|output_root' local-news-os/vnext/core/site_runtime.py
          echo 'VNEXT_PRIVATE_NEWSROOM_CONTRACT_PASS'

      - name: Assert source adapters are configuration-driven and transport-free
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SUPPORTED_ADAPTERS' local-news-os/vnext/core/source_adapters.py
          grep -q 'validate_source_pack' local-news-os/vnext/core/source_adapters.py
          ! grep -Eiq 'requests\.|urllib\.request|httpx|aiohttp|subprocess.*curl' local-news-os/vnext/core/source_adapters.py
          ! grep -Eiq 'CUSTOM_LOCAL_PARSER|specific_parser' local-news-os/vnext/schemas/source_pack.schema.json
          echo 'VNEXT_SOURCE_ADAPTER_BOUNDARY_PASS'

      - name: Enforce CORE_KNOWS_NO_LOCALITY in generic vNext code
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'vâlcea|valcea|râmnicu|ramnicu|valceaclar\.ro' local-news-os/vnext/core local-news-os/vnext/schemas local-news-os/vnext/runtime; then
            echo 'Generic vNext core contains locality-specific material' >&2
            exit 1
          fi
          echo 'VNEXT_CORE_NO_LOCALITY_PASS'
