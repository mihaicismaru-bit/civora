name: Deploy RPM Lead API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "partener-eu/lead-api/**"
      - ".github/workflows/rpm-lead-api.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partener-eu/lead-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      IP_SALT: ${{ secrets.RPM_IP_SALT }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_ID"
          test -n "$IP_SALT"

      - name: Bind production D1 database
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
          sed -i '/IP_SALT = /d' wrangler.toml

      - name: Apply D1 schema
        run: npx wrangler@latest d1 execute partener-rpm-leads --remote --file=schema.sql

      - name: Set Worker privacy salt
        run: printf '%s' "$IP_SALT" | npx wrangler@latest secret put IP_SALT

      - name: Deploy Worker
        run: npx wrangler@latest deploy

      - name: Smoke test Worker to D1
        run: |
          TEST_COMPANY="RPM-SMOKE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RESPONSE=$(curl --fail-with-body -sS -X POST "https://partener-rpm-leads.mihai-cismaru.workers.dev" \
            -H "Origin: https://partener.eu" \
            -H "Content-Type: application/json" \
            --data "{\"company\":\"${TEST_COMPANY}\",\"name\":\"Automated Smoke Test\",\"contact\":\"smoke-test@partener.eu\",\"employees\":1,\"format\":\"Online live\",\"source_url\":\"https://partener.eu/romana-pentru-munca/\",\"referrer\":\"https://partener.eu/\",\"utm_source\":\"github-actions\",\"utm_medium\":\"qa\",\"utm_campaign\":\"rpm-smoke\"}")
          echo "$RESPONSE" | grep -q '"ok":true'
          npx wrangler@latest d1 execute partener-rpm-leads --remote --command "DELETE FROM rpm_leads WHERE company='${TEST_COMPANY}';"
