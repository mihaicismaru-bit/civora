name: VÂLCEA CLAR Story Social Metadata

# Derived presentation projector. It never authorizes editorial facts. After the
# canonical Live Newsroom completes, this workflow rebuilds the reader-facing
# Public UX and article social metadata from the already-published live feed.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['VÂLCEA CLAR Live Newsroom']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'valcea-clar/social/story_visuals.json'
      - 'valcea-clar/social/social_media_manifest.json'
      - 'valcea-clar/scripts/render_story_pages.py'
      - 'valcea-clar/scripts/public_ux_reset.py'
      - 'valcea-clar/scripts/public_ux_fresh_rank.py'
      - 'valcea-clar/scripts/public_ux_story_integrity.py'
      - 'valcea-clar/scripts/public_ux_manifest.py'
      - 'valcea-clar/scripts/validate_public_ux_freshness.py'
      - 'local-news-os/core/verified_story_media.py'
      - '.github/workflows/valcea-clar-story-social-metadata.yml'
  pull_request:
    paths:
      - 'valcea-clar/social/story_visuals.json'
      - 'valcea-clar/social/social_media_manifest.json'
      - 'valcea-clar/scripts/render_story_pages.py'
      - 'valcea-clar/scripts/public_ux_reset.py'
      - 'valcea-clar/scripts/public_ux_fresh_rank.py'
      - 'valcea-clar/scripts/public_ux_story_integrity.py'
      - 'valcea-clar/scripts/public_ux_manifest.py'
      - 'valcea-clar/scripts/validate_public_ux_freshness.py'
      - 'local-news-os/core/verified_story_media.py'
      - '.github/workflows/valcea-clar-story-social-metadata.yml'

permissions:
  contents: write

concurrency:
  # Derived presentation must never race the canonical live writer.
  group: valcea-clar-live-newsroom
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Self-test derived presentation contracts
        run: |
          python valcea-clar/scripts/public_ux_reset.py --self-test
          python valcea-clar/scripts/public_ux_fresh_rank.py --self-test
          python valcea-clar/scripts/public_ux_story_integrity.py --self-test
          python valcea-clar/scripts/validate_public_ux_freshness.py --self-test

      - name: Exercise canonical reader presentation on pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          archive='valcea-clar/site/story_archive.json'
          before="$(sha256sum "$archive" | cut -d' ' -f1)"

          python valcea-clar/scripts/render_story_pages.py | tee /tmp/story-social-metadata.json
          python valcea-clar/scripts/public_ux_fresh_rank.py
          python valcea-clar/scripts/public_ux_story_integrity.py
          python valcea-clar/scripts/public_ux_manifest.py
          python valcea-clar/scripts/public_ux_fresh_rank.py --check
          python valcea-clar/scripts/public_ux_story_integrity.py --check
          python valcea-clar/scripts/public_ux_manifest.py --check
          python valcea-clar/scripts/validate_public_ux_freshness.py

          after="$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$before" = "$after"
          git diff --exit-code -- "$archive"

      - name: Persist canonical reader presentation conflict-safe
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'valcea-clar-story-meta[bot]'
          git config user.email 'valcea-clar-story-meta@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            archive='valcea-clar/site/story_archive.json'
            before="$(sha256sum "$archive" | cut -d' ' -f1)"

            python valcea-clar/scripts/render_story_pages.py | tee /tmp/story-social-metadata.json
            python valcea-clar/scripts/public_ux_fresh_rank.py
            python valcea-clar/scripts/public_ux_story_integrity.py
            python valcea-clar/scripts/public_ux_manifest.py
            python valcea-clar/scripts/public_ux_fresh_rank.py --check
            python valcea-clar/scripts/public_ux_story_integrity.py --check
            python valcea-clar/scripts/public_ux_manifest.py --check
            python valcea-clar/scripts/validate_public_ux_freshness.py

            after="$(sha256sum "$archive" | cut -d' ' -f1)"
            test "$before" = "$after"
            git diff --exit-code -- "$archive"

            git add valcea-clar/site/public_ux_state.json valcea-clar/site/runtime
            if git diff --cached --quiet; then
              echo 'Canonical Public UX and story social metadata already current.'
              exit 0
            fi

            git commit -m 'Refresh VÂLCEA CLAR canonical public presentation'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during Public UX projection; retrying ${attempt}/5."
            sleep $((attempt * 2))
          done

          echo 'Could not persist canonical Public UX after five attempts.' >&2
          exit 1

      - name: Write audit summary
        if: always()
        run: |
          echo '## VÂLCEA CLAR Story Social Metadata + Public UX' >> "$GITHUB_STEP_SUMMARY"
          echo 'Derived presentation is rebuilt from the canonical live feed after Live Newsroom completes; freshness is based on first publication, not merely re-seen activity.' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/story-social-metadata.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
