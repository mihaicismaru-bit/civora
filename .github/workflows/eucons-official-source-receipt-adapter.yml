name: EUCONS Official Source Receipt Adapter

on:
  pull_request:
    paths:
      - 'eucons/opportunities/official_source_receipt_adapter_contract.json'
      - 'eucons/opportunities/official_source_receipt_adapter.py'
      - 'eucons/validation/test_official_source_receipt_adapter_fail_closed.py'
      - '.github/workflows/eucons-official-source-receipt-adapter.yml'
      - 'eucons/opportunities/matching_contract.json'
      - 'eucons/opportunities/match_opportunities.py'
  push:
    branches: [main]
    paths:
      - 'eucons/opportunities/official_source_receipt_adapter_contract.json'
      - 'eucons/opportunities/official_source_receipt_adapter.py'
      - 'eucons/validation/test_official_source_receipt_adapter_fail_closed.py'
      - '.github/workflows/eucons-official-source-receipt-adapter.yml'
      - 'eucons/opportunities/matching_contract.json'
      - 'eucons/opportunities/match_opportunities.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-official-source-receipt-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile official-source receipt adapter
        run: python -m py_compile eucons/opportunities/official_source_receipt_adapter.py
      - name: Test official-source receipt adapter fail-closed behavior
        run: python eucons/validation/test_official_source_receipt_adapter_fail_closed.py
      - name: Revalidate canonical opportunity matching
        run: python eucons/validation/validate_opportunity_matching.py
      - name: Re-run canonical opportunity matching fail-closed tests
        run: python eucons/validation/test_opportunity_matching_fail_closed.py
