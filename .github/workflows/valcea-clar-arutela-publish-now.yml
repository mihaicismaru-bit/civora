# Triggered explicitly after workflow materialization: 2026-08-20T20:52+03:00
name: VÂLCEA CLAR Arutela Publish Now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valcea-clar-arutela-publish-now.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: valcea-clar-arutela-one-shot
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate newsroom and select Arutela story
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/scripts/newsroom_decide.py --self-test
          python valcea-clar/scripts/newsroom_decide.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('valcea-clar/site/newsroom_decision.json').read_text(encoding='utf-8'))
          sid='arutela-restaurare-controversa-pnrr-20260820'
          assert sid in d['publishable_story_ids'], f'{sid} did not pass canonical newsroom gates'
          if sid not in d['new_story_ids']:
              route=Path('valcea-clar/site/runtime/stiri')/sid/'index.html'
              assert route.is_file(), f'{sid} is not new and is not already materialized'
              print('ready=false')
          else:
              assert d['changed'] is True, 'canonical newsroom state did not change'
              print('ready=true')
          print(f"slot={d['slot_for_legacy_snapshot_compatibility']}")
          PY

      - name: Remove title/date-only automatic candidates
        if: steps.decision.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'valcea-clar/scripts')
          from newsroom_decide import story_ready
          path=Path('valcea-clar/editorial/auto_facts.json')
          doc=json.loads(path.read_text(encoding='utf-8'))
          doc['facts']=[f for f in doc.get('facts', []) if story_ready(f)[0]]
          doc.setdefault('policy', {})['continuous_newsroom_full_story_gate'] = True
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Build and validate canonical live snapshot
        if: steps.decision.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/scripts/build_public_data.py
          python valcea-clar/scripts/generate_edition.py --slot "${{ steps.decision.outputs.slot }}"
          python valcea-clar/scripts/render_frontpage.py
          python valcea-clar/scripts/render_story_pages.py
          python valcea-clar/scripts/build_live_feed.py
          python valcea-clar/scripts/build_sites_export.py
          python valcea-clar/scripts/overlay_runtime_export.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('valcea-clar')
          sid='arutela-restaurare-controversa-pnrr-20260820'
          route=root/'site/runtime/stiri'/sid/'index.html'
          assert route.is_file() and route.stat().st_size > 0, 'Arutela route was not rendered'
          html=route.read_text(encoding='utf-8')
          assert 'Arutela' in html and '12,4 milioane lei' in html
          manifest=json.loads((root/'site/runtime/stiri/manifest.json').read_text(encoding='utf-8'))
          assert sid in {str(x.get('id')) for x in manifest.get('stories', [])}
          print({'status':'PASS','route':f'/stiri/{sid}/'})
          PY

      - name: Mark published and emit durable publication event
        if: steps.decision.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/scripts/newsroom_decide.py --commit-state
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('valcea-clar')
          decision=json.loads((root/'site/newsroom_decision.json').read_text(encoding='utf-8'))
          manifest=json.loads((root/'site/runtime/stiri/manifest.json').read_text(encoding='utf-8'))
          routes={item['id']: item['canonical'] for item in manifest.get('stories', [])}
          event={
              'schema_version':'1.0',
              'event':'story_publication',
              'publication_model':'continuous_story_first',
              'published_at':decision['evaluated_local'],
              'fingerprint':decision['fingerprint'],
              'story_ids':decision['publishable_story_ids'],
              'new_story_ids':decision['new_story_ids'],
              'canonical_urls':{sid:routes.get(sid) for sid in decision['publishable_story_ids'] if routes.get(sid)},
              'editions_are_publication_gates':False,
          }
          (root/'site/story_publication_event.json').write_text(json.dumps(event,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Persist canonical Arutela publication without stale overwrite
        if: steps.decision.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sid='arutela-restaurare-controversa-pnrr-20260820'
          tx=/tmp/valcea-arutela-publication
          rm -rf "$tx" && mkdir -p "$tx"
          paths=(
            valcea-clar/editions
            valcea-clar/site/current_edition.json
            valcea-clar/site/last_edition_attempt.json
            valcea-clar/site/newsroom_decision.json
            valcea-clar/site/newsroom_state.json
            valcea-clar/site/story_publication_event.json
            valcea-clar/site/runtime
          )
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              mkdir -p "$tx/$(dirname "$path")"
              cp -a "$path" "$tx/$path"
            fi
          done

          git config user.name 'vâlcea-clar-live-newsroom[bot]'
          git config user.email 'valcea-clar-live-newsroom@users.noreply.github.com'
          git fetch origin main
          if git cat-file -e "origin/main:valcea-clar/site/runtime/stiri/${sid}/index.html" 2>/dev/null; then
            echo 'Arutela route already persisted by canonical newsroom.'
            exit 0
          fi
          git reset --hard origin/main
          git clean -fd
          for path in "${paths[@]}"; do
            if [ -e "$tx/$path" ]; then
              mkdir -p "$(dirname "$path")"
              if [ -d "$tx/$path" ]; then
                mkdir -p "$path" && cp -a "$tx/$path/." "$path/"
              else
                cp -a "$tx/$path" "$path"
              fi
            fi
          done
          git add valcea-clar/editions valcea-clar/site/current_edition.json valcea-clar/site/last_edition_attempt.json valcea-clar/site/newsroom_decision.json valcea-clar/site/newsroom_state.json valcea-clar/site/story_publication_event.json valcea-clar/site/runtime
          git commit -m 'Publish VÂLCEA CLAR Arutela story live'
          if git push origin HEAD:main; then
            exit 0
          fi

          git fetch origin main
          if git cat-file -e "origin/main:valcea-clar/site/runtime/stiri/${sid}/index.html" 2>/dev/null; then
            echo 'Concurrent canonical newsroom won the race and published Arutela.'
            exit 0
          fi
          echo 'Main advanced during Arutela publication; refusing stale overwrite.' >&2
          exit 1

      - name: Upload current site payload
        if: steps.decision.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-arutela-live-${{ github.run_id }}
          path: valcea-clar/dist/chatgpt-sites
          if-no-files-found: error
          retention-days: 7

      - name: Dispatch social publication engine
        if: steps.decision.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run valcea-clar-social-publishing.yml --repo "${{ github.repository }}" --ref main
