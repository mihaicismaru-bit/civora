name: VÂLCEA CLAR Facebook Fallback Repair

on:
  push:
    branches:
      - fix/valcea-facebook-live-photo-gate-20260827
    paths:
      - ".github/workflows/valcea-clar-facebook-fallback-repair.yml"
      - "valcea-clar/social/facebook_text_fallback.py"
      - "valcea-clar/social/repair_recent_facebook_fallbacks.py"

permissions:
  contents: write

concurrency:
  group: valcea-clar-facebook-fallback-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate fail-closed Facebook fallback policy
        run: |
          python -m py_compile \
            valcea-clar/social/facebook_text_fallback.py \
            valcea-clar/social/repair_recent_facebook_fallbacks.py \
            valcea-clar/social/facebook_publish.py
          python valcea-clar/social/facebook_text_fallback.py --self-test
          python valcea-clar/social/repair_recent_facebook_fallbacks.py

      - name: Repair recent broken fallback posts
        env:
          VALCEA_FB_PAGE_ID: "1234360446430980"
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
        run: python valcea-clar/social/repair_recent_facebook_fallbacks.py --apply | tee /tmp/facebook-fallback-repair.json

      - name: Persist repaired Facebook state to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "valcea-clar-social-repair[bot]"
          git config user.email "valcea-clar-social-repair@users.noreply.github.com"
          git add valcea-clar/social/facebook_state.json
          if git diff --cached --quiet; then
            echo "No state delta to persist."
            exit 0
          fi
          git commit -m "Repair recent VÂLCEA CLAR Facebook fallback publications"
          git push origin HEAD:fix/valcea-facebook-live-photo-gate-20260827

      - name: Upload repair receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-facebook-fallback-repair-${{ github.run_id }}
          path: /tmp/facebook-fallback-repair.json
          if-no-files-found: warn
          retention-days: 3
