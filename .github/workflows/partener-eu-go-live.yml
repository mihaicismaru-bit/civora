name: PARTENER.EU Go Live
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  issues: read

# Share the exact Pages deployment lock with the automatic web deploy.
# This prevents two independent workflows from trying to create a Pages
# deployment for different commits at the same time.
concurrency:
  group: partener-eu-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: startsWith(github.event.issue.title, '[PARTENER-GO-LIVE]') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspect Pages and enforce custom-domain HTTPS
        id: pagesapi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-before.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pages || true)
          echo "before=$code" >> "$GITHUB_OUTPUT"
          echo "create=not_needed" >> "$GITHUB_OUTPUT"
          configure=$(curl -sS -o /tmp/pages-configure.json -w '%{http_code}' -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pages \
            -d '{"cname":"partener.eu","build_type":"workflow","https_enforced":true}' || true)
          echo "cname=$configure" >> "$GITHUB_OUTPUT"
          echo "https_configure=$configure" >> "$GITHUB_OUTPUT"
          test "$configure" = "204"
      - id: configure
        uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: partener-eu/web
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Inspect final Pages state
        id: finalapi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-final.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pages || true)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          try: d=json.load(open('/tmp/pages-final.json'))
          except Exception: d={}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('html_url='+str(d.get('html_url') or '')+'\n')
              f.write('cname='+str(d.get('cname') or '')+'\n')
              f.write('https_enforced='+str(d.get('https_enforced') or '')+'\n')
          assert d.get('cname') == 'partener.eu', d
          assert d.get('https_enforced') is True, d
          PY
      - name: Verify live DNS and HTTP
        id: livecheck
        if: always()
        run: |
          python - <<'PY'
          import json, urllib.request, ssl
          def dns(name, rtype):
              try:
                  with urllib.request.urlopen(f'https://dns.google/resolve?name={name}&type={rtype}', timeout=15) as r:
                      d=json.load(r)
                  return [a.get('data') for a in d.get('Answer',[]) if a.get('data')]
              except Exception as e:
                  return [f'ERROR:{type(e).__name__}:{e}']
          def http(url):
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'PARTENER-EU-livecheck/1.1'})
                  with urllib.request.urlopen(req, timeout=20, context=ssl.create_default_context()) as r:
                      body=r.read(120000).decode('utf-8','ignore')
                      return {'ok':True,'status':r.status,'final_url':r.geturl(),'title_new':('Funding Explorer' in body or 'PARTENER.EU' in body),'wordpress':('wp-content' in body or 'WordPress' in body)}
              except Exception as e:
                  return {'ok':False,'error':f'{type(e).__name__}:{e}'}
          out={
            'apex_a':dns('partener.eu','A'),
            'www_cname':dns('www.partener.eu','CNAME'),
            'mx':dns('partener.eu','MX'),
            'mail_a':dns('mail.partener.eu','A'),
            'http_apex':http('http://partener.eu/'),
            'https_apex':http('https://partener.eu/'),
            'https_www':http('https://www.partener.eu/')
          }
          json.dump(out,open('/tmp/livecheck.json','w'),indent=2)
          assert out['https_apex'].get('ok') is True, out
          assert out['https_apex'].get('wordpress') is False, out
          assert str(out['http_apex'].get('final_url') or '').startswith('https://'), out
          PY
      - name: Record go-live result
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BEFORE_CODE: ${{ steps.pagesapi.outputs.before }}
          CREATE_CODE: ${{ steps.pagesapi.outputs.create }}
          CNAME_CODE: ${{ steps.pagesapi.outputs.cname }}
          HTTPS_CONFIGURE_CODE: ${{ steps.pagesapi.outputs.https_configure }}
          FINAL_CODE: ${{ steps.finalapi.outputs.code }}
          FINAL_URL: ${{ steps.finalapi.outputs.html_url }}
          FINAL_CNAME: ${{ steps.finalapi.outputs.cname }}
          HTTPS_ENFORCED: ${{ steps.finalapi.outputs.https_enforced }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          LIVECHECK_OUTCOME: ${{ steps.livecheck.outcome }}
        run: |
          mkdir -p partener-eu/deployment
          python - <<'PY'
          import json, os, datetime
          try: live=json.load(open('/tmp/livecheck.json'))
          except Exception: live={}
          ok=(
              os.getenv('DEPLOY_OUTCOME')=='success'
              and bool(os.getenv('PAGE_URL'))
              and os.getenv('HTTPS_ENFORCED','').lower()=='true'
              and os.getenv('LIVECHECK_OUTCOME')=='success'
          )
          out={
            'status':'LIVE_ENDPOINT_READY' if ok else 'BLOCKED',
            'page_url':os.getenv('PAGE_URL') or None,
            'pages_get_before':os.getenv('BEFORE_CODE'),
            'pages_create_attempt':os.getenv('CREATE_CODE'),
            'custom_domain_attempt':os.getenv('CNAME_CODE'),
            'https_configure_attempt':os.getenv('HTTPS_CONFIGURE_CODE'),
            'pages_final_get':os.getenv('FINAL_CODE'),
            'pages_final_url':os.getenv('FINAL_URL') or None,
            'pages_final_cname':os.getenv('FINAL_CNAME') or None,
            'https_enforced':os.getenv('HTTPS_ENFORCED') or None,
            'configure_outcome':os.getenv('CONFIGURE_OUTCOME'),
            'upload_outcome':os.getenv('UPLOAD_OUTCOME'),
            'deploy_outcome':os.getenv('DEPLOY_OUTCOME'),
            'livecheck_outcome':os.getenv('LIVECHECK_OUTCOME'),
            'live_check':live,
            'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'trigger':'issue'
          }
          json.dump(out,open('partener-eu/deployment/go-live-result.json','w',encoding='utf-8'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partener-eu/deployment/go-live-result.json
          git commit -m 'Record PARTENER.EU go-live result' || exit 0
          # Validation ledger commits may land while this job is running.
          # Rebase the audit-only commit on current main and retry once; never
          # overwrite or force-push canonical history.
          if ! git push; then
            git fetch origin main
            git rebase origin/main
            git push
          fi
