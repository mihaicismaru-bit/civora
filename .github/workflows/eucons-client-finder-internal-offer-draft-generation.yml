name: EUCONS Client Finder Internal Offer Draft Generation

on:
  pull_request:
    paths:
      - 'eucons/leads/client_finder_internal_offer_draft_generation.py'
      - 'eucons/leads/client_finder_internal_offer_draft_generation_contract.json'
      - 'eucons/validation/test_client_finder_internal_offer_draft_generation_fail_closed.py'
      - '.github/workflows/eucons-client-finder-internal-offer-draft-generation.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/leads/client_finder_internal_offer_draft_generation.py'
      - 'eucons/leads/client_finder_internal_offer_draft_generation_contract.json'
      - 'eucons/validation/test_client_finder_internal_offer_draft_generation_fail_closed.py'
      - '.github/workflows/eucons-client-finder-internal-offer-draft-generation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-client-finder-internal-offer-draft-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Client Finder internal offer-draft generation fail-closed behavior
        run: python eucons/validation/test_client_finder_internal_offer_draft_generation_fail_closed.py
