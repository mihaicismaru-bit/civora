name: PARTENER.EU Interreg BSB Programme Fit Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/interreg_bsb_programme_fit.py'
      - 'partener-eu/ops/test_interreg_bsb_programme_fit.py'
      - '.github/workflows/partener-eu-interreg-bsb-programme-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interreg-bsb-programme-fit-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded BSB adapter and regressions
        run: |
          python -m py_compile \
            partener-eu/ingest/interreg_bsb_programme_fit.py \
            partener-eu/ops/test_interreg_bsb_programme_fit.py

      - name: Validate fail-closed BSB semantics
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: python partener-eu/ops/test_interreg_bsb_programme_fit.py

      - name: Probe each BSB authority transport independently
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          python - <<'PY'
          from interreg_bsb_programme_fit import SOURCES, default_fetch
          for spec in SOURCES:
              try:
                  raw, meta = default_fetch(spec['url'])
                  print({'source_id':spec['id'],'transport_health':'HEALTHY','http_status':meta['http_status'],'final_url':meta['final_url'],'bytes':len(raw)})
              except Exception as exc:
                  print({'source_id':spec['id'],'transport_health':'DEGRADED','authority_url':spec['url'],'error_type':type(exc).__name__,'error':str(exc)})
          PY

      - name: Acquire fresh BSB evidence or preserve source-health failure
        env:
          PYTHONPATH: partener-eu/ingest
        shell: bash
        run: |
          set -uo pipefail
          ROOT=/tmp/partener-eu-interreg-bsb-programme-proof
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          set +e
          python partener-eu/ingest/interreg_bsb_programme_fit.py \
            --out-dir "$ROOT" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >"$ROOT/acquisition.stdout" 2>"$ROOT/acquisition.stderr"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            export BSB_ACQUISITION_RC="$RC"
            python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          root=Path('/tmp/partener-eu-interreg-bsb-programme-proof')
          stderr=(root/'acquisition.stderr').read_text(encoding='utf-8', errors='replace')
          failure={
              'schema':'PARTENER_EU_INTERREG_BSB_SOURCE_HEALTH_FAILURE_V1',
              'programme_id':'BSB',
              'source_family':'INTERREG',
              'programme_family':'INTERREG_NEXT_BLACK_SEA_BASIN',
              'fetched_at':dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat(),
              'source_health':'DEGRADED',
              'error_type':'LIVE_ACQUISITION_FAILED',
              'process_exit_code':int(os.environ['BSB_ACQUISITION_RC']),
              'error_excerpt':stderr[-4000:],
              'lkg_required':True,
              'lkg_available':False,
              'current_material_truth_available':False,
              'market_intelligence_only':True,
              'material_fact_use':False,
              'open_call_authorized':False,
              'closed_call_authorized':False,
              'deadline_authorized':False,
              'budget_authorized':False,
              'eligibility_authorized':False,
              'publish_authorized':False,
              'distribution_authorized':False,
              'call_alert_authorized':False,
              'canonical_corpus_mutation':False,
              'publication_effect':'NONE',
          }
          (root/'bsb-source-health-failure.json').write_text(json.dumps(failure,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          fi

      - name: Enforce live BSB fail-closed boundary
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('/tmp/partener-eu-interreg-bsb-programme-proof')
          healthy=root/'interreg-bsb-programme-fit.json'
          degraded=root/'bsb-source-health-failure.json'
          flags=(
              'material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized',
              'budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized',
              'call_alert_authorized','canonical_corpus_mutation',
          )
          if healthy.exists():
              row=json.loads(healthy.read_text(encoding='utf-8'))
              assert row['schema']=='PARTENER_EU_INTERREG_BSB_PROGRAMME_FIT_V1'
              assert row['source_health']=='HEALTHY' and row['programme_id']=='BSB'
              assert row['programme_cci']=='2021TC16NXTN002'
              assert row['romania_programme_region']=='Sud-Est'
              assert row['romania_scope']==['Braila','Buzau','Constanta','Galati','Tulcea','Vrancea']
              assert len(row['source_receipts'])==3
              for source in row['source_receipts']:
                  assert source['source_health']=='HEALTHY' and source['http_status']==200
                  assert re.fullmatch(r'[0-9a-f]{64}',source['raw_sha256'])
                  assert re.fullmatch(r'[0-9a-f]{64}',source['normalized_visible_text_sha256'])
              assert all(row[k] is False for k in flags) and row['publication_effect']=='NONE'
              print({'bsb_source_health':'HEALTHY','romania_scope':row['romania_scope'],'semantic_fingerprint':row['semantic_fingerprint'],'publication_effect':'NONE'})
          else:
              assert degraded.exists(), 'BSB live acquisition produced neither healthy nor degraded receipt'
              row=json.loads(degraded.read_text(encoding='utf-8'))
              assert row['source_health']=='DEGRADED'
              assert row['lkg_required'] is True and row['lkg_available'] is False
              assert row['current_material_truth_available'] is False
              assert all(row[k] is False for k in flags) and row['publication_effect']=='NONE'
              print({'bsb_source_health':'DEGRADED','lkg_required':True,'lkg_available':False,'open_call_authorized':False,'publication_effect':'NONE'})
          PY

      - name: Upload replayable BSB proof evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-interreg-bsb-programme-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-interreg-bsb-programme-proof
          if-no-files-found: error
          retention-days: 7
