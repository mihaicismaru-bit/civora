name: PARTENER Ask PR Validation Temp

on:
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/web/ask-partener-v2.js'
      - 'partener-eu/ops/test_ask_partener_v2.py'
      - '.github/workflows/partener-ask-pr-validation-temp.yml'

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Ask JavaScript syntax
        run: node --check partener-eu/web/ask-partener-v2.js
      - name: Ask public-language and relevance contract
        run: python partener-eu/ops/test_ask_partener_v2.py
