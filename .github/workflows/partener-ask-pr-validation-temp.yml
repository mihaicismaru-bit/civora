name: PARTENER Ask PR Validation Temp

on:
  push:
    branches:
      - partener/frontend-ask-beneficiary-guard-20260820-0042
  pull_request:
    branches:
      - main
    paths:
      - 'partener-eu/web/ask-partener-v2.js'
      - 'partener-eu/ops/test_ask_partener_v2.py'
      - '.github/workflows/partener-ask-pr-validation-temp.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Ask exact regression
        run: python partener-eu/ops/test_ask_partener_v2.py
      - name: Ask JavaScript syntax
        run: node --check partener-eu/web/ask-partener-v2.js
      - name: Frontend/public-language regression
        run: python partener-eu/ops/test_frontend_regression.py
      - name: Unified product quality gate
        run: python partener-eu/ops/quality_gate.py
