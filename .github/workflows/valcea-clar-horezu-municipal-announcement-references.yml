name: VÂLCEA CLAR Horezu Municipal Announcement References

on:
  pull_request:
    paths:
      - "valcea-clar/scripts/horezu_municipal_announcement_reference_adapter.py"
      - ".github/workflows/valcea-clar-horezu-municipal-announcement-references.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valcea-clar-horezu-municipal-announcement-references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bounded adapter
        run: python -m py_compile valcea-clar/scripts/horezu_municipal_announcement_reference_adapter.py
      - name: Run fail-closed self-test
        run: python valcea-clar/scripts/horezu_municipal_announcement_reference_adapter.py --self-test
