name: VÂLCEA CLAR Legal Pages Compatibility Check

# Legal rendering is owned by overlay_runtime_export.py inside the canonical
# newsroom export. Keep only explicit validation here; never rewrite main.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/site/legal/legal_pages.json'
      - 'valcea-clar/scripts/build_legal_pages.py'
      - 'valcea-clar/scripts/public_ux_legal.py'
      - 'valcea-clar/scripts/overlay_runtime_export.py'
      - '.github/workflows/valcea-clar-legal-pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate canonical legal source and renderer
        run: |
          python -m py_compile \
            valcea-clar/scripts/build_legal_pages.py \
            valcea-clar/scripts/public_ux_legal.py \
            valcea-clar/scripts/overlay_runtime_export.py
          python valcea-clar/scripts/build_legal_pages.py --self-test
      - name: Build legal routes without publication
        run: |
          python valcea-clar/scripts/build_legal_pages.py --export
          python valcea-clar/scripts/build_legal_pages.py --check
          python valcea-clar/scripts/public_ux_legal.py
          test -s valcea-clar/site/runtime/termeni/index.html
          test -s valcea-clar/site/runtime/confidentialitate/index.html
          grep -Fq 'data-nav-contract="valcea-clar-primary-v2"' valcea-clar/site/runtime/termeni/index.html
          grep -Fq 'data-nav-contract="valcea-clar-primary-v2"' valcea-clar/site/runtime/confidentialitate/index.html
      - name: Validate canonical ownership
        run: |
          grep -Fq 'build_legal_pages.build()' valcea-clar/scripts/overlay_runtime_export.py
          grep -Fq 'public_ux_legal.py' valcea-clar/scripts/overlay_runtime_export.py
          echo 'Legal pages are owned by overlay_runtime_export.py.'
