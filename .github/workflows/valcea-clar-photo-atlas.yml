name: VÂLCEA CLAR Photo Atlas

# PR/manual contract validator. Photo Atlas has zero publication authority and
# does not need an autonomous main-branch observer.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/social/story_visuals.json'
      - 'valcea-clar/social/photo_atlas.py'
      - 'valcea-clar/social/photo_atlas.json'
      - '.github/workflows/valcea-clar-photo-atlas.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-photo-atlas-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild Photo Atlas deterministically for acceptance
        run: |
          python -m py_compile valcea-clar/social/photo_atlas.py
          python valcea-clar/social/photo_atlas.py --self-test
          python valcea-clar/social/photo_atlas.py
      - name: Verify Atlas has no publication authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          atlas = json.loads(Path('valcea-clar/social/photo_atlas.json').read_text(encoding='utf-8'))
          assert atlas['product'] == 'VÂLCEA CLAR PHOTO ATLAS'
          assert atlas['publication_authority'] == 'NONE'
          policy = atlas['policy']
          assert policy['approved_real_photographs_only'] is True
          assert policy['synthetic_assets_forbidden'] is True
          assert policy['generic_stock_substitution_forbidden'] is True
          assert policy['atlas_never_inherits_story_approval'] is True
          assert policy['automatic_story_assignment_allowed'] is False
          assert policy['new_story_subject_match_required'] is True
          assert policy['new_story_editor_approval_required'] is True
          for asset in atlas.get('assets', []):
              assert asset['kind'] == 'photograph'
              assert asset['synthetic'] is False
              assert asset['automatic_story_assignment_allowed'] is False
              assert asset['new_story_subject_match_required'] is True
              assert asset['new_story_editor_approval_required'] is True
              assert asset['publication_authority'] == 'NONE'
          print(f"Photo Atlas authority gate: PASS ({len(atlas.get('assets', []))} assets)")
          PY
