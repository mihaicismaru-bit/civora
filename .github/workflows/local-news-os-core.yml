name: LOCAL NEWS OS Core Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/core/**"
      - "local-news-os/schemas/**"
      - "local-news-os/instances/**"
      - "local-news-os/persistence/**"
      - ".github/workflows/local-news-os-core.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/core/**"
      - "local-news-os/schemas/**"
      - "local-news-os/instances/**"
      - "local-news-os/persistence/**"
      - ".github/workflows/local-news-os-core.yml"

permissions:
  contents: read

jobs:
  validate-instances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile generic instance tools
        run: |
          python -m py_compile \
            local-news-os/core/validate_instance_config.py \
            local-news-os/core/build_instance_manifest.py \
            local-news-os/core/resolve_source_pack.py \
            local-news-os/core/discover_primary_source_facts.py \
            local-news-os/core/discovery_health.py \
            local-news-os/core/generate_verified_edition.py \
            local-news-os/core/render_frontpage.py \
            local-news-os/core/related_stories.py \
            local-news-os/core/article_structured_data.py \
            local-news-os/core/verified_story_media.py \
            local-news-os/core/repository_scope_fingerprint.py
      - name: Validate scope-aware persistence drift classifier
        run: |
          python local-news-os/core/repository_scope_fingerprint.py --self-test
          python local-news-os/core/repository_scope_fingerprint.py --ref HEAD --output /tmp/civora-scope.json
          cat /tmp/civora-scope.json
      - name: Validate production and test instances
        run: python local-news-os/core/validate_instance_config.py
      - name: Assert fixture packs are isolated
        shell: bash
        run: |
          set -euo pipefail
          test -f local-news-os/instances/valcea/instance.json
          test -f local-news-os/instances/test-local/instance.json
          test -f local-news-os/instances/test-local/fixtures/source_pack.json
          test -f local-news-os/instances/test-local/fixtures/brand_pack.json
          test -f local-news-os/instances/test-local/fixtures/geography_pack.json
          ! grep -Eiq 'vâlcea|valcea|ramnicu|râmnicu|valceaclar\.ro' \
            local-news-os/instances/test-local/fixtures/source_pack.json \
            local-news-os/instances/test-local/fixtures/brand_pack.json \
            local-news-os/instances/test-local/fixtures/geography_pack.json
      - name: Build both instances with the same generic engine
        run: |
          python local-news-os/core/build_instance_manifest.py valcea --output /tmp/valcea-manifest.json
          python local-news-os/core/build_instance_manifest.py test-local --output /tmp/test-local-manifest.json
          cat /tmp/valcea-manifest.json
          cat /tmp/test-local-manifest.json
      - name: Resolve both Source Packs with the same generic engine
        run: |
          python local-news-os/core/resolve_source_pack.py valcea --output /tmp/valcea-sources.json
          python local-news-os/core/resolve_source_pack.py test-local --output /tmp/test-local-sources.json
          cat /tmp/valcea-sources.json
          cat /tmp/test-local-sources.json
      - name: Validate instance-aware discovery migration adapter
        run: |
          python local-news-os/core/discover_primary_source_facts.py --self-test
          python local-news-os/core/discovery_health.py --self-test
          python local-news-os/core/discover_primary_source_facts.py --instance valcea --validate-only
          python local-news-os/core/discover_primary_source_facts.py --instance test-local --validate-only
      - name: Validate generic multi-instance edition engine
        run: python local-news-os/core/generate_verified_edition.py --self-test
      - name: Validate generic multi-instance frontpage renderer
        run: python local-news-os/core/render_frontpage.py --self-test
      - name: Validate generic related-story ranking
        run: python local-news-os/core/related_stories.py --self-test
      - name: Validate generic NewsArticle structured data
        run: python local-news-os/core/article_structured_data.py --self-test
      - name: Validate generic provenance-backed story media
        run: python local-news-os/core/verified_story_media.py --self-test
      - name: Prove runtime, identity and source isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          valcea = json.loads(Path('/tmp/valcea-manifest.json').read_text(encoding='utf-8'))
          test = json.loads(Path('/tmp/test-local-manifest.json').read_text(encoding='utf-8'))
          valcea_sources = json.loads(Path('/tmp/valcea-sources.json').read_text(encoding='utf-8'))
          test_sources = json.loads(Path('/tmp/test-local-sources.json').read_text(encoding='utf-8'))

          assert valcea['instance_id'] == 'valcea'
          assert test['instance_id'] == 'test-local'
          assert valcea['canonical_domain'] != test['canonical_domain']
          assert valcea['runtime']['state_root'] != test['runtime']['state_root']
          assert valcea['runtime']['output_root'] != test['runtime']['output_root']
          assert valcea['config_sha256'] != test['config_sha256']
          assert valcea['policies']['zero_paid_dependency'] is True
          assert test['policies']['zero_paid_dependency'] is True
          assert valcea['policies']['llm_required'] is False
          assert test['policies']['llm_required'] is False

          assert valcea_sources['contract'] == 'SOURCE_PACK_V1'
          assert test_sources['contract'] == 'SOURCE_PACK_V1'
          assert valcea_sources['instance_id'] == 'valcea'
          assert test_sources['instance_id'] == 'test-local'
          assert valcea_sources['source_count'] >= 16
          assert test_sources['source_count'] == 2
          assert valcea_sources['resolved_sha256'] != test_sources['resolved_sha256']
          assert valcea_sources['material_detail_autopublish'] is False
          assert test_sources['material_detail_autopublish'] is False

          serialized = json.dumps({'manifest': test, 'sources': test_sources}, ensure_ascii=False).lower()
          for forbidden in ('vâlcea', 'valcea', 'râmnicu', 'ramnicu', 'valceaclar.ro'):
              assert forbidden not in serialized, forbidden
          print('DUAL_INSTANCE_SOURCE_ISOLATION_PASS')
          PY
