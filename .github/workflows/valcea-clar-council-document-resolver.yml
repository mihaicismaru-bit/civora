name: VÂLCEA CLAR Council Document Resolver

on:
  workflow_dispatch:
  schedule:
    - cron: '6,21,36,51 * * * *'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/council_watch_rm_valcea_v2.py'
      - 'valcea-clar/scripts/council_decision_document_resolver.py'
      - 'valcea-clar/scripts/council_docmanager_row_resolver.py'
      - 'valcea-clar/scripts/council_docmanager_embedded_resolver.py'
      - 'valcea-clar/editorial/council_watch_rm_valcea_state.json'
      - '.github/workflows/valcea-clar-council-document-resolver.yml'
  pull_request:
    paths:
      - 'valcea-clar/scripts/council_watch_rm_valcea_v2.py'
      - 'valcea-clar/scripts/council_decision_document_resolver.py'
      - '.github/workflows/valcea-clar-council-document-resolver.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-council-document-resolver-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate generic document resolver
        run: |
          python -m py_compile \
            valcea-clar/scripts/council_watch_rm_valcea_v2.py \
            valcea-clar/scripts/council_decision_document_resolver.py \
            valcea-clar/scripts/council_docmanager_row_resolver.py \
            valcea-clar/scripts/council_docmanager_embedded_resolver.py
          python valcea-clar/scripts/council_watch_rm_valcea_v2.py --self-test
          python valcea-clar/scripts/council_docmanager_row_resolver.py --resolver-self-test
          python valcea-clar/scripts/council_docmanager_embedded_resolver.py --resolver-self-test
          python valcea-clar/scripts/council_decision_document_resolver.py --self-test

      - name: Select latest official adopted-decision date
        if: github.event_name != 'pull_request'
        run: python valcea-clar/scripts/council_watch_rm_valcea_v2.py

      - name: Resolve latest-meeting full official HCL documents
        if: github.event_name != 'pull_request'
        run: python valcea-clar/scripts/council_decision_document_resolver.py --live --apply

      - name: Persist document corpus and enriched council state conflict-safe
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/editorial/council_watch_rm_valcea_state.json /tmp/council-resolved-state.json
          cp valcea-clar/editorial/council_decision_document_corpus.json /tmp/council-document-corpus.json
          git config user.name 'valcea-clar-council-documents[bot]'
          git config user.email 'valcea-clar-council-documents@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/council-resolved-state.json valcea-clar/editorial/council_watch_rm_valcea_state.json
            cp /tmp/council-document-corpus.json valcea-clar/editorial/council_decision_document_corpus.json
            git add \
              valcea-clar/editorial/council_watch_rm_valcea_state.json \
              valcea-clar/editorial/council_decision_document_corpus.json
            if git diff --cached --quiet; then
              echo 'Council document corpus already current.'
              exit 0
            fi
            git commit -m 'Resolve VÂLCEA CLAR official HCL document corpus'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          echo '## VÂLCEA CLAR Council Document Resolver' >> "$GITHUB_STEP_SUMMARY"
          echo 'Target selection: newest date present in the official adopted-HCL register.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f valcea-clar/editorial/council_decision_document_corpus.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path('valcea-clar/editorial/council_decision_document_corpus.json').read_text(encoding='utf-8'))
          print(f"Meeting: {d.get('meeting_date')}  ")
          print(f"Requested: {d.get('requested')}  ")
          print(f"Row URLs resolved: {d.get('row_urls_resolved')}  ")
          print(f"Full documents resolved: {d.get('documents_resolved')}  ")
          for row in d.get('documents') or []:
              print(f"- HCL {row.get('decision_number')}: {'PASS' if row.get('resolved') else 'HOLD'} — {row.get('reason')}")
          PY
          fi
