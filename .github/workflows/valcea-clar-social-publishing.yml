name: VÂLCEA CLAR Social Publication Engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "valcea-clar/social/*.py"
      - "valcea-clar/social/channels/**"
      - "valcea-clar/social/story_visuals.json"
      - "valcea-clar/site/story_publication_event.json"
      - "local-news-os/social/**"
      - ".github/workflows/valcea-clar-social-publishing.yml"
  push:
    branches: [main]
    paths:
      - "valcea-clar/social/*.py"
      - "valcea-clar/social/channels/**"
      - "valcea-clar/social/story_visuals.json"
      - "valcea-clar/site/story_publication_event.json"
      - "local-news-os/social/**"
      - ".github/workflows/valcea-clar-social-publishing.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: valcea-clar-social-publication-engine
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic editorial renderer dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Refresh latest canonical main state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Enforce site-engine-only social ownership
        run: |
          python valcea-clar/social/validate_social_engine.py --report /tmp/social-engine-ownership.json
          python valcea-clar/scripts/validate_site_engine_ownership.py

      - name: Validate all configured CHANNEL_CONFIG files
        run: |
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/facebook.json --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/instagram.json --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/tiktok.json --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/youtube.json --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/threads.json --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/x.json --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/linkedin.json --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/telegram.json --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/whatsapp.json --instance-root valcea-clar

      - name: Build channel-native packages from live stories
        run: python valcea-clar/social/build_live_story_outbox.py

      - name: Build story products for outbox-only sister publications
        run: python valcea-clar/social/build_outbox_only_story_products.py

      - name: Verify durable X materialization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          outbox=json.loads(Path('valcea-clar/social/x_outbox.json').read_text(encoding='utf-8'))
          state=json.loads(Path('valcea-clar/social/x_state.json').read_text(encoding='utf-8'))
          if outbox.get('platform')!='x' or outbox.get('publication_model')!='continuous_story_first':
              raise SystemExit('X outbox identity/model mismatch')
          if state.get('platform')!='x' or state.get('publication_model')!='continuous_story_first':
              raise SystemExit('X state identity/model mismatch')
          if state.get('direct_publication_enabled') is not False:
              raise SystemExit('X falsely claims direct publication')
          if state.get('blocker')!='x_api_pay_per_use_conflicts_zero_paid_dependency':
              raise SystemExit('X zero-paid blocker missing')
          for item in outbox.get('items',[]):
              if not isinstance(item,dict): raise SystemExit('X non-object item')
              if item.get('publication_mode')!='durable_outbox_only': raise SystemExit('X direct mode leak')
              if item.get('verbatim_cross_platform_reuse_allowed') is not False: raise SystemExit('X cross-post reuse enabled')
              posts=item.get('posts')
              if not isinstance(posts,list) or not 1 <= len(posts) <= 4: raise SystemExit('X thread size invalid')
              if any(len(str(post))>260 for post in posts): raise SystemExit('X internal post budget exceeded')
          print(f"X materialization: PASS ({len(outbox.get('items',[]))} products)")
          PY

      - name: Verify durable WhatsApp materialization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          outbox=json.loads(Path('valcea-clar/social/whatsapp_outbox.json').read_text(encoding='utf-8'))
          state=json.loads(Path('valcea-clar/social/whatsapp_state.json').read_text(encoding='utf-8'))
          registry=json.loads(Path('valcea-clar/social/series_registry.json').read_text(encoding='utf-8'))
          if outbox.get('platform')!='whatsapp' or outbox.get('publication_model')!='continuous_story_first': raise SystemExit('WhatsApp outbox mismatch')
          if state.get('platform')!='whatsapp' or state.get('publication_model')!='continuous_story_first': raise SystemExit('WhatsApp state mismatch')
          expected={'valcea-esential','weekend-in-valcea'}
          actual={row.get('series_id') for row in registry.get('channels',{}).get('valcea-whatsapp',[]) if isinstance(row,dict)}
          if actual!=expected: raise SystemExit(f'WhatsApp series mismatch: {sorted(actual)}')
          for item in outbox.get('items',[]):
              if not isinstance(item,dict): raise SystemExit('WhatsApp non-object item')
              if item.get('native_format')!='text' or item.get('format_family')!='message_update': raise SystemExit('WhatsApp native format mismatch')
              if item.get('fake_urgency_forbidden') is not True: raise SystemExit('WhatsApp urgency guard missing')
              if item.get('verbatim_cross_platform_reuse_allowed') is not False: raise SystemExit('WhatsApp cross-post guard missing')
              if item.get('recipient_scope_required_before_dispatch') is not True: raise SystemExit('WhatsApp recipient gate missing')
          print(f"WhatsApp materialization: PASS ({len(outbox.get('items',[]))} products; {len(actual)} series)")
          PY

      - name: Fetch approved real photographs
        run: python valcea-clar/social/fetch_approved_photos.py

      - name: Build valceaclar.ro social media assets
        run: python valcea-clar/social/build_social_media_assets.py

      - name: Compile and self-test all active adapters
        run: |
          python -m py_compile \
            valcea-clar/social/social_common.py \
            valcea-clar/social/meta_auth_health.py \
            valcea-clar/social/build_live_story_outbox.py \
            valcea-clar/social/build_outbox_only_story_products.py \
            valcea-clar/social/build_social_media_assets.py \
            valcea-clar/social/editorial_asset_contract.py \
            valcea-clar/social/facebook_editorial_preview.py \
            valcea-clar/social/facebook_editorial_preview_v1_1.py \
            valcea-clar/social/facebook_editorial_publish.py \
            valcea-clar/social/facebook_publish.py \
            valcea-clar/social/instagram_editorial_v1.py \
            valcea-clar/social/instagram_editorial_v1_1.py \
            valcea-clar/social/instagram_editorial_v1_2.py \
            valcea-clar/social/instagram_editorial_publish.py \
            valcea-clar/social/instagram_publish.py \
            valcea-clar/social/tiktok_publish.py
          python valcea-clar/social/meta_auth_health.py --self-test
          python valcea-clar/social/build_social_media_assets.py --self-test
          python valcea-clar/social/facebook_publish.py --self-test
          python valcea-clar/social/instagram_publish.py --self-test
          python valcea-clar/social/tiktok_publish.py --self-test

      - name: Probe shared Meta credential health
        id: meta_auth
        if: github.event_name != 'pull_request'
        env:
          VALCEA_FB_PAGE_ID: "1234360446430980"
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/meta_auth_health.py | tee /tmp/meta-auth.json

      - name: Record Meta preview-only state
        if: github.event_name == 'pull_request'
        run: printf '%s\n' '{"status":"PREVIEW_ONLY","facebook_ready":false,"instagram_ready":false}' > /tmp/meta-auth.json

      - name: Preview Facebook editorial queue
        id: preview_facebook
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/facebook_editorial_publish.py | tee /tmp/facebook-preview.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path('/tmp/facebook-preview.json').read_text(encoding='utf-8')); e=p.get('eligible') or []
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f"has_eligible={'true' if len(e) else 'false'}\n")
          PY

      - name: Preview Instagram editorial queue
        id: preview_instagram
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/instagram_editorial_publish.py | tee /tmp/instagram-preview.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path('/tmp/instagram-preview.json').read_text(encoding='utf-8')); e=p.get('eligible') or []
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f"has_eligible={'true' if len(e) else 'false'}\n")
          PY

      - name: Preview TikTok queue
        id: preview_tiktok
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/tiktok_publish.py | tee /tmp/tiktok-preview.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path('/tmp/tiktok-preview.json').read_text(encoding='utf-8')); e=p.get('eligible') or []
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f"has_eligible={'true' if len(e) else 'false'}\n")
          PY

      - name: Publish eligible Facebook editorial story through Meta Graph API
        id: publish_facebook
        if: github.event_name != 'pull_request' && steps.preview_facebook.outputs.has_eligible == 'true'
        continue-on-error: true
        env:
          VALCEA_FB_PAGE_ID: "1234360446430980"
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
          VALCEA_FB_EDITORIAL_LIVE_ENABLED: "true"
          VALCEA_FB_EDITORIAL_MAX_PER_RUN: "1"
        run: python valcea-clar/social/facebook_editorial_publish.py --apply | tee /tmp/facebook-apply.json

      - name: Record skipped Facebook apply
        if: github.event_name == 'pull_request' || steps.preview_facebook.outputs.has_eligible != 'true'
        run: cp /tmp/facebook-preview.json /tmp/facebook-apply.json

      - name: Publish eligible Instagram editorial story through Meta Graph API
        id: publish_instagram
        if: github.event_name != 'pull_request' && steps.preview_instagram.outputs.has_eligible == 'true'
        continue-on-error: true
        env:
          VALCEA_IG_ACCOUNT_ID: ${{ steps.meta_auth.outputs.ig_account_id || vars.VALCEA_IG_ACCOUNT_ID }}
          VALCEA_IG_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN || secrets.VALCEA_IG_ACCESS_TOKEN || secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_IG_GRAPH_VERSION: v26.0
          VALCEA_IG_GRAPH_HOST: graph.facebook.com
          VALCEA_IG_EDITORIAL_LIVE_ENABLED: "true"
          VALCEA_IG_EDITORIAL_MAX_PER_RUN: "1"
        run: python valcea-clar/social/instagram_editorial_publish.py --apply | tee /tmp/instagram-apply.json

      - name: Record skipped Instagram apply
        if: github.event_name == 'pull_request' || steps.preview_instagram.outputs.has_eligible != 'true'
        run: cp /tmp/instagram-preview.json /tmp/instagram-apply.json

      - name: Publish eligible TikTok story through Content Posting API
        id: publish_tiktok
        if: github.event_name != 'pull_request' && steps.preview_tiktok.outputs.has_eligible == 'true'
        continue-on-error: true
        env:
          VALCEA_TIKTOK_ACCESS_TOKEN: ${{ secrets.VALCEA_TIKTOK_ACCESS_TOKEN }}
          VALCEA_TIKTOK_PUBLIC_POSTING_APPROVED: ${{ vars.VALCEA_TIKTOK_PUBLIC_POSTING_APPROVED }}
          VALCEA_TIKTOK_MAX_PER_RUN: "1"
        run: python valcea-clar/social/tiktok_publish.py --apply | tee /tmp/tiktok-apply.json

      - name: Record skipped TikTok apply
        if: github.event_name == 'pull_request' || steps.preview_tiktok.outputs.has_eligible != 'true'
        run: cp /tmp/tiktok-preview.json /tmp/tiktok-apply.json

      - name: Persist canonical social state and public media conflict-safe
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            valcea-clar/social/facebook_outbox.json
            valcea-clar/social/facebook_state.json
            valcea-clar/social/meta_auth_state.json
            valcea-clar/social/instagram_state.json
            valcea-clar/social/tiktok_state.json
            valcea-clar/social/threads_outbox.json
            valcea-clar/social/threads_state.json
            valcea-clar/social/x_outbox.json
            valcea-clar/social/x_state.json
            valcea-clar/social/linkedin_outbox.json
            valcea-clar/social/linkedin_state.json
            valcea-clar/social/telegram_outbox.json
            valcea-clar/social/telegram_state.json
            valcea-clar/social/whatsapp_outbox.json
            valcea-clar/social/whatsapp_state.json
            valcea-clar/social/youtube_outbox.json
            valcea-clar/social/youtube_state.json
            valcea-clar/social/real_photo_replacement_queue.json
            valcea-clar/social/social_media_manifest.json
          )
          media_dir="valcea-clar/site/runtime/media/social"
          instagram_export_dir="valcea-clar/dist/chatgpt-sites/media/social/editorial/instagram"
          rm -rf /tmp/valcea-social-state
          mkdir -p /tmp/valcea-social-state
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then mkdir -p "/tmp/valcea-social-state/$(dirname "$file")"; cp "$file" "/tmp/valcea-social-state/$file"; fi
          done
          for dir in "$media_dir" "$instagram_export_dir"; do
            if [ -d "$dir" ]; then mkdir -p "/tmp/valcea-social-state/$(dirname "$dir")"; cp -a "$dir" "/tmp/valcea-social-state/$dir"; fi
          done
          git config user.name "valcea-clar-social-engine[bot]"
          git config user.email "valcea-clar-social-engine@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              if [ -f "/tmp/valcea-social-state/$file" ]; then mkdir -p "$(dirname "$file")"; cp "/tmp/valcea-social-state/$file" "$file"; git add "$file"; fi
            done
            for dir in "$media_dir" "$instagram_export_dir"; do
              if [ -d "/tmp/valcea-social-state/$dir" ]; then rm -rf "$dir"; mkdir -p "$(dirname "$dir")"; cp -a "/tmp/valcea-social-state/$dir" "$dir"; git add "$dir"; fi
            done
            if git diff --cached --quiet; then echo "No VÂLCEA CLAR social-engine changes to persist."; exit 0; fi
            git commit -m "Persist VÂLCEA CLAR story-first social state"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Write social-engine summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          def read(name):
              p=Path('/tmp')/name
              if not p.exists(): return {'status':'NOT_RUN'}
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc: return {'status':'UNREADABLE','error':str(exc)}
          ownership=read('social-engine-ownership.json'); meta=read('meta-auth.json')
          fb=read('facebook-apply.json'); ig=read('instagram-apply.json'); tt=read('tiktok-apply.json')
          lines=[
              '# VÂLCEA CLAR — Story-first Social Publication Engine','',
              '- Publication unit: **individual story**',
              '- Edition/recap publication gate: **disabled**',
              '- Facebook: **editorial-composite native packaging v1**',
              '- Instagram: **editorial cover/carousel native packaging v1; public-media preflight**',
              '- Threads: **story-first durable outbox**',
              '- X: **platform-native source-forward durable outbox; direct API disabled under zero-paid policy**',
              '- LinkedIn: **story-first durable outbox**',
              '- Telegram: **story-first durable outbox; no direct-access claim**',
              '- WhatsApp: **story-first durable outbox; recipient scope + direct access remain gated**',
              '- YouTube: **story-first durable outbox, HOLD until real video + upload access**',
              f"- Ownership: **{ownership.get('status','UNAVAILABLE')}**",
              f"- Meta auth: **{meta.get('status','UNKNOWN')}**",
              f"- Facebook: **{fb.get('status','UNKNOWN')}**",
              f"- Instagram: **{ig.get('status','UNKNOWN')}**",
              f"- TikTok: **{tt.get('status','UNKNOWN')}**",
              '- Missing story-specific media holds only the affected visual channel; it never delays the site story.'
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Upload social-engine audit and runtime payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-social-engine-${{ github.run_id }}
          path: |
            /tmp/social-engine-ownership.json
            /tmp/meta-auth.json
            /tmp/facebook-preview.json
            /tmp/instagram-preview.json
            /tmp/tiktok-preview.json
            /tmp/facebook-apply.json
            /tmp/instagram-apply.json
            /tmp/tiktok-apply.json
            valcea-clar/social/meta_auth_state.json
            valcea-clar/social/threads_outbox.json
            valcea-clar/social/x_outbox.json
            valcea-clar/social/x_state.json
            valcea-clar/social/linkedin_outbox.json
            valcea-clar/social/telegram_outbox.json
            valcea-clar/social/whatsapp_outbox.json
            valcea-clar/social/whatsapp_state.json
            valcea-clar/social/youtube_outbox.json
            valcea-clar/social/social_media_manifest.json
            valcea-clar/site/runtime/media/social/editorial
            valcea-clar/dist/chatgpt-sites/media/social/editorial/instagram
            valcea-clar/dist/chatgpt-sites/media/social
          if-no-files-found: warn
          retention-days: 14

      - name: Fail after persistence on hard platform errors
        if: always() && github.event_name != 'pull_request'
        env:
          FACEBOOK_OUTCOME: ${{ steps.publish_facebook.outcome }}
          INSTAGRAM_OUTCOME: ${{ steps.publish_instagram.outcome }}
          TIKTOK_OUTCOME: ${{ steps.publish_tiktok.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for outcome in "$FACEBOOK_OUTCOME" "$INSTAGRAM_OUTCOME" "$TIKTOK_OUTCOME"; do
            if [ "$outcome" = "failure" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
