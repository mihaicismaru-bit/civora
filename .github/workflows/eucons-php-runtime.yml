name: EUCONS PHP Runtime

on:
  pull_request:
    paths:
      - 'eucons/runtime/php/**'
      - 'eucons/deployment/activate_php_runtime.py'
      - 'eucons/validation/validate_php_runtime.py'
      - 'eucons/validation/test_php_runtime.php'
      - 'eucons/validation/test_php_commercial_runtime.php'
      - 'eucons/validation/test_php_research_runtime.php'
      - 'eucons/validation/test_php_research_channel_gate.php'
      - 'eucons/validation/test_php_research_governance_gate.php'
      - 'eucons/leads/lead_contract.json'
      - 'eucons/leads/forms.json'
      - 'eucons/crm/**'
      - 'eucons/email/**'
      - 'eucons/security/privacy_security_contract.json'
      - '.github/workflows/eucons-php-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/runtime/php/**'
      - 'eucons/deployment/activate_php_runtime.py'
      - 'eucons/validation/validate_php_runtime.py'
      - 'eucons/validation/test_php_runtime.php'
      - 'eucons/validation/test_php_commercial_runtime.php'
      - 'eucons/validation/test_php_research_runtime.php'
      - 'eucons/validation/test_php_research_channel_gate.php'
      - 'eucons/validation/test_php_research_governance_gate.php'
      - 'eucons/leads/lead_contract.json'
      - 'eucons/leads/forms.json'
      - 'eucons/crm/**'
      - 'eucons/email/**'
      - 'eucons/security/privacy_security_contract.json'
      - '.github/workflows/eucons-php-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require PHP CLI
        run: php -v
      - name: Lint PHP runtime
        run: |
          php -l eucons/runtime/php/src/LeadRuntime.php
          php -l eucons/runtime/php/src/CrmRuntime.php
          php -l eucons/runtime/php/src/RetentionRuntime.php
          php -l eucons/runtime/php/src/MailRuntime.php
          php -l eucons/runtime/php/src/ResearchRuntime.php
          php -l eucons/runtime/php/src/ResearchChannelGate.php
          php -l eucons/runtime/php/src/ResearchGovernanceGate.php
          php -l eucons/runtime/php/public/index.php
          php -l eucons/runtime/php/maintenance.php
          php -l eucons/validation/test_php_runtime.php
          php -l eucons/validation/test_php_commercial_runtime.php
          php -l eucons/validation/test_php_research_runtime.php
          php -l eucons/validation/test_php_research_channel_gate.php
          php -l eucons/validation/test_php_research_governance_gate.php
      - name: Test PHP lead runtime fail-closed behavior
        run: php eucons/validation/test_php_runtime.php
      - name: Test PHP commercial runtime fail-closed behavior
        run: php eucons/validation/test_php_commercial_runtime.php
      - name: Test AI4WORK research runtime minimization and separation
        run: php eucons/validation/test_php_research_runtime.php
      - name: Test AI4WORK research channel provenance gate
        run: php eucons/validation/test_php_research_channel_gate.php
      - name: Test AI4WORK live GDPR governance activation gate
        run: php eucons/validation/test_php_research_governance_gate.php
      - name: Require research route to enforce governance and approved channel before persistence
        run: |
          grep -F "ResearchGovernanceGate.php" eucons/runtime/php/public/index.php
          grep -F "productionReady" eucons/runtime/php/public/index.php
          grep -F "ResearchChannelGate.php" eucons/runtime/php/public/index.php
          grep -F "COLLECTION_CHANNEL_REGISTER_DRAFT.json" eucons/runtime/php/public/index.php
          grep -F "assertApprovedRecord" eucons/runtime/php/public/index.php
      - name: Validate PHP runtime and activated public build
        run: python eucons/validation/validate_php_runtime.py
