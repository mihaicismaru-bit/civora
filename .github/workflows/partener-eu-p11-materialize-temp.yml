name: PARTENER.EU P11 Materialize TEMP

on:
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/p11/**'
      - '.github/workflows/partener-eu-p11-materialize-temp.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-p11-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Materialize deterministic P11 artifacts
        run: |
          python partener-eu/p11/apply_resolutions.py
          python partener-eu/p11/build_public_projection.py
      - name: Persist P11 generated artifacts
        shell: bash
        run: |
          git config user.name "civora-partener-bot"
          git config user.email "civora-partener-bot@users.noreply.github.com"
          git add partener-eu/p11/opportunity_bundle.json partener-eu/web/p11-public-data.js
          if git diff --cached --quiet; then
            echo "P11 artifacts already current."
            exit 0
          fi
          git commit -m "PARTENER: materialize hardened FAMI P11 artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
