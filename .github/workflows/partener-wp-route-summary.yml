name: PARTENER WordPress Route Summary

on:
  workflow_dispatch:
  push:
    branches:
      - agent/mipe-resilient-ingestion-v2
    paths:
      - '.github/workflows/partener-wp-route-summary.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Summarize non-core WordPress REST routes
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://partener.eu/wp-json/'
          req=urllib.request.Request(url,headers={'User-Agent':'PARTENER.EU-CIVORA-Diagnostic/2.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r:
              root=json.load(r)
          routes=sorted((root.get('routes') or {}).keys())
          core_prefixes=('/wp/','/oembed/','/batch/','/wp-site-health/','/wp-block-editor/','/wp/v2/')
          noncore=[x for x in routes if not x.startswith(core_prefixes)]
          interesting=[x for x in routes if any(k in x.lower() for k in ('mipe','civora','partener','ingest','relay','fetch','proxy','remote','news','local'))]
          print(json.dumps({
              'site':root.get('name'),
              'url':root.get('url'),
              'namespaces':root.get('namespaces'),
              'routeCount':len(routes),
              'interesting':interesting,
              'nonCore':noncore,
          },ensure_ascii=False,indent=2))
          PY
