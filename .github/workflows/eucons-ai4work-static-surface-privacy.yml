name: EUCONS AI4WORK Static Surface Privacy Gate

on:
  pull_request:
    paths:
      - 'eucons/research/ai4work-step/**'
      - 'eucons/runtime/php/**'
      - '.github/workflows/eucons-ai4work-static-surface-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-surface-privacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eucons/research/ai4work-step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static research privacy-surface control
        run: python static_surface_privacy_control.py --json
      - name: Run static research privacy-surface tests
        run: python -m unittest -v test_static_surface_privacy_control.py
