name: VÂLCEA CLAR Core v2 Executor Parity

on:
  push:
    branches:
      - 'rebuild/valcea-clar-core-v2-*'
    paths:
      - 'valcea-clar/core_v2/**'
      - '.github/workflows/valcea-clar-core-v2-executor-parity.yml'
  pull_request:
    paths:
      - 'valcea-clar/core_v2/**'
      - '.github/workflows/valcea-clar-core-v2-executor-parity.yml'

permissions:
  contents: read

jobs:
  executor-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install deterministic PDF and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils imagemagick
          pdftotext -v
          convert -version

      - name: Run one Core v2 read-only orchestrator executor
        env:
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
        run: |
          python valcea-clar/core_v2/orchestrator.py \
            --run-bounded-cycle \
            --live \
            --repo-root . \
            --workdir /tmp \
            --output /tmp/valcea-core-v2-cycle.json

      - name: Verify executor truth boundary and Meta read-only plumbing
        run: |
          python valcea-clar/core_v2/executor_parity_contract.py \
            --cycle /tmp/valcea-core-v2-cycle.json \
            --sequence /tmp/valcea-core-v2-external-evidence-sequence.json \
            --meta /tmp/valcea-core-v2-meta-readback.json \
            --output /tmp/valcea-core-v2-executor-parity-contract.json

      - name: Upload executor parity evidence
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-core-v2-executor-parity-${{ github.run_id }}
          path: |
            /tmp/valcea-core-v2-cycle.json
            /tmp/valcea-core-v2-external-evidence-sequence.json
            /tmp/valcea-core-v2-executor-parity-contract.json
            /tmp/valcea-core-v2-shadow-candidates.json
            /tmp/valcea-core-v2-site-readback.json
            /tmp/valcea-core-v2-visual-readback.json
            /tmp/valcea-core-v2-meta-readback.json
            /tmp/valcea-core-v2-instagram-visual-identity.json
            /tmp/valcea-core-v2-shadow-receipts.json
            /tmp/valcea-core-v2-historical-fact-kernels.json
            /tmp/valcea-core-v2-historical-article-claims.json
            /tmp/valcea-core-v2-shadow-transactions.json
            /tmp/valcea-core-v2-shadow-site/external-evidence/**
          if-no-files-found: error
          retention-days: 3
