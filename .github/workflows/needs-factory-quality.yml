name: Needs Factory Quality

on:
  push:
    branches:
      - 'needs-factory/**'
    paths:
      - 'partener-eu/needs-factory/**'
      - '.github/workflows/needs-factory-quality.yml'
  pull_request:
    paths:
      - 'partener-eu/needs-factory/**'
      - '.github/workflows/needs-factory-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Needs Factory core
        run: python -m compileall -q partener-eu/needs-factory/core
      - name: Run Needs Factory regression suite
        run: python -m unittest discover -s partener-eu/needs-factory/tests -v
