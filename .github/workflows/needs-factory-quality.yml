name: Needs Factory Quality

on:
  push:
    branches:
      - 'needs-factory/**'
    paths:
      - 'partener-eu/needs-factory/**'
      - '.github/workflows/needs-factory-quality.yml'
  pull_request:
    paths:
      - 'partener-eu/needs-factory/**'
      - '.github/workflows/needs-factory-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Needs Factory DOCX exporter dependency
        run: python -m pip install --disable-pip-version-check -r partener-eu/needs-factory/requirements-docx.txt
      - name: Compile Needs Factory domain, adapters and exporters
        run: python -m compileall -q partener-eu/needs-factory/core partener-eu/needs-factory/adapters partener-eu/needs-factory/exporters partener-eu/needs-factory/tools
      - name: Parse canonical JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('partener-eu/needs-factory/schemas').glob('*.json'))
          assert paths, 'No Needs Factory schemas found'
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY
      - name: Run Needs Factory regression suite
        run: python -m unittest discover -s partener-eu/needs-factory/tests -v
      - name: Verify PARTENER source-state adapter against repository state
        run: |
          python partener-eu/needs-factory/tools/source_receipt.py \
            partener-eu/validation/source_state.checkpoint.json \
            SRC-MYSMIS-CALLS \
            --output /tmp/partener-source-receipt.json
          python - <<'PY'
          import json
          receipt = json.load(open('/tmp/partener-source-receipt.json', encoding='utf-8'))
          assert receipt['health'] == 'PASS'
          assert receipt['quarantined'] is False
          assert receipt['material_fact_state'] in {'STABLE_LAST_KNOWN_GOOD', 'LAST_KNOWN_GOOD_PENDING_RECONCILIATION'}
          assert receipt['source_snapshot_id'].startswith('SRC-MYSMIS-CALLS@')
          print(receipt['source_snapshot_id'])
          PY
      - name: Run real 310224 historical research gate
        run: |
          python partener-eu/needs-factory/tools/run_research_gate_fixture.py \
            partener-eu/needs-factory/benchmarks/310224/CP08_PRODUCT_RUN_INPUT.json \
            --output /tmp/needs-factory-310224-research-gate.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/needs-factory-310224-research-gate.json', encoding='utf-8'))
          assert result['state'] == 'BLOCKED_RESEARCH'
          blocking = [g for g in result['evidence_gaps']['gaps'] if g.get('blocking')]
          assert len(blocking) == 5
          assert len(result['primary_research_plan']['questions']) == 6
          assert result['primary_research_plan']['sampling_strategy'] == 'population_snapshot_required'
          closed = set(result['run_manifest']['closed_checkpoints'])
          assert 'NF05_GAP_DETECTION' in closed
          assert 'NF06_PRIMARY_RESEARCH' in closed
          assert 'NF07_NEED_DISCOVERY' not in closed
          assert 'NF12_PACKAGE' not in closed
          print(result['run_manifest']['run_id'])
          print([g['gap_id'] for g in blocking])
          PY
      - name: Prove deterministic resume and constrained narrative after primary research
        run: |
          python partener-eu/needs-factory/tools/run_resume_fixture.py \
            partener-eu/needs-factory/tests/fixtures/primary_research_resume.json \
            --output /tmp/needs-factory-resume.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/needs-factory-resume.json', encoding='utf-8'))
          assert result['fixture_type'] == 'SYNTHETIC_ACCEPTANCE_ONLY_NOT_PROJECT_EVIDENCE'
          assert result['predecessor_state'] == 'BLOCKED_RESEARCH'
          assert result['successor_state'] == 'READY_FOR_NARRATIVE'
          assert result['predecessor_run_id'] != result['successor_run_id']
          plan = result['resume_plan']
          assert plan['restart_stage'] == 'NF06_PRIMARY_RESEARCH'
          assert plan['reusable_closed_checkpoints'] == ['NF05_GAP_DETECTION']
          assert 'NF06_PRIMARY_RESEARCH' in plan['invalidated_stages']
          assert 'NF12_PACKAGE' in plan['invalidated_stages']
          assert result['primary_evidence_count'] == 6
          assert result['unresolved_local_gaps'] == []
          assert result['compiled_narrative_valid'] is True
          assert result['compiled_need_count'] == 4
          assert result['compiled_evidence_count'] >= 6
          assert len(result['compiled_narrative_sha256']) >= 32
          assert len(result['compiled_source_register_sha256']) >= 32
          closed = set(result['successor_manifest']['closed_checkpoints'])
          assert 'NF05_GAP_DETECTION' in closed
          assert 'NF06_PRIMARY_RESEARCH' in closed
          assert 'NF12_PACKAGE' in closed
          assert result['successor_manifest']['predecessor_run_id'] == result['predecessor_run_id']
          print(result['predecessor_run_id'])
          print(result['successor_run_id'])
          print(result['narrative_pack_sha256'])
          print(result['compiled_narrative_sha256'])
          PY
      - name: Run deterministic pipeline through NF12, narrative and DOCX package export
        run: |
          rm -rf /tmp/needs-factory-export
          python partener-eu/needs-factory/tools/run_fixture.py \
            partener-eu/needs-factory/tests/fixtures/pipeline_smoke.json \
            --output /tmp/needs-factory-smoke-manifest.json \
            --export-dir /tmp/needs-factory-export
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.load(open('/tmp/needs-factory-smoke-manifest.json', encoding='utf-8'))
          assert manifest['release_gate']['ready_for_narrative'] is True
          assert manifest['run_id'].startswith('NF-')
          assert 'NF12_PACKAGE' in manifest['closed_checkpoints']
          assert manifest['narrative_claim_count'] == 2
          assert len(manifest['narrative_pack_sha256']) >= 32
          assert manifest['compiled_narrative_valid'] is True
          assert manifest['compiled_need_count'] == 2
          assert manifest['compiled_evidence_count'] == 2
          assert len(manifest['compiled_narrative_sha256']) >= 32
          assert len(manifest['compiled_source_register_sha256']) >= 32
          export_manifest = manifest['export_manifest']
          assert export_manifest is not None
          analysis_validation = export_manifest['docx_validation']['ANALIZA_NEVOI.docx']
          assert analysis_validation['valid'] is True
          assert analysis_validation['need_marker_count'] == 2
          assert analysis_validation['evidence_marker_count'] == 4
          assert analysis_validation['interpretation_limit_count'] == 2
          assert export_manifest['docx_validation']['SOURCE_REGISTER.docx']['valid'] is True
          assert len(export_manifest['files']['ANALIZA_NEVOI.docx']['sha256']) == 64
          assert len(export_manifest['files']['SOURCE_REGISTER.docx']['sha256']) == 64
          assert len(export_manifest['package_zip']['sha256']) == 64
          for name in ['ANALIZA_NEVOI.md','ANALIZA_NEVOI.docx','SOURCE_REGISTER.md','SOURCE_REGISTER.docx','PACKAGE_MANIFEST.json','ANALIZA_NEVOI_PACKAGE.zip']:
              assert (Path('/tmp/needs-factory-export') / name).exists(), name
          print(manifest['run_id'])
          print(export_manifest['files']['ANALIZA_NEVOI.docx']['sha256'])
          print(export_manifest['files']['SOURCE_REGISTER.docx']['sha256'])
          print(export_manifest['package_zip']['sha256'])
          PY
