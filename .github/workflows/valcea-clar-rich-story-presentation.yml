name: VÂLCEA CLAR Rich Story Presentation Compatibility Check

# Compatibility validator only. Structured fact boxes/sections are now applied
# inside overlay_runtime_export.py, the single canonical presentation boundary.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/editorial/facts_registry.json'
      - 'valcea-clar/scripts/render_rich_story_sections.py'
      - 'valcea-clar/scripts/overlay_runtime_export.py'
      - '.github/workflows/valcea-clar-rich-story-presentation.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-rich-story-presentation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate structured story renderer
        run: |
          python -m py_compile valcea-clar/scripts/render_rich_story_sections.py
          python valcea-clar/scripts/render_rich_story_sections.py --self-test
