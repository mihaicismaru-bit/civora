name: EUCONS Match Operator Explainability

on:
  pull_request:
    paths:
      - 'eucons/opportunities/match_operator_explainability_contract.json'
      - 'eucons/opportunities/match_operator_explainability.py'
      - 'eucons/validation/test_match_operator_explainability_fail_closed.py'
      - 'eucons/opportunities/matching_contract.json'
      - 'eucons/opportunities/match_opportunities.py'
      - 'eucons/opportunities/official_source_operator_queue_contract.json'
      - 'eucons/opportunities/official_source_operator_queue.py'
      - 'eucons/validation/test_opportunity_matching_fail_closed.py'
      - 'eucons/validation/test_official_source_operator_queue_fail_closed.py'
      - '.github/workflows/eucons-match-operator-explainability.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/opportunities/match_operator_explainability_contract.json'
      - 'eucons/opportunities/match_operator_explainability.py'
      - 'eucons/validation/test_match_operator_explainability_fail_closed.py'
      - 'eucons/opportunities/matching_contract.json'
      - 'eucons/opportunities/match_opportunities.py'
      - 'eucons/opportunities/official_source_operator_queue_contract.json'
      - 'eucons/opportunities/official_source_operator_queue.py'
      - 'eucons/validation/test_opportunity_matching_fail_closed.py'
      - 'eucons/validation/test_official_source_operator_queue_fail_closed.py'
      - '.github/workflows/eucons-match-operator-explainability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-match-operator-explainability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile explainability engine
        run: python -m py_compile eucons/opportunities/match_operator_explainability.py
      - name: Validate parent opportunity matching behavior
        run: python eucons/validation/test_opportunity_matching_fail_closed.py
      - name: Validate parent official-source operator queue behavior
        run: python eucons/validation/test_official_source_operator_queue_fail_closed.py
      - name: Test match operator explainability fail-closed behavior
        run: python eucons/validation/test_match_operator_explainability_fail_closed.py
