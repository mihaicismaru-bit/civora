name: EUCONS Client Finder Research Evaluation Review

on:
  pull_request:
    paths:
      - 'eucons/leads/client_finder_research_evaluation_review.py'
      - 'eucons/leads/client_finder_research_evaluation_review_contract.json'
      - 'eucons/validation/test_client_finder_research_evaluation_review_fail_closed.py'
      - '.github/workflows/eucons-client-finder-research-evaluation-review.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/leads/client_finder_research_evaluation_review.py'
      - 'eucons/leads/client_finder_research_evaluation_review_contract.json'
      - 'eucons/validation/test_client_finder_research_evaluation_review_fail_closed.py'
      - '.github/workflows/eucons-client-finder-research-evaluation-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-client-finder-research-evaluation-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Client Finder research evaluation review fail-closed behavior
        run: python eucons/validation/test_client_finder_research_evaluation_review_fail_closed.py
