name: VÂLCEA CLAR CJ Vâlcea Adopted Decision References

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/cj_valcea_adopted_decision_reference_adapter.py'
      - '.github/workflows/valcea-clar-cj-valcea-adopted-decision-reference.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/cj_valcea_adopted_decision_reference_adapter.py'
      - '.github/workflows/valcea-clar-cj-valcea-adopted-decision-reference.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-cj-valcea-adopted-decision-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile CJ Vâlcea adopted-decision reference adapter
        run: python -m py_compile valcea-clar/scripts/cj_valcea_adopted_decision_reference_adapter.py
      - name: Run CJ Vâlcea adopted-decision fail-closed regressions
        run: python valcea-clar/scripts/cj_valcea_adopted_decision_reference_adapter.py --self-test
