name: PARTENER.EU MIPE Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/mipe_ingest.py'
      - 'partener-eu/ingest/mipe_ingest_ipv4.py'
      - 'partener-eu/ingest/mipe_pdds_ingest.py'
      - 'partener-eu/ingest/mipe_browser_ingest.py'
      - 'partener-eu/ingest/mipe_known_seed_ingest.py'
      - 'partener-eu/ingest/mipe_discovery_ingest.py'
      - 'partener-eu/ingest/state/mipe_known_canonical_seeds.json'
      - 'partener-eu/ingest/state/mipe_discovery_sources.json'
      - 'partener-eu/ingest/state/pdds_webindex_seeds.json'
      - '.github/workflows/partener-eu-mipe-ingest.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-mipe-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Discover canonical MIPE URLs from official institutional sources
        run: python partener-eu/ingest/mipe_discovery_ingest.py

      - name: Run fail-closed MIPE ingestion with explicit PDDS seed
        run: python partener-eu/ingest/mipe_pdds_ingest.py

      - name: Determine whether browser escalation is required
        id: health
        shell: bash
        run: |
          STATUS=$(python - <<'PY'
          import json
          p='partener-eu/ingest/state/mipe_state.json'
          try:
              print(json.load(open(p,encoding='utf-8')).get('status',''))
          except Exception:
              print('SOURCE_UNAVAILABLE_LAST_KNOWN_GOOD_PRESERVED')
          PY
          )
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "SOURCE_UNAVAILABLE_LAST_KNOWN_GOOD_PRESERVED" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe official MIPE A-record route with TLS SNI preserved
        if: steps.health.outputs.browser == 'true'
        id: directroute
        shell: bash
        run: |
          set +e
          IP=193.151.29.8
          URL='https://mfe.gov.ro/pdds/despre-program-programare/'
          rm -f /tmp/mipe-probe.html
          CODE=$(curl --http1.1 --resolve "mfe.gov.ro:443:${IP}" -L -sS -o /tmp/mipe-probe.html -w '%{http_code}' --connect-timeout 8 --max-time 25 "$URL")
          RC=$?
          SIZE=$(test -f /tmp/mipe-probe.html && wc -c </tmp/mipe-probe.html || echo 0)
          echo "curl_rc=$RC code=$CODE bytes=$SIZE ip=$IP"
          if [ "$RC" = "0" ] && [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 400 ] 2>/dev/null && [ "$SIZE" -gt 500 ]; then
            echo "force_ip=$IP" >> "$GITHUB_OUTPUT"
            echo "MIPE_FORCE_IP=$IP" >> "$GITHUB_ENV"
          else
            echo "force_ip=" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Install browser fallback
        if: steps.health.outputs.browser == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Probe mapped canonical MIPE guide pages individually
        if: steps.health.outputs.browser == 'true'
        run: python partener-eu/ingest/mipe_known_seed_ingest.py

      - name: Re-evaluate source health after mapped seeds
        if: steps.health.outputs.browser == 'true'
        id: mappedhealth
        shell: bash
        run: |
          STATUS=$(python - <<'PY'
          import json
          print(json.load(open('partener-eu/ingest/state/mipe_state.json',encoding='utf-8')).get('status',''))
          PY
          )
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Force official MIPE extraction in real browser
        if: steps.health.outputs.browser == 'true' && steps.mappedhealth.outputs.status == 'SOURCE_UNAVAILABLE_LAST_KNOWN_GOOD_PRESERVED'
        run: python partener-eu/ingest/mipe_browser_ingest.py

      - name: Persist verified feed, discovery map and health state without stale-checkout conflicts
        shell: bash
        run: |
          set -euo pipefail
          cp partener-eu/web/mipe-news.js /tmp/mipe-news.js
          cp partener-eu/ingest/state/mipe_state.json /tmp/mipe_state.json
          cp partener-eu/ingest/state/mipe_known_canonical_seeds.json /tmp/mipe_known_canonical_seeds.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "Persistence attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mipe-news.js partener-eu/web/mipe-news.js
            cp /tmp/mipe_state.json partener-eu/ingest/state/mipe_state.json
            cp /tmp/mipe_known_canonical_seeds.json partener-eu/ingest/state/mipe_known_canonical_seeds.json
            git add partener-eu/web/mipe-news.js partener-eu/ingest/state/mipe_state.json partener-eu/ingest/state/mipe_known_canonical_seeds.json

            if git diff --cached --quiet; then
              echo 'No MIPE feed or discovery-map changes.'
              exit 0
            fi

            git commit -m 'Ingest verified MIPE updates and canonical discoveries'
            if git push origin HEAD:main; then
              echo 'MIPE outputs persisted to main.'
              exit 0
            fi

            echo 'main advanced during push; rebuilding the output-only commit on the new tip.'
            sleep $((attempt * 2))
          done

          echo 'Unable to persist MIPE outputs after five conflict-safe attempts.' >&2
          exit 1
