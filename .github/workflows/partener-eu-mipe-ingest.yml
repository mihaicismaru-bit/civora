name: PARTENER.EU MIPE Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/mipe_resilient_ingest.py'
      - 'partener-eu/ingest/mipe_discovery_ingest.py'
      - 'partener-eu/ingest/build_mysmis_consultant_registry.py'
      - 'partener-eu/ops/fix_mipe_resilient_classifier.py'
      - 'partener-eu/ops/fix_mipe_resilient_runtime.py'
      - 'partener-eu/ops/fix_mipe_content_quality.py'
      - 'partener-eu/ops/test_mipe_resilient_ingest.py'
      - 'partener-eu/ingest/state/mipe_known_canonical_seeds.json'
      - 'partener-eu/ingest/state/mipe_discovery_sources.json'
      - 'partener-eu/ingest/state/pdds_webindex_seeds.json'
      - '.github/workflows/partener-eu-mipe-ingest.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-mipe-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Discover official canonical MIPE URLs
        run: python partener-eu/ingest/mipe_discovery_ingest.py

      - name: Apply idempotent classifier, runtime and editorial-quality fixes
        run: |
          python partener-eu/ops/fix_mipe_resilient_classifier.py
          python partener-eu/ops/fix_mipe_resilient_runtime.py
          python partener-eu/ops/fix_mipe_content_quality.py

      - name: Offline policy and parser regression
        run: python partener-eu/ops/test_mipe_resilient_ingest.py

      - name: Run resilient fail-closed MIPE ingestion
        run: python partener-eu/ingest/mipe_resilient_ingest.py

      - name: Build direct MySMIS evidence for Consultant Workspace
        run: python partener-eu/ingest/build_mysmis_consultant_registry.py

      - name: Validate generated feed and Consultant evidence contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          state_path = Path('partener-eu/ingest/state/mipe_state.json')
          feed_path = Path('partener-eu/web/mipe-news.js')
          registry_path = Path('partener-eu/ingest/state/mipe_source_registry.json')
          consultant_registry_path = Path('partener-eu/web/mysmis-registry.js')
          index_path = Path('partener-eu/web/index.html')
          assert state_path.exists(), 'missing MIPE state'
          assert feed_path.exists(), 'missing MIPE feed'
          assert registry_path.exists(), 'missing MIPE source registry'
          assert consultant_registry_path.exists(), 'missing Consultant MySMIS projection'
          assert index_path.exists(), 'missing public index'

          state = json.loads(state_path.read_text(encoding='utf-8'))
          assert state.get('status') in {
              'OK',
              'OK_PROXY_VERIFIED',
              'OK_NO_NEW_RELEVANT_ITEMS',
              'DEGRADED_LAST_KNOWN_GOOD_PRESERVED',
              'SOURCE_UNAVAILABLE_LAST_KNOWN_GOOD_PRESERVED',
          }
          allowed = (
              'mfe.gov.ro', 'fonduri-ue.gov.ro', 'fonduri-ue.ro',
              'oportunitati-ue.gov.ro', 'reporting.mysmis2021.gov.ro'
          )
          boilerplate = (
              'skip to main content', 'adaugă ca sursă preferată',
              'bine ați venit pe site', 'blob:http://localhost'
          )
          for item in state.get('items', []):
              assert item.get('url', '').startswith('https://')
              assert any(host in item['url'] for host in allowed), item['url']
              assert item.get('title')
              assert item.get('retrievalTransport')
              if item.get('source') != 'MIPE / MySMIS':
                  assert item.get('decisionUseful') is True, item.get('title')
                  summary = item.get('summary', '').lower()
                  assert not any(marker in summary for marker in boilerplate), item.get('title')

          text = feed_path.read_text(encoding='utf-8')
          assert 'window.PARTENER_DATA.mipeIngestion=' in text
          assert 'window.PARTENER_DATA.mipeNews=' in text

          registry_text = consultant_registry_path.read_text(encoding='utf-8')
          marker = 'window.PARTENER_DATA.mysmisRegistry='
          assert marker in registry_text
          payload = json.loads(registry_text.split(marker, 1)[1].rsplit(';', 1)[0])
          assert payload.get('directOnly') is True
          source_url = payload.get('source', {}).get('canonicalUrl', '')
          assert urlparse(source_url).hostname == 'reporting.mysmis2021.gov.ro'
          assert payload.get('status') in {'OK_DIRECT', 'UNAVAILABLE_FAIL_CLOSED'}
          if payload.get('status') == 'OK_DIRECT':
              assert payload.get('calls'), 'direct registry must contain visible rows'
              assert payload.get('source', {}).get('retrieval') == 'CANONICAL_OFFICIAL_FETCH'
              for row in payload['calls']:
                  assert row.get('programme') and row.get('call')
                  assert row.get('officialStatus')

          index = index_path.read_text(encoding='utf-8')
          assert 'mipe-news.js?v=' in index and 'mipe-news-adapter.js?v=' in index
          print(json.dumps({
              'mipe': state.get('lastRun', {}),
              'consultantMySMIS': {
                  'status': payload.get('status'),
                  'visibleRowCount': payload.get('visibleRowCount'),
                  'validatedCallCount': payload.get('validatedCallCount'),
              },
          }, ensure_ascii=False, indent=2))
          PY

      - name: Persist verified feed, Source Registry and Consultant evidence
        shell: bash
        run: |
          set -euo pipefail
          cp partener-eu/web/mipe-news.js /tmp/mipe-news.js
          cp partener-eu/web/mysmis-registry.js /tmp/mysmis-registry.js
          cp partener-eu/ingest/state/mipe_state.json /tmp/mipe_state.json
          cp partener-eu/ingest/state/mipe_source_registry.json /tmp/mipe_source_registry.json
          cp partener-eu/ingest/state/mipe_known_canonical_seeds.json /tmp/mipe_known_canonical_seeds.json
          cp partener-eu/ingest/mipe_resilient_ingest.py /tmp/mipe_resilient_ingest.py
          python - <<'PY' > /tmp/mipe_asset_version.txt
          import re
          from pathlib import Path
          text = Path('partener-eu/web/index.html').read_text(encoding='utf-8')
          match = re.search(r'mipe-news\.js\?v=([^"\']+)', text)
          if not match:
              raise SystemExit('MIPE asset version missing from generated index')
          print(match.group(1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "Persistence attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mipe-news.js partener-eu/web/mipe-news.js
            cp /tmp/mysmis-registry.js partener-eu/web/mysmis-registry.js
            cp /tmp/mipe_state.json partener-eu/ingest/state/mipe_state.json
            cp /tmp/mipe_source_registry.json partener-eu/ingest/state/mipe_source_registry.json
            cp /tmp/mipe_known_canonical_seeds.json partener-eu/ingest/state/mipe_known_canonical_seeds.json
            cp /tmp/mipe_resilient_ingest.py partener-eu/ingest/mipe_resilient_ingest.py
            MIPE_VERSION=$(cat /tmp/mipe_asset_version.txt)
            export MIPE_VERSION
            python - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('partener-eu/web/index.html')
          text = path.read_text(encoding='utf-8')
          version = os.environ['MIPE_VERSION']
          text = re.sub(r'(mipe-news\.js\?v=)[^"\']+', rf'\g<1>{version}', text)
          text = re.sub(r'(mipe-news-adapter\.js\?v=)[^"\']+', rf'\g<1>{version}', text)
          text = re.sub(r'(mysmis-registry\.js\?v=)[^"\']+', rf'\g<1>{version}', text)
          path.write_text(text, encoding='utf-8')
          PY
            python partener-eu/ingest/intelligence_index.py
            git add \
              partener-eu/web/index.html \
              partener-eu/web/mipe-news.js \
              partener-eu/web/mysmis-registry.js \
              partener-eu/ingest/mipe_resilient_ingest.py \
              partener-eu/ingest/state/mipe_state.json \
              partener-eu/ingest/state/mipe_source_registry.json \
              partener-eu/ingest/state/mipe_known_canonical_seeds.json \
              partener-eu/ingest/state/intelligence_index.json

            if git diff --cached --quiet; then
              echo 'No MIPE feed, MySMIS projection, runtime or discovery-map changes.'
              exit 0
            fi

            git commit -m 'Ingest verified decision-useful MIPE and MySMIS updates'
            if git push origin HEAD:main; then
              echo 'MIPE and MySMIS outputs persisted to main.'
              exit 0
            fi

            echo 'main advanced during push; rebuilding output-only commit on the new tip.'
            sleep $((attempt * 2))
          done

          echo 'Unable to persist MIPE outputs after five conflict-safe attempts.' >&2
          exit 1
