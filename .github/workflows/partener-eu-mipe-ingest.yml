name: PARTENER.EU MIPE Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/mipe_direct_only_ingest.py'
      - 'partener-eu/ingest/mipe_resilient_ingest.py'
      - 'partener-eu/ingest/mipe_discovery_ingest.py'
      - 'partener-eu/ingest/normalize_mipe_health.py'
      - 'partener-eu/ingest/build_mysmis_consultant_registry.py'
      - 'partener-eu/ops/test_mipe_resilient_ingest.py'
      - 'partener-eu/ops/test_mipe_route_arbitration.py'
      - 'partener-eu/ingest/state/mipe_known_canonical_seeds.json'
      - 'partener-eu/ingest/state/mipe_discovery_sources.json'
      - 'partener-eu/ingest/state/pdds_webindex_seeds.json'
      - '.github/workflows/partener-eu-mipe-ingest.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-mipe-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Discover canonical official URLs and refresh direct MySMIS snapshot
        run: python partener-eu/ingest/mipe_discovery_ingest.py

      - name: Syntax and offline provenance regression
        run: |
          python -m py_compile partener-eu/ingest/mipe_resilient_ingest.py
          python -m py_compile partener-eu/ingest/mipe_direct_only_ingest.py
          python -m py_compile partener-eu/ingest/normalize_mipe_health.py
          python partener-eu/ops/test_mipe_resilient_ingest.py
          python partener-eu/ops/test_mipe_route_arbitration.py

      - name: Ingest MIPE with direct canonical publication provenance only
        run: python partener-eu/ingest/mipe_direct_only_ingest.py

      - name: Normalize priority source health and arbitrate authoritative direct routes
        run: python partener-eu/ingest/normalize_mipe_health.py

      - name: Build direct MySMIS evidence for Consultant Workspace
        run: python partener-eu/ingest/build_mysmis_consultant_registry.py

      - name: Validate fail-closed provenance and Consultant evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          state_path = Path('partener-eu/ingest/state/mipe_state.json')
          feed_path = Path('partener-eu/web/mipe-news.js')
          source_registry_path = Path('partener-eu/ingest/state/mipe_source_registry.json')
          consultant_registry_path = Path('partener-eu/web/mysmis-registry.js')
          index_path = Path('partener-eu/web/index.html')
          for path in (state_path, feed_path, source_registry_path, consultant_registry_path, index_path):
              assert path.exists(), f'missing artifact: {path}'

          state = json.loads(state_path.read_text(encoding='utf-8'))
          assert state.get('status') in {
              'OK',
              'OK_NO_NEW_RELEVANT_ITEMS',
              'DEGRADED_LAST_KNOWN_GOOD_PRESERVED',
              'SOURCE_UNAVAILABLE_LAST_KNOWN_GOOD_PRESERVED',
          }
          run = state.get('lastRun', {})
          if run.get('prioritySeedAvailable') is False or run.get('primaryOfficialRootAvailable') is False:
              assert state.get('status') in {
                  'DEGRADED_LAST_KNOWN_GOOD_PRESERVED',
                  'SOURCE_UNAVAILABLE_LAST_KNOWN_GOOD_PRESERVED',
              }, 'unavailable priority/primary MIPE source may not report OK'

          allowed_hosts = {
              'mfe.gov.ro', 'www.mfe.gov.ro',
              'fonduri-ue.gov.ro', 'www.fonduri-ue.gov.ro',
              'fonduri-ue.ro', 'www.fonduri-ue.ro',
              'oportunitati-ue.gov.ro', 'www.oportunitati-ue.gov.ro',
              'reporting.mysmis2021.gov.ro',
          }
          forbidden_transport_markers = ('relay', 'jina-reader', 'translate')
          for item in state.get('items', []):
              url = item.get('url', '')
              assert urlparse(url).hostname in allowed_hosts, url
              transport = str(item.get('retrievalTransport') or '')
              assert item.get('verification') == 'CANONICAL_OFFICIAL_FETCH', item.get('title')
              assert transport.startswith('direct'), (item.get('title'), transport)
              assert not any(marker in transport for marker in forbidden_transport_markers), transport

          for row in run.get('roots', []):
              if row.get('ok'):
                  transport = str(row.get('transport') or '')
                  assert transport.startswith('direct'), (row.get('target'), transport)
                  assert row.get('verification') == 'CANONICAL_OFFICIAL_FETCH', row.get('target')

          if state.get('canonicalRoute') == 'romaniaWindows':
              assert state.get('status') == 'OK'
              assert state.get('routeHealth', {}).get('romaniaWindows', {}).get('status') == 'PASS'
              assert state.get('routeHealth', {}).get('githubHosted', {}).get('status') == 'DEGRADED'
              assert run.get('collectorVersion') == '3.0'

          feed_text = feed_path.read_text(encoding='utf-8')
          assert 'window.PARTENER_DATA.mipeIngestion=' in feed_text
          assert 'window.PARTENER_DATA.mipeNews=' in feed_text
          assert 'CANONICAL_DUAL_RELAY_CORROBORATED' not in feed_text
          assert 'T1_DUAL_RELAY_CORROBORATED' not in feed_text

          registry_text = consultant_registry_path.read_text(encoding='utf-8')
          marker = 'window.PARTENER_DATA.mysmisRegistry='
          assert marker in registry_text
          mysmis = json.loads(registry_text.split(marker, 1)[1].rsplit(';', 1)[0])
          assert mysmis.get('directOnly') is True
          assert urlparse(mysmis.get('source', {}).get('canonicalUrl', '')).hostname == 'reporting.mysmis2021.gov.ro'
          assert mysmis.get('status') in {'OK_DIRECT', 'UNAVAILABLE_FAIL_CLOSED'}
          if mysmis.get('status') == 'OK_DIRECT':
              assert mysmis.get('calls')
              assert mysmis.get('source', {}).get('retrieval') == 'CANONICAL_OFFICIAL_FETCH'

          print(json.dumps({
              'status': state.get('status'),
              'canonicalRoute': state.get('canonicalRoute'),
              'transportMode': run.get('transportMode'),
              'prioritySeedAvailable': run.get('prioritySeedAvailable'),
              'primaryOfficialRootAvailable': run.get('primaryOfficialRootAvailable'),
              'currentVerifiedCount': run.get('currentVerifiedCount'),
              'publishedItemCount': run.get('publishedItemCount'),
              'mysmisStatus': mysmis.get('status'),
              'mysmisVisibleRows': mysmis.get('visibleRowCount'),
              'mysmisValidatedCalls': mysmis.get('validatedCallCount'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Persist verified feed, source registry and Consultant evidence
        shell: bash
        run: |
          set -euo pipefail
          cp partener-eu/web/mipe-news.js /tmp/mipe-news.js
          cp partener-eu/web/mysmis-registry.js /tmp/mysmis-registry.js
          cp partener-eu/ingest/state/mipe_state.json /tmp/mipe_state.json
          cp partener-eu/ingest/state/mipe_source_registry.json /tmp/mipe_source_registry.json
          cp partener-eu/ingest/state/mipe_known_canonical_seeds.json /tmp/mipe_known_canonical_seeds.json
          python - <<'PY' > /tmp/mipe_asset_version.txt
          import json
          from pathlib import Path
          state = json.loads(Path('partener-eu/ingest/state/mipe_state.json').read_text(encoding='utf-8'))
          print(''.join(ch for ch in state['lastRun']['observedAt'] if ch.isdigit())[:14])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mipe-news.js partener-eu/web/mipe-news.js
            cp /tmp/mysmis-registry.js partener-eu/web/mysmis-registry.js
            cp /tmp/mipe_state.json partener-eu/ingest/state/mipe_state.json
            cp /tmp/mipe_source_registry.json partener-eu/ingest/state/mipe_source_registry.json
            cp /tmp/mipe_known_canonical_seeds.json partener-eu/ingest/state/mipe_known_canonical_seeds.json
            MIPE_VERSION=$(cat /tmp/mipe_asset_version.txt)
            export MIPE_VERSION
            python - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('partener-eu/web/index.html')
          text = path.read_text(encoding='utf-8')
          version = os.environ['MIPE_VERSION']
          text = re.sub(r'(mipe-news\.js\?v=)[^"\']+', rf'\g<1>{version}', text)
          text = re.sub(r'(mipe-news-adapter\.js\?v=)[^"\']+', rf'\g<1>{version}', text)
          text = re.sub(r'(mysmis-registry\.js\?v=)[^"\']+', rf'\g<1>{version}', text)
          path.write_text(text, encoding='utf-8')
          PY
            python partener-eu/ingest/intelligence_index.py
            git add \
              partener-eu/web/index.html \
              partener-eu/web/mipe-news.js \
              partener-eu/web/mysmis-registry.js \
              partener-eu/ingest/state/mipe_state.json \
              partener-eu/ingest/state/mipe_source_registry.json \
              partener-eu/ingest/state/mipe_known_canonical_seeds.json \
              partener-eu/ingest/state/intelligence_index.json

            if git diff --cached --quiet; then
              echo 'No MIPE, MySMIS or discovery output changes.'
              exit 0
            fi

            git commit -m 'Ingest direct-verified MIPE and MySMIS updates'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1