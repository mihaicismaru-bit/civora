name: PARTENER.EU MIPE Ingestion v2

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Run the verified Playwright collector and build a complete MySMIS registry snapshot'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 * * * *'
    - cron: '47 */6 * * *'
  push:
    branches:
      - main
      - agent/mipe-resilient-ingestion-v2
    paths:
      - 'partener-eu/ingest/mipe_core_v2.py'
      - 'partener-eu/ingest/mipe_ingest_v2.py'
      - 'partener-eu/ingest/tests/test_mipe_v2.py'
      - 'partener-eu/ingest/state/mipe_known_canonical_seeds.json'
      - 'partener-eu/ingest/state/mipe_discovery_sources.json'
      - 'partener-eu/ingest/state/pdds_webindex_seeds.json'
      - '.github/workflows/partener-eu-mipe-ingest.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-mipe-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile and test fail-closed policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            partener-eu/ingest/mipe_core_v2.py \
            partener-eu/ingest/mipe_ingest_v2.py
          python -m unittest discover -s partener-eu/ingest/tests -v

  ingest:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Select transport escalation mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          INPUT_BROWSER: ${{ inputs.browser }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          browser=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_BROWSER" != "false" ]]; then
            browser=true
          elif [[ "$SCHEDULE_EXPR" == "47 */6 * * *" ]]; then
            browser=true
          elif [[ "$REF_NAME" == "agent/mipe-resilient-ingestion-v2" ]]; then
            browser=true
          fi
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

      - name: Install strict browser transport
        if: steps.mode.outputs.browser == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Capture last-known-good feed hash
        id: before
        shell: bash
        run: |
          set -euo pipefail
          sha256sum partener-eu/web/mipe-news.js | awk '{print "feed_sha=" $1}' | tee -a "$GITHUB_OUTPUT"

      - name: Run verified official-source ingestion
        shell: bash
        env:
          MIPE_RELAY_HMAC_KEY: ${{ secrets.MIPE_RELAY_HMAC_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ steps.mode.outputs.browser }}" == "true" ]]; then
            args+=(--browser)
          fi
          python partener-eu/ingest/mipe_ingest_v2.py "${args[@]}" | tee /tmp/mipe-v2-run.json

      - name: Verify publication gates and fail-closed persistence
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.before.outputs.feed_sha }}
          BROWSER_ENABLED: ${{ steps.mode.outputs.browser }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          sys.path.insert(0, 'partener-eu/ingest')
          from mipe_core_v2 import PRIORITY_PDDS_SEED, parse_feed_js, validate_item

          health_path = pathlib.Path('partener-eu/ingest/state/mipe_health.json')
          feed_path = pathlib.Path('partener-eu/web/mipe-news.js')
          health = json.loads(health_path.read_text(encoding='utf-8'))
          feed_text = feed_path.read_text(encoding='utf-8')
          meta, items = parse_feed_js(feed_text)
          assert health['prioritySeed'] == PRIORITY_PDDS_SEED
          assert health['status'] in {
              'OK_NEW_VERIFIED_ITEMS',
              'OK_NO_NEW_RELEVANT_ITEMS',
              'PARTIAL_SOURCE_FAILURE_NEW_VERIFIED_ITEMS',
              'PARTIAL_SOURCE_FAILURE_LAST_KNOWN_GOOD_PRESERVED',
              'SOURCE_UNAVAILABLE_LAST_KNOWN_GOOD_PRESERVED',
          }
          for item in items:
              assert validate_item(item), (item.get('url'), item.get('title'))
              if item.get('status') == 'OPEN':
                  assert item.get('kind') == 'CALL_OPENED'
          registry = health.get('registry') or {}
          if registry.get('complete'):
              assert int(registry.get('visibleRows') or 0) == int(registry.get('totalRows') or 0)
          if health['status'] == 'SOURCE_UNAVAILABLE_LAST_KNOWN_GOOD_PRESERVED':
              after = hashlib.sha256(feed_path.read_bytes()).hexdigest()
              assert after == os.environ['BEFORE_SHA'], 'last-known-good feed changed during total source failure'
          if os.environ.get('REF_NAME') == 'agent/mipe-resilient-ingestion-v2' and os.environ.get('BROWSER_ENABLED') == 'true':
              assert registry.get('available') is True, registry
              assert registry.get('complete') is True, registry
              assert int(registry.get('visibleRows') or 0) >= 800, registry
          print(json.dumps({
              'status': health['status'],
              'prioritySeedAvailable': health['prioritySeedAvailable'],
              'registry': registry,
              'feedItemCount': len(items),
              'feedMetadataStatus': meta.get('status'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Persist verified outputs conflict-safely
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mipe-v2-output
          files=(
            partener-eu/web/mipe-news.js
            partener-eu/ingest/state/mipe_state_v2.json
            partener-eu/ingest/state/mipe_health.json
            partener-eu/ingest/state/mipe_discovered_urls.json
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              mkdir -p "/tmp/mipe-v2-output/$(dirname "$file")"
              cp "$file" "/tmp/mipe-v2-output/$file"
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            echo "Persistence attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            add=()
            for file in "${files[@]}"; do
              if [[ -f "/tmp/mipe-v2-output/$file" ]]; then
                mkdir -p "$(dirname "$file")"
                cp "/tmp/mipe-v2-output/$file" "$file"
                add+=("$file")
              fi
            done
            git add "${add[@]}"
            if git diff --cached --quiet; then
              echo 'No material MIPE output changes.'
              exit 0
            fi
            git commit -m 'Ingest verified MIPE and MySMIS updates'
            if git push origin HEAD:main; then
              echo 'Verified MIPE outputs persisted to main.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to persist verified MIPE outputs after five attempts.' >&2
          exit 1
