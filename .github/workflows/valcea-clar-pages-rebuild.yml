name: VÂLCEA CLAR Pages Rebuild Bridge

# Automated editorial workflows commit through GITHUB_TOKEN. GitHub deliberately
# suppresses workflow chaining and native Pages builds for those pushes.
# This bridge requests a Pages build explicitly after canonical producers finish.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "VÂLCEA CLAR Live Newsroom"
      - "VÂLCEA CLAR Autonomous Editions"
      - "VÂLCEA CLAR Edition Recovery"
      - "VÂLCEA CLAR S4 Publication Experience"
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write

concurrency:
  group: valcea-clar-pages-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub Pages build from latest default-branch revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          response=$(gh api --method POST "repos/$GH_REPO/pages/builds")
          echo "$response"
          status=$(printf '%s' "$response" | jq -r '.status // empty')
          test "$status" = "queued" || test "$status" = "building"
