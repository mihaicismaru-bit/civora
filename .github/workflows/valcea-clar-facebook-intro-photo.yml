name: VÂLCEA CLAR Facebook Intro Photo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/social/facebook_intro_photo_post.json'
      - 'valcea-clar/social/facebook_intro_photo_publish.py'
      - '.github/workflows/valcea-clar-facebook-intro-photo.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-facebook-intro-photo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Refresh canonical main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Validate one-post real-photo contract
        run: |
          python -m py_compile valcea-clar/social/facebook_intro_photo_publish.py
          python valcea-clar/social/facebook_intro_photo_publish.py --self-test

      - name: Publish exactly one verified introduction post
        env:
          VALCEA_FB_PAGE_ID: '1234360446430980'
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
          VALCEA_FB_INTRO_PHOTO_LIVE_ENABLED: 'true'
        run: python valcea-clar/social/facebook_intro_photo_publish.py --apply | tee /tmp/facebook-intro-photo.json

      - name: Persist publication receipt conflict-safe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f valcea-clar/social/facebook_intro_photo_state.json ]; then
            echo 'No introduction photo state was produced.' >&2
            exit 1
          fi
          cp valcea-clar/social/facebook_intro_photo_state.json /tmp/facebook_intro_photo_state.json
          git config user.name 'valcea-clar-facebook-intro-photo[bot]'
          git config user.email 'valcea-clar-facebook-intro-photo@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/facebook_intro_photo_state.json valcea-clar/social/facebook_intro_photo_state.json
            git add valcea-clar/social/facebook_intro_photo_state.json
            if git diff --cached --quiet; then
              echo 'Introduction photo publication state already current.'
              exit 0
            fi
            git commit -m 'Persist VÂLCEA CLAR Facebook intro photo receipt'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Audit publication
        if: always()
        run: |
          echo '## VÂLCEA CLAR Facebook Intro Photo' >> "$GITHUB_STEP_SUMMARY"
          echo 'Exactly one post is eligible. Synthetic media and backlog fan-out are forbidden.' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/facebook-intro-photo.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
