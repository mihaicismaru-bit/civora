name: VÂLCEA CLAR Cultural Sources Monitor

# Festival and performing-arts sources are distinct inputs but share one control
# plane: probe -> persist candidate state -> trigger editorial opportunities.
# Each source family keeps its original cadence inside this workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/festival_source_registry.json'
      - 'valcea-clar/editorial/performing_arts_source_registry.json'
      - 'valcea-clar/editorial/performing_arts_monitor_registry.json'
      - 'valcea-clar/scripts/monitor_festival_sources.py'
      - 'valcea-clar/scripts/monitor_performing_arts_sources.py'
      - '.github/workflows/valcea-clar-festival-intelligence-monitor.yml'
  pull_request:
    paths:
      - 'valcea-clar/editorial/festival_source_registry.json'
      - 'valcea-clar/editorial/performing_arts_source_registry.json'
      - 'valcea-clar/editorial/performing_arts_monitor_registry.json'
      - 'valcea-clar/scripts/monitor_festival_sources.py'
      - 'valcea-clar/scripts/monitor_performing_arts_sources.py'
      - '.github/workflows/valcea-clar-festival-intelligence-monitor.yml'
  schedule:
    - cron: '13 */2 * * *'
    - cron: '29 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: valcea-clar-cultural-sources-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Refresh newest canonical state
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate cultural source monitors
        run: |
          python valcea-clar/scripts/monitor_festival_sources.py --self-test
          python valcea-clar/scripts/monitor_performing_arts_sources.py --self-test

      - name: Monitor festival sources on festival cadence
        id: festival
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.event.schedule == '29 */6 * * *')
        shell: bash
        run: |
          set +e
          python valcea-clar/scripts/monitor_festival_sources.py
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then echo 'new_candidates=true' >> "$GITHUB_OUTPUT"; elif [ "$rc" -eq 0 ]; then echo 'new_candidates=false' >> "$GITHUB_OUTPUT"; else exit "$rc"; fi

      - name: Monitor performing arts sources on performing cadence
        id: performing
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.event.schedule == '13 */2 * * *')
        shell: bash
        run: |
          set +e
          python valcea-clar/scripts/monitor_performing_arts_sources.py
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then echo 'new_candidates=true' >> "$GITHUB_OUTPUT"; elif [ "$rc" -eq 0 ]; then echo 'new_candidates=false' >> "$GITHUB_OUTPUT"; else exit "$rc"; fi

      - name: Persist cultural monitor state once
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            valcea-clar/state/festival_source_state.json
            valcea-clar/editorial/festival_update_candidates.json
            valcea-clar/state/performing_arts_source_state.json
            valcea-clar/editorial/performing_arts_update_candidates.json
          )
          changed=false
          for p in "${paths[@]}"; do
            if [ -e "$p" ] && ! git diff --quiet -- "$p"; then changed=true; fi
            if [ -e "$p" ] && ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then changed=true; fi
          done
          if [ "$changed" != true ]; then
            echo 'No material cultural monitor state change.'
            exit 0
          fi

          rm -rf /tmp/cultural-monitor
          mkdir -p /tmp/cultural-monitor
          for p in "${paths[@]}"; do
            if [ -f "$p" ]; then mkdir -p "/tmp/cultural-monitor/$(dirname "$p")"; cp "$p" "/tmp/cultural-monitor/$p"; fi
          done
          git config user.name 'vâlcea-clar-cultural-monitor[bot]'
          git config user.email 'valcea-clar-cultural-monitor@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in "${paths[@]}"; do
              if [ -f "/tmp/cultural-monitor/$p" ]; then mkdir -p "$(dirname "$p")"; cp "/tmp/cultural-monitor/$p" "$p"; git add "$p"; fi
            done
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh VÂLCEA CLAR cultural source intelligence'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Could not persist cultural monitor state.' >&2
          exit 1

      - name: Dispatch editorial opportunities once for new cultural signals
        if: github.event_name != 'pull_request' && (steps.festival.outputs.new_candidates == 'true' || steps.performing.outputs.new_candidates == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run valcea-clar-editorial-opportunity-engine.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Cultural source changes handed to Editorial Opportunity Engine.'
