name: PARTENER.EU EU Direct Programme Intelligence

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/erasmus_action_router_registry.json'
      - 'partener-eu/ingest/erasmus_action_router.py'
      - 'partener-eu/ops/test_erasmus_action_router.py'
      - 'partener-eu/ingest/eu4health_hadea_call_registry.json'
      - 'partener-eu/ingest/eu4health_hadea_call.py'
      - 'partener-eu/ingest/eu4health_hadea_ft_reconcile.py'
      - 'partener-eu/ingest/funding_tenders_fetch.py'
      - 'partener-eu/ops/test_eu4health_hadea_call.py'
      - 'partener-eu/ops/test_eu4health_hadea_ft_reconcile.py'
      - '.github/workflows/partener-eu-eu-direct-programme-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eu-direct-programme-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded EU Direct programme adapters and regressions
        run: |
          python -m json.tool partener-eu/ingest/erasmus_action_router_registry.json >/dev/null
          python -m json.tool partener-eu/ingest/eu4health_hadea_call_registry.json >/dev/null
          python -m py_compile \
            partener-eu/ingest/erasmus_action_router.py \
            partener-eu/ingest/eu4health_hadea_call.py \
            partener-eu/ingest/eu4health_hadea_ft_reconcile.py \
            partener-eu/ops/test_erasmus_action_router.py \
            partener-eu/ops/test_eu4health_hadea_call.py \
            partener-eu/ops/test_eu4health_hadea_ft_reconcile.py

      - name: Validate fail-closed EU Direct programme semantics
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          python partener-eu/ops/test_erasmus_action_router.py
          python partener-eu/ops/test_eu4health_hadea_call.py
          python partener-eu/ops/test_eu4health_hadea_ft_reconcile.py

      - name: Acquire fresh official Erasmus application-route intelligence
        run: |
          ROOT=/tmp/partener-eu-eu-direct-programme-intelligence
          rm -rf "$ROOT"
          mkdir -p "$ROOT/erasmus-action-router" "$ROOT/eu4health-hadea"
          python partener-eu/ingest/erasmus_action_router.py \
            --management-mode CENTRALISED_EACEA \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --action-reference-hint "ERASMUS-CENTRALISED-DISCOVERY-ONLY" \
            --live \
            --output "$ROOT/erasmus-action-router/centralised-eacea.json"
          python partener-eu/ingest/erasmus_action_router.py \
            --management-mode DECENTRALISED_NATIONAL_AGENCY \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --live \
            --output "$ROOT/erasmus-action-router/decentralised-national-agency.json"

      - name: Enforce live non-authorizing Erasmus boundary
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('/tmp/partener-eu-eu-direct-programme-intelligence/erasmus-action-router')
          central=json.loads((root/'centralised-eacea.json').read_text(encoding='utf-8'))
          decentral=json.loads((root/'decentralised-national-agency.json').read_text(encoding='utf-8'))
          flags=(
              'material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized',
              'budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized',
              'call_alert_authorized','canonical_corpus_mutation',
          )
          for row, mode, registration, count in (
              (central,'CENTRALISED_EACEA','PIC',4),
              (decentral,'DECENTRALISED_NATIONAL_AGENCY','OID',3),
          ):
              assert row['schema'] == 'PARTENER_EU_ERASMUS_ACTION_ROUTER_V2'
              assert row['source_family'] == 'EU_DIRECT'
              assert row['programme_family'] == 'Erasmus+'
              assert row['observation_state'] == 'APPLICATION_ROUTE_INTELLIGENCE'
              assert row['management_mode'] == mode
              assert row['route']['registration_identifier_kind'] == registration
              assert row['evidence_source_count'] == count
              assert row['source_health_state'] in {'HEALTHY','DEGRADED'}
              assert all(row[k] is False for k in flags)
              assert row['market_intelligence_only'] is True
              assert row['publication_effect'] == 'NONE'
              assert row['exact_action_endpoint_required'] is True
              assert row['exact_call_or_topic_identifier_required'] is True
              assert row['semantic_reconciliation_required'] is True
              assert {
                  'exact_action_or_call_identifier',
                  'current_official_exact_action_or_call_endpoint',
                  'explicit_current_official_action_or_call_status',
                  'semantic_reconciliation',
                  'field_scoped_material_admission',
              }.issubset(set(row['missing_for_open_confirmation']))
              assert re.fullmatch(r'[0-9a-f]{64}', row['registry_sha256'])
              assert re.fullmatch(r'[0-9a-f]{64}', row['route_semantic_fingerprint'])
              for source in row['evidence']:
                  health=source['source_health']
                  if health['health_state'] == 'HEALTHY':
                      assert health['http_status'] == 200
                      assert re.fullmatch(r'[0-9a-f]{64}', health['raw_sha256'])
                  else:
                      assert str(health['health_state']).startswith('DEGRADED')
                      assert health['lkg_required'] is True
          assert central['route']['route_class'] == 'CENTRALISED_EU_DIRECT'
          assert central['route']['application_gateway_url'].startswith('https://ec.europa.eu/info/funding-tenders/')
          assert central['action_reference_hint_authority'] == 'DISCOVERY_HINT_ONLY_NOT_CALL_IDENTIFIER'
          assert decentral['route']['route_class'] == 'DECENTRALISED_NATIONAL_AGENCY'
          assert decentral['route']['application_gateway_url'] == 'https://webgate.ec.europa.eu/erasmus-esc/index/'
          print({
              'programme_family': 'Erasmus+',
              'central_health': central['source_health_state'],
              'central_healthy': central['healthy_evidence_source_count'],
              'central_degraded': central['degraded_evidence_source_count'],
              'decentral_health': decentral['source_health_state'],
              'decentral_healthy': decentral['healthy_evidence_source_count'],
              'decentral_degraded': decentral['degraded_evidence_source_count'],
              'open_call_authorized': False,
              'publication_effect': 'NONE',
          })
          PY

      - name: Capture fresh exact HaDEA EU4Health evidence
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-eu-direct-programme-intelligence/eu4health-hadea
          python partener-eu/ingest/eu4health_hadea_call.py \
            --call-url 'https://hadea.ec.europa.eu/calls-proposals/health-data-biotech-innovation-leveraging-european-health-data-space-0_en' \
            --live \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-eu4health-hadea" \
            --output "$ROOT/exact-call.json"

      - name: Validate EU4Health exact evidence stays non-authorizing
        id: live_hadea
        run: |
          python - <<'PY'
          import json, string, sys
          p='/tmp/partener-eu-eu-direct-programme-intelligence/eu4health-hadea/exact-call.json'
          d=json.load(open(p, encoding='utf-8'))
          if d.get('adapter_id') != 'EU4HEALTH_HADEA_CALLS_V1':
              print('FAIL adapter identity drift')
              sys.exit(2)
          if d.get('observation_state') != 'EXACT_CALL_EVIDENCE_UNRECONCILED':
              print('FAIL observation state drift:', d.get('observation_state'))
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
              if d.get(key) is not False:
                  print('FAIL EU4Health evidence became authorizing:', key, d.get(key))
                  sys.exit(2)
          if d.get('publication_effect') != 'NONE' or d.get('market_intelligence_only') is not True:
              print('FAIL EU4Health publication/policy drift')
              sys.exit(2)
          if d.get('funding_tenders_exact_topic_required') is not True or d.get('semantic_reconciliation_required') is not True:
              print('FAIL downstream material-admission requirement relaxed')
              sys.exit(2)
          reg_hash=str(d.get('registry_sha256') or '')
          if len(reg_hash) != 64 or any(ch not in string.hexdigits for ch in reg_hash):
              print('FAIL registry hash invalid:', reg_hash)
              sys.exit(2)
          health=(d.get('source_health') or {}).get('health_state')
          if health == 'HEALTHY':
              raw_hash=str((d.get('source_health') or {}).get('raw_sha256') or '')
              if len(raw_hash) != 64 or any(ch not in string.hexdigits for ch in raw_hash):
                  print('FAIL healthy HaDEA evidence missing raw hash')
                  sys.exit(2)
              extracted=d.get('extracted') or {}
              if extracted.get('call_reference') != 'EU4H-2026-SANTE-PJ-08':
                  print('FAIL exact call reference mismatch:', extracted.get('call_reference'))
                  sys.exit(2)
              if extracted.get('page_kind') != 'CALL_FOR_PROPOSALS' or extracted.get('programme_candidate') != 'EU4Health':
                  print('FAIL exact call semantic markers incomplete:', extracted)
                  sys.exit(2)
              if d.get('evidence_usable_for_reconciliation') is not True:
                  print('FAIL healthy exact evidence not marked usable for reconciliation')
                  sys.exit(2)
          elif not str(health).startswith('DEGRADED'):
              print('FAIL unexpected live source health:', health)
              sys.exit(2)
          elif (d.get('source_health') or {}).get('lkg_required') is not True:
              print('FAIL degraded exact source lacks LKG requirement')
              sys.exit(2)
          print(json.dumps({
              'health_state': health,
              'call_reference': (d.get('extracted') or {}).get('call_reference'),
              'status_candidate': (d.get('extracted') or {}).get('status_candidate'),
              'funding_tenders_link_present': (d.get('extracted') or {}).get('funding_tenders_link_present'),
              'funding_tenders_exact_topic_url': (d.get('extracted') or {}).get('funding_tenders_exact_topic_url'),
              'evidence_usable_for_reconciliation': d.get('evidence_usable_for_reconciliation'),
              'open_call_authorized': d.get('open_call_authorized'),
          }, ensure_ascii=False, sort_keys=True))
          PY
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/partener-eu-eu-direct-programme-intelligence/eu4health-hadea/exact-call.json', encoding='utf-8'))
          print('evidence_usable=' + ('true' if d.get('evidence_usable_for_reconciliation') is True else 'false'))
          PY

      - name: Reconcile exact HaDEA reference against fresh structured Funding & Tenders evidence
        if: steps.live_hadea.outputs.evidence_usable == 'true'
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-eu-direct-programme-intelligence/eu4health-hadea
          python partener-eu/ingest/eu4health_hadea_ft_reconcile.py \
            --hadea-evidence "$ROOT/exact-call.json" \
            --live \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-eu4health-hadea-ft" \
            --output-dir "$ROOT"

      - name: Validate reconciled EU4Health evidence stays non-authorizing
        if: steps.live_hadea.outputs.evidence_usable == 'true'
        run: |
          python - <<'PY'
          import json, string, sys
          p='/tmp/partener-eu-eu-direct-programme-intelligence/eu4health-hadea/hadea-funding-tenders-reconciliation.json'
          d=json.load(open(p, encoding='utf-8'))
          expected='EU4H-2026-SANTE-PJ-08'
          if d.get('reconciler_version') != 'EU4HEALTH_HADEA_FT_RECONCILE_V1':
              print('FAIL reconciler identity drift')
              sys.exit(2)
          if d.get('observation_state') != 'EXACT_CALL_REFERENCE_AND_STATUS_RECONCILED_NON_AUTHORIZING':
              print('FAIL exact semantic reconciliation did not pass:', d.get('observation_state'), d.get('missing_for_open_confirmation'))
              sys.exit(2)
          if d.get('hadea_reference') != expected or d.get('funding_tenders_reference') != expected:
              print('FAIL exact reference binding mismatch:', d.get('hadea_reference'), d.get('funding_tenders_reference'))
              sys.exit(2)
          if d.get('identity_match') is not True or d.get('topic_url_match') is not True or d.get('status_match') is not True:
              print('FAIL semantic binding incomplete')
              sys.exit(2)
          if d.get('semantic_reconciliation_passed') is not True or d.get('material_admission_ready_for_downstream_review') is not True:
              print('FAIL reconciled evidence was not marked ready for downstream review')
              sys.exit(2)
          if str(d.get('funding_tenders_status') or '').casefold() != 'closed':
              print('FAIL historical acceptance fixture is not independently CLOSED:', d.get('funding_tenders_status'))
              sys.exit(2)
          if 'current_funding_tenders_status_is_not_open' not in set(d.get('missing_for_open_confirmation') or []):
              print('FAIL CLOSED fixture lost explicit not-open guard')
              sys.exit(2)
          sem_hash=str(d.get('semantic_fingerprint') or '')
          if len(sem_hash) != 64 or any(ch not in string.hexdigits for ch in sem_hash):
              print('FAIL reconciliation semantic hash invalid')
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
              if d.get(key) is not False:
                  print('FAIL reconciliation became authorizing:', key, d.get(key))
                  sys.exit(2)
          if d.get('publication_effect') != 'NONE' or d.get('canonical_corpus_mutation') is not False:
              print('FAIL reconciliation crossed publication boundary')
              sys.exit(2)
          print(json.dumps({
              'reference': expected,
              'funding_tenders_status': d.get('funding_tenders_status'),
              'semantic_reconciliation_passed': d.get('semantic_reconciliation_passed'),
              'open_call_authorized': d.get('open_call_authorized'),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Confirm degraded HaDEA evidence remains unreconciled
        if: steps.live_hadea.outputs.evidence_usable != 'true'
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.load(open('/tmp/partener-eu-eu-direct-programme-intelligence/eu4health-hadea/exact-call.json', encoding='utf-8'))
          health=d.get('source_health') or {}
          assert str(health.get('health_state') or '').startswith('DEGRADED')
          assert health.get('lkg_required') is True
          assert d.get('evidence_usable_for_reconciliation') is False
          assert d.get('open_call_authorized') is False
          assert d.get('publish_authorized') is False
          assert not pathlib.Path('/tmp/partener-eu-eu-direct-programme-intelligence/eu4health-hadea/hadea-funding-tenders-reconciliation.json').exists()
          print(json.dumps({
              'health_state': health.get('health_state'),
              'lkg_required': health.get('lkg_required'),
              'semantic_reconciliation_skipped_fail_closed': True,
              'open_call_authorized': d.get('open_call_authorized'),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload replayable EU Direct programme evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-eu-direct-programme-intelligence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-eu-direct-programme-intelligence
          if-no-files-found: error
          retention-days: 7
