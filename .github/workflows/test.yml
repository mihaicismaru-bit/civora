name: test

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install built wheel in clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed package and entrypoints
        run: |
          .release-smoke/bin/python -c "import civora; print(civora.__version__)"
          .release-smoke/bin/civora --help
          .release-smoke/bin/civora-remediation --help

  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic release preflight
        run: python tools/release_preflight.py
