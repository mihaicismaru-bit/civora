name: VÂLCEA CLAR Public HTTP Health

on:
  workflow_dispatch:
    inputs:
      require_ready:
        description: 'Fail the run unless every public route passes'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - 'VÂLCEA CLAR Live Newsroom'
      - 'VÂLCEA CLAR Publication Reconcile'
      - 'VÂLCEA CLAR Continuous Frontpage Invariant'
      - 'VÂLCEA CLAR Premium Presentation'
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/site/**'
      - 'valcea-clar/scripts/probe_public_site.py'
      - '.github/workflows/valcea-clar-public-health.yml'
  pull_request:
    paths:
      - 'valcea-clar/site/**'
      - 'valcea-clar/scripts/probe_public_site.py'
      - '.github/workflows/valcea-clar-public-health.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: valcea-clar-public-http-health-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve public acceptance target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'ref=pull-request' >> "$GITHUB_OUTPUT"
          else
            # Bot-authored pushes made with GITHUB_TOKEN do not recursively
            # emit push-triggered workflow runs. For workflow_run/schedule/manual
            # acceptance we therefore validate the actual current main head.
            git fetch origin main
            git checkout --detach origin/main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'ref=main' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate probe offline
        run: python valcea-clar/scripts/probe_public_site.py --self-test

      - name: Probe public site
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=''
          if [ "${{ github.event_name }}" = 'push' ] || [ "${{ github.event_name }}" = 'workflow_run' ]; then
            EXTRA='--require-ready'
          elif [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.require_ready }}" = 'true' ]; then
            EXTRA='--require-ready'
          fi

          # The installed site bridge refreshes the canonical feed every 60s.
          # Main publication events therefore get a bounded retry window before
          # strict acceptance fails; scheduled/PR observations stay non-mutating.
          for attempt in 1 2 3 4; do
            if python valcea-clar/scripts/probe_public_site.py $EXTRA --output /tmp/valcea-clar-public-health.json | tee /tmp/valcea-clar-public-health.log; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Write health summary
        if: always()
        shell: bash
        run: |
          echo "Acceptance target: ${{ steps.target.outputs.ref }} @ ${{ steps.target.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/valcea-clar-public-health.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('/tmp/valcea-clar-public-health.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print(f"## VÂLCEA CLAR public HTTP: {d['status']}")
          print('')
          print(f"Expected durable stories: {d.get('expected_story_count', '—')}")
          print('')
          print('| Route | HTTP | Result |')
          print('|---|---:|---|')
          for row in d['checks']:
              print(f"| `{row['path']}` | {row['http_status'] if row['http_status'] is not None else '—'} | {'PASS' if row['ok'] else 'BLOCKED'} |")
          if d['blockers']:
              print('')
              print('Blockers: ' + ', '.join(f'`{x}`' for x in d['blockers']))
          PY
          else
            echo '## VÂLCEA CLAR public HTTP: probe did not produce a report' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish durable public HTTP commit status
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          STATUS_SHA: ${{ steps.target.outputs.sha }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          report_path = Path('/tmp/valcea-clar-public-health.json')
          state = 'error'
          description = 'VÂLCEA CLAR public HTTP probe produced no report'

          if report_path.is_file() and report_path.stat().st_size:
              try:
                  report = json.loads(report_path.read_text(encoding='utf-8'))
                  if bool(report.get('ready')):
                      state = 'success'
                      description = f"READY · {report.get('expected_story_count', '—')} durable stories"
                  else:
                      state = 'failure'
                      blockers = [str(x) for x in (report.get('blockers') or [])]
                      description = 'BLOCKED · ' + (', '.join(blockers[:4]) or 'unknown blocker')
              except Exception as exc:
                  description = f'ERROR · invalid health report ({type(exc).__name__})'

          payload = {
              'state': state,
              'context': 'valcea-clar/public-http',
              'description': description[:140],
              'target_url': os.environ['STATUS_RUN_URL'],
          }
          url = f"https://api.github.com/repos/{os.environ['STATUS_REPOSITORY']}/statuses/{os.environ['STATUS_SHA']}"
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'Could not publish commit status: HTTP {response.status}')
          print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Persist canonical public HTTP receipt
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TRIGGER_NAME: ${{ github.event_name }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATUS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path('/tmp/valcea-clar-public-health.json')
          report = {}
          if report_path.is_file() and report_path.stat().st_size:
              try:
                  report = json.loads(report_path.read_text(encoding='utf-8'))
              except Exception:
                  report = {}

          checks = []
          for row in report.get('checks') or []:
              if isinstance(row, dict):
                  checks.append({
                      'path': row.get('path'),
                      'http_status': row.get('http_status'),
                      'ok': bool(row.get('ok')),
                  })

          receipt = {
              'schema_version': '1.0',
              'product': 'VÂLCEA CLAR public HTTP acceptance',
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'validated_sha': os.environ.get('TARGET_SHA') or None,
              'trigger': os.environ.get('TRIGGER_NAME') or None,
              'source_workflow': os.environ.get('SOURCE_WORKFLOW') or None,
              'source_conclusion': os.environ.get('SOURCE_CONCLUSION') or None,
              'run_url': os.environ.get('STATUS_RUN_URL') or None,
              'status': report.get('status') or 'ERROR',
              'ready': bool(report.get('ready')),
              'expected_story_count': report.get('expected_story_count'),
              'blockers': list(report.get('blockers') or []),
              'checks': checks,
          }
          content = (json.dumps(receipt, ensure_ascii=False, indent=2) + '\n').encode('utf-8')

          repo = os.environ['STATUS_REPOSITORY']
          path = 'valcea-clar/validation/public_http_latest.json'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          current_sha = None
          try:
              req = urllib.request.Request(api + '?ref=main', headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  current_sha = json.loads(response.read().decode('utf-8')).get('sha')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          payload = {
              'message': 'Persist VÂLCEA CLAR public HTTP health',
              'content': base64.b64encode(content).decode('ascii'),
              'branch': 'main',
          }
          if current_sha:
              payload['sha'] = current_sha

          req = urllib.request.Request(
              api,
              data=json.dumps(payload).encode('utf-8'),
              method='PUT',
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'Could not persist public HTTP receipt: HTTP {response.status}')
          print(json.dumps(receipt, ensure_ascii=False))
          PY

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-public-http-${{ github.run_id }}
          path: |
            /tmp/valcea-clar-public-health.json
            /tmp/valcea-clar-public-health.log
          if-no-files-found: warn
          retention-days: 14
