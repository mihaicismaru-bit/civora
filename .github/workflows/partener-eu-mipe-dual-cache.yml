name: PARTENER.EU MIPE Dual Cache Diagnostic

on:
  workflow_dispatch:

# Diagnostic only. Canonical MIPE publication never consumes or persists this
# cache; it may be used only to inspect transport availability.
permissions:
  contents: read

concurrency:
  group: partener-eu-mipe-dual-cache-diagnostic
  cancel-in-progress: true

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build ephemeral dual-relay cache
        run: python partener-eu/ingest/mipe_dual_cache.py

      - name: Enforce cache evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('partener-eu/ingest/state/mipe_dual_cache.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('schema') == 'CIVORA_MIPE_DUAL_CACHE_V1'
          assert data.get('verifiedCount', 0) >= 1
          for row in data.get('records', []):
              if not row.get('ok'):
                  continue
              assert row.get('verification') == 'CANONICAL_DUAL_RELAY_CORROBORATED'
              assert row.get('readerSource', '').replace('http://','https://').rstrip('/') == row['canonicalUrl'].rstrip('/')
              assert len(row.get('readerSha256','')) == 64
              assert len(row.get('translateSha256','')) == 64
              assert row.get('readerText')
          print({'diagnosticOnly': True, 'status': data.get('status'), 'verifiedCount': data.get('verifiedCount')})
          PY

      - name: Enforce read-only diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!partener-eu/ingest/state/mipe_dual_cache.json'
          echo 'Ephemeral cache is intentionally not committed or pushed.'
