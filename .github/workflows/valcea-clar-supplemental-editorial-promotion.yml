name: VÂLCEA CLAR Supplemental Editorial Promotion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/supplemental_facts_registry.json'
      - 'valcea-clar/scripts/merge_supplemental_facts.py'
      - '.github/workflows/valcea-clar-supplemental-editorial-promotion.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: valcea-clar-supplemental-editorial-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate supplemental registry
        run: python valcea-clar/scripts/merge_supplemental_facts.py --check

      - name: Merge supplemental stories into canonical registry
        run: python valcea-clar/scripts/merge_supplemental_facts.py

      - name: Validate editorial writer contract
        run: python valcea-clar/scripts/editorial_writer.py --check

      - name: Validate diff
        run: git diff --check

      - name: Commit canonical editorial promotion
        shell: bash
        run: |
          if git diff --quiet -- valcea-clar/editorial/facts_registry.json; then
            echo 'Canonical registry already contains the supplemental stories.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add valcea-clar/editorial/facts_registry.json
          git commit -m 'Promote verified festival dossiers into VÂLCEA CLAR'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch Live Newsroom after canonical promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          http_code=$(curl -sS -o /tmp/newsroom-dispatch-response.txt -w '%{http_code}' \
            -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/valcea-clar-newsroom-live.yml/dispatches" \
            -d "$payload")
          if [ "$http_code" != '204' ]; then
            echo "Live Newsroom dispatch failed with HTTP ${http_code}." >&2
            cat /tmp/newsroom-dispatch-response.txt >&2 || true
            exit 1
          fi
          echo 'Live Newsroom dispatched after canonical editorial promotion.'
