name: VÂLCEA CLAR Supplemental Editorial Promotion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/supplemental_facts_registry.json'
      - 'valcea-clar/scripts/merge_supplemental_facts.py'
      - '.github/workflows/valcea-clar-supplemental-editorial-promotion.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-supplemental-editorial-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate supplemental registry
        run: python valcea-clar/scripts/merge_supplemental_facts.py --check

      - name: Merge supplemental stories into canonical registry
        run: python valcea-clar/scripts/merge_supplemental_facts.py

      - name: Validate editorial writer contract
        run: python valcea-clar/scripts/editorial_writer.py --check

      - name: Validate diff
        run: git diff --check

      - name: Commit canonical editorial promotion
        shell: bash
        run: |
          if git diff --quiet -- valcea-clar/editorial/facts_registry.json; then
            echo 'Canonical registry already contains the supplemental stories.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add valcea-clar/editorial/facts_registry.json
          git commit -m 'Promote verified festival dossiers into VÂLCEA CLAR'
          git pull --rebase origin main
          git push origin HEAD:main
