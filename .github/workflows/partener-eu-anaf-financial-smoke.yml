name: PARTENER.EU ANAF Financial Smoke

on:
  push:
    branches:
      - agent/anaf-company-financials
    paths:
      - 'partener-eu/ingest/anaf_company_financials.py'
      - '.github/workflows/partener-eu-anaf-financial-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'partener-eu/ingest/anaf_company_financials.py'
      - '.github/workflows/partener-eu-anaf-financial-smoke.yml'
  workflow_dispatch:
    inputs:
      cui:
        description: 'Public Romanian CUI/CIF'
        required: true
        default: '9293117'
      years:
        description: 'Comma-separated financial years'
        required: true
        default: '2025,2024,2023,2022,2021'

permissions:
  contents: write

jobs:
  live-anaf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile client
        run: python -m py_compile partener-eu/ingest/anaf_company_financials.py
      - name: Query official ANAF balance sheet endpoint
        env:
          CUI: ${{ github.event.inputs.cui || '9293117' }}
          YEARS: ${{ github.event.inputs.years || '2025,2024,2023,2022,2021' }}
        shell: bash
        run: |
          set +e
          mkdir -p partener-eu/ingest/state
          python partener-eu/ingest/anaf_company_financials.py \
            --cui "$CUI" --years "$YEARS" --pretty --attempts 3 --pace 1 \
            > partener-eu/ingest/state/anaf_smoke_9293117.json
          code=$?
          cat partener-eu/ingest/state/anaf_smoke_9293117.json
          test $code -eq 0
      - name: Persist smoke receipt on branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partener-eu/ingest/state/anaf_smoke_9293117.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record ANAF financial smoke receipt'
            git push origin HEAD:agent/anaf-company-financials
          fi
