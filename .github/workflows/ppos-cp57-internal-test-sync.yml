name: PPOS CP57 internal test sync

on:
  push:
    branches:
      - ppos-cp57-offline-evidence-validator-dry-run

permissions:
  contents: write

jobs:
  sync-historical-current-state-assertions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ppos-cp57-offline-evidence-validator-dry-run
          fetch-depth: 0
      - name: Update only current-checkpoint assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          names = [
              "test_cp49_identity_runtime.py",
              "test_cp50_meta_adapters.py",
              "test_cp51_connection_profiles.py",
              "test_cp52_connection_preflight.py",
              "test_cp53_operator_provisioning.py",
              "test_cp54_meta_transport_twin.py",
              "test_cp55_meta_read_only_gate.py",
              "test_cp56_meta_live_read_only_probe.py",
          ]
          root = Path("public-presence-os/tests")
          next_old = "CP57_META_OFFLINE_EVIDENCE_BUNDLE_VALIDATOR_AND_OPERATOR_DRY_RUN"
          next_new = "CP58_META_PILOT_READINESS_AGGREGATOR_AND_LIVE_CONNECTION_AUTHORIZATION_GATE"
          total_checkpoint = 0
          total_next = 0
          for name in names:
              path = root / name
              text = path.read_text(encoding="utf-8")
              text, n1 = re.subn(
                  r'(assert\s+(?:registry|r)\["checkpoint"\]\s*==\s*)"CP56"',
                  r'\1"CP57"',
                  text,
              )
              text, n2 = re.subn(
                  r'(assert\s+(?:priority|p)\["checkpoint"\]\s*==\s*)"CP56"',
                  r'\1"CP57"',
                  text,
              )
              text, n3 = re.subn(
                  r'(assert\s+(?:priority|p)\["next"\]\s*==\s*)"' + re.escape(next_old) + r'"',
                  r'\1"' + next_new + r'"',
                  text,
              )
              total_checkpoint += n1 + n2
              total_next += n3
              path.write_text(text, encoding="utf-8")
          if total_checkpoint != 13:
              raise SystemExit(f"expected 13 checkpoint assertion edits, got {total_checkpoint}")
          if total_next != 6:
              raise SystemExit(f"expected 6 next-unit assertion edits, got {total_next}")
          PY
          git diff --check
          git diff -- public-presence-os/tests/test_cp49_identity_runtime.py \
            public-presence-os/tests/test_cp50_meta_adapters.py \
            public-presence-os/tests/test_cp51_connection_profiles.py \
            public-presence-os/tests/test_cp52_connection_preflight.py \
            public-presence-os/tests/test_cp53_operator_provisioning.py \
            public-presence-os/tests/test_cp54_meta_transport_twin.py \
            public-presence-os/tests/test_cp55_meta_read_only_gate.py \
            public-presence-os/tests/test_cp56_meta_live_read_only_probe.py
      - name: Commit bounded assertion sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-presence-os/tests/test_cp49_identity_runtime.py \
            public-presence-os/tests/test_cp50_meta_adapters.py \
            public-presence-os/tests/test_cp51_connection_profiles.py \
            public-presence-os/tests/test_cp52_connection_preflight.py \
            public-presence-os/tests/test_cp53_operator_provisioning.py \
            public-presence-os/tests/test_cp54_meta_transport_twin.py \
            public-presence-os/tests/test_cp55_meta_read_only_gate.py \
            public-presence-os/tests/test_cp56_meta_live_read_only_probe.py
          git diff --cached --quiet && exit 0
          git commit -m "PPOS CP57: sync historical current-state assertions"
          git push origin HEAD:ppos-cp57-offline-evidence-validator-dry-run
