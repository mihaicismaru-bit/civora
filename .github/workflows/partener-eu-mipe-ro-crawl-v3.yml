name: PARTENER.EU MIPE Romania NAS Crawl v3

on:
  schedule:
    - cron: '20 4,14 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Număr maxim de pagini MIPE'
        required: true
        default: '2000'
        type: string
      max_depth:
        description: 'Adâncime maximă de crawl'
        required: true
        default: '6'
        type: string
      persist:
        description: 'Permite motorului PARTENER să persiste handoff-ul procesat în main'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/state/mipe_ro_v3_trigger.txt'
      - 'partener-eu/ingest/mipe_windows_crawl_v3.py'
      - 'partener-eu/ingest/mipe_windows_crawl_v3_entry.py'
      - '.github/workflows/partener-eu-mipe-ro-crawl-v3.yml'

# SURFACEMC boundary: Romanian runner acquires official MIPE bytes only.
# PARTENER.EU MIPE Engine v3 owns projection, canonicalization and publication.
permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  MIPE_ACQUISITION_ONLY: '1'
  MIPE_RUNTIME_SECONDS: '4800'
  MIPE_PAGE_TIMEOUT_MS: '18000'
  MIPE_PAGE_WAIT_MS: '350'
  MIPE_MAX_DOC_BYTES: '25000000'
  MIPE_MAX_DOCUMENTS: '300'
  MIPE_HEADLESS: '1'
  MIPE_BROWSER_EXECUTABLE: ''
  MIPE_RETRIEVAL_TRANSPORT: 'playwright-chromium-direct-romania-v3'

concurrency:
  group: partener-eu-mipe-ro-crawl-v3
  cancel-in-progress: true

jobs:
  crawl:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, romania-nas]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate NAS Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python - <<'PY'
          import platform, sys
          assert sys.version_info >= (3, 11), sys.version
          assert platform.system() == 'Linux', platform.platform()
          assert platform.machine() in {'x86_64', 'AMD64'}, platform.machine()
          PY

      - name: Validate Chromium, Playwright and document extraction
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.61.0' pypdf
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import pypdf
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=['--disable-dev-shm-usage', '--no-sandbox'])
              page = browser.new_page()
              page.set_content('<title>NAS ready</title>')
              assert page.title() == 'NAS ready'
              browser.close()
          print('Chromium headless ready on NAS')
          PY

      - name: Resolve crawl budget and snapshot non-acquisition outputs
        shell: bash
        run: |
          set -euo pipefail
          pages='2000'; depth='6'; persist='true'
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            [[ -n '${{ inputs.max_pages }}' ]] && pages='${{ inputs.max_pages }}'
            [[ -n '${{ inputs.max_depth }}' ]] && depth='${{ inputs.max_depth }}'
            persist='${{ inputs.persist }}'
          fi
          {
            echo "MIPE_MAX_PAGES=$pages"
            echo "MIPE_MAX_DEPTH=$depth"
            echo "MIPE_PERSIST_REQUESTED=${persist,,}"
            echo "MIPE_STATE_BEFORE_SHA=$(sha256sum partener-eu/ingest/state/mipe_state.json | cut -d' ' -f1)"
            echo "MIPE_FEED_BEFORE_SHA=$(sha256sum partener-eu/web/mipe-news.js | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"
          echo "SURFACEMC acquisition on NAS: max_pages=$pages max_depth=$depth persist_requested=${persist,,}"

      - name: Acquire official MIPE corpus from Romania
        shell: bash
        run: python partener-eu/ingest/mipe_windows_crawl_v3_entry.py

      - name: Enforce acquisition-only boundary and build immutable handoff
        shell: bash
        run: |
          set -euo pipefail
          state="$(sha256sum partener-eu/ingest/state/mipe_state.json | cut -d' ' -f1)"
          feed="$(sha256sum partener-eu/web/mipe-news.js | cut -d' ' -f1)"
          [[ "$state" == "$MIPE_STATE_BEFORE_SHA" ]] || { echo 'SURFACEMC boundary violation: mipe_state.json changed during acquisition' >&2; exit 1; }
          [[ "$feed" == "$MIPE_FEED_BEFORE_SHA" ]] || { echo 'SURFACEMC boundary violation: mipe-news.js changed during acquisition' >&2; exit 1; }
          commit="$(git rev-parse HEAD)"
          echo "MIPE_ACQUISITION_COMMIT=$commit" >> "$GITHUB_ENV"
          MIPE_ACQUISITION_COMMIT="$commit" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          corpus_path=Path('partener-eu/ingest/state/mipe_ro_corpus.json')
          raw=corpus_path.read_bytes();corpus=json.loads(raw)
          run=corpus.get('lastRun') or {}
          assert corpus.get('schemaVersion') == 3
          assert corpus.get('source') == 'MIPE'
          assert run.get('collectorVersion') == '3.0'
          assert run.get('sourceAvailable') is True
          assert any(root.get('ok') for root in run.get('roots',[]))
          for page in corpus.get('pages',[]):
              assert page.get('url','').startswith('https://mfe.gov.ro/')
              assert page.get('verification') == 'CANONICAL_OFFICIAL_FETCH'
              assert page.get('textPreview')
          for doc in corpus.get('documents',[]):
              if doc.get('sha256'):
                  assert doc.get('url','').startswith('https://mfe.gov.ro/')
                  assert len(doc['sha256']) == 64
          digest=hashlib.sha256(raw).hexdigest()
          handoff=Path('_mipe_handoff');handoff.mkdir(exist_ok=True)
          (handoff/'mipe_ro_corpus.json').write_bytes(raw)
          manifest={
              'schema':'PARTENER_MIPE_ACQUISITION_HANDOFF_V1',
              'status':'PASS',
              'acquisitionRunId':os.environ['GITHUB_RUN_ID'],
              'acquisitionRunAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'acquisitionCommit':os.environ['MIPE_ACQUISITION_COMMIT'],
              'corpusSha256':digest,
              'persistRequested':os.environ.get('MIPE_PERSIST_REQUESTED','true').lower() == 'true',
              'observedAt':run.get('observedAt'),
              'collectorVersion':run.get('collectorVersion'),
              'transport':run.get('transport'),
              'policy':{
                  'surfacemcAcquisitionOnly':True,
                  'officialEvidenceOnly':True,
                  'downstreamProcessor':'PARTENER.EU MIPE Engine v3',
              },
          }
          (handoff/'mipe_ro_acquisition_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'corpusSha256':digest,'pages':len(corpus.get('pages',[])),'documents':len(corpus.get('documents',[])),'persistRequested':manifest['persistRequested']},ensure_ascii=False,indent=2))
          PY

      - name: Upload SURFACEMC acquisition handoff
        uses: actions/upload-artifact@v4
        with:
          name: mipe-ro-acquisition-v3
          path: _mipe_handoff
          retention-days: 14
          if-no-files-found: error
