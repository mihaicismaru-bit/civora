name: PARTENER.EU MIPE Windows Crawl v3

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Număr maxim de pagini MIPE'
        required: true
        default: '120'
        type: string
      max_depth:
        description: 'Adâncime maximă de crawl'
        required: true
        default: '3'
        type: string
      persist:
        description: 'Permite motorului PARTENER să persiste handoff-ul procesat în main'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/state/mipe_ro_v3_trigger.txt'
      - 'partener-eu/ingest/mipe_windows_crawl_v3.py'
      - 'partener-eu/ingest/mipe_windows_crawl_v3_entry.py'
      - '.github/workflows/partener-eu-mipe-ro-crawl-v3.yml'

# SURFACEMC boundary: Romanian runner acquires official MIPE bytes only.
# PARTENER.EU MIPE Engine v3 owns projection, canonicalization and publication.
permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  MIPE_ACQUISITION_ONLY: '1'
  MIPE_RUNTIME_SECONDS: '1200'
  MIPE_PAGE_TIMEOUT_MS: '18000'
  MIPE_PAGE_WAIT_MS: '350'
  MIPE_MAX_DOC_BYTES: '25000000'
  MIPE_MAX_DOCUMENTS: '160'

concurrency:
  group: partener-eu-mipe-ro-crawl-v3
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Bootstrap Python 3.12
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $python=$null
          $cmd=Get-Command python.exe -ErrorAction SilentlyContinue
          if($cmd){
            try { & $cmd.Source -c "import sys; assert sys.version_info >= (3,11)"; if($LASTEXITCODE -eq 0){$python=$cmd.Source} } catch {}
          }
          if(-not $python){
            $py=Get-Command py.exe -ErrorAction SilentlyContinue
            if($py){
              try { $candidate=(& $py.Source -3.12 -c "import sys; print(sys.executable)" 2>$null).Trim(); if($candidate -and (Test-Path $candidate)){$python=$candidate} } catch {}
            }
          }
          if(-not $python){
            $version='3.12.10'
            $installer=Join-Path $env:RUNNER_TEMP "python-$version-amd64.exe"
            $target=Join-Path $env:RUNNER_TEMP 'partener-python312'
            Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$version/python-$version-amd64.exe" -OutFile $installer
            $p=Start-Process -FilePath $installer -ArgumentList @('/quiet','InstallAllUsers=0',"TargetDir=$target",'PrependPath=0','Include_launcher=0','Include_test=0','Include_pip=1','SimpleInstall=1') -Wait -PassThru
            if($p.ExitCode -ne 0){throw "Instalarea Python a eșuat: $($p.ExitCode)"}
            $python=Join-Path $target 'python.exe'
          }
          if(-not (Test-Path $python)){throw "Python indisponibil: $python"}
          "PYTHON_EXE=$python" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path $python -Parent) | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & $python --version

      - name: Prepare Edge + Playwright + document extraction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & $env:PYTHON_EXE -m pip install --disable-pip-version-check playwright pypdf
          $candidates=@()
          if(${env:ProgramFiles(x86)}){$candidates += (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')}
          if($env:ProgramFiles){$candidates += (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')}
          if($env:LOCALAPPDATA){$candidates += (Join-Path $env:LOCALAPPDATA 'Microsoft\Edge\Application\msedge.exe')}
          try{$reg=(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\msedge.exe' -ErrorAction Stop).'(default)';if($reg){$candidates+=$reg}}catch{}
          $edge=$candidates|Where-Object{$_ -and (Test-Path $_)}|Select-Object -Unique|Select-Object -First 1
          if($edge){
            Write-Host "Microsoft Edge: $edge"
            "MIPE_BROWSER_EXECUTABLE=$edge" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "MIPE_HEADLESS=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host 'Edge indisponibil; instalez Chromium Playwright.'
            & $env:PYTHON_EXE -m playwright install chromium
            "MIPE_BROWSER_EXECUTABLE=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "MIPE_HEADLESS=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Resolve crawl budget and snapshot non-acquisition outputs
        shell: pwsh
        run: |
          $pages='120'; $depth='3'; $persist='true'
          if('${{ github.event_name }}' -eq 'workflow_dispatch'){
            if('${{ inputs.max_pages }}'){$pages='${{ inputs.max_pages }}'}
            if('${{ inputs.max_depth }}'){$depth='${{ inputs.max_depth }}'}
            $persist='${{ inputs.persist }}'.ToLower()
          }
          "MIPE_MAX_PAGES=$pages" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MIPE_MAX_DEPTH=$depth" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MIPE_PERSIST_REQUESTED=$persist" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $state=(Get-FileHash 'partener-eu/ingest/state/mipe_state.json' -Algorithm SHA256).Hash.ToLower()
          $feed=(Get-FileHash 'partener-eu/web/mipe-news.js' -Algorithm SHA256).Hash.ToLower()
          "MIPE_STATE_BEFORE_SHA=$state" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MIPE_FEED_BEFORE_SHA=$feed" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SURFACEMC acquisition: max_pages=$pages max_depth=$depth persist_requested=$persist"

      - name: Acquire official MIPE corpus from Romania
        shell: pwsh
        run: '& $env:PYTHON_EXE partener-eu/ingest/mipe_windows_crawl_v3_entry.py'

      - name: Enforce acquisition-only boundary and build immutable handoff
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $state=(Get-FileHash 'partener-eu/ingest/state/mipe_state.json' -Algorithm SHA256).Hash.ToLower()
          $feed=(Get-FileHash 'partener-eu/web/mipe-news.js' -Algorithm SHA256).Hash.ToLower()
          if($state -ne $env:MIPE_STATE_BEFORE_SHA){throw 'SURFACEMC boundary violation: mipe_state.json changed during acquisition'}
          if($feed -ne $env:MIPE_FEED_BEFORE_SHA){throw 'SURFACEMC boundary violation: mipe-news.js changed during acquisition'}
          $commit=(git rev-parse HEAD).Trim()
          "MIPE_ACQUISITION_COMMIT=$commit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          @'
          import hashlib,json,os
          from pathlib import Path
          corpus_path=Path('partener-eu/ingest/state/mipe_ro_corpus.json')
          raw=corpus_path.read_bytes();corpus=json.loads(raw)
          run=corpus.get('lastRun') or {}
          assert corpus.get('schemaVersion') == 3
          assert corpus.get('source') == 'MIPE'
          assert run.get('collectorVersion') == '3.0'
          assert run.get('sourceAvailable') is True
          assert any(root.get('ok') for root in run.get('roots',[]))
          for page in corpus.get('pages',[]):
              assert page.get('url','').startswith('https://mfe.gov.ro/')
              assert page.get('verification') == 'CANONICAL_OFFICIAL_FETCH'
              assert page.get('textPreview')
          for doc in corpus.get('documents',[]):
              if doc.get('sha256'):
                  assert doc.get('url','').startswith('https://mfe.gov.ro/')
                  assert len(doc['sha256']) == 64
          digest=hashlib.sha256(raw).hexdigest()
          handoff=Path('_mipe_handoff');handoff.mkdir(exist_ok=True)
          (handoff/'mipe_ro_corpus.json').write_bytes(raw)
          manifest={
              'schema':'PARTENER_MIPE_ACQUISITION_HANDOFF_V1',
              'status':'PASS',
              'acquisitionRunId':os.environ['GITHUB_RUN_ID'],
              'acquisitionRunAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'acquisitionCommit':os.environ['MIPE_ACQUISITION_COMMIT'],
              'corpusSha256':digest,
              'persistRequested':os.environ.get('MIPE_PERSIST_REQUESTED','true').lower() == 'true',
              'observedAt':run.get('observedAt'),
              'collectorVersion':run.get('collectorVersion'),
              'transport':run.get('transport'),
              'policy':{
                  'surfacemcAcquisitionOnly':True,
                  'officialEvidenceOnly':True,
                  'downstreamProcessor':'PARTENER.EU MIPE Engine v3',
              },
          }
          (handoff/'mipe_ro_acquisition_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'corpusSha256':digest,'pages':len(corpus.get('pages',[])),'documents':len(corpus.get('documents',[])),'persistRequested':manifest['persistRequested']},ensure_ascii=False,indent=2))
          '@ | Set-Content -Encoding UTF8 .\validate_mipe_acquisition.py
          & $env:PYTHON_EXE .\validate_mipe_acquisition.py

      - name: Upload SURFACEMC acquisition handoff
        uses: actions/upload-artifact@v4
        with:
          name: mipe-ro-acquisition-v3
          path: _mipe_handoff
          retention-days: 14
          if-no-files-found: error
