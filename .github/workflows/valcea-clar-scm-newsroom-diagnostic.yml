name: VÂLCEA CLAR SCM Newsroom Acceptance Diagnostic

# Acceptance probe only. Candidate diagnostics have no publication authority and
# are emitted as artifacts instead of being committed into canonical state.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/editorial/facts_registry.json'
      - 'valcea-clar/scripts/newsroom_candidate_diagnostic.py'
      - 'valcea-clar/scripts/scm_program_fact_kernel.py'
      - '.github/workflows/valcea-clar-scm-newsroom-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-scm-newsroom-diagnostic-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve current SCM program fact
        id: fact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          doc=json.loads(Path('valcea-clar/editorial/facts_registry.json').read_text(encoding='utf-8'))
          rows=[row for row in doc.get('facts',[]) if row.get('auto_scope')=='scm_official_program_fact_kernel']
          print('story_id=' + (str(rows[-1].get('id')) if rows else ''))
          PY
      - name: Diagnose canonical newsroom acceptance
        if: steps.fact.outputs.story_id != ''
        run: |
          python valcea-clar/scripts/newsroom_candidate_diagnostic.py \
            --story-id "${{ steps.fact.outputs.story_id }}" \
            > /tmp/scm_newsroom_candidate_diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('/tmp/scm_newsroom_candidate_diagnostic.json').read_text(encoding='utf-8'))
          assert doc.get('publication_authority') == 'NONE'
          assert doc.get('candidate_count') == 1
          print(json.dumps(doc, ensure_ascii=False))
          PY
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-scm-newsroom-diagnostic-${{ github.run_id }}
          path: /tmp/scm_newsroom_candidate_diagnostic.json
          if-no-files-found: warn
          retention-days: 7
