name: VÂLCEA CLAR ITM Vâlcea Public Information References

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/itm_valcea_public_information_reference_adapter.py'
      - '.github/workflows/valcea-clar-itm-valcea-public-information-references.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/itm_valcea_public_information_reference_adapter.py'
      - '.github/workflows/valcea-clar-itm-valcea-public-information-references.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-itm-valcea-public-information-references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile ITM Vâlcea public-information reference adapter
        run: python -m py_compile valcea-clar/scripts/itm_valcea_public_information_reference_adapter.py
      - name: Run ITM Vâlcea fail-closed regressions
        run: python valcea-clar/scripts/itm_valcea_public_information_reference_adapter.py --self-test
