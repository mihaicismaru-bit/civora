name: PARTENER.EU Phase 8 Materialize Acquisition Guard

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/partener-cleanup-phase8-surface-boundary-20260822'
    paths:
      - 'partener-eu/ops/apply_mipe_acquisition_only_guard.py'
      - '.github/workflows/partener-eu-phase8-patch-crawler.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/partener-cleanup-phase8-surface-boundary-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact-match acquisition-only guard
        run: python partener-eu/ops/apply_mipe_acquisition_only_guard.py
      - name: Validate crawler syntax and boundary placement
        run: |
          python -m py_compile partener-eu/ingest/mipe_windows_crawl_v3.py
          python - <<'PY'
          from pathlib import Path
          text=Path('partener-eu/ingest/mipe_windows_crawl_v3.py').read_text(encoding='utf-8')
          guard='if os.getenv("MIPE_ACQUISITION_ONLY", "").strip().lower() in {"1", "true", "yes"}:'
          assert text.count(guard) == 1
          assert text.index(guard) > text.index('CORPUS_PATH.write_text')
          assert text.index(guard) < text.index('prior_items = {i.get("url")')
          print('MIPE acquisition-only crawler boundary: PASS')
          PY
      - name: Persist only the tested crawler change
        run: |
          set -euo pipefail
          git config user.name 'partener-phase8-migration[bot]'
          git config user.email 'partener-phase8-migration@users.noreply.github.com'
          git add partener-eu/ingest/mipe_windows_crawl_v3.py
          if git diff --cached --quiet; then
            echo 'Crawler guard already materialized.'
            exit 0
          fi
          git commit -m 'PARTENER phase 8: materialize MIPE acquisition-only guard'
          git push origin HEAD:agent/partener-cleanup-phase8-surface-boundary-20260822
