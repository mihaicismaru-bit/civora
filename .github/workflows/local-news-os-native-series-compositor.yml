name: LOCAL NEWS OS Native Series Compositor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/social/native_series_compositor.py"
      - "local-news-os/social/test_native_series_compositor.py"
      - "local-news-os/social/content_atomizer.py"
      - "local-news-os/social/test_content_atomizer.py"
      - "local-news-os/social/hook_engine.py"
      - "local-news-os/social/test_hook_engine.py"
      - "local-news-os/social/recurring_series_runtime.py"
      - "local-news-os/social/test_recurring_series_runtime.py"
      - "valcea-clar/social/series_registry.json"
      - "valcea-clar/social/channels/**"
      - ".github/workflows/local-news-os-native-series-compositor.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/social/native_series_compositor.py"
      - "local-news-os/social/test_native_series_compositor.py"
      - "local-news-os/social/content_atomizer.py"
      - "local-news-os/social/test_content_atomizer.py"
      - "local-news-os/social/hook_engine.py"
      - "local-news-os/social/test_hook_engine.py"
      - "local-news-os/social/recurring_series_runtime.py"
      - "local-news-os/social/test_recurring_series_runtime.py"
      - "valcea-clar/social/series_registry.json"
      - "valcea-clar/social/channels/**"
      - ".github/workflows/local-news-os-native-series-compositor.yml"

permissions:
  contents: read

concurrency:
  group: local-news-os-native-series-compositor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile native series composition stack
        run: |
          python -m py_compile \
            local-news-os/social/content_atomizer.py \
            local-news-os/social/hook_engine.py \
            local-news-os/social/recurring_series.py \
            local-news-os/social/recurring_series_runtime.py \
            local-news-os/social/native_series_compositor.py \
            local-news-os/social/test_content_atomizer.py \
            local-news-os/social/test_hook_engine.py \
            local-news-os/social/test_recurring_series_runtime.py \
            local-news-os/social/test_native_series_compositor.py

      - name: Run Content Atomizer regression tests
        run: python local-news-os/social/test_content_atomizer.py

      - name: Run Hook Engine regression tests
        run: python local-news-os/social/test_hook_engine.py

      - name: Run Recurring Series Runtime regression tests
        run: python local-news-os/social/test_recurring_series_runtime.py

      - name: Run Native Series Compositor acceptance tests
        run: python local-news-os/social/test_native_series_compositor.py

      - name: Validate native format coverage for every configured recurring series
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          social_dir = Path('local-news-os/social').resolve()
          sys.path.insert(0, str(social_dir))
          module_path = social_dir / 'native_series_compositor.py'
          spec = importlib.util.spec_from_file_location('native_series_compositor', module_path)
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)

          registry = json.loads(Path('valcea-clar/social/series_registry.json').read_text(encoding='utf-8'))
          if registry.get('instance_id') != 'valcea':
              raise SystemExit('series registry instance mismatch')

          for channel_id in sorted(registry.get('channels', {})):
              if not channel_id.startswith('valcea-'):
                  raise SystemExit(f'{channel_id}: non-canonical channel id')
              platform = channel_id[len('valcea-'):]
              config_path = Path(f'valcea-clar/social/channels/{platform}.json')
              if not config_path.exists():
                  raise SystemExit(f'{channel_id}: missing CHANNEL_CONFIG {config_path}')
              channel = json.loads(config_path.read_text(encoding='utf-8'))
              if channel.get('channel_id') != channel_id or channel.get('instance_id') != 'valcea':
                  raise SystemExit(f'{channel_id}: CHANNEL_CONFIG identity mismatch')
              if channel.get('zero_paid_dependency') is not True:
                  raise SystemExit(f'{channel_id}: zero_paid_dependency must be true')
              if (channel.get('metrics') or {}).get('observed_only') is not True:
                  raise SystemExit(f'{channel_id}: observed-only metrics required')
              if platform not in mod.SERIES_PROFILES:
                  raise SystemExit(f'{channel_id}: no compositor profile')

              declared_series = {
                  item.get('series_id')
                  for item in channel.get('series', [])
                  if isinstance(item, dict) and item.get('series_id')
              }
              policies = registry['channels'][channel_id]
              for policy in policies:
                  series_id = policy.get('series_id')
                  if series_id not in declared_series:
                      raise SystemExit(f'{channel_id}/{series_id}: series missing from CHANNEL_CONFIG')
                  story_count = max(int(policy.get('min_items', 1)), 1)
                  selected = mod.select_native_format(channel, policy.get('preferred_formats', []), story_count)
                  if not selected:
                      raise SystemExit(f'{channel_id}/{series_id}: no compatible staged native format')
                  print(f'{channel_id}/{series_id}: PASS -> {selected}')
          PY
