name: VÂLCEA CLAR Facebook Editorial Adapter

on:
  pull_request:
    paths:
      - "valcea-clar/social/facebook_editorial_publish.py"
      - "valcea-clar/social/facebook_editorial_preview*.py"
      - "valcea-clar/social/facebook_visual_system.json"
      - "valcea-clar/social/editorial_asset_contract.py"
      - "valcea-clar/social/story_visuals.json"
      - "valcea-clar/social/fetch_approved_photos.py"
      - "valcea-clar/social/facebook_state.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-facebook-editorial-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install deterministic renderer dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch approved photographs
        run: python valcea-clar/social/fetch_approved_photos.py
      - name: Compile adapter
        run: python -m py_compile valcea-clar/social/facebook_editorial_publish.py
      - name: Offline self-test including mock Meta upload
        run: python valcea-clar/social/facebook_editorial_publish.py --self-test
      - name: Dry-run canonical current state
        run: python valcea-clar/social/facebook_editorial_publish.py | tee /tmp/facebook-editorial-dry-run.json
      - name: Assert adoption does not republish existing stories
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/facebook-editorial-dry-run.json').read_text(encoding='utf-8'))
          if value.get('status')!='DRY_RUN':
              raise SystemExit('unexpected dry-run status')
          if value.get('eligible'):
              raise SystemExit(f"already-live fixture unexpectedly eligible: {[x.get('story_id') for x in value['eligible']]}")
          skipped={x.get('story_id'):x.get('reason') for x in value.get('skipped',[])}
          for story_id in ('luminos-fest-zavoi-20260815','florile-govorei-20260816','olanesti-bridge-monitor'):
              # Florile may be a utility HOLD rather than a published skip depending on historical state.
              if story_id == 'florile-govorei-20260816':
                  continue
              if skipped.get(story_id)!='already_published':
                  raise SystemExit(f'{story_id} did not inherit legacy dedupe state')
          print('Facebook editorial adoption dedupe: PASS')
          PY
      - name: Assert live apply is feature-gated
        run: |
          set -euo pipefail
          output="$(python valcea-clar/social/facebook_editorial_publish.py --apply)"
          printf '%s\n' "$output" > /tmp/facebook-editorial-apply-gated.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/facebook-editorial-apply-gated.json').read_text(encoding='utf-8'))
          # With the canonical already-published fixtures the safest result is NO_ELIGIBLE_POSTS.
          # If a future fixture becomes eligible in CI, it still must be blocked by the explicit live flag.
          if value.get('status') not in {'NO_ELIGIBLE_POSTS','BLOCKED_EDITORIAL_LIVE_NOT_ENABLED'}:
              raise SystemExit(f"unsafe apply result: {value.get('status')}")
          print('Facebook editorial live gate: PASS')
          PY
      - name: Upload adapter audit
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-facebook-editorial-adapter-${{ github.run_id }}
          path: |
            /tmp/facebook-editorial-dry-run.json
            /tmp/facebook-editorial-apply-gated.json
            valcea-clar/social/runtime/editorial/facebook
          if-no-files-found: warn
          retention-days: 14
