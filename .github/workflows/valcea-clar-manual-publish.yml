name: VÂLCEA CLAR Manual Publish Intake

# Optional operator accelerator only. Queue changes already trigger Fact Kernel
# directly; workflow_dispatch validates the queue and asks the canonical facts
# writer to run now. It never writes facts, archive or runtime itself.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/editorial/manual_publish_queue.json'
      - 'valcea-clar/scripts/promote_manual_publish_queue.py'
      - 'valcea-clar/scripts/fact_kernel_orchestrator.py'
      - '.github/workflows/valcea-clar-manual-publish.yml'

permissions:
  contents: read
  actions: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate manual intake contract
        run: |
          python -m py_compile valcea-clar/scripts/promote_manual_publish_queue.py
          python valcea-clar/scripts/promote_manual_publish_queue.py --self-test
          if [ -s valcea-clar/editorial/manual_publish_queue.json ]; then
            python valcea-clar/scripts/promote_manual_publish_queue.py
          else
            echo 'No manual publication queue present.'
          fi
      - name: Dispatch canonical Fact Kernel now
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run valcea-clar-fact-kernel.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Canonical Fact Kernel dispatch accepted.'
