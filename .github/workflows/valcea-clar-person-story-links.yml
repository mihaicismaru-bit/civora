name: VÂLCEA CLAR Person Story Links

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VÂLCEA CLAR Live Newsroom", "VÂLCEA CLAR People Intelligence"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/link_person_profiles.py'
      - '.github/workflows/valcea-clar-person-story-links.yml'
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: write

concurrency:
  group: valcea-clar-person-story-links
  cancel-in-progress: false

jobs:
  link:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate person story linker
        run: python -m py_compile valcea-clar/scripts/link_person_profiles.py

      - name: Persist bidirectional person links from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vâlcea-clar-person-links[bot]'
          git config user.email 'valcea-clar-person-links@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ ! -s valcea-clar/site/runtime/people.json ] || [ ! -s valcea-clar/site/runtime/live-feed.json ]; then
              echo 'People Intelligence or live feed is not materialized yet.'
              exit 0
            fi
            python valcea-clar/scripts/link_person_profiles.py
            git add valcea-clar/site/runtime/live-feed.json valcea-clar/site/runtime/stiri
            if git diff --cached --quiet; then
              echo 'Story-to-person links already current.'
              exit 0
            fi
            git commit -m 'Link VÂLCEA CLAR stories to public person profiles'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Could not persist person story links.' >&2
          exit 1
