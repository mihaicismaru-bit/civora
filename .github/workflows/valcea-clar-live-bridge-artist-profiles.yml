name: VÂLCEA CLAR Live Bridge Artist Profiles Compatibility Check

# Historical bridge patcher retained for compatibility checks only. Public artist
# profile projection is owned by Identity Intelligence + canonical site export.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/patch_live_bridge_artist_profiles.py'
      - 'valcea-clar/site/chatgpt-sites-live-bridge.js'
      - '.github/workflows/valcea-clar-live-bridge-artist-profiles.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate historical bridge contract without persistence
        run: |
          python -m py_compile valcea-clar/scripts/patch_live_bridge_artist_profiles.py
          python valcea-clar/scripts/patch_live_bridge_artist_profiles.py
          python valcea-clar/scripts/patch_live_bridge_artist_profiles.py --check
      - name: Validate canonical profile ownership
        run: |
          grep -Fq 'link_artist_profiles.py' valcea-clar/scripts/overlay_runtime_export.py
          echo 'Artist story/profile projection is owned by canonical export.'
