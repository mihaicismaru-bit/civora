name: EUCONS Opportunity Official Source Authority

on:
  pull_request:
    paths:
      - 'eucons/opportunities/matching_contract.json'
      - 'eucons/opportunities/match_opportunities.py'
      - 'eucons/prospects/prospect_opportunity_match_contract.json'
      - 'eucons/prospects/prospect_opportunity_match.py'
      - 'eucons/crm/pipeline_contract.json'
      - 'eucons/crm/pipeline_engine.py'
      - 'eucons/preview/preview_engine.py'
      - 'eucons/validation/validate_opportunity_matching.py'
      - 'eucons/validation/test_opportunity_matching_fail_closed.py'
      - 'eucons/validation/validate_prospect_opportunity_match.py'
      - 'eucons/validation/test_prospect_opportunity_match_fail_closed.py'
      - 'eucons/validation/validate_pipeline.py'
      - 'eucons/validation/test_pipeline_fail_closed.py'
      - '.github/workflows/eucons-opportunity-official-source-authority.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/opportunities/matching_contract.json'
      - 'eucons/opportunities/match_opportunities.py'
      - 'eucons/prospects/prospect_opportunity_match_contract.json'
      - 'eucons/prospects/prospect_opportunity_match.py'
      - 'eucons/crm/pipeline_contract.json'
      - 'eucons/crm/pipeline_engine.py'
      - 'eucons/preview/preview_engine.py'
      - 'eucons/validation/validate_opportunity_matching.py'
      - 'eucons/validation/test_opportunity_matching_fail_closed.py'
      - 'eucons/validation/validate_prospect_opportunity_match.py'
      - 'eucons/validation/test_prospect_opportunity_match_fail_closed.py'
      - 'eucons/validation/validate_pipeline.py'
      - 'eucons/validation/test_pipeline_fail_closed.py'
      - '.github/workflows/eucons-opportunity-official-source-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-opportunity-official-source-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile E10, R07 and R10 engines
        run: python -m py_compile eucons/opportunities/match_opportunities.py eucons/prospects/prospect_opportunity_match.py eucons/crm/pipeline_engine.py
      - name: Validate opportunity matching official-source authority
        run: python eucons/validation/validate_opportunity_matching.py
      - name: Test opportunity matching official-source fail-closed behavior
        run: python eucons/validation/test_opportunity_matching_fail_closed.py
      - name: Validate prospect-opportunity-service authority propagation
        run: python eucons/validation/validate_prospect_opportunity_match.py
      - name: Test prospect matching official-source fail-closed behavior
        run: python eucons/validation/test_prospect_opportunity_match_fail_closed.py
      - name: Validate unified pipeline authority propagation
        run: python eucons/validation/validate_pipeline.py
      - name: Test unified pipeline authority fail-closed behavior
        run: python eucons/validation/test_pipeline_fail_closed.py
