name: PARTENER.EU AFIR Coverage Pages Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partener-eu-afir-pages-bridge.yml'
      - 'partener-eu/ops/test_pages_trigger_contract.py'
  workflow_run:
    workflows:
      - 'PARTENER.EU AFIR September Coverage'
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: partener-eu-afir-pages-bridge
  cancel-in-progress: true

jobs:
  dispatch-pages:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate publication trigger contract
        run: python partener-eu/ops/test_pages_trigger_contract.py

      - name: Dispatch canonical PARTENER.EU Pages on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run partener-eu-pages.yml --repo "$REPOSITORY" --ref main
          echo 'Canonical PARTENER.EU Pages dispatch accepted.'
