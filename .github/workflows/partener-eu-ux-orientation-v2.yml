name: PARTENER.EU UX Orientation v2 QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'partener-eu/web/index.html'
      - 'partener-eu/web/ux-orientation-v2.css'
      - 'partener-eu/web/ux-orientation-v2.js'
      - 'partener-eu/ops/test_ux_orientation_v2.py'
      - 'partener-eu/ops/test_ux_orientation_browser_v2.py'
      - '.github/workflows/partener-eu-ux-orientation-v2.yml'
  push:
    branches:
      - 'agent/partener-ux-optimization-v2-orientation-20260822'
    paths:
      - 'partener-eu/web/index.html'
      - 'partener-eu/web/ux-orientation-v2.css'
      - 'partener-eu/web/ux-orientation-v2.js'
      - 'partener-eu/ops/test_ux_orientation_v2.py'
      - 'partener-eu/ops/test_ux_orientation_browser_v2.py'
      - '.github/workflows/partener-eu-ux-orientation-v2.yml'

permissions:
  contents: read

concurrency:
  group: partener-eu-ux-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: node --check partener-eu/web/ux-orientation-v2.js
      - name: V1 baseline remains valid
        run: |
          node --check partener-eu/web/ux-optimization-v1.js
          python partener-eu/ops/test_ux_optimization_v1.py
      - name: V2 orientation contract
        run: python partener-eu/ops/test_ux_orientation_v2.py
      - name: Install browser harness
        run: python -m pip install --disable-pip-version-check playwright
      - name: Start isolated PARTENER.EU branch server
        run: |
          python -m http.server 4174 --bind 127.0.0.1 --directory partener-eu/web >/tmp/partener-ux-v2-http.log 2>&1 &
          echo $! >/tmp/partener-ux-v2-http.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/index.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/partener-ux-v2-http.log
          exit 1
      - name: Desktop and mobile orientation proof
        run: python partener-eu/ops/test_ux_orientation_browser_v2.py
      - name: Upload orientation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-ux-orientation-v2-proof
          path: |
            partener-eu/ops/ux-orientation-v2-browser-proof.json
            partener-eu/ops/ux-orientation-v2-screenshots/*.png
            /tmp/partener-ux-v2-http.log
          if-no-files-found: warn
