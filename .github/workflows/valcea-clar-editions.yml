name: VÂLCEA CLAR Autonomous Editions

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Edition slot"
        required: true
        default: "auto"
        type: choice
        options: [auto, morning, evening]
  push:
    branches: [main]
    paths:
      - "valcea-clar/ops/autonomous-edition-trigger.json"
  schedule:
    # Run both UTC candidates for Romanian DST. Scheduled runs use wide local
    # recovery windows plus a publishable-edition idempotency guard, so a late
    # GitHub Actions start can still recover without publishing the slot twice.
    - cron: "45 4,5 * * *"
    - cron: "30 15,16 * * *"

permissions:
  contents: write

concurrency:
  group: valcea-clar-autonomous-editions
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve Romanian edition slot
        id: slot
        shell: bash
        env:
          REQUESTED_SLOT: ${{ github.event.inputs.slot || 'auto' }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            slot="$REQUESTED_SLOT"
            if [ "$slot" = "auto" ]; then
              hour=$(TZ=Europe/Bucharest date +%H)
              if [ "$hour" -lt 15 ]; then slot=morning; else slot=evening; fi
            fi
            echo "run_generation=true" >> "$GITHUB_OUTPUT"
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            slot=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('valcea-clar/ops/autonomous-edition-trigger.json')
          try:
              value = json.loads(path.read_text(encoding='utf-8')).get('slot', 'auto')
          except Exception:
              value = 'auto'
          print(value if value in {'auto', 'morning', 'evening'} else 'auto')
          PY
            )
            if [ "$slot" = "auto" ]; then
              hour=$(TZ=Europe/Bucharest date +%H)
              if [ "$hour" -lt 15 ]; then slot=morning; else slot=evening; fi
            fi
            echo "run_generation=true" >> "$GITHUB_OUTPUT"
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
            echo "reason=explicit_engine_trigger" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=Europe/Bucharest date +%H)
          minute=$(TZ=Europe/Bucharest date +%M)
          local_date=$(TZ=Europe/Bucharest date +%F)
          local_now=$(TZ=Europe/Bucharest date -Iseconds)
          now_minutes=$((10#$hour * 60 + 10#$minute))

          # GitHub scheduled workflows can start substantially later than the
          # cron minute. Both DST candidates therefore act as recovery attempts.
          # A publishable edition guard below makes those attempts idempotent.
          # Morning recovery: 07:30-10:59. Evening recovery: 18:15-21:59.
          if [ "$now_minutes" -ge 450 ] && [ "$now_minutes" -le 659 ]; then
            slot=morning
          elif [ "$now_minutes" -ge 1095 ] && [ "$now_minutes" -le 1319 ]; then
            slot=evening
          else
            echo "run_generation=false" >> "$GITHUB_OUTPUT"
            echo "slot=skip" >> "$GITHUB_OUTPUT"
            echo "reason=outside_recovery_window" >> "$GITHUB_OUTPUT"
            echo "Nothing due at $local_now."
            exit 0
          fi

          candidate="valcea-clar/editions/${local_date}-${slot}.json"
          if [ -f "$candidate" ] && python - "$candidate" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          publishable = (
              payload.get('publication_intent') == 'publish'
              and payload.get('status') in {'auto_approved', 'editor_approved'}
          )
          raise SystemExit(0 if publishable else 1)
          PY
          then
            echo "run_generation=false" >> "$GITHUB_OUTPUT"
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
            echo "reason=already_published" >> "$GITHUB_OUTPUT"
            echo "Idempotency guard: ${local_date}-${slot} is already publishable."
            exit 0
          fi

          echo "run_generation=true" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "reason=recovery_window_due" >> "$GITHUB_OUTPUT"
          echo "Generation due for ${local_date}-${slot} at $local_now."

      - name: Self-test autonomous generators
        if: steps.slot.outputs.run_generation == 'true'
        run: |
          python valcea-clar/scripts/generate_edition.py --self-test
          python local-news-os/core/discover_primary_source_facts.py --self-test

      - name: Refresh source radar
        if: steps.slot.outputs.run_generation == 'true'
        run: python valcea-clar/scripts/probe_sources.py

      - name: Discover fresh primary-source facts through Local News OS
        if: steps.slot.outputs.run_generation == 'true'
        run: |
          python local-news-os/core/discover_primary_source_facts.py \
            --instance valcea \
            --output valcea-clar/editorial/auto_facts.json \
            --state valcea-clar/editorial/news_discovery_state.json

      - name: Refresh Unde ieșim ingestion
        if: steps.slot.outputs.run_generation == 'true'
        run: |
          python valcea-clar/ingest/venue_ingest.py --timeout 12
          python valcea-clar/validation/validate.py
          python valcea-clar/scripts/reconcile_ingest.py

      - name: Rebuild fail-closed public projection
        if: steps.slot.outputs.run_generation == 'true'
        run: python valcea-clar/scripts/build_public_data.py

      - name: Generate verified edition
        if: steps.slot.outputs.run_generation == 'true'
        run: python valcea-clar/scripts/generate_edition.py --slot "${{ steps.slot.outputs.slot }}"

      - name: Validate edition and last-known-good policy
        if: steps.slot.outputs.run_generation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('valcea-clar')
          attempt=json.loads((root/'site/last_edition_attempt.json').read_text(encoding='utf-8'))
          pointer=json.loads((root/'site/current_edition.json').read_text(encoding='utf-8'))
          pointed=json.loads((root/pointer['json_source']).read_text(encoding='utf-8'))
          auto=json.loads((root/'editorial/auto_facts.json').read_text(encoding='utf-8'))
          assert pointed['generator'] == 'deterministic_zero_llm_v2'
          assert pointed['policy']['llm_required'] is False
          assert pointed['policy']['external_paid_api_required'] is False
          assert pointed['policy'].get('last_known_good_fallback') is True
          assert pointed['policy'].get('primary_source_auto_scope') == 'title_date_source_only'
          assert pointed['policy'].get('article_body_material_facts_autopublish') is False
          assert auto['policy']['llm_required'] is False
          assert auto['policy']['external_paid_api_required'] is False
          assert auto['policy']['article_body_material_facts_autopublish'] is False
          assert auto.get('instance_id') == 'valcea'
          assert auto.get('source_contract') == 'SOURCE_PACK_V1'
          assert auto.get('migration_adapter') == 'local_news_os_primary_source_compat_v1'
          if attempt['publication_intent'] == 'publish':
              assert attempt['status'] == 'auto_approved'
              assert attempt['editorial_fact_count'] >= 1
              assert pointer['edition_id'] == attempt['edition_id']
              assert pointer['homepage_role'] == 'primary_lead'
              assert pointed['publication_intent'] == 'publish'
          else:
              assert attempt['status'] == 'auto_hold'
              if pointer['publication_intent'] == 'publish':
                  assert pointer['edition_id'] != attempt['edition_id']
                  assert pointer['homepage_role'] == 'primary_lead'
              else:
                  assert pointer['homepage_role'] == 'hidden'
          print(json.dumps({
              'attempt': attempt,
              'public_pointer': pointer['edition_id'],
              'auto_fact_registry_count': len(auto.get('facts', [])),
              'instance_id': auto['instance_id'],
              'source_contract': auto['source_contract']
          }))
          PY

      - name: Render autonomous frontpage
        if: steps.slot.outputs.run_generation == 'true'
        run: |
          python valcea-clar/scripts/render_frontpage.py
          python valcea-clar/scripts/build_live_feed.py

      - name: Build frontpage/site synchronization payload
        if: steps.slot.outputs.run_generation == 'true'
        run: |
          python valcea-clar/scripts/build_sites_export.py
          python valcea-clar/scripts/overlay_runtime_export.py

      - name: Validate rendered runtime
        if: steps.slot.outputs.run_generation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s valcea-clar/site/runtime/index.html
          test -s valcea-clar/site/runtime/live-feed.json
          test -s valcea-clar/dist/chatgpt-sites/index.html
          test -s valcea-clar/dist/chatgpt-sites/live-feed.json
          python - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path('valcea-clar/site/runtime/live-feed.json').read_text(encoding='utf-8'))
          manifest=json.loads(Path('valcea-clar/dist/chatgpt-sites/manifest.json').read_text(encoding='utf-8'))
          assert feed['policy']['paid_llm_api_required'] is False
          assert feed['edition']['generator'] == 'deterministic_zero_llm_v2'
          assert manifest['target']['autonomous_frontpage'] is True
          assert manifest['routes'][0]['path'] == '/'
          print(json.dumps({'frontpage':'PASS','edition_id':feed['edition']['edition_id'],'routes':manifest['counts']['routes']}))
          PY

      - name: Persist autonomous edition and runtime state
        if: steps.slot.outputs.run_generation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vâlcea-clar-autonomous-editor"
          git config user.email "valcea-clar-autonomous-editor@users.noreply.github.com"
          git add \
            valcea-clar/editions \
            valcea-clar/editorial/auto_facts.json \
            valcea-clar/editorial/news_discovery_state.json \
            valcea-clar/site/current_edition.json \
            valcea-clar/site/last_edition_attempt.json \
            valcea-clar/site/runtime \
            valcea-clar/state/source_health.json \
            valcea-clar/ingest/state \
            valcea-clar/web/unde-iesim.json \
            valcea-clar/web/data \
            valcea-clar/validation/latest_report.json \
            valcea-clar/ops/ingest_reconciliation.json \
            valcea-clar/ops/ingest_review_queue.json \
            valcea-clar/ops/resolution_tasks || true
          if git diff --cached --quiet; then
            echo "No autonomous editorial changes to persist."
            exit 0
          fi
          git commit -m "Publish autonomous VÂLCEA CLAR ${{ steps.slot.outputs.slot }} edition and frontpage"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Could not persist autonomous edition after five attempts." >&2
          exit 1

      - name: Upload site payload for runtime bridge
        if: steps.slot.outputs.run_generation == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-autonomous-site-${{ steps.slot.outputs.slot }}-${{ github.run_id }}
          path: valcea-clar/dist/chatgpt-sites
          if-no-files-found: error
          retention-days: 7
