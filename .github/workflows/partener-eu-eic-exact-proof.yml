name: PARTENER.EU EIC Exact Topic Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eu_direct_eic_ft_exact.py'
      - 'partener-eu/ingest/eu_direct_eic_ft_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_eic_ft_exact.py'
      - 'partener-eu/ops/test_eu_direct_eic_ft_reconcile.py'
      - 'partener-eu/ingest/funding_tenders_fetch.py'
      - 'partener-eu/ingest/funding_tenders_api.py'
      - '.github/workflows/partener-eu-eic-exact-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eic-exact-topic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile exact EIC adapter and regressions
        run: |
          python -m py_compile \
            partener-eu/ingest/eu_direct_eic_ft_exact.py \
            partener-eu/ingest/eu_direct_eic_ft_reconcile.py \
            partener-eu/ops/test_eu_direct_eic_ft_exact.py \
            partener-eu/ops/test_eu_direct_eic_ft_reconcile.py

      - name: Validate fail-closed exact EIC semantics
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: |
          python partener-eu/ops/test_eu_direct_eic_ft_exact.py
          python partener-eu/ops/test_eu_direct_eic_ft_reconcile.py

      - name: Prepare replay root
        run: |
          ROOT=/tmp/partener-eu-eic-exact-proof
          rm -rf "$ROOT"
          mkdir -p "$ROOT/current"

      - name: Acquire fresh exact EIC Funding and Tenders evidence
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          python partener-eu/ingest/eu_direct_eic_ft_exact.py \
            --reference 'HORIZON-EIC-2026-PATHFINDERCHALLENGES-01-01' \
            --discovery-source-url 'https://eic.ec.europa.eu/eic-funding-opportunities/eic-pathfinder/eic-pathfinder-challenges-2026_en' \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-eic-exact" \
            --output-dir /tmp/partener-eu-eic-exact-proof/current

      - name: Reconcile exact EIC baseline non-authorizing
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          python partener-eu/ingest/eu_direct_eic_ft_reconcile.py \
            /tmp/partener-eu-eic-exact-proof/current/ft-eic-exact-evidence.json \
            --output /tmp/partener-eu-eic-exact-proof/current/eic-exact-reconciliation.json

      - name: Enforce live exact EIC boundary
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('/tmp/partener-eu-eic-exact-proof/current')
          evidence=json.loads((root/'ft-eic-exact-evidence.json').read_text(encoding='utf-8'))
          rec=json.loads((root/'eic-exact-reconciliation.json').read_text(encoding='utf-8'))
          ref='HORIZON-EIC-2026-PATHFINDERCHALLENGES-01-01'
          assert evidence['schema'] == 'PARTENER_EU_EIC_FT_EXACT_EVIDENCE_V1'
          assert evidence['reference'] == ref
          assert evidence['programme_family'] == 'HORIZON_EUROPE_EIC'
          assert evidence['authority_url_verified'] is True
          assert 'horizon europe' in str(evidence['programme_label_official']).casefold()
          assert evidence['candidate_state'] in {'OPEN_CALL','FORTHCOMING_CALL','CLOSED_CALL','UNKNOWN'}
          assert evidence['status_label']
          assert re.fullmatch(r'[0-9a-f]{64}', evidence['exact_semantic_fingerprint'])
          for key in ('material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized'):
              assert evidence[key] is False, (key,evidence[key])
          assert rec['schema'] == 'PARTENER_EU_EIC_FT_RECONCILIATION_V1'
          assert rec['reference'] == ref
          assert rec['reconciliation_state'] == 'BASELINE_CAPTURED_NON_AUTHORIZING'
          assert rec['semantic_reconciliation_passed'] is True
          assert rec['field_scoped_material_admission_required'] is True
          assert 'field_scoped_material_admission' in set(rec['missing_for_material_admission'])
          for key in ('material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized'):
              assert rec[key] is False, (key,rec[key])
          print(json.dumps({
              'reference': ref,
              'candidate_state': evidence['candidate_state'],
              'status_label': evidence['status_label'],
              'reconciliation_state': rec['reconciliation_state'],
              'material_admission_ready_for_downstream_review': rec['material_admission_ready_for_downstream_review'],
              'open_call_authorized': False,
              'publication_effect': 'NONE',
          }, sort_keys=True))
          PY

      - name: Upload replayable EIC exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-eic-exact-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-eic-exact-proof
          if-no-files-found: error
          retention-days: 7
