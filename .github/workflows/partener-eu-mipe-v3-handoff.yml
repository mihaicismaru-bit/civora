name: PARTENER.EU MIPE v3 Deployment Handoff

on:
  workflow_run:
    workflows:
      - 'PARTENER.EU MIPE Windows Crawl v3'
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: partener-eu-mipe-v3-deployment-handoff
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch Pages and Production Validation on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in partener-eu-pages.yml partener-eu-validation.yml; do
            code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"main"}')
            cat /tmp/dispatch.json || true
            test "$code" = "204"
            echo "Dispatched ${workflow}: HTTP ${code}"
          done
