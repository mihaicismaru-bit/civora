name: PARTENER.EU EaSI Programme Intelligence Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eu_direct_easi_programme_intelligence_registry.json'
      - 'partener-eu/ingest/eu_direct_easi_programme_intelligence.py'
      - 'partener-eu/ingest/eu_direct_easi_programme_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_easi_programme_intelligence.py'
      - 'partener-eu/ops/test_eu_direct_easi_programme_reconcile.py'
      - '.github/workflows/partener-eu-easi-programme-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  easi-programme-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile registry adapters reconciliation and regressions
        run: |
          python -m json.tool partener-eu/ingest/eu_direct_easi_programme_intelligence_registry.json >/dev/null
          python -m py_compile \
            partener-eu/ingest/eu_direct_easi_programme_intelligence.py \
            partener-eu/ingest/eu_direct_easi_programme_reconcile.py \
            partener-eu/ops/test_eu_direct_easi_programme_intelligence.py \
            partener-eu/ops/test_eu_direct_easi_programme_reconcile.py

      - name: Validate fail-closed EaSI semantics and reconciliation
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: |
          python partener-eu/ops/test_eu_direct_easi_programme_intelligence.py -v
          python partener-eu/ops/test_eu_direct_easi_programme_reconcile.py -v

      - name: Prepare replay root
        run: |
          ROOT=/tmp/partener-eu-easi-programme-proof
          rm -rf "$ROOT"
          mkdir -p "$ROOT/current" "$ROOT/previous" "$ROOT/history"

      - name: Restore previous same-branch EaSI snapshot when identity-compatible
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-easi-programme-proof
          SCRATCH=/tmp/partener-eu-easi-history-scan
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH" "$ROOT/previous"
          gh api "repos/${REPOSITORY}/actions/artifacts?per_page=100" > "$SCRATCH/artifacts.json"
          python - <<'PY'
          import json, os, pathlib, subprocess, zipfile
          root=pathlib.Path('/tmp/partener-eu-easi-programme-proof')
          scratch=pathlib.Path('/tmp/partener-eu-easi-history-scan')
          data=json.loads((scratch/'artifacts.json').read_text(encoding='utf-8'))
          head=os.environ['HEAD_SHA']; branch=os.environ['HEAD_BRANCH']
          rows=[]
          for artifact in data.get('artifacts') or []:
              name=str(artifact.get('name') or '')
              if not (name.startswith('partener-eu-easi-programme-history-') or name.startswith('partener-eu-easi-programme-proof-') or name.startswith('partener-eu-eu-direct-programme-intelligence-')):
                  continue
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              if str(run.get('head_sha') or '') == head:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              rows.append((str(artifact.get('created_at') or ''), int(artifact.get('id') or 0), name))
          rows.sort(reverse=True)
          metadata={'previous_found':False,'artifact_id':None,'artifact_name':None,'restore_reason':'NO_PREVIOUS_COMPATIBLE_ARTIFACT'}
          for _, artifact_id, artifact_name in rows:
              z=scratch/f'{artifact_id}.zip'
              subprocess.run(['gh','api',f"repos/{os.environ['REPOSITORY']}/actions/artifacts/{artifact_id}/zip"], stdout=z.open('wb'), check=True)
              unpack=scratch/f'unpack-{artifact_id}'; unpack.mkdir()
              with zipfile.ZipFile(z) as archive:
                  archive.extractall(unpack)
              candidates=list(unpack.rglob('easi-programme-intelligence.json'))
              if not candidates:
                  continue
              candidate=json.loads(candidates[0].read_text(encoding='utf-8'))
              if candidate.get('schema')!='PARTENER_EU_EASI_PROGRAMME_INTELLIGENCE_V1' or candidate.get('programme_id')!='ESF_PLUS_EASI':
                  continue
              inventory=sorted((str(r.get('source_id') or ''),str(r.get('authority_url') or ''),str(r.get('observation_state') or '')) for r in candidate.get('evidence') or [])
              if len(inventory)!=4:
                  continue
              (root/'previous'/'easi-programme-intelligence.json').write_text(json.dumps(candidate,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
              metadata.update({'previous_found':True,'artifact_id':artifact_id,'artifact_name':artifact_name,'restore_reason':'SAME_PROGRAMME_SOURCE_IDENTITY_CANDIDATE'})
              break
          (root/'previous'/'restore-metadata.json').write_text(json.dumps(metadata,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as out:
              out.write('previous_found=' + ('true' if metadata['previous_found'] else 'false') + '\n')
          print(json.dumps(metadata,sort_keys=True))
          PY

      - name: Acquire fresh official EaSI programme intelligence
        run: |
          ROOT=/tmp/partener-eu-easi-programme-proof
          python partener-eu/ingest/eu_direct_easi_programme_intelligence.py \
            --registry partener-eu/ingest/eu_direct_easi_programme_intelligence_registry.json \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$ROOT/current/easi-programme-intelligence.json"
          cp partener-eu/ingest/eu_direct_easi_programme_intelligence_registry.json "$ROOT/current/registry.json"

      - name: Reconcile current EaSI snapshot against previous same identity
        env:
          PREVIOUS_FOUND: ${{ steps.restore.outputs.previous_found }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-easi-programme-proof
          ARGS=()
          if [ "$PREVIOUS_FOUND" = "true" ]; then
            ARGS+=(--previous "$ROOT/previous/easi-programme-intelligence.json")
          fi
          python partener-eu/ingest/eu_direct_easi_programme_reconcile.py \
            "$ROOT/current/easi-programme-intelligence.json" \
            "${ARGS[@]}" \
            --output "$ROOT/current/easi-programme-reconciliation.json"

      - name: Enforce live non-authorizing EaSI boundary
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('/tmp/partener-eu-easi-programme-proof/current')
          d=json.loads((root/'easi-programme-intelligence.json').read_text(encoding='utf-8'))
          rec=json.loads((root/'easi-programme-reconciliation.json').read_text(encoding='utf-8'))
          assert d['schema']=='PARTENER_EU_EASI_PROGRAMME_INTELLIGENCE_V1'
          assert d['source_family']=='EU_DIRECT' and d['programme_id']=='ESF_PLUS_EASI'
          assert d['source_count']==4 and d['healthy_source_count']+d['degraded_source_count']==4
          assert d['source_health_state'] in {'HEALTHY','DEGRADED'}
          assert d['market_intelligence_only'] is True
          assert d['fit_score_is_not_eligibility'] is True
          assert d['partner_intelligence_is_not_call_eligibility'] is True
          flags=(
              'material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized',
              'budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized',
              'call_alert_authorized','canonical_corpus_mutation',
          )
          assert all(d[k] is False for k in flags) and all(rec[k] is False for k in flags)
          assert d['publication_effect']=='NONE' and rec['publication_effect']=='NONE'
          assert {r['observation_state'] for r in d['evidence']}=={
              'PROGRAMME_INTELLIGENCE','APPLICATION_ROUTE_INTELLIGENCE','PROGRAMMING_PIPELINE','PARTNER_INTELLIGENCE'
          }
          for row in d['evidence']:
              if row['source_health']=='HEALTHY':
                  assert row['http_status']==200 and row['lkg_required'] is False
                  assert re.fullmatch(r'[0-9a-f]{64}', row['raw_sha256'])
                  assert re.fullmatch(r'[0-9a-f]{64}', row['normalized_visible_text_sha256'])
                  assert re.fullmatch(r'[0-9a-f]{64}', row['source_semantic_fingerprint'])
              else:
                  assert row['source_health']=='DEGRADED' and row['lkg_required'] is True
                  assert row['source_semantic_fingerprint'] is None
          assert rec['schema']=='PARTENER_EU_EASI_PROGRAMME_RECONCILIATION_V1'
          assert rec['programme_id']=='ESF_PLUS_EASI'
          assert rec['material_admission_ready_for_downstream_review'] is False
          assert rec['lkg_reference_is_current_truth'] is False
          if d['source_health_state']=='DEGRADED':
              assert rec['reconciliation_state']=='CURRENT_SOURCE_HEALTH_DEGRADED_LKG_REQUIRED'
              assert rec['semantic_reconciliation_passed'] is False
              assert rec['semantic_change_count']==0
              assert rec['pipeline_watch_candidate'] is False
              assert rec['lkg_reference_required'] is True
          else:
              assert rec['reconciliation_state'] in {
                  'BASELINE_CAPTURED_NON_AUTHORIZING','NO_CHANGE',
                  'EASI_PROGRAMME_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING',
                  'SOURCE_HEALTH_RECOVERED_BASELINE_REFRESH_NON_AUTHORIZING',
              }
              assert rec['semantic_reconciliation_passed'] is True
          print(json.dumps({
              'programme':'ESF+ EaSI','source_health':d['source_health_state'],
              'healthy_sources':d['healthy_source_count'],'degraded_sources':d['degraded_source_count'],
              'reconciliation_state':rec['reconciliation_state'],
              'semantic_change_count':rec['semantic_change_count'],
              'pipeline_watch_candidate':rec['pipeline_watch_candidate'],
              'open_call_authorized':False,'eligibility_authorized':False,'publication_effect':'NONE'
          }, sort_keys=True))
          PY

      - name: Stage compact EaSI comparison history with LKG preservation
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('/tmp/partener-eu-easi-programme-proof')
          current=root/'current'/'easi-programme-intelligence.json'
          previous=root/'previous'/'easi-programme-intelligence.json'
          snap=json.loads(current.read_text(encoding='utf-8'))
          history=root/'history'; history.mkdir(exist_ok=True)
          if snap['source_health_state']=='HEALTHY':
              shutil.copy2(current, history/'easi-programme-intelligence.json')
              selected='CURRENT_HEALTHY'
          elif previous.exists():
              prev=json.loads(previous.read_text(encoding='utf-8'))
              if prev.get('source_health_state')=='HEALTHY':
                  shutil.copy2(previous, history/'easi-programme-intelligence.json')
                  selected='PREVIOUS_HEALTHY_LKG'
              else:
                  selected='NO_HEALTHY_LKG_AVAILABLE'
          else:
              selected='NO_HEALTHY_LKG_AVAILABLE'
          (history/'history-selection.json').write_text(json.dumps({
              'selected':selected,'current_source_health_state':snap['source_health_state'],
              'lkg_is_current_truth':False
          },sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'history_selected':selected,'lkg_is_current_truth':False},sort_keys=True))
          PY

      - name: Upload compact EaSI history
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-easi-programme-history-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: /tmp/partener-eu-easi-programme-proof/history/
          if-no-files-found: error
          retention-days: 7

      - name: Upload bounded replay proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-easi-programme-proof-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: /tmp/partener-eu-easi-programme-proof/
          if-no-files-found: error
          retention-days: 7
