name: VÂLCEA CLAR Manual Social Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "valcea-clar/editorial/manual_publish_queue.json"
      - "valcea-clar/social/manual_social_bridge.py"
      - "valcea-clar/social/manual_social_apply.py"
      - ".github/workflows/valcea-clar-manual-social-bridge.yml"

permissions:
  contents: write

concurrency:
  group: valcea-clar-manual-social-bridge
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Stage rights-cleared CET Govora archive photograph when required
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'cet-govora-cine-a-decis-oprirea-20260821' valcea-clar/editorial/manual_publish_queue.json; then
            mkdir -p valcea-clar/social/photos/approved
            curl --fail --location --retry 3 --user-agent 'ValceaClar/1.0 editorial distribution' \
              'https://upload.wikimedia.org/wikipedia/commons/a/a8/CET_Govora_%28dinspre_nord-vest%29.JPG' \
              -o valcea-clar/social/photos/approved/cet-govora-context-2011.jpg
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path('valcea-clar/social/story_visuals.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data.setdefault('stories', {})['cet-govora-cine-a-decis-oprirea-20260821'] = {
              'image_path': 'valcea-clar/social/photos/approved/cet-govora-context-2011.jpg',
              'image': {
                  'kind': 'photograph',
                  'synthetic': False,
                  'subject_match': True,
                  'editor_approved': True,
                  'contextual_archive': True,
                  'captured_at': '2011-06-27',
                  'source_type': 'creative_commons',
                  'source_url': 'https://commons.wikimedia.org/wiki/File:CET_Govora_(dinspre_nord-vest).JPG',
                  'direct_source_url': 'https://upload.wikimedia.org/wikipedia/commons/a/a8/CET_Govora_%28dinspre_nord-vest%29.JPG',
                  'credit': 'Tudorcfr90 / Wikimedia Commons — CC BY-SA 3.0',
                  'rights_basis': 'creative_commons',
                  'license_url': 'https://creativecommons.org/licenses/by-sa/3.0/',
                  'rights_note': 'Fotografie reutilizabilă sub CC BY-SA 3.0, cu atribuire și păstrarea aceleiași licențe pentru reutilizarea imaginii.',
                  'editorial_note': 'Foto de arhivă: CET Govora, 27 iunie 2011; imaginea nu surprinde situația operațională din 2026.',
                  'alt_text': 'Termocentrala CET Govora văzută dinspre nord-vest, într-o fotografie de arhivă din 2011.'
              }
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            python - <<'PY'
          from pathlib import Path
          p=Path('valcea-clar/social/photos/approved/cet-govora-context-2011.jpg')
          if not p.read_bytes()[:3] == b'\xff\xd8\xff':
              raise SystemExit('CET Govora Creative Commons source is not a JPEG')
          print(f'CET Govora rights-cleared photo staged: {p.stat().st_size} bytes')
          PY
          fi

      - name: Validate manual social candidate fail-closed
        run: |
          python valcea-clar/social/manual_social_bridge.py --check | tee /tmp/manual-social-check.json
          python valcea-clar/social/manual_social_apply.py --platform facebook --check
          python valcea-clar/social/manual_social_apply.py --platform instagram --check
          python valcea-clar/social/manual_social_apply.py --platform threads --check

      - name: Materialize manual story into canonical social outboxes
        run: python valcea-clar/social/manual_social_bridge.py | tee /tmp/manual-social-materialize.json

      - name: Probe Meta identity and resolve Instagram account
        id: meta_auth
        continue-on-error: true
        env:
          VALCEA_FB_PAGE_ID: "1234360446430980"
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
        run: python valcea-clar/social/meta_auth_health.py | tee /tmp/meta-auth.json

      - name: Publish only today's verified manual story to Facebook
        id: facebook_apply
        continue-on-error: true
        env:
          VALCEA_FB_PAGE_ID: "1234360446430980"
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
        run: python valcea-clar/social/manual_social_apply.py --platform facebook | tee /tmp/facebook-apply.json

      - name: Publish only today's verified manual story to Instagram
        id: instagram_apply
        continue-on-error: true
        env:
          VALCEA_IG_ACCOUNT_ID: ${{ steps.meta_auth.outputs.ig_account_id || vars.VALCEA_IG_ACCOUNT_ID }}
          VALCEA_IG_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN || secrets.VALCEA_IG_ACCESS_TOKEN || secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_IG_GRAPH_VERSION: v26.0
          VALCEA_IG_GRAPH_HOST: graph.facebook.com
        run: python valcea-clar/social/manual_social_apply.py --platform instagram | tee /tmp/instagram-apply.json

      - name: Publish only today's verified manual story to Threads
        id: threads_apply
        continue-on-error: true
        env:
          VALCEA_THREADS_ACCESS_TOKEN: ${{ secrets.VALCEA_THREADS_ACCESS_TOKEN }}
          VALCEA_THREADS_EXPECTED_USERNAME: valceaclar
          VALCEA_THREADS_LIVE_ENABLED: "true"
        run: python valcea-clar/social/manual_social_apply.py --platform threads | tee /tmp/threads-apply.json

      - name: Persist social outboxes, rights-cleared media and publication state conflict-safe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/manual-social-state
          mkdir -p /tmp/manual-social-state/valcea-clar/social
          for file in \
            facebook_outbox.json \
            facebook_state.json \
            instagram_state.json \
            threads_outbox.json \
            threads_state.json \
            story_visuals.json; do
            if [ -f "valcea-clar/social/$file" ]; then
              cp "valcea-clar/social/$file" "/tmp/manual-social-state/valcea-clar/social/$file"
            fi
          done
          if [ -f valcea-clar/social/photos/approved/cet-govora-context-2011.jpg ]; then
            mkdir -p /tmp/manual-social-state/valcea-clar/social/photos/approved
            cp valcea-clar/social/photos/approved/cet-govora-context-2011.jpg \
              /tmp/manual-social-state/valcea-clar/social/photos/approved/cet-govora-context-2011.jpg
          fi

          git config user.name "valcea-clar-manual-social[bot]"
          git config user.email "valcea-clar-manual-social@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -R /tmp/manual-social-state/valcea-clar/social/. valcea-clar/social/
            git add \
              valcea-clar/social/facebook_outbox.json \
              valcea-clar/social/facebook_state.json \
              valcea-clar/social/instagram_state.json \
              valcea-clar/social/threads_outbox.json \
              valcea-clar/social/threads_state.json \
              valcea-clar/social/story_visuals.json \
              valcea-clar/social/photos/approved/cet-govora-context-2011.jpg || true
            if git diff --cached --quiet; then
              echo "No manual social state changes to persist."
              exit 0
            fi
            git commit -m "Distribute VÂLCEA CLAR verified manual story"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload manual distribution audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-manual-social-${{ github.run_id }}
          path: |
            /tmp/manual-social-check.json
            /tmp/manual-social-materialize.json
            /tmp/meta-auth.json
            /tmp/facebook-apply.json
            /tmp/instagram-apply.json
            /tmp/threads-apply.json
          if-no-files-found: warn
          retention-days: 14
