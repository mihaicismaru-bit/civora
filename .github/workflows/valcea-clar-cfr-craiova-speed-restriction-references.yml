name: VÂLCEA CLAR CFR Craiova Speed Restriction References

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/cfr_craiova_speed_restriction_reference_adapter.py'
      - '.github/workflows/valcea-clar-cfr-craiova-speed-restriction-references.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/cfr_craiova_speed_restriction_reference_adapter.py'
      - '.github/workflows/valcea-clar-cfr-craiova-speed-restriction-references.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-cfr-craiova-speed-restriction-references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile CFR Craiova speed-restriction reference adapter
        run: python -m py_compile valcea-clar/scripts/cfr_craiova_speed_restriction_reference_adapter.py
      - name: Run CFR Craiova fail-closed regressions
        run: python valcea-clar/scripts/cfr_craiova_speed_restriction_reference_adapter.py --self-test
