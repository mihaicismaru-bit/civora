name: MySMIS Duplicate Identity Probe

on:
  workflow_dispatch:
  push:
    branches: [agent/mipe-resilient-ingestion-v2]
    paths: ['.github/workflows/mysmis-duplicate-identity-probe.yml']

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Render complete registry and persist duplicate identity report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, collections, json, sys
          from pathlib import Path
          sys.path.insert(0, 'partener-eu/ingest')
          from mipe_ingest_v2 import MYSMIS_REGISTRY_URL, parse_registry_html
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(locale='ro-RO', timezone_id='Europe/Bucharest', ignore_https_errors=False)
                  page = await context.new_page()
                  response = await page.goto(MYSMIS_REGISTRY_URL, wait_until='domcontentloaded', timeout=45000)
                  await page.wait_for_selector('#APELURI_row_select', timeout=20000)
                  await page.select_option('#APELURI_row_select', '100000')
                  await page.wait_for_function("document.querySelectorAll('#APELURI_data_panel table tbody tr').length >= 800", timeout=30000)
                  parsed = parse_registry_html((await page.content()).encode('utf-8'))
                  groups = collections.defaultdict(list)
                  for index, row in enumerate(parsed['rows']):
                      groups[row['id']].append({'ordinal': index + 1, **row})
                  duplicates = {key: rows for key, rows in groups.items() if len(rows) > 1}
                  exact, conflicting = [], []
                  for key, rows in duplicates.items():
                      normalized = [{k: v for k, v in row.items() if k not in {'ordinal', 'id'}} for row in rows]
                      target = exact if all(value == normalized[0] for value in normalized[1:]) else conflicting
                      target.append({'baseId': key, 'rows': rows})
                  report = {
                      'httpStatus': response.status if response else 0,
                      'rows': len(parsed['rows']),
                      'total': parsed['total'],
                      'complete': parsed['complete'],
                      'uniqueIds': len(groups),
                      'duplicateGroups': len(duplicates),
                      'duplicateRows': sum(len(rows) for rows in duplicates.values()),
                      'exactDuplicateGroups': len(exact),
                      'conflictingGroups': len(conflicting),
                      'exactGroups': exact[:20],
                      'conflictingGroupsDetail': conflicting[:50],
                  }
                  Path('partener-eu/ingest/state/mysmis_duplicate_probe.json').write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
                  print(json.dumps({k: v for k, v in report.items() if k not in {'exactGroups', 'conflictingGroupsDetail'}}, ensure_ascii=False, indent=2))
                  await browser.close()
          asyncio.run(main())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partener-eu/ingest/state/mysmis_duplicate_probe.json
          git commit -m 'Record MySMIS duplicate identity diagnostic'
          git push origin HEAD:agent/mipe-resilient-ingestion-v2
