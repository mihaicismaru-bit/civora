name: TEMP Social metrics authorization seal patch

on:
  push:
    branches:
      - automation/social-metrics-auth-seal-20260817-1441
    paths:
      - ".github/workflows/_tmp-social-metrics-auth-seal-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/social-metrics-auth-seal-20260817-1441
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply scoped integration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          module_path = Path('local-news-os/social/fleet_metrics_authorization_seal.py')
          text = module_path.read_text(encoding='utf-8')

          old = '''        capability_secretish = _secretish_keys(capability)\n        if capability_secretish:\n            blocks.append("AUTHORIZATION_CAPABILITY_SECRETISH_FIELDS_FORBIDDEN")\n            continue\n\n        channel, channel_blocks = _channel_for_approval(repo_root, instance, approval)\n'''
          new = '''        capability_secretish = _secretish_keys(capability)\n        if capability_secretish:\n            blocks.append("AUTHORIZATION_CAPABILITY_SECRETISH_FIELDS_FORBIDDEN")\n            continue\n        approval_platform = _clean(approval.get("platform")).lower()\n        source = _clean(approval.get("metric_source")).lower()\n        approval_credential = _clean(approval.get("credential_env_name"))\n        if _clean(capability.get("capability_id")).lower() != capability_id:\n            blocks.append("AUTHORIZATION_CAPABILITY_ID_MISMATCH")\n            continue\n        if _clean(capability.get("platform")).lower() != approval_platform:\n            blocks.append("AUTHORIZATION_CAPABILITY_PLATFORM_MISMATCH")\n            continue\n        if _clean(capability.get("metric_source")).lower() != source:\n            blocks.append("AUTHORIZATION_CAPABILITY_SOURCE_MISMATCH")\n            continue\n\n        channel, channel_blocks = _channel_for_approval(repo_root, instance, approval)\n'''
          text = replace_once(text, old, new, 'capability approval binding')

          old = '''        if channel_view["credentials_ref"] == "":\n            blocks.append("AUTHORIZATION_CHANNEL_CREDENTIAL_REFERENCE_REQUIRED")\n            continue\n\n        source = _clean(approval.get("metric_source")).lower()\n        attestation_rel = _safe_rel(approval.get("access_attestation_path"))\n'''
          new = '''        if channel_view["credentials_ref"] == "":\n            blocks.append("AUTHORIZATION_CHANNEL_CREDENTIAL_REFERENCE_REQUIRED")\n            continue\n        try:\n            channel_credential = binding.fleet.native_metrics_transport.credential_env_name(channel_view["credentials_ref"])\n        except ValueError:\n            blocks.append("AUTHORIZATION_CHANNEL_CREDENTIAL_REFERENCE_INVALID")\n            continue\n        if channel_credential != approval_credential:\n            blocks.append("AUTHORIZATION_CHANNEL_CREDENTIAL_REFERENCE_MISMATCH")\n            continue\n        if channel_view["metrics"]["observed_only"] is not True or source not in channel_view["metrics"]["sources"]:\n            blocks.append("AUTHORIZATION_CHANNEL_METRICS_POLICY_DRIFT")\n            continue\n        if channel_view["zero_paid_dependency"] is not True:\n            blocks.append("AUTHORIZATION_CHANNEL_ZERO_PAID_POLICY_DRIFT")\n            continue\n\n        attestation_rel = _safe_rel(approval.get("access_attestation_path"))\n'''
          text = replace_once(text, old, new, 'channel credential binding')

          old = '''        secretish = _secretish_keys(attestation)\n        if secretish:\n            blocks.append("AUTHORIZATION_ACCESS_ATTESTATION_SECRETISH_FIELDS_FORBIDDEN")\n            continue\n\n        channel_material.append({\n'''
          new = '''        secretish = _secretish_keys(attestation)\n        if secretish:\n            blocks.append("AUTHORIZATION_ACCESS_ATTESTATION_SECRETISH_FIELDS_FORBIDDEN")\n            continue\n        attestation_blocks = capability_gate.capabilities.validate_access_attestation(capability, attestation)\n        if attestation_blocks:\n            blocks.append("AUTHORIZATION_ACCESS_ATTESTATION_INVALID:" + ",".join(attestation_blocks))\n            continue\n\n        channel_material.append({\n'''
          text = replace_once(text, old, new, 'attestation revalidation')

          old = '''    instances = _instance_map(runtime)\n    bindings = _binding_map(binding_registry)\n    capabilities = _capability_map(capability_registry)\n    approved = capability_result.get("approved_channels") if isinstance(capability_result.get("approved_channels"), list) else []\n'''
          new = '''    instances = _instance_map(runtime)\n    bindings = _binding_map(binding_registry)\n    capabilities: dict[str, dict[str, Any]] = {}\n    approved = capability_result.get("approved_channels") if isinstance(capability_result.get("approved_channels"), list) else []\n'''
          text = replace_once(text, old, new, 'capability registry preflight declaration')

          old = '''    fingerprints: dict[str, str] = {}\n    blocks: list[str] = []\n\n    for authorization in authorizations:\n'''
          new = '''    fingerprints: dict[str, str] = {}\n    blocks: list[str] = []\n    capability_validation = capability_gate.capabilities.validate_registry(capability_registry)\n    if capability_validation.get("status") != "PASS":\n        blocks.append("AUTHORIZATION_CAPABILITY_REGISTRY_INVALID")\n    else:\n        capabilities = _capability_map({"capabilities": capability_validation.get("capabilities", [])})\n    if capability_result.get("status") not in {"CAPABILITY_GATE_READY", "CAPABILITY_GATE_PARTIAL_HOLD", "CAPABILITY_GATE_IDLE"}:\n        blocks.append("AUTHORIZATION_CAPABILITY_GATE_NOT_READY")\n\n    for authorization in authorizations:\n'''
          text = replace_once(text, old, new, 'capability registry revalidation')
          module_path.write_text(text, encoding='utf-8')

          workflow_path = Path('.github/workflows/valcea-clar-observed-metrics-harvest.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          pair = '''      - "local-news-os/social/fleet_metrics_credential_binding.py"\n      - "local-news-os/social/test_fleet_metrics_credential_binding.py"\n'''
          expanded = pair + '''      - "local-news-os/social/fleet_metrics_authorization_seal.py"\n      - "local-news-os/social/test_fleet_metrics_authorization_seal.py"\n'''
          count = workflow.count(pair)
          if count != 2:
              raise SystemExit(f'workflow trigger paths: expected 2 matches, got {count}')
          workflow = workflow.replace(pair, expanded)

          compile_pair = '''            local-news-os/social/fleet_metrics_credential_binding.py \\\n            local-news-os/social/test_operational_metrics_harvest_trigger.py \\\n'''
          compile_expanded = '''            local-news-os/social/fleet_metrics_credential_binding.py \\\n            local-news-os/social/fleet_metrics_authorization_seal.py \\\n            local-news-os/social/test_fleet_metrics_authorization_seal.py \\\n            local-news-os/social/test_operational_metrics_harvest_trigger.py \\\n'''
          workflow = replace_once(workflow, compile_pair, compile_expanded, 'workflow compile wiring')

          test_step = '''      - name: Run per-instance credential binding acceptance tests\n        run: python local-news-os/social/test_fleet_metrics_credential_binding.py\n'''
          test_expanded = test_step + '''\n      - name: Run authorization fingerprint / TOCTOU acceptance tests\n        run: python local-news-os/social/test_fleet_metrics_authorization_seal.py\n'''
          workflow = replace_once(workflow, test_step, test_expanded, 'workflow acceptance test wiring')

          plan_command = '''          python local-news-os/social/fleet_metrics_credential_binding.py \\\n            --repo-root . \\\n            --runtime-registry local-news-os/social/social_runtime_registry.json \\\n            --binding-registry local-news-os/social/metrics_credential_bindings.json \\\n            --now "$NOW" \\\n            >/tmp/fleet-metrics-credential-plan.json\n'''
          if workflow.count(plan_command) != 2:
              raise SystemExit(f'workflow plan commands: expected 2 matches, got {workflow.count(plan_command)}')
          before, last = workflow.rsplit(plan_command, 1)
          sealed_plan_command = plan_command.replace('fleet_metrics_credential_binding.py', 'fleet_metrics_authorization_seal.py')
          workflow = before + sealed_plan_command + last

          binding_env = '''          BINDING_ID: ${{ matrix.binding_id }}\n'''
          expression = '$' + '{{ matrix.authorization_fingerprint }}'
          binding_env_new = binding_env + f'          AUTHORIZATION_FINGERPRINT: {expression}\n'
          workflow = replace_once(workflow, binding_env, binding_env_new, 'workflow authorization fingerprint env')

          execute_command = '''          python local-news-os/social/fleet_metrics_credential_binding.py \\\n            --repo-root . \\\n            --runtime-registry local-news-os/social/social_runtime_registry.json \\\n            --binding-registry local-news-os/social/metrics_credential_bindings.json \\\n            --binding-id "$BINDING_ID" \\\n            --now "$NOW" \\\n            --execute \\\n            | tee /tmp/fleet-observed-metrics-harvest.json\n'''
          execute_sealed = '''          python local-news-os/social/fleet_metrics_authorization_seal.py \\\n            --repo-root . \\\n            --runtime-registry local-news-os/social/social_runtime_registry.json \\\n            --binding-registry local-news-os/social/metrics_credential_bindings.json \\\n            --binding-id "$BINDING_ID" \\\n            --expected-authorization-fingerprint "$AUTHORIZATION_FINGERPRINT" \\\n            --now "$NOW" \\\n            --execute \\\n            | tee /tmp/fleet-observed-metrics-harvest.json\n'''
          workflow = replace_once(workflow, execute_command, execute_sealed, 'workflow sealed execution command')

          verify_anchor = '''          if result.get('instance_id') is None:\n              raise SystemExit('bound harvest instance identity missing')\n          print(result.get('status'))\n'''
          verify_new = '''          if result.get('instance_id') is None:\n              raise SystemExit('bound harvest instance identity missing')\n          if result.get('authorization_fingerprint_verified') is not True:\n              raise SystemExit('planned authorization fingerprint was not verified')\n          if result.get('pre_network_authorization_recheck') is not True:\n              raise SystemExit('pre-network authorization recheck missing')\n          print(result.get('status'))\n'''
          workflow = replace_once(workflow, verify_anchor, verify_new, 'workflow execution seal verification')
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Validate patched authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            local-news-os/social/fleet_metrics_authorization_seal.py \
            local-news-os/social/test_fleet_metrics_authorization_seal.py
          python local-news-os/social/test_fleet_metrics_credential_binding.py
          python local-news-os/social/test_fleet_metrics_authorization_seal.py
          git diff --check

      - name: Commit scoped patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "civora-social-automation[bot]"
          git config user.email "civora-social-automation@users.noreply.github.com"
          git rm .github/workflows/_tmp-social-metrics-auth-seal-apply.yml
          git add local-news-os/social/fleet_metrics_authorization_seal.py \
                  local-news-os/social/test_fleet_metrics_authorization_seal.py \
                  .github/workflows/valcea-clar-observed-metrics-harvest.yml
          git commit -m "Bind metrics harvest execution to authorization fingerprint"
          git push origin HEAD:automation/social-metrics-auth-seal-20260817-1441
