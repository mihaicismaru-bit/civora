name: VÂLCEA CLAR ISU Emergency Detail Evidence

on:
  pull_request:
    paths:
      - "valcea-clar/scripts/isu_valcea_emergency_reference_adapter.py"
      - "valcea-clar/scripts/isu_valcea_emergency_detail_evidence.py"
      - ".github/workflows/valcea-clar-isu-emergency-detail-evidence.yml"
  push:
    branches: [main]
    paths:
      - "valcea-clar/scripts/isu_valcea_emergency_reference_adapter.py"
      - "valcea-clar/scripts/isu_valcea_emergency_detail_evidence.py"
      - ".github/workflows/valcea-clar-isu-emergency-detail-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valcea-clar-isu-emergency-detail-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and deterministic regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            valcea-clar/scripts/isu_valcea_emergency_reference_adapter.py \
            valcea-clar/scripts/isu_valcea_emergency_detail_evidence.py
          python valcea-clar/scripts/isu_valcea_emergency_reference_adapter.py --self-test
          python valcea-clar/scripts/isu_valcea_emergency_detail_evidence.py --self-test

      - name: Enforce read-only ISU detail-evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          target="valcea-clar/scripts/isu_valcea_emergency_detail_evidence.py"
          if grep -En '(^|[[:space:]])(import|from)[[:space:]]+(requests|httpx|aiohttp|selenium|playwright|subprocess|socket)([[:space:].]|$)' "$target"; then
            echo "Forbidden network/process dependency in ISU detail verifier" >&2
            exit 1
          fi
          if grep -En 'verify_mode|CERT_NONE|check_hostname[[:space:]]*=[[:space:]]*False|unverified_context|shell[[:space:]]*=[[:space:]]*True' "$target"; then
            echo "TLS/process safety boundary weakened" >&2
            exit 1
          fi
          if grep -En 'FactKernel|editorial_writer\(|publish\(|runtime_state' "$target"; then
            echo "Writer/runtime capability detected in ISU detail verifier" >&2
            exit 1
          fi
          grep -F '"material_fact_use": False' "$target"
          grep -F '"independent_fact_verification_authorized": False' "$target"
          grep -F '"incident_cause_authorized": False' "$target"
          grep -F '"casualty_count_authorized": False' "$target"
          grep -F '"intervention_count_authorized": False' "$target"
          grep -F '"fact_kernel_write_authorized": False' "$target"
          grep -F '"editorial_writer_authorized": False' "$target"
          grep -F '"publication_authorized": False' "$target"
          grep -F '"runtime_persistence_authorized": False' "$target"

      - name: Acquire bounded first-party ISU incident and communique detail evidence
        run: |
          set -euo pipefail
          python valcea-clar/scripts/isu_valcea_emergency_detail_evidence.py \
            --live-check \
            --output /tmp/isu_valcea_emergency_detail_evidence.json

      - name: Validate live detail receipt boundary
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          payload = json.loads(Path('/tmp/isu_valcea_emergency_detail_evidence.json').read_text(encoding='utf-8'))
          assert payload['schema'] == 'ISU_VALCEA_EMERGENCY_DETAIL_EVIDENCE_V1'
          assert payload['status'] == 'PASS'
          assert payload['authority_class'] == 'FIRST_PARTY_COUNTY_EMERGENCY_ARTICLE_DETAIL_EVIDENCE'
          assert payload['observation_state'] == 'ISU_SOURCE_DETAIL_EVIDENCE_NON_AUTHORIZING'
          assert payload['source_assertion_scope'] == 'ISU_FIRST_PARTY_STATEMENT_ONLY_NOT_INDEPENDENT_VERIFICATION'
          assert payload['coverage_note'] == 'BOUNDED_FIRST_PARTY_ISU_INCIDENT_AND_COMMUNIQUE_DETAIL_VERIFICATION_NOT_EXHAUSTIVE'
          assert payload['index_reference_count'] >= 1
          assert 1 <= payload['eligible_detail_count'] <= 12
          assert 1 <= payload['detail_evidence_count'] <= 12
          assert payload['detail_evidence_count'] + payload['detail_hold_count'] == payload['eligible_detail_count']
          assert re.fullmatch(r'[0-9a-f]{24}', payload['run_id'])

          allowed_topics = {
              'ROAD_RESCUE', 'FIRE', 'WEATHER_HAZARD', 'MEDICAL_EMERGENCY',
              'CIVIL_PROTECTION', 'PREVENTION', 'EMERGENCY_OTHER',
          }
          allowed_tags = {
              'ISU_REPORTED_OBSERVATION', 'RESPONSE_ACTION',
              'REPORTED_AFFECTED_OR_CASUALTY', 'REPORTED_CAUSE_OR_ORIGIN',
              'PUBLIC_PROTECTION_WARNING_OR_RESTRICTION', 'REPORTED_NUMERIC_COUNT',
          }
          allowed_types = {'text/html', 'application/xhtml+xml', 'text/plain'}
          source_paths = {
              'LOCAL_NEWS': '/stiri-locale/',
              'COMMUNIQUES': '/comunicate-de-presa/',
          }

          total_field_evidence = 0
          aggregate_tags = set()
          for item in payload['details']:
              parsed = urlsplit(item['detail_url'])
              assert parsed.scheme == 'https'
              assert parsed.hostname == 'isuvl.igsu.ro'
              assert item['detail_host'] == parsed.hostname
              assert item['source_kind'] in source_paths
              assert parsed.path.startswith(source_paths[item['source_kind']])
              assert item['topic_class'] in allowed_topics
              if item['topic_class'] == 'EMERGENCY_OTHER':
                  assert item['source_kind'] == 'COMMUNIQUES'
              assert item['content_type'] in allowed_types
              assert 1 <= item['content_length'] <= 2_500_000
              assert re.fullmatch(r'[0-9a-f]{64}', item['detail_sha256'])
              assert re.fullmatch(r'[0-9a-f]{64}', item['index_evidence_sha256'])
              assert item['authority_class'] == payload['authority_class']
              assert item['observation_state'] == payload['observation_state']
              assert item['source_assertion_scope'] == payload['source_assertion_scope']
              assert item['verification_state'] == 'ISU_SOURCE_TEXT_EVIDENCE_CAPTURED_NON_AUTHORIZING'
              assert len(item['field_evidence']) <= 10
              assert set(item['tag_counts']) <= allowed_tags
              total_field_evidence += len(item['field_evidence'])
              aggregate_tags.update(item['tag_counts'])
              for field in item['field_evidence']:
                  assert 1 <= len(field['excerpt']) <= 480
                  assert field['epistemic_tags']
                  assert set(field['epistemic_tags']) <= allowed_tags
                  assert field['source_assertion_scope'] == payload['source_assertion_scope']
                  assert re.fullmatch(r'[0-9a-f]{64}', field['evidence_sha256'])

          assert total_field_evidence >= 1
          assert aggregate_tags <= allowed_tags

          for hold in payload['holds']:
              assert hold['state'] == 'HOLD_DETAIL_FETCH_FAILED_NON_AUTHORIZING'
              assert re.fullmatch(r'[0-9a-f]{64}', hold['index_evidence_sha256'])

          forbidden = [
              'material_fact_use', 'independent_fact_verification_authorized',
              'incident_status_authorized', 'incident_cause_authorized',
              'casualty_count_authorized', 'affected_person_count_authorized',
              'intervention_count_authorized', 'resource_count_authorized',
              'road_restriction_current_status_authorized',
              'weather_warning_current_status_authorized',
              'shelter_capacity_authorized', 'medical_service_availability_authorized',
              'same_event_dedupe_authorized', 'breaking_authorized',
              'fact_kernel_write_authorized', 'editorial_writer_authorized',
              'publication_authorized', 'distribution_authorized',
              'runtime_persistence_authorized',
          ]
          assert all(payload[key] is False for key in forbidden)
          assert payload['limitations']['isu_statement_is_not_independent_verification'] is True
          assert payload['limitations']['reported_casualty_or_affected_counts_require_field_level_reconciliation'] is True
          assert payload['limitations']['reported_cause_requires_explicit_source_wording_and_independent_context_for_publication'] is True
          assert payload['limitations']['reported_intervention_or_resource_counts_are_not_live_service_capacity'] is True
          assert payload['limitations']['warning_or_restriction_requires_separate_current_status_verification'] is True
          assert payload['limitations']['shelter_capacity_requires_separate_current_material_verification'] is True
          print(
              f"ISU detail evidence PASS; evidence={payload['detail_evidence_count']}; "
              f"holds={payload['detail_hold_count']}; eligible={payload['eligible_detail_count']}; "
              f"field_evidence={total_field_evidence}; tags={sorted(aggregate_tags)}"
          )
          PY

      - name: Upload bounded ISU detail evidence
        uses: actions/upload-artifact@v4
        with:
          name: valcea-clar-isu-emergency-detail-evidence
          path: /tmp/isu_valcea_emergency_detail_evidence.json
          retention-days: 7
          if-no-files-found: error
