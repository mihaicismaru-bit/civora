name: PUBLIC PRESENCE SHADOW PREFLIGHT

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/public-presence-shadow.yml'
      - 'public-presence-os/src/public_presence_os/meta_live_runtime.py'
      - 'public-presence-os/tests/test_meta_live_runtime.py'
      - 'public-presence-os/src/public_presence_os/meta_live_runtime.py'

permissions:
  contents: read

concurrency:
  group: public-presence-shadow-preflight
  cancel-in-progress: true

jobs:
  contract:
    name: shadow-read-only-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-presence-shadow
    defaults:
      run:
        working-directory: public-presence-os
    env:
      META_APP_ID: "1488219383133581"
      META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_PAGE_ID: "2816314015107071"
      META_IG_USER_ID: "17841429701593250"
      META_THREADS_USER_ID: "28391623420464631"
      META_THREADS_ENABLED: "false"
      META_THREADS_ACCESS_TOKEN: ""
      META_GRAPH_API_VERSION: "v26.0"
      META_THREADS_API_VERSION: "v1.0"
      KILL_SWITCH: "true"
      LIVE_WRITE: "false"
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local package
        run: python -m pip install -e .
      - name: Verify locked shadow contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          expected = {
              "META_APP_ID": "1488219383133581",
              "META_PAGE_ID": "2816314015107071",
              "META_IG_USER_ID": "17841429701593250",
              "META_THREADS_ENABLED": "false",
              "KILL_SWITCH": "true",
              "LIVE_WRITE": "false",
          }
          mismatches = [key for key, value in expected.items() if os.getenv(key) != value]
          if mismatches:
              raise SystemExit("PPOS_SHADOW_CONTRACT_MISMATCH:" + ",".join(sorted(mismatches)))
          if not os.getenv("META_PAGE_ACCESS_TOKEN"):
              raise SystemExit("PPOS_SHADOW_PAGE_TOKEN_MISSING")
          print("PPOS_SHADOW_CONTRACT_PASS")
          PY
      - name: Validate product without live credentials
        env:
          PYTHONPATH: src
        run: python -m public_presence_os.cli validate --root .
      - name: Run bounded Meta read-only preflight
        env:
          PYTHONPATH: src
        run: python -m public_presence_os.cli meta-preflight --db "$RUNNER_TEMP/meta-events.sqlite3" --live
