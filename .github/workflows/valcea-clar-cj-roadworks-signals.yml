name: VÂLCEA CLAR CJ Roadworks Signals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/cj_valcea_roadworks_signal_adapter.py'
      - '.github/workflows/valcea-clar-cj-roadworks-signals.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/cj_valcea_roadworks_signal_adapter.py'
      - '.github/workflows/valcea-clar-cj-roadworks-signals.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-cj-roadworks-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile CJ Vâlcea roadworks signal adapter
        run: python -m py_compile valcea-clar/scripts/cj_valcea_roadworks_signal_adapter.py
      - name: Run CJ Vâlcea roadworks fail-closed regressions
        run: python valcea-clar/scripts/cj_valcea_roadworks_signal_adapter.py --self-test
