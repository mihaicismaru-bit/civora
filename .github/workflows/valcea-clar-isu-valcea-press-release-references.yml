name: VÂLCEA CLAR ISU Vâlcea Press Release References

on:
  pull_request:
    paths:
      - "valcea-clar/scripts/isu_valcea_press_release_reference_adapter.py"
      - ".github/workflows/valcea-clar-isu-valcea-press-release-references.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valcea-clar-isu-valcea-press-release-references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bounded adapter
        run: python -m py_compile valcea-clar/scripts/isu_valcea_press_release_reference_adapter.py
      - name: Run fail-closed self-test
        run: python valcea-clar/scripts/isu_valcea_press_release_reference_adapter.py --self-test
      - name: Verify live first-party source health
        shell: bash
        run: |
          python valcea-clar/scripts/isu_valcea_press_release_reference_adapter.py > /tmp/isu-valcea-press-releases.json
          python - <<'PY'
          import json
          with open("/tmp/isu-valcea-press-releases.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["state"] == "CLEAR", data
          assert data["reference_count"] >= 3, data
          assert data["content_contract"] == "FIRST_PARTY_EMERGENCY_PRESS_RELEASE_INDEX_REFERENCE_ONLY"
          assert all(item["current_state_authorized"] is False for item in data["references"])
          assert all(item["active_incident_authorized"] is False for item in data["references"])
          assert all(item["active_warning_authorized"] is False for item in data["references"])
          assert all(item["article_body_authorized"] is False for item in data["references"])
          print(f"live-source: clear ({data['reference_count']} press-release references)")
          PY
