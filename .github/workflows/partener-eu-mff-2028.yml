name: PARTENER.EU MFF 2028-2034 Monitor

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/mff_2028_source_registry.json'
      - 'partener-eu/ingest/mff_2028_probe.py'

permissions:
  contents: write

jobs:
  monitor:
    if: ${{ github.repository == 'mihaicismaru-bit/civora' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Hermetic MFF provenance and partial-stage regression
        run: python partener-eu/ops/test_mff_2028_probe.py
      - name: Probe verified 2028-2034 sources
        env:
          PARTENER_MFF_EVIDENCE_DIR: ${{ runner.temp }}/partener-mff-evidence
        run: python partener-eu/ingest/mff_2028_probe.py
      - name: Upload per-run official raw receipts (non-authorizing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mff-2028-raw-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/partener-mff-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Persist MFF 2028-2034 health ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "civora-bot"
          git config user.email "actions@users.noreply.github.com"
          FILE=partener-eu/ingest/state/mff_2028_health.json
          cp "$FILE" /tmp/mff_2028_health.json
          git fetch origin main
          git reset --hard origin/main
          # Health + semantic changes persist; every probe retains its own raw
          # receipt artifact. A new check timestamp/raw HTML noise alone must
          # not generate another commit or downstream notification.
          python - "$FILE" /tmp/mff_2028_health.json <<'PY'
          import json, pathlib, sys
          current, candidate = (pathlib.Path(x) for x in sys.argv[1:])
          volatile = {
              "observed_at", "attempted_at_utc", "fetched_at_utc", "run_id",
              "raw_evidence_file", "raw_sha256", "bytes", "semantic_bytes",
              "content_type", "error",
          }
          def stable(value):
              if isinstance(value, dict):
                  return {k: stable(v) for k, v in value.items() if k not in volatile}
              if isinstance(value, list):
                  return [stable(x) for x in value]
              return value
          if current.exists() and stable(json.loads(current.read_text(encoding="utf-8"))) == stable(json.loads(candidate.read_text(encoding="utf-8"))):
              pathlib.Path("/tmp/partener_mff_no_material_delta").write_text("NO_MATERIAL_DELTA")
          PY
          if [ -f /tmp/partener_mff_no_material_delta ]; then
            echo "NO_MATERIAL_DELTA; raw evidence retained in run artifact"
            exit 0
          fi
          mkdir -p partener-eu/ingest/state
          cp /tmp/mff_2028_health.json "$FILE"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist MFF 2028-2034 source health"
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n*3))
          done
          exit 1
