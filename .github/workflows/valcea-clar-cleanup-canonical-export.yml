name: VÂLCEA CLAR Cleanup Canonical Export Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/**'
      - '.github/workflows/valcea-clar-cleanup-canonical-export.yml'
      - '.github/workflows/valcea-clar-premium-presentation.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-cleanup-canonical-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Rebuild canonical publication inputs
        run: |
          set -euo pipefail
          python valcea-clar/scripts/newsroom_decide.py --self-test
          python valcea-clar/scripts/repair_continuous_frontpage.py --self-test
          python valcea-clar/scripts/build_public_data.py
          python valcea-clar/scripts/repair_continuous_frontpage.py

      - name: Build base deterministic export
        run: python valcea-clar/scripts/build_sites_export.py

      - name: Run the proposed single canonical presentation boundary
        run: python valcea-clar/scripts/overlay_runtime_export.py

      - name: Validate canonical export contract
        run: |
          set -euo pipefail
          python valcea-clar/scripts/public_ux_export_contract.py
          python valcea-clar/scripts/smoke_web.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('valcea-clar')
          runtime = root / 'site' / 'runtime'
          dist = root / 'dist' / 'chatgpt-sites'
          state = json.loads((root / 'site/public_ux_state.json').read_text(encoding='utf-8'))
          manifest = json.loads((dist / 'manifest.json').read_text(encoding='utf-8'))
          feed = json.loads((runtime / 'live-feed.json').read_text(encoding='utf-8'))
          stories = json.loads((runtime / 'stiri/manifest.json').read_text(encoding='utf-8'))

          assert manifest['target']['publication_model'] == 'continuous_story_first'
          assert manifest['target']['reader_presentation_owner'] == 'overlay_runtime_export'
          assert state['policy']['monitoring_is_news'] is False
          assert state['policy']['cross_category_fill'] is False
          assert len(stories.get('stories', [])) == feed.get('story_count')

          required = (
              'index.html',
              'stiri/index.html',
              'despre/index.html',
              'unde-iesim/index.html',
              'termeni/index.html',
              'confidentialitate/index.html',
              'robots.txt',
              'sitemap.xml',
          )
          for rel in required:
              assert (runtime / rel).is_file(), rel
              assert (dist / rel).is_file(), f'dist:{rel}'

          for rel in ('index.html','stiri/index.html','despre/index.html','termeni/index.html','confidentialitate/index.html'):
              text=(runtime/rel).read_text(encoding='utf-8')
              assert 'data-nav-contract="valcea-clar-primary-v2"' in text, rel

          for row in stories.get('stories', []):
              sid=str(row['id'])
              page=runtime/'stiri'/sid/'index.html'
              assert page.is_file(), sid
              text=page.read_text(encoding='utf-8')
              assert '<meta property="og:type" content="article">' in text, sid
              assert '<script type="application/ld+json">' in text, sid

          print(json.dumps({
              'status':'PASS',
              'stories':feed.get('story_count'),
              'routes':manifest.get('counts',{}).get('routes'),
              'reader_presentation_owner':manifest['target']['reader_presentation_owner'],
          }, ensure_ascii=False))
          PY
