name: VÂLCEA CLAR Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/**'
      - '.github/workflows/valcea-clar-quality.yml'
      - '.github/workflows/valcea-clar-source-radar.yml'
      - '.github/workflows/valcea-clar-venues-ingest.yml'
      - '.github/workflows/valcea-clar-social-publishing.yml'
      - '.github/workflows/valcea-clar-engine-guard.yml'
      - '.github/workflows/valcea-clar-newsroom-live.yml'
      - '.github/workflows/valcea-clar-continuous-frontpage.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/**'
      - '.github/workflows/valcea-clar-quality.yml'
      - '.github/workflows/valcea-clar-source-radar.yml'
      - '.github/workflows/valcea-clar-venues-ingest.yml'
      - '.github/workflows/valcea-clar-social-publishing.yml'
      - '.github/workflows/valcea-clar-engine-guard.yml'
      - '.github/workflows/valcea-clar-newsroom-live.yml'
      - '.github/workflows/valcea-clar-continuous-frontpage.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate site-engine ownership
        run: python valcea-clar/scripts/validate_site_engine_ownership.py
      - name: Validate social-publication ownership
        run: python valcea-clar/social/validate_social_engine.py
      - name: Validate active social adapters
        run: python valcea-clar/social/facebook_publish.py --self-test
      - name: Validate editorial data
        run: python valcea-clar/scripts/validate_data.py
      - name: Validate ingest-to-catalogue reconciliation
        run: python valcea-clar/scripts/reconcile_ingest.py --check
      - name: Rebuild fail-closed public projection
        run: python valcea-clar/scripts/build_public_data.py
      - name: Verify generated files are committed
        run: git diff --exit-code -- valcea-clar/web/data
      - name: Rebuild canonical continuous story runtime
        run: |
          set -euo pipefail
          python valcea-clar/scripts/newsroom_decide.py --self-test
          python valcea-clar/scripts/repair_continuous_frontpage.py --self-test
          python valcea-clar/scripts/repair_continuous_frontpage.py
      - name: Verify continuous story-first runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('valcea-clar')
          archive = json.loads((root / 'site/story_archive.json').read_text(encoding='utf-8'))
          feed = json.loads((root / 'site/runtime/live-feed.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'site/runtime/stiri/manifest.json').read_text(encoding='utf-8'))
          homepage = (root / 'site/runtime/index.html').read_text(encoding='utf-8')
          holds = json.loads((root / 'editorial/publication_holds.json').read_text(encoding='utf-8'))

          durable_baseline = {
              'musiclover-green-day-20260815',
              'luminos-fest-zavoi-20260815',
              'florile-govorei-20260816',
              'scm-valcea-slatina-20260815',
              'alert-1cd2159b942ec2b672f7',
              'alert-fdfdb85a579432f385f7',
          }
          held = {str(row['story_id']) for row in holds.get('holds', []) if row.get('public_projection') is False}
          archive_ids = [str(item['id']) for item in archive.get('stories', [])]
          feed_ids = [str(item['id']) for item in feed.get('stories', [])]
          route_ids = [str(item['id']) for item in manifest.get('stories', [])]
          archive_set = set(archive_ids)

          assert archive.get('publication_model') == 'continuous_story_first'
          assert archive.get('recap_editions_may_delete_published_stories') is False
          assert archive.get('operational_records_public') is False
          assert feed.get('publication_model') == 'continuous_story_first'
          assert feed.get('policy', {}).get('published_story_persistence') is True
          assert feed.get('policy', {}).get('edition_fields_are_compatibility_only') is True
          assert feed.get('policy', {}).get('operational_records_hidden') is True
          assert len(archive_ids) == len(archive_set)
          assert archive.get('story_count') == len(archive_ids)
          assert feed.get('story_count') == len(feed_ids) == len(archive_ids)
          assert durable_baseline <= archive_set
          assert archive_ids == feed_ids
          assert set(route_ids) == archive_set
          assert not held & archive_set
          assert not held & set(feed_ids)
          assert not held & set(route_ids)
          assert 'olanesti-bridge-monitor' in held
          assert not (root / 'site/runtime/stiri/olanesti-bridge-monitor/index.html').is_file()
          assert 'unde-iesim-operational' not in archive_ids
          assert 'source-radar-operational' not in archive_ids
          assert 'ACTUALIZAT LIVE' in homepage
          assert 'Alte știri importante' in homepage
          assert '<div class="cards"></div>' not in homepage
          for story_id in archive_ids:
              assert (root / 'site/runtime/stiri' / story_id / 'index.html').is_file(), story_id

          print('Continuous story-first runtime quality gate: PASS')
          PY
      - name: Static web smoke test
        run: python valcea-clar/scripts/smoke_web.py
      - name: JavaScript syntax check
        run: |
          node --check valcea-clar/web/app.js
          node --check valcea-clar/site/chatgpt-sites-live-bridge.js
      - name: Validate public legal bridge
        run: python valcea-clar/scripts/validate_public_legal_bridge.py
      - name: Source radar deterministic self-test
        run: python valcea-clar/scripts/probe_sources.py --self-test
      - name: Build canonical reader UX
        run: |
          set -euo pipefail
          python valcea-clar/scripts/public_ux_reset.py --self-test
          python valcea-clar/scripts/public_ux_story_integrity.py --self-test
          python valcea-clar/scripts/public_ux_reset.py
          python valcea-clar/scripts/public_ux_story_integrity.py
          python valcea-clar/scripts/public_ux_manifest.py
          python valcea-clar/scripts/public_ux_reset.py --check
          python valcea-clar/scripts/public_ux_story_integrity.py --check
          python valcea-clar/scripts/public_ux_manifest.py --check
          python valcea-clar/scripts/smoke_web.py
      - name: Build ChatGPT Sites synchronization payload
        run: python valcea-clar/scripts/build_sites_export.py
      - name: Overlay canonical runtime into synchronization payload
        run: |
          set -euo pipefail
          python valcea-clar/scripts/public_ux_overlay.py
          python valcea-clar/scripts/public_ux_legal.py
          python valcea-clar/scripts/public_ux_export_contract.py
      - name: Validate synchronization manifest and site integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('valcea-clar/dist/chatgpt-sites')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['target']['canonical_domain'] == 'valceaclar.ro'
          assert manifest['target']['platform'] == 'ChatGPT Sites'
          assert manifest['target']['create_parallel_site'] is False
          assert manifest['target']['public_ux_contract'] == 'valcea-clar-public-ux-v1'
          assert manifest['target']['navigation_contract'] == 'valcea-clar-primary-v2'
          meta = json.loads(Path('valcea-clar/web/data/meta.json').read_text(encoding='utf-8'))
          assert manifest['counts']['public_places'] == meta['place_count']
          assert manifest['counts']['public_creators'] == meta['creator_count']
          assert manifest['counts']['hidden_candidates'] == meta['candidate_count']
          assert manifest['policy']['candidate_records_are_hidden'] is True
          assert manifest['policy']['material_facts_autopublish'] is False
          integration = manifest['site_integration']
          assert integration['section']['path'] == '/unde-iesim/'
          assert integration['section']['primary_nav']['enabled'] is True
          assert integration['homepage_module']['enabled'] is True
          assert integration['homepage_module']['items_source'] == 'site/homepage-module.json'
          homepage = json.loads((root / 'site/homepage-module.json').read_text(encoding='utf-8'))
          assert len(homepage['items']) <= integration['homepage_module']['max_items']
          assert all(item['path'].startswith('/unde-iesim/local/') for item in homepage['items'])
          assert (root / 'site/integration.json').is_file()

          runtime_feed = json.loads(Path('valcea-clar/site/runtime/live-feed.json').read_text(encoding='utf-8'))
          live_feed = json.loads((root / 'live-feed.json').read_text(encoding='utf-8'))
          runtime_ids = [str(item['id']) for item in runtime_feed.get('stories', [])]
          export_ids = [str(item['id']) for item in live_feed.get('stories', [])]
          assert runtime_feed.get('publication_model') == 'continuous_story_first'
          assert live_feed.get('publication_model') == 'continuous_story_first'
          assert runtime_feed.get('story_count') == len(runtime_ids)
          assert live_feed.get('story_count') == len(export_ids) == len(runtime_ids)
          assert export_ids == runtime_ids
          for story_id in runtime_ids:
              assert (root / 'stiri' / story_id / 'index.html').is_file(), story_id
          assert not (root / 'stiri' / 'olanesti-bridge-monitor' / 'index.html').is_file()
          assert (root / 'stiri/index.html').is_file()
          assert (root / 'despre/index.html').is_file()
          assert (root / 'stiri/ansambluri-rezidentiale-ramnicu-valcea/index.html').is_file()
          redirect = (root / 'stiri/ansambluri-rezidentiale-ramnicu-valcea/index.html').read_text(encoding='utf-8')
          assert 'noindex,follow' in redirect and 'url=/stiri/' in redirect
          assert manifest['public_ux']['same_navigation_everywhere'] is True
          assert manifest['public_ux']['cross_category_fill'] is False
          assert manifest['public_ux']['monitoring_is_news'] is False
          for item in manifest['files']:
              assert (root / item['path']).is_file(), item['path']
          print('ChatGPT Sites synchronization and canonical public UX integration: PASS')
          PY
      - name: Upload ChatGPT Sites synchronization payload
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-chatgpt-sites-${{ github.sha }}
          path: valcea-clar/dist/chatgpt-sites
          if-no-files-found: error
          retention-days: 14