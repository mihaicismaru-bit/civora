name: VÂLCEA CLAR Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/**'
      - '.github/workflows/valcea-clar-quality.yml'
      - '.github/workflows/valcea-clar-source-radar.yml'
      - '.github/workflows/valcea-clar-venues-ingest.yml'
      - '.github/workflows/valcea-clar-social-publishing.yml'
      - '.github/workflows/valcea-clar-engine-guard.yml'
      - '.github/workflows/valcea-clar-newsroom-live.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/**'
      - '.github/workflows/valcea-clar-quality.yml'
      - '.github/workflows/valcea-clar-source-radar.yml'
      - '.github/workflows/valcea-clar-venues-ingest.yml'
      - '.github/workflows/valcea-clar-social-publishing.yml'
      - '.github/workflows/valcea-clar-engine-guard.yml'
      - '.github/workflows/valcea-clar-newsroom-live.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate site-engine ownership
        run: python valcea-clar/scripts/validate_site_engine_ownership.py
      - name: Validate social-publication ownership
        run: python valcea-clar/social/validate_social_engine.py
      - name: Validate active social adapters
        run: python valcea-clar/social/facebook_publish.py --self-test
      - name: Validate editorial data
        run: python valcea-clar/scripts/validate_data.py
      - name: Validate ingest-to-catalogue reconciliation
        run: python valcea-clar/scripts/reconcile_ingest.py --check
      - name: Rebuild fail-closed public projection
        run: python valcea-clar/scripts/build_public_data.py
      - name: Verify generated files are committed
        run: git diff --exit-code -- valcea-clar/web/data
      - name: Static web smoke test
        run: python valcea-clar/scripts/smoke_web.py
      - name: JavaScript syntax check
        run: node --check valcea-clar/web/app.js
      - name: Source radar deterministic self-test
        run: python valcea-clar/scripts/probe_sources.py --self-test
      - name: Build ChatGPT Sites synchronization payload
        run: python valcea-clar/scripts/build_sites_export.py
      - name: Validate synchronization manifest and site integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('valcea-clar/dist/chatgpt-sites')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['target']['canonical_domain'] == 'valceaclar.ro'
          assert manifest['target']['platform'] == 'ChatGPT Sites'
          assert manifest['target']['create_parallel_site'] is False
          meta = json.loads(Path('valcea-clar/web/data/meta.json').read_text(encoding='utf-8'))
          assert manifest['counts']['public_places'] == meta['place_count']
          assert manifest['counts']['public_creators'] == meta['creator_count']
          assert manifest['counts']['hidden_candidates'] == meta['candidate_count']
          assert manifest['policy']['candidate_records_are_hidden'] is True
          assert manifest['policy']['material_facts_autopublish'] is False
          integration = manifest['site_integration']
          assert integration['section']['path'] == '/unde-iesim/'
          assert integration['section']['primary_nav']['enabled'] is True
          assert integration['homepage_module']['enabled'] is True
          assert integration['homepage_module']['items_source'] == 'site/homepage-module.json'
          homepage = json.loads((root / 'site/homepage-module.json').read_text(encoding='utf-8'))
          assert len(homepage['items']) <= integration['homepage_module']['max_items']
          assert all(item['path'].startswith('/unde-iesim/local/') for item in homepage['items'])
          assert (root / 'site/integration.json').is_file()
          for item in manifest['files']:
              assert (root / item['path']).is_file(), item['path']
          print('ChatGPT Sites synchronization and section integration: PASS')
          PY
      - name: Upload ChatGPT Sites synchronization payload
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-chatgpt-sites-${{ github.sha }}
          path: valcea-clar/dist/chatgpt-sites
          if-no-files-found: error
          retention-days: 14
