name: VÂLCEA CLAR Primary Signal Verifier

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VÂLCEA CLAR Signal Radar"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '5-55/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'local-news-os/core/primary_signal_verifier.py'
      - 'local-news-os/core/primary_signal_verifier_strict.py'
      - 'local-news-os/core/primary_signal_verifier_ranked.py'
      - 'local-news-os/core/primary_signal_verifier_ranked_strict.py'
      - 'local-news-os/core/primary_signal_verifier_routed_strict.py'
      - 'local-news-os/core/signal_radar.py'
      - 'local-news-os/core/signal_radar_routed.py'
      - 'local-news-os/core/signal_routing_contract.py'
      - 'local-news-os/instances/valcea/source_pack.json'
      - 'valcea-clar/editorial/signal_radar_config.json'
      - 'valcea-clar/editorial/signal_verification_queue.json'
      - 'valcea-clar/editorial/primary_signal_targets.json'
      - 'valcea-clar/editorial/news_sources.json'
      - 'valcea-clar/editorial/manual_watch_sources.json'
      - '.github/workflows/valcea-clar-primary-signal-verifier.yml'
  pull_request:
    paths:
      - 'local-news-os/core/primary_signal_verifier.py'
      - 'local-news-os/core/primary_signal_verifier_strict.py'
      - 'local-news-os/core/primary_signal_verifier_ranked.py'
      - 'local-news-os/core/primary_signal_verifier_ranked_strict.py'
      - 'local-news-os/core/primary_signal_verifier_routed_strict.py'
      - 'local-news-os/core/signal_radar.py'
      - 'local-news-os/core/signal_radar_routed.py'
      - 'local-news-os/core/signal_routing_contract.py'
      - 'local-news-os/instances/valcea/source_pack.json'
      - 'valcea-clar/editorial/signal_radar_config.json'
      - 'valcea-clar/editorial/primary_signal_targets.json'
      - 'valcea-clar/editorial/news_sources.json'
      - 'valcea-clar/editorial/manual_watch_sources.json'
      - '.github/workflows/valcea-clar-primary-signal-verifier.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-primary-signal-verifier-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  verify-signals:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate routed ranked strict verifier contract offline
        run: |
          python -m py_compile \
            local-news-os/core/primary_signal_verifier.py \
            local-news-os/core/primary_signal_verifier_strict.py \
            local-news-os/core/primary_signal_verifier_ranked.py \
            local-news-os/core/primary_signal_verifier_ranked_strict.py \
            local-news-os/core/primary_signal_verifier_routed_strict.py \
            local-news-os/core/signal_radar_routed.py \
            local-news-os/core/signal_routing_contract.py
          python local-news-os/core/primary_signal_verifier_routed_strict.py --self-test
          python local-news-os/core/primary_signal_verifier_routed_strict.py --instance valcea --validate-only
      - name: Rebuild routed signal queue locally for PR verification
        if: github.event_name == 'pull_request'
        run: python local-news-os/core/signal_radar_routed.py --instance valcea
      - name: Exercise routed ranked strict primary verification against freshly routed queue
        if: github.event_name == 'pull_request'
        run: python local-news-os/core/primary_signal_verifier_routed_strict.py --instance valcea --no-write
      - name: Verify current persisted radar queue against routed ranked primary sources
        if: github.event_name != 'pull_request'
        run: python local-news-os/core/primary_signal_verifier_routed_strict.py --instance valcea
      - name: Persist primary verification evidence safely
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/editorial/signal_primary_verification_state.json /tmp/valcea-primary-signal-state.json
          state_queue_generated_at=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/valcea-primary-signal-state.json', encoding='utf-8'))['queue_generated_at'])
          PY
          )
          git config user.name 'vâlcea-clar-primary-verifier[bot]'
          git config user.email 'valcea-clar-primary-verifier@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            latest_queue_generated_at=$(git show origin/main:valcea-clar/editorial/signal_verification_queue.json | python -c "import json,sys; print(json.load(sys.stdin)['generated_at'])")
            if [ "$state_queue_generated_at" != "$latest_queue_generated_at" ]; then
              echo "Verifier result is stale (${state_queue_generated_at}); latest persisted queue is ${latest_queue_generated_at}. The next successful radar workflow_run or schedule fallback will verify the newer queue."
              exit 0
            fi
            git reset --hard origin/main
            mkdir -p valcea-clar/editorial
            cp /tmp/valcea-primary-signal-state.json valcea-clar/editorial/signal_primary_verification_state.json
            git add valcea-clar/editorial/signal_primary_verification_state.json
            if git diff --cached --quiet; then
              echo 'Primary verification state already current.'
              exit 0
            fi
            git commit -m 'Refresh VÂLCEA CLAR primary signal verification state'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not persist primary verification state without conflict.' >&2
          exit 1
