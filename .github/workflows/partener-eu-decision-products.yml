name: PARTENER.EU Decision Products

on:
  workflow_dispatch:
  schedule:
    - cron: '53 * * * *'
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/build_decision_products.py'
      - 'partener-eu/ops/test_decision_products.py'
      - 'partener-eu/web/p11-public-data.js'
      - 'partener-eu/web/decision-intelligence-v2.js'
      - 'partener-eu/web/decision-intelligence-v2.css'
      - '.github/workflows/partener-eu-decision-products.yml'
  workflow_run:
    workflows:
      - 'PARTENER.EU MIPE Ingestion'
      - 'PARTENER.EU MIPE Romania Collector'
      - 'PARTENER.EU AFIR Ingestion'
      - 'PARTENER.EU PEO Calendar'
      - 'PARTENER.EU Production Validation'
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: partener-eu-decision-products
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build decision-useful editorial products
        run: python partener-eu/ingest/build_decision_products.py

      - name: Validate JavaScript and product coverage
        run: |
          node --check partener-eu/web/decision-intelligence-v2.js
          python partener-eu/ops/test_decision_products.py

      - name: Persist generated dossiers and meaningful news
        shell: bash
        run: |
          set -euo pipefail
          cp partener-eu/ingest/state/decision_products.json /tmp/decision_products.json
          cp partener-eu/web/decision-products.js /tmp/decision-products.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/decision_products.json partener-eu/ingest/state/decision_products.json
            cp /tmp/decision-products.js partener-eu/web/decision-products.js
            git add partener-eu/ingest/state/decision_products.json partener-eu/web/decision-products.js
            if git diff --cached --quiet; then
              echo 'Decision products already current.'
              exit 0
            fi
            git commit -m 'Regenerate decision-useful news and funding dossiers'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
