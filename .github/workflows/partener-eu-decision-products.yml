name: PARTENER.EU Decision Products

on:
  workflow_dispatch:
  schedule:
    - cron: '53 * * * *'
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/build_decision_products.py'
      - 'partener-eu/ingest/build_mipe_canonical_calls.py'
      - 'partener-eu/ingest/refine_mipe_canonical_calls.py'
      - 'partener-eu/ingest/enrich_mipe_canonical_facts.py'
      - 'partener-eu/ingest/merge_mipe_canonical_dossiers.py'
      - 'partener-eu/ingest/refine_afir_public_dossiers.py'
      - 'partener-eu/ingest/score_dossier_depth.py'
      - 'partener-eu/ingest/build_mipe_enrichment_seeds.py'
      - 'partener-eu/ingest/build_call_lifecycle.py'
      - 'partener-eu/ingest/polish_decision_products.py'
      - 'partener-eu/ingest/finalize_decision_products.py'
      - 'partener-eu/ingest/localize_decision_products.py'
      - 'partener-eu/ingest/state/mipe_ro_corpus.json'
      - 'partener-eu/ops/fix_call_lifecycle_monotonic.py'
      - 'partener-eu/ops/fix_call_lifecycle_result_evidence.py'
      - 'partener-eu/ops/fix_call_lifecycle_event_aliases.py'
      - 'partener-eu/ops/fix_decision_products_determinism.py'
      - 'partener-eu/ops/fix_decision_products_source_coverage.py'
      - 'partener-eu/ops/fix_decision_ui_romanian.py'
      - 'partener-eu/ops/test_decision_products.py'
      - 'partener-eu/ops/test_mipe_canonical_pipeline.py'
      - 'partener-eu/ops/test_dossier_autonomy.py'
      - 'partener-eu/ops/test_call_lifecycle.py'
      - 'partener-eu/ops/test_public_language.py'
      - 'partener-eu/web/p11-public-data.js'
      - 'partener-eu/web/decision-intelligence-v2.js'
      - 'partener-eu/web/decision-intelligence-v2.css'
      - 'partener-eu/web/call-lifecycle-ui.js'
      - 'partener-eu/web/call-lifecycle-ui.css'
      - '.github/workflows/partener-eu-decision-products.yml'
  workflow_run:
    workflows:
      - 'PARTENER.EU MIPE Ingestion'
      - 'PARTENER.EU MIPE Romania Collector'
      - 'PARTENER.EU MIPE Windows Crawl v3'
      - 'PARTENER.EU AFIR Ingestion'
      - 'PARTENER.EU PEO Calendar'
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: partener-eu-decision-products
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply deterministic source, lifecycle and Romanian UI rules
        run: |
          python partener-eu/ops/fix_decision_products_determinism.py
          python partener-eu/ops/fix_decision_products_source_coverage.py
          python partener-eu/ops/fix_decision_ui_romanian.py
          python partener-eu/ops/fix_call_lifecycle_monotonic.py
          python partener-eu/ops/fix_call_lifecycle_result_evidence.py
          python partener-eu/ops/fix_call_lifecycle_event_aliases.py

      - name: Canonicalize evidence and construct deep funding dossiers
        run: |
          python partener-eu/ingest/build_mipe_canonical_calls.py
          python partener-eu/ingest/refine_mipe_canonical_calls.py
          python partener-eu/ingest/enrich_mipe_canonical_facts.py
          python partener-eu/ingest/build_decision_products.py
          python partener-eu/ingest/merge_mipe_canonical_dossiers.py
          python partener-eu/ingest/polish_decision_products.py
          python partener-eu/ingest/finalize_decision_products.py
          python partener-eu/ingest/localize_decision_products.py
          python partener-eu/ingest/refine_afir_public_dossiers.py
          python partener-eu/ingest/score_dossier_depth.py
          python partener-eu/ingest/build_mipe_enrichment_seeds.py
          python partener-eu/ingest/build_call_lifecycle.py

      - name: Validate canonical grouping, dossier depth, lifecycle and public language
        run: |
          node --check partener-eu/web/decision-intelligence-v2.js
          node --check partener-eu/web/call-lifecycle-ui.js
          python partener-eu/ops/test_decision_products.py
          python partener-eu/ops/test_mipe_canonical_pipeline.py
          python partener-eu/ops/test_dossier_autonomy.py
          python partener-eu/ops/test_call_lifecycle.py
          python partener-eu/ops/test_public_language.py

      - name: Persist canonical calls, deep dossiers, enrichment targets and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cp partener-eu/ingest/build_decision_products.py /tmp/build_decision_products.py
          cp partener-eu/ingest/build_mipe_canonical_calls.py /tmp/build_mipe_canonical_calls.py
          cp partener-eu/ingest/refine_mipe_canonical_calls.py /tmp/refine_mipe_canonical_calls.py
          cp partener-eu/ingest/enrich_mipe_canonical_facts.py /tmp/enrich_mipe_canonical_facts.py
          cp partener-eu/ingest/merge_mipe_canonical_dossiers.py /tmp/merge_mipe_canonical_dossiers.py
          cp partener-eu/ingest/refine_afir_public_dossiers.py /tmp/refine_afir_public_dossiers.py
          cp partener-eu/ingest/score_dossier_depth.py /tmp/score_dossier_depth.py
          cp partener-eu/ingest/build_mipe_enrichment_seeds.py /tmp/build_mipe_enrichment_seeds.py
          cp partener-eu/ingest/build_call_lifecycle.py /tmp/build_call_lifecycle.py
          cp partener-eu/web/decision-intelligence-v2.js /tmp/decision-intelligence-v2.js
          cp partener-eu/ingest/state/mipe_canonical_calls.json /tmp/mipe_canonical_calls.json
          cp partener-eu/ingest/state/decision_products.json /tmp/decision_products.json
          cp partener-eu/ingest/state/dossier_enrichment_queue.json /tmp/dossier_enrichment_queue.json
          cp partener-eu/ingest/state/mipe_enrichment_seeds.json /tmp/mipe_enrichment_seeds.json
          cp partener-eu/ingest/state/call_lifecycle.json /tmp/call_lifecycle.json
          cp partener-eu/web/mipe-canonical-calls.js /tmp/mipe-canonical-calls.js
          cp partener-eu/web/decision-products.js /tmp/decision-products.js
          cp partener-eu/web/call-lifecycle.js /tmp/call-lifecycle.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/build_decision_products.py partener-eu/ingest/build_decision_products.py
            cp /tmp/build_mipe_canonical_calls.py partener-eu/ingest/build_mipe_canonical_calls.py
            cp /tmp/refine_mipe_canonical_calls.py partener-eu/ingest/refine_mipe_canonical_calls.py
            cp /tmp/enrich_mipe_canonical_facts.py partener-eu/ingest/enrich_mipe_canonical_facts.py
            cp /tmp/merge_mipe_canonical_dossiers.py partener-eu/ingest/merge_mipe_canonical_dossiers.py
            cp /tmp/refine_afir_public_dossiers.py partener-eu/ingest/refine_afir_public_dossiers.py
            cp /tmp/score_dossier_depth.py partener-eu/ingest/score_dossier_depth.py
            cp /tmp/build_mipe_enrichment_seeds.py partener-eu/ingest/build_mipe_enrichment_seeds.py
            cp /tmp/build_call_lifecycle.py partener-eu/ingest/build_call_lifecycle.py
            cp /tmp/decision-intelligence-v2.js partener-eu/web/decision-intelligence-v2.js
            cp /tmp/mipe_canonical_calls.json partener-eu/ingest/state/mipe_canonical_calls.json
            cp /tmp/decision_products.json partener-eu/ingest/state/decision_products.json
            cp /tmp/dossier_enrichment_queue.json partener-eu/ingest/state/dossier_enrichment_queue.json
            cp /tmp/mipe_enrichment_seeds.json partener-eu/ingest/state/mipe_enrichment_seeds.json
            cp /tmp/call_lifecycle.json partener-eu/ingest/state/call_lifecycle.json
            cp /tmp/mipe-canonical-calls.js partener-eu/web/mipe-canonical-calls.js
            cp /tmp/decision-products.js partener-eu/web/decision-products.js
            cp /tmp/call-lifecycle.js partener-eu/web/call-lifecycle.js
            git add \
              partener-eu/ingest/build_decision_products.py \
              partener-eu/ingest/build_mipe_canonical_calls.py \
              partener-eu/ingest/refine_mipe_canonical_calls.py \
              partener-eu/ingest/enrich_mipe_canonical_facts.py \
              partener-eu/ingest/merge_mipe_canonical_dossiers.py \
              partener-eu/ingest/refine_afir_public_dossiers.py \
              partener-eu/ingest/score_dossier_depth.py \
              partener-eu/ingest/build_mipe_enrichment_seeds.py \
              partener-eu/ingest/build_call_lifecycle.py \
              partener-eu/web/decision-intelligence-v2.js \
              partener-eu/ingest/state/mipe_canonical_calls.json \
              partener-eu/ingest/state/decision_products.json \
              partener-eu/ingest/state/dossier_enrichment_queue.json \
              partener-eu/ingest/state/mipe_enrichment_seeds.json \
              partener-eu/ingest/state/call_lifecycle.json \
              partener-eu/web/mipe-canonical-calls.js \
              partener-eu/web/decision-products.js \
              partener-eu/web/call-lifecycle.js
            if git diff --cached --quiet; then
              echo 'Autonomous dossier products already current.'
              exit 0
            fi
            git commit -m 'Autonomously target missing evidence and deepen funding dossiers'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
