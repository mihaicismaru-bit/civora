name: PARTENER.EU Official Programme Intelligence

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eea_norway_romania_programme_watch.py'
      - 'partener-eu/ops/test_eea_norway_romania_programme_watch.py'
      - 'partener-eu/ingest/interreg_romania_programme_matrix.py'
      - 'partener-eu/ops/test_interreg_romania_programme_matrix.py'
      - '.github/workflows/partener-eu-official-programme-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-programme-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded official-programme adapters and regressions
        run: |
          python -m py_compile \
            partener-eu/ingest/eea_norway_romania_programme_watch.py \
            partener-eu/ops/test_eea_norway_romania_programme_watch.py

      - name: Validate fail-closed EEA/Norway semantics
        env:
          PYTHONPATH: partener-eu/ingest
        run: python partener-eu/ops/test_eea_norway_romania_programme_watch.py

      - name: Acquire official Romania EEA/Norway evidence
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          rm -rf "$ROOT"
          mkdir -p "$ROOT/eea-norway-romania"
          python partener-eu/ingest/eea_norway_romania_programme_watch.py \
            --out-dir "$ROOT/eea-norway-romania" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Enforce live EEA/Norway non-authorizing boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/partener-eu-official-programme-intelligence/eea-norway-romania/eea-norway-romania-programme-watch.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['schema'] == 'PARTENER_EU_EEA_NORWAY_ROMANIA_PROGRAMME_WATCH_V1'
          assert d['source_health'] == 'HEALTHY'
          assert d['market_intelligence_only'] is True
          assert len(d['programmes']) == 9
          assert len(d['call_discovery']) >= 1
          for key in (
              'material_fact_use', 'open_call_authorized', 'closed_call_authorized',
              'deadline_authorized', 'budget_authorized', 'eligibility_authorized',
              'publish_authorized', 'distribution_authorized', 'call_alert_authorized',
              'canonical_corpus_mutation',
          ):
              assert d[key] is False, (key, d[key])
          assert all(x['observation_state'] == 'PROGRAMMING' for x in d['programming_observations'])
          assert all(x['observation_state'] == 'CALL_DISCOVERY_ONLY' for x in d['call_discovery'])
          assert all('/calls/call-' in x['url'] for x in d['call_discovery'])
          print({
              'programme_count': len(d['programmes']),
              'call_discovery_count': len(d['call_discovery']),
              'nfp_state': d['national_focal_point_observation']['state'],
              'semantic_fingerprint': d['semantic_fingerprint'],
          })
          PY

      - name: Upload replayable official-programme evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-official-programme-intelligence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-official-programme-intelligence
          if-no-files-found: error
          retention-days: 7
