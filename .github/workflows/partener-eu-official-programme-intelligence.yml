name: PARTENER.EU Official Programme Intelligence

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eea_norway_romania_programme_watch.py'
      - 'partener-eu/ops/test_eea_norway_romania_programme_watch.py'
      - 'partener-eu/ingest/interreg_romania_programme_matrix.py'
      - 'partener-eu/ops/test_interreg_romania_programme_matrix.py'
      - 'partener-eu/ingest/interreg_romania_call_surface_watch.py'
      - 'partener-eu/ops/test_interreg_romania_call_surface_watch.py'
      - 'partener-eu/web/programme_intelligence_pipeline_projection.py'
      - 'partener-eu/ops/test_programme_intelligence_pipeline_projection.py'
      - '.github/workflows/partener-eu-official-programme-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-programme-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded official-programme adapters and regressions
        run: |
          python -m py_compile \
            partener-eu/ingest/eea_norway_romania_programme_watch.py \
            partener-eu/ingest/interreg_romania_programme_matrix.py \
            partener-eu/ingest/interreg_romania_call_surface_watch.py \
            partener-eu/web/programme_intelligence_pipeline_projection.py \
            partener-eu/ops/test_eea_norway_romania_programme_watch.py \
            partener-eu/ops/test_interreg_romania_programme_matrix.py \
            partener-eu/ops/test_interreg_romania_call_surface_watch.py \
            partener-eu/ops/test_programme_intelligence_pipeline_projection.py

      - name: Validate fail-closed official-programme semantics
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/web
        run: |
          python partener-eu/ops/test_eea_norway_romania_programme_watch.py
          python partener-eu/ops/test_interreg_romania_programme_matrix.py
          python partener-eu/ops/test_interreg_romania_call_surface_watch.py
          python partener-eu/ops/test_programme_intelligence_pipeline_projection.py

      - name: Probe Interreg authority transport health
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          python - <<'PY'
          from interreg_romania_programme_matrix import PROGRAMMES, default_fetch
          failures = []
          for spec in PROGRAMMES:
              try:
                  raw, meta = default_fetch(spec['url'])
                  print({'programme_id': spec['id'], 'status': meta['status'], 'final_url': meta['final_url'], 'bytes': len(raw)})
              except Exception as exc:
                  failures.append((spec['id'], spec['url'], type(exc).__name__, str(exc)))
                  print({'programme_id': spec['id'], 'transport_health': 'FAIL', 'url': spec['url'], 'error_type': type(exc).__name__, 'error': str(exc)})
          if failures:
              raise SystemExit(f'Interreg authority transport failures: {failures}')
          PY

      - name: Acquire official Romania EEA/Norway evidence
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          rm -rf "$ROOT"
          mkdir -p "$ROOT/eea-norway-romania"
          python partener-eu/ingest/eea_norway_romania_programme_watch.py \
            --out-dir "$ROOT/eea-norway-romania" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Acquire official Interreg Romania programme/territory matrix
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/interreg-romania"
          python partener-eu/ingest/interreg_romania_programme_matrix.py \
            --out-dir "$ROOT/interreg-romania" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Acquire official Interreg Romania call surfaces
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/interreg-call-surfaces"
          python partener-eu/ingest/interreg_romania_call_surface_watch.py \
            --out-dir "$ROOT/interreg-call-surfaces" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Build read-only PROGRAMARE VIITOARE / PIPELINE preview
        env:
          PYTHONPATH: partener-eu/web
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/product"
          python partener-eu/web/programme_intelligence_pipeline_projection.py \
            --eea "$ROOT/eea-norway-romania/eea-norway-romania-programme-watch.json" \
            --interreg-calls "$ROOT/interreg-call-surfaces/interreg-romania-call-surface-watch.json" \
            --output "$ROOT/product/programare-viitoare-pipeline-preview.json"

      - name: Enforce live non-authorizing boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/partener-eu-official-programme-intelligence')
          eea = json.loads((root/'eea-norway-romania/eea-norway-romania-programme-watch.json').read_text(encoding='utf-8'))
          assert eea['schema'] == 'PARTENER_EU_EEA_NORWAY_ROMANIA_PROGRAMME_WATCH_V1'
          assert eea['source_health'] == 'HEALTHY' and eea['market_intelligence_only'] is True
          assert len(eea['programmes']) == 9 and len(eea['call_discovery']) >= 1
          assert all(x['observation_state'] == 'PROGRAMMING' for x in eea['programming_observations'])
          assert all(x['observation_state'] == 'CALL_DISCOVERY_ONLY' for x in eea['call_discovery'])
          assert all('/calls/call-' in x['url'] for x in eea['call_discovery'])

          interreg = json.loads((root/'interreg-romania/interreg-romania-programme-matrix.json').read_text(encoding='utf-8'))
          assert interreg['schema'] == 'PARTENER_EU_INTERREG_ROMANIA_PROGRAMME_MATRIX_V1'
          assert interreg['source_health'] == 'HEALTHY' and interreg['market_intelligence_only'] is True
          assert interreg['programme_count'] == 7
          assert all(x['observation_state'] == 'PROGRAMME_GEOGRAPHY_RESEARCH_NON_AUTHORIZING' for x in interreg['programmes'])
          assert all(x['territorial_fit_state'] == 'ROMANIA_PROGRAMME_TERRITORY_VERIFIED_NON_AUTHORIZING' for x in interreg['programmes'])

          interreg_calls = json.loads((root/'interreg-call-surfaces/interreg-romania-call-surface-watch.json').read_text(encoding='utf-8'))
          assert interreg_calls['schema'] == 'PARTENER_EU_INTERREG_ROMANIA_CALL_SURFACE_WATCH_V2'
          assert interreg_calls['source_health'] in {'HEALTHY', 'DEGRADED'}
          assert interreg_calls['market_intelligence_only'] is True
          assert interreg_calls['expected_surface_count'] == 7
          assert len(interreg_calls['surfaces']) == 7
          assert interreg_calls['discovered_call_facts'] == []
          assert interreg_calls['fallback_configured_count'] == 3
          assert interreg_calls['fallback_does_not_restore_call_surface_coverage'] is True
          assert interreg_calls['call_surface_coverage_complete'] is interreg_calls['coverage_complete']
          assert next(x for x in interreg_calls['surfaces'] if x['programme_id'] == 'RO_RS')['observation_state'] == 'PLANNED'
          assert all(
              x['observation_state'] == 'CALL_DISCOVERY_ONLY'
              for x in interreg_calls['surfaces']
              if x['programme_id'] != 'RO_RS'
          )
          assert next(x for x in interreg_calls['surfaces'] if x['programme_id'] == 'INTERREG_EUROPE')['programme_filter_required'] is True
          assert all(x['fallback_provenance']['call_surface_authority'] is False for x in interreg_calls['surfaces'])
          assert all(x['fallback_provenance']['call_fact_authorized'] is False for x in interreg_calls['surfaces'])
          assert all(
              x['fallback_provenance']['transport_health'] in {'HEALTHY', 'DEGRADED'}
              for x in interreg_calls['surfaces']
              if x['transport_health'] == 'DEGRADED'
              and x['fallback_provenance']['configured']
              and x['failure_class'] != 'VALIDATION_ERROR'
          )

          preview = json.loads((root/'product/programare-viitoare-pipeline-preview.json').read_text(encoding='utf-8'))
          assert preview['schema'] == 'PARTENER_EU_FUTURE_PROGRAMMING_PROJECTION_V1'
          assert preview['surface'] == 'PROGRAMARE_VIITOARE_PIPELINE'
          assert preview['surface_state'] == 'PREVIEW_READ_ONLY_NOT_PUBLISHED'
          assert preview['seo_indexing_state'] == 'NOINDEX_PREVIEW_ONLY'
          assert preview['open_upcoming_separation'] == 'STRICT'
          assert preview['material_change_claimed'] is False
          assert preview['semantic_reconciliation_present'] is False
          assert preview['semantic_reconciliation_required_before_material_change'] is True
          assert preview['card_count'] >= 3
          assert all(x['observation_state'] in {'PROGRAMMING', 'PLANNED'} for x in preview['cards'])
          assert not any(x['observation_state'] == 'CALL_DISCOVERY_ONLY' for x in preview['cards'])

          flags = (
              'material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized',
              'budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized',
              'call_alert_authorized','canonical_corpus_mutation',
          )
          assert all(eea[k] is False for k in flags)
          assert all(interreg[k] is False for k in flags)
          assert all(interreg_calls[k] is False for k in flags)
          assert all(preview[k] is False for k in flags)
          assert all(all(card[k] is False for k in flags) for card in preview['cards'])
          print({
              'eea_programmes': len(eea['programmes']),
              'eea_call_discovery': len(eea['call_discovery']),
              'interreg_programmes': interreg['programme_count'],
              'interreg_ids': [x['programme_id'] for x in interreg['programmes']],
              'interreg_call_surface_health': interreg_calls['source_health'],
              'interreg_call_surfaces_healthy': interreg_calls['healthy_surface_count'],
              'interreg_call_surfaces_degraded': interreg_calls['degraded_surface_count'],
              'interreg_call_surface_coverage_complete': interreg_calls['coverage_complete'],
              'interreg_fallback_configured': interreg_calls['fallback_configured_count'],
              'interreg_fallback_attempted': interreg_calls['fallback_attempted_count'],
              'interreg_fallback_healthy': interreg_calls['fallback_healthy_count'],
              'interreg_fallback_degraded': interreg_calls['fallback_degraded_count'],
              'interreg_degraded_direct_with_healthy_fallback': interreg_calls['degraded_direct_with_healthy_fallback_count'],
              'future_programming_preview_cards': preview['card_count'],
              'future_programming_states': sorted({x['observation_state'] for x in preview['cards']}),
              'future_programming_fingerprint': preview['semantic_fingerprint'],
              'eea_fingerprint': eea['semantic_fingerprint'],
              'interreg_fingerprint': interreg['semantic_fingerprint'],
              'interreg_call_surface_fingerprint': interreg_calls['semantic_fingerprint'],
          })
          PY

      - name: Upload replayable official-programme evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-official-programme-intelligence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-official-programme-intelligence
          if-no-files-found: error
          retention-days: 7
