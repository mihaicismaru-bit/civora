          assert eea_programming['schema'] == 'PARTENER_EU_EEA_ROMANIA_PROGRAMMING_EVIDENCE_V2'
          assert eea_programming['observation_state'] == 'PROGRAMMING_PIPELINE'
          assert eea_programming['stats']['programme_records'] == 9
          assert eea_programming['stats']['operator_watch_seeds'] == 9
          assert eea_programming['stats']['fund_operator_watch_seeds'] == 2
          assert eea_programming['stats']['open_calls_authorized'] == 0
          assert all(
              eea_programming[k] is False
              for k in (
                  'material_fact_use','open_call_authorized','deadline_authorized','budget_authorized',
                  'eligibility_authorized','publish_authorized','distribution_authorized','canonical_corpus_mutation'
              )
          )
          assert all(row['observation_state'] == 'PROGRAMMING_PIPELINE' and row['not_a_call'] is True for row in eea_programming['records'])
          assert all(row['programme_grant_scope'] == 'PROGRAMME_ALLOCATION_NOT_CALL_BUDGET' for row in eea_programming['records'])

          assert eea_operator['adapter_id'] == 'EEA_ROMANIA_OPERATOR_WATCH_V1'
          assert eea_operator['route_count'] == 9
          assert eea_operator['healthy_route_count'] >= 1
          assert all(
              eea_operator[k] is False
              for k in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized')
          )
          required_open = {'exact_call_or_topic_identifier','current_official_exact_call_endpoint','explicit_current_official_open_status','semantic_reconciliation'}
          assert required_open.issubset(set(eea_operator['missing_for_open_confirmation']))
          routes_by_id = {row['route_id']: row for row in eea_operator['routes']}
          civil = routes_by_id['EEA-RO-CIVIL-SOCIETY-FUND-CALL-INDEX-WATCH']
          assert civil['programme_ids'] == ['civil-society-fund']
          assert civil['authority_class'] == 'T1_OFFICIAL_FUND_OPERATOR'
          assert civil['requested_url'] == 'https://eeagrants.org/en/eea-civil-society-fund-romania/calls'
          for row in eea_operator['routes']:
              assert all(
                  row[k] is False
                  for k in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized')
              )
              if row['health_state'] == 'HEALTHY':
                  assert re.fullmatch(r'[0-9a-f]{64}', str(row.get('raw_sha256') or ''))
                  assert len(row.get('candidates') or []) == row['candidate_count']
                  assert all(x['candidate_observation_state'] == 'DISCOVERY_ONLY' for x in row.get('candidates') or [])
              else:
                  assert row['health_state'] == 'DEGRADED'
                  assert row['lkg_required'] is True and row['candidate_count'] == 0

          expected_interreg_ids = {'RO_BG','RO_HU','RO_RS','RO_UA','RO_MD','DANUBE','INTERREG_EUROPE','HUSKROUA','BSB'}
          assert interreg['schema'] == 'PARTENER_EU_INTERREG_ROMANIA_PROGRAMME_MATRIX_V1'
          assert interreg['programme_count'] == len(interreg['programmes']) == len(interreg['sources']) == len(expected_interreg_ids)
          interreg_by_id = {row['programme_id']: row for row in interreg['programmes']}
          assert set(interreg_by_id) == expected_interreg_ids
          bsb = interreg_by_id['BSB']
          assert bsb['romania_scope'] == ['Braila','Buzau','Constanta','Galati','Tulcea','Vrancea']
          assert bsb['authority_url'].startswith('https://projects.research-and-innovation.ec.europa.eu/')
          assert bsb['call_fact_authorized'] is False and bsb['applicant_eligibility_authorized'] is False
          assert interreg_calls['schema'] == 'PARTENER_EU_INTERREG_ROMANIA_CALL_SURFACE_WATCH_V2'
          assert interreg_calls['discovered_call_facts'] == [] and interreg_calls['fallback_does_not_restore_call_surface_coverage'] is True
          for applicant in (applicant_timis, applicant_valcea, applicant_suceava, applicant_tulcea):
              assert applicant['schema'] == 'PARTENER_EU_INTERREG_APPLICANT_PARTNER_FIT_V2'
              assert applicant['programme_count'] == interreg['programme_count']
              assert applicant['market_intelligence_only'] is True and applicant['fit_is_not_eligibility'] is True
              assert applicant['programme_matrix_semantic_fingerprint'] == interreg['semantic_fingerprint']
          assert applicant_valcea['input']['county'] == 'Vâlcea'
          valcea = {x['programme_id']: x for x in applicant_valcea['ranked_programme_fits']}
          assert set(valcea) == {'DANUBE', 'INTERREG_EUROPE'}
          assert valcea['DANUBE']['market_fit_score'] == 100
          assert applicant_suceava['input']['county'] == 'Suceava'
          suceava = {x['programme_id']: x for x in applicant_suceava['ranked_programme_fits']}
          assert suceava['HUSKROUA']['market_fit_score'] == 100
          assert suceava['HUSKROUA']['applicant_signal_state'] == 'SUPPORTED_PROGRAMME_SIGNAL'
          assert suceava['HUSKROUA']['matched_territory'] == 'Suceava'
          assert suceava['HUSKROUA']['eligibility_authorized'] is False
          assert suceava['RO_UA']['market_fit_score'] == 90
          assert suceava['RO_UA']['applicant_signal_state'] == 'SUPPORTED_HISTORICAL_CALL_SIGNAL'
          assert applicant_tulcea['input']['county'] == 'Tulcea'
          tulcea = {x['programme_id']: x for x in applicant_tulcea['ranked_programme_fits']}
          assert tulcea['BSB']['market_fit_score'] == 60
          assert tulcea['BSB']['applicant_signal_state'] == 'INSUFFICIENT_EVIDENCE'
          assert tulcea['BSB']['matched_territory'] == 'Tulcea'
          assert tulcea['BSB']['eligibility_authorized'] is False

          assert danube_exact['schema'] == 'PARTENER_EU_INTERREG_DANUBE_EXACT_CALL_V1'
          assert danube_exact['call_identifier'] == 'third-call-for-proposals'
          assert danube_exact['call_identifier_kind'] == 'OFFICIAL_EXACT_ENDPOINT_SLUG'
          assert danube_exact['exact_authority_verified'] is True
          assert danube_exact['current_index_authority_verified'] is True
          assert danube_exact['candidate_state'] == 'CLOSED_CALL_CANDIDATE'
          assert danube_exact['candidate_status_label'] == 'Closed calls'
          assert danube_reconcile['schema'] == 'PARTENER_EU_INTERREG_DANUBE_EXACT_RECONCILIATION_V1'
          if danube_previous:
              assert danube_reconcile['reconciliation_state'] in {'NO_CHANGE','DANUBE_EXACT_CALL_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING'}
              assert danube_reconcile['material_admission_ready_for_downstream_review'] is True
              assert danube_reconcile['previous_evidence_sha256'] is not None
          else:
              assert danube_reconcile['reconciliation_state'] == 'BASELINE_CAPTURED_NON_AUTHORIZING'
              assert danube_reconcile['material_admission_ready_for_downstream_review'] is False

          assert future['schema'] == 'PARTENER_EU_INTERREG_FUTURE_PROGRAMMING_WATCH_V1'
          assert future['source_count'] == 10
          assert future['source_health'] in {'HEALTHY', 'DEGRADED'}
          assert all(x['observation_state'] in {'PROPOSAL','CONSULTATION','PROGRAMMING_PROCESS'} for x in future['watchlist'])
          assert all(x['market_intelligence_only'] is True for x in future['watchlist'])
          future_by_id = {x['source_id']: x for x in future['watchlist']}
          ro_ua_future = future_by_id['INT-FUTURE-ROUA-POST2027']
          assert ro_ua_future['authority_url'] == 'https://www.ro-ua.net/en/post-2027'
          assert ro_ua_future['observation_state'] == 'CONSULTATION'
          assert ro_ua_future['consultation_lifecycle'] == 'AFTER_WINDOW'
          assert ro_ua_future['open_call_authorized'] is False and ro_ua_future['publish_authorized'] is False
          assert reconcile['schema'] == 'PARTENER_EU_INTERREG_FUTURE_PROGRAMMING_RECONCILIATION_V1'
          assert reconcile['reconciliation_state'] in {
              'BASELINE_CAPTURED_NON_AUTHORIZING', 'NO_CHANGE',
              'TRANSPORT_OR_CONTENT_DRIFT_ONLY', 'PIPELINE_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING',
              'PIPELINE_SEMANTIC_CHANGE_CURRENT_SOURCE_UNUSABLE_NON_AUTHORIZING'
          }

          assert preview['schema'] == 'PARTENER_EU_FUTURE_PROGRAMMING_PROJECTION_V1'
          assert preview_v2['schema'] == 'PARTENER_EU_FUTURE_PROGRAMMING_PROJECTION_V2'
          assert preview_v2['surface_state'] == 'PREVIEW_READ_ONLY_NOT_PUBLISHED'
          assert preview_v2['seo_indexing_state'] == 'NOINDEX_PREVIEW_ONLY'
          assert preview_v2['open_upcoming_separation'] == 'STRICT'
          assert preview_v2['future_programming_card_count'] == 10
          assert {'PROPOSAL','CONSULTATION','PROGRAMMING_PROCESS'}.issubset({x['observation_state'] for x in preview_v2['cards']})
          ro_ua_cards = [x for x in preview_v2['cards'] if x.get('programme_family') == 'INTERREG_NEXT_RO_UA']
          assert len(ro_ua_cards) == 1
          assert ro_ua_cards[0]['open_confirmation_state'] == 'NOT_CONFIRMED_PROGRAMMING_PIPELINE_ONLY'
          assert ro_ua_cards[0]['open_call_authorized'] is False and ro_ua_cards[0]['publish_authorized'] is False
          assert preview_v2['material_change_claimed'] is False
          assert preview_v2['semantic_reconciliation_present'] is True
          assert preview_v2['semantic_reconciliation_material_authority'] is False

          for obj in (
              eea, interreg, interreg_calls, applicant_timis, applicant_valcea, applicant_suceava, applicant_tulcea,
              danube_exact, danube_reconcile, future, reconcile, preview, preview_v2,
          ):
              assert all(obj[k] is False for k in flags)
          assert all(all(card[k] is False for k in flags) for card in preview_v2['cards'])
          print({
              'eea_programmes': len(eea['programmes']),
              'exact_csf_calls': csf,
              'eea_programming_records': eea_programming['stats']['programme_records'],
              'eea_operator_watch_health': eea_operator['health_state'],
              'eea_operator_watch_healthy_routes': eea_operator['healthy_route_count'],
              'eea_civil_society_fund_route_health': civil['health_state'],
              'eea_civil_society_fund_candidate_count': civil['candidate_count'],
              'interreg_programmes': interreg['programme_count'],
              'interreg_bsb_scope': bsb['romania_scope'],
              'interreg_call_surface_health': interreg_calls['source_health'],
              'applicant_fit_timis_count': applicant_timis['fit_count'],
              'applicant_fit_valcea_count': applicant_valcea['fit_count'],
              'applicant_fit_suceava_count': applicant_suceava['fit_count'],
              'applicant_fit_tulcea_count': applicant_tulcea['fit_count'],
              'applicant_fit_tulcea_bsb_score': tulcea['BSB']['market_fit_score'],
              'applicant_fit_suceava_huskroua_score': suceava['HUSKROUA']['market_fit_score'],
              'applicant_fit_valcea_top': applicant_valcea['ranked_programme_fits'][0]['programme_id'],
              'danube_exact_previous_restored': danube_previous,
              'danube_exact_candidate_state': danube_exact['candidate_state'],
              'danube_exact_reconciliation': danube_reconcile['reconciliation_state'],
              'danube_exact_semantic_changes': danube_reconcile['semantic_change_count'],
              'future_programming_sources': future['source_count'],
              'future_programming_ro_ua_lifecycle': ro_ua_future['consultation_lifecycle'],
              'future_programming_healthy': future['healthy_source_count'],
              'future_programming_degraded': future['degraded_source_count'],
              'future_reconciliation': reconcile['reconciliation_state'],
              'future_semantic_changes': reconcile['semantic_change_count'],
              'future_transport_changes': reconcile['transport_or_content_change_count'],
              'future_lkg_available': reconcile['lkg_reference_available_count'],
              'future_lkg_missing': reconcile['lkg_reference_missing_count'],
              'preview_v2_cards': preview_v2['card_count'],
              'preview_v2_future_cards': preview_v2['future_programming_card_count'],
              'preview_v2_states': sorted({x['observation_state'] for x in preview_v2['cards']}),
              'preview_v2_fingerprint': preview_v2['semantic_fingerprint'],
          })
          PY

      - name: Stage compact Danube exact history receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/danube-history-publish"
          cp "$ROOT/interreg-danube-exact/danube-third-call-exact.json" "$ROOT/danube-history-publish/"
          cp "$ROOT/interreg-danube-exact/danube-third-call-reconciliation.json" "$ROOT/danube-history-publish/"

      - name: Upload compact Danube exact history
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-interreg-danube-exact-history
          path: /tmp/partener-eu-official-programme-intelligence/danube-history-publish
          if-no-files-found: error
          retention-days: 7

      - name: Stage compact future-programming history receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/history-publish"
          cp "$ROOT/interreg-future/interreg-future-programming-snapshot.json" "$ROOT/history-publish/"
          cp "$ROOT/interreg-future/interreg-future-programming-reconciliation.json" "$ROOT/history-publish/"

      - name: Upload compact Interreg future-programming history
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-interreg-future-programming-history
          path: /tmp/partener-eu-official-programme-intelligence/history-publish
          if-no-files-found: error
          retention-days: 7

      - name: Upload replayable official-programme evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-official-programme-intelligence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-official-programme-intelligence
          if-no-files-found: error
          retention-days: 7
