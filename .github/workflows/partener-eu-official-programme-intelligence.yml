              assert history['lkg_is_current_truth'] is False
              for obj in (evidence, rec):
                  assert all(obj[k] is False for k in flags)
                  assert obj['publication_effect'] == 'NONE'
              csf[call_id] = {
                  'source_health_state': evidence['source_health_state'],
                  'candidate_state': evidence['candidate_state'],
                  'reconciliation_state': rec['reconciliation_state'],
                  'history_selected': history['selected'],
                  'previous_artifact_id': restore['artifact_id'],
