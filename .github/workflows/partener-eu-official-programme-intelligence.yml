          mkdir -p "$ROOT/danube-history-publish"
          cp "$ROOT/interreg-danube-exact/danube-third-call-exact.json" "$ROOT/danube-history-publish/"
          cp "$ROOT/interreg-danube-exact/danube-third-call-reconciliation.json" "$ROOT/danube-history-publish/"

