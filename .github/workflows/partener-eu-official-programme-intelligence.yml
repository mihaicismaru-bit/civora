name: PARTENER.EU Official Programme Intelligence

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eea_norway_romania_programme_watch.py'
      - 'partener-eu/ingest/eea_norway_romania_programme_watch_reconcile.py'
      - 'partener-eu/ops/run_eea_norway_romania_watch_canonical.py'
      - 'partener-eu/ops/run_eea_csf_exact_canonical.py'
      - 'partener-eu/ops/test_eea_norway_romania_programme_watch.py'
      - 'partener-eu/ops/test_eea_norway_romania_programme_watch_reconcile.py'
      - 'partener-eu/ingest/eea_romania_programming_intelligence.py'
      - 'partener-eu/ingest/eea_romania_programming_registry.json'
      - 'partener-eu/ops/test_eea_romania_programming_intelligence.py'
      - 'partener-eu/ingest/eea_romania_operator_watch.py'
      - 'partener-eu/ingest/eea_romania_operator_watch_registry.json'
      - 'partener-eu/ops/test_eea_romania_operator_watch.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call4_exact.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call4_reconcile.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call4_exact.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call4_reconcile.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call5_exact.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call5_reconcile.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call5_exact.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call5_reconcile.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call6_exact.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call6_reconcile.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call6_exact.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call6_reconcile.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call7_exact.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call7_reconcile.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call7_exact.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call7_reconcile.py'
      - 'partener-eu/ingest/interreg_romania_programme_matrix.py'
      - 'partener-eu/ops/test_interreg_romania_programme_matrix.py'
      - 'partener-eu/ingest/interreg_romania_call_surface_watch.py'
      - 'partener-eu/ops/test_interreg_romania_call_surface_watch.py'
      - 'partener-eu/ingest/interreg_applicant_partner_fit.py'
      - 'partener-eu/ingest/interreg_applicant_partner_fit_registry.json'
      - 'partener-eu/ops/test_interreg_applicant_partner_fit.py'
      - 'partener-eu/ingest/interreg_danube_exact_call.py'
      - 'partener-eu/ops/test_interreg_danube_exact_call.py'
      - 'partener-eu/ingest/interreg_future_programming_registry.json'
      - 'partener-eu/ingest/interreg_future_programming_watch.py'
      - 'partener-eu/ops/test_interreg_future_programming_watch.py'
      - 'partener-eu/web/programme_intelligence_pipeline_projection.py'
      - 'partener-eu/ops/test_programme_intelligence_pipeline_projection.py'
      - 'partener-eu/web/programme_intelligence_pipeline_enrichment.py'
      - 'partener-eu/ops/test_programme_intelligence_pipeline_enrichment.py'
      - '.github/workflows/partener-eu-official-programme-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  official-programme-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded official-programme adapters and regressions
        run: |
          python -m json.tool partener-eu/ingest/eea_romania_programming_registry.json >/dev/null
          python -m json.tool partener-eu/ingest/eea_romania_operator_watch_registry.json >/dev/null
          python -m py_compile \
            partener-eu/ingest/eea_norway_romania_programme_watch.py \
            partener-eu/ingest/eea_norway_romania_programme_watch_reconcile.py \
            partener-eu/ops/run_eea_norway_romania_watch_canonical.py \
            partener-eu/ops/run_eea_csf_exact_canonical.py \
            partener-eu/ingest/eea_romania_programming_intelligence.py \
            partener-eu/ingest/eea_romania_operator_watch.py \
            partener-eu/ingest/eea_civil_society_fund_call4_exact.py \
            partener-eu/ingest/eea_civil_society_fund_call4_reconcile.py \
            partener-eu/ingest/eea_civil_society_fund_call5_exact.py \
            partener-eu/ingest/eea_civil_society_fund_call5_reconcile.py \
            partener-eu/ingest/eea_civil_society_fund_call6_exact.py \
            partener-eu/ingest/eea_civil_society_fund_call6_reconcile.py \
            partener-eu/ingest/eea_civil_society_fund_call7_exact.py \
            partener-eu/ingest/eea_civil_society_fund_call7_reconcile.py \
            partener-eu/ingest/interreg_romania_programme_matrix.py \
            partener-eu/ingest/interreg_romania_call_surface_watch.py \
            partener-eu/ingest/interreg_applicant_partner_fit.py \
            partener-eu/ingest/interreg_danube_exact_call.py \
            partener-eu/ingest/interreg_future_programming_watch.py \
            partener-eu/web/programme_intelligence_pipeline_projection.py \
            partener-eu/web/programme_intelligence_pipeline_enrichment.py \
            partener-eu/ops/test_eea_norway_romania_programme_watch.py \
            partener-eu/ops/test_eea_norway_romania_programme_watch_reconcile.py \
            partener-eu/ops/test_eea_romania_programming_intelligence.py \
            partener-eu/ops/test_eea_romania_operator_watch.py \
            partener-eu/ops/test_eea_civil_society_fund_call4_exact.py \
            partener-eu/ops/test_eea_civil_society_fund_call4_reconcile.py \
            partener-eu/ops/test_eea_civil_society_fund_call5_exact.py \
            partener-eu/ops/test_eea_civil_society_fund_call5_reconcile.py \
            partener-eu/ops/test_eea_civil_society_fund_call6_exact.py \
            partener-eu/ops/test_eea_civil_society_fund_call6_reconcile.py \
            partener-eu/ops/test_eea_civil_society_fund_call7_exact.py \
            partener-eu/ops/test_eea_civil_society_fund_call7_reconcile.py \
            partener-eu/ops/test_interreg_romania_programme_matrix.py \
            partener-eu/ops/test_interreg_romania_call_surface_watch.py \
            partener-eu/ops/test_interreg_applicant_partner_fit.py \
            partener-eu/ops/test_interreg_danube_exact_call.py \
            partener-eu/ops/test_interreg_future_programming_watch.py \
            partener-eu/ops/test_programme_intelligence_pipeline_projection.py \
            partener-eu/ops/test_programme_intelligence_pipeline_enrichment.py

      - name: Validate fail-closed official-programme semantics
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/web:partener-eu/ops
        run: |
          python partener-eu/ops/test_eea_norway_romania_programme_watch.py
          python partener-eu/ops/test_eea_norway_romania_programme_watch_reconcile.py
          python partener-eu/ops/test_eea_romania_programming_intelligence.py
          python partener-eu/ops/test_eea_romania_operator_watch.py
          python partener-eu/ops/test_eea_civil_society_fund_call4_exact.py
          python partener-eu/ops/test_eea_civil_society_fund_call4_reconcile.py
          python partener-eu/ops/test_eea_civil_society_fund_call5_exact.py
          python partener-eu/ops/test_eea_civil_society_fund_call5_reconcile.py
          python partener-eu/ops/test_eea_civil_society_fund_call6_exact.py
          python partener-eu/ops/test_eea_civil_society_fund_call6_reconcile.py
          python partener-eu/ops/test_eea_civil_society_fund_call7_exact.py
          python partener-eu/ops/test_eea_civil_society_fund_call7_reconcile.py
          python partener-eu/ops/test_interreg_romania_programme_matrix.py
          python partener-eu/ops/test_interreg_romania_call_surface_watch.py
          python partener-eu/ops/test_interreg_applicant_partner_fit.py
          python partener-eu/ops/test_interreg_danube_exact_call.py
          python partener-eu/ops/test_interreg_future_programming_watch.py
          python partener-eu/ops/test_programme_intelligence_pipeline_projection.py
          python partener-eu/ops/test_programme_intelligence_pipeline_enrichment.py

      - name: Probe Interreg authority transport health
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          python - <<'PY'
          from interreg_romania_programme_matrix import PROGRAMMES, default_fetch
          failures = []
          for spec in PROGRAMMES:
              try:
                  raw, meta = default_fetch(spec['url'])
                  print({'programme_id': spec['id'], 'status': meta['status'], 'final_url': meta['final_url'], 'bytes': len(raw)})
              except Exception as exc:
                  failures.append((spec['id'], spec['url'], type(exc).__name__, str(exc)))
                  print({'programme_id': spec['id'], 'transport_health': 'FAIL', 'url': spec['url'], 'error_type': type(exc).__name__, 'error': str(exc)})
          if failures:
              raise SystemExit(f'Interreg authority transport failures: {failures}')
          PY

      - name: Acquire and reconcile official Romania EEA/Norway programme evidence with canonical exact-call history/LKG
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EEA_NORWAY_WATCH_ROOT: /tmp/partener-eu-official-programme-intelligence/eea-norway-romania
          EEA_NORWAY_WATCH_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-eea-norway-romania-watch
        run: |
          python partener-eu/ops/run_eea_norway_romania_watch_canonical.py
          cp /tmp/partener-eu-official-programme-intelligence/eea-norway-romania/current/eea-norway-romania-programme-watch.json \
             /tmp/partener-eu-official-programme-intelligence/eea-norway-romania/eea-norway-romania-programme-watch.json

      - name: Acquire official FMO Romania programming/operator intelligence
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/eea-programming"
          python partener-eu/ingest/eea_romania_programming_intelligence.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$ROOT/eea-programming/eea-romania-programming-evidence.json"

      - name: Acquire bounded official EEA Programme/Fund Operator watch
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/eea-operator-watch"
          python partener-eu/ingest/eea_romania_operator_watch.py \
            --output-dir "$ROOT/eea-operator-watch" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Acquire official Interreg Romania programme/territory matrix
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/interreg-romania"
          python partener-eu/ingest/interreg_romania_programme_matrix.py \
            --out-dir "$ROOT/interreg-romania" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Build Interreg applicant/partner market-fit smoke receipts
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/interreg-applicant-fit"
          python partener-eu/ingest/interreg_applicant_partner_fit.py \
            --county "Timiș" \
            --applicant-type PUBLIC_AUTHORITY \
            --has-international-partner \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --programme-matrix "$ROOT/interreg-romania/interreg-romania-programme-matrix.json" \
            --output "$ROOT/interreg-applicant-fit/timis-public-authority.json"
          python partener-eu/ingest/interreg_applicant_partner_fit.py \
            --county "Vâlcea" \
            --applicant-type PRIVATE_BODY \
            --has-international-partner \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --programme-matrix "$ROOT/interreg-romania/interreg-romania-programme-matrix.json" \
            --output "$ROOT/interreg-applicant-fit/valcea-private-body.json"
          python partener-eu/ingest/interreg_applicant_partner_fit.py \
            --county "Suceava" \
            --applicant-type PUBLIC_AUTHORITY \
            --has-international-partner \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --programme-matrix "$ROOT/interreg-romania/interreg-romania-programme-matrix.json" \
            --output "$ROOT/interreg-applicant-fit/suceava-public-authority.json"
          python partener-eu/ingest/interreg_applicant_partner_fit.py \
            --county "Tulcea" \
            --applicant-type NGO_NONPROFIT \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --programme-matrix "$ROOT/interreg-romania/interreg-romania-programme-matrix.json" \
            --output "$ROOT/interreg-applicant-fit/tulcea-ngo.json"

      - name: Acquire official Interreg Romania call surfaces
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/interreg-call-surfaces"
          python partener-eu/ingest/interreg_romania_call_surface_watch.py \
            --out-dir "$ROOT/interreg-call-surfaces" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Restore previous successful same-branch Danube exact receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-official-programme-intelligence
          SCRATCH=/tmp/partener-eu-danube-exact-history-scan
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"
          mkdir -p "$ROOT/interreg-danube-exact"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$SCRATCH/artifacts.json"
          CANDIDATE="$(python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/partener-eu-danube-exact-history-scan/artifacts.json').read_text(encoding='utf-8'))
          head=os.environ['EXPECTED_HEAD_SHA']
          branch=os.environ['EXPECTED_HEAD_BRANCH']
          rows=[]
          for artifact in data.get('artifacts') or []:
              name=str(artifact.get('name') or '')
              if name != 'partener-eu-interreg-danube-exact-history' and not name.startswith('partener-eu-interreg-danube-exact-'):
                  continue
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              if str(run.get('head_sha') or '') == head:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              rows.append((str(artifact.get('created_at') or ''), int(artifact.get('id') or 0)))
          rows.sort(reverse=True)
          print(rows[0][1] if rows else '')
          PY
          )"
          if [ -n "$CANDIDATE" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE}/zip" > "$SCRATCH/previous.zip"
            mkdir -p "$SCRATCH/unpacked"
            unzip -q "$SCRATCH/previous.zip" -d "$SCRATCH/unpacked"
            PREVIOUS="$(find "$SCRATCH/unpacked" -type f -name 'danube-third-call-exact.json' | head -n1 || true)"
            if [ -n "$PREVIOUS" ]; then
              cp "$PREVIOUS" "$ROOT/interreg-danube-exact/previous-exact.json"
              echo "Restored previous bounded Danube exact receipt from artifact ${CANDIDATE}"
            fi
          else
            echo "No previous same-branch Danube exact artifact found; baseline mode retained."
          fi

      - name: Acquire fresh exact current Danube call evidence and reconcile
        env:
          PYTHONPATH: partener-eu/ingest
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-official-programme-intelligence/interreg-danube-exact
          ARGS=()
          if [ -f "$ROOT/previous-exact.json" ]; then
            ARGS+=(--previous "$ROOT/previous-exact.json")
          fi
          python partener-eu/ingest/interreg_danube_exact_call.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$ROOT/danube-third-call-exact.json" \
            --reconciliation-output "$ROOT/danube-third-call-reconciliation.json" \
            "${ARGS[@]}"

      - name: Restore previous successful Interreg future-programming snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/interreg-future/history-scan"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=partener-eu-interreg-future-programming-history&per_page=100" > "$ROOT/interreg-future/history-scan/artifacts.json"
          CANDIDATE="$(python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/partener-eu-official-programme-intelligence/interreg-future/history-scan/artifacts.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          head=os.environ['EXPECTED_HEAD_SHA']
          branch=os.environ['EXPECTED_HEAD_BRANCH']
          rows=[]
          for artifact in data.get('artifacts') or []:
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              if str(run.get('head_sha') or '') == head:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              rows.append((str(artifact.get('created_at') or ''), int(artifact.get('id') or 0)))
          rows.sort(reverse=True)
          print(rows[0][1] if rows else '')
          PY
          )"
          if [ -n "$CANDIDATE" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE}/zip" > "$ROOT/interreg-future/history-scan/previous.zip"
            mkdir -p "$ROOT/interreg-future/history-scan/unpacked"
            unzip -q "$ROOT/interreg-future/history-scan/previous.zip" -d "$ROOT/interreg-future/history-scan/unpacked"
            PREVIOUS="$(find "$ROOT/interreg-future/history-scan/unpacked" -type f -name 'interreg-future-programming-snapshot.json' | head -n1 || true)"
            if [ -n "$PREVIOUS" ]; then
              cp "$PREVIOUS" "$ROOT/interreg-future/previous-snapshot.json"
              echo "Restored previous bounded snapshot from artifact ${CANDIDATE}"
            fi
          else
            echo "No previous successful same-branch bounded snapshot available; baseline reconciliation will be used."
          fi

      - name: Acquire and reconcile Interreg 2028-2034 programming intelligence
        env:
          PYTHONPATH: partener-eu/ingest
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/interreg-future"
          ARGS=()
          if [ -f "$ROOT/interreg-future/previous-snapshot.json" ]; then
            ARGS+=(--previous "$ROOT/interreg-future/previous-snapshot.json")
          fi
          python partener-eu/ingest/interreg_future_programming_watch.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$ROOT/interreg-future/interreg-future-programming-snapshot.json" \
            --reconciliation-output "$ROOT/interreg-future/interreg-future-programming-reconciliation.json" \
            "${ARGS[@]}"

      - name: Build read-only PROGRAMARE VIITOARE / PIPELINE preview
        env:
          PYTHONPATH: partener-eu/web
        run: |
          ROOT=/tmp/partener-eu-official-programme-intelligence
          mkdir -p "$ROOT/product"
          python partener-eu/web/programme_intelligence_pipeline_projection.py \
            --eea "$ROOT/eea-norway-romania/eea-norway-romania-programme-watch.json" \
            --interreg-calls "$ROOT/interreg-call-surfaces/interreg-romania-call-surface-watch.json" \
            --output "$ROOT/product/programare-viitoare-pipeline-preview.json"
          PYTHONPATH=partener-eu/ingest:partener-eu/web python partener-eu/web/programme_intelligence_pipeline_enrichment.py \
            --base-preview "$ROOT/product/programare-viitoare-pipeline-preview.json" \
            --future-snapshot "$ROOT/interreg-future/interreg-future-programming-snapshot.json" \
            --future-reconciliation "$ROOT/interreg-future/interreg-future-programming-reconciliation.json" \
            --output "$ROOT/product/programare-viitoare-pipeline-preview-v2.json"

      - name: Enforce live non-authorizing boundaries and canonical CSF ownership
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root = Path('/tmp/partener-eu-official-programme-intelligence')
          eea = json.loads((root/'eea-norway-romania/eea-norway-romania-programme-watch.json').read_text(encoding='utf-8'))
          eea_programming = json.loads((root/'eea-programming/eea-romania-programming-evidence.json').read_text(encoding='utf-8'))
          eea_operator = json.loads((root/'eea-operator-watch/handoff/eea_romania_operator_watch.json').read_text(encoding='utf-8'))
          interreg = json.loads((root/'interreg-romania/interreg-romania-programme-matrix.json').read_text(encoding='utf-8'))
          interreg_calls = json.loads((root/'interreg-call-surfaces/interreg-romania-call-surface-watch.json').read_text(encoding='utf-8'))
          applicant_timis = json.loads((root/'interreg-applicant-fit/timis-public-authority.json').read_text(encoding='utf-8'))
          applicant_valcea = json.loads((root/'interreg-applicant-fit/valcea-private-body.json').read_text(encoding='utf-8'))
          applicant_suceava = json.loads((root/'interreg-applicant-fit/suceava-public-authority.json').read_text(encoding='utf-8'))
          applicant_tulcea = json.loads((root/'interreg-applicant-fit/tulcea-ngo.json').read_text(encoding='utf-8'))
          danube_exact = json.loads((root/'interreg-danube-exact/danube-third-call-exact.json').read_text(encoding='utf-8'))
          danube_reconcile = json.loads((root/'interreg-danube-exact/danube-third-call-reconciliation.json').read_text(encoding='utf-8'))
          danube_previous = (root/'interreg-danube-exact/previous-exact.json').exists()
          future = json.loads((root/'interreg-future/interreg-future-programming-snapshot.json').read_text(encoding='utf-8'))
          reconcile = json.loads((root/'interreg-future/interreg-future-programming-reconciliation.json').read_text(encoding='utf-8'))
