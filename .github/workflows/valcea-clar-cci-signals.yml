name: VÂLCEA CLAR CCI Vâlcea Signals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/cci_valcea_signal_adapter.py'
      - '.github/workflows/valcea-clar-cci-signals.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/cci_valcea_signal_adapter.py'
      - '.github/workflows/valcea-clar-cci-signals.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-cci-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile CCI Vâlcea evidence-first adapter
        run: python -m py_compile valcea-clar/scripts/cci_valcea_signal_adapter.py
      - name: Run CCI Vâlcea fail-closed regressions
        run: python valcea-clar/scripts/cci_valcea_signal_adapter.py --self-test
