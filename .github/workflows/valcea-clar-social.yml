name: VÂLCEA CLAR Social Distribution Engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "valcea-clar/social/**"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-social.yml"
      - ".github/workflows/valcea-clar-facebook.yml"
  push:
    branches: [main]
    paths:
      - "valcea-clar/social/**"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-social.yml"
      - ".github/workflows/valcea-clar-facebook.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: valcea-clar-social-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build channel-native social outbox from current edition
        run: python valcea-clar/social/build_current_edition_outbox.py

      - name: Fetch approved real photographs
        run: python valcea-clar/social/fetch_approved_photos.py

      - name: Build public social-media asset payload
        run: python valcea-clar/social/build_social_media_assets.py

      - name: Validate all social publishing adapters
        run: |
          python -m py_compile \
            valcea-clar/social/social_common.py \
            valcea-clar/social/build_current_edition_outbox.py \
            valcea-clar/social/build_social_media_assets.py \
            valcea-clar/social/facebook_publish.py \
            valcea-clar/social/instagram_publish.py \
            valcea-clar/social/tiktok_publish.py
          python valcea-clar/social/build_social_media_assets.py --self-test
          python valcea-clar/social/facebook_publish.py --self-test
          python valcea-clar/social/instagram_publish.py --self-test
          python valcea-clar/social/tiktok_publish.py --self-test

      - name: Preview Facebook queue
        id: facebook
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/facebook_publish.py > /tmp/facebook-preview.json
          cat /tmp/facebook-preview.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/facebook-preview.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(
                  f"has_eligible={'true' if bool(payload.get('eligible')) else 'false'}\n"
              )
          PY

      - name: Preview Instagram queue
        run: |
          python valcea-clar/social/instagram_publish.py > /tmp/instagram-preview.json
          cat /tmp/instagram-preview.json

      - name: Preview TikTok queue
        run: |
          python valcea-clar/social/tiktok_publish.py > /tmp/tiktok-preview.json
          cat /tmp/tiktok-preview.json

      - name: Publish eligible Facebook posts from the site engine
        if: github.event_name != 'pull_request' && steps.facebook.outputs.has_eligible == 'true'
        env:
          VALCEA_FB_PAGE_ID: "1234360446430980"
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/facebook_publish.py --apply \
            | tee /tmp/facebook-apply.json

      - name: Report Facebook preview-only or empty queue
        if: github.event_name == 'pull_request' || steps.facebook.outputs.has_eligible != 'true'
        run: |
          echo '{"status":"NO_APPLY","platform":"facebook"}' \
            | tee /tmp/facebook-apply.json

      - name: Publish eligible Instagram posts from the site engine
        if: github.event_name != 'pull_request'
        env:
          VALCEA_IG_ACCOUNT_ID: ${{ vars.VALCEA_IG_ACCOUNT_ID }}
          VALCEA_IG_ACCESS_TOKEN: ${{ secrets.VALCEA_IG_ACCESS_TOKEN }}
          VALCEA_IG_GRAPH_VERSION: v26.0
          VALCEA_IG_GRAPH_HOST: graph.facebook.com
          VALCEA_IG_MAX_PER_RUN: "1"
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/instagram_publish.py --apply \
            | tee /tmp/instagram-apply.json

      - name: Report Instagram preview-only run
        if: github.event_name == 'pull_request'
        run: |
          cp /tmp/instagram-preview.json /tmp/instagram-apply.json

      - name: Publish eligible TikTok posts from the site engine
        if: github.event_name != 'pull_request'
        env:
          VALCEA_TIKTOK_ACCESS_TOKEN: ${{ secrets.VALCEA_TIKTOK_ACCESS_TOKEN }}
          VALCEA_TIKTOK_PUBLIC_POSTING_APPROVED: ${{ vars.VALCEA_TIKTOK_PUBLIC_POSTING_APPROVED }}
          VALCEA_TIKTOK_MAX_PER_RUN: "1"
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/tiktok_publish.py --apply \
            | tee /tmp/tiktok-apply.json

      - name: Report TikTok preview-only run
        if: github.event_name == 'pull_request'
        run: |
          cp /tmp/tiktok-preview.json /tmp/tiktok-apply.json

      - name: Write social-engine summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def read(name):
              path = Path('/tmp') / name
              if not path.exists():
                  return {'status': 'NOT_RUN'}
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  return {'status': 'UNREADABLE', 'error': str(exc)}

          facebook = read('facebook-apply.json')
          instagram = read('instagram-apply.json')
          tiktok = read('tiktok-apply.json')
          lines = [
              '# VÂLCEA CLAR — Social Distribution Engine',
              '',
              '- Execution owner: `civora_site_engine`',
              '- Scheduler/runtime: `GitHub Actions`',
              '- ChatGPT runtime: `disabled`',
              f"- Facebook: **{facebook.get('status', 'UNKNOWN')}**",
              f"- Instagram: **{instagram.get('status', 'UNKNOWN')}**",
              f"- TikTok: **{tiktok.get('status', 'UNKNOWN')}**",
              '',
              'Facebook and Instagram publish directly when credentials and eligible '
              'channel-native packages exist. TikTok publishes only after the official '
              'app audit and explicit consent recorded in the valceaclar.ro site admin.',
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Persist social outbox and platform state conflict-safe
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            valcea-clar/social/facebook_outbox.json
            valcea-clar/social/facebook_state.json
            valcea-clar/social/instagram_state.json
            valcea-clar/social/tiktok_state.json
            valcea-clar/social/social_media_manifest.json
          )

          rm -rf /tmp/valcea-social-state
          mkdir -p /tmp/valcea-social-state
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              mkdir -p "/tmp/valcea-social-state/$(dirname "$file")"
              cp "$file" "/tmp/valcea-social-state/$file"
            fi
          done

          git config user.name "valcea-clar-social-engine[bot]"
          git config user.email "valcea-clar-social-engine@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              if [ -f "/tmp/valcea-social-state/$file" ]; then
                mkdir -p "$(dirname "$file")"
                cp "/tmp/valcea-social-state/$file" "$file"
                git add "$file"
              fi
            done
            if git diff --cached --quiet; then
              echo "No VÂLCEA CLAR social-engine changes."
              exit 0
            fi
            git commit -m "Persist VÂLCEA CLAR social distribution state"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced; retrying ${attempt}/5"
            sleep $((attempt * 2))
          done
          echo "Unable to persist social distribution state after five attempts." >&2
          exit 1

      - name: Upload social-media runtime payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-social-media-runtime-${{ github.run_id }}
          path: |
            valcea-clar/site/runtime/media/social
            valcea-clar/dist/chatgpt-sites/media/social
            valcea-clar/social/social_media_manifest.json
          if-no-files-found: warn
          retention-days: 7
