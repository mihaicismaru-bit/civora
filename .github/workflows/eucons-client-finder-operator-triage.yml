name: EUCONS Client Finder Operator Triage

on:
  pull_request:
    paths:
      - 'eucons/prospects/client_finder_operator_triage.py'
      - 'eucons/prospects/client_finder_operator_triage_contract.json'
      - 'eucons/validation/test_client_finder_operator_triage_fail_closed.py'
      - '.github/workflows/eucons-client-finder-operator-triage.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/prospects/client_finder_operator_triage.py'
      - 'eucons/prospects/client_finder_operator_triage_contract.json'
      - 'eucons/validation/test_client_finder_operator_triage_fail_closed.py'
      - '.github/workflows/eucons-client-finder-operator-triage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-client-finder-operator-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Client Finder operator triage fail-closed behavior
        run: python eucons/validation/test_client_finder_operator_triage_fail_closed.py
