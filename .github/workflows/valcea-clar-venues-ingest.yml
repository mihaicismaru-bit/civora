name: VÂLCEA CLAR — UNDE IEȘIM ingest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "valcea-clar/**"
      - ".github/workflows/valcea-clar-venues-ingest.yml"
  push:
    branches: [main]
    paths:
      - "valcea-clar/ingest/seed_catalog.json.part-*"
      - "valcea-clar/ingest/source_registry.json"
      - "valcea-clar/ingest/venue_ingest.py"
      - "valcea-clar/ingest/venue_discovery.py"
      - "valcea-clar/ingest/discovery_overlay_guard.py"
      - "valcea-clar/validation/validate.py"
      - "valcea-clar/scripts/reconcile_ingest.py"
      - "valcea-clar/scripts/promote_verified_venues.py"
      - "valcea-clar/scripts/quarantine_venue_identity_collisions.py"
      - "valcea-clar/scripts/build_public_data.py"
      - "valcea-clar/scripts/build_live_feed.py"
      - "valcea-clar/ops/ingest_aliases.json"
      - ".github/workflows/valcea-clar-venues-ingest.yml"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: valcea-clar-unde-iesim-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate autonomous venue safety gates offline
        run: |
          python valcea-clar/ingest/venue_discovery.py --self-test
          python valcea-clar/ingest/discovery_overlay_guard.py --self-test
          python valcea-clar/scripts/promote_verified_venues.py --self-test
          python valcea-clar/scripts/quarantine_venue_identity_collisions.py --self-test

      - name: Discover new venue identities from public frontier
        run: python valcea-clar/ingest/venue_discovery.py --timeout 7 --max-websites 12

      - name: Fail closed on ambiguous dynamic discovery overlays
        run: python valcea-clar/ingest/discovery_overlay_guard.py

      - name: Probe baseline and discovered official sources
        run: python valcea-clar/ingest/venue_ingest.py --timeout 12

      - name: Validate raw ingest outputs
        run: python valcea-clar/validation/validate.py

      - name: Quarantine ambiguous venue identity collisions
        run: python valcea-clar/scripts/quarantine_venue_identity_collisions.py

      - name: Validate quarantined ingest outputs
        run: python valcea-clar/validation/validate.py

      - name: Evaluate safe verified venue promotion on pull requests
        if: github.event_name == 'pull_request'
        id: promotion_preview
        shell: bash
        run: |
          set -euo pipefail
          output="$(python valcea-clar/scripts/promote_verified_venues.py --check)"
          echo "$output"
          echo "result=$output" >> "$GITHUB_OUTPUT"

      - name: Promote only verified official venue identities
        if: github.event_name != 'pull_request'
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          output="$(python valcea-clar/scripts/promote_verified_venues.py)"
          echo "$output"
          changed="$(printf '%s' "$output" | python -c 'import json,sys; print(str(json.load(sys.stdin)["changed"]).lower())')"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "result=$output" >> "$GITHUB_OUTPUT"

      - name: Validate promoted canonical catalogue
        if: github.event_name != 'pull_request' && steps.promotion.outputs.changed == 'true'
        run: python valcea-clar/scripts/validate_data.py

      - name: Rebuild public venue projection
        if: github.event_name != 'pull_request' && steps.promotion.outputs.changed == 'true'
        run: python valcea-clar/scripts/build_public_data.py

      - name: Rebuild live site feed with complete verified venue catalogue
        if: github.event_name != 'pull_request' && steps.promotion.outputs.changed == 'true'
        run: python valcea-clar/scripts/build_live_feed.py

      - name: Reconcile fresh ingestion with the curated public catalogue
        run: python valcea-clar/scripts/reconcile_ingest.py

      - name: Write job summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, os
          state=json.load(open('valcea-clar/ingest/state/venues.json',encoding='utf-8'))
          report=json.load(open('valcea-clar/validation/latest_report.json',encoding='utf-8'))
          reconciliation=json.load(open('valcea-clar/ops/ingest_reconciliation.json',encoding='utf-8'))
          discovery_path=pathlib.Path('valcea-clar/ops/venue_discovery_receipt.json')
          discovery=json.loads(discovery_path.read_text(encoding='utf-8')) if discovery_path.is_file() else {}
          overlay_path=pathlib.Path('valcea-clar/ops/venue_discovery_overlay_guard.json')
          overlay=json.loads(overlay_path.read_text(encoding='utf-8')) if overlay_path.is_file() else {'blocked': []}
          holds_path=pathlib.Path('valcea-clar/ops/venue_identity_collision_holds.json')
          holds=json.loads(holds_path.read_text(encoding='utf-8')) if holds_path.is_file() else {'holds': []}
          receipt_path=pathlib.Path('valcea-clar/ops/venue_auto_promotion.json')
          receipt=json.loads(receipt_path.read_text(encoding='utf-8')) if receipt_path.is_file() else {}
          p=pathlib.Path(os.environ['GITHUB_STEP_SUMMARY'])
          promoted=len(receipt.get('promoted_new', [])) + len(receipt.get('promoted_existing_candidates', []))
          p.write_text(
              '# VÂLCEA CLAR — UNDE IEȘIM\n\n'
              f"- Ingest status: `{state['status']}`\n"
              f"- Localuri urmărite: **{state['summary']['venues']}**\n"
              f"- Frontier discovery: **{discovery.get('frontier_count', 0)}** localuri, **{discovery.get('website_candidates', 0)}** cu website\n"
              f"- Website-uri verificate în această rulare: **{discovery.get('websites_checked', 0)}**\n"
              f"- Identități oficiale noi: **{discovery.get('official_identity_matches', 0)}**\n"
              f"- Overlay-uri dinamice blocate ca ambigue/duplicate: **{len(overlay.get('blocked', []))}**\n"
              f"- Creatori candidați: **{state['summary']['creatorCandidates']}**\n"
              f"- Coliziuni canonice de identitate blocate: **{len(holds.get('holds', []))}**\n"
              f"- Localuri promovate sigur în această stare: **{promoted}**\n"
              f"- Coada editorială rămasă: **{reconciliation['summary']['review_queue']}**\n"
              f"- Validare ingest: **{report['status']}**\n",
              encoding='utf-8'
          )
          PY

      - name: Persist validated ingestion, discovery, promotion and live projection conflict-safe
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            valcea-clar/ingest/state/venues.json
            valcea-clar/ingest/state/source_health.json
            valcea-clar/ingest/state/venue_discovery_state.json
            valcea-clar/ingest/state/discovered_venues.json
            valcea-clar/ingest/state/discovered_sources.json
            valcea-clar/ingest/state/venue_discovery_frontier.json
            valcea-clar/web/unde-iesim.json
            valcea-clar/validation/latest_report.json
            valcea-clar/ops/venue_discovery_receipt.json
            valcea-clar/ops/venue_discovery_overlay_guard.json
            valcea-clar/ops/ingest_reconciliation.json
            valcea-clar/ops/ingest_review_queue.json
            valcea-clar/ops/venue_identity_collision_holds.json
            valcea-clar/ops/venue_auto_promotion.json
            valcea-clar/data/places.json
            valcea-clar/data/sources.json
            valcea-clar/web/data/places.json
            valcea-clar/web/data/meta.json
            valcea-clar/site/runtime/live-feed.json
          )
          rm -rf /tmp/valcea-clar-ingest-state
          mkdir -p /tmp/valcea-clar-ingest-state
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              mkdir -p "/tmp/valcea-clar-ingest-state/$(dirname "$file")"
              cp "$file" "/tmp/valcea-clar-ingest-state/$file"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              if [ -f "/tmp/valcea-clar-ingest-state/$file" ]; then
                mkdir -p "$(dirname "$file")"
                cp "/tmp/valcea-clar-ingest-state/$file" "$file"
                git add "$file"
              fi
            done
            if git diff --cached --quiet; then
              echo "No VÂLCEA CLAR venue state, discovery or public projection changes."
              exit 0
            fi
            git commit -m "Refresh VÂLCEA CLAR venue publication state"
            if git push origin HEAD:main; then exit 0; fi
            echo "main advanced; retrying ${attempt}/5"
            sleep $((attempt * 2))
          done
          echo "Unable to persist VÂLCEA CLAR venue state after five attempts." >&2
          exit 1
