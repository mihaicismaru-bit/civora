name: PARTENER.EU Interreg BSB Call Index Proof

on:
  workflow_dispatch:
  push:
    branches:
      - partener/cef-ft-history-restore-v1-20260901
    paths:
      - 'partener-eu/ingest/interreg_bsb_call_index_probe.py'
      - '.github/workflows/partener-interreg-bsb-call-index-proof.yml'

permissions:
  contents: read

env:
  PROOF_DIR: artifacts/partener-eu/interreg-bsb-call-index-proof

jobs:
  exact-head-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Compile bounded BSB probe
        run: python -m py_compile partener-eu/ingest/interreg_bsb_call_index_probe.py

      - name: Run fail-closed regression
        run: python partener-eu/ingest/interreg_bsb_call_index_probe.py --self-test

      - name: Acquire official BSB call index
        shell: bash
        run: |
          set -euo pipefail
          python partener-eu/ingest/interreg_bsb_call_index_probe.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --out-dir "${PROOF_DIR}"

      - name: Boundary readback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/partener-eu/interreg-bsb-call-index-proof/bsb-call-index-receipt.json')
          r = json.loads(p.read_text())
          assert r['market_intelligence_only'] is True
          assert r['discovered_call_facts'] == []
          for k in (
              'material_fact_use','open_call_authorized','closed_call_authorized',
              'deadline_authorized','budget_authorized','eligibility_authorized',
              'publish_authorized','distribution_authorized','call_alert_authorized',
              'canonical_corpus_mutation',
          ):
              assert r[k] is False, (k, r[k])
          assert r['publication_effect'] == 'NONE'
          print('source_health=', r['source_health'])
          print('failure_class=', r.get('failure_class'))
          print('semantic_fingerprint=', r.get('semantic_fingerprint'))
          PY

      - name: Upload BSB proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-eu-interreg-bsb-call-index-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_DIR }}
          if-no-files-found: error
          retention-days: 5

      - name: Require healthy official call index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/partener-eu/interreg-bsb-call-index-proof/bsb-call-index-receipt.json').read_text())
          if r['source_health'] != 'HEALTHY':
              raise SystemExit(f"BSB official call index degraded: {r.get('failure_class')} {r.get('error')}")
          assert r['status'] == 200
          assert r['semantic_fingerprint']
          print('BSB official call index runtime proof: HEALTHY / non-authorizing')
          PY
