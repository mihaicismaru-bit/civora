name: VÂLCEA CLAR Editorial Lifecycle

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "VÂLCEA CLAR Fact Kernel Builder"
      - "VÂLCEA CLAR Council Decision Articles"
    types: [completed]
    branches: [main]
  schedule:
    - cron: '13,28,43,58 * * * *'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/facts_registry.json'
      - 'valcea-clar/scripts/editorial_lifecycle_normalizer.py'
      - '.github/workflows/valcea-clar-editorial-lifecycle.yml'
  pull_request:
    paths:
      - 'valcea-clar/scripts/editorial_lifecycle_normalizer.py'
      - '.github/workflows/valcea-clar-editorial-lifecycle.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-editorial-lifecycle-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate lifecycle contract
        run: |
          python -m py_compile valcea-clar/scripts/editorial_lifecycle_normalizer.py
          python valcea-clar/scripts/editorial_lifecycle_normalizer.py --self-test

      - name: Normalize latest canonical facts conflict-safe
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'valcea-clar-lifecycle[bot]'
          git config user.email 'valcea-clar-lifecycle@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            # Always normalize the newest main, never copy an older whole-registry
            # snapshot over facts generated by another workflow.
            git fetch origin main
            git reset --hard origin/main
            python valcea-clar/scripts/editorial_lifecycle_normalizer.py --apply
            git add valcea-clar/editorial/facts_registry.json
            if git diff --cached --quiet; then
              echo 'Lifecycle state already current.'
              exit 0
            fi
            git commit -m 'Keep VÂLCEA CLAR durable explainers evergreen'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during lifecycle normalization; retrying latest canonical facts ${attempt}/5."
            sleep $((attempt * 2))
          done
          echo 'Could not persist lifecycle normalization.' >&2
          exit 1

      - name: Report lifecycle contract
        if: always()
        run: |
          echo 'Documentary explainers and adopted-HCL articles are evergreen publication objects.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Transient service/breaking alerts keep their explicit time-bounded lifecycle.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Every Fact Kernel or Council Article completion is followed by lifecycle reconciliation on the newest main.' >> "$GITHUB_STEP_SUMMARY"
