name: VÂLCEA CLAR Facebook Text Fallback

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VÂLCEA CLAR Social Publication Engine"]
    types: [completed]
  schedule:
    # Runs five minutes after the canonical social engine cadence.
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: write

concurrency:
  group: valcea-clar-facebook-text-fallback
  cancel-in-progress: false

jobs:
  publish-text-fallback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh canonical main state
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate Facebook text fallback
        run: |
          python -m py_compile valcea-clar/social/facebook_text_fallback.py
          python valcea-clar/social/facebook_text_fallback.py --self-test

      - name: Preview eligible missing-photo stories
        run: python valcea-clar/social/facebook_text_fallback.py

      - name: Publish text-link fallback
        id: apply
        continue-on-error: true
        env:
          VALCEA_FB_PAGE_ID: "1234360446430980"
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
          VALCEA_FB_TEXT_FALLBACK_MAX_PER_RUN: "2"
        run: python valcea-clar/social/facebook_text_fallback.py --apply

      - name: Persist fallback publication state without clobbering concurrent social state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/social/facebook_state.json /tmp/valcea-facebook-fallback-state.json
          git config user.name 'vâlcea-clar-facebook-text-fallback[bot]'
          git config user.email 'valcea-clar-facebook-text-fallback@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path

          remote_path = Path('valcea-clar/social/facebook_state.json')
          fallback_path = Path('/tmp/valcea-facebook-fallback-state.json')
          remote = json.loads(remote_path.read_text(encoding='utf-8')) if remote_path.is_file() else {'schema_version':'3.0','published':{}}
          local = json.loads(fallback_path.read_text(encoding='utf-8'))
          remote_pub = remote.setdefault('published', {})
          for key, value in (local.get('published') or {}).items():
              if isinstance(value, dict) and value.get('publication_product') == 'facebook-text-fallback-v1':
                  remote_pub[key] = value
          for key in ('last_text_fallback_attempt', 'last_text_fallback_identity'):
              if key in local:
                  remote[key] = local[key]
          remote_path.write_text(json.dumps(remote, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
            git add valcea-clar/social/facebook_state.json
            if git diff --cached --quiet; then
              echo 'Facebook fallback state already current.'
              exit 0
            fi
            git commit -m 'Persist VÂLCEA CLAR Facebook text fallback state'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not persist Facebook fallback state.' >&2
          exit 1

      - name: Surface publication failure after state persistence
        if: steps.apply.outcome == 'failure'
        run: exit 1
