name: VÂLCEA CLAR Telegram Editorial Preview

on:
  pull_request:
    paths:
      - "valcea-clar/social/telegram_editorial_v1.py"
      - "valcea-clar/social/social_common.py"
      - "valcea-clar/social/telegram_outbox.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editorial/publication_holds.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-telegram-editorial-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Self-test Telegram packaging
        run: python valcea-clar/social/telegram_editorial_v1.py --self-test
      - name: Build Telegram-native previews
        run: python valcea-clar/social/telegram_editorial_v1.py
      - name: Validate high-signal fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('valcea-clar/social/previews/telegram-v1/manifest.json').read_text(encoding='utf-8'))
          if value.get('execution_mode')!='PREVIEW_ONLY_NO_NETWORK_CALLS':
              raise SystemExit('Telegram preview network-call guard missing')
          products={p['story_id']:p for p in value.get('products',[]) if isinstance(p,dict)}
          held={'olanesti-bridge-monitor','derived-council-gambling-20260723'}
          if set(products) & held:
              raise SystemExit(f'editorial hold leaked into Telegram previews: {sorted(set(products) & held)}')
          for product in products.values():
              text=str(product.get('message') or '')
              if product.get('status')=='READY' and (not text or '#' in text or len(text)>1050):
                  raise SystemExit('Telegram READY product violates message contract')
              if product.get('verbatim_cross_platform_reuse_allowed') is not False:
                  raise SystemExit('Telegram cross-platform guard missing')
          print(f"Telegram editorial preview: PASS ({value['ready']} READY / {value['held']} HOLD)")
          PY
      - name: Upload Telegram editorial preview
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-telegram-editorial-v1-${{ github.run_id }}
          path: valcea-clar/social/previews/telegram-v1
          if-no-files-found: error
          retention-days: 14
