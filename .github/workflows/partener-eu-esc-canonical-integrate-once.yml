name: PARTENER.EU ESC Canonical Integrate Once

on:
  push:
    branches:
      - partener/cef-ft-history-restore-v1-20260901
    paths:
      - '.github/workflows/partener-eu-esc-canonical-integrate-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-canonical-eu-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: partener/cef-ft-history-restore-v1-20260901
          fetch-depth: 0

      - name: Patch canonical EU Direct workflow deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/partener-eu-eu-direct-programme-intelligence.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "      - 'partener-eu/ops/run_edf_programme_canonical.py'\n      - '.github/workflows/partener-eu-eu-direct-programme-intelligence.yml'",
                  "      - 'partener-eu/ops/run_edf_programme_canonical.py'\n      - 'partener-eu/ingest/eu_direct_esc_programme_intelligence_registry.json'\n      - 'partener-eu/ingest/eu_direct_esc_programme_intelligence.py'\n      - 'partener-eu/ingest/eu_direct_esc_programme_reconcile.py'\n      - 'partener-eu/ops/test_eu_direct_esc_programme_intelligence.py'\n      - 'partener-eu/ops/test_eu_direct_esc_programme_reconcile.py'\n      - 'partener-eu/ops/run_esc_programme_canonical.py'\n      - '.github/workflows/partener-eu-eu-direct-programme-intelligence.yml'",
              ),
              (
                  "          python -m json.tool partener-eu/ingest/eu_direct_edf_programme_intelligence_registry.json >/dev/null\n          python -m py_compile \\",
                  "          python -m json.tool partener-eu/ingest/eu_direct_edf_programme_intelligence_registry.json >/dev/null\n          python -m json.tool partener-eu/ingest/eu_direct_esc_programme_intelligence_registry.json >/dev/null\n          python -m py_compile \\",
              ),
              (
                  "            partener-eu/ingest/eu_direct_edf_programme_reconcile.py \\\n            partener-eu/ops/run_edf_programme_canonical.py \\\n            partener-eu/ops/test_erasmus_action_router.py \\",
                  "            partener-eu/ingest/eu_direct_edf_programme_reconcile.py \\\n            partener-eu/ops/run_edf_programme_canonical.py \\\n            partener-eu/ingest/eu_direct_esc_programme_intelligence.py \\\n            partener-eu/ingest/eu_direct_esc_programme_reconcile.py \\\n            partener-eu/ops/run_esc_programme_canonical.py \\\n            partener-eu/ops/test_eu_direct_esc_programme_intelligence.py \\\n            partener-eu/ops/test_eu_direct_esc_programme_reconcile.py \\\n            partener-eu/ops/test_erasmus_action_router.py \\",
              ),
              (
                  "          python partener-eu/ops/test_eu_direct_edf_programme_intelligence.py\n          python partener-eu/ops/test_eu_direct_edf_programme_reconcile.py -v",
                  "          python partener-eu/ops/test_eu_direct_edf_programme_intelligence.py\n          python partener-eu/ops/test_eu_direct_edf_programme_reconcile.py -v\n          python partener-eu/ops/test_eu_direct_esc_programme_intelligence.py -v\n          python partener-eu/ops/test_eu_direct_esc_programme_reconcile.py -v",
              ),
              (
                  "      - name: Upload replayable EU Direct programme evidence\n",
                  "      - name: Run canonical ESC programme intelligence with history and LKG\n        env:\n          GH_TOKEN: ${{ github.token }}\n          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}\n          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}\n          ESC_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-esc\n        run: python partener-eu/ops/run_esc_programme_canonical.py\n\n      - name: Upload replayable EU Direct programme evidence\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one canonical anchor, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          required = [
              "partener-eu/ops/run_esc_programme_canonical.py",
              "python partener-eu/ops/test_eu_direct_esc_programme_intelligence.py -v",
              "python partener-eu/ops/test_eu_direct_esc_programme_reconcile.py -v",
              "Run canonical ESC programme intelligence with history and LKG",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'missing required integrated ESC marker: {needle}')

          path.write_text(text, encoding='utf-8')
          PY

          python -m json.tool partener-eu/ingest/eu_direct_esc_programme_intelligence_registry.json >/dev/null
          python -m py_compile \
            partener-eu/ingest/eu_direct_esc_programme_intelligence.py \
            partener-eu/ingest/eu_direct_esc_programme_reconcile.py \
            partener-eu/ops/run_esc_programme_canonical.py \
            partener-eu/ops/test_eu_direct_esc_programme_intelligence.py \
            partener-eu/ops/test_eu_direct_esc_programme_reconcile.py
          PYTHONPATH=partener-eu/ingest:partener-eu/ops python partener-eu/ops/test_eu_direct_esc_programme_intelligence.py -v
          PYTHONPATH=partener-eu/ingest:partener-eu/ops python partener-eu/ops/test_eu_direct_esc_programme_reconcile.py -v
          git diff --check

      - name: Commit canonical integration and remove one-shot patcher
        shell: bash
        env:
          BRANCH: partener/cef-ft-history-restore-v1-20260901
        run: |
          set -euo pipefail
          rm .github/workflows/partener-eu-esc-canonical-integrate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/partener-eu-eu-direct-programme-intelligence.yml .github/workflows/partener-eu-esc-canonical-integrate-once.yml
          git diff --cached --check
          git commit -m 'Integrate ESC canonical runner into EU Direct workflow'
          git push origin "HEAD:${BRANCH}"
