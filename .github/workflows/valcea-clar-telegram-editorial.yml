name: VÂLCEA CLAR Telegram Editorial Compatibility Check

# Telegram is OUTBOX_ONLY. One QA contract owns native packaging/preview and
# durable outbox materialization; no separate preview workflow is required.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/social/telegram_editorial_v1.py'
      - 'valcea-clar/social/telegram_editorial_materialize.py'
      - 'valcea-clar/social/build_outbox_only_story_products.py'
      - 'valcea-clar/social/channel_registry.json'
      - 'valcea-clar/social/social_common.py'
      - 'valcea-clar/editorial/publication_holds.json'
      - '.github/workflows/valcea-clar-telegram-editorial.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-telegram-editorial-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Telegram native preview contract
        run: |
          python valcea-clar/social/telegram_editorial_v1.py --self-test
          python valcea-clar/social/telegram_editorial_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('valcea-clar/social/previews/telegram-v1/manifest.json').read_text(encoding='utf-8'))
          assert value.get('execution_mode') == 'PREVIEW_ONLY_NO_NETWORK_CALLS'
          products={p['story_id']:p for p in value.get('products',[]) if isinstance(p,dict)}
          held={'olanesti-bridge-monitor','derived-council-gambling-20260723'}
          assert not set(products) & held
          for product in products.values():
              text=str(product.get('message') or '')
              if product.get('status') == 'READY':
                  assert text and '#' not in text and len(text) <= 1050
              assert product.get('verbatim_cross_platform_reuse_allowed') is False
          print(f"Telegram preview: PASS ({value['ready']} READY / {value['held']} HOLD)")
          PY
      - name: Validate durable OUTBOX_ONLY materialization
        run: |
          python valcea-clar/social/telegram_editorial_materialize.py --self-test
          python valcea-clar/social/telegram_editorial_materialize.py
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('valcea-clar/social/telegram_state.json').read_text(encoding='utf-8'))
          outbox=json.loads(Path('valcea-clar/social/telegram_outbox.json').read_text(encoding='utf-8'))
          assert state.get('direct_publication_enabled') is False
          assert outbox.get('platform') == 'telegram'
          print(f"Telegram OUTBOX_ONLY: PASS ({len(outbox.get('items', []))} products)")
          PY
      - name: Upload inspectable QA product
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-telegram-compat-${{ github.run_id }}
          path: valcea-clar/social/previews/telegram-v1
          if-no-files-found: warn
          retention-days: 14
