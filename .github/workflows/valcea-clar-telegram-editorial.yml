name: VÂLCEA CLAR Telegram Editorial Compatibility Check

# Telegram is OUTBOX_ONLY in the canonical channel registry. The canonical
# Social Publication Engine materializes durable Telegram products. This is
# regression-only: no clock, no workflow-run cascade, no writes to main.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/social/telegram_editorial_v1.py'
      - 'valcea-clar/social/telegram_editorial_materialize.py'
      - 'valcea-clar/social/build_outbox_only_story_products.py'
      - 'valcea-clar/social/channel_registry.json'
      - '.github/workflows/valcea-clar-telegram-editorial.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-telegram-editorial-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Telegram editorial product
        run: |
          python valcea-clar/social/telegram_editorial_v1.py --self-test
          python valcea-clar/social/telegram_editorial_materialize.py --self-test
          python valcea-clar/social/telegram_editorial_materialize.py
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('valcea-clar/social/telegram_state.json').read_text(encoding='utf-8'))
          outbox=json.loads(Path('valcea-clar/social/telegram_outbox.json').read_text(encoding='utf-8'))
          assert state.get('direct_publication_enabled') is False
          assert outbox.get('platform') == 'telegram'
          print(f"Telegram OUTBOX_ONLY compatibility: PASS ({len(outbox.get('items', []))} products)")
          PY
