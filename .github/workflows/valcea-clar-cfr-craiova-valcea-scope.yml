name: VÂLCEA CLAR CFR Craiova Vâlcea Scope

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/cfr_craiova_valcea_scope_validator.py'
      - '.github/workflows/valcea-clar-cfr-craiova-valcea-scope.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/cfr_craiova_valcea_scope_validator.py'
      - '.github/workflows/valcea-clar-cfr-craiova-valcea-scope.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-cfr-craiova-valcea-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile CFR Craiova Vâlcea scope validator
        run: python -m py_compile valcea-clar/scripts/cfr_craiova_valcea_scope_validator.py
      - name: Run CFR Craiova Vâlcea scope fail-closed regressions
        run: python valcea-clar/scripts/cfr_craiova_valcea_scope_validator.py --self-test
