name: VÂLCEA CLAR Live HTTP Verification (manual diagnostic)

# Legacy narrow HTTP diagnostic retained only for explicit troubleshooting.
# Canonical autonomous external availability monitoring is owned by
# valcea-clar-public-health.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: valcea-clar-live-http-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6

      - name: Verify canonical public HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://valceaclar.ro'
          lead='/stiri/musiclover-festival-2026-dosar-complet-20260818/'
          tmp="${RUNNER_TEMP}/valcea-live-http"
          mkdir -p "$tmp"

          probe() {
            local label="$1"
            local path="$2"
            local marker="$3"
            local out="$tmp/${label}.html"
            local meta="$tmp/${label}.meta"
            http_code=$(curl --location --fail-with-body --silent --show-error --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 40 --output "$out" --write-out '%{http_code}' "$base$path")
            test "$http_code" = '200'
            grep -Fq "$marker" "$out"
            printf '%s\t%s\t%s\t%s\n' "$label" "$path" "$http_code" "$marker" > "$meta"
          }

          probe homepage '/' 'VÂLCEA CLAR'
          probe news '/stiri/' 'Știri'
          probe lead "$lead" 'Musiclover Festival 2026'

      - name: Publish diagnostic status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'valcea-clar/live-http-manual',
              description: '${{ job.status }}' === 'success' ? 'Manual HTTP diagnostic passed' : 'Manual HTTP diagnostic failed'
            })

      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-live-http-manual-${{ github.sha }}
          path: ${{ runner.temp }}/valcea-live-http
          if-no-files-found: warn
          retention-days: 7
