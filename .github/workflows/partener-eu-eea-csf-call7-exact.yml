name: PARTENER.EU EEA CSF Exact Calls 6-7 Contract CI

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eea_civil_society_fund_call6_exact.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call6_reconcile.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call6_exact.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call6_reconcile.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call7_exact.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call7_reconcile.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call7_exact.py'
      - 'partener-eu/ops/test_eea_civil_society_fund_call7_reconcile.py'
      - 'partener-eu/ops/run_eea_csf_exact_canonical.py'
      - '.github/workflows/partener-eu-eea-csf-call7-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eea-csf-contract-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile shared runner and Call 6-7 contracts
        run: |
          python -m py_compile \
            partener-eu/ingest/eea_civil_society_fund_call6_exact.py \
            partener-eu/ingest/eea_civil_society_fund_call6_reconcile.py \
            partener-eu/ops/test_eea_civil_society_fund_call6_exact.py \
            partener-eu/ops/test_eea_civil_society_fund_call6_reconcile.py \
            partener-eu/ingest/eea_civil_society_fund_call7_exact.py \
            partener-eu/ingest/eea_civil_society_fund_call7_reconcile.py \
            partener-eu/ops/test_eea_civil_society_fund_call7_exact.py \
            partener-eu/ops/test_eea_civil_society_fund_call7_reconcile.py \
            partener-eu/ops/run_eea_csf_exact_canonical.py

      - name: Validate fail-closed Call 6-7 semantics
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: |
          python partener-eu/ops/test_eea_civil_society_fund_call6_exact.py
          python partener-eu/ops/test_eea_civil_society_fund_call6_reconcile.py
          python partener-eu/ops/test_eea_civil_society_fund_call7_exact.py
          python partener-eu/ops/test_eea_civil_society_fund_call7_reconcile.py

      - name: Enforce acquisition ownership boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/partener-eu-eea-csf-call7-exact.yml').read_text(encoding='utf-8')
          forbidden=(
              'run_eea_csf_exact_canonical.py ' + '--call-id',
              'actions/' + 'upload-artifact',
              '--allow-' + 'legacy-history',
          )
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'FAIL standalone CSF contract CI regained live acquisition/history ownership: {marker}')
          print({'status':'PASS','lane':'CSF_CALL6_7_CONTRACT_CI_ONLY','live_acquisition_owner':'OFFICIAL_PROGRAMME_INTELLIGENCE'})
          PY
