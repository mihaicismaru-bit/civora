name: PARTENER.EU EEA Operator Watch CI

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eea_romania_operator_watch_registry.json'
      - 'partener-eu/ingest/eea_romania_operator_watch.py'
      - 'partener-eu/ingest/eea_romania_operator_watch_regression.py'
      - '.github/workflows/partener-eu-eea-operator-watch-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eea-operator-watch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout is exact event head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "FAIL checkout drift: expected $EXPECTED_SHA got $ACTUAL_SHA" >&2
            exit 2
          fi
          echo "Exact event head verified: $ACTUAL_SHA"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate operator-watch registry and adapter syntax
        run: |
          python -m json.tool partener-eu/ingest/eea_romania_operator_watch_registry.json >/dev/null
          python -m py_compile partener-eu/ingest/eea_romania_operator_watch.py
          python -m py_compile partener-eu/ingest/eea_romania_operator_watch_regression.py

      - name: Validate fail-closed operator-watch contract
        run: python partener-eu/ingest/eea_romania_operator_watch_regression.py

      - name: Capture bounded live official-operator evidence
        run: |
          python partener-eu/ingest/eea_romania_operator_watch.py \
            --output-dir /tmp/eea-romania-operator-watch \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Validate live evidence remains non-authorizing
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          p=Path('/tmp/eea-romania-operator-watch/handoff/eea_romania_operator_watch.json')
          registry_path=Path('partener-eu/ingest/eea_romania_operator_watch_registry.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          registry=json.loads(registry_path.read_text(encoding='utf-8'))
          expected_route_ids=[str(row.get('route_id') or '') for row in registry.get('routes') or []]
          actual_routes=d.get('routes') or []
          actual_route_ids=[str(row.get('route_id') or '') for row in actual_routes]
          if d.get('adapter_id') != 'EEA_ROMANIA_OPERATOR_WATCH_V1':
              print('FAIL adapter identity drift:', d.get('adapter_id'))
              sys.exit(2)
          if d.get('route_count') != len(expected_route_ids) or len(actual_routes) != len(expected_route_ids):
              print('FAIL registry/evidence route inventory drift:', len(expected_route_ids), d.get('route_count'), len(actual_routes))
              sys.exit(2)
          if actual_route_ids != expected_route_ids:
              print('FAIL registry/evidence route identity/order drift:', expected_route_ids, actual_route_ids)
              sys.exit(2)
          if d.get('healthy_route_count', 0) < 1:
              print('FAIL no official operator watch route was reachable')
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
              if d.get(key) is not False:
                  print('FAIL aggregate operator-watch evidence became authorizing:', key, d.get(key))
                  sys.exit(2)
          required={'exact_call_or_topic_identifier','current_official_exact_call_endpoint','explicit_current_official_open_status','semantic_reconciliation'}
          if not required.issubset(set(d.get('missing_for_open_confirmation') or [])):
              print('FAIL aggregate OPEN proof requirements incomplete')
              sys.exit(2)
          for row in actual_routes:
              for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
                  if row.get(key) is not False:
                      print('FAIL route became authorizing:', row.get('route_id'), key, row.get(key))
                      sys.exit(2)
              state=row.get('health_state')
              if state == 'HEALTHY':
                  if not re.fullmatch(r'[0-9a-f]{64}', str(row.get('raw_sha256') or '')):
                      print('FAIL healthy route lacks raw SHA-256:', row.get('route_id'))
                      sys.exit(2)
                  if len(row.get('candidates') or []) != row.get('candidate_count'):
                      print('FAIL candidate count mismatch:', row.get('route_id'))
                      sys.exit(2)
                  if any(c.get('candidate_observation_state') != 'DISCOVERY_ONLY' for c in row.get('candidates') or []):
                      print('FAIL discovered operator link escaped DISCOVERY_ONLY:', row.get('route_id'))
                      sys.exit(2)
              elif state == 'DEGRADED':
                  if row.get('lkg_required') is not True or row.get('candidate_count') != 0:
                      print('FAIL degraded route did not preserve LKG/fail-closed:', row.get('route_id'))
                      sys.exit(2)
              else:
                  print('FAIL unexpected route health state:', row.get('route_id'), state)
                  sys.exit(2)
          print(json.dumps({'health_state':d.get('health_state'),'healthy_routes':d.get('healthy_route_count'),'routes':d.get('route_count'),'open_call_authorized':False}, ensure_ascii=False))
          PY

      - name: Upload bounded EEA operator-watch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-eea-romania-operator-watch-live-evidence
          path: /tmp/eea-romania-operator-watch
          retention-days: 7
          if-no-files-found: warn
