name: VÂLCEA CLAR YouTube Editorial Compatibility Check

# YouTube is OUTBOX_ONLY in the canonical channel registry. The canonical
# Social Publication Engine materializes durable YouTube state. This workflow
# is regression-only: no schedule, no workflow-run cascade, no main writes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/social/youtube_editorial_v1.py'
      - 'valcea-clar/social/youtube_editorial_materialize.py'
      - 'valcea-clar/social/build_outbox_only_story_products.py'
      - 'valcea-clar/social/story_video_media.json'
      - 'valcea-clar/social/channel_registry.json'
      - '.github/workflows/valcea-clar-youtube-editorial.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-youtube-editorial-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deterministic thumbnail dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Validate YouTube editorial product
        run: |
          python -m json.tool valcea-clar/social/story_video_media.json >/dev/null
          python valcea-clar/social/youtube_editorial_v1.py --self-test
          python valcea-clar/social/youtube_editorial_materialize.py --self-test
          python valcea-clar/social/youtube_editorial_materialize.py
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('valcea-clar/social/youtube_state.json').read_text(encoding='utf-8'))
          outbox=json.loads(Path('valcea-clar/social/youtube_outbox.json').read_text(encoding='utf-8'))
          assert state.get('direct_publication_enabled') is False
          assert outbox.get('platform') == 'youtube'
          for item in outbox.get('items', []):
              if isinstance(item, dict) and item.get('status') != 'outbox_ready':
                  assert 'thumbnail_asset' not in item and 'video_source' not in item
          print(f"YouTube OUTBOX_ONLY compatibility: PASS ({len(outbox.get('items', []))} products)")
          PY
