name: VÂLCEA CLAR AJOFM Vâlcea Labor Market References

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/ajofm_valcea_labor_market_reference_adapter.py'
      - '.github/workflows/valcea-clar-ajofm-valcea-labor-market-references.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/ajofm_valcea_labor_market_reference_adapter.py'
      - '.github/workflows/valcea-clar-ajofm-valcea-labor-market-references.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-ajofm-valcea-labor-market-references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile AJOFM Vâlcea reference adapter
        run: python -m py_compile valcea-clar/scripts/ajofm_valcea_labor_market_reference_adapter.py
      - name: Run AJOFM Vâlcea fail-closed regressions
        run: python valcea-clar/scripts/ajofm_valcea_labor_market_reference_adapter.py --self-test
