name: LOCAL NEWS OS Reread Provider Outcome Binding

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/social/reread_provider_outcome_binding.py"
      - "local-news-os/social/reread_spend_reclaim_binding.py"
      - "local-news-os/social/reread_spend_reservation_recovery.py"
      - "local-news-os/social/reread_spend_reauthorization.py"
      - "local-news-os/social/authorization_sealed_harvest_receipt.py"
      - "local-news-os/social/fleet_metrics_authorization_seal_with_reread_spend.py"
      - "local-news-os/social/test_reread_provider_outcome_binding.py"
      - "local-news-os/social/test_reread_spend_reclaim_binding.py"
      - "local-news-os/social/test_reread_spend_reservation_recovery.py"
      - "local-news-os/social/test_reread_spend_reauthorization.py"
      - ".github/workflows/local-news-os-reread-provider-outcome-binding.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/social/reread_provider_outcome_binding.py"
      - "local-news-os/social/reread_spend_reclaim_binding.py"
      - "local-news-os/social/reread_spend_reservation_recovery.py"
      - "local-news-os/social/reread_spend_reauthorization.py"
      - "local-news-os/social/authorization_sealed_harvest_receipt.py"
      - "local-news-os/social/fleet_metrics_authorization_seal_with_reread_spend.py"
      - "local-news-os/social/test_reread_provider_outcome_binding.py"
      - "local-news-os/social/test_reread_spend_reclaim_binding.py"
      - "local-news-os/social/test_reread_spend_reservation_recovery.py"
      - "local-news-os/social/test_reread_spend_reauthorization.py"
      - ".github/workflows/local-news-os-reread-provider-outcome-binding.yml"

permissions:
  contents: read

concurrency:
  group: local-news-os-reread-provider-outcome-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile provider reread outcome boundary
        run: |
          python -m py_compile \
            local-news-os/social/reread_provider_outcome_binding.py \
            local-news-os/social/reread_spend_reclaim_binding.py \
            local-news-os/social/reread_spend_reservation_recovery.py \
            local-news-os/social/reread_spend_reauthorization.py \
            local-news-os/social/authorization_sealed_harvest_receipt.py \
            local-news-os/social/fleet_metrics_authorization_seal_with_reread_spend.py \
            local-news-os/social/test_reread_provider_outcome_binding.py

      - name: Run provider reread outcome acceptance
        working-directory: local-news-os/social
        shell: bash
        run: |
          set +e
          python test_reread_provider_outcome_binding.py > /tmp/reread-outcome.log 2>&1
          status=$?
          cat /tmp/reread-outcome.log
          if [ "$status" -ne 0 ]; then
            diagnostic="$(tail -n 24 /tmp/reread-outcome.log | tr '\n' '|' | sed 's/%/%25/g; s/\r/%0D/g; s/|/%0A/g')"
            echo "::error title=Reread provider outcome acceptance failed::$diagnostic"
            exit "$status"
          fi

      - name: Run reclaim provenance regression
        working-directory: local-news-os/social
        run: python test_reread_spend_reclaim_binding.py

      - name: Run RESERVED spend recovery regression
        working-directory: local-news-os/social
        run: python test_reread_spend_reservation_recovery.py

      - name: Run reread spend regression
        working-directory: local-news-os/social
        run: python test_reread_spend_reauthorization.py

      - name: Verify operational wrapper and zero-paid boundary
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'local-news-os/social')
          import authorization_sealed_harvest_receipt as receipt
          import fleet_metrics_authorization_seal_with_reread_spend  # noqa: F401
          import reread_provider_outcome_binding as outcome

          if receipt.transition_sealed.__module__ != outcome.__name__:
              raise SystemExit('operational harvest does not install reread provider outcome binding')
          guards = outcome.outcome_guards()
          required = {
              'reclaim_provenance_required_for_reread_outcome': True,
              'spent_handoff_required_before_outcome': True,
              'network_start_receipt_bound': True,
              'provider_outcome_bound_atomically_with_checkpoint_transition': True,
              'provider_network_call_performed_by_binding': False,
              'credential_values_read': False,
              'credential_values_persisted': False,
              'provider_payload_persisted': False,
              'publication_blocked_by_analytics': False,
              'zero_paid_dependency': True,
          }
          for key, expected in required.items():
              if guards.get(key) is not expected:
                  raise SystemExit(f'reread outcome guard mismatch: {key}={guards.get(key)!r}')
          print('REREAD_PROVIDER_OUTCOME_OPERATIONAL_GUARDS_PASS')
          PY
