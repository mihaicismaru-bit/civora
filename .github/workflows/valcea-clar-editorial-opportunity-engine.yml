name: VÂLCEA CLAR Editorial Opportunity Engine

# The queue is a deterministic projection of durable monitor/fact state. Rebuild
# it when those inputs change; a separate 30-minute polling loop adds no signal.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/editorial_product_policy.json'
      - 'valcea-clar/editorial/monitor_registry.json'
      - 'valcea-clar/editorial/monitor_state.json'
      - 'valcea-clar/editorial/infrastructure_monitor_registry.json'
      - 'valcea-clar/editorial/market_intelligence_registry.json'
      - 'valcea-clar/editorial/fact_kernel_registry.json'
      - 'valcea-clar/editorial/facts_registry.json'
      - 'valcea-clar/scripts/editorial_opportunity_engine.py'
      - 'valcea-clar/scripts/performing_arts_opportunity_adapter.py'
      - 'valcea-clar/scripts/prune_volatile_json_changes.py'
      - '.github/workflows/valcea-clar-editorial-opportunity-engine.yml'
  pull_request:
    paths:
      - 'valcea-clar/editorial/editorial_product_policy.json'
      - 'valcea-clar/scripts/editorial_opportunity_engine.py'
      - 'valcea-clar/scripts/performing_arts_opportunity_adapter.py'
      - 'valcea-clar/scripts/prune_volatile_json_changes.py'
      - '.github/workflows/valcea-clar-editorial-opportunity-engine.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-editorial-opportunity-engine-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate opportunity contracts
        run: |
          python -m py_compile \
            valcea-clar/scripts/editorial_opportunity_engine.py \
            valcea-clar/scripts/performing_arts_opportunity_adapter.py \
            valcea-clar/scripts/prune_volatile_json_changes.py
          python valcea-clar/scripts/editorial_opportunity_engine.py --self-test
          python valcea-clar/scripts/editorial_opportunity_engine.py --check
          python valcea-clar/scripts/performing_arts_opportunity_adapter.py --self-test
          python valcea-clar/scripts/prune_volatile_json_changes.py --self-test

      - name: Materialize ranked editorial opportunity queue
        run: |
          python valcea-clar/scripts/editorial_opportunity_engine.py
          python valcea-clar/scripts/performing_arts_opportunity_adapter.py
          python valcea-clar/scripts/performing_arts_opportunity_adapter.py --check

      - name: Persist opportunity queue conflict-safe
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          path='valcea-clar/editorial/editorial_opportunity_queue.json'
          if [ ! -s "$path" ]; then
            echo 'Opportunity queue was not materialized.' >&2
            exit 1
          fi
          cp "$path" /tmp/editorial-opportunity-queue.json
          git config user.name 'valcea-clar-opportunity-engine[bot]'
          git config user.email 'valcea-clar-opportunity-engine@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/editorial-opportunity-queue.json "$path"
            python valcea-clar/scripts/prune_volatile_json_changes.py \
              --ignore-key generated_at \
              --ignore-key detected_at \
              --ignore-key observed_at \
              "$path"
            git add "$path"
            if git diff --cached --quiet; then
              echo 'Editorial opportunity queue has no semantic change.'
              exit 0
            fi
            git commit -m 'Refresh VÂLCEA CLAR editorial opportunity queue'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Could not persist editorial opportunity queue after four attempts.' >&2
          exit 1
