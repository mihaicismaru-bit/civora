name: VÂLCEA CLAR Threads Editorial

# Direct Threads publishing remains a separate adapter for now, but it no longer
# polls or subscribes to another social workflow. A durable story publication
# event is the trigger; cron recovery is owned by the canonical social engine.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "valcea-clar/social/threads_editorial_v1.py"
      - "valcea-clar/social/threads_editorial_materialize.py"
      - "valcea-clar/social/threads_publish.py"
      - "valcea-clar/social/channels/threads.json"
      - "valcea-clar/social/threads_outbox.json"
      - "valcea-clar/social/threads_state.json"
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editorial/publication_holds.json"
      - ".github/workflows/valcea-clar-threads-editorial.yml"
  push:
    branches: [main]
    paths:
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editorial/publication_holds.json"
      - "valcea-clar/social/threads_editorial_v1.py"
      - "valcea-clar/social/threads_editorial_materialize.py"
      - "valcea-clar/social/threads_publish.py"
      - "valcea-clar/social/channels/threads.json"
      - ".github/workflows/valcea-clar-threads-editorial.yml"

permissions:
  contents: write

concurrency:
  group: valcea-clar-threads-editorial-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  materialize-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh canonical main for production runs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Compile and self-test Threads editorial and direct adapter
        run: |
          python -m py_compile \
            valcea-clar/social/threads_editorial_v1.py \
            valcea-clar/social/threads_editorial_materialize.py \
            valcea-clar/social/threads_publish.py
          python valcea-clar/social/threads_editorial_v1.py --self-test
          python valcea-clar/social/threads_editorial_materialize.py --self-test
          python valcea-clar/social/threads_publish.py --self-test

      - name: Materialize canonical Threads editorial outbox
        run: python valcea-clar/social/threads_editorial_materialize.py | tee /tmp/threads-editorial-materialize.json

      - name: Validate activation and publication guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          outbox=json.loads(Path('valcea-clar/social/threads_outbox.json').read_text(encoding='utf-8'))
          state=json.loads(Path('valcea-clar/social/threads_state.json').read_text(encoding='utf-8'))
          if outbox.get('platform')!='threads': raise SystemExit('Threads outbox identity mismatch')
          if state.get('direct_publication_enabled') is not True: raise SystemExit('Threads direct publication disabled')
          if state.get('direct_publication_blocker') is not None: raise SystemExit('Threads obsolete blocker remains')
          if not state.get('direct_activation_baseline_event_fingerprint'): raise SystemExit('Threads activation baseline missing')
          for item in outbox.get('items',[]):
              if not isinstance(item,dict): continue
              if item.get('status')=='outbox_ready':
                  if item.get('verbatim_cross_platform_reuse_allowed') is not False:
                      raise SystemExit('Threads cross-platform reuse guard missing')
                  if any(len(str(post))>470 for post in item.get('posts',[])):
                      raise SystemExit('Threads internal text budget exceeded')
          print('Threads activation/publication guards: PASS')
          PY

      - name: Preview Threads direct queue without network
        run: python valcea-clar/social/threads_publish.py | tee /tmp/threads-direct-preview.json

      - name: Verify Threads token belongs to @valceaclar
        id: threads_auth
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VALCEA_THREADS_ACCESS_TOKEN: ${{ secrets.VALCEA_THREADS_ACCESS_TOKEN }}
          VALCEA_THREADS_EXPECTED_USERNAME: valceaclar
        run: python valcea-clar/social/threads_publish.py --health-check | tee /tmp/threads-auth.json

      - name: Publish only new post-activation Threads stories
        id: threads_publish
        if: github.event_name != 'pull_request' && steps.threads_auth.outcome == 'success'
        continue-on-error: true
        env:
          VALCEA_THREADS_ACCESS_TOKEN: ${{ secrets.VALCEA_THREADS_ACCESS_TOKEN }}
          VALCEA_THREADS_EXPECTED_USERNAME: valceaclar
          VALCEA_THREADS_LIVE_ENABLED: "true"
          VALCEA_THREADS_MAX_PER_RUN: "1"
        run: python valcea-clar/social/threads_publish.py --apply | tee /tmp/threads-direct-apply.json

      - name: Record PR/no-auth direct state
        if: github.event_name == 'pull_request' || steps.threads_auth.outcome != 'success'
        run: cp /tmp/threads-direct-preview.json /tmp/threads-direct-apply.json

      - name: Persist Threads state conflict-safe
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/social/threads_outbox.json /tmp/threads-outbox.json
          cp valcea-clar/social/threads_state.json /tmp/threads-state.json
          git config user.name "valcea-clar-threads-engine[bot]"
          git config user.email "valcea-clar-threads-engine@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/threads-outbox.json valcea-clar/social/threads_outbox.json
            cp /tmp/threads-state.json valcea-clar/social/threads_state.json
            git add valcea-clar/social/threads_outbox.json valcea-clar/social/threads_state.json
            if git diff --cached --quiet; then
              echo "No Threads state changes to persist."
              exit 0
            fi
            git commit -m "Persist VÂLCEA CLAR Threads publication state"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload Threads direct audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-threads-editorial-${{ github.run_id }}
          path: |
            /tmp/threads-editorial-materialize.json
            /tmp/threads-direct-preview.json
            /tmp/threads-auth.json
            /tmp/threads-direct-apply.json
            valcea-clar/social/threads_outbox.json
            valcea-clar/social/threads_state.json
          if-no-files-found: warn
          retention-days: 14
