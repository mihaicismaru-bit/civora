name: VÂLCEA CLAR News Index Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/render_news_index.py'
      - 'valcea-clar/scripts/overlay_runtime_export.py'
      - '.github/workflows/valcea-clar-news-index-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-news-index-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate news-index renderer
        run: |
          python -m py_compile valcea-clar/scripts/render_news_index.py
          python valcea-clar/scripts/render_news_index.py --self-test
      - name: Rebuild /stiri/ from current canonical live feed
        run: python valcea-clar/scripts/render_news_index.py
      - name: Verify every live-feed story is indexed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('valcea-clar/site/runtime')
          feed=json.loads((root/'live-feed.json').read_text(encoding='utf-8'))
          page=(root/'stiri/index.html').read_text(encoding='utf-8')
          stories=[row for row in feed.get('stories',[]) if row.get('path')]
          missing=[row['path'] for row in stories if row['path'] not in page]
          assert not missing, f'/stiri/ missing live-feed routes: {missing}'
          assert 'data-nav-contract="valcea-clar-primary-v2"' in page
          print({'status':'PASS','stories':len(stories),'missing':missing})
          PY
      - name: Persist reconciled news index safely
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/site/runtime/stiri/index.html /tmp/valcea-stiri-index.html
          git config user.name 'vâlcea-clar-news-index[bot]'
          git config user.email 'valcea-clar-news-index@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p valcea-clar/site/runtime/stiri
            cp /tmp/valcea-stiri-index.html valcea-clar/site/runtime/stiri/index.html
            git add valcea-clar/site/runtime/stiri/index.html
            if git diff --cached --quiet; then
              echo 'News index already reconciled.'
              exit 0
            fi
            git commit -m 'Refresh VÂLCEA CLAR live news index'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not persist current news index without conflict.' >&2
          exit 1
