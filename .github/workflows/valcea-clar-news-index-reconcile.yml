name: VÂLCEA CLAR News Index Compatibility Check

# /stiri/ is built by render_news_index inside overlay_runtime_export.py. Keep
# this workflow only for local contract validation and manual recovery evidence.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/render_news_index.py'
      - 'valcea-clar/scripts/overlay_runtime_export.py'
      - '.github/workflows/valcea-clar-news-index-reconcile.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate news-index renderer
        run: |
          python -m py_compile valcea-clar/scripts/render_news_index.py
          python valcea-clar/scripts/render_news_index.py --self-test
      - name: Rebuild /stiri/ locally from canonical live feed
        run: python valcea-clar/scripts/render_news_index.py
      - name: Verify every live-feed story is indexed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('valcea-clar/site/runtime')
          feed=json.loads((root/'live-feed.json').read_text(encoding='utf-8'))
          page=(root/'stiri/index.html').read_text(encoding='utf-8')
          stories=[row for row in feed.get('stories',[]) if row.get('path')]
          missing=[row['path'] for row in stories if row['path'] not in page]
          assert not missing, f'/stiri/ missing live-feed routes: {missing}'
          assert 'data-nav-contract="valcea-clar-primary-v2"' in page
          print({'status':'PASS','stories':len(stories),'missing':missing})
          PY
      - name: Validate canonical ownership
        run: |
          grep -Fq 'render_news_index.build()' valcea-clar/scripts/overlay_runtime_export.py
          echo '/stiri/ is owned by overlay_runtime_export.py.'
