name: VÂLCEA CLAR LinkedIn Editorial Outbox

on:
  workflow_run:
    workflows: ["VÂLCEA CLAR Social Publication Engine"]
    types: [completed]
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "valcea-clar/social/linkedin_editorial_v1.py"
      - "valcea-clar/social/linkedin_editorial_materialize.py"
      - "valcea-clar/social/linkedin_outbox.json"
      - "valcea-clar/social/linkedin_state.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-linkedin-editorial.yml"

permissions:
  contents: write

concurrency:
  group: valcea-clar-linkedin-editorial-outbox
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh canonical main for non-PR runs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Self-test LinkedIn editorial product
        run: |
          python valcea-clar/social/linkedin_editorial_v1.py --self-test
          python valcea-clar/social/linkedin_editorial_materialize.py --self-test

      - name: Materialize canonical LinkedIn editorial outbox
        run: python valcea-clar/social/linkedin_editorial_materialize.py | tee /tmp/linkedin-editorial-materialize.json

      - name: Validate canonical LinkedIn fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          outbox=json.loads(Path('valcea-clar/social/linkedin_outbox.json').read_text(encoding='utf-8'))
          state=json.loads(Path('valcea-clar/social/linkedin_state.json').read_text(encoding='utf-8'))
          items={str(i.get('story_id')):i for i in outbox.get('items',[]) if isinstance(i,dict)}
          if outbox.get('platform')!='linkedin' or outbox.get('editorial_product_version')!='linkedin-editorial-v1.0':
              raise SystemExit('LinkedIn canonical editorial outbox version mismatch')
          if state.get('direct_publication_enabled') is not False:
              raise SystemExit('LinkedIn state falsely claims direct publication')
          lum=items.get('luminos-fest-zavoi-20260815')
          if not lum or lum.get('status')!='hold':
              raise SystemExit('Luminos LinkedIn professional relevance HOLD failed')
          gov=items.get('florile-govorei-20260816')
          if not gov or gov.get('status')!='hold':
              raise SystemExit('Florile Govorei LinkedIn HOLD failed')
          ola=items.get('olanesti-bridge-monitor')
          if not ola or ola.get('status')!='outbox_ready' or ola.get('format_family')!='document_explainer':
              raise SystemExit('Olănești LinkedIn canonical document explainer failed')
          text=ola.get('body','')
          for expected in ('44,37 mil. lei','Ralunic + Dimex-2000 Company','SMIS 334436','Limită de atribuire'):
              if expected not in text:
                  raise SystemExit(f'Olănești LinkedIn missing {expected}')
          if ola.get('hashtags_default') is not False or '#' in text:
              raise SystemExit('LinkedIn generic hashtag packaging detected')
          if ola.get('verbatim_cross_platform_reuse_allowed') is not False:
              raise SystemExit('LinkedIn cross-platform guard missing')
          print(f"LinkedIn canonical editorial outbox: PASS ({len(items)} products)")
          PY

      - name: Persist LinkedIn editorial state conflict-safe
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          rm -rf /tmp/linkedin-editorial-state
          mkdir -p /tmp/linkedin-editorial-state/valcea-clar/social
          cp valcea-clar/social/linkedin_outbox.json /tmp/linkedin-editorial-state/valcea-clar/social/linkedin_outbox.json
          cp valcea-clar/social/linkedin_state.json /tmp/linkedin-editorial-state/valcea-clar/social/linkedin_state.json
          git config user.name "valcea-clar-linkedin-engine[bot]"
          git config user.email "valcea-clar-linkedin-engine@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/linkedin-editorial-state/valcea-clar/social/linkedin_outbox.json valcea-clar/social/linkedin_outbox.json
            cp /tmp/linkedin-editorial-state/valcea-clar/social/linkedin_state.json valcea-clar/social/linkedin_state.json
            git add valcea-clar/social/linkedin_outbox.json valcea-clar/social/linkedin_state.json
            if git diff --cached --quiet; then
              echo "No LinkedIn editorial changes to persist."
              exit 0
            fi
            git commit -m "Persist VÂLCEA CLAR LinkedIn editorial outbox"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload LinkedIn editorial audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-linkedin-editorial-${{ github.run_id }}
          path: |
            /tmp/linkedin-editorial-materialize.json
            valcea-clar/social/linkedin_outbox.json
            valcea-clar/social/linkedin_state.json
          if-no-files-found: warn
          retention-days: 14
