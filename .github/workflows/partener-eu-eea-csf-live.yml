name: PARTENER.EU EEA Civil Society Live Evidence

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eea_romania_programming_intelligence.py'
      - 'partener-eu/ingest/eea_romania_programming_registry.json'
      - 'partener-eu/ops/test_eea_romania_programming_intelligence.py'
      - 'partener-eu/ingest/eea_civil_society_calls.py'
      - 'partener-eu/ingest/eea_civil_society_fetch.py'
      - 'partener-eu/ingest/eea_civil_society_reconcile.py'
      - 'partener-eu/p11/candidate_staging.py'
      - 'partener-eu/p11/eea_civil_society_stage.py'
      - 'partener-eu/p11/test_eea_civil_society_stage.py'
      - 'partener-eu/ops/test_eea_civil_society_calls.py'
      - 'partener-eu/ops/test_eea_civil_society_fetch.py'
      - 'partener-eu/ops/test_eea_civil_society_reconcile.py'
      - '.github/workflows/partener-eu-eea-csf-live.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: partener-eu-eea-csf-live
  cancel-in-progress: false

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regression — Romania 2021-2028 programme map stays pipeline-only
        run: python partener-eu/ops/test_eea_romania_programming_intelligence.py

      - name: Capture official Romania programme/operator programming evidence
        run: |
          mkdir -p /tmp/partener-eea-csf
          python partener-eu/ingest/eea_romania_programming_intelligence.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output /tmp/partener-eea-csf/romania-programming-evidence.json

      - name: Validate Romania programme/operator evidence remains non-authorizing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/partener-eea-csf/romania-programming-evidence.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          stats = data.get('stats') or {}
          if data.get('schema') != 'PARTENER_EU_EEA_ROMANIA_PROGRAMMING_EVIDENCE_V2':
              raise SystemExit('FAIL: unexpected Romania programming evidence schema')
          if data.get('observation_state') != 'PROGRAMMING_PIPELINE':
              raise SystemExit('FAIL: Romania programme map escaped PROGRAMMING_PIPELINE')
          if data.get('publication_effect') != 'NONE' or data.get('canonical_corpus_mutation') is not False:
              raise SystemExit('FAIL: Romania programme intelligence attempted publication/corpus mutation')
          top_false = ('material_fact_use', 'open_call_authorized', 'deadline_authorized', 'budget_authorized', 'eligibility_authorized', 'publish_authorized', 'distribution_authorized')
          if any(data.get(key) is not False for key in top_false):
              raise SystemExit('FAIL: Romania programme intelligence became authorizing')
          if data.get('requires_reconciliation') is not True:
              raise SystemExit('FAIL: Romania programming evidence lost reconciliation requirement')
          if stats.get('programme_records') != 9 or stats.get('operator_watch_seeds') != 9 or stats.get('fund_operator_watch_seeds') != 2 or stats.get('open_calls_authorized') != 0:
              raise SystemExit(f'FAIL: incomplete/unsafe Romania programme map: {stats}')
          source = data.get('source') or {}
          if source.get('http_status') != 200 or not source.get('raw_hash') or source.get('published_date') != '2026-05-12' or not data.get('fetched_at') or not data.get('parser_version') or not data.get('run_id'):
              raise SystemExit('FAIL: Romania programme evidence lost live provenance')
          required_missing = {'exact_call_identifier', 'official_current_open_status', 'exact_official_call_endpoint', 'semantic_reconciliation'}
          fund_rows = 0
          for row in data.get('records') or []:
              if row.get('schema') != 'PARTENER_EU_EEA_ROMANIA_PROGRAMMING_OBSERVATION_V2':
                  raise SystemExit(f"FAIL: unexpected programme observation schema: {row.get('programme_name')}")
              if row.get('observation_state') != 'PROGRAMMING_PIPELINE' or row.get('not_a_call') is not True:
                  raise SystemExit(f"FAIL: programme row became call evidence: {row.get('programme_name')}")
              row_false = ('material_fact_use', 'open_call_authorized', 'deadline_authorized', 'budget_authorized', 'eligibility_authorized', 'publish_authorized', 'distribution_authorized', 'canonical_corpus_mutation')
              if any(row.get(key) is not False for key in row_false):
                  raise SystemExit(f"FAIL: programme row became authorizing: {row.get('programme_name')}")
              if row.get('requires_reconciliation') is not True:
                  raise SystemExit(f"FAIL: programme row lost reconciliation requirement: {row.get('programme_name')}")
              if row.get('programme_grant_scope') != 'PROGRAMME_ALLOCATION_NOT_CALL_BUDGET':
                  raise SystemExit(f"FAIL: programme grant scope drift: {row.get('programme_name')}")
              if not row.get('programme_id') or not row.get('programme_operator') or not row.get('operator_watch_seed'):
                  raise SystemExit(f"FAIL: programme/operator watch identity missing: {row.get('programme_name')}")
              if row.get('fund_operator_watch_seed'):
                  fund_rows += 1
              if not required_missing.issubset(set(row.get('missing_to_confirm_call') or [])):
                  raise SystemExit(f"FAIL: exact-call proof requirements lost: {row.get('programme_name')}")
              if not row.get('raw_hash') or not row.get('semantic_fingerprint') or not row.get('fetched_at') or not row.get('parser_version') or not row.get('run_id') or row.get('source_published_date') != '2026-05-12':
                  raise SystemExit(f"FAIL: row provenance incomplete: {row.get('programme_name')}")
          if fund_rows != 2:
              raise SystemExit(f'FAIL: expected two Innovation Norway fund-operator watch routes, got {fund_rows}')
          print('PASS EEA Romania programme/operator intelligence:', stats)
          PY

      - name: Capture exact official call-page evidence
        run: |
          mkdir -p /tmp/partener-eea-csf
          python partener-eu/ingest/eea_civil_society_fetch.py \
            --minimum-calls 7 \
            --output /tmp/partener-eea-csf/live-evidence.json

      - name: Validate live evidence envelope fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/partener-eea-csf/live-evidence.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          stats = data['stats']
          if data.get('publication_effect') != 'NONE':
              raise SystemExit('FAIL: live source workflow must remain non-publishing')
          if data.get('publish_authorized') or data.get('material_fact_use'):
              raise SystemExit('FAIL: live source workflow cannot pre-authorize material facts')
          if stats['errors'] or stats['conflicts']:
              raise SystemExit(f"FAIL: live evidence errors/conflicts: {stats}")
          if stats['discovered_call_urls'] != stats['fetched_call_pages']:
              raise SystemExit(f"FAIL: not every discovered call was read back: {stats}")
          if stats['fetched_call_pages'] != stats['normalized_records']:
              raise SystemExit(f"FAIL: not every fetched call normalized: {stats}")
          if stats['unknown_evidence']:
              raise SystemExit(f"FAIL: exact current call pages contain unresolved status evidence: {stats}")
          if not data.get('records') or not all(row.get('authority_url_verified') for row in data['records']):
              raise SystemExit('FAIL: exact official readback evidence is incomplete')
          print('PASS live EEA CSF evidence:', stats)
          PY

      - name: Reconcile exact official call facts for canonical staging
        run: |
          python partener-eu/ingest/eea_civil_society_reconcile.py \
            /tmp/partener-eea-csf/live-evidence.json \
            --minimum-calls 7 \
            --output /tmp/partener-eea-csf/reconciliation-receipt.json

      - name: Validate reconciliation remains staging-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(Path('/tmp/partener-eea-csf/live-evidence.json').read_text(encoding='utf-8'))
          receipt = json.loads(Path('/tmp/partener-eea-csf/reconciliation-receipt.json').read_text(encoding='utf-8'))
          stats = receipt['stats']
          if receipt.get('publication_effect') != 'NONE' or receipt.get('publish_authorized'):
              raise SystemExit('FAIL: reconciliation cannot publish or authorize public projection')
          if not receipt.get('material_fact_use') or not receipt.get('ready_for_staging'):
              raise SystemExit('FAIL: reconciled exact-page facts must be staging-ready')
          if stats.get('errors') or stats.get('conflicts'):
              raise SystemExit(f"FAIL: reconciliation errors/conflicts: {stats}")
          if stats.get('reconciled_calls') != live['stats']['normalized_records']:
              raise SystemExit('FAIL: reconciliation must be all-or-nothing for the live batch')
          if not all(row.get('reconciliation_status') == 'PASS' for row in receipt.get('records', [])):
              raise SystemExit('FAIL: every reconciled call must PASS')
          if any(row.get('publish_authorized') for row in receipt.get('records', [])):
              raise SystemExit('FAIL: call records cannot bypass public projection quality gate')
          expected_missing = ['CANONICAL_STAGING_ADMISSION', 'PUBLIC_PROJECTION_QUALITY_GATE']
          if not all(row.get('missing_proofs') == expected_missing for row in receipt.get('records', [])):
              raise SystemExit('FAIL: downstream admission/public gates must remain explicit')
          print('PASS EEA CSF reconciliation receipt:', stats)
          PY

      - name: Admit reconciled calls to deterministic P11 staging
        run: |
          python partener-eu/p11/eea_civil_society_stage.py \
            /tmp/partener-eea-csf/reconciliation-receipt.json \
            --bundle partener-eu/p11/opportunity_bundle.json \
            --output /tmp/partener-eea-csf/staging-admission.json

      - name: Validate staging admission remains non-publishing and corpus-free
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reconciliation = json.loads(Path('/tmp/partener-eea-csf/reconciliation-receipt.json').read_text(encoding='utf-8'))
          admission = json.loads(Path('/tmp/partener-eea-csf/staging-admission.json').read_text(encoding='utf-8'))
          stats = admission['stats']
          if admission.get('schema') != 'PARTENER_EU_EEA_CSF_CANONICAL_STAGING_ADMISSION_V1':
              raise SystemExit('FAIL: unexpected staging admission schema')
          if admission.get('canonical_staging_admission') != 'PASS':
              raise SystemExit('FAIL: canonical staging admission did not PASS')
          if admission.get('publication_effect') != 'NONE' or admission.get('publish_authorized'):
              raise SystemExit('FAIL: staging admission cannot publish')
          if admission.get('canonical_corpus_mutation') is not False or admission.get('material_fact_action') != 'NONE':
              raise SystemExit('FAIL: staging admission cannot mutate canonical material facts')
          if admission.get('missing_proofs') != ['PUBLIC_PROJECTION_QUALITY_GATE']:
              raise SystemExit('FAIL: public projection gate must remain the only downstream proof')
          if stats.get('staging_admitted') != reconciliation['stats']['reconciled_calls']:
              raise SystemExit('FAIL: staging admission must be all-or-nothing for reconciled calls')
          if stats.get('ambiguous_review') or stats.get('errors') or stats.get('conflicts'):
              raise SystemExit(f"FAIL: unsafe staging admission stats: {stats}")
          if any(row.get('staging_admission') != 'PASS' for row in admission.get('records', [])):
              raise SystemExit('FAIL: every call must have PASS staging admission')
          if any(row.get('canonical_corpus_mutation') is not False or row.get('publish_authorized') for row in admission.get('records', [])):
              raise SystemExit('FAIL: call-level staging admission attempted corpus/public mutation')
          if any(row.get('missing_proofs') != ['PUBLIC_PROJECTION_QUALITY_GATE'] for row in admission.get('records', [])):
              raise SystemExit('FAIL: call-level public projection gate drift')
          print('PASS EEA CSF canonical staging admission:', stats)
          PY

      - name: Upload bounded live evidence, reconciliation and staging receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-eea-csf-live-evidence
          path: /tmp/partener-eea-csf/
          if-no-files-found: warn
          retention-days: 7
