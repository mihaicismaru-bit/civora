name: VÂLCEA CLAR INFOTRAFIC Breaking Candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/infotrafic_valcea_breaking_candidates.py'
      - 'valcea-clar/scripts/test_infotrafic_valcea_breaking_candidates.py'
      - 'valcea-clar/scripts/infotrafic_valcea_thread_state.py'
      - 'valcea-clar/scripts/infotrafic_valcea_event_normalizer.py'
      - '.github/workflows/valcea-clar-infotrafic-breaking-candidates.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/infotrafic_valcea_breaking_candidates.py'
      - 'valcea-clar/scripts/test_infotrafic_valcea_breaking_candidates.py'
      - 'valcea-clar/scripts/infotrafic_valcea_thread_state.py'
      - 'valcea-clar/scripts/infotrafic_valcea_event_normalizer.py'
      - '.github/workflows/valcea-clar-infotrafic-breaking-candidates.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-infotrafic-breaking-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile candidate generator
        run: python -m py_compile valcea-clar/scripts/infotrafic_valcea_breaking_candidates.py
      - name: Validate fail-closed breaking candidate generation
        run: python valcea-clar/scripts/test_infotrafic_valcea_breaking_candidates.py
