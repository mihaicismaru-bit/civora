name: PARTENER.EU Source Intelligence CI

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/people_policy_official_ingest.py'
      - 'partener-eu/ingest/people_policy_mipe_corpus_replay.py'
      - 'partener-eu/ingest/build_people_policy.py'
      - 'partener-eu/ingest/refine_people_policy.py'
      - 'partener-eu/ingest/state/people_policy_registry.json'
      - 'partener-eu/ingest/state/people_policy_source_registry.json'
      - 'partener-eu/ops/test_people_policy_source_intelligence.py'
      - 'partener-eu/ops/test_people_policy_mipe_corpus_replay.py'
      - 'partener-eu/ops/test_people_policy_actor_boundaries.py'
      - 'partener-eu/ops/test_people_policy_signal_history.py'
      - 'partener-eu/ops/test_people_policy_anre_source.py'
      - 'partener-eu/ops/test_people_policy_statement_cue_parity.py'
      - '.github/workflows/partener-eu-editorial-daily.yml'
      - '.github/workflows/partener-eu-mipe-source-replay.yml'
      - '.github/workflows/partener-eu-source-intelligence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-intelligence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile ingestion modules
        run: |
          python -m py_compile \
            partener-eu/ingest/people_policy_official_ingest.py \
            partener-eu/ingest/people_policy_mipe_corpus_replay.py \
            partener-eu/ingest/build_people_policy.py \
            partener-eu/ingest/refine_people_policy.py

      - name: Validate source intelligence contract
        run: python partener-eu/ops/test_people_policy_source_intelligence.py

      - name: Validate MIPE persistent corpus replay contract
        run: python partener-eu/ops/test_people_policy_mipe_corpus_replay.py

      - name: Validate decision-maker actor boundaries
        run: python partener-eu/ops/test_people_policy_actor_boundaries.py

      - name: Validate stable signal history deduplication
        run: python partener-eu/ops/test_people_policy_signal_history.py

      - name: Validate ANRE official source and tracked actor
        run: python partener-eu/ops/test_people_policy_anre_source.py

      - name: Validate collector and canonical statement-cue parity
        run: python partener-eu/ops/test_people_policy_statement_cue_parity.py
