name: PARTENER.EU CERV Programme Watch

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eu_direct_cerv_programme_watch.py'
      - 'partener-eu/ingest/eu_direct_cerv_ft_discovery.py'
      - 'partener-eu/ingest/eu_direct_cerv_ft_handoff.py'
      - 'partener-eu/ingest/eu_direct_cerv_ft_exact.py'
      - 'partener-eu/ingest/eu_direct_cerv_ft_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_cerv_programme_watch.py'
      - 'partener-eu/ops/test_eu_direct_cerv_ft_discovery.py'
      - 'partener-eu/ops/test_eu_direct_cerv_ft_handoff.py'
      - 'partener-eu/ops/test_eu_direct_cerv_ft_exact.py'
      - 'partener-eu/ops/test_eu_direct_cerv_ft_reconcile.py'
      - '.github/workflows/partener-eu-cerv-programme-watch.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cerv-programme-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded CERV programme and exact lanes
        run: |
          python -m py_compile \
            partener-eu/ingest/eu_direct_cerv_programme_watch.py \
            partener-eu/ingest/eu_direct_cerv_ft_discovery.py \
            partener-eu/ingest/eu_direct_cerv_ft_handoff.py \
            partener-eu/ingest/eu_direct_cerv_ft_exact.py \
            partener-eu/ingest/eu_direct_cerv_ft_reconcile.py \
            partener-eu/ops/test_eu_direct_cerv_programme_watch.py \
            partener-eu/ops/test_eu_direct_cerv_ft_discovery.py \
            partener-eu/ops/test_eu_direct_cerv_ft_handoff.py \
            partener-eu/ops/test_eu_direct_cerv_ft_exact.py \
            partener-eu/ops/test_eu_direct_cerv_ft_reconcile.py

      - name: Validate fail-closed CERV programme and exact semantics
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          python partener-eu/ops/test_eu_direct_cerv_programme_watch.py
          python partener-eu/ops/test_eu_direct_cerv_ft_discovery.py
          python partener-eu/ops/test_eu_direct_cerv_ft_handoff.py
          python partener-eu/ops/test_eu_direct_cerv_ft_exact.py
          python partener-eu/ops/test_eu_direct_cerv_ft_reconcile.py

      - name: Capture live official CERV programme and Romania NCP evidence
        run: |
          rm -rf /tmp/partener-eu-cerv-programme-watch
          rm -rf /tmp/partener-eu-cerv-history-scratch
          python partener-eu/ingest/eu_direct_cerv_programme_watch.py \
            --output-dir /tmp/partener-eu-cerv-programme-watch \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Discover bounded official structured CERV identities
        run: |
          python partener-eu/ingest/eu_direct_cerv_ft_discovery.py \
            --output-dir /tmp/partener-eu-cerv-programme-watch/ft-discovery \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --query-text 'CERV-2026' \
            --page-size 25

      - name: Restore previous successful same-branch exact CERV evidence
        id: previous_cerv
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-cerv-programme-watch
          HISTORY="$ROOT/history"
          SCRATCH=/tmp/partener-eu-cerv-history-scratch
          mkdir -p "$HISTORY/previous/cerv-exact" "$SCRATCH"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$HISTORY/artifacts.json"

          python - <<'PY' > /tmp/partener-cerv-history-candidates.tsv
          import json, os
          data=json.load(open('/tmp/partener-eu-cerv-programme-watch/history/artifacts.json', encoding='utf-8'))
          branch=(os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME') or '').strip()
          current=int(os.environ['GITHUB_RUN_ID'])
          rows=[]
          for artifact in data.get('artifacts') or []:
              name=str(artifact.get('name') or '')
              if not (name.startswith('partener-eu-cerv-programme-watch-') or name.startswith('partener-eu-ft-programme-coverage-')):
                  continue
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              run_id=int(run.get('id') or 0)
              if not run_id or run_id == current:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              rows.append((str(artifact.get('created_at') or ''), run_id, name))
          seen=set()
          for created, run_id, name in sorted(rows, reverse=True):
              key=(run_id,name)
              if key in seen:
                  continue
              seen.add(key)
              print(f'{run_id}\t{name}')
          PY

          FOUND=""
          FOUND_NAME=""
          REFERENCE=""
          DOWNLOADED=0
          while IFS=$'\t' read -r RUN_ID ARTIFACT_NAME; do
            [ -n "$RUN_ID" ] || continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
            [ "$CONCLUSION" = "success" ] || continue
            DEST="$SCRATCH/${RUN_ID}-$(printf '%s' "$ARTIFACT_NAME" | sha256sum | cut -c1-8)"
            mkdir -p "$DEST"
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$DEST"; then
              continue
            fi
            DOWNLOADED=$((DOWNLOADED + 1))
            PREVIOUS="$(find "$DEST" -type f \( -path '*/ft-exact/ft-cerv-exact-evidence.json' -o -path '*/cerv-exact/ft-cerv-exact-evidence.json' \) -not -path '*/history/*' -print -quit)"
            [ -n "$PREVIOUS" ] && [ -s "$PREVIOUS" ] || { [ "$DOWNLOADED" -lt 8 ] && continue || break; }
            if REFERENCE="$(PYTHONPATH=partener-eu/ingest python - "$PREVIOUS" <<'PY'
          import json, sys
          from eu_direct_cerv_ft_exact import validate_evidence
          previous=json.load(open(sys.argv[1], encoding='utf-8'))
          validate_evidence(previous)
          print(previous['reference'])
          PY
            )"; then
              cp "$PREVIOUS" "$HISTORY/previous/cerv-exact/ft-cerv-exact-evidence.json"
              FOUND="$RUN_ID"
              FOUND_NAME="$ARTIFACT_NAME"
              break
            fi
            [ "$DOWNLOADED" -lt 8 ] || break
          done < /tmp/partener-cerv-history-candidates.tsv

          if [ -n "$FOUND" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$FOUND" >> "$GITHUB_OUTPUT"
            echo "artifact_name=$FOUND_NAME" >> "$GITHUB_OUTPUT"
            echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve omission-safe CERV exact handoff state
        id: cerv_handoff
        shell: bash
        env:
          PREVIOUS_CERV_AVAILABLE: ${{ steps.previous_cerv.outputs.available }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-cerv-programme-watch
          ARGS=(
            --discovery "$ROOT/ft-discovery/ft-cerv-discovery.json"
            --output "$ROOT/ft-discovery/ft-cerv-handoff.json"
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )
          if [ "$PREVIOUS_CERV_AVAILABLE" = "true" ]; then
            ARGS+=(--previous "$ROOT/history/previous/cerv-exact/ft-cerv-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_cerv_ft_handoff.py "${ARGS[@]}"
          python - "$ROOT/ft-discovery/ft-cerv-handoff.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          state=json.load(open(sys.argv[1], encoding='utf-8'))
          print(f"mode={state['observation_state']}")
          print(f"exact_recheck_required={'true' if state['exact_recheck_required'] else 'false'}")
          print(f"target_reference={state['target_reference'] or ''}")
          print(f"previous_same_identity={'true' if state['previous_same_identity'] else 'false'}")
          PY

      - name: Execute bounded exact-current CERV handoff
        if: steps.cerv_handoff.outputs.exact_recheck_required == 'true'
        shell: bash
        env:
          CERV_HANDOFF_MODE: ${{ steps.cerv_handoff.outputs.mode }}
          CERV_TARGET_REFERENCE: ${{ steps.cerv_handoff.outputs.target_reference }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-cerv-programme-watch
          if [ "$CERV_HANDOFF_MODE" = "CURRENT_OFFICIAL_STRUCTURED_CERV_IDENTITY_EXACT_RECHECK_REQUIRED" ]; then
            python partener-eu/ingest/eu_direct_cerv_ft_exact.py \
              --discovery "$ROOT/ft-discovery/ft-cerv-discovery.json" \
              --programme-watch "$ROOT/cerv-programme-watch.json" \
              --output-dir "$ROOT/ft-exact" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            python partener-eu/ingest/eu_direct_cerv_ft_exact.py \
              --reference "$CERV_TARGET_REFERENCE" \
              --programme-watch "$ROOT/cerv-programme-watch.json" \
              --output-dir "$ROOT/ft-exact" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

      - name: Reconcile exact CERV against previous same-identity evidence
        if: steps.cerv_handoff.outputs.exact_recheck_required == 'true'
        shell: bash
        env:
          PREVIOUS_CERV_AVAILABLE: ${{ steps.previous_cerv.outputs.available }}
          PREVIOUS_CERV_SAME_IDENTITY: ${{ steps.cerv_handoff.outputs.previous_same_identity }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-cerv-programme-watch
          ARGS=(
            "$ROOT/ft-exact/ft-cerv-exact-evidence.json"
            --output "$ROOT/ft-exact/ft-cerv-reconciliation.json"
          )
          if [ "$PREVIOUS_CERV_AVAILABLE" = "true" ] && [ "$PREVIOUS_CERV_SAME_IDENTITY" = "true" ]; then
            ARGS+=(--previous "$ROOT/history/previous/cerv-exact/ft-cerv-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_cerv_ft_reconcile.py "${ARGS[@]}"

      - name: Enforce non-authorizing CERV live boundary
        env:
          PYTHONPATH: partener-eu/ingest
          PREVIOUS_CERV_AVAILABLE: ${{ steps.previous_cerv.outputs.available }}
          PREVIOUS_CERV_RUN_ID: ${{ steps.previous_cerv.outputs.run_id }}
          PREVIOUS_CERV_SAME_IDENTITY: ${{ steps.cerv_handoff.outputs.previous_same_identity }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          from eu_direct_cerv_programme_watch import validate_receipt as validate_programme
          from eu_direct_cerv_ft_discovery import validate_receipt as validate_discovery
          from eu_direct_cerv_ft_handoff import validate as validate_handoff
          from eu_direct_cerv_ft_exact import validate_evidence
          from eu_direct_cerv_ft_reconcile import validate_receipt as validate_reconciliation

          root = pathlib.Path('/tmp/partener-eu-cerv-programme-watch')
          programme = json.loads((root / 'cerv-programme-watch.json').read_text(encoding='utf-8'))
          discovery = json.loads((root / 'ft-discovery/ft-cerv-discovery.json').read_text(encoding='utf-8'))
          handoff = json.loads((root / 'ft-discovery/ft-cerv-handoff.json').read_text(encoding='utf-8'))
          validate_programme(programme)
          validate_discovery(discovery)
          validate_handoff(handoff)

          assert programme['source_health'] == 'HEALTHY'
          assert programme['market_intelligence_only'] is True
          assert programme['open_call_authorized'] is False
          assert programme['deadline_authorized'] is False
          assert programme['budget_authorized'] is False
          assert programme['eligibility_authorized'] is False
          assert programme['publish_authorized'] is False
          assert programme['distribution_authorized'] is False
          assert programme['call_alert_authorized'] is False
          assert programme['publication_effect'] == 'NONE'
          assert set(x['observation_state'] for x in programme['programming_observations']) <= {
              'PROGRAMMING', 'PLANNED', 'CONSULTATION', 'PROPOSAL'
          }

          assert discovery['market_intelligence_only'] is True
          assert discovery['bounded_discovery_absence_is_material_fact'] is False
          assert discovery['closure_inference_authorized'] is False
          assert discovery['open_call_authorized'] is False
          assert handoff['closure_inference_authorized'] is False
          assert handoff['open_call_authorized'] is False
          assert handoff['publish_authorized'] is False
          assert handoff['distribution_authorized'] is False
          assert handoff['call_alert_authorized'] is False

          exact_summary = None
          if handoff['exact_recheck_required']:
              exact = json.loads((root / 'ft-exact/ft-cerv-exact-evidence.json').read_text(encoding='utf-8'))
              reconciliation = json.loads((root / 'ft-exact/ft-cerv-reconciliation.json').read_text(encoding='utf-8'))
              previous = None
              if os.environ.get('PREVIOUS_CERV_AVAILABLE') == 'true' and os.environ.get('PREVIOUS_CERV_SAME_IDENTITY') == 'true':
                  previous = json.loads((root / 'history/previous/cerv-exact/ft-cerv-exact-evidence.json').read_text(encoding='utf-8'))
                  validate_evidence(previous)
              validate_evidence(exact)
              validate_reconciliation(reconciliation, current=exact, previous=previous)
              assert exact['reference'] == handoff['target_reference']
              assert exact['authority_url_verified'] is True
              assert exact['open_call_authorized'] is False
              assert exact['deadline_authorized'] is False
              assert exact['budget_authorized'] is False
              assert exact['eligibility_authorized'] is False
              if previous is None:
                  assert reconciliation['reconciliation_state'] == 'BASELINE_CAPTURED_NON_AUTHORIZING'
              else:
                  assert reconciliation['reconciliation_state'] in {
                      'NO_CHANGE', 'CERV_EXACT_TOPIC_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING'
                  }
              exact_summary = {
                  'reference': exact['reference'],
                  'candidate_state': exact['candidate_state'],
                  'status_label': exact['status_label'],
                  'authority_url_verified': exact['authority_url_verified'],
                  'reconciliation_state': reconciliation['reconciliation_state'],
                  'semantic_change_count': reconciliation['semantic_change_count'],
                  'previous_same_identity': handoff['previous_same_identity'],
                  'material_admission_ready_for_downstream_review': reconciliation['material_admission_ready_for_downstream_review'],
              }
          else:
              assert handoff['target_reference'] is None

          print({
              'programme_fit': programme['programme_fit_evidence']['facts']['fit_state'],
              'programming_states': [x['observation_state'] for x in programme['programming_observations']],
              'structured_candidate_count': len(discovery['candidates']),
              'selected_reference': discovery['selected_reference'],
              'handoff_state': handoff['observation_state'],
              'previous_cerv_available': os.environ.get('PREVIOUS_CERV_AVAILABLE') == 'true',
              'previous_cerv_run_id': os.environ.get('PREVIOUS_CERV_RUN_ID') or None,
              'exact': exact_summary,
              'open_call_authorized': handoff['open_call_authorized'],
          })
          PY

      - name: Enforce compact CERV history artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-cerv-programme-watch
          if find "$ROOT/history" -mindepth 1 -maxdepth 1 -type d -name 'download-*' -print -quit | grep -q .; then
            echo 'recursive CERV history download directory leaked into artifact root' >&2
            exit 1
          fi
          HISTORY_FILES="$(find "$ROOT/history" -type f | wc -l | tr -d ' ')"
          if [ "$HISTORY_FILES" -gt 2 ]; then
            echo "unexpected CERV history artifact growth: $HISTORY_FILES files" >&2
            find "$ROOT/history" -type f -print >&2
            exit 1
          fi

      - name: Upload exact-head CERV programme and exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-cerv-programme-watch-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-cerv-programme-watch
          if-no-files-found: error
          retention-days: 7
