name: One-shot social artifact cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-social-artifact-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-redundant-social-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete redundant VÂLCEA CLAR social media artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const prefix = "valcea-clar-social-engine-";
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            const targets = artifacts.filter(
              artifact => !artifact.expired && artifact.name.startsWith(prefix)
            );
            const bytes = targets.reduce(
              (total, artifact) => total + Number(artifact.size_in_bytes || 0),
              0
            );
            core.info(`Deleting ${targets.length} redundant social artifacts (${bytes} bytes).`);
            for (const artifact of targets) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
            await core.summary
              .addHeading("VÂLCEA CLAR social artifact cleanup")
              .addRaw(`Deleted artifacts: ${targets.length}\n\n`)
              .addRaw(`Freed bytes requested: ${bytes}\n\n`)
              .addRaw("Scope: valcea-clar-social-engine-* only. Workflow logs and repository state were not deleted.")
              .write();
