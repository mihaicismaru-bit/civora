name: VÂLCEA CLAR RAJDP Network Reference

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/rajdp_valcea_network_reference_adapter.py'
      - '.github/workflows/valcea-clar-rajdp-network-reference.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/rajdp_valcea_network_reference_adapter.py'
      - '.github/workflows/valcea-clar-rajdp-network-reference.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-rajdp-network-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile RAJDP Vâlcea network reference adapter
        run: python -m py_compile valcea-clar/scripts/rajdp_valcea_network_reference_adapter.py
      - name: Run RAJDP Vâlcea fail-closed regressions
        run: python valcea-clar/scripts/rajdp_valcea_network_reference_adapter.py --self-test
