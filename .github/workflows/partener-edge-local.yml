# PARTENER Edge Runner bounded trigger v4
name: PARTENER.EU Edge Local Acquisition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partener-edge-local.yml'
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job:
        description: Safe allowlisted PARTENER Edge job
        required: true
        default: health_check
        type: choice
        options:
          - health_check
          - mysmis_scout
          - mipe_refresh
          - afir_refresh
          - source_health
          - optimize_sources

permissions:
  contents: read

concurrency:
  group: partener-edge-local-acquisition
  cancel-in-progress: false

jobs:
  edge:
    if: >-
      ${{ github.repository == 'mihaicismaru-bit/civora' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'issues' &&
            (github.event.issue.title == '[PARTENER EDGE SELF TEST]' ||
             github.event.issue.title == '[PARTENER EDGE RUN MYSMIS_SCOUT]' ||
             github.event.issue.title == '[PARTENER EDGE RUN MIPE_REFRESH]' ||
             github.event.issue.title == '[PARTENER EDGE RUN AFIR_REFRESH]' ||
             github.event.issue.title == '[PARTENER EDGE RUN SOURCE_HEALTH]' ||
             github.event.issue.title == '[PARTENER EDGE RUN OPTIMIZE_SOURCES]'))) }}
    runs-on: [self-hosted, Windows, X64, partener-edge]
    timeout-minutes: 45
    steps:
      - name: Checkout canonical main without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact canonical checkout
        shell: powershell
        run: |
          $branch = git branch --show-current
          if ($branch -ne 'main') { throw "Expected main checkout, got $branch" }
          git status --short
          git rev-parse HEAD

      - name: Resolve allowlisted job
        id: job
        shell: powershell
        env:
          REQUESTED_JOB: ${{ inputs.job }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:REQUESTED_JOB) {
            $job = $env:REQUESTED_JOB
          } elseif ($env:EVENT_NAME -eq 'issues') {
            $map = @{
              '[PARTENER EDGE SELF TEST]' = 'health_check'
              '[PARTENER EDGE RUN MYSMIS_SCOUT]' = 'mysmis_scout'
              '[PARTENER EDGE RUN MIPE_REFRESH]' = 'mipe_refresh'
              '[PARTENER EDGE RUN AFIR_REFRESH]' = 'afir_refresh'
              '[PARTENER EDGE RUN SOURCE_HEALTH]' = 'source_health'
              '[PARTENER EDGE RUN OPTIMIZE_SOURCES]' = 'optimize_sources'
            }
            if (-not $map.ContainsKey($env:ISSUE_TITLE)) { throw "Unsupported Edge issue trigger" }
            $job = $map[$env:ISSUE_TITLE]
          } else {
            $job = 'health_check'
          }
          "job=$job" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Edge job: $job"

      - name: Run allowlisted PARTENER Edge job
        shell: powershell
        env:
          PARTENER_EDGE_JOB: ${{ steps.job.outputs.job }}
        run: |
          if (-not $env:PARTENER_EDGE_HOME) { throw 'PARTENER_EDGE_HOME is not configured on runner' }
          if (-not $env:PARTENER_EDGE_PYTHON) { throw 'PARTENER_EDGE_PYTHON is not configured on runner' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'partener-edge-out'
          & $env:PARTENER_EDGE_PYTHON (Join-Path $env:PARTENER_EDGE_HOME 'dispatcher\edge_job.py') `
            --job $env:PARTENER_EDGE_JOB `
            --workspace $env:GITHUB_WORKSPACE `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Edge job failed with exit code $LASTEXITCODE" }

      - name: Upload immutable local evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-edge-${{ steps.job.outputs.job }}-${{ github.run_id }}
          path: partener-edge-out/**
          if-no-files-found: warn
          retention-days: 14
