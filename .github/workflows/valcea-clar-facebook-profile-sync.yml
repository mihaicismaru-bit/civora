name: VÂLCEA CLAR Facebook Profile Sync

# External Page-profile mutation is an explicit maintenance action, never an
# automatic consequence of a repository push.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valcea-clar-facebook-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Refresh canonical main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Validate profile synchronizer
        run: |
          python -m py_compile valcea-clar/social/facebook_profile_sync.py
          python valcea-clar/social/facebook_profile_sync.py --self-test

      - name: Synchronize canonical newsroom fields
        env:
          VALCEA_FB_PAGE_ID: '1234360446430980'
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
          VALCEA_FB_PROFILE_LIVE_ENABLED: 'true'
        run: python valcea-clar/social/facebook_profile_sync.py --apply | tee /tmp/facebook-profile-sync.json

      - name: Persist redacted profile sync state conflict-safe
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/social/facebook_profile_state.json /tmp/facebook_profile_state.json
          git config user.name 'valcea-clar-facebook-profile[bot]'
          git config user.email 'valcea-clar-facebook-profile@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/facebook_profile_state.json valcea-clar/social/facebook_profile_state.json
            git add valcea-clar/social/facebook_profile_state.json
            if git diff --cached --quiet; then
              echo 'Facebook profile sync state already current.'
              exit 0
            fi
            git commit -m 'Persist VÂLCEA CLAR Facebook profile sync state'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Audit profile synchronization
        if: always()
        run: |
          echo '## VÂLCEA CLAR Facebook Profile Sync' >> "$GITHUB_STEP_SUMMARY"
          echo 'Explicit-only maintenance: bio/about, website and editorial email may change; phone, address, Page name, category and cover stay fail-closed.' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/facebook-profile-sync.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
