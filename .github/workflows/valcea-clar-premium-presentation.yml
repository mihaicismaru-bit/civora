name: VÂLCEA CLAR Premium Presentation Compatibility Check

# Compatibility validator only.
# Reader-facing presentation is now part of overlay_runtime_export.py, the
# canonical final runtime/export boundary. This workflow must not run on a clock
# or mutate main.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/site/navigation.json'
      - 'valcea-clar/site/legal/legal_pages.json'
      - 'valcea-clar/scripts/public_ux_*.py'
      - 'valcea-clar/scripts/build_sites_export.py'
      - 'valcea-clar/scripts/overlay_runtime_export.py'
      - '.github/workflows/valcea-clar-premium-presentation.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-premium-presentation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate public UX compatibility modules
        run: |
          python -m py_compile \
            valcea-clar/scripts/public_ux_reset.py \
            valcea-clar/scripts/public_ux_currentness.py \
            valcea-clar/scripts/public_ux_story_integrity.py \
            valcea-clar/scripts/public_ux_manifest.py \
            valcea-clar/scripts/public_ux_legal.py \
            valcea-clar/scripts/public_ux_export_contract.py \
            valcea-clar/scripts/overlay_runtime_export.py
          python valcea-clar/scripts/public_ux_currentness.py --self-test
          python valcea-clar/scripts/public_ux_story_integrity.py --self-test

      - name: Verify canonical export owns reader presentation
        run: |
          set -euo pipefail
          python valcea-clar/scripts/build_public_data.py
          python valcea-clar/scripts/repair_continuous_frontpage.py
          python valcea-clar/scripts/build_sites_export.py
          python valcea-clar/scripts/overlay_runtime_export.py
          python valcea-clar/scripts/public_ux_export_contract.py
          python valcea-clar/scripts/smoke_web.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('valcea-clar')
          runtime=root/'site/runtime'
          manifest=json.loads((root/'dist/chatgpt-sites/manifest.json').read_text(encoding='utf-8'))
          assert manifest['target']['reader_presentation_owner'] == 'overlay_runtime_export'
          for page in ('index.html','stiri/index.html','despre/index.html','termeni/index.html','confidentialitate/index.html'):
              text=(runtime/page).read_text(encoding='utf-8')
              assert 'data-nav-contract="valcea-clar-primary-v2"' in text, page
          print('VÂLCEA CLAR premium compatibility: PASS')
          PY

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-premium-compat-${{ github.run_id }}
          path: |
            valcea-clar/site/public_ux_state.json
            valcea-clar/dist/chatgpt-sites/manifest.json
          if-no-files-found: warn
          retention-days: 7
