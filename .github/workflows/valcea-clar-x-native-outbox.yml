name: VÂLCEA CLAR X Native Outbox

on:
  pull_request:
    paths:
      - "local-news-os/social/channel_config.schema.json"
      - "valcea-clar/social/channels/x.json"
      - "valcea-clar/social/social_network_doctrine.json"
      - "valcea-clar/social/build_outbox_only_story_products.py"
      - "valcea-clar/social/x_outbox.json"
      - "valcea-clar/social/x_state.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-x-native-outbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate X CHANNEL_CONFIG
        run: python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/x.json --instance-root valcea-clar
      - name: Validate platform-native doctrine
        run: python valcea-clar/social/validate_social_doctrine.py
      - name: Directly self-test canonical X premium builder
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          social = Path('valcea-clar/social').resolve()
          sys.path.insert(0, str(social))
          path = social / 'build_outbox_only_story_products.py'
          spec = importlib.util.spec_from_file_location('vc_outbox_builder', path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load canonical outbox builder')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          thin = {
              'id': 'thin-fixture',
              'headline': 'Eveniment local',
              'dek': '15–16 august',
              'paragraphs': [],
              'material_fact_gate': 'PASS_DATE_ONLY',
          }
          held = mod.x_product(thin)
          if held.get('status') != 'hold' or held.get('hold_reason') != 'x_interest_gate_thin_title_date_source_only':
              raise SystemExit(f'canonical X thin-story gate failed: {held}')
          if held.get('direct_publication_enabled') is not False:
              raise SystemExit('canonical X HOLD falsely enables publication')

          olanesti = {
              'id': 'olanesti-fixture',
              'section': 'INVESTIGAȚII',
              'headline': 'Pod peste Olănești',
              'dek': 'Proiect SMIS 334436 pentru zona Omniasig.',
              'paragraphs': [
                  'Documentația include un pod nou exclusiv pietonal și ciclist în zona Omniasig.',
                  'Valoarea totală este 44.373.317,87 lei cu TVA. Contractul principal a fost atribuit asocierii Ralunic SRL — Dimex-2000 Company SRL, cu subcontractanți, la 29.167.613,30 lei fără TVA.',
              ],
              'material_fact_gate': 'PASS_MATERIAL_FACTS',
          }
          product = mod.x_product(olanesti)
          if product.get('status') != 'outbox_ready':
              raise SystemExit(f'canonical X Olănești fixture not ready: {product}')
          posts = product.get('posts') or []
          if not posts or posts[0] != '44,37 mil. lei pentru proiectul de pe Olănești.':
              raise SystemExit(f'canonical X key-number hook drifted: {posts}')
          if 'Ralunic + Dimex-2000 Company' not in ' '.join(posts):
              raise SystemExit('canonical X contractor normalization failed')
          if not 1 <= len(posts) <= 4 or any(len(str(post)) > 260 for post in posts):
              raise SystemExit('canonical X bounded-thread contract failed')
          if any('#' in str(post) for post in posts):
              raise SystemExit('canonical X default hashtag block detected')
          if product.get('verbatim_cross_platform_reuse_allowed') is not False:
              raise SystemExit('canonical X cross-platform reuse guard missing')
          if product.get('direct_publication_enabled') is not False:
              raise SystemExit('canonical X falsely enables paid API publication')
          print('Canonical X premium builder self-test: PASS')
          PY
      - name: Materialize outbox-only sister publications
        run: python valcea-clar/social/build_outbox_only_story_products.py
      - name: Validate X product contract and editorial fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('valcea-clar/social/x_outbox.json').read_text(encoding='utf-8'))
          state=json.loads(Path('valcea-clar/social/x_state.json').read_text(encoding='utf-8'))
          threads=json.loads(Path('valcea-clar/social/threads_outbox.json').read_text(encoding='utf-8'))
          config=json.loads(Path('valcea-clar/social/channels/x.json').read_text(encoding='utf-8'))
          if x.get('platform')!='x' or x.get('publication_model')!='continuous_story_first':
              raise SystemExit('X outbox identity/model mismatch')
          if state.get('platform')!='x' or state.get('publication_model')!='continuous_story_first':
              raise SystemExit('X state identity/model mismatch')
          if config.get('status')!='outbox_only' or config.get('zero_paid_dependency') is not True:
              raise SystemExit('X must stay outbox-only under zero-paid policy')
          if not str(config.get('credentials_ref','')).startswith('none:'):
              raise SystemExit('X must not claim credentials')
          if state.get('direct_publication_enabled') is not False:
              raise SystemExit('X state falsely claims direct publication')
          if state.get('blocker')!='x_api_pay_per_use_conflicts_zero_paid_dependency':
              raise SystemExit('X pay-per-use blocker is not explicit')
          thread_by={str(i.get('story_id')):i for i in threads.get('items',[]) if isinstance(i,dict)}
          items={str(i.get('story_id')):i for i in x.get('items',[]) if isinstance(i,dict)}
          for item in items.values():
              if item.get('publication_mode')!='durable_outbox_only':
                  raise SystemExit('X item claims direct publication')
              if item.get('verbatim_cross_platform_reuse_allowed') is not False:
                  raise SystemExit('X item permits verbatim cross-platform reuse')
              if item.get('fake_urgency_forbidden') is not True or item.get('engagement_bait_forbidden') is not True:
                  raise SystemExit('X editorial safety guards missing')
              posts=item.get('posts')
              if not isinstance(posts,list) or not 1 <= len(posts) <= 4:
                  raise SystemExit('X native thread must contain 1..4 posts')
              if any(len(str(post))>260 for post in posts):
                  raise SystemExit('X internal post budget exceeded')
              sibling=thread_by.get(str(item.get('story_id')))
              if sibling and posts == sibling.get('thread'):
                  raise SystemExit('X product is a verbatim Threads cross-post')
              if item.get('direct_publication_enabled') is not False:
                  raise SystemExit('X product falsely enables direct publication')

          gov=items.get('florile-govorei-20260816')
          if not gov or gov.get('status')!='hold' or gov.get('hold_reason')!='x_interest_gate_thin_title_date_source_only':
              raise SystemExit('Florile Govorei X interest-gate fixture failed')
          lum=items.get('luminos-fest-zavoi-20260815')
          if not lum or lum.get('status')!='outbox_ready' or lum.get('posts',[None])[0] != 'Azi în Zăvoi: intrarea este liberă la Luminos Fest.':
              raise SystemExit('Luminos X local-utility fixture failed')
          ola=items.get('olanesti-bridge-monitor')
          if not ola or ola.get('status')!='outbox_ready' or ola.get('hook_family')!='key_number':
              raise SystemExit('Olănești X key-number fixture failed')
          if ola.get('posts',[None])[0] != '44,37 mil. lei pentru proiectul de pe Olănești.':
              raise SystemExit('Olănești X hook is not concise enough')
          if 'Ralunic + Dimex-2000 Company' not in ' '.join(ola.get('posts',[])):
              raise SystemExit('Olănești X contract actor missing')
          if 'Urmărim executanții' in ' '.join(ola.get('posts',[])):
              raise SystemExit('Olănești X still exposes newsroom-process wording')
          print(f"X native outbox: PASS ({len(items)} story products; thin-story gate + premium fixtures verified)")
          PY
