name: PARTENER.EU Source Registry CI

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/source_registry.json'
      - 'partener-eu/ingest/source_registry_probe.py'
      - 'partener-eu/ingest/data_plane_contract.json'
      - 'partener-eu/ingest/funding_tenders_api.py'
      - 'partener-eu/ingest/funding_tenders_fetch.py'
      - 'partener-eu/ingest/eea_civil_society_calls.py'
      - 'partener-eu/ingest/eea_civil_society_fetch.py'
      - 'partener-eu/ingest/eea_civil_society_reconcile.py'
      - 'partener-eu/ingest/regiocentru_actions_fetch.py'
      - 'partener-eu/ingest/regiocentru_actions_source.json'
      - 'partener-eu/ingest/interreg_territorial_fit_registry.json'
      - 'partener-eu/ingest/interreg_territorial_fit.py'
      - 'partener-eu/ingest/interreg_applicant_partner_fit_registry.json'
      - 'partener-eu/ingest/interreg_applicant_partner_fit.py'
      - 'partener-eu/ingest/interreg_programming_pipeline_registry.json'
      - 'partener-eu/ingest/interreg_programming_pipeline.py'
      - 'partener-eu/ingest/interreg_programming_lkg_history.py'
      - 'partener-eu/p11/candidate_staging.py'
      - 'partener-eu/p11/eea_civil_society_stage.py'
      - 'partener-eu/p11/test_eea_civil_society_stage.py'
      - 'partener-eu/ops/sources.json'
      - 'partener-eu/ops/p10_validate.py'
      - 'partener-eu/ops/test_p10_policy_regression.py'
      - 'partener-eu/ops/test_source_registry_low_info.py'
      - 'partener-eu/ops/test_source_registry_current_hosts.py'
      - 'partener-eu/ops/test_source_registry_alias_fallback.py'
      - 'partener-eu/ops/test_source_registry_external_expansion.py'
      - 'partener-eu/ops/test_interreg_rohu_pipeline_split.py'
      - 'partener-eu/ops/test_interreg_territorial_fit.py'
      - 'partener-eu/ops/test_interreg_applicant_partner_fit.py'
      - 'partener-eu/ops/test_interreg_programming_pipeline.py'
      - 'partener-eu/ops/test_interreg_programming_lkg_history.py'
      - 'partener-eu/ops/test_funding_tenders_structured_adapter.py'
      - 'partener-eu/ops/test_funding_tenders_live_fetch.py'
      - 'partener-eu/ops/test_eea_civil_society_calls.py'
      - 'partener-eu/ops/test_eea_civil_society_fetch.py'
      - 'partener-eu/ops/test_eea_civil_society_reconcile.py'
      - 'partener-eu/ops/test_regiocentru_actions_fetch.py'
      - '.github/workflows/partener-eu-source-registry-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout is exact event head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "FAIL checkout drift: expected $EXPECTED_SHA got $ACTUAL_SHA" >&2
            exit 2
          fi
          echo "Exact event head verified: $ACTUAL_SHA"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate registry JSON and adapter syntax
        run: |
          python -m json.tool partener-eu/ingest/source_registry.json >/dev/null
          python -m json.tool partener-eu/ingest/data_plane_contract.json >/dev/null
          python -m json.tool partener-eu/ingest/regiocentru_actions_source.json >/dev/null
          python -m json.tool partener-eu/ingest/interreg_territorial_fit_registry.json >/dev/null
          python -m json.tool partener-eu/ingest/interreg_applicant_partner_fit_registry.json >/dev/null
          python -m json.tool partener-eu/ingest/interreg_programming_pipeline_registry.json >/dev/null
          python -m json.tool partener-eu/ops/sources.json >/dev/null
          python -m py_compile partener-eu/ingest/source_registry_probe.py
          python -m py_compile partener-eu/ingest/funding_tenders_api.py
          python -m py_compile partener-eu/ingest/funding_tenders_fetch.py
          python -m py_compile partener-eu/ingest/eea_civil_society_calls.py
          python -m py_compile partener-eu/ingest/eea_civil_society_fetch.py
          python -m py_compile partener-eu/ingest/eea_civil_society_reconcile.py
          python -m py_compile partener-eu/ingest/regiocentru_actions_fetch.py
          python -m py_compile partener-eu/ingest/interreg_territorial_fit.py
          python -m py_compile partener-eu/ingest/interreg_applicant_partner_fit.py
          python -m py_compile partener-eu/ingest/interreg_programming_pipeline.py
          python -m py_compile partener-eu/ingest/interreg_programming_lkg_history.py
          python -m py_compile partener-eu/p11/candidate_staging.py
          python -m py_compile partener-eu/p11/eea_civil_society_stage.py
          python -m py_compile partener-eu/p11/test_eea_civil_society_stage.py
          python -m py_compile partener-eu/ops/p10_validate.py
          python -m py_compile partener-eu/ops/test_p10_policy_regression.py
          python -m py_compile partener-eu/ops/test_source_registry_external_expansion.py
          python -m py_compile partener-eu/ops/test_interreg_rohu_pipeline_split.py
          python -m py_compile partener-eu/ops/test_interreg_territorial_fit.py
          python -m py_compile partener-eu/ops/test_interreg_applicant_partner_fit.py
          python -m py_compile partener-eu/ops/test_interreg_programming_pipeline.py
          python -m py_compile partener-eu/ops/test_interreg_programming_lkg_history.py
          python -m py_compile partener-eu/ops/test_funding_tenders_structured_adapter.py
          python -m py_compile partener-eu/ops/test_funding_tenders_live_fetch.py
          python -m py_compile partener-eu/ops/test_eea_civil_society_calls.py
          python -m py_compile partener-eu/ops/test_eea_civil_society_fetch.py
          python -m py_compile partener-eu/ops/test_eea_civil_society_reconcile.py
          python -m py_compile partener-eu/ops/test_regiocentru_actions_fetch.py

      - name: Validate P10 and canonical source authority compatibility
        run: python partener-eu/ops/test_p10_policy_regression.py

      - name: Validate low-information fail-closed behavior
        run: python partener-eu/ops/test_source_registry_low_info.py

      - name: Validate official alias transport fallback
        run: python partener-eu/ops/test_source_registry_alias_fallback.py

      - name: Validate current official OI Research hosts
        run: python partener-eu/ops/test_source_registry_current_hosts.py

      - name: Validate EU/EEA/Interreg source and programming taxonomy
        run: python partener-eu/ops/test_source_registry_external_expansion.py

      - name: Validate ROHU current versus future programming lifecycle split
        run: python partener-eu/ops/test_interreg_rohu_pipeline_split.py

      - name: Validate Interreg Romania territorial fit stays non-authorizing
        run: python partener-eu/ops/test_interreg_territorial_fit.py

      - name: Validate Interreg applicant and partner market fit stays non-authorizing
        run: python partener-eu/ops/test_interreg_applicant_partner_fit.py

      - name: Capture deterministic Interreg market-fit evidence
        run: |
          set -euo pipefail
          mkdir -p /tmp/interreg-market-fit
          python partener-eu/ingest/interreg_applicant_partner_fit.py \
            --county 'Timiș' --applicant-type 'public authority' --has-international-partner \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-timis-public" \
            --output /tmp/interreg-market-fit/timis-public-authority.json
          python partener-eu/ingest/interreg_applicant_partner_fit.py \
            --county 'Tulcea' --applicant-type 'NGO_NONPROFIT' \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-tulcea-ngo" \
            --output /tmp/interreg-market-fit/tulcea-ngo.json
          python partener-eu/ingest/interreg_applicant_partner_fit.py \
            --county 'Vâlcea' --applicant-type 'company' --has-international-partner \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-valcea-company" \
            --output /tmp/interreg-market-fit/valcea-company.json

      - name: Validate captured Interreg market-fit evidence stays non-authorizing
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('/tmp/interreg-market-fit')
          files=sorted(root.glob('*.json'))
          if len(files) != 3:
              print('FAIL expected 3 Interreg market-fit evidence files, got', len(files))
              sys.exit(2)
          summary=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))
              if d.get('adapter_id') != 'INTERREG_APPLICANT_PARTNER_FIT_V1' or d.get('market_intelligence_only') is not True:
                  print('FAIL Interreg market-fit identity/policy drift:', p.name)
                  sys.exit(2)
              for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
                  if d.get(key) is not False:
                      print('FAIL Interreg market-fit became authorizing:', p.name, key, d.get(key))
                      sys.exit(2)
              if d.get('publication_effect') != 'NONE':
                  print('FAIL Interreg market-fit publication effect:', p.name, d.get('publication_effect'))
                  sys.exit(2)
              for key in ('registry_sha256','territorial_registry_sha256'):
                  value=str(d.get(key) or '')
                  if len(value) != 64:
                      print('FAIL Interreg market-fit registry hash:', p.name, key, value)
                      sys.exit(2)
              if not d.get('run_id') or not d.get('fetched_at') or d.get('fit_count', 0) < 1:
                  print('FAIL Interreg market-fit provenance/output incomplete:', p.name)
                  sys.exit(2)
              summary.append({'file':p.name,'fit_count':d['fit_count'],'top':[(r['programme_id'],r['market_fit_score'],r['applicant_signal_state']) for r in d['ranked_programme_fits'][:4]]})
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload bounded Interreg market-fit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-interreg-market-fit-evidence
          path: /tmp/interreg-market-fit
          retention-days: 7
          if-no-files-found: error

      - name: Validate Interreg 2028-2034 programming pipeline stays non-authorizing
        run: python partener-eu/ops/test_interreg_programming_pipeline.py

      - name: Validate bounded historical Interreg LKG resolution stays non-authorizing
        run: python partener-eu/ops/test_interreg_programming_lkg_history.py

      - name: Capture live Interreg 2028-2034 programming watch evidence
        run: |
          python partener-eu/ingest/interreg_programming_pipeline.py \
            --live \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-programming" \
            --output /tmp/interreg-programming-pipeline.json

      - name: Validate live Interreg programming evidence stays pipeline-only
        run: |
          python - <<'PY'
          import json, string, sys
          p='/tmp/interreg-programming-pipeline.json'
          d=json.load(open(p, encoding='utf-8'))
          registry=json.load(open('partener-eu/ingest/interreg_programming_pipeline_registry.json', encoding='utf-8'))
          expected_sources=len(registry.get('sources') or [])
          if d.get('adapter_id') != 'INTERREG_PROGRAMMING_PIPELINE_V1' or d.get('observation_state') != 'PROGRAMMING_PIPELINE':
              print('FAIL Interreg programming identity drift:', d.get('adapter_id'), d.get('observation_state'))
              sys.exit(2)
          if expected_sources < 1 or d.get('source_count') != expected_sources or len(d.get('watchlist') or []) != expected_sources:
              print('FAIL Interreg programming source inventory drift:', d.get('source_count'), 'expected', expected_sources)
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
              if d.get(key) is not False:
                  print('FAIL Interreg programming aggregate became authorizing:', key, d.get(key))
                  sys.exit(2)
          if d.get('publication_effect') != 'NONE' or d.get('market_intelligence_only') is not True:
              print('FAIL Interreg programming publication/policy drift')
              sys.exit(2)
          reg_hash=str(d.get('registry_sha256') or '')
          if len(reg_hash) != 64 or any(ch not in string.hexdigits for ch in reg_hash):
              print('FAIL Interreg programming registry hash:', reg_hash)
              sys.exit(2)
          if not d.get('run_id') or not d.get('fetched_at'):
              print('FAIL Interreg programming provenance incomplete')
              sys.exit(2)
          healthy=0
          for row in d['watchlist']:
              if row.get('observation_state') not in {'PROPOSAL','CONSULTATION','PROGRAMMING_PROCESS'}:
                  print('FAIL forbidden programming state:', row.get('source_id'), row.get('observation_state'))
                  sys.exit(2)
              for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
                  if row.get(key) is not False:
                      print('FAIL Interreg programming row became authorizing:', row.get('source_id'), key)
                      sys.exit(2)
              if row.get('publication_effect') != 'NONE':
                  print('FAIL Interreg programming row publication effect:', row.get('source_id'))
                  sys.exit(2)
              health=(row.get('source_health') or {}).get('health_state')
              if health == 'HEALTHY':
                  healthy += 1
                  raw_hash=str((row.get('source_health') or {}).get('raw_sha256') or '')
                  if len(raw_hash) != 64 or any(ch not in string.hexdigits for ch in raw_hash):
                      print('FAIL healthy programming source missing raw hash:', row.get('source_id'))
                      sys.exit(2)
              elif not str(health).startswith('DEGRADED'):
                  print('FAIL unexpected live source-health state:', row.get('source_id'), health)
                  sys.exit(2)
              if str(health).startswith('DEGRADED') and (row.get('source_health') or {}).get('lkg_required') is not True:
                  print('FAIL degraded source does not require LKG:', row.get('source_id'))
                  sys.exit(2)
          if healthy < 2:
              print('FAIL too few official Interreg programming sources reachable to trust live watch:', healthy)
              sys.exit(2)
          print(json.dumps({'source_count':d['source_count'],'healthy_source_count':healthy,'health_state':d.get('health_state'),'top_watch':[(r['source_id'],r['observation_state'],r['consultation_lifecycle'],r['watch_priority']) for r in d['watchlist'][:4]],'open_call_authorized':d['open_call_authorized']}, ensure_ascii=False))
          PY

      - name: Restore bounded Interreg programming history from this branch
        id: interreg_previous_snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/interreg-programming-previous /tmp/interreg-programming-history
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=partener-interreg-programming-pipeline-evidence&per_page=100" > /tmp/interreg-programming-artifacts.json
          python - <<'PY' > /tmp/interreg-programming-history-run-ids.txt
          import json, os
          data=json.load(open('/tmp/interreg-programming-artifacts.json', encoding='utf-8'))
          branch=(os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME') or '').strip()
          current=int(os.environ['GITHUB_RUN_ID'])
          candidates=[]
          seen=set()
          for artifact in data.get('artifacts') or []:
              run=artifact.get('workflow_run') or {}
              if artifact.get('expired') is True:
                  continue
              run_id=int(run.get('id') or 0)
              if run_id == 0 or run_id == current or run_id in seen:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              seen.add(run_id)
              candidates.append((str(artifact.get('created_at') or ''), int(artifact.get('id') or 0), run_id))
          candidates.sort(reverse=True)
          for _created_at, _artifact_id, run_id in candidates[:12]:
              print(run_id)
          PY
          HISTORY_COUNT=0
          PREVIOUS_RUN_ID=""
          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
            if [ "$CONCLUSION" != "success" ]; then
              echo "Skipping historical run $RUN_ID with conclusion=$CONCLUSION"
              continue
            fi
            if [ -z "$PREVIOUS_RUN_ID" ]; then
              PREVIOUS_RUN_ID="$RUN_ID"
            fi
            DEST="/tmp/interreg-programming-history/${RUN_ID}"
            mkdir -p "$DEST"
            gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name partener-interreg-programming-pipeline-evidence \
              --dir "$DEST"
            test -s "$DEST/interreg-programming-pipeline.json"
            HISTORY_COUNT=$((HISTORY_COUNT + 1))
            if [ "$HISTORY_COUNT" -ge 8 ]; then
              break
            fi
          done < /tmp/interreg-programming-history-run-ids.txt
          echo "history_count=$HISTORY_COUNT" >> "$GITHUB_OUTPUT"
          if [ -z "$PREVIOUS_RUN_ID" ]; then
            echo "No previous successful non-expired Interreg programming artifact found for this branch; baseline reconciliation will be used."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "/tmp/interreg-programming-history/${PREVIOUS_RUN_ID}/interreg-programming-pipeline.json" \
            /tmp/interreg-programming-previous/interreg-programming-pipeline.json
          if [ -s "/tmp/interreg-programming-history/${PREVIOUS_RUN_ID}/interreg-programming-reconciliation.json" ]; then
            cp "/tmp/interreg-programming-history/${PREVIOUS_RUN_ID}/interreg-programming-reconciliation.json" \
              /tmp/interreg-programming-previous/interreg-programming-reconciliation.json
          fi
          echo "Previous Interreg programming snapshot restored from successful run $PREVIOUS_RUN_ID; bounded history count=$HISTORY_COUNT"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$PREVIOUS_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Reconcile Interreg programming evidence with previous branch snapshot and bounded LKG history
        shell: bash
        env:
          PREVIOUS_AVAILABLE: ${{ steps.interreg_previous_snapshot.outputs.available }}
          PREVIOUS_WORKFLOW_RUN_ID: ${{ steps.interreg_previous_snapshot.outputs.run_id }}
          HISTORY_COUNT: ${{ steps.interreg_previous_snapshot.outputs.history_count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'partener-eu/ingest')
          from interreg_programming_lkg_history import enrich_reconciliation_with_history
          from interreg_programming_pipeline import reconcile_snapshots

          current_path=pathlib.Path('/tmp/interreg-programming-pipeline.json')
          previous_path=pathlib.Path('/tmp/interreg-programming-previous/interreg-programming-pipeline.json')
          history_root=pathlib.Path('/tmp/interreg-programming-history')
          output_path=pathlib.Path('/tmp/interreg-programming-reconciliation.json')
          current=json.loads(current_path.read_text(encoding='utf-8'))
          previous=None
          if os.environ.get('PREVIOUS_AVAILABLE') == 'true':
              if not previous_path.is_file():
                  print('FAIL previous snapshot advertised but not restored')
                  sys.exit(2)
              previous=json.loads(previous_path.read_text(encoding='utf-8'))
          receipt=reconcile_snapshots(current, previous)
          history_snapshots=[]
          for path in sorted(history_root.glob('*/interreg-programming-pipeline.json')):
              history_snapshots.append(json.loads(path.read_text(encoding='utf-8')))
          receipt=enrich_reconciliation_with_history(current, receipt, history_snapshots, max_history_snapshots=8)
          if receipt.get('adapter_id') != 'INTERREG_PROGRAMMING_RECONCILIATION_V1':
              print('FAIL reconciliation identity drift')
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized'):
              if receipt.get(key) is not False:
                  print('FAIL programming reconciliation became authorizing:', key, receipt.get(key))
                  sys.exit(2)
          if receipt.get('publication_effect') != 'NONE' or receipt.get('market_intelligence_only') is not True:
              print('FAIL programming reconciliation publication/policy drift')
              sys.exit(2)
          if receipt.get('historical_lkg_resolution_version') != 'INTERREG_PROGRAMMING_HISTORICAL_LKG_V1':
              print('FAIL historical LKG resolver identity drift')
              sys.exit(2)
          expected_history_count=int(os.environ.get('HISTORY_COUNT') or '0')
          if receipt.get('historical_lkg_snapshot_count_considered') != min(expected_history_count, 8):
              print('FAIL bounded history count drift:', receipt.get('historical_lkg_snapshot_count_considered'), expected_history_count)
              sys.exit(2)
          if previous is None:
              if receipt.get('reconciliation_state') != 'BASELINE_CAPTURED_NO_PREVIOUS_SNAPSHOT':
                  print('FAIL first-snapshot reconciliation state:', receipt.get('reconciliation_state'))
                  sys.exit(2)
          else:
              if receipt.get('previous_run_id') != previous.get('run_id') or not receipt.get('previous_snapshot_sha256'):
                  print('FAIL previous snapshot binding incomplete')
                  sys.exit(2)
          output_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'previous_artifact_workflow_run_id': os.environ.get('PREVIOUS_WORKFLOW_RUN_ID') or None,
              'previous_snapshot_run_id': receipt.get('previous_run_id'),
              'current_run_id': receipt.get('current_run_id'),
              'reconciliation_state': receipt.get('reconciliation_state'),
              'semantic_change_count': receipt.get('semantic_change_count'),
              'transport_or_content_change_count': receipt.get('transport_or_content_change_count'),
              'historical_lkg_snapshot_count_considered': receipt.get('historical_lkg_snapshot_count_considered'),
              'historical_lkg_reference_available_count': receipt.get('historical_lkg_reference_available_count'),
              'lkg_reference_available_count': receipt.get('lkg_reference_available_count'),
              'lkg_reference_missing_count': receipt.get('lkg_reference_missing_count'),
              'pipeline_watch_candidate': receipt.get('pipeline_watch_candidate'),
              'source_health_watch_candidate': receipt.get('source_health_watch_candidate'),
              'call_alert_authorized': receipt.get('call_alert_authorized'),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload bounded Interreg programming watch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-interreg-programming-pipeline-evidence
          path: |
            /tmp/interreg-programming-pipeline.json
            /tmp/interreg-programming-reconciliation.json
          retention-days: 7
          if-no-files-found: warn

      - name: Validate Funding & Tenders structured normalization
        run: python partener-eu/ops/test_funding_tenders_structured_adapter.py

      - name: Validate Funding & Tenders live Search/Facet boundary
        run: python partener-eu/ops/test_funding_tenders_live_fetch.py

      - name: Validate EEA Civil Society Fund Romania call normalization
        run: python partener-eu/ops/test_eea_civil_society_calls.py

      - name: Validate EEA Civil Society Fund exact-page acquisition
        run: python partener-eu/ops/test_eea_civil_society_fetch.py

      - name: Validate EEA Civil Society Fund semantic reconciliation
        run: python partener-eu/ops/test_eea_civil_society_reconcile.py

      - name: Validate EEA Civil Society Fund canonical staging admission
        working-directory: partener-eu/p11
        run: python test_eea_civil_society_stage.py

      - name: Validate RegioCentru action-index acquisition contract
        run: python partener-eu/ops/test_regiocentru_actions_fetch.py

      - name: Capture live RegioCentru action-index evidence without changing facts
        run: |
          python partener-eu/ingest/regiocentru_actions_fetch.py \
            --output-dir /tmp/regiocentru-actions \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Validate live RegioCentru receipt stays discovery-only
        run: |
          python - <<'PY'
          import json, string, sys
          from urllib.parse import urlparse
          p='/tmp/regiocentru-actions/handoff/regiocentru_actions_fetch.json'
          d=json.load(open(p, encoding='utf-8'))
          if d.get('source_id') != 'SRC-ADR-CENTRU-PR-ACTIONS' or d.get('adapter_id') != 'REGIOCENTRU_ACTIONS_V1':
              print('FAIL RegioCentru identity drift:', d.get('source_id'), d.get('adapter_id'))
              sys.exit(2)
          if d.get('observation_state') != 'CALL_INDEX_DISCOVERY':
              print('FAIL RegioCentru action index escaped discovery-only state')
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','publish_authorized','deadline_authorized','budget_authorized','eligibility_authorized'):
              if d.get(key) is not False:
                  print('FAIL RegioCentru receipt became authorizing:', key, d.get(key))
                  sys.exit(2)
          if d.get('action_candidate_count', 0) < 1 or len(d.get('action_candidates') or []) != d.get('action_candidate_count'):
              print('FAIL no bounded RegioCentru action candidates were acquired')
              sys.exit(2)
          raw_hash=str(d.get('raw_sha256') or '')
          if len(raw_hash) != 64 or any(ch not in string.hexdigits for ch in raw_hash):
              print('FAIL invalid RegioCentru raw SHA-256')
              sys.exit(2)
          if not d.get('fetched_at') or not d.get('run_id'):
              print('FAIL RegioCentru provenance incomplete')
              sys.exit(2)
          for key in ('requested_url','final_url'):
              u=urlparse(str(d.get(key) or ''))
              if u.scheme != 'https' or (u.hostname or '').lower() not in {'regiocentru.ro','www.regiocentru.ro'} or not (u.path or '/').startswith('/actiuni/'):
                  print('FAIL RegioCentru authority/path drift:', key, d.get(key))
                  sys.exit(2)
          missing=set(d.get('missing_for_open_confirmation') or [])
          required={'exact_call_or_mysmis_identifier','current_official_exact_action_endpoint','explicit_current_open_status','semantic_reconciliation'}
          if not required.issubset(missing):
              print('FAIL RegioCentru exact-call proof requirements incomplete:', sorted(missing))
              sys.exit(2)
          print(json.dumps({'candidate_count': d.get('action_candidate_count'), 'raw_sha256': raw_hash, 'observation_state': d.get('observation_state'), 'publish_authorized': d.get('publish_authorized')}, ensure_ascii=False))
          PY

      - name: Upload bounded RegioCentru acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-regiocentru-actions-live-evidence
          path: /tmp/regiocentru-actions
          retention-days: 7
          if-no-files-found: warn
