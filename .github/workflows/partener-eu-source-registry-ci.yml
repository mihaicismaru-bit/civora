name: PARTENER.EU Source Registry CI

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/source_registry.json'
      - 'partener-eu/ingest/amif_impact_official_receipts.py'
      - 'partener-eu/ingest/water4all_2026_official_pair.py'
      - 'partener-eu/ops/test_water4all_2026_official_pair.py'
      - 'partener-eu/ops/test_amif_impact_official_receipts.py'
      - 'partener-eu/ingest/rch_2027_raw_acquire.py'
      - 'partener-eu/ingest/rch_2027_paired_handoff.py'
      - 'partener-eu/ingest/rch_2027_epss_gateway.py'
      - 'partener-eu/ingest/rch_2027_uefiscdi_news.py'
      - 'partener-eu/ops/test_rch_2027_epss_gateway.py'
      - 'partener-eu/ops/test_rch_2027_uefiscdi_news.py'
      - 'partener-eu/ops/test_rch_2027_raw_acquire.py'
      - 'partener-eu/ops/test_rch_2027_paired_handoff.py'
      - 'partener-eu/validation/discovery/rch-2027-romania-semantic-review-20261108.json'
      - 'partener-eu/ingest/mff_2028_source_registry.json'
      - 'partener-eu/ingest/mff_2028_probe.py'
      - 'partener-eu/ops/test_mff_2028_probe.py'
      - '.github/workflows/partener-eu-mff-2028.yml'
      - 'partener-eu/ingest/source_registry_probe.py'
      - 'partener-eu/ingest/data_plane_contract.json'
      - 'partener-eu/ingest/funding_tenders_api.py'
      - 'partener-eu/ingest/funding_tenders_fetch.py'
      - 'partener-eu/ingest/eea_civil_society_calls.py'
      - 'partener-eu/ingest/eea_civil_society_fetch.py'
      - 'partener-eu/ingest/eea_civil_society_reconcile.py'
      - 'partener-eu/ingest/regiocentru_actions_fetch.py'
      - 'partener-eu/ingest/regiocentru_actions_source.json'
      - 'partener-eu/p11/candidate_staging.py'
      - 'partener-eu/p11/eea_civil_society_stage.py'
      - 'partener-eu/p11/test_eea_civil_society_stage.py'
      - 'partener-eu/ops/sources.json'
      - 'partener-eu/ops/p10_validate.py'
      - 'partener-eu/ops/test_p10_policy_regression.py'
      - 'partener-eu/ops/test_source_registry_low_info.py'
      - 'partener-eu/ops/test_edrive_consultation_discovery.py'
      - 'partener-eu/validation/discovery/edrive-guides-consultation-20261109.json'
      - 'partener-eu/ops/test_source_registry_current_hosts.py'
      - 'partener-eu/ops/test_source_registry_alias_fallback.py'
      - 'partener-eu/ops/test_source_registry_external_expansion.py'
      - 'partener-eu/ingest/pddtj_oi_discovery_acquire.py'
      - 'partener-eu/ops/test_pddtj_oi_discovery_acquire.py'
      - 'partener-eu/ops/test_interreg_rohu_pipeline_split.py'
      - 'partener-eu/ingest/interreg_programming_intelligence.py'
      - 'partener-eu/ingest/interreg_programming_live_fetch.py'
      - 'partener-eu/ops/test_interreg_programming_intelligence.py'
      - 'partener-eu/ops/test_interreg_programming_live_fetch.py'
      - 'partener-eu/ops/test_funding_tenders_structured_adapter.py'
      - 'partener-eu/ops/test_funding_tenders_live_fetch.py'
      - 'partener-eu/ops/test_eea_civil_society_calls.py'
      - 'partener-eu/ops/test_eea_civil_society_fetch.py'
      - 'partener-eu/ops/test_eea_civil_society_reconcile.py'
      - 'partener-eu/web/home-concierge-vnext.js'
      - 'partener-eu/ops/test_home_concierge_freshness.mjs'
      - 'partener-eu/ops/test_regiocentru_actions_fetch.py'
      - '.github/workflows/partener-eu-source-registry-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout is exact event head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "FAIL checkout drift: expected $EXPECTED_SHA got $ACTUAL_SHA" >&2
            exit 2
          fi
          echo "Exact event head verified: $ACTUAL_SHA"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate registry JSON and adapter syntax
        run: |
          python -m json.tool partener-eu/ingest/source_registry.json >/dev/null
          python -m json.tool partener-eu/ingest/mff_2028_source_registry.json >/dev/null
          python -m json.tool partener-eu/ingest/data_plane_contract.json >/dev/null
          python -m json.tool partener-eu/ingest/regiocentru_actions_source.json >/dev/null
          python -m json.tool partener-eu/ops/sources.json >/dev/null
          python -m py_compile partener-eu/ingest/source_registry_probe.py
          python -m py_compile partener-eu/ingest/amif_impact_official_receipts.py
          python -m py_compile partener-eu/ingest/water4all_2026_official_pair.py
          python -m py_compile partener-eu/ops/test_water4all_2026_official_pair.py
          python -m py_compile partener-eu/ops/test_amif_impact_official_receipts.py
          python -m py_compile partener-eu/ingest/rch_2027_raw_acquire.py
          python -m py_compile partener-eu/ingest/rch_2027_paired_handoff.py
          python -m py_compile partener-eu/ingest/rch_2027_epss_gateway.py
          python -m py_compile partener-eu/ingest/rch_2027_uefiscdi_news.py
          python -m py_compile partener-eu/ops/test_rch_2027_uefiscdi_news.py
          python -m py_compile partener-eu/ops/test_rch_2027_epss_gateway.py
          python -m py_compile partener-eu/ops/test_rch_2027_paired_handoff.py
          python -m py_compile partener-eu/ops/test_rch_2027_raw_acquire.py
          python -m py_compile partener-eu/ingest/mff_2028_probe.py
          python -m py_compile partener-eu/ops/test_mff_2028_probe.py
          python -m py_compile partener-eu/ingest/funding_tenders_api.py
          python -m py_compile partener-eu/ingest/funding_tenders_fetch.py
          python -m py_compile partener-eu/ingest/eea_civil_society_calls.py
          python -m py_compile partener-eu/ingest/eea_civil_society_fetch.py
          python -m py_compile partener-eu/ingest/eea_civil_society_reconcile.py
          python -m py_compile partener-eu/ingest/regiocentru_actions_fetch.py
          python -m py_compile partener-eu/p11/candidate_staging.py
          python -m py_compile partener-eu/p11/eea_civil_society_stage.py
          python -m py_compile partener-eu/p11/test_eea_civil_society_stage.py
          python -m py_compile partener-eu/ops/p10_validate.py
          python -m py_compile partener-eu/ops/test_p10_policy_regression.py
          python -m py_compile partener-eu/ops/test_source_registry_external_expansion.py
          python -m py_compile partener-eu/ingest/pddtj_oi_discovery_acquire.py
          python -m py_compile partener-eu/ops/test_pddtj_oi_discovery_acquire.py
          python -m py_compile partener-eu/ops/test_interreg_rohu_pipeline_split.py
          python -m py_compile partener-eu/ops/test_funding_tenders_structured_adapter.py
          python -m py_compile partener-eu/ops/test_funding_tenders_live_fetch.py
          python -m py_compile partener-eu/ops/test_eea_civil_society_calls.py
          python -m py_compile partener-eu/ops/test_eea_civil_society_fetch.py
          python -m py_compile partener-eu/ops/test_eea_civil_society_reconcile.py
          python -m py_compile partener-eu/ops/test_regiocentru_actions_fetch.py

      - name: Validate P10 and canonical source authority compatibility
        run: python partener-eu/ops/test_p10_policy_regression.py

      - name: Validate official MFF October stage watches and immutable raw acquisition
        run: python partener-eu/ops/test_mff_2028_probe.py

      - name: Validate low-information fail-closed behavior
        run: python partener-eu/ops/test_source_registry_low_info.py

      - name: Lock e-DRIVE consultation to discovery-only, not OPEN_CALL
        run: python partener-eu/ops/test_edrive_consultation_discovery.py

      - name: Validate official alias transport fallback
        run: python partener-eu/ops/test_source_registry_alias_fallback.py

      - name: Validate current official OI Research hosts
        run: python partener-eu/ops/test_source_registry_current_hosts.py

      - name: Validate EU/EEA/Interreg source and programming taxonomy
        run: python partener-eu/ops/test_source_registry_external_expansion.py

      - name: Verify paired AMIF IMPACT Lot 3 official raw/replay contract
        run: python partener-eu/ops/test_amif_impact_official_receipts.py

      - name: Acquire MAI amendment and DG HOME primary PDF as paired non-authorizing evidence
        id: amif_impact_live
        continue-on-error: true
        run: |
          python partener-eu/ingest/amif_impact_official_receipts.py \
            --out "/tmp/partener-amif-impact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python partener-eu/ingest/amif_impact_official_receipts.py \
            --replay-dir "/tmp/partener-amif-impact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Quarantine unavailable or unreconciled AMIF original documents
        if: steps.amif_impact_live.outcome == 'failure'
        run: |
          echo 'AMIF_IMPACT_PAIR_RAW_PENDING / FAIL_CLOSED / NO_OPEN_CALL / NO_PUBLICATION'
          python partener-eu/ops/test_amif_impact_official_receipts.py

      - name: Upload immutable paired AMIF originals and handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-amif-impact-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/partener-amif-impact-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn

      - name: Validate Water4All stage-specific paired raw/replay contract
        run: python partener-eu/ops/test_water4all_2026_official_pair.py

      - name: Acquire exact Water4All 2026 European and Romanian official HTML (non-authorizing)
        id: water4all_live
        continue-on-error: true
        run: |
          python partener-eu/ingest/water4all_2026_official_pair.py \
            --out "/tmp/partener-water4all-2026-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python partener-eu/ingest/water4all_2026_official_pair.py \
            --replay-dir "/tmp/partener-water4all-2026-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Quarantine unavailable Water4All original or changed stage markers
        if: steps.water4all_live.outcome == 'failure'
        run: |
          echo 'WATER4ALL_2026_PAIRED_RAW_PENDING / NO_OPEN_CALL / NO_PUBLICATION'
          python partener-eu/ops/test_water4all_2026_official_pair.py

      - name: Upload immutable Water4All 2026 official pair and evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-water4all-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/partener-water4all-2026-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn

      - name: Prove PDDTJ delegated OI original-byte handoff remains non-authorizing
        run: python partener-eu/ops/test_pddtj_oi_discovery_acquire.py

      - name: Validate RCH 2027 official original-byte handoff contract
        run: |
          python partener-eu/ops/test_rch_2027_raw_acquire.py
          python partener-eu/ops/test_rch_2027_paired_handoff.py
          python partener-eu/ops/test_rch_2027_epss_gateway.py
          python partener-eu/ops/test_rch_2027_uefiscdi_news.py

      - name: Validate ROHU current versus future programming lifecycle split
        run: python partener-eu/ops/test_interreg_rohu_pipeline_split.py

      - name: Validate Interreg named-month consultation windows and acquisition isolation
        run: |
          python partener-eu/ops/test_interreg_programming_intelligence.py
          python partener-eu/ops/test_interreg_programming_live_fetch.py

      - name: Validate Funding & Tenders structured normalization
        run: python partener-eu/ops/test_funding_tenders_structured_adapter.py

      - name: Validate Funding & Tenders live Search/Facet boundary
        run: python partener-eu/ops/test_funding_tenders_live_fetch.py

      - name: Validate EEA Civil Society Fund Romania call normalization
        run: python partener-eu/ops/test_eea_civil_society_calls.py

      - name: Validate EEA Civil Society Fund exact-page acquisition
        run: python partener-eu/ops/test_eea_civil_society_fetch.py

      - name: Validate EEA Civil Society Fund semantic reconciliation
        run: python partener-eu/ops/test_eea_civil_society_reconcile.py

      - name: Validate active homepage PREPARE/CONSULTATION freshness
        run: |
          node --check partener-eu/web/home-concierge-vnext.js
          node partener-eu/ops/test_home_concierge_freshness.mjs

      - name: Validate EEA Civil Society Fund canonical staging admission
        working-directory: partener-eu/p11
        run: python test_eea_civil_society_stage.py

      - name: Validate RegioCentru action-index acquisition contract
        run: python partener-eu/ops/test_regiocentru_actions_fetch.py

      - name: Capture live RegioCentru action-index evidence without changing facts
        id: regiocentru_live
        continue-on-error: true
        run: |
          python partener-eu/ingest/regiocentru_actions_fetch.py \
            --output-dir /tmp/regiocentru-actions \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Validate live RegioCentru receipt stays discovery-only
        if: steps.regiocentru_live.outcome == 'success'
        run: |
          python - <<'PY'
          import json, string, sys
          from urllib.parse import urlparse
          p='/tmp/regiocentru-actions/handoff/regiocentru_actions_fetch.json'
          d=json.load(open(p, encoding='utf-8'))
          if d.get('source_id') != 'SRC-ADR-CENTRU-PR-ACTIONS' or d.get('adapter_id') != 'REGIOCENTRU_ACTIONS_V1':
              print('FAIL RegioCentru identity drift:', d.get('source_id'), d.get('adapter_id'))
              sys.exit(2)
          if d.get('observation_state') != 'CALL_INDEX_DISCOVERY':
              print('FAIL RegioCentru action index escaped discovery-only state')
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','publish_authorized','deadline_authorized','budget_authorized','eligibility_authorized'):
              if d.get(key) is not False:
                  print('FAIL RegioCentru receipt became authorizing:', key, d.get(key))
                  sys.exit(2)
          if d.get('action_candidate_count', 0) < 1 or len(d.get('action_candidates') or []) != d.get('action_candidate_count'):
              print('FAIL no bounded RegioCentru action candidates were acquired')
              sys.exit(2)
          raw_hash=str(d.get('raw_sha256') or '')
          if len(raw_hash) != 64 or any(ch not in string.hexdigits for ch in raw_hash):
              print('FAIL invalid RegioCentru raw SHA-256')
              sys.exit(2)
          if not d.get('fetched_at') or not d.get('run_id'):
              print('FAIL RegioCentru provenance incomplete')
              sys.exit(2)
          for key in ('requested_url','final_url'):
              u=urlparse(str(d.get(key) or ''))
              if u.scheme != 'https' or (u.hostname or '').lower() not in {'regiocentru.ro','www.regiocentru.ro'} or not (u.path or '/').startswith('/actiuni/'):
                  print('FAIL RegioCentru authority/path drift:', key, d.get(key))
                  sys.exit(2)
          missing=set(d.get('missing_for_open_confirmation') or [])
          required={'exact_call_or_mysmis_identifier','current_official_exact_action_endpoint','explicit_current_open_status','semantic_reconciliation'}
          if not required.issubset(missing):
              print('FAIL RegioCentru exact-call proof requirements incomplete:', sorted(missing))
              sys.exit(2)
          print(json.dumps({'candidate_count': d.get('action_candidate_count'), 'raw_sha256': raw_hash, 'observation_state': d.get('observation_state'), 'publish_authorized': d.get('publish_authorized')}, ensure_ascii=False))
          PY

      - name: Confirm RegioCentru transport failure stays fail-closed
        if: steps.regiocentru_live.outcome == 'failure'
        run: |
          python - <<'PY'
          import json, sys
          p='partener-eu/ingest/regiocentru_actions_source.json'
          d=json.load(open(p, encoding='utf-8'))
          s=d.get('source') or {}
          if s.get('id') != 'SRC-ADR-CENTRU-PR-ACTIONS':
              print('FAIL RegioCentru source identity drift')
              sys.exit(2)
          if s.get('material_fact_use') is not False or s.get('authority_scope') != 'CALL_INDEX_DISCOVERY' or s.get('observation_state') != 'CALL_INDEX_DISCOVERY':
              print('FAIL RegioCentru transport failure is not bounded to discovery-only:', s)
              sys.exit(2)
          print(json.dumps({
              'status': 'DEGRADED_FAIL_CLOSED',
              'source_id': s.get('id'),
              'material_fact_use': s.get('material_fact_use'),
              'authority_scope': s.get('authority_scope'),
              'publication_effect': 'NONE'
          }, ensure_ascii=False))
          PY

      - name: Upload bounded RegioCentru acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-regiocentru-actions-live-evidence
          path: /tmp/regiocentru-actions
          retention-days: 7
          if-no-files-found: warn

      - name: Capture RCH 2027 official paired source originals (acquisition only)
        id: rch_live
        continue-on-error: true
        run: |
          python partener-eu/ingest/rch_2027_raw_acquire.py \
            --output-dir /tmp/rch-2027-call1-evidence \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python partener-eu/ingest/rch_2027_raw_acquire.py \
            --documents \
            --output-dir /tmp/rch-2027-call1-evidence \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python partener-eu/ingest/rch_2027_paired_handoff.py \
            --seal --evidence-dir /tmp/rch-2027-call1-evidence

      - name: Verify RCH 2027 immutable raw replay without publishing
        if: steps.rch_live.outcome == 'success'
        run: |
          python partener-eu/ingest/rch_2027_raw_acquire.py \
            --replay-dir /tmp/rch-2027-call1-evidence
          python partener-eu/ingest/rch_2027_raw_acquire.py \
            --documents \
            --replay-dir /tmp/rch-2027-call1-evidence
          python partener-eu/ingest/rch_2027_paired_handoff.py \
            --replay --evidence-dir /tmp/rch-2027-call1-evidence

      - name: Fail closed on RCH 2027 live transport loss
        if: steps.rch_live.outcome == 'failure'
        run: |
          echo 'RCH_OFFICIAL_TRANSPORT_DEGRADED / RAW_HANDOFF_PENDING / NO_OPEN_CALL / NO_PUBLICATION'
          test -f partener-eu/validation/discovery/rch-2027-call1-20261108.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('partener-eu/validation/discovery/rch-2027-call1-20261108.json').read_text())
          assert d['publish_authorized'] is False and d['open_call_authorized'] is False
          assert d['observation_state']=='OFFICIAL_MULTI_SOURCE_READBACK_RAW_PENDING'
          PY

      - name: Acquire official-linked EPSS public Call 1 login gateway (not submission authority)
        id: rch_epss_live
        if: steps.rch_live.outcome == 'success'
        continue-on-error: true
        run: |
          python partener-eu/ingest/rch_2027_epss_gateway.py \
            --evidence-dir /tmp/rch-2027-call1-evidence \
            --capture-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Replay EPSS gateway linked to immutable five-source receipts
        if: steps.rch_epss_live.outcome == 'success'
        run: |
          python partener-eu/ingest/rch_2027_epss_gateway.py \
            --evidence-dir /tmp/rch-2027-call1-evidence --replay

      - name: Report EPSS gateway degraded without granting live submission authority
        if: steps.rch_epss_live.outcome == 'failure'
        run: |
          echo 'EPSS_GATEWAY_UNVERIFIED / RCH_ORIGINALS_PRESERVED / NO_OPEN_CALL / NO_PUBLICATION'

      - name: Capture UEFISCDI RCH secondary news without granting Romanian eligibility
        id: rch_uefiscdi_news
        if: steps.rch_live.outcome == 'success'
        continue-on-error: true
        run: |
          python partener-eu/ingest/rch_2027_uefiscdi_news.py \
            --evidence-dir /tmp/rch-2027-call1-evidence \
            --capture-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python partener-eu/ingest/rch_2027_uefiscdi_news.py \
            --evidence-dir /tmp/rch-2027-call1-evidence --replay

      - name: Quarantine secondary UEFISCDI fetch failure
        if: steps.rch_uefiscdi_news.outcome == 'failure'
        run: |
          echo 'UEFISCDI_SECONDARY_RAW_DEGRADED / ROMANIA_ANNEX_I_STILL_CANONICAL / NO_OPEN_CALL / NO_PUBLICATION'

      - name: Preserve original RCH 2027 raw bytes and signed handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-rch-2027-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/rch-2027-call1-evidence
          retention-days: 30
          if-no-files-found: warn
