name: VÂLCEA CLAR SGA Vâlcea Water Permit Register References

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/sga_valcea_water_permit_register_reference_adapter.py'
      - '.github/workflows/valcea-clar-sga-valcea-water-permit-register-reference.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/sga_valcea_water_permit_register_reference_adapter.py'
      - '.github/workflows/valcea-clar-sga-valcea-water-permit-register-reference.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-sga-valcea-water-permit-register-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile SGA Vâlcea water permit-register reference adapter
        run: python -m py_compile valcea-clar/scripts/sga_valcea_water_permit_register_reference_adapter.py
      - name: Run SGA Vâlcea fail-closed regressions
        run: python valcea-clar/scripts/sga_valcea_water_permit_register_reference_adapter.py --self-test
