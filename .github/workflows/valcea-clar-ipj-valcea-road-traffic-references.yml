name: VÂLCEA CLAR IPJ Vâlcea Road Traffic References

on:
  pull_request:
    paths:
      - "valcea-clar/scripts/ipj_valcea_road_traffic_news_reference_adapter.py"
      - ".github/workflows/valcea-clar-ipj-valcea-road-traffic-references.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valcea-clar-ipj-valcea-road-traffic-references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bounded adapter
        run: python -m py_compile valcea-clar/scripts/ipj_valcea_road_traffic_news_reference_adapter.py
      - name: Run fail-closed self-test
        run: python valcea-clar/scripts/ipj_valcea_road_traffic_news_reference_adapter.py --self-test
      - name: Verify live first-party source health
        shell: bash
        run: |
          python valcea-clar/scripts/ipj_valcea_road_traffic_news_reference_adapter.py > /tmp/ipj-valcea-road-traffic.json
          python - <<'PY'
          import json
          with open("/tmp/ipj-valcea-road-traffic.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["state"] == "CLEAR", data
          assert data["reference_count"] >= 3, data
          assert data["content_contract"] == "FIRST_PARTY_POLICE_ROAD_TRAFFIC_NEWS_INDEX_REFERENCE_ONLY"
          assert all(item["current_state_authorized"] is False for item in data["references"])
          assert all(item["active_incident_authorized"] is False for item in data["references"])
          assert all(item["active_traffic_disruption_authorized"] is False for item in data["references"])
          assert all(item["current_enforcement_operation_authorized"] is False for item in data["references"])
          assert all(item["article_body_authorized"] is False for item in data["references"])
          print(f"live-source: clear ({data['reference_count']} road-traffic references)")
          PY
