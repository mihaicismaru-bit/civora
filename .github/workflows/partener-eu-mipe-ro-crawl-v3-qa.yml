name: PARTENER.EU MIPE Windows Crawl v3 QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/mipe_windows_crawl_v3.py'
      - 'partener-eu/ingest/mipe_corpus_enrich.py'
      - '.github/workflows/partener-eu-mipe-ro-crawl-v3.yml'
      - '.github/workflows/partener-eu-mipe-ro-v3-scheduler.yml'
      - '.github/workflows/partener-eu-mipe-ro-crawl-v3-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile partener-eu/ingest/mipe_windows_crawl_v3.py
          python -m py_compile partener-eu/ingest/mipe_corpus_enrich.py
      - name: Static crawler contract
        run: |
          python - <<'PY'
          from pathlib import Path
          crawler=Path('partener-eu/ingest/mipe_windows_crawl_v3.py').read_text(encoding='utf-8')
          workflow=Path('.github/workflows/partener-eu-mipe-ro-crawl-v3.yml').read_text(encoding='utf-8')
          dispatcher=Path('.github/workflows/partener-eu-mipe-ro-v3-scheduler.yml').read_text(encoding='utf-8')
          required=[
            'schemaVersion": 3','playwright-edge-direct-romania-v3','MAX_DOCUMENTS',
            'extract_pdf','parse_docx','CALL_LIFECYCLE_EVENT','RESULTS_PUBLISHED',
            'CONTRACTING_UPDATE','textPreview','CANONICAL_OFFICIAL_FETCH',
          ]
          for token in required: assert token in crawler, token
          assert 'runs-on: [self-hosted, Windows, X64]' in workflow
          assert 'pypdf' in workflow and 'playwright' in workflow
          assert 'build_call_lifecycle.py' in workflow
          assert 'mipe_ro_corpus.json' in workflow
          assert 'actions/upload-artifact@v4' in workflow
          assert "cron: '17 */3 * * *'" in workflow
          assert 'schedule:' not in dispatcher
          assert 'partener-eu-mipe-ro-crawl-v3.yml/dispatches' in dispatcher
          assert '\"max_pages\":\"60\"' in dispatcher
          print('MIPE Windows crawler v3 static contract: PASS')
          PY
