name: VÂLCEA CLAR Presentation HTTP Handoff

# Manual recovery/operator bridge only. The registered Story Social Metadata
# workflow dispatches strict public HTTP acceptance after a successful derived
# presentation projection. Keeping this workflow manual-only prevents a second,
# unregistered autonomous dispatcher from existing outside the site-engine registry.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: valcea-clar-presentation-http-handoff
  cancel-in-progress: true

jobs:
  dispatch-public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Dispatch strict public HTTP acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run valcea-clar-public-health.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f require_ready=true
          echo 'VÂLCEA CLAR strict Public HTTP validation dispatch accepted.'
