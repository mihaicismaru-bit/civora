name: CRAIOVA CLAR Utility Lane

on:
  workflow_dispatch:
  push:
    branches: [craiova-clar-build]
    paths:
      - 'clar_core/**'
      - 'craiova-clar/config/**'
      - 'craiova-clar/run_utility.py'
      - 'craiova-clar/tests/**'
      - 'craiova-clar/vercel.json'
      - '.github/workflows/craiova-clar-utility.yml'

permissions:
  contents: write

concurrency:
  group: craiova-clar-utility
  cancel-in-progress: true

jobs:
  utility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: craiova-clar-build
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Regression tests
        run: python -m unittest discover -s craiova-clar/tests -p 'test_*.py' -v

      - name: Discover fresh official utility notice and render story
        env:
          CRAIOVA_CLAR_BASE_URL: https://craiova-clar-mihaicismaru-6634s-projects.vercel.app
        run: python craiova-clar/run_utility.py | tee /tmp/craiova-clar-utility-result.json

      - name: Require first visible utility story for greenfield acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('craiova-clar/site/stories.json')
          assert p.exists(), 'No utility story was rendered from the fresh official source.'
          doc = json.loads(p.read_text(encoding='utf-8'))
          assert doc.get('stories'), 'Utility story manifest is empty.'
          print(json.dumps(doc['stories'][0], ensure_ascii=False, indent=2))
          PY

      - name: Persist rendered utility story on build branch
        run: |
          git config user.name 'craiova-clar[bot]'
          git config user.email 'craiova-clar@users.noreply.github.com'
          git add craiova-clar/site craiova-clar/state || true
          if git diff --cached --quiet; then
            echo 'No generated change to persist.'
          else
            git commit -m 'Publish CRAIOVA CLAR utility story snapshot'
            git push origin HEAD:craiova-clar-build
          fi

      - name: Probe public utility publication
        env:
          BASE_URL: https://craiova-clar-mihaicismaru-6634s-projects.vercel.app
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          doc = json.loads(Path('craiova-clar/site/stories.json').read_text(encoding='utf-8'))
          story = doc['stories'][0]
          url = story['canonical_url']
          expected = story['headline']
          outcome = {
              'story_id': story['story_id'],
              'canonical_url': url,
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'status': 'verification_failed',
              'http_status': None,
              'error': None,
          }
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'CRAIOVA-CLAR-live-check/1.0'})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      body = response.read().decode('utf-8', errors='replace')
                      status = response.status
                  outcome['http_status'] = status
                  if status == 200 and expected in body and 'CRAIOVA CLAR' in body:
                      outcome['status'] = 'published_verified'
                      outcome['error'] = None
                      receipt = {
                          'story_id': story['story_id'],
                          'canonical_url': url,
                          'published_at': story['published_at'],
                          'destination': 'public_web',
                          'status': 'published_verified',
                          'external_id': None,
                          'metadata': {
                              'verified_at': datetime.now(timezone.utc).isoformat(),
                              'http_status': status,
                              'headline_verified': True,
                              'product_verified': True,
                          },
                      }
                      Path('craiova-clar/site/utility_publication_receipt.json').write_text(
                          json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
                      )
                      break
                  outcome['error'] = f'HTTP {status}; expected live headline not found'
              except Exception as exc:
                  outcome['error'] = repr(exc)
              if attempt < 11:
                  time.sleep(5)
          outcome['checked_at'] = datetime.now(timezone.utc).isoformat()
          Path('craiova-clar/state/utility_live_probe.json').write_text(
              json.dumps(outcome, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(outcome, ensure_ascii=False))
          PY

      - name: Persist live verification evidence
        run: |
          git config user.name 'craiova-clar[bot]'
          git config user.email 'craiova-clar@users.noreply.github.com'
          git add craiova-clar/state/utility_live_probe.json
          if test -f craiova-clar/site/utility_publication_receipt.json; then
            git add craiova-clar/site/utility_publication_receipt.json
          fi
          if git diff --cached --quiet; then
            echo 'Live verification evidence already current.'
          else
            git commit -m 'Record CRAIOVA CLAR utility live verification'
            git push origin HEAD:craiova-clar-build
          fi

      - name: Require verified public publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path('craiova-clar/state/utility_live_probe.json').read_text(encoding='utf-8'))
          assert probe['status'] == 'published_verified', probe
          PY
