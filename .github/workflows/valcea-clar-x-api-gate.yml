name: VÂLCEA CLAR X API Compatibility Check

# X remains OUTBOX_ONLY under the zero-paid-dependency policy. Credential or
# billing configuration must never be re-evaluated as a background side effect
# of normal social publication. Keep adapter/config checks manual or PR-only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/social/x_publish.py'
      - 'valcea-clar/social/channels/x.json'
      - 'valcea-clar/social/channel_registry.json'
      - 'valcea-clar/social/build_outbox_only_story_products.py'
      - '.github/workflows/valcea-clar-x-api-gate.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-x-api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate billing-gated X adapter offline
        run: |
          python -m py_compile valcea-clar/social/x_publish.py
          python valcea-clar/social/x_publish.py --self-test
          python local-news-os/social/validate_channel_config.py valcea-clar/social/channels/x.json --instance-root valcea-clar
          python valcea-clar/social/x_publish.py | tee /tmp/x-preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('valcea-clar/social/x_state.json').read_text(encoding='utf-8'))
          outbox=json.loads(Path('valcea-clar/social/x_outbox.json').read_text(encoding='utf-8'))
          assert state.get('direct_publication_enabled') is False
          assert state.get('billing_approved') is False
          assert outbox.get('platform') == 'x'
          print(f"X OUTBOX_ONLY compatibility: PASS ({len(outbox.get('items', []))} products)")
          PY
      - name: Upload X compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-x-api-check-${{ github.run_id }}
          path: /tmp/x-preview.json
          if-no-files-found: warn
          retention-days: 7
