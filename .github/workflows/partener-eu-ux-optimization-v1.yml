name: PARTENER.EU UX Optimization v1 QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/web/index.html'
      - 'partener-eu/web/ux-optimization-v1.css'
      - 'partener-eu/web/ux-optimization-v1.js'
      - 'partener-eu/ops/test_ux_optimization_v1.py'
      - 'partener-eu/ops/test_ux_browser_v1.py'
      - '.github/workflows/partener-eu-ux-optimization-v1.yml'
  push:
    branches:
      - 'agent/partener-ux-optimization-v1-20260822'
    paths:
      - 'partener-eu/web/index.html'
      - 'partener-eu/web/ux-optimization-v1.css'
      - 'partener-eu/web/ux-optimization-v1.js'
      - 'partener-eu/ops/test_ux_optimization_v1.py'
      - 'partener-eu/ops/test_ux_browser_v1.py'
      - '.github/workflows/partener-eu-ux-optimization-v1.yml'

permissions:
  contents: read

concurrency:
  group: partener-eu-ux-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: node --check partener-eu/web/ux-optimization-v1.js
      - name: UX contract
        run: python partener-eu/ops/test_ux_optimization_v1.py
      - name: Confirm progressive-enhancement boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('partener-eu/web/index.html').read_text(encoding='utf-8')
          assert index.index('app.js?') < index.index('ux-optimization-v1.js?')
          assert index.index('public-product-v3.js?') < index.index('ux-optimization-v1.js?')
          assert index.index('ask-partener-v2.css?') < index.index('ux-optimization-v1.css?')
          print('Progressive UX boundary: PASS')
          PY
      - name: Install browser harness
        run: python -m pip install --disable-pip-version-check playwright
      - name: Start isolated PARTENER.EU branch server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory partener-eu/web >/tmp/partener-ux-http.log 2>&1 &
          echo $! >/tmp/partener-ux-http.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/partener-ux-http.log
          exit 1
      - name: Desktop and mobile browser proof
        run: python partener-eu/ops/test_ux_browser_v1.py
      - name: Upload UX browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-ux-browser-proof-v1
          path: |
            partener-eu/ops/ux-browser-proof.json
            partener-eu/ops/ux-browser-screenshots/*.png
            /tmp/partener-ux-http.log
          if-no-files-found: warn
