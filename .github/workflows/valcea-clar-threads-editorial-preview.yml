name: VÂLCEA CLAR Threads Editorial Preview

on:
  pull_request:
    paths:
      - "valcea-clar/social/threads_editorial_v1.py"
      - "valcea-clar/social/story_social_policy.py"
      - "valcea-clar/social/threads_outbox.json"
      - "valcea-clar/social/x_outbox.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/site/story_publication_event.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-threads-editorial-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Self-test Threads packaging
        run: |
          python valcea-clar/social/story_social_policy.py --self-test
          python valcea-clar/social/threads_editorial_v1.py --self-test
      - name: Build Threads-native previews
        run: python valcea-clar/social/threads_editorial_v1.py
      - name: Validate current runtime products and sibling separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('valcea-clar/social/previews/threads-v1')
          value=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          if value.get('execution_mode')!='PREVIEW_ONLY_NO_NETWORK_CALLS':
              raise SystemExit('Threads preview network-call guard missing')
          products={p['story_id']:p for p in value.get('products',[]) if isinstance(p,dict) and p.get('story_id')}
          if value.get('ready') != sum(1 for p in products.values() if p.get('status')=='READY'):
              raise SystemExit('Threads READY count drift')
          if value.get('held') != sum(1 for p in products.values() if p.get('status')=='HOLD'):
              raise SystemExit('Threads HOLD count drift')
          for story_id, product in products.items():
              status=product.get('status')
              if status not in {'READY','HOLD'}:
                  raise SystemExit(f'Threads invalid status for {story_id}: {status!r}')
              if not str(product.get('canonical_url') or '').startswith('https://valceaclar.ro/stiri/'):
                  raise SystemExit(f'Threads canonical URL missing for {story_id}')
              if status=='READY':
                  if product.get('publication_mode')!='native_api_fail_closed':
                      raise SystemExit(f'Threads direct publication mode drift for {story_id}')
                  if product.get('source_preserving') is not True or product.get('conversation_native') is not True:
                      raise SystemExit(f'Threads native/provenance gate failed for {story_id}')
                  if product.get('verbatim_cross_platform_reuse_allowed') is not False:
                      raise SystemExit(f'Threads cross-post reuse enabled for {story_id}')
                  posts=product.get('posts')
                  if not isinstance(posts,list) or not posts:
                      raise SystemExit(f'Threads READY product has no posts: {story_id}')
                  if any('#' in str(post) for post in posts):
                      raise SystemExit(f'Threads default hashtag block detected: {story_id}')
                  if any(len(str(post))>470 for post in posts):
                      raise SystemExit(f'Threads internal post budget exceeded: {story_id}')
              elif not str(product.get('reason') or '').strip():
                  raise SystemExit(f'Threads HOLD has no reason: {story_id}')
          x_path=Path('valcea-clar/social/x_outbox.json')
          if x_path.is_file():
              x=json.loads(x_path.read_text(encoding='utf-8'))
              xby={i.get('story_id'):i for i in x.get('items',[]) if isinstance(i,dict)}
              for story_id, product in products.items():
                  sibling=xby.get(story_id)
                  if sibling and product.get('posts') == sibling.get('posts'):
                      raise SystemExit(f'Threads product is verbatim X output: {story_id}')
          print(f"Threads editorial preview: PASS ({value['ready']} READY / {value['held']} HOLD)")
          PY
      - name: Upload Threads editorial preview
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-threads-editorial-v1-${{ github.run_id }}
          path: valcea-clar/social/previews/threads-v1
          if-no-files-found: error
          retention-days: 14
