name: PARTENER.EU EEA CSF Calls 1-3 Exact Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eea_civil_society_fund_exact_common.py'
      - 'partener-eu/ingest/eea_civil_society_fund_reconcile_common.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call1_exact.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call1_reconcile.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call2_exact.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call2_reconcile.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call3_exact.py'
      - 'partener-eu/ingest/eea_civil_society_fund_call3_reconcile.py'
      - 'partener-eu/ops/test_eea_csf_calls123_common.py'
      - 'partener-eu/ops/run_eea_csf_calls123_proof.py'
      - 'partener-eu/ops/run_eea_csf_exact_canonical.py'
      - '.github/workflows/partener-eu-eea-csf-calls123-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  eea-csf-calls123-exact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded exact-call contracts
        run: |
          python -m py_compile \
            partener-eu/ingest/eea_civil_society_fund_exact_common.py \
            partener-eu/ingest/eea_civil_society_fund_reconcile_common.py \
            partener-eu/ingest/eea_civil_society_fund_call1_exact.py \
            partener-eu/ingest/eea_civil_society_fund_call1_reconcile.py \
            partener-eu/ingest/eea_civil_society_fund_call2_exact.py \
            partener-eu/ingest/eea_civil_society_fund_call2_reconcile.py \
            partener-eu/ingest/eea_civil_society_fund_call3_exact.py \
            partener-eu/ingest/eea_civil_society_fund_call3_reconcile.py \
            partener-eu/ops/test_eea_csf_calls123_common.py \
            partener-eu/ops/run_eea_csf_calls123_proof.py \
            partener-eu/ops/run_eea_csf_exact_canonical.py

      - name: Validate fail-closed Calls 1-3 semantics
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: python partener-eu/ops/test_eea_csf_calls123_common.py

      - name: Run shared exact proof for Calls 1-3
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EEA_CSF_EXACT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-eea-csf-calls123
        run: python partener-eu/ops/run_eea_csf_calls123_proof.py

      - name: Enforce proof boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/partener-eu-eea-csf-calls123-proof')
          summary=json.loads((root/'proof-summary.json').read_text(encoding='utf-8'))
          assert set(summary)=={'1','2','3'}
          for call_id,row in summary.items():
              boundary=row['boundary']; history=row['history']
              assert boundary['official_call_identifier']==call_id
              assert boundary['source_health_state']=='HEALTHY'
              assert boundary['candidate_state']=='OPEN_CALL'
              assert boundary['open_call_authorized'] is False
              assert boundary['publication_effect']=='NONE'
              assert history['selected']=='CURRENT_HEALTHY'
              assert history['lkg_is_current_truth'] is False
          print({'calls': sorted(summary), 'material_authorization': False, 'publication_effect': 'NONE'})
          PY

      - name: Upload replayable Calls 1-3 exact proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-eea-csf-calls123-exact-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-eea-csf-calls123-proof
          if-no-files-found: warn
          retention-days: 7
