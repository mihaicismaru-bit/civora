name: LOCAL NEWS OS Native Metrics Debug

on:
  pull_request:
    paths:
      - "local-news-os/social/native_metrics_transport.py"
      - "local-news-os/social/test_native_metrics_transport.py"
      - "local-news-os/social/native_metrics_transport_debug.py"
      - ".github/workflows/local-news-os-native-metrics-debug.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Diagnose native metrics transport tests
        run: python local-news-os/social/native_metrics_transport_debug.py
