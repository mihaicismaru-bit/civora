name: PARTENER.EU Production Validation

on:
  push:
    branches: [main]
    paths:
      - 'partener-eu/**'
      - '.github/workflows/partener-eu-validation.yml'
      - '!partener-eu/validation/**'
      - '!partener-eu/deployment/**'
      - '!partener-eu/P10_ACCEPTANCE.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
      timezone: 'Europe/Bucharest'
  # GITHUB_TOKEN commits made by autonomous ingestion workflows do not emit a
  # downstream push workflow. Workflows that already feed PARTENER.EU Pages
  # are validated through the Pages completion only, avoiding a pre-deploy and
  # post-deploy duplicate ledger for the same source run.
  workflow_run:
    workflows:
      - 'PARTENER.EU AFIR Ingestion'
      - 'PARTENER.EU Decision Products'
      - 'PARTENER.EU Verified Source Registry'
      - 'PARTENER.EU MFF 2028-2034 Monitor'
      - 'PARTENER.EU Pages'
    types: [completed]
    branches: [main]

concurrency:
  group: partener-eu-production-validation
  # Every run persists a shared validation/checkpoint ledger. Queue overlapping
  # triggers, and fail closed if another canonical writer advances main while
  # this run is collecting evidence. Never rebase generated evidence over a
  # newer code head.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    # A completed workflow_run also includes failed, cancelled and skipped runs.
    # Those outcomes carry no new canonical product state and must not create
    # another timestamp-only validation ledger commit.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run events retain the upstream workflow's head SHA even
          # while this job waits for the serialized ledger writer. Always
          # start from the latest canonical main before generating evidence.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Regenerate canonical data products
        id: regenerate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python partener-eu/ingest/build_mysmis_consultant_registry.py
          BUILD_REGISTRY_CODE=$?
          if [ "$BUILD_REGISTRY_CODE" != "0" ]; then
            exit "$BUILD_REGISTRY_CODE"
          fi
          python partener-eu/ingest/intelligence_index.py
          INTELLIGENCE_INDEX_CODE=$?
          if [ "$INTELLIGENCE_INDEX_CODE" != "0" ]; then
            exit "$INTELLIGENCE_INDEX_CODE"
          fi
          python partener-eu/p11/apply_resolutions.py
          APPLY_RESOLUTIONS_CODE=$?
          if [ "$APPLY_RESOLUTIONS_CODE" != "0" ]; then
            exit "$APPLY_RESOLUTIONS_CODE"
          fi
          python partener-eu/p11/build_public_projection.py
          exit $?

      - name: Unified product quality gate
        id: quality
        continue-on-error: true
        run: python partener-eu/ops/quality_gate.py

      - name: Recovery regression
        id: recovery
        continue-on-error: true
        run: python partener-eu/ops/test_recovery.py

      - name: Frontpage freeze and nonblank regression
        id: frontend
        continue-on-error: true
        run: python partener-eu/ops/test_frontend_regression.py

      - name: Decision-useful news and universal dossier regression
        id: editorial
        continue-on-error: true
        run: |
          node --check partener-eu/web/decision-intelligence-v2.js
          python partener-eu/ops/test_decision_products.py

      - name: Consultant Workspace v3 and MIPE resilient-ingestion regression
        id: intelligence_ui
        continue-on-error: true
        run: |
          python partener-eu/ops/fix_consultant_workspace_v3.py
          node --check partener-eu/web/consultant-workspace-v3.js
          node --check partener-eu/web/consultant-onboarding-v3.js
          node --check partener-eu/web/consultant-mysmis-v1.js
          node --check partener-eu/web/mysmis-registry.js
          python partener-eu/ops/test_consultant_workspace_v3.py
          python partener-eu/ops/test_mipe_resilient_ingest.py

      - name: P10 orchestration and fail-closed policy regression
        id: policy
        continue-on-error: true
        run: python partener-eu/ops/test_p10_policy_regression.py

      - name: Production Validation writer isolation regression
        id: validation_writer
        continue-on-error: true
        run: python partener-eu/ops/test_validation_writer_failclosed.py

      - name: AFIR authentication-boundary regression
        id: afir_policy
        continue-on-error: true
        run: python partener-eu/ops/test_afir_ingest_policy.py

      - name: Public HTTPS transport gate regression
        id: public_transport
        continue-on-error: true
        run: python partener-eu/ops/test_public_site_transport.py

      - name: Live source and frontend validation
        id: validate
        shell: bash
        run: |
          set +e
          python partener-eu/ops/p10_validate.py
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist source hash resolution tasks
        id: resolution
        shell: bash
        run: |
          set +e
          python partener-eu/ops/p10_resolution_tasks.py
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Aggregate T1/T1B and monitor integrity evidence
        id: integrity
        shell: bash
        run: |
          set +e
          python partener-eu/ops/p10_monitor_integrity.py
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify public document and critical boot assets
        id: deployment
        shell: bash
        run: |
          set +e
          python partener-eu/ops/check_public_site.py
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Synchronize P10 acceptance ledger
        id: acceptance
        shell: bash
        run: |
          set +e
          python partener-eu/ops/p10_acceptance_sync.py
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist validation ledger and safe source corrections
        if: ${{ always() && steps.validate.outcome == 'success' && steps.validate.outputs.exit_code != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "civora-validation-bot"
          git config user.email "civora-validation-bot@users.noreply.github.com"
          git add \
            partener-eu/validation \
            partener-eu/P10_ACCEPTANCE.json \
            partener-eu/ingest/state/intelligence_index.json \
            partener-eu/p11/opportunity_bundle.json \
            partener-eu/web/p11-public-data.js \
            partener-eu/web/consultant-workspace-v3.js \
            partener-eu/web/mysmis-registry.js

          unexpected="$(git diff --cached --name-only | grep -Ev '^(partener-eu/validation/|partener-eu/P10_ACCEPTANCE\.json$|partener-eu/ingest/state/intelligence_index\.json$|partener-eu/p11/opportunity_bundle\.json$|partener-eu/web/p11-public-data\.js$|partener-eu/web/consultant-workspace-v3\.js$|partener-eu/web/mysmis-registry\.js$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "FAIL validation persistence escaped allowlist:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 2
          fi

          git fetch origin main
          local_head="$(git rev-parse HEAD)"
          remote_main="$(git rev-parse origin/main)"
          if [ "$local_head" != "$remote_main" ]; then
            echo "FAIL canonical main moved during validation: checkout=$local_head remote=$remote_main" >&2
            exit 2
          fi

          if ! git diff --cached --quiet; then
            git commit -m "PARTENER.EU validation ledger $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # A concurrent main update must fail non-fast-forward. Never rebase
            # generated evidence over a newer code or evidence head.
            git push origin HEAD:main
          fi

      - name: Enforce fail-closed health after evidence persistence
        if: always()
        shell: bash
        env:
          REGENERATE_OUTCOME: ${{ steps.regenerate.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          EDITORIAL_OUTCOME: ${{ steps.editorial.outcome }}
          INTELLIGENCE_UI_OUTCOME: ${{ steps.intelligence_ui.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          VALIDATION_WRITER_OUTCOME: ${{ steps.validation_writer.outcome }}
          AFIR_POLICY_OUTCOME: ${{ steps.afir_policy.outcome }}
          PUBLIC_TRANSPORT_OUTCOME: ${{ steps.public_transport.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          VALIDATE_CODE: ${{ steps.validate.outputs.exit_code }}
          RESOLUTION_CODE: ${{ steps.resolution.outputs.exit_code }}
          INTEGRITY_CODE: ${{ steps.integrity.outputs.exit_code }}
          DEPLOYMENT_CODE: ${{ steps.deployment.outputs.exit_code }}
          ACCEPTANCE_CODE: ${{ steps.acceptance.outputs.exit_code }}
        run: |
          FAIL=0
          if [ "$REGENERATE_OUTCOME" != "success" ]; then FAIL=2; fi
          for OUTCOME in "$RECOVERY_OUTCOME" "$FRONTEND_OUTCOME" "$EDITORIAL_OUTCOME" "$INTELLIGENCE_UI_OUTCOME" "$POLICY_OUTCOME" "$VALIDATION_WRITER_OUTCOME" "$AFIR_POLICY_OUTCOME" "$PUBLIC_TRANSPORT_OUTCOME" "$QUALITY_OUTCOME"; do
            if [ "$OUTCOME" != "success" ]; then FAIL=2; fi
          done
          for CODE in "$VALIDATE_CODE" "$RESOLUTION_CODE" "$INTEGRITY_CODE" "$DEPLOYMENT_CODE" "$ACCEPTANCE_CODE"; do
            if [ "${CODE:-2}" != "0" ]; then FAIL=2; fi
          done
          exit "$FAIL"
