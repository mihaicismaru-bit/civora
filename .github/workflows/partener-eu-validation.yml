name: PARTENER.EU Production Validation
on:
  push:
    branches: [main]
    paths:
      - 'partener-eu/**'
      - '.github/workflows/partener-eu-validation.yml'
      - '!partener-eu/validation/**'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
      timezone: 'Europe/Bucharest'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recovery regression
        run: python partener-eu/ops/test_recovery.py
      - name: Live source + frontend validation
        id: validate
        shell: bash
        run: |
          set +e
          python partener-eu/ops/p10_validate.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Public deployment health
        run: python partener-eu/ops/check_public_site.py
      - name: Persist validation ledger
        shell: bash
        run: |
          git config user.name "civora-validation-bot"
          git config user.email "civora-validation-bot@users.noreply.github.com"
          git add partener-eu/validation
          if ! git diff --cached --quiet; then
            git commit -m "PARTENER.EU validation ledger $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      - name: Enforce fail-closed health
        if: steps.validate.outputs.exit_code != '0'
        run: exit ${{ steps.validate.outputs.exit_code }}
