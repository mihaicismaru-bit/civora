name: PARTENER.EU P11 Branch Cleanup TEMP

on:
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/p11/**'
      - '.github/workflows/partener-eu-p11-artifact-refresh-temp.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-p11-branch-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore decision-product artifacts from current main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            partener-eu/ingest/state/decision_products.json \
            partener-eu/web/decision-products.js
          git config user.name "civora-partener-bot"
          git config user.email "civora-partener-bot@users.noreply.github.com"
          git add \
            partener-eu/ingest/state/decision_products.json \
            partener-eu/web/decision-products.js
          if git diff --cached --quiet; then
            echo "Decision-product artifacts already match main."
            exit 0
          fi
          git commit -m "PARTENER: preserve current decision-product corpus"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
