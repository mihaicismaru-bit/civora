name: PARTENER.EU PEO Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/peo_calendar_ingest.py'
      - '.github/workflows/partener-eu-peo-calendar.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-peo-calendar
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install spreadsheet parser
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Ingest and version official PEO calendar
        run: python partener-eu/ingest/peo_calendar_ingest.py

      - name: Persist calendar feed conflict-safe
        shell: bash
        run: |
          set -e
          cp partener-eu/web/peo-calendar.js /tmp/peo-calendar.js
          cp partener-eu/ingest/state/peo_calendar_state.json /tmp/peo_calendar_state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/peo-calendar.js partener-eu/web/peo-calendar.js
          cp /tmp/peo_calendar_state.json partener-eu/ingest/state/peo_calendar_state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partener-eu/web/peo-calendar.js partener-eu/ingest/state/peo_calendar_state.json
          if git diff --cached --quiet; then
            echo 'No PEO calendar changes.'
            exit 0
          fi
          git commit -m 'Ingest PEO calendar version'
          git push origin HEAD:main
