name: VÂLCEA CLAR Facebook Distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "valcea-clar/social/**"
      - ".github/workflows/valcea-clar-facebook.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: valcea-clar-facebook-distribution
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Self-test distributor
        run: python valcea-clar/social/facebook_publish.py --self-test

      - name: Preview eligible Facebook posts
        run: python valcea-clar/social/facebook_publish.py

      - name: Publish eligible Facebook posts
        if: github.event_name != 'pull_request'
        env:
          VALCEA_FB_PAGE_ID: "1234360446430980"
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
        run: python valcea-clar/social/facebook_publish.py --apply

      - name: Persist Facebook publication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="valcea-clar/social/facebook_state.json"
          if git diff --quiet -- "$file"; then
            echo "No Facebook publication-state changes."
            exit 0
          fi
          cp "$file" /tmp/facebook_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/facebook_state.json "$file"
            git add "$file"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record VÂLCEA CLAR Facebook publication state"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Unable to persist Facebook state after five attempts." >&2
          exit 1
