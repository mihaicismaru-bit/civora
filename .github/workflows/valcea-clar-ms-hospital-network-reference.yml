name: VÂLCEA CLAR MS Hospital Network Reference

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/ms_valcea_hospital_network_reference_adapter.py'
      - '.github/workflows/valcea-clar-ms-hospital-network-reference.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/ms_valcea_hospital_network_reference_adapter.py'
      - '.github/workflows/valcea-clar-ms-hospital-network-reference.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-ms-hospital-network-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile Ministry hospital network adapter
        run: python -m py_compile valcea-clar/scripts/ms_valcea_hospital_network_reference_adapter.py
      - name: Run Ministry hospital network fail-closed regressions
        run: python valcea-clar/scripts/ms_valcea_hospital_network_reference_adapter.py --self-test
