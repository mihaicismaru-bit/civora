name: PARTENER.EU EUI Innovation Fund Programme Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eui_innovation_fund_programme_intelligence_registry.json'
      - 'partener-eu/ingest/eui_innovation_fund_programme_intelligence.py'
      - 'partener-eu/ops/test_eui_innovation_fund_programme_intelligence.py'
      - '.github/workflows/partener-eu-eui-innovation-fund-programme-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eui-innovation-fund-programme-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded adapter and regression
        run: |
          python -m json.tool partener-eu/ingest/eui_innovation_fund_programme_intelligence_registry.json >/dev/null
          python -m py_compile \
            partener-eu/ingest/eui_innovation_fund_programme_intelligence.py \
            partener-eu/ops/test_eui_innovation_fund_programme_intelligence.py

      - name: Validate fail-closed programme intelligence semantics
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: python partener-eu/ops/test_eui_innovation_fund_programme_intelligence.py

      - name: Acquire fresh official EUI and Innovation Fund intelligence
        run: |
          ROOT=/tmp/partener-eu-eui-innovation-fund-programme-proof
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          python partener-eu/ingest/eui_innovation_fund_programme_intelligence.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --live \
            --output "$ROOT/eui-innovation-fund-programme-intelligence.json"
          cp partener-eu/ingest/eui_innovation_fund_programme_intelligence_registry.json "$ROOT/registry.json"

      - name: Enforce live non-authorizing boundary and provenance
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          p=Path('/tmp/partener-eu-eui-innovation-fund-programme-proof/eui-innovation-fund-programme-intelligence.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema'] == 'PARTENER_EU_EUI_INNOVATION_FUND_PROGRAMME_INTELLIGENCE_V1'
          assert d['source_family'] == 'EU_DIRECT'
          assert set(d['programme_families']) == {'European Urban Initiative','Innovation Fund'}
          assert d['source_count'] == 5
          assert len(d['sources']) == 5
          assert len(d['programme_intelligence']) == 2
          assert d['market_intelligence_only'] is True
          assert d['fit_scores_are_not_eligibility'] is True
          assert d['publication_effect'] == 'NONE'
          flags=(
              'material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized',
              'budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized',
              'call_alert_authorized','canonical_corpus_mutation',
          )
          assert all(d[k] is False for k in flags)
          assert d['exact_call_or_topic_identifier_required'] is True
          assert d['current_official_exact_endpoint_required'] is True
          assert d['semantic_reconciliation_required'] is True
          assert d['field_scoped_material_admission_required'] is True
          assert re.fullmatch(r'[0-9a-f]{64}', d['registry_sha256'])
          assert re.fullmatch(r'[0-9a-f]{64}', d['semantic_fingerprint'])
          states={}
          for source in d['sources']:
              assert source['observation_state'] in {'PROGRAMME_INTELLIGENCE','CALL_INDEX_DISCOVERY'}
              assert source['material_fact_use'] is False
              assert re.fullmatch(r'[0-9a-f]{64}', source['source_semantic_fingerprint'])
              health=source['source_health']
              states[source['source_id']]=health['health_state']
              if health['health_state'] == 'HEALTHY':
                  assert health['http_status'] == 200
                  assert health['lkg_required'] is False
                  assert re.fullmatch(r'[0-9a-f]{64}', health['raw_sha256'])
              else:
                  assert str(health['health_state']).startswith('DEGRADED')
                  assert health['lkg_required'] is True
          for row in d['programme_intelligence']:
              assert row['market_intelligence_only'] is True
              assert row['fit_score_is_not_eligibility'] is True
              assert 0 <= row['fit_score'] <= 1
          print(json.dumps({
              'source_health':states,
              'healthy_source_count':d['healthy_source_count'],
              'degraded_source_count':d['degraded_source_count'],
              'semantic_fingerprint':d['semantic_fingerprint'],
              'open_call_authorized':False,
              'publication_effect':'NONE',
          }, sort_keys=True))
          PY

      - name: Upload bounded replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: partener-eu-eui-innovation-fund-programme-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-eui-innovation-fund-programme-proof
          if-no-files-found: error
          retention-days: 7
