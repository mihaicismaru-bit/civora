name: TEMP Stage validated social metrics authorization seal patch

on:
  push:
    branches:
      - automation/social-metrics-auth-seal-20260817-1441
    paths:
      - ".github/workflows/_tmp-social-metrics-auth-seal-stage.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/social-metrics-auth-seal-20260817-1441
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reapply the already validated scoped patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/_tmp-social-metrics-auth-seal-apply-v2.yml').read_text(encoding='utf-8')
          start_token = "          python - <<'PY'\n"
          end_token = "\n          PY\n\n      - name: Validate patched authorization boundary"
          start = source.index(start_token) + len(start_token)
          end = source.index(end_token, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<authorization-seal-v2-patch>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Revalidate patched authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            local-news-os/social/fleet_metrics_authorization_seal.py \
            local-news-os/social/test_fleet_metrics_authorization_seal.py
          python local-news-os/social/test_fleet_metrics_credential_binding.py
          python local-news-os/social/test_fleet_metrics_authorization_seal.py
          git diff --check

      - name: Commit code plus staged workflow blob without mutating workflow path
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/valcea-clar-observed-metrics-harvest.yml \
             local-news-os/social/_staged_valcea_observed_metrics_harvest.yml
          git checkout -- .github/workflows/valcea-clar-observed-metrics-harvest.yml
          git config user.name "civora-social-automation[bot]"
          git config user.email "civora-social-automation@users.noreply.github.com"
          git add local-news-os/social/fleet_metrics_authorization_seal.py \
                  local-news-os/social/test_fleet_metrics_authorization_seal.py \
                  local-news-os/social/_staged_valcea_observed_metrics_harvest.yml
          git commit -m "Stage validated metrics authorization seal"
          git push origin HEAD:automation/social-metrics-auth-seal-20260817-1441
