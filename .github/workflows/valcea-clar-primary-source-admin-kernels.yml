name: VÂLCEA CLAR Primary Source Kernels

# One primary-source control plane owns both administration and non-HCL service
# kernels. Both builders mutate the same facts registry, so they must run in one
# transaction and persist once instead of racing two 30-minute workflows.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/primary_source_admin_kernels.py'
      - 'valcea-clar/scripts/primary_source_service_kernels.py'
      - '.github/workflows/valcea-clar-primary-source-admin-kernels.yml'
  pull_request:
    paths:
      - 'valcea-clar/scripts/primary_source_admin_kernels.py'
      - 'valcea-clar/scripts/primary_source_service_kernels.py'
      - '.github/workflows/valcea-clar-primary-source-admin-kernels.yml'
  schedule:
    - cron: '9,39 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: valcea-clar-primary-source-kernels-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Refresh newest canonical state
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate both primary-source builders
        run: |
          python -m py_compile \
            valcea-clar/scripts/primary_source_admin_kernels.py \
            valcea-clar/scripts/primary_source_service_kernels.py
          python valcea-clar/scripts/primary_source_admin_kernels.py --self-test
          python valcea-clar/scripts/primary_source_service_kernels.py --self-test

      - name: Materialize verified service and administration kernels
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python valcea-clar/scripts/primary_source_service_kernels.py --apply
          python valcea-clar/scripts/primary_source_admin_kernels.py --apply
          python valcea-clar/scripts/editorial_writer.py --check

      - name: Validate builders against PR fixtures
        if: github.event_name == 'pull_request'
        run: python valcea-clar/scripts/editorial_writer.py --check

      - name: Persist verified primary-source kernels once
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- valcea-clar/editorial/facts_registry.json; then
            echo 'No verified primary-source kernel change.'
            exit 0
          fi

          cp valcea-clar/editorial/facts_registry.json /tmp/valcea-primary-source-facts.json
          git config user.name 'vâlcea-clar-primary-source[bot]'
          git config user.email 'valcea-clar-primary-source@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/valcea-primary-source-facts.json valcea-clar/editorial/facts_registry.json
            git add valcea-clar/editorial/facts_registry.json
            if git diff --cached --quiet; then
              echo 'Verified primary-source kernels already present on main.'
              exit 0
            fi
            git commit -m 'Refresh VÂLCEA CLAR primary-source kernels'
            if git push origin HEAD:main; then exit 0; fi
            echo "main advanced during primary-source persistence; retrying ${attempt}/5."
            sleep $((attempt * 2))
          done
          echo 'Could not persist primary-source kernels conflict-safe.' >&2
          exit 1

      - name: Dispatch canonical Live Newsroom once
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run valcea-clar-newsroom-live.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Live Newsroom dispatch accepted.'
