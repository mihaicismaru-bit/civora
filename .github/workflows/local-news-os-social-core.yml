name: LOCAL NEWS OS Social Core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/social/**"
      - "valcea-clar/social/channels/**"
      - "valcea-clar/social/channel_registry.json"
      - "valcea-clar/social/*_publish.py"
      - "valcea-clar/social/series_registry.json"
      - ".github/workflows/local-news-os-social-core.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/social/**"
      - "valcea-clar/social/channels/**"
      - "valcea-clar/social/channel_registry.json"
      - "valcea-clar/social/*_publish.py"
      - "valcea-clar/social/series_registry.json"
      - ".github/workflows/local-news-os-social-core.yml"

permissions:
  contents: read

concurrency:
  group: local-news-os-social-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile dependency-free social core
        run: |
          python -m py_compile \
            local-news-os/social/validate_channel_config.py \
            local-news-os/social/channel_fit.py \
            local-news-os/social/content_atomizer.py \
            local-news-os/social/hook_engine.py \
            local-news-os/social/format_engine.py \
            local-news-os/social/visual_router.py \
            local-news-os/social/cadence_fatigue.py \
            local-news-os/social/recurring_series.py \
            local-news-os/social/virality_engine.py \
            local-news-os/social/publication_state.py \
            local-news-os/social/correction_propagation.py \
            local-news-os/social/observed_metrics.py \
            local-news-os/social/publishing_adapters.py \
            local-news-os/social/multi_instance_isolation.py \
            local-news-os/social/e2e_acceptance.py \
            local-news-os/social/production_runtime.py \
            local-news-os/social/adapter_dispatch_bridge.py \
            local-news-os/social/test_channel_fit.py \
            local-news-os/social/test_content_atomizer.py \
            local-news-os/social/test_hook_engine.py \
            local-news-os/social/test_format_engine.py \
            local-news-os/social/test_visual_router.py \
            local-news-os/social/test_cadence_fatigue.py \
            local-news-os/social/test_recurring_series.py \
            local-news-os/social/test_virality_engine.py \
            local-news-os/social/test_publication_state.py \
            local-news-os/social/test_correction_propagation.py \
            local-news-os/social/test_observed_metrics.py \
            local-news-os/social/test_publishing_adapters.py \
            local-news-os/social/test_multi_instance_isolation.py \
            local-news-os/social/test_e2e_acceptance.py \
            local-news-os/social/test_production_runtime.py \
            local-news-os/social/test_adapter_dispatch_bridge.py
          python -m json.tool local-news-os/social/observed_metrics.schema.json >/dev/null
          python -m json.tool local-news-os/social/social_runtime_registry.json >/dev/null

      - name: Run channel fit acceptance tests
        run: python local-news-os/social/test_channel_fit.py

      - name: Run content atomizer acceptance tests
        run: python local-news-os/social/test_content_atomizer.py

      - name: Run non-clickbait Hook Engine acceptance tests
        run: python local-news-os/social/test_hook_engine.py

      - name: Run native Format Engine acceptance tests
        run: python local-news-os/social/test_format_engine.py

      - name: Run fail-closed Visual Router acceptance tests
        run: python local-news-os/social/test_visual_router.py

      - name: Run Cadence/Fatigue acceptance tests
        run: python local-news-os/social/test_cadence_fatigue.py

      - name: Run Recurring Series Engine acceptance tests
        run: python local-news-os/social/test_recurring_series.py

      - name: Run deterministic Virality Engine acceptance tests
        run: python local-news-os/social/test_virality_engine.py

      - name: Run Publication State / Retry / Dedupe acceptance tests
        run: python local-news-os/social/test_publication_state.py

      - name: Run Correction Propagation acceptance tests
        run: python local-news-os/social/test_correction_propagation.py

      - name: Run Observed Metrics / Feedback Learning acceptance tests
        run: python local-news-os/social/test_observed_metrics.py

      - name: Run Publishing Adapter Contract acceptance tests
        run: python local-news-os/social/test_publishing_adapters.py

      - name: Run Multi-Instance Isolation acceptance tests
        run: python local-news-os/social/test_multi_instance_isolation.py

      - name: Run end-to-end Social Runtime acceptance harness
        run: python local-news-os/social/test_e2e_acceptance.py

      - name: Run Production Runtime Orchestrator acceptance tests
        run: python local-news-os/social/test_production_runtime.py

      - name: Run Adapter-Gated Dispatch Bridge acceptance tests
        run: python local-news-os/social/test_adapter_dispatch_bridge.py

      - name: Validate Vâlcea reference CHANNEL_CONFIG fixtures
        run: |
          python local-news-os/social/validate_channel_config.py \
            valcea-clar/social/channels/facebook.json \
            --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py \
            valcea-clar/social/channels/instagram.json \
            --instance-root valcea-clar
          python local-news-os/social/validate_channel_config.py \
            valcea-clar/social/channels/tiktok.json \
            --instance-root valcea-clar

      - name: Validate Vâlcea publishing adapter registry
        run: |
          python local-news-os/social/publishing_adapters.py \
            valcea-clar/social/channel_registry.json \
            --repo-root . \
            --instance-root valcea-clar

      - name: Validate social runtime fleet isolation
        run: |
          python local-news-os/social/multi_instance_isolation.py \
            local-news-os/social/social_runtime_registry.json \
            --repo-root .

      - name: Validate Vâlcea recurring series registry against declared channel series
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          module_path = Path('local-news-os/social/recurring_series.py')
          spec = importlib.util.spec_from_file_location('recurring_series', module_path)
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)

          registry = json.loads(Path('valcea-clar/social/series_registry.json').read_text(encoding='utf-8'))
          for platform in ('facebook', 'instagram', 'tiktok'):
              channel = json.loads(Path(f'valcea-clar/social/channels/{platform}.json').read_text(encoding='utf-8'))
              policies, errors = mod.channel_policies(channel, registry)
              if errors:
                  raise SystemExit(f'{platform}: {errors}')
              if not policies:
                  raise SystemExit(f'{platform}: no recurring series policies')
              print(f'{platform}: PASS ({len(policies)} series)')
          PY
