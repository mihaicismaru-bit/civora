name: VÂLCEA CLAR Instagram Backlog

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/site/story_publication_event.json'
      - 'valcea-clar/site/newsroom_decision.json'
      - 'valcea-clar/editions/**'
      - 'valcea-clar/social/instagram_fact_card_publish_v2.py'
      - '.github/workflows/valcea-clar-instagram-backlog.yml'
  pull_request:
    paths:
      - 'valcea-clar/social/instagram_fact_card_publish_v2.py'
      - '.github/workflows/valcea-clar-instagram-backlog.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-instagram-text-delivery
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Refresh canonical main
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Validate Instagram backlog contract
        run: |
          python -m py_compile valcea-clar/social/instagram_fact_card_publish_v2.py
          python valcea-clar/social/story_social_policy.py --self-test
          python valcea-clar/social/instagram_fact_card_publish_v2.py --self-test
      - name: Preview unpublished canonical stories
        run: python valcea-clar/social/instagram_fact_card_publish_v2.py | tee /tmp/instagram-backlog-preview.json
      - name: Resolve Meta/Instagram identity
        id: meta_auth
        if: github.event_name != 'pull_request'
        env:
          VALCEA_FB_PAGE_ID: '1234360446430980'
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
        run: python valcea-clar/social/meta_auth_health.py | tee /tmp/instagram-backlog-auth.json
      - name: Publish or stage next Instagram verified fact card
        if: github.event_name != 'pull_request'
        env:
          VALCEA_IG_ACCOUNT_ID: ${{ steps.meta_auth.outputs.ig_account_id || vars.VALCEA_IG_ACCOUNT_ID }}
          VALCEA_IG_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN || secrets.VALCEA_IG_ACCESS_TOKEN || secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_IG_GRAPH_VERSION: v26.0
          VALCEA_IG_GRAPH_HOST: graph.facebook.com
          VALCEA_IG_TEXT_CARD_LIVE_ENABLED: 'true'
          VALCEA_IG_TEXT_CARD_MAX_PER_RUN: '1'
        run: python valcea-clar/social/instagram_fact_card_publish_v2.py --apply | tee /tmp/instagram-backlog-apply.json
      - name: Persist Instagram state and generated fact card
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/social/instagram_state.json /tmp/instagram-backlog-state.json
          rm -rf /tmp/instagram-backlog-media
          if [ -d valcea-clar/site/runtime/media/social/editorial/instagram-text ]; then
            cp -a valcea-clar/site/runtime/media/social/editorial/instagram-text /tmp/instagram-backlog-media
          fi
          git config user.name 'valcea-clar-instagram-backlog[bot]'
          git config user.email 'valcea-clar-instagram-backlog@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/instagram-backlog-state.json valcea-clar/social/instagram_state.json
            if [ -d /tmp/instagram-backlog-media ]; then
              mkdir -p valcea-clar/site/runtime/media/social/editorial/instagram-text
              cp -a /tmp/instagram-backlog-media/. valcea-clar/site/runtime/media/social/editorial/instagram-text/
            fi
            git add valcea-clar/social/instagram_state.json
            git add -A valcea-clar/site/runtime/media/social/editorial/instagram-text || true
            if git diff --cached --quiet; then
              echo 'Instagram delivery state already current.'
              exit 0
            fi
            git commit -m 'Persist VÂLCEA CLAR Instagram story delivery'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
