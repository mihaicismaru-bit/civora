name: PARTENER.EU Interreg RO-RS Planned Calls Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/interreg_ro_rs_calls_planning.py'
      - 'partener-eu/ingest/interreg_ro_rs_calls_planning_reconcile.py'
      - 'partener-eu/ops/test_interreg_ro_rs_calls_planning.py'
      - 'partener-eu/ops/test_interreg_ro_rs_calls_planning_reconcile.py'
      - '.github/workflows/partener-eu-interreg-ro-rs-calls-planning-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ro-rs-planned-calls-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile and regress fail-closed planned-calls adapter and reconciliation
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          python -m py_compile \
            partener-eu/ingest/interreg_ro_rs_calls_planning.py \
            partener-eu/ingest/interreg_ro_rs_calls_planning_reconcile.py \
            partener-eu/ops/test_interreg_ro_rs_calls_planning.py \
            partener-eu/ops/test_interreg_ro_rs_calls_planning_reconcile.py
          python partener-eu/ops/test_interreg_ro_rs_calls_planning.py
          python partener-eu/ops/test_interreg_ro_rs_calls_planning_reconcile.py

      - name: Restore previous HEALTHY same-branch planning receipt
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ro-rs-calls-planning
          mkdir -p "$ROOT/history" /tmp/partener-ro-rs-history-scratch
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$ROOT/history/artifacts.json"
          python - <<'PY' > /tmp/partener-ro-rs-history-candidates.tsv
          import json, os
          path='/tmp/partener-eu-ro-rs-calls-planning/history/artifacts.json'
          data=json.load(open(path, encoding='utf-8'))
          branch=(os.environ.get('EXPECTED_BRANCH') or '').strip()
          current=int(os.environ['GITHUB_RUN_ID'])
          prefix='partener-eu-interreg-ro-rs-calls-planning-'
          rows=[]
          for artifact in data.get('artifacts') or []:
              name=str(artifact.get('name') or '')
              if not name.startswith(prefix) or artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              run_id=int(run.get('id') or 0)
              if not run_id or run_id == current:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              rows.append((str(artifact.get('created_at') or ''), run_id, name))
          for _, run_id, name in sorted(rows, reverse=True):
              print(f'{run_id}\t{name}')
          PY

          FOUND=0
          while IFS=$'\t' read -r RUN_ID ARTIFACT_NAME; do
            [ -n "$RUN_ID" ] || continue
            SCRATCH="/tmp/partener-ro-rs-history-scratch/$RUN_ID"
            rm -rf "$SCRATCH"
            mkdir -p "$SCRATCH"
            if gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir "$SCRATCH" >/dev/null 2>&1; then
              CANDIDATE="$SCRATCH/interreg-ro-rs-calls-planning.json"
              if [ -f "$CANDIDATE" ]; then
                if PYTHONPATH=partener-eu/ingest python - "$CANDIDATE" <<'PY'
          import json, sys
          import interreg_ro_rs_calls_planning as src
          path=sys.argv[1]
          data=json.load(open(path, encoding='utf-8'))
          src.validate(data)
          assert data['source_health_state'] == 'HEALTHY'
          assert data['authority_url'] == src.INDEX_URL
          assert data['programme_family'] == src.PROGRAMME_FAMILY
          assert data['semantic_fingerprint']
          PY
                then
                  cp "$CANDIDATE" "$ROOT/history/previous.json"
                  printf '%s\n' "$RUN_ID" > "$ROOT/history/previous-run-id.txt"
                  printf '%s\n' "$ARTIFACT_NAME" > "$ROOT/history/previous-artifact-name.txt"
                  FOUND=1
                  break
                fi
              fi
            fi
          done < /tmp/partener-ro-rs-history-candidates.tsv
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "previous_restore_found=$FOUND"

      - name: Acquire latest official RO-RS planned-calls calendar
        run: |
          ROOT=/tmp/partener-eu-ro-rs-calls-planning
          rm -rf "$ROOT/current"
          python partener-eu/ingest/interreg_ro_rs_calls_planning.py \
            --output-dir "$ROOT/current" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Reconcile current planning calendar against strictly older same-identity history
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          ROOT=/tmp/partener-eu-ro-rs-calls-planning
          ARGS=("$ROOT/current/interreg-ro-rs-calls-planning.json" --output "$ROOT/reconciliation.json")
          if [ -f "$ROOT/history/previous.json" ]; then
            ARGS+=(--previous "$ROOT/history/previous.json")
          fi
          python partener-eu/ingest/interreg_ro_rs_calls_planning_reconcile.py "${ARGS[@]}"

      - name: Enforce current HEALTHY semantic-neutral replay boundary
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import urllib.parse

          root='/tmp/partener-eu-ro-rs-calls-planning'
          data=json.load(open(root+'/current/interreg-ro-rs-calls-planning.json', encoding='utf-8'))
          rec=json.load(open(root+'/reconciliation.json', encoding='utf-8'))
          assert data['source_health_state'] == 'HEALTHY', data
          assert data['observation_state'] == 'PLANNED', data
          assert data['market_intelligence_only'] is True
          assert data['planning_evidence_non_authorizing'] is True
          assert data['lkg_required'] is False
          calendar=data['latest_calendar']
          assert calendar and calendar['calendar_url'].endswith('.xlsx'), calendar
          assert urllib.parse.urlparse(calendar['calendar_url']).hostname in {'romania-serbia.net','www.romania-serbia.net'}
          assert dt.date.fromisoformat(calendar['calendar_date']) >= dt.date(2026, 6, 9), calendar
          assert calendar['workbook_sha256'] and calendar['nonempty_cell_count'] > 0, calendar
          assert rec['previous_present'] is True, rec
          assert rec['reconciliation_state'] == 'NO_CHANGE', rec
          assert rec['semantic_change_count'] == 0, rec
          assert rec['history_state'] == 'CURRENT_HEALTHY', rec
          assert rec['lkg_is_current_truth'] is False
          for payload in (data, rec):
              for flag in (
                  'material_fact_use','open_call_authorized','closed_call_authorized',
                  'deadline_authorized','budget_authorized','eligibility_authorized',
                  'publish_authorized','distribution_authorized','call_alert_authorized',
                  'canonical_corpus_mutation',
              ):
                  assert payload[flag] is False, (flag, payload[flag])
              assert payload['publication_effect'] == 'NONE'
          print({
              'calendar_date': calendar['calendar_date'],
              'calendar_url': calendar['calendar_url'],
              'sheet_count': calendar['sheet_count'],
              'nonempty_cell_count': calendar['nonempty_cell_count'],
              'semantic_fingerprint': data['semantic_fingerprint'],
              'previous_fetched_at': rec['previous_fetched_at'],
              'reconciliation_state': rec['reconciliation_state'],
          })
          PY

      - name: Stage proof evidence even on strict-gate failure
        if: always()
        run: |
          ROOT=/tmp/partener-eu-ro-rs-calls-planning
          ART=/tmp/partener-eu-ro-rs-calls-planning-artifact
          rm -rf "$ART"
          mkdir -p "$ART"
          if [ -d "$ROOT/current" ]; then
            cp -a "$ROOT/current/." "$ART/"
          fi
          [ -f "$ROOT/reconciliation.json" ] && cp "$ROOT/reconciliation.json" "$ART/reconciliation.json" || true
          if [ -d "$ROOT/history" ]; then
            mkdir -p "$ART/history"
            cp -a "$ROOT/history/." "$ART/history/" || true
          fi
          printf '%s\n' "${GITHUB_SHA}" > "$ART/exact-head.txt"

      - name: Upload bounded proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-eu-interreg-ro-rs-calls-planning-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/partener-eu-ro-rs-calls-planning-artifact
          if-no-files-found: error
          retention-days: 7
