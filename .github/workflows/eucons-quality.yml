name: EUCONS Quality

on:
  pull_request:
    paths:
      - 'eucons/**'
      - '.github/workflows/eucons-quality.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/**'
      - '.github/workflows/eucons-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate EUCONS bootstrap contracts
        run: python eucons/validation/validate_bootstrap.py
      - name: Validate EUCONS commercial canon
        run: python eucons/validation/validate_commercial_canon.py
      - name: Validate EUCONS service registry
        run: python eucons/validation/validate_service_registry.py
      - name: Validate EUCONS evidence base
        run: python eucons/validation/validate_evidence_base.py
      - name: Test EUCONS evidence fail-closed behavior
        run: python eucons/validation/test_evidence_fail_closed.py
      - name: Validate EUCONS people registry
        run: python eucons/validation/validate_people_registry.py
      - name: Test EUCONS people fail-closed behavior
        run: python eucons/validation/test_people_fail_closed.py
      - name: Validate EUCONS case-study registry
        run: python eucons/validation/validate_case_study_registry.py
      - name: Test EUCONS case-study fail-closed behavior
        run: python eucons/validation/test_case_study_fail_closed.py
      - name: Validate EUCONS information architecture
        run: python eucons/validation/validate_information_architecture.py
      - name: Test EUCONS information architecture regressions
        run: python eucons/validation/test_information_architecture.py
      - name: Validate EUCONS design system
        run: python eucons/validation/validate_design_system.py
      - name: Test EUCONS design system regressions
        run: python eucons/validation/test_design_system.py
      - name: Validate EUCONS public site
        run: python eucons/validation/validate_public_site.py
      - name: Test EUCONS public-site fail-closed behavior
        run: python eucons/validation/test_public_site_fail_closed.py
      - name: Build EUCONS static public site
        run: python eucons/web/build_public_site.py --target /tmp/eucons-site
      - name: Validate EUCONS opportunity bridge
        run: python eucons/validation/validate_opportunity_bridge.py
      - name: Test EUCONS opportunity bridge fail-closed behavior
        run: python eucons/validation/test_opportunity_bridge_fail_closed.py
      - name: Materialize EUCONS stale-safe opportunity projection
        run: python eucons/opportunities/build_projection.py --reference-time 2026-08-19T10:00:00Z --output /tmp/eucons-opportunity-projection.json
      - name: Validate EUCONS opportunity matching
        run: python eucons/validation/validate_opportunity_matching.py
      - name: Test EUCONS opportunity matching fail-closed behavior
        run: python eucons/validation/test_opportunity_matching_fail_closed.py
      - name: Validate EUCONS lead engine
        run: python eucons/validation/validate_lead_engine.py
      - name: Test EUCONS lead engine fail-closed behavior
        run: python eucons/validation/test_lead_engine_fail_closed.py
      - name: Validate EUCONS CRM Lite
        run: python eucons/validation/validate_crm_lite.py
      - name: Test EUCONS CRM Lite fail-closed behavior
        run: python eucons/validation/test_crm_lite_fail_closed.py
      - name: Validate EUCONS Offer Engine
        run: python eucons/validation/validate_offer_engine.py
      - name: Test EUCONS Offer Engine fail-closed behavior
        run: python eucons/validation/test_offer_engine_fail_closed.py
      - name: Validate EUCONS Knowledge Engine
        run: python eucons/validation/validate_knowledge_engine.py
      - name: Test EUCONS Knowledge Engine fail-closed behavior
        run: python eucons/validation/test_knowledge_engine_fail_closed.py
      - name: Validate EUCONS Autonomous Editorial Loop
        run: python eucons/validation/validate_editorial_loop.py
      - name: Test EUCONS Autonomous Editorial Loop fail-closed behavior
        run: python eucons/validation/test_editorial_loop_fail_closed.py
      - name: Validate EUCONS SEO Engine
        run: python eucons/validation/validate_seo_engine.py
      - name: Test EUCONS SEO Engine fail-closed behavior
        run: python eucons/validation/test_seo_engine_fail_closed.py
      - name: Validate EUCONS LinkedIn Adapter
        run: python eucons/validation/validate_linkedin_adapter.py
      - name: Test EUCONS LinkedIn Adapter fail-closed behavior
        run: python eucons/validation/test_linkedin_adapter_fail_closed.py
      - name: Validate EUCONS Facebook Adapter
        run: python eucons/validation/validate_facebook_adapter.py
      - name: Test EUCONS Facebook Adapter fail-closed behavior
        run: python eucons/validation/test_facebook_adapter_fail_closed.py
      - name: Reject committed secret-like assignments
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='*.md' --exclude='validate_bootstrap.py' '(API_KEY|ACCESS_TOKEN|CLIENT_SECRET|PASSWORD)[[:space:]]*=[[:space:]]*[A-Za-z0-9_./+-]{12,}' eucons; then
            echo 'Potential secret-like assignment committed under eucons/' >&2
            exit 1
          fi
