name: VÂLCEA CLAR Primary Source Service Kernels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/primary_source_service_kernels.py'
      - '.github/workflows/valcea-clar-primary-source-service-kernels.yml'
  schedule:
    - cron: '9,39 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: valcea-clar-primary-source-service-kernels
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate service-kernel builder
        run: |
          python -m py_compile valcea-clar/scripts/primary_source_service_kernels.py
          python valcea-clar/scripts/primary_source_service_kernels.py --self-test

      - name: Materialize verified non-HCL service stories
        run: python valcea-clar/scripts/primary_source_service_kernels.py --apply

      - name: Validate through canonical Editorial Writer
        run: python valcea-clar/scripts/editorial_writer.py --check

      - name: Persist verified service kernels
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- valcea-clar/editorial/facts_registry.json; then
            echo 'No verified service-kernel change.'
            exit 0
          fi

          cp valcea-clar/editorial/facts_registry.json /tmp/valcea-facts-registry.json
          git config user.name 'vâlcea-clar-primary-service[bot]'
          git config user.email 'valcea-clar-primary-service@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/valcea-facts-registry.json valcea-clar/editorial/facts_registry.json
            git add valcea-clar/editorial/facts_registry.json
            if git diff --cached --quiet; then
              echo 'Verified service kernel already present on main.'
              exit 0
            fi
            git commit -m 'Publish verified VÂLCEA CLAR primary-source service kernel'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during service-kernel persistence; retrying ${attempt}/5."
            sleep $((attempt * 2))
          done

          echo 'Could not persist verified service kernel conflict-safe.' >&2
          exit 1

      - name: Dispatch canonical Live Newsroom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commits created with GITHUB_TOKEN intentionally do not fan out into
          # new push-triggered workflow runs. Use workflow_dispatch, which GitHub
          # explicitly allows for chained workflow execution, so every verified
          # primary-source kernel reaches the canonical publication gate.
          gh workflow run valcea-clar-newsroom-live.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Live Newsroom dispatch accepted.'
