name: PUBLIC PRESENCE OS CI
on:
  pull_request:
    paths:
      - 'public-presence-os/**'
      - '.github/workflows/public-presence-os-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'public-presence-os/**'
      - '.github/workflows/public-presence-os-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: public-presence-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Deterministic test shard
        env:
          PYTHONPATH: src
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import subprocess
          import sys

          shard_index = int(os.environ["SHARD_INDEX"])
          shard_count = int(os.environ["SHARD_COUNT"])
          test_files = sorted(str(path) for path in Path("tests").rglob("test_*.py"))
          selected = [
              path
              for ordinal, path in enumerate(test_files)
              if ordinal % shard_count == shard_index
          ]
          if not test_files:
              raise SystemExit("PPOS_TEST_SHARD_NO_TEST_FILES")
          if not selected:
              raise SystemExit(f"PPOS_TEST_SHARD_EMPTY shard={shard_index}")
          print(
              f"PPOS_TEST_SHARD shard={shard_index}/{shard_count} "
              f"files={len(selected)} total_files={len(test_files)}"
          )
          subprocess.run(
              [sys.executable, "-m", "pytest", "-q", *selected],
              check=True,
              env=os.environ.copy(),
          )
          PY

  validate:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: public-presence-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q src
      - name: Validate product layout
        env:
          PYTHONPATH: src
        run: python -m public_presence_os.cli validate --root .
      - name: Reproducible package
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_release.py
          cp dist/public-presence-os-cp30-*.zip /tmp/first.zip
          rm -f dist/public-presence-os-cp30-*.zip
          python scripts/build_release.py
          cmp /tmp/first.zip dist/public-presence-os-cp30-*.zip
