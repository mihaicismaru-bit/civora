name: PUBLIC PRESENCE OS CI
on:
  pull_request:
    paths:
      - 'public-presence-os/**'
      - '.github/workflows/public-presence-os-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'public-presence-os/**'
      - '.github/workflows/public-presence-os-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-presence-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests
      - name: Validate product layout
        env:
          PYTHONPATH: src
        run: python -m public_presence_os.cli validate --root .
      - name: Reproducible package
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_release.py
          cp dist/public-presence-os-cp30-*.zip /tmp/first.zip
          rm -f dist/public-presence-os-cp30-*.zip
          python scripts/build_release.py
          cmp /tmp/first.zip dist/public-presence-os-cp30-*.zip
