name: PARTENER.EU P11 Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'partener-eu/p11/**'
      - 'partener-eu/ops/quality_gate.py'
      - '.github/workflows/partener-eu-p11.yml'
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/p11/**'
      - 'partener-eu/ops/quality_gate.py'
      - '.github/workflows/partener-eu-p11.yml'
  workflow_dispatch:

concurrency:
  group: partener-eu-p11-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Materialize verified resolution overlays on same-repo PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          python partener-eu/p11/apply_resolutions.py
          python partener-eu/p11/build_public_projection.py
          python partener-eu/p11/build_staging_ledger.py
          python partener-eu/ingest/build_decision_products.py
          git config user.name "civora-partener-bot"
          git config user.email "civora-partener-bot@users.noreply.github.com"
          git add \
            partener-eu/p11/opportunity_bundle.json \
            partener-eu/p11/staging_ledger.json \
            partener-eu/web/p11-public-data.js \
            partener-eu/ingest/state/decision_products.json \
            partener-eu/web/decision-products.js
          if ! git diff --cached --quiet; then
            git commit -m "PARTENER: materialize verified FAMI call artifacts"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Apply verified resolution overlays
        run: python partener-eu/p11/apply_resolutions.py --check
      - name: Build public fail-closed projection
        run: python partener-eu/p11/build_public_projection.py --check
      - name: Canonical contract and fail-closed policy regression
        run: python -m unittest discover -s partener-eu/p11 -p 'test_*.py'
      - name: Canonical corpus identity and publication gate
        run: python partener-eu/p11/validate_corpus.py
      - name: Fail-closed cumulative corpus batch admission
        run: python partener-eu/p11/validate_admission_batch.py
      - name: Deterministic candidate staging and deduplication
        run: |
          python partener-eu/p11/build_staging_ledger.py
          git diff --exit-code -- partener-eu/p11/opportunity_bundle.json partener-eu/p11/staging_ledger.json partener-eu/web/p11-public-data.js
      - name: Unified product quality gate
        run: python partener-eu/ops/quality_gate.py
