name: PARTENER.EU P11 Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/p11/**'
      - '.github/workflows/partener-eu-p11.yml'
  workflow_dispatch:

concurrency:
  group: partener-eu-p11-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Canonical contract and fail-closed policy regression
        run: python -m unittest discover -s partener-eu/p11 -p 'test_*.py'
      - name: Canonical corpus identity and publication gate
        run: python partener-eu/p11/validate_corpus.py
