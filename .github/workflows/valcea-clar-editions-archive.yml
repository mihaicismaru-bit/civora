name: VÂLCEA CLAR Editions Archive Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editions/**'
      - 'valcea-clar/site/navigation.json'
      - 'valcea-clar/scripts/render_editions_archive.py'
      - 'valcea-clar/scripts/overlay_runtime_export.py'
      - 'local-news-os/core/indexing_assets.py'
      - '.github/workflows/valcea-clar-editions-archive.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-editions-archive-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate editions archive renderer
        run: python valcea-clar/scripts/render_editions_archive.py --self-test

      - name: Rebuild and persist canonical reader runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vâlcea-clar-editions[bot]'
          git config user.email 'valcea-clar-editions@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python valcea-clar/scripts/render_editions_archive.py --self-test
            python valcea-clar/scripts/overlay_runtime_export.py
            python valcea-clar/scripts/smoke_web.py

            test -s valcea-clar/site/runtime/editii/index.html
            test -s valcea-clar/site/runtime/editii/manifest.json
            test -s valcea-clar/site/runtime/indexing_extra_routes.json
            grep -Fq '<a href="/editii/">Ediții anterioare</a>' valcea-clar/site/runtime/index.html
            grep -Fq 'https://valceaclar.ro/editii/' valcea-clar/site/runtime/sitemap.xml

            git add valcea-clar/site/runtime
            if git diff --cached --quiet; then
              echo 'VÂLCEA CLAR editions archive runtime already current.'
              exit 0
            fi

            git commit -m 'Publish VÂLCEA CLAR editions archive'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced during editions archive publish; retrying ${attempt}/5."
            sleep $((attempt * 2))
          done

          echo 'Could not persist VÂLCEA CLAR editions archive after five attempts.' >&2
          exit 1
