# One-shot operational workflow; canonical Meta credential path; runtime-only asset persistence.
name: VÂLCEA CLAR Instagram Premium CET Republish

on:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/social/instagram_editorial_v1_2.py'
      - 'valcea-clar/social/instagram_premium_cet_republish.py'
      - '.github/workflows/valcea-clar-instagram-premium-cet-republish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valcea-clar-instagram-premium-cet-republish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install deterministic renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Refresh latest canonical main state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Verify targeted CET source photograph
        id: photo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path=Path('valcea-clar/social/photos/approved/cet-govora-context-2011.jpg')
          if not path.is_file():
              raise SystemExit(f'missing targeted CET photograph: {path}')
          if path.stat().st_size < 50_000:
              raise SystemExit(f'CET photograph unexpectedly small: {path.stat().st_size} bytes')
          with Image.open(path) as image:
              image.verify()
          print(f'CET targeted photograph: PASS ({path.stat().st_size} bytes)')
          PY

      - name: Probe canonical shared Meta credential
        id: meta_auth
        env:
          VALCEA_FB_PAGE_ID: '1234360446430980'
          VALCEA_META_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_FB_GRAPH_VERSION: v26.0
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/meta_auth_health.py | tee /tmp/meta-auth.json

      - name: Validate premium CET carousel
        id: validate
        run: |
          set -euo pipefail
          python -m py_compile \
            valcea-clar/social/instagram_editorial_v1_2.py \
            valcea-clar/social/instagram_premium_cet_republish.py
          python valcea-clar/social/instagram_premium_cet_republish.py --self-test
          python valcea-clar/social/instagram_premium_cet_republish.py > /tmp/cet-instagram-premium-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('/tmp/cet-instagram-premium-plan.json').read_text(encoding='utf-8'))
          assert plan['status']=='PREPARED', plan
          assert plan['template_id']=='investigation_card', plan
          assert plan['native_format']=='carousel', plan
          assert plan['hook']=='31 AUGUST 2026', plan
          assert plan['asset_count']==6, plan
          print(json.dumps(plan, ensure_ascii=False, indent=2))
          PY

      - name: Persist premium carousel assets before Meta fetches them
        id: persist_assets
        shell: bash
        run: |
          set -euo pipefail
          rt='valcea-clar/site/runtime/media/social/editorial/instagram'
          cp -a "$rt" /tmp/cet-ig-runtime

          git config user.name 'vâlcea-clar-instagram-premium[bot]'
          git config user.email 'valcea-clar-instagram-premium@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$rt"
            cp -a /tmp/cet-ig-runtime/. "$rt/"
            git add -- "$rt"
            if git diff --cached --quiet; then
              echo 'Premium CET Instagram runtime assets already on main.'
              pushed=true
              break
            fi
            git commit -m 'Persist VÂLCEA CLAR CET premium Instagram carousel assets'
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "main advanced while persisting Instagram assets; retrying ${attempt}/5"
            sleep $((attempt * 2))
          done
          test "$pushed" = true

      - name: Preflight six public carousel images
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/cet-instagram-urls.txt
          import json
          from pathlib import Path
          plan=json.loads(Path('/tmp/cet-instagram-premium-plan.json').read_text(encoding='utf-8'))
          base='https://raw.githubusercontent.com/mihaicismaru-bit/civora/main/'
          for path in plan['assets']:
              print(base + path)
          PY
          count=0
          while IFS= read -r url; do
            count=$((count+1))
            ok=false
            for attempt in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 30 -o "/tmp/cet-ig-${count}.jpg" "$url"; then
                test -s "/tmp/cet-ig-${count}.jpg"
                ok=true
                break
              fi
              sleep $((attempt * 2))
            done
            test "$ok" = true
          done < /tmp/cet-instagram-urls.txt
          test "$count" -eq 6
          echo 'Instagram public-media preflight: PASS (6/6)'

      - name: Publish premium CET carousel
        id: publish
        env:
          VALCEA_IG_EDITORIAL_LIVE_ENABLED: 'true'
          VALCEA_IG_ACCOUNT_ID: ${{ steps.meta_auth.outputs.ig_account_id || vars.VALCEA_IG_ACCOUNT_ID }}
          VALCEA_IG_ACCESS_TOKEN: ${{ secrets.VALCEA_META_PAGE_ACCESS_TOKEN || secrets.VALCEA_IG_ACCESS_TOKEN || secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
          VALCEA_IG_GRAPH_VERSION: v26.0
          VALCEA_IG_GRAPH_HOST: graph.facebook.com
        shell: bash
        run: |
          set -euo pipefail
          python valcea-clar/social/instagram_premium_cet_republish.py --apply | tee /tmp/cet-instagram-premium-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/cet-instagram-premium-result.json').read_text(encoding='utf-8'))
          if result.get('status') == 'PREMIUM_REPUBLISHED':
              media_id=str(((result.get('result') or {}).get('instagram_media_id')) or '')
          elif result.get('status') == 'ALREADY_PREMIUM_REPUBLISHED':
              media_id=str(result.get('instagram_media_id') or '')
          else:
              raise SystemExit(f'premium Instagram republish incomplete: {result}')
          if not media_id or media_id == '17970262158145891':
              raise SystemExit(f'new premium Instagram media id not proven: {result}')
          print(f'Premium Instagram media id: {media_id}')
          PY

      - name: Persist Instagram replacement ledger
        id: persist_state
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/social/instagram_state.json /tmp/cet-instagram-state.json
          git config user.name 'vâlcea-clar-instagram-premium[bot]'
          git config user.email 'valcea-clar-instagram-premium@users.noreply.github.com'
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cet-instagram-state.json valcea-clar/social/instagram_state.json
            git add -- valcea-clar/social/instagram_state.json
            if git diff --cached --quiet; then
              echo 'Instagram replacement ledger already persisted.'
              pushed=true
              break
            fi
            git commit -m 'Persist VÂLCEA CLAR premium Instagram replacement state'
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "main advanced while persisting Instagram state; retrying ${attempt}/5"
            sleep $((attempt * 2))
          done
          test "$pushed" = true

      - name: Persist diagnostic outcomes
        if: always()
        env:
          PHOTO_OUTCOME: ${{ steps.photo.outcome }}
          META_OUTCOME: ${{ steps.meta_auth.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          ASSETS_OUTCOME: ${{ steps.persist_assets.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STATE_OUTCOME: ${{ steps.persist_state.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          out={
            'schema_version':'1.0',
            'workflow':'VÂLCEA CLAR Instagram Premium CET Republish',
            'run_id':os.environ.get('RUN_ID'),
            'run_attempt':os.environ.get('RUN_ATTEMPT'),
            'trigger_head_sha':os.environ.get('HEAD_SHA'),
            'steps':{
              'photo':os.environ.get('PHOTO_OUTCOME'),
              'meta_auth':os.environ.get('META_OUTCOME'),
              'validate':os.environ.get('VALIDATE_OUTCOME'),
              'persist_assets':os.environ.get('ASSETS_OUTCOME'),
              'preflight':os.environ.get('PREFLIGHT_OUTCOME'),
              'publish':os.environ.get('PUBLISH_OUTCOME'),
              'persist_state':os.environ.get('STATE_OUTCOME'),
            }
          }
          Path('/tmp/instagram_premium_cet_diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'vâlcea-clar-instagram-premium[bot]'
          git config user.email 'valcea-clar-instagram-premium@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/instagram_premium_cet_diagnostic.json valcea-clar/social/instagram_premium_cet_diagnostic.json
            git add -- valcea-clar/social/instagram_premium_cet_diagnostic.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist VÂLCEA CLAR Instagram premium CET diagnostic'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload replacement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-instagram-premium-cet-${{ github.run_id }}
          path: |
            /tmp/meta-auth.json
            /tmp/cet-instagram-premium-plan.json
            /tmp/cet-instagram-premium-result.json
            /tmp/cet-instagram-urls.txt
            /tmp/instagram_premium_cet_diagnostic.json
            valcea-clar/site/runtime/media/social/editorial/instagram
          if-no-files-found: warn
          retention-days: 14
