name: VÂLCEA CLAR ISU Incident Thread State

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/isu_valcea_incident_thread_state.py'
      - 'valcea-clar/scripts/isu_valcea_public_safety_signal_adapter.py'
      - 'valcea-clar/scripts/isu_valcea_local_news_signal_adapter.py'
      - '.github/workflows/valcea-clar-isu-incident-thread-state.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/isu_valcea_incident_thread_state.py'
      - 'valcea-clar/scripts/isu_valcea_public_safety_signal_adapter.py'
      - 'valcea-clar/scripts/isu_valcea_local_news_signal_adapter.py'
      - '.github/workflows/valcea-clar-isu-incident-thread-state.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-isu-incident-thread-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile ISU incident thread state
        run: python -m py_compile valcea-clar/scripts/isu_valcea_incident_thread_state.py
      - name: Run ISU incident identity and freshness regressions
        run: python valcea-clar/scripts/isu_valcea_incident_thread_state.py --self-test
