name: PARTENER.EU EUI Exact Call Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eu_direct_eui_exact_call.py'
      - 'partener-eu/ingest/eu_direct_eui_exact_call_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_eui_exact_call.py'
      - 'partener-eu/ops/test_eu_direct_eui_exact_call_reconcile.py'
      - '.github/workflows/partener-eu-eui-exact-call-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  eui-exact-call-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded EUI exact adapter and reconciliation
        run: |
          python -m py_compile \
            partener-eu/ingest/eu_direct_eui_exact_call.py \
            partener-eu/ingest/eu_direct_eui_exact_call_reconcile.py \
            partener-eu/ops/test_eu_direct_eui_exact_call.py \
            partener-eu/ops/test_eu_direct_eui_exact_call_reconcile.py

      - name: Run fail-closed EUI exact regressions
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: |
          python partener-eu/ops/test_eu_direct_eui_exact_call.py
          python partener-eu/ops/test_eu_direct_eui_exact_call_reconcile.py

      - name: Prepare bounded EUI exact replay root
        run: |
          ROOT=/tmp/partener-eu-eui-exact-call-proof
          rm -rf "$ROOT"
          mkdir -p "$ROOT/current" "$ROOT/previous"

      - name: Restore previous successful same-branch EUI exact receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-eui-exact-call-proof
          SCRATCH=/tmp/partener-eu-eui-exact-history-scan
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH" "$ROOT/previous"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$SCRATCH/artifacts.json"
          python - <<'PY' > "$SCRATCH/candidates.txt"
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/partener-eu-eui-exact-history-scan/artifacts.json').read_text(encoding='utf-8'))
          head=os.environ['EXPECTED_HEAD_SHA']
          branch=os.environ['EXPECTED_HEAD_BRANCH']
          rows=[]
          for artifact in data.get('artifacts') or []:
              name=str(artifact.get('name') or '')
              if not (
                  name.startswith('partener-eu-eui-exact-call-proof-')
                  or name.startswith('partener-eu-eu-direct-programme-intelligence-')
              ):
                  continue
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              if str(run.get('head_sha') or '') == head:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              rows.append((str(artifact.get('created_at') or ''), int(artifact.get('id') or 0)))
          rows.sort(reverse=True)
          for _, artifact_id in rows[:20]:
              print(artifact_id)
          PY
          RESTORED=""
          while IFS= read -r CANDIDATE; do
            [ -n "$CANDIDATE" ] || continue
            rm -f "$SCRATCH/previous.zip"
            rm -rf "$SCRATCH/unpacked"
            mkdir -p "$SCRATCH/unpacked"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE}/zip" > "$SCRATCH/previous.zip"
            unzip -q "$SCRATCH/previous.zip" -d "$SCRATCH/unpacked"
            PREVIOUS="$(find "$SCRATCH/unpacked" -type f -name 'eui-call4-exact-evidence.json' | head -n1 || true)"
            if [ -n "$PREVIOUS" ]; then
              cp "$PREVIOUS" "$ROOT/previous/eui-call4-exact-evidence.json"
              RESTORED="$CANDIDATE"
              echo "Restored previous bounded exact EUI receipt from artifact ${CANDIDATE}"
              break
            fi
            echo "Candidate artifact ${CANDIDATE} contained no exact EUI receipt; scanning older bounded evidence."
          done < "$SCRATCH/candidates.txt"
          if [ -z "$RESTORED" ]; then
            echo "No previous same-branch exact EUI artifact with a usable receipt found; baseline mode retained."
          fi

      - name: Acquire fresh exact official EUI Call 4 chain
        run: |
          ROOT=/tmp/partener-eu-eui-exact-call-proof
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_eui_exact_call.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-eui-call4" \
            --output-dir "$ROOT/current"

      - name: Reconcile EUI Call 4 same-identity evidence non-authorizing
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-eui-exact-call-proof
          ARGS=()
          if [ -f "$ROOT/previous/eui-call4-exact-evidence.json" ]; then
            ARGS+=(--previous "$ROOT/previous/eui-call4-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_eui_exact_call_reconcile.py \
            "$ROOT/current/eui-call4-exact-evidence.json" \
            "${ARGS[@]}" \
            --output "$ROOT/current/eui-call4-reconciliation.json"

      - name: Enforce live exact EUI boundary
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          root=Path('/tmp/partener-eu-eui-exact-call-proof')
          evidence=json.loads((root/'current/eui-call4-exact-evidence.json').read_text(encoding='utf-8'))
          rec=json.loads((root/'current/eui-call4-reconciliation.json').read_text(encoding='utf-8'))
          previous_exists=(root/'previous/eui-call4-exact-evidence.json').exists()
          if evidence.get('source_health_state') != 'HEALTHY':
              sys.exit('FAIL exact EUI authority chain is not HEALTHY')
          if evidence.get('parser_version') != 'EU_DIRECT_EUI_EXACT_CALL_V1_1':
              sys.exit('FAIL EUI current parser version drift')
          if evidence.get('discovery_link_verified') is not True:
              sys.exit('FAIL Portico discovery did not bind the exact EUI call detail')
          if evidence.get('candidate_state') != 'CLOSED_CALL' or str(evidence.get('status_label')).casefold() != 'closed':
              sys.exit('FAIL exact current EUI Call 4 closed candidate not observed')
          if evidence.get('official_call_identifier') is not None:
              sys.exit('FAIL fabricated official EUI call identifier')
          if not str(evidence.get('tor_url') or '').startswith('https://www.urban-initiative.eu/sites/default/files/2026-02/'):
              sys.exit('FAIL exact Terms of Reference binding missing')
          if not re.fullmatch(r'[0-9a-f]{64}', str(evidence.get('tor_raw_sha256') or '')):
              sys.exit('FAIL exact Terms of Reference hash missing')
          if previous_exists:
              if rec.get('reconciliation_state') not in {
                  'NO_CHANGE',
                  'EUI_EXACT_CALL_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING',
              }:
                  sys.exit('FAIL EUI same-identity replay did not reconcile')
              if rec.get('previous_evidence_sha256') is None:
                  sys.exit('FAIL EUI same-identity replay lost previous evidence binding')
          else:
              if rec.get('reconciliation_state') != 'BASELINE_CAPTURED_NON_AUTHORIZING':
                  sys.exit('FAIL unexpected EUI baseline reconciliation state')
              if rec.get('previous_evidence_sha256') is not None:
                  sys.exit('FAIL EUI baseline unexpectedly bound previous evidence')
          if rec.get('material_admission_ready_for_downstream_review') is not True:
              sys.exit('FAIL healthy exact closed candidate did not reach downstream review gate')
          flags=(
              'material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized',
              'budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized',
              'call_alert_authorized',
          )
          for row in (evidence, rec):
              for key in flags:
                  if row.get(key) is not False:
                      sys.exit(f'FAIL EUI proof crossed material boundary: {key}')
              if row.get('publication_effect') != 'NONE' or row.get('canonical_corpus_mutation') is not False:
                  sys.exit('FAIL EUI proof crossed publication boundary')
          print({
              'identity_slug': evidence['identity_slug'],
              'candidate_state': evidence['candidate_state'],
              'source_health_state': evidence['source_health_state'],
              'parser_version': evidence['parser_version'],
              'previous_same_identity_restored': previous_exists,
              'reconciliation_state': rec['reconciliation_state'],
              'semantic_change_count': rec['semantic_change_count'],
              'official_call_identifier': None,
              'closed_call_authorized': False,
              'publication_effect': 'NONE',
          })
          PY

      - name: Upload bounded EUI exact proof
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-eui-exact-call-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-eui-exact-call-proof
          if-no-files-found: error
          retention-days: 7
