name: EUCONS Official Source Operator Queue

on:
  pull_request:
    paths:
      - 'eucons/opportunities/official_source_operator_queue_contract.json'
      - 'eucons/opportunities/official_source_operator_queue.py'
      - 'eucons/validation/test_official_source_operator_queue_fail_closed.py'
      - '.github/workflows/eucons-official-source-operator-queue.yml'
      - 'eucons/opportunities/matching_contract.json'
      - 'eucons/opportunities/match_opportunities.py'
  push:
    branches: [main]
    paths:
      - 'eucons/opportunities/official_source_operator_queue_contract.json'
      - 'eucons/opportunities/official_source_operator_queue.py'
      - 'eucons/validation/test_official_source_operator_queue_fail_closed.py'
      - '.github/workflows/eucons-official-source-operator-queue.yml'
      - 'eucons/opportunities/matching_contract.json'
      - 'eucons/opportunities/match_opportunities.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-official-source-operator-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Parse queue contract
        run: python -m json.tool eucons/opportunities/official_source_operator_queue_contract.json >/dev/null
      - name: Compile queue engine
        run: python -m py_compile eucons/opportunities/official_source_operator_queue.py
      - name: Test queue fail-closed behavior
        run: python eucons/validation/test_official_source_operator_queue_fail_closed.py
      - name: Revalidate canonical opportunity matching
        run: python eucons/validation/validate_opportunity_matching.py
      - name: Re-test canonical opportunity matching fail-closed behavior
        run: python eucons/validation/test_opportunity_matching_fail_closed.py
