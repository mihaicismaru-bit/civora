name: CRAIOVA CLAR Utility Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/craiova-clar-utility-scheduler.yml'

permissions:
  contents: write

concurrency:
  group: craiova-clar-utility-scheduler
  cancel-in-progress: false

jobs:
  utility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out CRAIOVA CLAR build branch
        uses: actions/checkout@v6
        with:
          ref: craiova-clar-build
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Regression tests
        run: python -m unittest discover -s craiova-clar/tests -p 'test_*.py' -v

      - name: Discover fresh official utility notices and render publishable stories
        env:
          CRAIOVA_CLAR_BASE_URL: https://craiova-clar-mihaicismaru-6634s-projects.vercel.app
        run: python craiova-clar/run_utility.py

      - name: Persist only material generated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'craiova-clar[bot]'
          git config user.email 'craiova-clar@users.noreply.github.com'
          git add craiova-clar/site craiova-clar/state || true
          if git diff --cached --quiet; then
            echo 'No new CRAIOVA CLAR utility publication material.'
            exit 0
          fi
          git commit -m 'Publish CRAIOVA CLAR utility story snapshot'
          git push origin HEAD:craiova-clar-build
