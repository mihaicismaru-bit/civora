name: CRAIOVA CLAR Utility Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/craiova-clar-utility-scheduler.yml'

permissions:
  contents: write

concurrency:
  group: craiova-clar-utility-scheduler
  cancel-in-progress: false

jobs:
  utility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out CRAIOVA CLAR build branch
        uses: actions/checkout@v6
        with:
          ref: craiova-clar-build
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prove canonical scheduler execution once
        shell: bash
        run: |
          set -euo pipefail
          marker=craiova-clar/state/canonical_scheduler_seen.json
          if test -f "$marker"; then
            echo 'Canonical scheduler execution already proven.'
          else
            mkdir -p craiova-clar/state
            printf '{"scheduler":"craiova-clar-utility-scheduler","status":"executed","run_id":"%s"}\n' "$GITHUB_RUN_ID" > "$marker"
            git config user.name 'craiova-clar[bot]'
            git config user.email 'craiova-clar@users.noreply.github.com'
            git add "$marker"
            git commit -m 'Prove CRAIOVA CLAR canonical scheduler execution'
            git push origin HEAD:craiova-clar-build
          fi

      - name: Regression tests
        run: python -m unittest discover -s craiova-clar/tests -p 'test_*.py' -v

      - name: Discover fresh official utility notices and render stories
        env:
          CRAIOVA_CLAR_BASE_URL: https://craiova-clar-live-public-mihaicismaru-6634s-projects.vercel.app
        run: python craiova-clar/run_utility.py

      - name: Persist material generated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'craiova-clar[bot]'
          git config user.email 'craiova-clar@users.noreply.github.com'
          git add craiova-clar/site craiova-clar/state || true
          if git diff --cached --quiet; then
            echo 'No new CRAIOVA CLAR utility publication material.'
          else
            git commit -m 'Publish CRAIOVA CLAR utility story snapshot'
            git push origin HEAD:craiova-clar-build
          fi

      - name: Probe public publication
        run: |
          python - <<'PY'
          import hashlib, json, re, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = Path('craiova-clar/site/stories.json')
          if not manifest.exists():
              raise SystemExit('No CRAIOVA CLAR story manifest exists yet.')
          story = json.loads(manifest.read_text(encoding='utf-8'))['stories'][0]
          url = story['canonical_url']
          expected = story['headline']
          expected_source = 'github:craiova-clar-build'
          outcome = {
              'story_id': story['story_id'], 'canonical_url': url,
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'status': 'verification_failed', 'http_status': None,
              'source_header': None, 'content_type': None, 'server': None,
              'final_url': None, 'body_sha256': None, 'body_prefix': None, 'error': None,
          }
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'CRAIOVA-CLAR-live-check/1.0'})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      raw = response.read()
                      body = raw.decode('utf-8', errors='replace')
                      status = response.status
                      source_header = response.headers.get('X-CRAIOVA-CLAR-Source')
                      outcome.update({
                          'http_status': status,
                          'source_header': source_header,
                          'content_type': response.headers.get('Content-Type'),
                          'server': response.headers.get('Server'),
                          'final_url': response.geturl(),
                          'body_sha256': hashlib.sha256(raw).hexdigest(),
                          'body_prefix': re.sub(r'\s+', ' ', body[:400]).strip(),
                      })
                  if status == 200 and source_header == expected_source and expected in body and 'CRAIOVA CLAR' in body:
                      outcome['status'] = 'published_verified'
                      outcome['error'] = None
                      receipt = {
                          'story_id': story['story_id'], 'canonical_url': url,
                          'published_at': story['published_at'], 'destination': 'public_web',
                          'status': 'published_verified', 'external_id': None,
                          'metadata': {'verified_at': datetime.now(timezone.utc).isoformat(),
                                       'http_status': status, 'headline_verified': True,
                                       'product_verified': True, 'source_header': source_header},
                      }
                      Path('craiova-clar/site/utility_publication_receipt.json').write_text(
                          json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                      break
                  outcome['error'] = f'HTTP {status}; source={source_header!r}; expected live headline/source marker not found'
              except Exception as exc:
                  outcome['error'] = repr(exc)
              if attempt < 11:
                  time.sleep(5)
          outcome['checked_at'] = datetime.now(timezone.utc).isoformat()
          Path('craiova-clar/state/utility_live_probe.json').write_text(
              json.dumps(outcome, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(outcome, ensure_ascii=False))
          PY

      - name: Persist public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'craiova-clar[bot]'
          git config user.email 'craiova-clar@users.noreply.github.com'
          git add craiova-clar/state/utility_live_probe.json
          if test -f craiova-clar/site/utility_publication_receipt.json; then git add craiova-clar/site/utility_publication_receipt.json; fi
          if git diff --cached --quiet; then
            echo 'Public verification evidence already current.'
          else
            git commit -m 'Record CRAIOVA CLAR utility live verification'
            git push origin HEAD:craiova-clar-build
          fi

      - name: Require verified public publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path('craiova-clar/state/utility_live_probe.json').read_text(encoding='utf-8'))
          assert probe['status'] == 'published_verified', probe
          PY
