name: PARTENER.EU MIPE Romania Collector

on:
  workflow_dispatch:
    inputs:
      persist:
        description: 'Persistă rezultatele verificate în main'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/mipe_browser_ingest.py'
      - 'partener-eu/ingest/state/mipe_ro_trigger.txt'
      - '.github/workflows/partener-eu-mipe-ro-runner.yml'

# One-time Romanian-egress collector. It runs only on a repository-owned
# Windows x64 self-hosted runner and never on pull_request events.

permissions:
  contents: write

concurrency:
  group: partener-eu-mipe-ro-runner
  cancel-in-progress: true

jobs:
  ingest-ro:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      MIPE_FORCE_IP: ''
      MIPE_RELAY_URL: ''
      MIPE_MAX_PAGES: '90'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bootstrap private Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = $null

          $cmd = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($cmd) {
            try {
              & $cmd.Source -c "import sys; assert sys.version_info >= (3, 11)"
              if ($LASTEXITCODE -eq 0) { $python = $cmd.Source }
            } catch {}
          }

          if (-not $python) {
            $launcher = Get-Command py.exe -ErrorAction SilentlyContinue
            if ($launcher) {
              try {
                $candidate = (& $launcher.Source -3.12 -c "import sys; print(sys.executable)" 2>$null).Trim()
                if ($candidate -and (Test-Path $candidate)) { $python = $candidate }
              } catch {}
            }
          }

          if (-not $python) {
            $version = '3.12.10'
            $installer = Join-Path $env:RUNNER_TEMP "python-$version-amd64.exe"
            $target = Join-Path $env:RUNNER_TEMP 'partener-python312'
            Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$version/python-$version-amd64.exe" -OutFile $installer
            $arguments = @(
              '/quiet',
              'InstallAllUsers=0',
              "TargetDir=$target",
              'PrependPath=0',
              'Include_launcher=0',
              'Include_test=0',
              'Include_pip=1',
              'SimpleInstall=1'
            )
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Instalarea Python a eșuat cu codul $($process.ExitCode)." }
            $python = Join-Path $target 'python.exe'
          }

          if (-not (Test-Path $python)) { throw "Runtime Python indisponibil: $python" }
          $pythonDir = Split-Path $python -Parent
          $scriptsDir = Join-Path $pythonDir 'Scripts'
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $scriptsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python --version

      - name: Record raw HTTP probe without blocking browser collection
        shell: pwsh
        run: |
          @'
          import json, ssl, urllib.request
          urls = [
              'https://mfe.gov.ro/',
              'https://mfe.gov.ro/ghiduri_peos/',
              'https://mfe.gov.ro/ghiduri_pids/',
              'https://mfe.gov.ro/pdds/despre-program-programare/',
          ]
          rows=[]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={
                      'User-Agent':'Mozilla/5.0 PARTENER.EU Romanian Collector',
                      'Accept-Language':'ro,en;q=0.7',
                  })
                  with urllib.request.urlopen(req,timeout=20,context=ssl.create_default_context()) as r:
                      body=r.read(250000)
                      rows.append({'url':url,'ok':200 <= r.status < 400,'status':r.status,'bytes':len(body),'finalUrl':r.geturl()})
              except Exception as exc:
                  rows.append({'url':url,'ok':False,'error':f'{type(exc).__name__}: {exc}'})
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          if not any(row.get('ok') for row in rows):
              print('HTTP simplu este respins de MIPE; continuăm printr-un browser Edge real.')
          '@ | Set-Content -Encoding UTF8 .\mipe_ro_probe.py
          & $env:PYTHON_EXE .\mipe_ro_probe.py

      - name: Prepare Playwright with interactive Microsoft Edge
        shell: pwsh
        run: |
          & $env:PYTHON_EXE -m pip install --disable-pip-version-check --upgrade pip
          & $env:PYTHON_EXE -m pip install --disable-pip-version-check playwright

          $edgeCandidates = @(
            "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:LOCALAPPDATA\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($edge) {
            Write-Host "Microsoft Edge găsit: $edge"
            "MIPE_BROWSER_CHANNEL=msedge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MIPE_HEADLESS=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host 'Microsoft Edge nu a fost găsit; instalez Chromium Playwright.'
            & $env:PYTHON_EXE -m playwright install chromium
            "MIPE_BROWSER_CHANNEL=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MIPE_HEADLESS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Collect official MIPE pages through Romanian browser egress
        shell: pwsh
        run: |
          Write-Host "Browser channel: $env:MIPE_BROWSER_CHANNEL; headless: $env:MIPE_HEADLESS"
          & $env:PYTHON_EXE partener-eu/ingest/mipe_browser_ingest.py

      - name: Normalize direct-source provenance and bust feed cache
        shell: pwsh
        run: |
          @'
          import json, re
          from pathlib import Path

          state_path=Path('partener-eu/ingest/state/mipe_state.json')
          feed_path=Path('partener-eu/web/mipe-news.js')
          index_path=Path('partener-eu/web/index.html')
          state=json.loads(state_path.read_text(encoding='utf-8'))
          run=state.get('lastRun') or {}
          if not run.get('sourceAvailable'):
              raise SystemExit('MIPE nu a devenit disponibil nici în browserul Microsoft Edge.')
          for item in state.get('items',[]):
              url=item.get('url','')
              if not (url.startswith('https://mfe.gov.ro/') or url.startswith('https://www.mfe.gov.ro/')):
                  raise SystemExit(f'URL neoficial respins: {url}')
              item['tier']='T1'
              item['retrievalTransport']=run.get('transport') or 'playwright-direct-romania'
              item['verification']='CANONICAL_OFFICIAL_FETCH'
          state['status']='OK'
          run['status']='OK'
          run['directSuccessCount']=sum(1 for root in run.get('roots',[]) if root.get('ok'))
          state['lastRun']=run
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          meta={
              'status':'OK',
              'asOf':run.get('observedAt'),
              'source':'MIPE official web properties',
              'roots':run.get('roots',[]),
              'itemCount':len(state.get('items',[])),
              'transport':run.get('transport'),
          }
          js='window.PARTENER_DATA=window.PARTENER_DATA||{};\n'
          js+='window.PARTENER_DATA.mipeIngestion='+json.dumps(meta,ensure_ascii=False,separators=(',',':'))+';\n'
          js+='window.PARTENER_DATA.mipeNews='+json.dumps(state.get('items',[]),ensure_ascii=False,separators=(',',':'))+';\n'
          feed_path.write_text(js,encoding='utf-8')

          if index_path.exists():
              index=index_path.read_text(encoding='utf-8')
              version=re.sub(r'[^0-9]','',str(run.get('observedAt') or ''))[:14] or 'directro'
              index=re.sub(r'(mipe-news\.js\?v=)[^"\']+',rf'\g<1>{version}',index)
              index=re.sub(r'(mipe-news-adapter\.js\?v=)[^"\']+',rf'\g<1>{version}',index)
              index_path.write_text(index,encoding='utf-8')

          print(json.dumps({'status':'OK','directRoots':run['directSuccessCount'],'items':len(state.get('items',[])),'transport':run.get('transport')},ensure_ascii=False,indent=2))
          '@ | Set-Content -Encoding UTF8 .\normalize_mipe_ro.py
          & $env:PYTHON_EXE .\normalize_mipe_ro.py

      - name: Refresh MySMIS consultant evidence and intelligence index
        shell: pwsh
        run: |
          & $env:PYTHON_EXE partener-eu/ingest/build_mysmis_consultant_registry.py
          & $env:PYTHON_EXE partener-eu/ingest/intelligence_index.py

      - name: Persist verified direct feed through GitHub API
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.persist }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, json, os, time, urllib.error, urllib.request
          from pathlib import Path

          token=os.environ['GH_TOKEN']
          repository=os.environ['GH_REPOSITORY']
          api=f'https://api.github.com/repos/{repository}'
          paths=[
              'partener-eu/web/index.html',
              'partener-eu/web/mipe-news.js',
              'partener-eu/web/mysmis-registry.js',
              'partener-eu/ingest/state/mipe_state.json',
              'partener-eu/ingest/state/intelligence_index.json',
          ]
          contents={path:Path(path).read_bytes() for path in paths}
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'PARTENER.EU-MIPE-RO-Collector',
          }

          def request(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else {}

          for attempt in range(1,6):
              try:
                  ref=request('GET',f'{api}/git/ref/heads/main')
                  parent=ref['object']['sha']
                  commit=request('GET',f'{api}/git/commits/{parent}')
                  entries=[]
                  for path,raw in contents.items():
                      blob=request('POST',f'{api}/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
                      entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
                  tree=request('POST',f'{api}/git/trees',{'base_tree':commit['tree']['sha'],'tree':entries})
                  new_commit=request('POST',f'{api}/git/commits',{
                      'message':'Ingest verified MIPE updates from Romanian Windows collector',
                      'tree':tree['sha'],
                      'parents':[parent],
                  })
                  request('PATCH',f'{api}/git/refs/heads/main',{'sha':new_commit['sha'],'force':False})
                  print(json.dumps({'persisted':True,'commit':new_commit['sha'],'files':paths},ensure_ascii=False,indent=2))
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409,422) or attempt==5:
                      raise
                  print(f'main a avansat; reîncercare {attempt}/5')
                  time.sleep(attempt*2)
          '@ | Set-Content -Encoding UTF8 .\persist_mipe_ro_api.py
          & $env:PYTHON_EXE .\persist_mipe_ro_api.py
