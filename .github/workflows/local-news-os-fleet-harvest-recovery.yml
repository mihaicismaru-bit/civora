name: LOCAL NEWS OS Fleet Harvest Recovery

on:
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/social/fleet_metrics_recovery_orchestrator.py"
      - "local-news-os/social/fleet_reread_materialization_recovery_routing.py"
      - "local-news-os/social/test_fleet_metrics_recovery_orchestrator.py"
      - "local-news-os/social/test_fleet_reread_materialization_recovery_routing.py"
      - "local-news-os/social/reread_materialization_crash_reconciliation.py"
      - "local-news-os/social/test_reread_materialization_crash_reconciliation.py"
      - "local-news-os/social/authorization_sealed_harvest_recovery.py"
      - "local-news-os/social/authorization_sealed_harvest_receipt.py"
      - "local-news-os/social/fleet_metrics_authorization_seal.py"
      - "local-news-os/social/metrics_harvest_runtime.py"
      - "local-news-os/social/metrics_harvest_scheduler.py"
      - "local-news-os/social/native_metrics_transport.py"
      - "local-news-os/social/observed_metrics_collector.py"
      - "local-news-os/social/publication_metrics_catalog.py"
      - "local-news-os/social/social_runtime_registry.json"
      - "local-news-os/social/metrics_credential_bindings.json"
      - "local-news-os/social/metrics_transport_capabilities.json"
      - "**/social/channel_registry.json"
      - "**/social/channels/**"
      - ".github/workflows/local-news-os-fleet-harvest-recovery.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/social/fleet_metrics_recovery_orchestrator.py"
      - "local-news-os/social/fleet_reread_materialization_recovery_routing.py"
      - "local-news-os/social/test_fleet_metrics_recovery_orchestrator.py"
      - "local-news-os/social/test_fleet_reread_materialization_recovery_routing.py"
      - "local-news-os/social/reread_materialization_crash_reconciliation.py"
      - "local-news-os/social/test_reread_materialization_crash_reconciliation.py"
      - "local-news-os/social/authorization_sealed_harvest_recovery.py"
      - "local-news-os/social/authorization_sealed_harvest_receipt.py"
      - "local-news-os/social/fleet_metrics_authorization_seal.py"
      - "local-news-os/social/metrics_harvest_runtime.py"
      - "local-news-os/social/metrics_harvest_scheduler.py"
      - "local-news-os/social/native_metrics_transport.py"
      - "local-news-os/social/observed_metrics_collector.py"
      - "local-news-os/social/publication_metrics_catalog.py"
      - "local-news-os/social/social_runtime_registry.json"
      - "local-news-os/social/metrics_credential_bindings.json"
      - "local-news-os/social/metrics_transport_capabilities.json"
      - "**/social/channel_registry.json"
      - "**/social/channels/**"
      - ".github/workflows/local-news-os-fleet-harvest-recovery.yml"

permissions:
  contents: read

concurrency:
  group: local-news-os-fleet-observed-metrics-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile fleet recovery routing boundary
        run: |
          python -m py_compile \
            local-news-os/social/authorization_sealed_harvest_receipt.py \
            local-news-os/social/authorization_sealed_harvest_recovery.py \
            local-news-os/social/reread_materialization_crash_reconciliation.py \
            local-news-os/social/fleet_metrics_authorization_seal.py \
            local-news-os/social/metrics_harvest_runtime.py \
            local-news-os/social/metrics_harvest_scheduler.py \
            local-news-os/social/native_metrics_transport.py \
            local-news-os/social/observed_metrics_collector.py \
            local-news-os/social/publication_metrics_catalog.py \
            local-news-os/social/fleet_metrics_recovery_orchestrator.py \
            local-news-os/social/fleet_reread_materialization_recovery_routing.py \
            local-news-os/social/test_fleet_metrics_recovery_orchestrator.py \
            local-news-os/social/test_reread_materialization_crash_reconciliation.py \
            local-news-os/social/test_fleet_reread_materialization_recovery_routing.py

      - name: Run fleet reread materialization routing acceptance
        working-directory: local-news-os/social
        run: python test_fleet_reread_materialization_recovery_routing.py

      - name: Run generic fleet recovery regression acceptance
        working-directory: local-news-os/social
        run: python test_fleet_metrics_recovery_orchestrator.py

      - name: Run strict reread materialization crash recovery regression acceptance
        working-directory: local-news-os/social
        run: python test_reread_materialization_crash_reconciliation.py

      - name: Verify explicit reread cannot fall through to generic recovery
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'local-news-os/social')
          import fleet_reread_materialization_recovery_routing as routing
          guards = routing._guards()
          required = {
              'provider_network_calls_performed': False,
              'credential_values_read': False,
              'credential_values_persisted': False,
              'provider_payload_persisted': False,
              'provider_reread_authorized_automatically': False,
              'recovery_runs_before_normal_harvest': True,
              'sealed_authorization_required': True,
              'durable_observation_required_for_automatic_completion': True,
              'explicit_reread_materialization_recovery_routed_before_generic': True,
              'generic_covering_observation_allowed_for_explicit_reread': False,
              'explicit_reread_job_reconstruction_must_match_sealed_fingerprint': True,
              'provider_reread_authorized_by_router': False,
              'provider_network_calls_performed_by_router': False,
              'publication_blocked_by_analytics': False,
              'zero_paid_dependency': True,
          }
          for key, expected in required.items():
              assert guards.get(key) is expected, (key, guards.get(key))
          print('FLEET_REREAD_MATERIALIZATION_ROUTING_GUARDS_PASS')
          PY

  reconcile:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Route explicit reread recovery before generic fleet recovery
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python local-news-os/social/fleet_reread_materialization_recovery_routing.py \
            --repo-root . \
            --runtime-registry local-news-os/social/social_runtime_registry.json \
            --binding-registry local-news-os/social/metrics_credential_bindings.json \
            --capability-registry local-news-os/social/metrics_transport_capabilities.json \
            --now "$NOW" \
            | tee /tmp/fleet-harvest-recovery.json

      - name: Verify routed recovery remains analytics-only and secret-free
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/fleet-harvest-recovery.json').read_text(encoding='utf-8'))
          if result.get('publication_blocked') is not False:
              raise SystemExit('recovery attempted to block editorial publication')
          if result.get('provider_reread_authorized') is not False:
              raise SystemExit('fleet recovery must never auto-authorize provider reread')
          guards = result.get('guards', {})
          required = {
              'provider_network_calls_performed': False,
              'credential_values_read': False,
              'credential_values_persisted': False,
              'provider_payload_persisted': False,
              'provider_reread_authorized_automatically': False,
              'recovery_runs_before_normal_harvest': True,
              'sealed_authorization_required': True,
              'durable_observation_required_for_automatic_completion': True,
              'explicit_reread_materialization_recovery_routed_before_generic': True,
              'generic_covering_observation_allowed_for_explicit_reread': False,
              'explicit_reread_job_reconstruction_must_match_sealed_fingerprint': True,
              'provider_reread_authorized_by_router': False,
              'provider_network_calls_performed_by_router': False,
              'publication_blocked_by_analytics': False,
              'zero_paid_dependency': True,
          }
          for key, expected in required.items():
              if guards.get(key) is not expected:
                  raise SystemExit(f'recovery guard mismatch: {key}={guards.get(key)!r}')
          encoded = json.dumps(result, sort_keys=True).lower()
          for forbidden in ('access_token_value', 'secret_value', 'credential_value', 'provider_payload'):
              if forbidden in encoded:
                  raise SystemExit(f'forbidden material in recovery output: {forbidden}')
          print(result.get('status'))
          PY

      - name: Persist only reconciled metrics recovery state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/fleet-recovery-durable-paths.txt
          import json
          from pathlib import Path, PurePosixPath
          result = json.loads(Path('/tmp/fleet-harvest-recovery.json').read_text(encoding='utf-8'))
          runtime = json.loads(Path('local-news-os/social/social_runtime_registry.json').read_text(encoding='utf-8'))
          roots = [PurePosixPath(row['instance_root']) for row in runtime.get('instances', []) if isinstance(row, dict) and row.get('instance_root')]
          for raw in sorted(set(result.get('durable_paths', []))):
              path = PurePosixPath(str(raw))
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'unsafe recovery durable path: {raw}')
              if not any(path == root or root in path.parents for root in roots):
                  raise SystemExit(f'recovery durable path outside registered instance roots: {raw}')
              print(path.as_posix())
          PY

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ -e "$path" ]]; then
              git add -- "$path"
            fi
          done </tmp/fleet-recovery-durable-paths.txt

          if git diff --cached --quiet; then
            echo "No sealed recovery checkpoint state changed."
            exit 0
          fi

          git config user.name "civora-site-engine"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Persist LOCAL NEWS OS sealed harvest recovery"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Refusing to overwrite concurrent metrics recovery state."
            exit 1
          fi
          git push origin HEAD:main
