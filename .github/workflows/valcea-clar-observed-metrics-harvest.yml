name: VÂLCEA CLAR Observed Metrics Harvest

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/social/operational_metrics_harvest_trigger.py"
      - "local-news-os/social/test_operational_metrics_harvest_trigger.py"
      - "local-news-os/social/metrics_harvest_runtime.py"
      - "local-news-os/social/metrics_harvest_scheduler.py"
      - "local-news-os/social/native_metrics_transport.py"
      - "local-news-os/social/observed_metrics_collector.py"
      - "local-news-os/social/durable_feedback_snapshot.py"
      - "local-news-os/social/publication_metrics_catalog.py"
      - "valcea-clar/social/channels/facebook.json"
      - "valcea-clar/social/channels/instagram.json"
      - "valcea-clar/social/meta_auth_state.json"
      - ".github/workflows/valcea-clar-observed-metrics-harvest.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/social/operational_metrics_harvest_trigger.py"
      - "local-news-os/social/test_operational_metrics_harvest_trigger.py"
      - "local-news-os/social/metrics_harvest_runtime.py"
      - "local-news-os/social/metrics_harvest_scheduler.py"
      - "local-news-os/social/native_metrics_transport.py"
      - "local-news-os/social/observed_metrics_collector.py"
      - "local-news-os/social/durable_feedback_snapshot.py"
      - "local-news-os/social/publication_metrics_catalog.py"
      - "valcea-clar/social/channels/facebook.json"
      - "valcea-clar/social/channels/instagram.json"
      - "valcea-clar/social/meta_auth_state.json"
      - ".github/workflows/valcea-clar-observed-metrics-harvest.yml"

permissions:
  contents: read

concurrency:
  group: valcea-clar-observed-metrics-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile operational metrics harvest boundary
        run: |
          python -m py_compile \
            local-news-os/social/publication_metrics_catalog.py \
            local-news-os/social/durable_feedback_snapshot.py \
            local-news-os/social/observed_metrics_collector.py \
            local-news-os/social/native_metrics_transport.py \
            local-news-os/social/metrics_harvest_scheduler.py \
            local-news-os/social/metrics_harvest_runtime.py \
            local-news-os/social/operational_metrics_harvest_trigger.py \
            local-news-os/social/test_operational_metrics_harvest_trigger.py

      - name: Run operational metrics harvest trigger acceptance tests
        run: python local-news-os/social/test_operational_metrics_harvest_trigger.py

      - name: Verify Vâlcea Meta channels evaluate without network or catalog fabrication
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python local-news-os/social/operational_metrics_harvest_trigger.py \
            --repo-root . \
            --channel valcea-clar/social/channels/facebook.json \
            --channel valcea-clar/social/channels/instagram.json \
            --access-attestation valcea-clar/social/meta_auth_state.json \
            --now "$NOW" \
            >/tmp/valcea-metrics-harvest-dry-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/valcea-metrics-harvest-dry-run.json').read_text(encoding='utf-8'))
          assert result['publication_blocked'] is False, result
          assert result['guards']['native_free_transport_only'] is True, result
          assert result['guards']['credential_values_returned'] is False, result
          assert result['guards']['zero_paid_dependency'] is True, result
          for row in result['channels']:
              assert row['platform'] in {'facebook', 'instagram'}, row
              assert row['publication_blocked'] is False, row
          print(result['status'])
          PY

  harvest:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      VALCEA_FB_PAGE_ACCESS_TOKEN: ${{ secrets.VALCEA_FB_PAGE_ACCESS_TOKEN }}
      VALCEA_IG_ACCESS_TOKEN: ${{ secrets.VALCEA_IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Harvest due confirmed Meta publications through native/free transport
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python local-news-os/social/operational_metrics_harvest_trigger.py \
            --repo-root . \
            --channel valcea-clar/social/channels/facebook.json \
            --channel valcea-clar/social/channels/instagram.json \
            --access-attestation valcea-clar/social/meta_auth_state.json \
            --now "$NOW" \
            --execute \
            | tee /tmp/valcea-observed-metrics-harvest.json

      - name: Verify harvest output contains no credential material
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path('/tmp/valcea-observed-metrics-harvest.json').read_text(encoding='utf-8'))
          encoded = json.dumps(result, ensure_ascii=False)
          for name in ('VALCEA_FB_PAGE_ACCESS_TOKEN', 'VALCEA_IG_ACCESS_TOKEN'):
              value = os.environ.get(name, '')
              if value and value in encoded:
                  raise SystemExit(f'credential value leaked into harvest output: {name}')
          if result.get('publication_blocked') is not False:
              raise SystemExit('analytics attempted to block publication')
          if result.get('guards', {}).get('zero_paid_dependency') is not True:
              raise SystemExit('zero-paid dependency guard missing')
          print(result.get('status'))
          PY

      - name: Persist only channel-local observed metrics runtime state
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            valcea-clar/social/facebook_state_metrics_harvest_state.json
            valcea-clar/social/facebook_state_observed_metrics.json
            valcea-clar/social/facebook_state_feedback_snapshot.json
            valcea-clar/social/instagram_state_metrics_harvest_state.json
            valcea-clar/social/instagram_state_observed_metrics.json
            valcea-clar/social/instagram_state_feedback_snapshot.json
          )
          for path in "${paths[@]}"; do
            if [[ -e "$path" ]]; then
              git add -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No durable metrics state changed."
            exit 0
          fi
          git config user.name "civora-site-engine"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Persist VÂLCEA CLAR observed metrics harvest"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Refusing to overwrite concurrent metrics state."
            exit 1
          fi
          git push origin HEAD:main
