name: CIVORA Persistence Reconciliation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CIVORA Scope Drift"]
    types: [completed]
  pull_request:
    paths:
      - "local-news-os/persistence/**"
      - ".github/workflows/civora-persistence-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/persistence/**"
      - ".github/workflows/civora-persistence-reconciliation.yml"

permissions:
  contents: read

concurrency:
  group: civora-persistence-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile persistence validators
        run: |
          python -m py_compile local-news-os/persistence/reconciliation_engine.py
          python -m py_compile local-news-os/persistence/validate_reconciliation_triggers.py
          python -m py_compile local-news-os/persistence/credential_safety.py
          python -m py_compile local-news-os/persistence/persistence_writer.py
      - name: Run deterministic fail-closed reconciliation acceptance
        run: python local-news-os/persistence/reconciliation_engine.py --self-test
      - name: Validate PRS-037 reconciliation trigger contract and executable wiring
        run: python local-news-os/persistence/validate_reconciliation_triggers.py --self-test
      - name: Validate PRS-038 fail-closed persistence writer
        run: python local-news-os/persistence/persistence_writer.py --self-test
      - name: Validate PRS-039 zero-credential persistence contract
        run: python local-news-os/persistence/credential_safety.py --self-test
      - name: Validate existing scope classifier alongside reconciliation
        run: python local-news-os/core/repository_scope_fingerprint.py --self-test
      - name: Verify acceptance contracts are present
        run: |
          test -s local-news-os/persistence/RECONCILIATION_ENGINE_ACCEPTANCE.md
          test -s local-news-os/persistence/PERSISTENCE_WRITER_ACCEPTANCE.md
          test -s local-news-os/persistence/CREDENTIAL_SAFETY_ACCEPTANCE.md
