name: CIVORA Persistence Reconciliation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CIVORA Scope Drift"]
    types: [completed]
  pull_request:
    paths:
      - "local-news-os/persistence/**"
      - ".github/workflows/civora-persistence-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/persistence/**"
      - ".github/workflows/civora-persistence-reconciliation.yml"

permissions:
  contents: read

concurrency:
  group: civora-persistence-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile persistence validators
        run: |
          python -m py_compile local-news-os/persistence/reconciliation_engine.py
          python -m py_compile local-news-os/persistence/validate_reconciliation_triggers.py
          python -m py_compile local-news-os/persistence/credential_safety.py
          python -m py_compile local-news-os/persistence/persistence_writer.py
          python -m py_compile local-news-os/persistence/latest_state_promotion.py
          python -m py_compile local-news-os/persistence/persistence_health.py
          python -m py_compile local-news-os/persistence/prs_042_drive_old_main_new_acceptance.py
          python -m py_compile local-news-os/persistence/prs_043_open_pr_unmerged_acceptance.py
          python -m py_compile local-news-os/persistence/prs_044_superseded_pr_later_merge_acceptance.py
          python -m py_compile local-news-os/persistence/prs_045_outbox_only_capability_acceptance.py
          python -m py_compile local-news-os/persistence/prs_046_profile_asset_no_remote_readback_acceptance.py
          python -m py_compile local-news-os/persistence/prs_047_no_progress_checkpoint_then_main_acceptance.py
          python -m py_compile local-news-os/persistence/prs_048_explicit_decision_replacement_acceptance.py
          python -m py_compile local-news-os/persistence/prs_049_consecutive_no_change_idempotency_acceptance.py
          python -m py_compile local-news-os/persistence/prs_050_current_social_truth_acceptance.py
          python -m py_compile local-news-os/persistence/prs_051_profile_state_separation_acceptance.py
          python -m py_compile local-news-os/persistence/prs_052_open_editorial_decision_acceptance.py
          python -m py_compile local-news-os/persistence/prs_053_low_latency_main_evidence_acceptance.py
          python -m py_compile local-news-os/persistence/prs_054_source_intelligence_workstream_acceptance.py
          python -m py_compile local-news-os/persistence/prs_055_monitor_fact_kernel_bridge_acceptance.py
          python -m py_compile local-news-os/persistence/prs_056_local_places_subcapability_acceptance.py
      - name: Run deterministic fail-closed reconciliation acceptance
        run: python local-news-os/persistence/reconciliation_engine.py --self-test
      - name: Validate PRS-037 reconciliation trigger contract and executable wiring
        run: python local-news-os/persistence/validate_reconciliation_triggers.py --self-test
      - name: Validate PRS-038 fail-closed persistence writer
        run: python local-news-os/persistence/persistence_writer.py --self-test
      - name: Validate PRS-039 zero-credential persistence contract
        run: python local-news-os/persistence/credential_safety.py --self-test
      - name: Validate PRS-040 readback-verified latest-state promotion
        run: python local-news-os/persistence/latest_state_promotion.py --self-test
      - name: Validate PRS-041 canonical persistence health signal
        run: python local-news-os/persistence/persistence_health.py --self-test
      - name: Validate PRS-042 Drive-old main-new reconciliation
        run: python local-news-os/persistence/prs_042_drive_old_main_new_acceptance.py
      - name: Validate PRS-043 open unmerged PR reconciliation
        run: python local-news-os/persistence/prs_043_open_pr_unmerged_acceptance.py
      - name: Validate PRS-044 superseded PR later-merge reconciliation
        run: python local-news-os/persistence/prs_044_superseded_pr_later_merge_acceptance.py
      - name: Validate PRS-045 outbox-only social capability reconciliation
        run: python local-news-os/persistence/prs_045_outbox_only_capability_acceptance.py
      - name: Validate PRS-046 profile asset without remote readback reconciliation
        run: python local-news-os/persistence/prs_046_profile_asset_no_remote_readback_acceptance.py
      - name: Validate PRS-047 no-progress checkpoint followed by main implementation
        run: python local-news-os/persistence/prs_047_no_progress_checkpoint_then_main_acceptance.py
      - name: Validate PRS-048 explicit decision replacement semantics
        run: python local-news-os/persistence/prs_048_explicit_decision_replacement_acceptance.py
      - name: Validate PRS-049 consecutive no-change idempotency
        run: python local-news-os/persistence/prs_049_consecutive_no_change_idempotency_acceptance.py
      - name: Validate PRS-050 current social truth binding
        run: python local-news-os/persistence/prs_050_current_social_truth_acceptance.py
      - name: Validate PRS-051 profile asset/deployment state separation
        run: python local-news-os/persistence/prs_051_profile_state_separation_acceptance.py
      - name: Validate PRS-052 open editorial decision remains active
        run: python local-news-os/persistence/prs_052_open_editorial_decision_acceptance.py
      - name: Validate PRS-053 later merged low-latency main evidence
        run: python local-news-os/persistence/prs_053_low_latency_main_evidence_acceptance.py
      - name: Validate PRS-054 Source Intelligence engine/coverage separation
        run: python local-news-os/persistence/prs_054_source_intelligence_workstream_acceptance.py
      - name: Validate PRS-055 per-monitor Fact Kernel bridge persistence
        run: python local-news-os/persistence/prs_055_monitor_fact_kernel_bridge_acceptance.py
      - name: Validate PRS-056 local-places sub-capability persistence
        run: python local-news-os/persistence/prs_056_local_places_subcapability_acceptance.py
      - name: Validate existing scope classifier alongside reconciliation
        run: python local-news-os/core/repository_scope_fingerprint.py --self-test
      - name: Verify acceptance contracts are present
        run: |
          test -s local-news-os/persistence/RECONCILIATION_ENGINE_ACCEPTANCE.md
          test -s local-news-os/persistence/PERSISTENCE_WRITER_ACCEPTANCE.md
          test -s local-news-os/persistence/CREDENTIAL_SAFETY_ACCEPTANCE.md
          test -s local-news-os/persistence/READBACK_PROMOTION_ACCEPTANCE.md
          test -s local-news-os/persistence/PERSISTENCE_HEALTH_ACCEPTANCE.md
