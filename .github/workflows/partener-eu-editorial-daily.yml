name: PARTENER.EU Editorial Daily Products

on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * *'
  workflow_run:
    workflows:
      - 'PARTENER.EU Decision Products'
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/build_daily_brief.py'
      - 'partener-eu/ingest/build_people_policy.py'
      - 'partener-eu/ingest/people_policy_official_ingest.py'
      - 'partener-eu/ingest/refine_people_policy.py'
      - 'partener-eu/ingest/state/people_policy_registry.json'
      - 'partener-eu/ingest/state/people_policy_source_registry.json'
      - 'partener-eu/ingest/state/people_policy_seed.json'
      - 'partener-eu/ops/test_editorial_automation.py'
      - 'partener-eu/ops/test_people_policy_source_intelligence.py'
      - 'partener-eu/web/daily-brief.js'
      - 'partener-eu/web/people-policy-v1.js'
      - 'partener-eu/web/daily-brief.css'
      - 'partener-eu/web/people-policy-v1.css'
      - '.github/workflows/partener-eu-editorial-daily.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-editorial-daily
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Ingest official decision-maker signals
        run: python partener-eu/ingest/people_policy_official_ingest.py

      - name: Validate materialized official-source ledger
        run: |
          python partener-eu/ops/test_people_policy_source_intelligence.py
          python - <<'PY'
          import json
          from pathlib import Path

          state = Path('partener-eu/ingest/state')
          ledger = json.loads((state / 'people_policy_official_sources.json').read_text(encoding='utf-8'))
          registry = json.loads((state / 'people_policy_source_registry.json').read_text(encoding='utf-8'))

          assert ledger.get('schemaVersion') == 2, 'official-source ledger must materialize schemaVersion 2'
          policy = ledger.get('policy') or {}
          assert policy.get('failClosed') is True
          assert policy.get('administrativeFactsNeverPromotedFromSignals') is True
          assert policy.get('personSignalsRequireVerifiedRoleSnapshot') is True
          assert policy.get('sourceHealthRequiresArticleFetchProofWhenCandidatesExist') is True

          expected = {x['id'] for x in registry.get('sources', []) if x.get('enabled') is True}
          rows = ledger.get('sources') or []
          actual = {x.get('id') for x in rows}
          assert actual == expected, f'source ledger mismatch: expected={sorted(expected)} actual={sorted(actual)}'

          allowed = {
              'OK', 'OK_NO_CANDIDATES', 'DEGRADED_PARTIAL_ARTICLE_FETCH',
              'DEGRADED_ARTICLE_FETCH_FAILED', 'SOURCE_UNAVAILABLE_HISTORY_PRESERVED',
          }
          for row in rows:
              status = row.get('status')
              assert status in allowed, f"unsupported source health status: {row.get('id')}={status}"
              assert row.get('observedAt'), f"missing observedAt: {row.get('id')}"
              assert row.get('failClosed') is True, f"source not fail-closed: {row.get('id')}"
              if not str(status).startswith('SOURCE_UNAVAILABLE'):
                  assert row.get('listingFetched') is True, f"listing proof missing: {row.get('id')}"
                  candidates = int(row.get('candidateLinks') or 0)
                  attempts = int(row.get('articleFetchAttempts') or 0)
                  successes = int(row.get('articleFetchSuccesses') or 0)
                  failures = int(row.get('articleFetchFailures') or 0)
                  assert attempts == candidates, f"candidate/fetch mismatch: {row.get('id')}"
                  assert successes + failures == attempts, f"fetch accounting mismatch: {row.get('id')}"
                  if status == 'OK':
                      assert candidates > 0 and successes == attempts
                  elif status == 'OK_NO_CANDIDATES':
                      assert candidates == 0 and attempts == 0
                  elif status == 'DEGRADED_ARTICLE_FETCH_FAILED':
                      assert candidates > 0 and successes == 0 and failures == attempts
                  elif status == 'DEGRADED_PARTIAL_ARTICLE_FETCH':
                      assert successes > 0 and failures > 0

          for item in ledger.get('items') or []:
              assert item.get('signalKind') == 'STATEMENT_SIGNAL'
              fact = item.get('administrativeFact') or {}
              assert fact.get('status') == 'UNCONFIRMED_FROM_SIGNAL'
              assert fact.get('failClosed') is True
              assert (item.get('roleVerification') or {}).get('sourceTier', '').startswith('T1')
              assert (item.get('sourceSnapshot') or {}).get('contentHash')
              assert item.get('fingerprint')
          print(json.dumps({'schemaVersion': 2, 'sources': len(rows), 'signals': len(ledger.get('items') or [])}))
          PY

      - name: Persist official-source ledger checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cp partener-eu/ingest/state/people_policy_official_sources.json /tmp/people_policy_official_sources.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          checkpointed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/people_policy_official_sources.json partener-eu/ingest/state/people_policy_official_sources.json
            git add partener-eu/ingest/state/people_policy_official_sources.json
            if git diff --cached --quiet; then
              echo 'Official-source ledger already current.'
              checkpointed=true
              break
            fi
            git commit -m 'Checkpoint official decision-maker source ledger'
            if git push origin HEAD:main; then
              checkpointed=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$checkpointed" != true ]; then
            echo 'Failed to persist official-source ledger after retries.' >&2
            exit 1
          fi
          git fetch origin main
          git reset --hard origin/main

      - name: Generate editorial intelligence
        run: |
          python partener-eu/ingest/build_daily_brief.py
          python partener-eu/ingest/build_people_policy.py
          python partener-eu/ingest/refine_people_policy.py

      - name: Validate editorial automation contract
        run: |
          node --check partener-eu/web/daily-brief.js
          node --check partener-eu/web/people-policy-v1.js
          python partener-eu/ops/test_people_policy_source_intelligence.py
          python partener-eu/ops/test_editorial_automation.py

      - name: Persist generated editorial products and official-source ledger
        shell: bash
        run: |
          set -euo pipefail
          cp partener-eu/ingest/state/daily_brief.json /tmp/daily_brief.json
          cp partener-eu/ingest/state/people_policy.json /tmp/people_policy.json
          cp partener-eu/ingest/state/people_policy_official_sources.json /tmp/people_policy_official_sources.json
          cp partener-eu/web/daily-brief-data.js /tmp/daily-brief-data.js
          cp partener-eu/web/people-policy-data.js /tmp/people-policy-data.js
          python - <<'PY' > /tmp/editorial-version.txt
          import json,re
          from pathlib import Path
          data=json.loads(Path('/tmp/daily_brief.json').read_text(encoding='utf-8'))
          print(re.sub(r'\D','',data['asOf'])[:14])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/daily_brief.json partener-eu/ingest/state/daily_brief.json
            cp /tmp/people_policy.json partener-eu/ingest/state/people_policy.json
            cp /tmp/people_policy_official_sources.json partener-eu/ingest/state/people_policy_official_sources.json
            cp /tmp/daily-brief-data.js partener-eu/web/daily-brief-data.js
            cp /tmp/people-policy-data.js partener-eu/web/people-policy-data.js
            EDITORIAL_VERSION=$(cat /tmp/editorial-version.txt)
            export EDITORIAL_VERSION
            python - <<'PY'
          import os,re
          from pathlib import Path
          path=Path('partener-eu/web/index.html')
          text=path.read_text(encoding='utf-8')
          v=os.environ['EDITORIAL_VERSION']
          for name in ('daily-brief-data.js','people-policy-data.js'):
              text=re.sub(rf'({re.escape(name)}\?v=)[^"\']+',rf'\g<1>{v}',text)
          path.write_text(text,encoding='utf-8')
          PY
            git add \
              partener-eu/web/index.html \
              partener-eu/ingest/state/daily_brief.json \
              partener-eu/ingest/state/people_policy.json \
              partener-eu/ingest/state/people_policy_official_sources.json \
              partener-eu/web/daily-brief-data.js \
              partener-eu/web/people-policy-data.js
            if git diff --cached --quiet; then
              echo 'Editorial products already current.'
              exit 0
            fi
            git commit -m 'Refresh official decision-maker intelligence and daily briefing'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
