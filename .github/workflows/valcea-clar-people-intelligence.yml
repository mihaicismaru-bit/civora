name: VÂLCEA CLAR Identity Intelligence

# People and artist intelligence share the public identity/indexing surface.
# Build both in one transaction so no independent workflow can overwrite
# site/indexing_routes.json or a sibling profile projection with stale state.
on:
  workflow_dispatch:
  schedule:
    - cron: '29 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/person_profile_policy.json'
      - 'valcea-clar/editorial/person_profile_seeds.json'
      - 'valcea-clar/editorial/person_profile_overrides.json'
      - 'valcea-clar/editorial/festival_lineups_2026.json'
      - 'valcea-clar/editorial/performing_arts_people_2026.json'
      - 'valcea-clar/scripts/build_person_profiles.py'
      - 'valcea-clar/scripts/discover_person_sources.py'
      - 'valcea-clar/scripts/render_person_pages.py'
      - 'valcea-clar/scripts/enrich_festival_artists.py'
      - 'valcea-clar/scripts/render_artist_pages.py'
      - '.github/workflows/valcea-clar-people-intelligence.yml'
  pull_request:
    paths:
      - 'valcea-clar/editorial/person_profile_policy.json'
      - 'valcea-clar/editorial/person_profile_seeds.json'
      - 'valcea-clar/editorial/person_profile_overrides.json'
      - 'valcea-clar/editorial/festival_lineups_2026.json'
      - 'valcea-clar/editorial/performing_arts_people_2026.json'
      - 'valcea-clar/scripts/build_person_profiles.py'
      - 'valcea-clar/scripts/discover_person_sources.py'
      - 'valcea-clar/scripts/render_person_pages.py'
      - 'valcea-clar/scripts/enrich_festival_artists.py'
      - 'valcea-clar/scripts/render_artist_pages.py'
      - '.github/workflows/valcea-clar-people-intelligence.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-identity-intelligence-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VALCEA_CLAR_PRIVATE_EVIDENCE_MANIFEST: ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Refresh newest canonical state
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate identity intelligence contracts
        run: |
          python -m json.tool valcea-clar/editorial/person_profile_policy.json >/dev/null
          python -m json.tool valcea-clar/editorial/person_profile_seeds.json >/dev/null
          python -m json.tool valcea-clar/editorial/person_profile_overrides.json >/dev/null
          python -m py_compile \
            valcea-clar/scripts/build_person_profiles.py \
            valcea-clar/scripts/discover_person_sources.py \
            valcea-clar/scripts/render_person_pages.py \
            valcea-clar/scripts/enrich_festival_artists.py \
            valcea-clar/scripts/render_artist_pages.py
          python valcea-clar/scripts/build_person_profiles.py --self-test
          python valcea-clar/scripts/discover_person_sources.py --self-test
          python valcea-clar/scripts/enrich_festival_artists.py --self-test
          python valcea-clar/scripts/enrich_festival_artists.py --check

      - name: Build public person identities
        if: github.event_name != 'pull_request'
        run: |
          python valcea-clar/scripts/build_person_profiles.py
          python valcea-clar/scripts/build_person_profiles.py --check
          python valcea-clar/scripts/render_person_pages.py
          python valcea-clar/scripts/discover_person_sources.py --limit 8

      - name: Build public artist identities
        if: github.event_name != 'pull_request'
        run: |
          python valcea-clar/scripts/enrich_festival_artists.py
          python valcea-clar/scripts/render_artist_pages.py

      - name: Enforce identity publication boundaries
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          people=json.loads(Path('valcea-clar/site/runtime/people.json').read_text(encoding='utf-8'))
          for p in people.get('profiles', []):
              if p.get('private_evidence_receipts'):
                  raise SystemExit(f"private evidence receipt reached public projection: {p.get('id')}")
          raw=json.dumps(people,ensure_ascii=False).lower()
          for forbidden in ('raw_content','private-only claim','cnp','ci_number','home_address'):
              if forbidden in raw: raise SystemExit(f"forbidden private token: {forbidden}")
          discovery=json.loads(Path('valcea-clar/editorial/person_source_discovery_state.json').read_text(encoding='utf-8'))
          assert discovery['publication_authority']=='NONE'
          assert discovery['policy']['auto_publication'] is False
          for row in discovery.get('candidates',[]):
              assert row['publication_authority']=='NONE' and row['public_projection'] is False and row['auto_publication'] is False
          artists=json.loads(Path('valcea-clar/site/runtime/artists.json').read_text(encoding='utf-8'))
          if not isinstance(artists.get('artists') if 'artists' in artists else artists.get('profiles', []), list):
              raise SystemExit('artist projection contract invalid')
          print('IDENTITY_PUBLICATION_BOUNDARY_PASS')
          PY

      - name: Persist identity intelligence once
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          tx=/tmp/valcea-identity-intelligence
          rm -rf "$tx"
          mkdir -p "$tx/site/runtime" "$tx/editorial" "$tx/site"
          cp valcea-clar/site/runtime/people.json "$tx/site/runtime/people.json"
          cp -a valcea-clar/site/runtime/oameni "$tx/site/runtime/oameni"
          cp valcea-clar/site/runtime/artists.json "$tx/site/runtime/artists.json"
          cp -a valcea-clar/site/runtime/artisti "$tx/site/runtime/artisti"
          cp valcea-clar/site/indexing_routes.json "$tx/site/indexing_routes.json"
          cp valcea-clar/editorial/person_source_discovery_queue.json "$tx/editorial/person_source_discovery_queue.json"
          cp valcea-clar/editorial/person_source_discovery_state.json "$tx/editorial/person_source_discovery_state.json"

          git config user.name 'vâlcea-clar-identity-intelligence[bot]'
          git config user.email 'valcea-clar-identity-intelligence@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p valcea-clar/site/runtime valcea-clar/editorial
            rm -rf valcea-clar/site/runtime/oameni valcea-clar/site/runtime/artisti
            cp "$tx/site/runtime/people.json" valcea-clar/site/runtime/people.json
            cp -a "$tx/site/runtime/oameni" valcea-clar/site/runtime/oameni
            cp "$tx/site/runtime/artists.json" valcea-clar/site/runtime/artists.json
            cp -a "$tx/site/runtime/artisti" valcea-clar/site/runtime/artisti
            cp "$tx/site/indexing_routes.json" valcea-clar/site/indexing_routes.json
            cp "$tx/editorial/person_source_discovery_queue.json" valcea-clar/editorial/person_source_discovery_queue.json
            cp "$tx/editorial/person_source_discovery_state.json" valcea-clar/editorial/person_source_discovery_state.json
            git add \
              valcea-clar/site/runtime/people.json \
              valcea-clar/site/runtime/oameni \
              valcea-clar/site/runtime/artists.json \
              valcea-clar/site/runtime/artisti \
              valcea-clar/site/indexing_routes.json \
              valcea-clar/editorial/person_source_discovery_queue.json \
              valcea-clar/editorial/person_source_discovery_state.json
            if git diff --cached --quiet; then
              echo 'Identity Intelligence already current.'
              exit 0
            fi
            git commit -m 'Refresh VÂLCEA CLAR public identity intelligence'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Could not persist Identity Intelligence after five attempts.' >&2
          exit 1

      - name: Report identity boundary
        if: always()
        run: |
          echo 'People and artist profiles now share one public identity/indexing transaction.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public profiles require resolved identity; research candidates have zero publication authority.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public automation cannot read the private-evidence manifest.' >> "$GITHUB_STEP_SUMMARY"
