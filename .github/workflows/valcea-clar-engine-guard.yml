name: VÂLCEA CLAR Site Engine Ownership Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "valcea-clar/engine/**"
      - "valcea-clar/scripts/validate_site_engine_ownership.py"
      - ".github/workflows/valcea-clar-*.yml"
  push:
    branches: [main]
    paths:
      - "valcea-clar/engine/**"
      - "valcea-clar/scripts/validate_site_engine_ownership.py"
      - ".github/workflows/valcea-clar-*.yml"
  schedule:
    - cron: "11 2 * * *"

permissions:
  contents: read

concurrency:
  group: valcea-clar-site-engine-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Enforce site-engine-only execution
        run: |
          python valcea-clar/scripts/validate_site_engine_ownership.py \
            --report /tmp/site-engine-ownership-report.json

      - name: Write ownership summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path('/tmp/site-engine-ownership-report.json')
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if not report_path.exists():
              summary_path.write_text(
                  '# VÂLCEA CLAR — site engine ownership\n\nReport unavailable.\n',
                  encoding='utf-8',
              )
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding='utf-8'))
          errors = report.get('errors', [])
          lines = [
              '# VÂLCEA CLAR — site engine ownership',
              '',
              f"- Status: **{report['status']}**",
              f"- Execution owner: `{report.get('execution_owner')}`",
              f"- Scheduler: `{report.get('scheduler')}`",
              f"- Registered jobs: **{report.get('registered_jobs', 0)}**",
              f"- Runtime files scanned: **{report.get('runtime_files_scanned', 0)}**",
              f"- Retired external monitors: `{', '.join(report.get('retired_external_monitors', []))}`",
          ]
          if errors:
              lines.extend(['', '## Errors'])
              lines.extend(f"- {error}" for error in errors)
          summary_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload ownership report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-site-engine-ownership-${{ github.run_id }}
          path: /tmp/site-engine-ownership-report.json
          if-no-files-found: warn
          retention-days: 14
