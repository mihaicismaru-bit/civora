name: EUCONS Client Finder Evaluation Transition

on:
  pull_request:
    paths:
      - 'eucons/leads/client_finder_evaluation_transition.py'
      - 'eucons/leads/client_finder_evaluation_transition_contract.json'
      - 'eucons/validation/test_client_finder_evaluation_transition_fail_closed.py'
      - '.github/workflows/eucons-client-finder-evaluation-transition.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/leads/client_finder_evaluation_transition.py'
      - 'eucons/leads/client_finder_evaluation_transition_contract.json'
      - 'eucons/validation/test_client_finder_evaluation_transition_fail_closed.py'
      - '.github/workflows/eucons-client-finder-evaluation-transition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-client-finder-evaluation-transition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Client Finder research-evaluation transition fail-closed behavior
        run: python eucons/validation/test_client_finder_evaluation_transition_fail_closed.py
