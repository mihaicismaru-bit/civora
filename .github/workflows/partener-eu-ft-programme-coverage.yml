name: PARTENER.EU F&T Programme Coverage Watch

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eu_direct_ft_programme_watch.py'
      - 'partener-eu/ingest/eu_direct_ft_coverage_receipt.py'
      - 'partener-eu/ingest/eu_direct_ft_programme_taxonomy.py'
      - 'partener-eu/ingest/eu_direct_life_ft_exact.py'
      - 'partener-eu/ingest/eu_direct_life_ft_reconcile.py'
      - 'partener-eu/ingest/eu_direct_cef_ft_exact.py'
      - 'partener-eu/ingest/eu_direct_cef_ft_reconcile.py'
      - 'partener-eu/ingest/eu_direct_cef_ft_handoff.py'
      - 'partener-eu/ingest/eu_direct_digital_ft_exact.py'
      - 'partener-eu/ingest/eu_direct_digital_ft_reconcile.py'
      - 'partener-eu/ingest/eu_direct_digital_ft_handoff.py'
      - 'partener-eu/ingest/eu_direct_smp_ft_exact.py'
      - 'partener-eu/ingest/eu_direct_smp_ft_reconcile.py'
      - 'partener-eu/ingest/eu_direct_smp_ft_handoff.py'
      - 'partener-eu/ops/test_eu_direct_ft_programme_watch.py'
      - 'partener-eu/ops/test_eu_direct_ft_coverage_receipt.py'
      - 'partener-eu/ops/test_eu_direct_ft_programme_taxonomy.py'
      - 'partener-eu/ops/test_eu_direct_life_ft_exact.py'
      - 'partener-eu/ops/test_eu_direct_life_ft_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_cef_ft_exact.py'
      - 'partener-eu/ops/test_eu_direct_cef_ft_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_cef_ft_handoff.py'
      - 'partener-eu/ops/test_eu_direct_digital_ft_exact.py'
      - 'partener-eu/ops/test_eu_direct_digital_ft_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_digital_ft_handoff.py'
      - 'partener-eu/ops/test_eu_direct_smp_ft_exact.py'
      - 'partener-eu/ops/test_eu_direct_smp_ft_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_smp_ft_handoff.py'
      - 'partener-eu/ops/validate_eu_direct_ft_programme_live.py'
      - 'partener-eu/ops/validate_eu_direct_digital_live.py'
      - 'partener-eu/ops/validate_eu_direct_smp_live.py'
      - '.github/workflows/partener-eu-ft-programme-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  programme-coverage-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bounded EU_DIRECT programme lanes
        run: |
          python -m py_compile \
            partener-eu/ingest/eu_direct_ft_programme_watch.py \
            partener-eu/ingest/eu_direct_ft_coverage_receipt.py \
            partener-eu/ingest/eu_direct_ft_programme_taxonomy.py \
            partener-eu/ingest/eu_direct_life_ft_exact.py \
            partener-eu/ingest/eu_direct_life_ft_reconcile.py \
            partener-eu/ingest/eu_direct_cef_ft_exact.py \
            partener-eu/ingest/eu_direct_cef_ft_reconcile.py \
            partener-eu/ingest/eu_direct_cef_ft_handoff.py \
            partener-eu/ingest/eu_direct_digital_ft_exact.py \
            partener-eu/ingest/eu_direct_digital_ft_reconcile.py \
            partener-eu/ingest/eu_direct_digital_ft_handoff.py \
            partener-eu/ingest/eu_direct_smp_ft_exact.py \
            partener-eu/ingest/eu_direct_smp_ft_reconcile.py \
            partener-eu/ingest/eu_direct_smp_ft_handoff.py \
            partener-eu/ops/test_eu_direct_ft_programme_watch.py \
            partener-eu/ops/test_eu_direct_ft_coverage_receipt.py \
            partener-eu/ops/test_eu_direct_ft_programme_taxonomy.py \
            partener-eu/ops/test_eu_direct_life_ft_exact.py \
            partener-eu/ops/test_eu_direct_life_ft_reconcile.py \
            partener-eu/ops/test_eu_direct_cef_ft_exact.py \
            partener-eu/ops/test_eu_direct_cef_ft_reconcile.py \
            partener-eu/ops/test_eu_direct_cef_ft_handoff.py \
            partener-eu/ops/test_eu_direct_digital_ft_exact.py \
            partener-eu/ops/test_eu_direct_digital_ft_reconcile.py \
            partener-eu/ops/test_eu_direct_digital_ft_handoff.py \
            partener-eu/ops/test_eu_direct_smp_ft_exact.py \
            partener-eu/ops/test_eu_direct_smp_ft_reconcile.py \
            partener-eu/ops/test_eu_direct_smp_ft_handoff.py \
            partener-eu/ops/validate_eu_direct_ft_programme_live.py \
            partener-eu/ops/validate_eu_direct_digital_live.py \
            partener-eu/ops/validate_eu_direct_smp_live.py

      - name: Validate fail-closed bounded source semantics
        run: |
          python partener-eu/ops/test_eu_direct_ft_programme_watch.py
          python partener-eu/ops/test_eu_direct_ft_coverage_receipt.py
          python partener-eu/ops/test_eu_direct_ft_programme_taxonomy.py
          python partener-eu/ops/test_eu_direct_life_ft_exact.py
          python partener-eu/ops/test_eu_direct_life_ft_reconcile.py
          python partener-eu/ops/test_eu_direct_cef_ft_exact.py
          python partener-eu/ops/test_eu_direct_cef_ft_reconcile.py
          PYTHONPATH=partener-eu/ingest python partener-eu/ops/test_eu_direct_cef_ft_handoff.py
          python partener-eu/ops/test_eu_direct_digital_ft_exact.py
          python partener-eu/ops/test_eu_direct_digital_ft_reconcile.py
          PYTHONPATH=partener-eu/ingest python partener-eu/ops/test_eu_direct_digital_ft_handoff.py
          python partener-eu/ops/test_eu_direct_smp_ft_exact.py
          python partener-eu/ops/test_eu_direct_smp_ft_reconcile.py
          PYTHONPATH=partener-eu/ingest python partener-eu/ops/test_eu_direct_smp_ft_handoff.py

      - name: Capture bounded live official F&T programme coverage
        run: |
          rm -rf /tmp/partener-eu-ft-programme-watch
          rm -rf /tmp/partener-eu-ft-history-scratch
          python partener-eu/ingest/eu_direct_ft_programme_watch.py \
            --output-dir /tmp/partener-eu-ft-programme-watch \
            --page-size 25 \
            --max-pages 8

      - name: Bind explicit coverage-completeness receipt
        run: |
          python partener-eu/ingest/eu_direct_ft_coverage_receipt.py \
            /tmp/partener-eu-ft-programme-watch/programme-watch.json \
            --output /tmp/partener-eu-ft-programme-watch/programme-coverage-receipt.json

      - name: Normalize official programme taxonomy for market intelligence
        run: |
          python partener-eu/ingest/eu_direct_ft_programme_taxonomy.py \
            /tmp/partener-eu-ft-programme-watch/programme-watch.json \
            --output /tmp/partener-eu-ft-programme-watch/programme-taxonomy.json

      - name: Execute bounded exact-current LIFE handoff
        run: |
          python partener-eu/ingest/eu_direct_life_ft_exact.py \
            --taxonomy /tmp/partener-eu-ft-programme-watch/programme-taxonomy.json \
            --output-dir /tmp/partener-eu-ft-programme-watch/life-exact \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Restore previous successful same-branch exact evidence
        id: previous_exact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          HISTORY="$ROOT/history"
          SCRATCH=/tmp/partener-eu-ft-history-scratch
          mkdir -p "$HISTORY/previous/life-exact" "$HISTORY/previous/cef-exact" "$HISTORY/previous/digital-exact" "$HISTORY/previous/smp-exact" "$SCRATCH"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$HISTORY/artifacts.json"

          python - <<'PY' > /tmp/partener-ft-history-candidates.tsv
          import json, os
          data=json.load(open('/tmp/partener-eu-ft-programme-watch/history/artifacts.json', encoding='utf-8'))
          branch=(os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME') or '').strip()
          current=int(os.environ['GITHUB_RUN_ID'])
          rows=[]
          for artifact in data.get('artifacts') or []:
              name=str(artifact.get('name') or '')
              if not name.startswith('partener-eu-ft-programme-coverage-') or artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              run_id=int(run.get('id') or 0)
              if not run_id or run_id == current:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              rows.append((str(artifact.get('created_at') or ''), run_id, name))
          seen=set()
          for created, run_id, name in sorted(rows, reverse=True):
              if run_id in seen:
                  continue
              seen.add(run_id)
              print(f'{run_id}\t{name}')
          PY

          python - <<'PY' > /tmp/partener-smp-history-candidates.tsv
          import json, os
          data=json.load(open('/tmp/partener-eu-ft-programme-watch/history/artifacts.json', encoding='utf-8'))
          branch=(os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME') or '').strip()
          current=int(os.environ['GITHUB_RUN_ID'])
          rows=[]
          for artifact in data.get('artifacts') or []:
              name=str(artifact.get('name') or '')
              if not (name.startswith('partener-eu-ft-programme-coverage-') or name.startswith('partener-eu-smp-bounded-')):
                  continue
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              run_id=int(run.get('id') or 0)
              if not run_id or run_id == current:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              rows.append((str(artifact.get('created_at') or ''), run_id, name))
          seen=set()
          for created, run_id, name in sorted(rows, reverse=True):
              key=(run_id,name)
              if key in seen:
                  continue
              seen.add(key)
              print(f'{run_id}\t{name}')
          PY

          LIFE_FOUND=""
          LIFE_FOUND_NAME=""
          LIFE_DOWNLOADED=0
          while IFS=$'\t' read -r RUN_ID ARTIFACT_NAME; do
            [ -n "$RUN_ID" ] || continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
            [ "$CONCLUSION" = "success" ] || continue
            DEST="$SCRATCH/life-${RUN_ID}"
            mkdir -p "$DEST"
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$DEST"; then
              continue
            fi
            LIFE_DOWNLOADED=$((LIFE_DOWNLOADED + 1))
            PREVIOUS="$(find "$DEST" -type f -path '*/life-exact/ft-life-exact-evidence.json' -not -path '*/history/*' -print -quit)"
            [ -n "$PREVIOUS" ] && [ -s "$PREVIOUS" ] || { [ "$LIFE_DOWNLOADED" -lt 8 ] && continue || break; }
            if PYTHONPATH=partener-eu/ingest python - "$PREVIOUS" "$ROOT/life-exact/ft-life-exact-evidence.json" <<'PY'
          import json, sys
          from eu_direct_life_ft_exact import validate_evidence
          from eu_direct_life_ft_reconcile import parse_time
          previous=json.load(open(sys.argv[1], encoding='utf-8'))
          current=json.load(open(sys.argv[2], encoding='utf-8'))
          validate_evidence(previous)
          validate_evidence(current)
          if previous.get('reference') != current.get('reference'):
              raise SystemExit(1)
          if parse_time(str(previous.get('fetched_at'))) > parse_time(str(current.get('fetched_at'))):
              raise SystemExit(1)
          PY
            then
              cp "$PREVIOUS" "$HISTORY/previous/life-exact/ft-life-exact-evidence.json"
              LIFE_FOUND="$RUN_ID"
              LIFE_FOUND_NAME="$ARTIFACT_NAME"
              break
            fi
            [ "$LIFE_DOWNLOADED" -lt 8 ] || break
          done < /tmp/partener-ft-history-candidates.tsv

          CEF_FOUND=""
          CEF_FOUND_NAME=""
          CEF_REFERENCE=""
          CEF_DOWNLOADED=0
          while IFS=$'\t' read -r RUN_ID ARTIFACT_NAME; do
            [ -n "$RUN_ID" ] || continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
            [ "$CONCLUSION" = "success" ] || continue
            DEST="$SCRATCH/cef-${RUN_ID}"
            mkdir -p "$DEST"
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$DEST"; then
              continue
            fi
            CEF_DOWNLOADED=$((CEF_DOWNLOADED + 1))
            PREVIOUS="$(find "$DEST" -type f -path '*/cef-exact/ft-cef-exact-evidence.json' -not -path '*/history/*' -print -quit)"
            [ -n "$PREVIOUS" ] && [ -s "$PREVIOUS" ] || { [ "$CEF_DOWNLOADED" -lt 8 ] && continue || break; }
            if CEF_REFERENCE="$(PYTHONPATH=partener-eu/ingest python - "$PREVIOUS" <<'PY'
          import json, sys
          from eu_direct_cef_ft_exact import validate_evidence
          previous=json.load(open(sys.argv[1], encoding='utf-8'))
          validate_evidence(previous)
          print(previous['reference'])
          PY
            )"; then
              cp "$PREVIOUS" "$HISTORY/previous/cef-exact/ft-cef-exact-evidence.json"
              CEF_FOUND="$RUN_ID"
              CEF_FOUND_NAME="$ARTIFACT_NAME"
              break
            fi
            [ "$CEF_DOWNLOADED" -lt 8 ] || break
          done < /tmp/partener-ft-history-candidates.tsv

          DIGITAL_FOUND=""
          DIGITAL_FOUND_NAME=""
          DIGITAL_REFERENCE=""
          DIGITAL_DOWNLOADED=0
          while IFS=$'\t' read -r RUN_ID ARTIFACT_NAME; do
            [ -n "$RUN_ID" ] || continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
            [ "$CONCLUSION" = "success" ] || continue
            DEST="$SCRATCH/digital-${RUN_ID}"
            mkdir -p "$DEST"
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$DEST"; then
              continue
            fi
            DIGITAL_DOWNLOADED=$((DIGITAL_DOWNLOADED + 1))
            PREVIOUS="$(find "$DEST" -type f -path '*/digital-exact/ft-digital-exact-evidence.json' -not -path '*/history/*' -print -quit)"
            [ -n "$PREVIOUS" ] && [ -s "$PREVIOUS" ] || { [ "$DIGITAL_DOWNLOADED" -lt 8 ] && continue || break; }
            if DIGITAL_REFERENCE="$(PYTHONPATH=partener-eu/ingest python - "$PREVIOUS" <<'PY'
          import json, sys
          from eu_direct_digital_ft_exact import validate_evidence
          previous=json.load(open(sys.argv[1], encoding='utf-8'))
          validate_evidence(previous)
          print(previous['reference'])
          PY
            )"; then
              cp "$PREVIOUS" "$HISTORY/previous/digital-exact/ft-digital-exact-evidence.json"
              DIGITAL_FOUND="$RUN_ID"
              DIGITAL_FOUND_NAME="$ARTIFACT_NAME"
              break
            fi
            [ "$DIGITAL_DOWNLOADED" -lt 8 ] || break
          done < /tmp/partener-ft-history-candidates.tsv

          SMP_FOUND=""
          SMP_FOUND_NAME=""
          SMP_REFERENCE=""
          SMP_DOWNLOADED=0
          while IFS=$'\t' read -r RUN_ID ARTIFACT_NAME; do
            [ -n "$RUN_ID" ] || continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
            [ "$CONCLUSION" = "success" ] || continue
            DEST="$SCRATCH/smp-${RUN_ID}-$(printf '%s' "$ARTIFACT_NAME" | sha256sum | cut -c1-8)"
            mkdir -p "$DEST"
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$DEST"; then
              continue
            fi
            SMP_DOWNLOADED=$((SMP_DOWNLOADED + 1))
            PREVIOUS="$(find "$DEST" -type f -path '*/smp-exact/ft-smp-exact-evidence.json' -not -path '*/history/*' -print -quit)"
            [ -n "$PREVIOUS" ] && [ -s "$PREVIOUS" ] || { [ "$SMP_DOWNLOADED" -lt 10 ] && continue || break; }
            if SMP_REFERENCE="$(PYTHONPATH=partener-eu/ingest python - "$PREVIOUS" <<'PY'
          import json, sys
          from eu_direct_smp_ft_exact import validate_evidence
          previous=json.load(open(sys.argv[1], encoding='utf-8'))
          validate_evidence(previous)
          print(previous['reference'])
          PY
            )"; then
              cp "$PREVIOUS" "$HISTORY/previous/smp-exact/ft-smp-exact-evidence.json"
              SMP_FOUND="$RUN_ID"
              SMP_FOUND_NAME="$ARTIFACT_NAME"
              break
            fi
            [ "$SMP_DOWNLOADED" -lt 10 ] || break
          done < /tmp/partener-smp-history-candidates.tsv

          if [ -n "$LIFE_FOUND" ]; then
            echo "life_available=true" >> "$GITHUB_OUTPUT"
            echo "life_run_id=$LIFE_FOUND" >> "$GITHUB_OUTPUT"
            echo "life_artifact_name=$LIFE_FOUND_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "life_available=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CEF_FOUND" ]; then
            echo "cef_available=true" >> "$GITHUB_OUTPUT"
            echo "cef_run_id=$CEF_FOUND" >> "$GITHUB_OUTPUT"
            echo "cef_artifact_name=$CEF_FOUND_NAME" >> "$GITHUB_OUTPUT"
            echo "cef_reference=$CEF_REFERENCE" >> "$GITHUB_OUTPUT"
          else
            echo "cef_available=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$DIGITAL_FOUND" ]; then
            echo "digital_available=true" >> "$GITHUB_OUTPUT"
            echo "digital_run_id=$DIGITAL_FOUND" >> "$GITHUB_OUTPUT"
            echo "digital_artifact_name=$DIGITAL_FOUND_NAME" >> "$GITHUB_OUTPUT"
            echo "digital_reference=$DIGITAL_REFERENCE" >> "$GITHUB_OUTPUT"
          else
            echo "digital_available=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SMP_FOUND" ]; then
            echo "smp_available=true" >> "$GITHUB_OUTPUT"
            echo "smp_run_id=$SMP_FOUND" >> "$GITHUB_OUTPUT"
            echo "smp_artifact_name=$SMP_FOUND_NAME" >> "$GITHUB_OUTPUT"
            echo "smp_reference=$SMP_REFERENCE" >> "$GITHUB_OUTPUT"
          else
            echo "smp_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile exact LIFE against previous same-identity evidence
        shell: bash
        env:
          PREVIOUS_LIFE_AVAILABLE: ${{ steps.previous_exact.outputs.life_available }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          ARGS=(
            "$ROOT/life-exact/ft-life-exact-evidence.json"
            --output "$ROOT/life-exact/ft-life-reconciliation.json"
          )
          if [ "$PREVIOUS_LIFE_AVAILABLE" = "true" ]; then
            ARGS+=(--previous "$ROOT/history/previous/life-exact/ft-life-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_life_ft_reconcile.py "${ARGS[@]}"

      - name: Resolve bounded CEF family handoff state
        id: cef_handoff
        shell: bash
        env:
          PREVIOUS_CEF_AVAILABLE: ${{ steps.previous_exact.outputs.cef_available }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          ARGS=(
            --taxonomy "$ROOT/programme-taxonomy.json"
            --output "$ROOT/cef-exact/ft-cef-handoff-state.json"
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )
          if [ "$PREVIOUS_CEF_AVAILABLE" = "true" ]; then
            ARGS+=(--previous "$ROOT/history/previous/cef-exact/ft-cef-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_cef_ft_handoff.py "${ARGS[@]}"
          python - "$ROOT/cef-exact/ft-cef-handoff-state.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          state=json.load(open(sys.argv[1], encoding='utf-8'))
          print(f"mode={state['observation_state']}")
          print(f"target_reference={state['target_reference'] or ''}")
          print(f"exact_recheck_required={'true' if state['exact_recheck_required'] else 'false'}")
          print(f"previous_same_identity={'true' if state['previous_same_identity'] else 'false'}")
          PY

      - name: Execute bounded exact-current CEF handoff
        if: steps.cef_handoff.outputs.exact_recheck_required == 'true'
        shell: bash
        env:
          CEF_HANDOFF_MODE: ${{ steps.cef_handoff.outputs.mode }}
          CEF_TARGET_REFERENCE: ${{ steps.cef_handoff.outputs.target_reference }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          if [ "$CEF_HANDOFF_MODE" = "CURRENT_BOUNDED_SAMPLE_CANDIDATE_EXACT_RECHECK" ]; then
            python partener-eu/ingest/eu_direct_cef_ft_exact.py \
              --taxonomy "$ROOT/programme-taxonomy.json" \
              --output-dir "$ROOT/cef-exact" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            python partener-eu/ingest/eu_direct_cef_ft_exact.py \
              --reference "$CEF_TARGET_REFERENCE" \
              --output-dir "$ROOT/cef-exact" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

      - name: Reconcile exact CEF against previous same-identity evidence
        if: steps.cef_handoff.outputs.exact_recheck_required == 'true'
        shell: bash
        env:
          PREVIOUS_CEF_AVAILABLE: ${{ steps.previous_exact.outputs.cef_available }}
          PREVIOUS_CEF_SAME_IDENTITY: ${{ steps.cef_handoff.outputs.previous_same_identity }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          ARGS=(
            "$ROOT/cef-exact/ft-cef-exact-evidence.json"
            --output "$ROOT/cef-exact/ft-cef-reconciliation.json"
          )
          if [ "$PREVIOUS_CEF_AVAILABLE" = "true" ] && [ "$PREVIOUS_CEF_SAME_IDENTITY" = "true" ]; then
            ARGS+=(--previous "$ROOT/history/previous/cef-exact/ft-cef-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_cef_ft_reconcile.py "${ARGS[@]}"

      - name: Resolve bounded Digital Europe family handoff state
        id: digital_handoff
        shell: bash
        env:
          PREVIOUS_DIGITAL_AVAILABLE: ${{ steps.previous_exact.outputs.digital_available }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          ARGS=(
            --taxonomy "$ROOT/programme-taxonomy.json"
            --output "$ROOT/digital-exact/ft-digital-handoff-state.json"
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )
          if [ "$PREVIOUS_DIGITAL_AVAILABLE" = "true" ]; then
            ARGS+=(--previous "$ROOT/history/previous/digital-exact/ft-digital-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_digital_ft_handoff.py "${ARGS[@]}"
          python - "$ROOT/digital-exact/ft-digital-handoff-state.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          state=json.load(open(sys.argv[1], encoding='utf-8'))
          print(f"mode={state['observation_state']}")
          print(f"target_reference={state['target_reference'] or ''}")
          print(f"exact_recheck_required={'true' if state['exact_recheck_required'] else 'false'}")
          print(f"previous_same_identity={'true' if state['previous_same_identity'] else 'false'}")
          PY

      - name: Execute bounded exact-current Digital Europe handoff
        if: steps.digital_handoff.outputs.exact_recheck_required == 'true'
        shell: bash
        env:
          DIGITAL_HANDOFF_MODE: ${{ steps.digital_handoff.outputs.mode }}
          DIGITAL_TARGET_REFERENCE: ${{ steps.digital_handoff.outputs.target_reference }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          if [ "$DIGITAL_HANDOFF_MODE" = "CURRENT_BOUNDED_SAMPLE_CANDIDATE_EXACT_RECHECK" ]; then
            python partener-eu/ingest/eu_direct_digital_ft_exact.py \
              --taxonomy "$ROOT/programme-taxonomy.json" \
              --output-dir "$ROOT/digital-exact" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            python partener-eu/ingest/eu_direct_digital_ft_exact.py \
              --reference "$DIGITAL_TARGET_REFERENCE" \
              --output-dir "$ROOT/digital-exact" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

      - name: Reconcile exact Digital Europe against previous same-identity evidence
        if: steps.digital_handoff.outputs.exact_recheck_required == 'true'
        shell: bash
        env:
          PREVIOUS_DIGITAL_AVAILABLE: ${{ steps.previous_exact.outputs.digital_available }}
          PREVIOUS_DIGITAL_SAME_IDENTITY: ${{ steps.digital_handoff.outputs.previous_same_identity }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          ARGS=(
            "$ROOT/digital-exact/ft-digital-exact-evidence.json"
            --output "$ROOT/digital-exact/ft-digital-reconciliation.json"
          )
          if [ "$PREVIOUS_DIGITAL_AVAILABLE" = "true" ] && [ "$PREVIOUS_DIGITAL_SAME_IDENTITY" = "true" ]; then
            ARGS+=(--previous "$ROOT/history/previous/digital-exact/ft-digital-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_digital_ft_reconcile.py "${ARGS[@]}"

      - name: Resolve bounded Single Market Programme family handoff state
        id: smp_handoff
        shell: bash
        env:
          PREVIOUS_SMP_AVAILABLE: ${{ steps.previous_exact.outputs.smp_available }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          ARGS=(
            --taxonomy "$ROOT/programme-taxonomy.json"
            --output "$ROOT/smp-exact/ft-smp-handoff-state.json"
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )
          if [ "$PREVIOUS_SMP_AVAILABLE" = "true" ]; then
            ARGS+=(--previous "$ROOT/history/previous/smp-exact/ft-smp-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_smp_ft_handoff.py "${ARGS[@]}"
          python - "$ROOT/smp-exact/ft-smp-handoff-state.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          state=json.load(open(sys.argv[1], encoding='utf-8'))
          print(f"mode={state['observation_state']}")
          print(f"target_reference={state['target_reference'] or ''}")
          print(f"exact_recheck_required={'true' if state['exact_recheck_required'] else 'false'}")
          print(f"previous_same_identity={'true' if state['previous_same_identity'] else 'false'}")
          PY

      - name: Execute bounded exact-current Single Market Programme handoff
        if: steps.smp_handoff.outputs.exact_recheck_required == 'true'
        shell: bash
        env:
          SMP_HANDOFF_MODE: ${{ steps.smp_handoff.outputs.mode }}
          SMP_TARGET_REFERENCE: ${{ steps.smp_handoff.outputs.target_reference }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          if [ "$SMP_HANDOFF_MODE" = "CURRENT_BOUNDED_SAMPLE_CANDIDATE_EXACT_RECHECK" ]; then
            python partener-eu/ingest/eu_direct_smp_ft_exact.py \
              --taxonomy "$ROOT/programme-taxonomy.json" \
              --output-dir "$ROOT/smp-exact" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            python partener-eu/ingest/eu_direct_smp_ft_exact.py \
              --reference "$SMP_TARGET_REFERENCE" \
              --output-dir "$ROOT/smp-exact" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

      - name: Reconcile exact Single Market Programme against previous same-identity evidence
        if: steps.smp_handoff.outputs.exact_recheck_required == 'true'
        shell: bash
        env:
          PREVIOUS_SMP_AVAILABLE: ${{ steps.previous_exact.outputs.smp_available }}
          PREVIOUS_SMP_SAME_IDENTITY: ${{ steps.smp_handoff.outputs.previous_same_identity }}
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          ARGS=(
            "$ROOT/smp-exact/ft-smp-exact-evidence.json"
            --output "$ROOT/smp-exact/ft-smp-reconciliation.json"
          )
          if [ "$PREVIOUS_SMP_AVAILABLE" = "true" ] && [ "$PREVIOUS_SMP_SAME_IDENTITY" = "true" ]; then
            ARGS+=(--previous "$ROOT/history/previous/smp-exact/ft-smp-exact-evidence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/eu_direct_smp_ft_reconcile.py "${ARGS[@]}"

      - name: Validate live evidence remains bounded and non-authorizing
        shell: bash
        env:
          PREVIOUS_LIFE_AVAILABLE: ${{ steps.previous_exact.outputs.life_available }}
          PREVIOUS_LIFE_RUN_ID: ${{ steps.previous_exact.outputs.life_run_id }}
          PREVIOUS_CEF_AVAILABLE: ${{ steps.previous_exact.outputs.cef_available }}
          PREVIOUS_CEF_RUN_ID: ${{ steps.previous_exact.outputs.cef_run_id }}
          PREVIOUS_DIGITAL_AVAILABLE: ${{ steps.previous_exact.outputs.digital_available }}
          PREVIOUS_DIGITAL_RUN_ID: ${{ steps.previous_exact.outputs.digital_run_id }}
          PREVIOUS_SMP_AVAILABLE: ${{ steps.previous_exact.outputs.smp_available }}
          PREVIOUS_SMP_RUN_ID: ${{ steps.previous_exact.outputs.smp_run_id }}
        run: |
          set -euo pipefail
          ARGS=(--root /tmp/partener-eu-ft-programme-watch)
          if [ "$PREVIOUS_LIFE_AVAILABLE" = "true" ]; then
            ARGS+=(--previous-life-available --previous-life-run-id "$PREVIOUS_LIFE_RUN_ID")
          fi
          if [ "$PREVIOUS_CEF_AVAILABLE" = "true" ]; then
            ARGS+=(--previous-cef-available --previous-cef-run-id "$PREVIOUS_CEF_RUN_ID")
          fi
          python partener-eu/ops/validate_eu_direct_ft_programme_live.py "${ARGS[@]}"

          DIGITAL_ARGS=(--root /tmp/partener-eu-ft-programme-watch)
          if [ "$PREVIOUS_DIGITAL_AVAILABLE" = "true" ]; then
            DIGITAL_ARGS+=(--previous-digital-available --previous-digital-run-id "$PREVIOUS_DIGITAL_RUN_ID")
          fi
          python partener-eu/ops/validate_eu_direct_digital_live.py "${DIGITAL_ARGS[@]}"

          SMP_ARGS=(--root /tmp/partener-eu-ft-programme-watch)
          if [ "$PREVIOUS_SMP_AVAILABLE" = "true" ]; then
            SMP_ARGS+=(--previous-smp-available --previous-smp-run-id "$PREVIOUS_SMP_RUN_ID")
          fi
          python partener-eu/ops/validate_eu_direct_smp_live.py "${SMP_ARGS[@]}"

      - name: Enforce compact history artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-ft-programme-watch
          if find "$ROOT/history" -mindepth 1 -maxdepth 1 -type d \( -name 'download-*' -o -name 'cef-download-*' -o -name 'digital-download-*' -o -name 'smp-download-*' \) -print -quit | grep -q .; then
            echo 'recursive history download directory leaked into artifact root' >&2
            exit 1
          fi
          HISTORY_FILES="$(find "$ROOT/history" -type f | wc -l | tr -d ' ')"
          if [ "$HISTORY_FILES" -gt 5 ]; then
            echo "unexpected history artifact growth: $HISTORY_FILES files" >&2
            find "$ROOT/history" -type f -print >&2
            exit 1
          fi

      - name: Upload replayable programme-watch evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-ft-programme-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-ft-programme-watch
          retention-days: 7
          if-no-files-found: error
