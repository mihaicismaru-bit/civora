name: PARTENER.EU EUI Exact Call Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/eu_direct_eui_exact_call.py'
      - 'partener-eu/ingest/eu_direct_eui_exact_call_reconcile.py'
      - 'partener-eu/ops/test_eu_direct_eui_exact_call.py'
      - 'partener-eu/ops/test_eu_direct_eui_exact_call_reconcile.py'
      - 'partener-eu/ops/run_eui_exact_canonical.py'
      - '.github/workflows/partener-eu-eui-exact-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: partener-eu-eui-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eui-exact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile canonical-target EUI exact chain
        run: |
          python -m py_compile \
            partener-eu/ingest/eu_direct_eui_exact_call.py \
            partener-eu/ingest/eu_direct_eui_exact_call_reconcile.py \
            partener-eu/ops/test_eu_direct_eui_exact_call.py \
            partener-eu/ops/test_eu_direct_eui_exact_call_reconcile.py \
            partener-eu/ops/run_eui_exact_canonical.py

      - name: Run EUI exact acquisition fail-closed regressions
        env:
          PYTHONPATH: partener-eu/ingest
        run: python partener-eu/ops/test_eu_direct_eui_exact_call.py

      - name: Run EUI exact reconciliation regressions
        env:
          PYTHONPATH: partener-eu/ingest
        run: python partener-eu/ops/test_eu_direct_eui_exact_call_reconcile.py

      - name: Run canonical EUI exact chain with history and LKG
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EUI_EXACT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
        run: python partener-eu/ops/run_eui_exact_canonical.py

      - name: Enforce canonical EUI exact proof boundary
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('/tmp/partener-eu-eu-direct-programme-intelligence/eui-exact')
          e=json.loads((root/'current/eui-call4-exact-evidence.json').read_text(encoding='utf-8'))
          r=json.loads((root/'current/eui-call4-reconciliation.json').read_text(encoding='utf-8'))
          h=json.loads((root/'history/history-selection.json').read_text(encoding='utf-8'))
          if e.get('source_health_state') != 'HEALTHY':
              raise SystemExit(f"FAIL EUI exact official chain not healthy: {e.get('source_health_state')}")
          if e.get('identity_slug') != 'fourth-call-proposals-innovative-actions':
              raise SystemExit('FAIL EUI exact identity slug drift')
          if e.get('official_call_identifier') is not None:
              raise SystemExit('FAIL EUI exact fabricated formal identifier')
          if e.get('candidate_state') != 'CLOSED_CALL' or e.get('status_label') != 'Closed':
              raise SystemExit('FAIL EUI exact current closed candidate unresolved')
          if e.get('discovery_link_verified') is not True:
              raise SystemExit('FAIL EUI Portico discovery/detail binding unresolved')
          receipts=e.get('source_receipts') or {}
          if set(receipts) != {'portico_call_index','exact_call_detail','terms_of_reference'}:
              raise SystemExit('FAIL EUI exact source receipt inventory drift')
          if any(row.get('health_state') != 'HEALTHY' for row in receipts.values()):
              raise SystemExit('FAIL EUI exact source chain contains degraded receipt')
          if not re.fullmatch(r'[0-9a-f]{64}', str(e.get('tor_raw_sha256') or '')):
              raise SystemExit('FAIL EUI exact ToR hash missing')
          if r.get('reconciliation_state') not in {
              'BASELINE_CAPTURED_NON_AUTHORIZING','NO_CHANGE',
              'SOURCE_HEALTH_RECOVERED_BASELINE_REFRESH_NON_AUTHORIZING',
              'EUI_EXACT_CALL_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING'
          }:
              raise SystemExit(f"FAIL EUI reconciliation state: {r.get('reconciliation_state')}")
          if r.get('semantic_reconciliation_passed') is not True:
              raise SystemExit('FAIL EUI semantic reconciliation did not pass')
          if r.get('lkg_reference_is_current_truth') is not False:
              raise SystemExit('FAIL EUI LKG became current truth')
          for row in (e,r):
              for key in (
                  'material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized',
                  'budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized',
                  'call_alert_authorized','canonical_corpus_mutation'
              ):
                  if row.get(key) is not False:
                      raise SystemExit(f'FAIL EUI exact became authorizing: {key}')
              if row.get('publication_effect') != 'NONE':
                  raise SystemExit('FAIL EUI exact publication boundary drift')
          if h.get('lkg_is_current_truth') is not False:
              raise SystemExit('FAIL EUI history promoted LKG to current truth')
          print(json.dumps({
              'identity_slug': e.get('identity_slug'),
              'health': e.get('source_health_state'),
              'candidate_state': e.get('candidate_state'),
              'status_label': e.get('status_label'),
              'deadline_candidate': e.get('deadline_candidate'),
              'budget_candidate': e.get('budget_candidate'),
              'official_call_identifier': e.get('official_call_identifier'),
              'semantic_fingerprint': e.get('exact_semantic_fingerprint'),
              'reconciliation_state': r.get('reconciliation_state'),
              'semantic_change_count': r.get('semantic_change_count'),
              'history_selection': h.get('selected'),
              'publication_effect': 'NONE'
          }, sort_keys=True))
          PY

      - name: Upload bounded canonical-target EUI exact evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-eui-exact-call-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-eu-direct-programme-intelligence/eui-exact
          if-no-files-found: error
          retention-days: 7
