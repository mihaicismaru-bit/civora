name: VÂLCEA CLAR BJAI Event Signals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/bjai_valcea_events_signal_adapter.py'
      - '.github/workflows/valcea-clar-bjai-events-signals.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/bjai_valcea_events_signal_adapter.py'
      - '.github/workflows/valcea-clar-bjai-events-signals.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-bjai-events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile BJAI event adapter
        run: python -m py_compile valcea-clar/scripts/bjai_valcea_events_signal_adapter.py
      - name: Run BJAI evidence-first regressions
        run: python valcea-clar/scripts/bjai_valcea_events_signal_adapter.py --self-test
