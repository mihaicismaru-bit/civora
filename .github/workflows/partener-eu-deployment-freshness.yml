name: PARTENER.EU Deployment Freshness Watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/ops/check_deployment_freshness.py'
      - '.github/workflows/partener-eu-deployment-freshness.yml'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: partener-eu-deployment-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regression — detect drift, suppress noise, preserve LKG
        run: python partener-eu/ops/check_deployment_freshness.py --self-test
      - name: Check deployment freshness without routine commits
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python partener-eu/ops/check_deployment_freshness.py
