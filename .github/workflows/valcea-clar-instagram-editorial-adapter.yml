name: VÂLCEA CLAR Instagram Editorial Adapter

on:
  pull_request:
    paths:
      - "valcea-clar/social/feed_identity_v1_1.py"
      - "valcea-clar/social/instagram_editorial_publish.py"
      - "valcea-clar/social/instagram_editorial_v1*.py"
      - "valcea-clar/social/social_common.py"
      - "valcea-clar/social/instagram_visual_system.json"
      - "valcea-clar/social/editorial_asset_contract.py"
      - "valcea-clar/social/story_visuals.json"
      - "valcea-clar/social/fetch_approved_photos.py"
      - "valcea-clar/social/instagram_state.json"
      - "valcea-clar/site/current_edition.json"
      - "valcea-clar/site/newsroom_decision.json"
      - "valcea-clar/editorial/publication_holds.json"
      - "valcea-clar/editions/**"
      - ".github/workflows/valcea-clar-instagram-editorial-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install deterministic renderer dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch approved photographs
        run: python valcea-clar/social/fetch_approved_photos.py
      - name: Compile adapter and premium renderer
        run: python -m py_compile valcea-clar/social/feed_identity_v1_1.py valcea-clar/social/instagram_editorial_v1_1.py valcea-clar/social/instagram_editorial_v1_2.py valcea-clar/social/instagram_editorial_publish.py
      - name: Offline self-test including mock carousel publish
        run: python valcea-clar/social/instagram_editorial_publish.py --self-test
      - name: Dry-run canonical current state
        run: python valcea-clar/social/instagram_editorial_publish.py | tee /tmp/instagram-editorial-dry-run.json
      - name: Assert existing Instagram state is not republished
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/instagram-editorial-dry-run.json').read_text(encoding='utf-8'))
          if value.get('status')!='DRY_RUN':
              raise SystemExit('unexpected dry-run status')
          eligible=value.get('eligible') or []
          skipped=value.get('skipped') or []
          held={'olanesti-bridge-monitor','derived-council-gambling-20260723'}
          eligible_ids={str(x.get('story_id') or '') for x in eligible}
          if eligible_ids & held:
              raise SystemExit(f'editorial hold became Instagram-eligible: {sorted(eligible_ids & held)}')
          if any(x.get('reason')!='already_published' for x in skipped):
              raise SystemExit('Instagram canonical dedupe state contains an unexpected skip reason')
          eligible_keys={str(x.get('state_key') or '') for x in eligible if x.get('state_key')}
          skipped_keys={str(x.get('state_key') or '') for x in skipped if x.get('state_key')}
          overlap=eligible_keys & skipped_keys
          if overlap:
              raise SystemExit(f'published Instagram state became eligible again: {sorted(overlap)}')
          print(f'Instagram editorial adoption dedupe: PASS ({len(skipped)} existing skipped; {len(eligible)} new eligible)')
          PY
      - name: Assert live apply remains feature-gated
        run: |
          set -euo pipefail
          output="$(python valcea-clar/social/instagram_editorial_publish.py --apply)"
          printf '%s\n' "$output" > /tmp/instagram-editorial-apply-gated.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('/tmp/instagram-editorial-apply-gated.json').read_text(encoding='utf-8'))
          if value.get('status') not in {'NO_ELIGIBLE_POSTS','BLOCKED_EDITORIAL_LIVE_NOT_ENABLED'}:
              raise SystemExit(f"unsafe apply result: {value.get('status')}")
          print('Instagram editorial live gate: PASS')
          PY
      - name: Validate staged canonical runtime media
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime=Path('valcea-clar/site/runtime/media/social/editorial/instagram')
          if not runtime.is_dir():
              raise SystemExit('editorial runtime media staging directory missing')
          media=list(runtime.glob('*.jpg'))
          if not media:
              raise SystemExit('editorial runtime media staging is empty')
          print(f'Instagram editorial runtime staging: PASS ({len(media)} JPEGs)')
          PY
      - name: Upload adapter audit and staged media
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-instagram-editorial-adapter-${{ github.run_id }}
          path: |
            /tmp/instagram-editorial-dry-run.json
            /tmp/instagram-editorial-apply-gated.json
            valcea-clar/site/runtime/media/social/editorial/instagram
          if-no-files-found: warn
          retention-days: 14
