name: EUCONS Client Finder Commercial Scope Readiness

on:
  pull_request:
    paths:
      - 'eucons/leads/client_finder_commercial_scope_readiness.py'
      - 'eucons/leads/client_finder_commercial_scope_readiness_contract.json'
      - 'eucons/validation/test_client_finder_commercial_scope_readiness_fail_closed.py'
      - '.github/workflows/eucons-client-finder-commercial-scope-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/leads/client_finder_commercial_scope_readiness.py'
      - 'eucons/leads/client_finder_commercial_scope_readiness_contract.json'
      - 'eucons/validation/test_client_finder_commercial_scope_readiness_fail_closed.py'
      - '.github/workflows/eucons-client-finder-commercial-scope-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-client-finder-commercial-scope-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Client Finder commercial scope readiness fail-closed behavior
        run: python eucons/validation/test_client_finder_commercial_scope_readiness_fail_closed.py
