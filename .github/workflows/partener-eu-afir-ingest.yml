name: PARTENER.EU AFIR Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '31 * * * *'
  push:
    branches: [main]
    paths:
      - 'partener-eu/ingest/afir_ingest.py'
      - '.github/workflows/partener-eu-afir-ingest.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-afir-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install document parser
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Discover and fingerprint official AFIR corpus fail-closed
        run: python partener-eu/ingest/afir_ingest.py

      - name: Persist AFIR corpus and health state conflict-safe
        shell: bash
        run: |
          set -euo pipefail
          cp partener-eu/ingest/state/afir_state.json /tmp/afir_state.json
          cp partener-eu/ingest/state/afir_corpus.json /tmp/afir_corpus.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/afir_state.json partener-eu/ingest/state/afir_state.json
            cp /tmp/afir_corpus.json partener-eu/ingest/state/afir_corpus.json
            python partener-eu/ingest/intelligence_index.py
            git add partener-eu/ingest/state/afir_state.json partener-eu/ingest/state/afir_corpus.json partener-eu/ingest/state/intelligence_index.json
            if git diff --cached --quiet; then
              echo 'No AFIR corpus/state changes.'
              exit 0
            fi
            git commit -m 'Validate official AFIR corpus'
            if git push origin HEAD:main; then exit 0; fi
            echo "main advanced during AFIR persistence; retrying ${attempt}/5."
            sleep $((attempt * 2))
          done
          echo 'Unable to persist AFIR outputs after five attempts.' >&2
          exit 1
