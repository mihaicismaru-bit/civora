name: VÂLCEA CLAR Profile Identity Acceptance

# PR/manual identity-kit acceptance. Channel-specific materialization is tested
# by the canonical social engine and per-channel compatibility contracts.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "valcea-clar/social/social_brand_system.json"
      - "valcea-clar/social/profile_identity_system.json"
      - "valcea-clar/social/social_network_doctrine.json"
      - "valcea-clar/social/native_platform_identity_system.json"
      - "valcea-clar/social/native_identity.py"
      - "valcea-clar/social/validate_profile_identity.py"
      - "valcea-clar/social/validate_visual_identity_contract.py"
      - "valcea-clar/social/validate_native_platform_identity.py"
      - "valcea-clar/social/build_profile_identity_assets.py"
      - "valcea-clar/social/channels/**"
      - ".github/workflows/valcea-clar-profile-identity.yml"

permissions:
  contents: read

concurrency:
  group: valcea-clar-profile-identity-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install deterministic renderer
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Validate identity sources
        run: |
          python -m json.tool valcea-clar/social/social_brand_system.json >/dev/null
          python -m json.tool valcea-clar/social/profile_identity_system.json >/dev/null
          python -m json.tool valcea-clar/social/social_network_doctrine.json >/dev/null
          python -m json.tool valcea-clar/social/native_platform_identity_system.json >/dev/null
          python -m py_compile \
            valcea-clar/social/validate_profile_identity.py \
            valcea-clar/social/validate_visual_identity_contract.py \
            valcea-clar/social/validate_native_platform_identity.py \
            valcea-clar/social/native_identity.py \
            valcea-clar/social/build_profile_identity_assets.py
      - name: Validate profile and native identity contracts
        run: |
          python valcea-clar/social/validate_profile_identity.py --self-test
          python valcea-clar/social/validate_profile_identity.py
          python valcea-clar/social/validate_visual_identity_contract.py --self-test
          python valcea-clar/social/validate_visual_identity_contract.py
          python valcea-clar/social/validate_native_platform_identity.py --self-test
          python valcea-clar/social/validate_native_platform_identity.py
          python valcea-clar/social/native_identity.py
      - name: Render canonical profile identity kit
        run: |
          python valcea-clar/social/build_profile_identity_assets.py --self-test
          python valcea-clar/social/build_profile_identity_assets.py > /tmp/profile-identity-manifest.json
      - name: Assert output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path('valcea-clar/social/profile_identity_system.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('valcea-clar/social/profile-assets/manifest.json').read_text(encoding='utf-8'))
          assets = {row['asset_id']: row for row in manifest['assets']}
          assert manifest.get('photo_free_headers') is True
          assert assets.get('avatar-master', {}).get('width') == 1024
          for platform, cfg in profile['platforms'].items():
              avatar = assets.get(f'{platform}-avatar')
              expected = cfg['avatar_export']
              assert avatar and (avatar['width'], avatar['height']) == (expected['width'], expected['height']), platform
              header_cfg = cfg.get('header_export')
              if header_cfg:
                  header = assets.get(f'{platform}-header')
                  assert header and (header['width'], header['height']) == (header_cfg['width'], header_cfg['height']), platform
                  assert header['bytes'] <= 3 * 1024 * 1024
          assert len(assets) == 14, len(assets)
          print('VÂLCEA CLAR profile identity acceptance: PASS')
          PY
      - name: Upload rendered identity kit
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-profile-identity-${{ github.run_id }}
          path: |
            valcea-clar/social/profile-assets
            valcea-clar/social/profile_identity_system.json
            valcea-clar/social/native_platform_identity_system.json
          if-no-files-found: error
          retention-days: 30
