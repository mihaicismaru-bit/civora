name: VÂLCEA CLAR Editorial Writing Quality

on:
  pull_request:
    paths:
      - "valcea-clar/editorial/editorial_writing_quality.py"
      - "valcea-clar/scripts/editorial_writer.py"
      - "valcea-clar/scripts/editorial_writer_quality_gate.py"
      - "valcea-clar/scripts/editorial_quality_corpus_audit.py"
      - ".github/workflows/valcea-clar-editorial-writing-quality.yml"
  push:
    branches: [main]
    paths:
      - "valcea-clar/editorial/editorial_writing_quality.py"
      - "valcea-clar/scripts/editorial_writer.py"
      - "valcea-clar/scripts/editorial_writer_quality_gate.py"
      - "valcea-clar/scripts/editorial_quality_corpus_audit.py"
      - ".github/workflows/valcea-clar-editorial-writing-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-writing-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile writer, adapters, validator and corpus audit
        run: |
          python -m py_compile valcea-clar/scripts/editorial_writer.py
          python -m py_compile valcea-clar/scripts/editorial_writer_quality_gate.py
          python -m py_compile valcea-clar/scripts/editorial_quality_corpus_audit.py
          python -m py_compile valcea-clar/editorial/editorial_writing_quality.py

      - name: Run canonical writer regressions
        run: python valcea-clar/scripts/editorial_writer.py --self-test

      - name: Run deterministic editorial quality regressions
        run: python valcea-clar/editorial/editorial_writing_quality.py --self-test

      - name: Run writer-to-quality integration regressions
        run: python valcea-clar/scripts/editorial_writer_quality_gate.py --self-test

      - name: Run corpus calibration regressions
        run: python valcea-clar/scripts/editorial_quality_corpus_audit.py --self-test

      - name: Measure current public corpus without authorizing copy
        run: python valcea-clar/scripts/editorial_quality_corpus_audit.py --max-stories 60

      - name: Enforce read-only dependency and capability boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = (
              Path("valcea-clar/editorial/editorial_writing_quality.py"),
              Path("valcea-clar/scripts/editorial_writer_quality_gate.py"),
              Path("valcea-clar/scripts/editorial_quality_corpus_audit.py"),
          )
          forbidden = {"requests", "urllib", "http", "socket", "subprocess"}
          for path in paths:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              imported = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported.update(alias.name.split(".", 1)[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imported.add(node.module.split(".", 1)[0])
              bad = sorted(imported & forbidden)
              if bad:
                  raise SystemExit(f"network/process dependencies forbidden in read-only quality path {path}: {bad}")

          combined = "\n".join(path.read_text(encoding="utf-8") for path in paths)
          required_false = (
              '"publication_authorized": False',
              '"automatic_rewrite_authorized": False',
              '"fact_inference_authorized": False',
              '"fact_kernel_mutation_authorized": False',
              '"source_provenance_mutation_authorized": False',
              '"breaking_promotion_authorized": False',
          )
          missing = [token for token in required_false if token not in combined]
          if missing:
              raise SystemExit(f"fail-closed capability declarations missing: {missing}")

          adapter = Path("valcea-clar/scripts/editorial_writer_quality_gate.py").read_text(encoding="utf-8")
          required_adapter_semantics = (
              '"confirmed_facts_from_fact_kernel_claims_only": True',
              '"copy_or_fact_inference": False',
              '"writer_output_mutation_authorized": False',
          )
          missing_adapter = [token for token in required_adapter_semantics if token not in adapter]
          if missing_adapter:
              raise SystemExit(f"writer-quality binding semantics missing: {missing_adapter}")

          corpus = Path("valcea-clar/scripts/editorial_quality_corpus_audit.py").read_text(encoding="utf-8")
          required_corpus_semantics = (
              '"copy_is_not_evidence": True',
              '"legacy_copy_can_never_receive_pass_from_this_audit": True',
              '"legacy_copy_can_never_receive_fail_publication_authority_from_this_audit": True',
              '"runtime_persistence_authorized": False',
          )
          missing_corpus = [token for token in required_corpus_semantics if token not in corpus]
          if missing_corpus:
              raise SystemExit(f"corpus calibration boundary missing: {missing_corpus}")
          print("writer -> quality -> corpus read-only dependency/capability boundary: PASS")
          PY
