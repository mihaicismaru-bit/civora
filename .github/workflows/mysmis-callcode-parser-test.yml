name: MySMIS Call Code Parser Test
on:
  push:
    branches: [agent/mipe-resilient-ingestion-v2]
    paths:
      - '.github/workflows/mysmis-callcode-parser-test.yml'
      - 'partener-eu/ingest/mipe_ingest_v2_runner.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Verify one-to-one call-code extraction on official registry page
        shell: bash
        run: |
          set -euo pipefail
          curl -L --compressed -sS --connect-timeout 8 --max-time 30 \
            -A 'PARTENER.EU-CIVORA-MySMIS-Parser-Test/1.0 (+https://partener.eu)' \
            -o /tmp/mysmis.html \
            'https://reporting.mysmis2021.gov.ro/ords/repo_bo/r/mysmis-2021/finantari-programe-2021-2027'
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'partener-eu/ingest')
          import mipe_ingest_v2_runner as runner
          import mipe_ingest_v2 as v2
          raw=open('/tmp/mysmis.html','rb').read()
          parsed=v2.parse_registry_html(raw)
          print(json.dumps({
            'rows':len(parsed.get('rows') or []),
            'range':parsed.get('range'),
            'total':parsed.get('total'),
            'identity':parsed.get('callCodeIdentity'),
            'uniqueIds':len({r.get('id') for r in parsed.get('rows') or []}),
            'sampleCodes':[r.get('callCode') for r in (parsed.get('rows') or [])[:3]],
          },ensure_ascii=False,indent=2))
          rows=parsed.get('rows') or []
          ident=parsed.get('callCodeIdentity') or {}
          assert rows, 'registry rows missing'
          assert ident.get('accepted') is True, ident
          assert len({r.get('id') for r in rows}) == len(rows)
          PY
