name: VÂLCEA CLAR ISU Avizare-Autorizare References

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/isu_valcea_avizare_autorizare_reference_adapter.py'
      - '.github/workflows/valcea-clar-isu-avizare-autorizare.yml'
  push:
    branches: [main]
    paths:
      - 'valcea-clar/scripts/isu_valcea_avizare_autorizare_reference_adapter.py'
      - '.github/workflows/valcea-clar-isu-avizare-autorizare.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-isu-avizare-autorizare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile ISU Vâlcea avizare-autorizare adapter
        run: python -m py_compile valcea-clar/scripts/isu_valcea_avizare_autorizare_reference_adapter.py
      - name: Run ISU Vâlcea fail-closed avizare-autorizare regressions
        run: python valcea-clar/scripts/isu_valcea_avizare_autorizare_reference_adapter.py --self-test
