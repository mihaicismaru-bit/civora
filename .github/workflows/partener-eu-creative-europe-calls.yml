name: PARTENER.EU Creative Europe Call Index CI

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/creative_europe_call_index.py'
      - 'partener-eu/ingest/creative_europe_call_fetch.py'
      - 'partener-eu/ingest/creative_europe_ft_exact.py'
      - 'partener-eu/ingest/creative_europe_ft_reconcile.py'
      - 'partener-eu/ingest/creative_europe_ft_watch.py'
      - 'partener-eu/ingest/creative_europe_ft_watch_reconcile.py'
      - 'partener-eu/ops/test_creative_europe_call_index.py'
      - 'partener-eu/ops/test_creative_europe_call_fetch.py'
      - 'partener-eu/ops/test_creative_europe_ft_exact.py'
      - 'partener-eu/ops/test_creative_europe_ft_reconcile.py'
      - 'partener-eu/ops/test_creative_europe_ft_watch.py'
      - '.github/workflows/partener-eu-creative-europe-calls.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  creative-europe-call-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout is exact event head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate Creative Europe adapter syntax
        run: |
          python -m py_compile partener-eu/ingest/creative_europe_call_index.py
          python -m py_compile partener-eu/ingest/creative_europe_call_fetch.py
          python -m py_compile partener-eu/ingest/creative_europe_ft_exact.py
          python -m py_compile partener-eu/ingest/creative_europe_ft_reconcile.py
          python -m py_compile partener-eu/ingest/creative_europe_ft_watch.py
          python -m py_compile partener-eu/ingest/creative_europe_ft_watch_reconcile.py
          python -m py_compile partener-eu/ops/test_creative_europe_call_index.py
          python -m py_compile partener-eu/ops/test_creative_europe_call_fetch.py
          python -m py_compile partener-eu/ops/test_creative_europe_ft_exact.py
          python -m py_compile partener-eu/ops/test_creative_europe_ft_reconcile.py
          python -m py_compile partener-eu/ops/test_creative_europe_ft_watch.py

      - name: Validate mixed-index filter stays non-authorizing
        run: python partener-eu/ops/test_creative_europe_call_index.py

      - name: Validate bounded index acquisition and degraded-empty handling
        run: python partener-eu/ops/test_creative_europe_call_fetch.py

      - name: Validate exact structured F&T handoff stays non-authorizing
        run: python partener-eu/ops/test_creative_europe_ft_exact.py

      - name: Validate exact-topic semantic reconciliation stays non-authorizing
        run: python partener-eu/ops/test_creative_europe_ft_reconcile.py

      - name: Validate programme-wide structured F&T watch and semantic history stay non-authorizing
        run: python partener-eu/ops/test_creative_europe_ft_watch.py

      - name: Capture live official Creative Europe call-index evidence
        run: |
          mkdir -p /tmp/creative-europe
          python partener-eu/ingest/creative_europe_call_fetch.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --out /tmp/creative-europe/index-evidence.json \
            --raw-out /tmp/creative-europe/index.html

      - name: Validate live index evidence keeps OPEN/material boundary
        run: |
          python - <<'PY'
          import json, re, sys
          p='/tmp/creative-europe/index-evidence.json'
          d=json.load(open(p, encoding='utf-8'))
          if d.get('adapter_id') != 'CREATIVE_EUROPE_CALLS_V1':
              print('FAIL adapter identity drift')
              sys.exit(2)
          stats=d.get('stats') or {}
          count=int(stats.get('exact_crea_reference_candidates') or 0)
          if int(stats.get('records_requiring_ft_reconcile') or 0) != count:
              print('FAIL F&T reconcile gate lost')
              sys.exit(2)
          if int(stats.get('open_call_authorized') or 0) != 0:
              print('FAIL index authorized OPEN')
              sys.exit(2)
          health=d.get('source_health')
          if count == 0 and not (health == 'DEGRADED_EMPTY_RENDERED_INDEX' and d.get('lkg_required') is True):
              print('FAIL empty rendered index was not persisted as degraded')
              sys.exit(2)
          if count > 0 and not (health == 'HEALTHY' and d.get('lkg_required') is False):
              print('FAIL populated index health drift')
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
              if d.get(key) is not False:
                  print('FAIL live evidence became authorizing', key, d.get(key))
                  sys.exit(2)
          if d.get('publication_effect') != 'NONE' or d.get('canonical_corpus_mutation') is not False:
              print('FAIL publication/canonical effect')
              sys.exit(2)
          raw_hash=str((d.get('receipt') or {}).get('raw_sha256') or '')
          if not re.fullmatch(r'[0-9a-f]{64}', raw_hash):
              print('FAIL missing immutable raw SHA-256')
              sys.exit(2)
          refs=[r.get('call_reference_candidate') for r in (d.get('batch') or {}).get('records', [])]
          if not all(isinstance(x,str) and x.startswith('CREA-') for x in refs):
              print('FAIL non-CREA row leaked into Creative Europe evidence', refs)
              sys.exit(2)
          print(json.dumps({'source_health':health,'count':count,'refs':refs[:10],'open_call_authorized':False}, ensure_ascii=False))
          PY

      - name: Capture live programme-wide Creative Europe references through structured F&T
        run: |
          mkdir -p /tmp/creative-europe/watch
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_watch.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --text CREA- \
            --page-size 50 \
            --max-pages 4 \
            --output-dir /tmp/creative-europe/watch

      - name: Validate programme-wide F&T watch stays discovery-only
        run: |
          python - <<'PY'
          import json, re, sys
          p='/tmp/creative-europe/watch/ft-programme-watch-evidence.json'
          d=json.load(open(p, encoding='utf-8'))
          if d.get('watch_id') != 'CREATIVE_EUROPE_FT_PROGRAMME_WATCH_V1':
              print('FAIL programme watch identity drift')
              sys.exit(2)
          stats=d.get('stats') or {}
          count=int(stats.get('exact_reference_candidates') or 0)
          health=d.get('source_health')
          if count == 0 and not (health == 'DEGRADED_EMPTY_STRUCTURED_DISCOVERY' and d.get('lkg_required') is True):
              print('FAIL empty structured discovery was not persisted as degraded')
              sys.exit(2)
          if count > 0 and health != 'HEALTHY':
              print('FAIL populated structured discovery health drift')
              sys.exit(2)
          refs=[c.get('reference') for c in d.get('candidates') or []]
          if len(refs) != len(set(refs)) or not all(isinstance(x,str) and x.startswith('CREA-') for x in refs):
              print('FAIL programme watch identity/dedup drift', refs[:20])
              sys.exit(2)
          conflict_refs={c.get('reference') for c in d.get('conflicts') or []}
          if any(ref in conflict_refs for ref in refs):
              print('FAIL conflicted structured record entered candidate queue')
              sys.exit(2)
          for candidate in d.get('candidates') or []:
              if candidate.get('authority_url_verified') is not False or candidate.get('requires_exact_topic_readback') is not True:
                  print('FAIL programme watch skipped exact-topic verification boundary', candidate.get('reference'))
                  sys.exit(2)
              for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized'):
                  if candidate.get(key) is not False:
                      print('FAIL programme watch candidate became authorizing', candidate.get('reference'), key)
                      sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized'):
              if d.get(key) is not False:
                  print('FAIL programme watch became authorizing', key)
                  sys.exit(2)
          for key in ('facet_raw_sha256','semantic_fingerprint'):
              if not re.fullmatch(r'[0-9a-f]{64}', str(d.get(key) or '')):
                  print('FAIL programme watch hash invalid', key)
                  sys.exit(2)
          print(json.dumps({
              'source_health': health,
              'candidate_count': count,
              'open_candidates_non_authorizing': stats.get('open_candidates_non_authorizing'),
              'forthcoming_candidates_non_authorizing': stats.get('forthcoming_candidates_non_authorizing'),
              'conflicts_excluded': stats.get('conflicting_references_excluded'),
              'sample_refs': refs[:12],
              'open_call_authorized': False,
          }, ensure_ascii=False))
          PY

      - name: Restore previous successful Creative Europe observations from this branch
        id: previous_evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/creative-europe/history/previous/exact
          mkdir -p /tmp/creative-europe/history/previous/watch
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=partener-creative-europe-call-index-evidence&per_page=100" \
            > /tmp/creative-europe/history/artifacts.json
          python - <<'PY' > /tmp/creative-europe/history/candidate-runs.txt
          import json, os
          data=json.load(open('/tmp/creative-europe/history/artifacts.json', encoding='utf-8'))
          branch=(os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME') or '').strip()
          current=int(os.environ['GITHUB_RUN_ID'])
          candidates=[]
          seen=set()
          for artifact in data.get('artifacts') or []:
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              run_id=int(run.get('id') or 0)
              if not run_id or run_id == current or run_id in seen:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              seen.add(run_id)
              candidates.append((str(artifact.get('created_at') or ''), run_id))
          for _created, run_id in sorted(candidates, reverse=True):
              print(run_id)
          PY
          EXACT_FOUND=""
          WATCH_FOUND=""
          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
            [ "$CONCLUSION" = "success" ] || continue
            DEST="/tmp/creative-europe/history/download-${RUN_ID}"
            mkdir -p "$DEST"
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name partener-creative-europe-call-index-evidence --dir "$DEST"; then
              continue
            fi
            if [ -z "$WATCH_FOUND" ]; then
              PREVIOUS_WATCH="$(find "$DEST" -type f -path '*/watch/ft-programme-watch-evidence.json' -print -quit)"
              if [ -n "$PREVIOUS_WATCH" ] && [ -s "$PREVIOUS_WATCH" ]; then
                cp "$PREVIOUS_WATCH" /tmp/creative-europe/history/previous/watch/ft-programme-watch-evidence.json
                WATCH_FOUND="$RUN_ID"
              fi
            fi
            if [ -z "$EXACT_FOUND" ]; then
              PREVIOUS_EXACT="$(find "$DEST" -type f -path '*/ft/ft-exact-evidence.json' -print -quit)"
              if [ -n "$PREVIOUS_EXACT" ] && [ -s "$PREVIOUS_EXACT" ]; then
                cp "$PREVIOUS_EXACT" /tmp/creative-europe/history/previous/exact/ft-exact-evidence.json
                EXACT_FOUND="$RUN_ID"
              fi
            fi
            if [ -n "$WATCH_FOUND" ] && [ -n "$EXACT_FOUND" ]; then
              break
            fi
          done < /tmp/creative-europe/history/candidate-runs.txt
          if [ -n "$WATCH_FOUND" ]; then
            echo "watch_available=true" >> "$GITHUB_OUTPUT"
            echo "watch_run_id=$WATCH_FOUND" >> "$GITHUB_OUTPUT"
            echo "Restored previous programme-watch evidence from successful run $WATCH_FOUND"
          else
            echo "watch_available=false" >> "$GITHUB_OUTPUT"
            echo "No prior successful same-branch programme-watch artifact; watch baseline reconciliation will be used."
          fi
          if [ -n "$EXACT_FOUND" ]; then
            echo "exact_available=true" >> "$GITHUB_OUTPUT"
            echo "exact_run_id=$EXACT_FOUND" >> "$GITHUB_OUTPUT"
            echo "Restored previous exact-topic evidence from successful run $EXACT_FOUND"
          else
            echo "exact_available=false" >> "$GITHUB_OUTPUT"
            echo "No prior successful same-branch exact-topic artifact; exact baseline reconciliation will be used."
          fi

      - name: Reconcile programme-wide Creative Europe watch against previous observation
        shell: bash
        env:
          PREVIOUS_WATCH_AVAILABLE: ${{ steps.previous_evidence.outputs.watch_available }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/creative-europe/watch-reconciliation
          ARGS=(
            --current /tmp/creative-europe/watch/ft-programme-watch-evidence.json
            --output /tmp/creative-europe/watch-reconciliation/ft-programme-watch-reconciliation.json
          )
          if [ "$PREVIOUS_WATCH_AVAILABLE" = "true" ]; then
            ARGS+=(--previous /tmp/creative-europe/history/previous/watch/ft-programme-watch-evidence.json)
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_watch_reconcile.py "${ARGS[@]}"

      - name: Validate programme-wide reconciliation and exact handoff queue stay non-authorizing
        run: |
          python - <<'PY'
          import json, re, sys
          p='/tmp/creative-europe/watch-reconciliation/ft-programme-watch-reconciliation.json'
          d=json.load(open(p, encoding='utf-8'))
          allowed={
              'BASELINE_CAPTURED_NON_AUTHORIZING',
              'NO_CHANGE',
              'PROGRAMME_WATCH_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING',
              'CURRENT_SOURCE_DEGRADED_LKG_REFERENCED_NON_AUTHORIZING',
              'CURRENT_SOURCE_DEGRADED_NO_LKG_NON_AUTHORIZING',
              'SOURCE_RECOVERED_BASELINE_REESTABLISHED_NON_AUTHORIZING',
          }
          if d.get('adapter_id') != 'CREATIVE_EUROPE_FT_WATCH_RECONCILE_V1':
              print('FAIL programme-watch reconciliation identity drift')
              sys.exit(2)
          if d.get('reconciliation_state') not in allowed or d.get('semantic_reconciliation_passed') is not True:
              print('FAIL programme-watch reconciliation state/pass drift', d.get('reconciliation_state'))
              sys.exit(2)
          if d.get('market_intelligence_only') is not True or d.get('requires_exact_topic_handoff') is not True or d.get('requires_material_admission') is not True:
              print('FAIL programme-watch downstream boundary drift')
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized'):
              if d.get(key) is not False:
                  print('FAIL programme-watch reconciliation became authorizing', key, d.get(key))
                  sys.exit(2)
          for key in ('source_scope_fingerprint','current_evidence_sha256','current_semantic_fingerprint','reconciliation_fingerprint'):
              if not re.fullmatch(r'[0-9a-f]{64}', str(d.get(key) or '')):
                  print('FAIL programme-watch reconciliation hash invalid', key)
                  sys.exit(2)
          if d.get('publication_effect') != 'NONE' or d.get('canonical_corpus_mutation') is not False:
              print('FAIL programme-watch reconciliation crossed publication boundary')
              sys.exit(2)
          queue=d.get('exact_verification_queue') or []
          if len(queue) != int(d.get('exact_verification_queue_count') or 0) or len(queue) > 20:
              print('FAIL exact verification queue count/bound drift')
              sys.exit(2)
          seen=set()
          for item in queue:
              ref=str(item.get('reference') or '')
              if not ref.startswith('CREA-') or ref in seen:
                  print('FAIL invalid/duplicate exact handoff reference', ref)
                  sys.exit(2)
              seen.add(ref)
              if item.get('authority_url_verified') is not False:
                  print('FAIL exact handoff self-verified authority', ref)
                  sys.exit(2)
              if item.get('requires_exact_topic_readback') is not True or item.get('requires_exact_topic_reconcile') is not True or item.get('requires_material_admission') is not True:
                  print('FAIL exact handoff skipped downstream gates', ref)
                  sys.exit(2)
              for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized'):
                  if item.get(key) is not False:
                      print('FAIL exact handoff became authorizing', ref, key)
                      sys.exit(2)
          if d.get('current_source_health') != 'HEALTHY' and queue:
              print('FAIL degraded programme watch emitted exact handoff queue')
              sys.exit(2)
          print(json.dumps({
              'reconciliation_state': d.get('reconciliation_state'),
              'semantic_change_count': d.get('semantic_change_count'),
              'programme_watch_candidate': d.get('programme_watch_candidate'),
              'source_health_watch_candidate': d.get('source_health_watch_candidate'),
              'conflict_watch_candidate': d.get('conflict_watch_candidate'),
              'exact_verification_queue_count': len(queue),
              'exact_handoffs': [item.get('reference') for item in queue],
              'open_call_authorized': False,
          }, ensure_ascii=False))
          PY

      - name: Capture exact current Creative Europe topic through structured F&T
        run: |
          mkdir -p /tmp/creative-europe/ft
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_exact.py \
            --reference CREA-MEDIA-2026-DEVMINISLATE \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output-dir /tmp/creative-europe/ft

      - name: Validate exact F&T evidence remains non-publishing
        run: |
          python - <<'PY'
          import json, re, sys
          p='/tmp/creative-europe/ft/ft-exact-evidence.json'
          d=json.load(open(p, encoding='utf-8'))
          if d.get('reference') != 'CREA-MEDIA-2026-DEVMINISLATE':
              print('FAIL exact Creative Europe topic identity drift')
              sys.exit(2)
          if d.get('authority_url_verified') is not True or d.get('requires_reconcile') is not True:
              print('FAIL exact topic/reconcile boundary missing')
              sys.exit(2)
          if d.get('candidate_observation_state') not in ('OPEN_CALL','FORTHCOMING_CALL','CLOSED_CALL','UNKNOWN'):
              print('FAIL unexpected candidate state', d.get('candidate_observation_state'))
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
              if d.get(key) is not False:
                  print('FAIL exact F&T evidence became authorizing', key, d.get(key))
                  sys.exit(2)
          for key in ('search_raw_sha256','facet_raw_sha256','semantic_fingerprint'):
              if not re.fullmatch(r'[0-9a-f]{64}', str(d.get(key) or '')):
                  print('FAIL exact F&T evidence hash invalid', key)
                  sys.exit(2)
          if d.get('publication_effect') != 'NONE' or d.get('canonical_corpus_mutation') is not False:
              print('FAIL exact F&T evidence crossed publication boundary')
              sys.exit(2)
          print(json.dumps({'reference':d.get('reference'),'status_label':d.get('status_label'),'candidate_state':d.get('candidate_observation_state'),'open_call_authorized':False}, ensure_ascii=False))
          PY

      - name: Reconcile exact Creative Europe topic against previous observation
        shell: bash
        env:
          PREVIOUS_EXACT_AVAILABLE: ${{ steps.previous_evidence.outputs.exact_available }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/creative-europe/reconciliation
          ARGS=(
            --current /tmp/creative-europe/ft/ft-exact-evidence.json
            --output /tmp/creative-europe/reconciliation/ft-reconciliation.json
          )
          if [ "$PREVIOUS_EXACT_AVAILABLE" = "true" ]; then
            ARGS+=(--previous /tmp/creative-europe/history/previous/exact/ft-exact-evidence.json)
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_reconcile.py "${ARGS[@]}"

      - name: Validate reconciled exact-topic evidence remains non-authorizing
        run: |
          python - <<'PY'
          import json, re, sys
          p='/tmp/creative-europe/reconciliation/ft-reconciliation.json'
          d=json.load(open(p, encoding='utf-8'))
          if d.get('adapter_id') != 'CREATIVE_EUROPE_FT_RECONCILE_V1':
              print('FAIL reconciliation identity drift')
              sys.exit(2)
          if d.get('reference') != 'CREA-MEDIA-2026-DEVMINISLATE' or d.get('semantic_reconciliation_passed') is not True:
              print('FAIL exact-reference semantic reconciliation missing')
              sys.exit(2)
          if d.get('reconciliation_state') not in ('BASELINE_CAPTURED_NON_AUTHORIZING','NO_CHANGE','EXACT_TOPIC_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING'):
              print('FAIL unexpected reconciliation state', d.get('reconciliation_state'))
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized'):
              if d.get(key) is not False:
                  print('FAIL reconciliation became authorizing', key, d.get(key))
                  sys.exit(2)
          for key in ('current_evidence_sha256','current_semantic_fingerprint','reconciliation_fingerprint'):
              if not re.fullmatch(r'[0-9a-f]{64}', str(d.get(key) or '')):
                  print('FAIL reconciliation hash invalid', key)
                  sys.exit(2)
          if d.get('publication_effect') != 'NONE' or d.get('canonical_corpus_mutation') is not False:
              print('FAIL reconciliation crossed publication boundary')
              sys.exit(2)
          print(json.dumps({
              'reference': d.get('reference'),
              'reconciliation_state': d.get('reconciliation_state'),
              'semantic_change_count': d.get('semantic_change_count'),
              'material_admission_ready_for_downstream_review': d.get('material_admission_ready_for_downstream_review'),
              'open_call_authorized': False,
          }, ensure_ascii=False))
          PY

      - name: Upload bounded Creative Europe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-creative-europe-call-index-evidence
          path: /tmp/creative-europe
          retention-days: 7
          if-no-files-found: error
