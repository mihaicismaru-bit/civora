name: PARTENER.EU Creative Europe Call Index CI

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/creative_europe_call_index.py'
      - 'partener-eu/ingest/creative_europe_call_fetch.py'
      - 'partener-eu/ingest/creative_europe_ft_exact.py'
      - 'partener-eu/ingest/creative_europe_ft_reconcile.py'
      - 'partener-eu/ingest/creative_europe_ft_watch.py'
      - 'partener-eu/ingest/creative_europe_ft_watch_reconcile.py'
      - 'partener-eu/ingest/creative_europe_ft_handoff.py'
      - 'partener-eu/ingest/creative_europe_ft_competitive_exact.py'
      - 'partener-eu/ingest/creative_europe_ft_competitive_reconcile.py'
      - 'partener-eu/ingest/creative_europe_ft_competitive_handoff.py'
      - 'partener-eu/ingest/creative_europe_ft_competitive_admission.py'
      - 'partener-eu/ingest/creative_europe_ft_competitive_projection.py'
      - 'partener-eu/ops/test_creative_europe_call_index.py'
      - 'partener-eu/ops/test_creative_europe_call_fetch.py'
      - 'partener-eu/ops/test_creative_europe_ft_exact.py'
      - 'partener-eu/ops/test_creative_europe_ft_reconcile.py'
      - 'partener-eu/ops/test_creative_europe_ft_watch.py'
      - 'partener-eu/ops/test_creative_europe_ft_handoff.py'
      - 'partener-eu/ops/test_creative_europe_ft_competitive.py'
      - 'partener-eu/ops/test_creative_europe_ft_competitive_handoff.py'
      - 'partener-eu/ops/test_creative_europe_ft_competitive_admission.py'
      - 'partener-eu/ops/test_creative_europe_ft_competitive_projection.py'
      - '.github/workflows/partener-eu-creative-europe-calls.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  creative-europe-call-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout is exact event head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate Creative Europe syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            partener-eu/ingest/creative_europe_call_index.py \
            partener-eu/ingest/creative_europe_call_fetch.py \
            partener-eu/ingest/creative_europe_ft_exact.py \
            partener-eu/ingest/creative_europe_ft_reconcile.py \
            partener-eu/ingest/creative_europe_ft_watch.py \
            partener-eu/ingest/creative_europe_ft_watch_reconcile.py \
            partener-eu/ingest/creative_europe_ft_handoff.py \
            partener-eu/ingest/creative_europe_ft_competitive_exact.py \
            partener-eu/ingest/creative_europe_ft_competitive_reconcile.py \
            partener-eu/ingest/creative_europe_ft_competitive_handoff.py \
            partener-eu/ingest/creative_europe_ft_competitive_admission.py \
            partener-eu/ingest/creative_europe_ft_competitive_projection.py \
            partener-eu/ops/test_creative_europe_call_index.py \
            partener-eu/ops/test_creative_europe_call_fetch.py \
            partener-eu/ops/test_creative_europe_ft_exact.py \
            partener-eu/ops/test_creative_europe_ft_reconcile.py \
            partener-eu/ops/test_creative_europe_ft_watch.py \
            partener-eu/ops/test_creative_europe_ft_handoff.py \
            partener-eu/ops/test_creative_europe_ft_competitive.py \
            partener-eu/ops/test_creative_europe_ft_competitive_handoff.py \
            partener-eu/ops/test_creative_europe_ft_competitive_admission.py \
            partener-eu/ops/test_creative_europe_ft_competitive_projection.py

      - name: Run fail-closed Creative Europe regressions
        shell: bash
        run: |
          set -euo pipefail
          python partener-eu/ops/test_creative_europe_call_index.py
          python partener-eu/ops/test_creative_europe_call_fetch.py
          python partener-eu/ops/test_creative_europe_ft_exact.py
          python partener-eu/ops/test_creative_europe_ft_reconcile.py
          python partener-eu/ops/test_creative_europe_ft_watch.py
          python partener-eu/ops/test_creative_europe_ft_handoff.py
          python partener-eu/ops/test_creative_europe_ft_competitive_handoff.py
          python partener-eu/ops/test_creative_europe_ft_competitive_admission.py
          python partener-eu/ops/test_creative_europe_ft_competitive_projection.py

      - name: Capture live official Creative Europe call-index evidence
        run: |
          mkdir -p /tmp/creative-europe
          python partener-eu/ingest/creative_europe_call_fetch.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --out /tmp/creative-europe/index-evidence.json \
            --raw-out /tmp/creative-europe/index.html

      - name: Capture live programme-wide Creative Europe structured watch
        run: |
          mkdir -p /tmp/creative-europe/watch
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_watch.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --text CREA- \
            --page-size 50 \
            --max-pages 4 \
            --output-dir /tmp/creative-europe/watch

      - name: Restore previous successful same-branch evidence
        id: previous_evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/creative-europe/history/previous/exact
          mkdir -p /tmp/creative-europe/history/previous/watch
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=partener-creative-europe-call-index-evidence&per_page=100" \
            > /tmp/creative-europe/history/artifacts.json
          python - <<'PY' > /tmp/creative-europe/history/candidate-runs.txt
          import json, os
          data=json.load(open('/tmp/creative-europe/history/artifacts.json', encoding='utf-8'))
          branch=(os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME') or '').strip()
          current=int(os.environ['GITHUB_RUN_ID'])
          candidates=[]
          seen=set()
          for artifact in data.get('artifacts') or []:
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              run_id=int(run.get('id') or 0)
              if not run_id or run_id == current or run_id in seen:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              seen.add(run_id)
              candidates.append((str(artifact.get('created_at') or ''), run_id))
          for _created, run_id in sorted(candidates, reverse=True):
              print(run_id)
          PY
          EXACT_FOUND=""
          WATCH_FOUND=""
          DOWNLOADED=0
          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
            [ "$CONCLUSION" = "success" ] || continue
            DEST="/tmp/creative-europe/history/download-${RUN_ID}"
            mkdir -p "$DEST"
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name partener-creative-europe-call-index-evidence --dir "$DEST"; then
              continue
            fi
            DOWNLOADED=$((DOWNLOADED + 1))
            if [ -z "$WATCH_FOUND" ]; then
              PREVIOUS_WATCH="$(find "$DEST" -type f -path '*/watch/ft-programme-watch-evidence.json' -print -quit)"
              if [ -n "$PREVIOUS_WATCH" ] && [ -s "$PREVIOUS_WATCH" ]; then
                cp "$PREVIOUS_WATCH" /tmp/creative-europe/history/previous/watch/ft-programme-watch-evidence.json
                WATCH_FOUND="$RUN_ID"
              fi
            fi
            if [ -z "$EXACT_FOUND" ]; then
              PREVIOUS_EXACT="$(find "$DEST" -type f -path '*/ft/ft-exact-evidence.json' -print -quit)"
              if [ -n "$PREVIOUS_EXACT" ] && [ -s "$PREVIOUS_EXACT" ]; then
                cp "$PREVIOUS_EXACT" /tmp/creative-europe/history/previous/exact/ft-exact-evidence.json
                EXACT_FOUND="$RUN_ID"
              fi
            fi
            if [ -n "$WATCH_FOUND" ] && [ -n "$EXACT_FOUND" ]; then
              break
            fi
            [ "$DOWNLOADED" -lt 8 ] || break
          done < /tmp/creative-europe/history/candidate-runs.txt
          if [ -n "$WATCH_FOUND" ]; then
            echo "watch_available=true" >> "$GITHUB_OUTPUT"
            echo "watch_run_id=$WATCH_FOUND" >> "$GITHUB_OUTPUT"
          else
            echo "watch_available=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$EXACT_FOUND" ]; then
            echo "exact_available=true" >> "$GITHUB_OUTPUT"
            echo "exact_run_id=$EXACT_FOUND" >> "$GITHUB_OUTPUT"
          else
            echo "exact_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile programme-wide watch against previous observation
        shell: bash
        env:
          PREVIOUS_WATCH_AVAILABLE: ${{ steps.previous_evidence.outputs.watch_available }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/creative-europe/watch-reconciliation
          ARGS=(
            --current /tmp/creative-europe/watch/ft-programme-watch-evidence.json
            --output /tmp/creative-europe/watch-reconciliation/ft-programme-watch-reconciliation.json
          )
          if [ "$PREVIOUS_WATCH_AVAILABLE" = "true" ]; then
            ARGS+=(--previous /tmp/creative-europe/history/previous/watch/ft-programme-watch-evidence.json)
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_watch_reconcile.py "${ARGS[@]}"

      - name: Execute at most one bounded primary-topic exact handoff
        run: |
          mkdir -p /tmp/creative-europe/handoff
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_handoff.py \
            --current-watch-reconciliation /tmp/creative-europe/watch-reconciliation/ft-programme-watch-reconciliation.json \
            --history-root /tmp/creative-europe/history \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output-dir /tmp/creative-europe/handoff

      - name: Execute at most one bounded competitive/cascading exact handoff
        run: |
          mkdir -p /tmp/creative-europe/competitive-handoff
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_competitive_handoff.py \
            --current-watch /tmp/creative-europe/watch/ft-programme-watch-evidence.json \
            --history-root /tmp/creative-europe/history \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output-dir /tmp/creative-europe/competitive-handoff

      - name: Build internal NOINDEX competitive/cascading product projection
        shell: bash
        run: |
          set -euo pipefail
          EXACT=/tmp/creative-europe/competitive-handoff/current/ft-competitive-exact-evidence.json
          ADMISSION=/tmp/creative-europe/competitive-handoff/material-admission/ft-competitive-material-admission.json
          OUTPUT=/tmp/creative-europe/product-preview/ft-competitive-product-projection.json
          if [ -s "$EXACT" ] && [ -s "$ADMISSION" ]; then
            mkdir -p "$(dirname "$OUTPUT")"
            PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_competitive_projection.py \
              --exact "$EXACT" \
              --admission "$ADMISSION" \
              --output "$OUTPUT"
          else
            echo "No status-admitted competitive/cascading call available for product preview"
          fi

      - name: Capture exact control topic through structured F&T
        run: |
          mkdir -p /tmp/creative-europe/ft
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_exact.py \
            --reference CREA-MEDIA-2026-DEVMINISLATE \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output-dir /tmp/creative-europe/ft

      - name: Reconcile exact control topic
        shell: bash
        env:
          PREVIOUS_EXACT_AVAILABLE: ${{ steps.previous_evidence.outputs.exact_available }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/creative-europe/reconciliation
          ARGS=(
            --current /tmp/creative-europe/ft/ft-exact-evidence.json
            --output /tmp/creative-europe/reconciliation/ft-reconciliation.json
          )
          if [ "$PREVIOUS_EXACT_AVAILABLE" = "true" ]; then
            ARGS+=(--previous /tmp/creative-europe/history/previous/exact/ft-exact-evidence.json)
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/creative_europe_ft_reconcile.py "${ARGS[@]}"

      - name: Validate live evidence stays non-authorizing and hash-bound
        env:
          PYTHONPATH: partener-eu/ingest
        run: |
          python - <<'PY'
          import json, os, re
          import creative_europe_ft_exact as exact
          import creative_europe_ft_reconcile as exact_reconcile
          import creative_europe_ft_watch as watch
          import creative_europe_ft_watch_reconcile as watch_reconcile
          import creative_europe_ft_handoff as handoff
          import creative_europe_ft_competitive_handoff as competitive_handoff
          import creative_europe_ft_competitive_admission as competitive_admission
          import creative_europe_ft_competitive_projection as competitive_projection

          def load(path):
              return json.load(open(path, encoding='utf-8'))

          index=load('/tmp/creative-europe/index-evidence.json')
          current_watch=load('/tmp/creative-europe/watch/ft-programme-watch-evidence.json')
          watch_receipt=load('/tmp/creative-europe/watch-reconciliation/ft-programme-watch-reconciliation.json')
          primary=load('/tmp/creative-europe/handoff/handoff-summary.json')
          competitive=load('/tmp/creative-europe/competitive-handoff/competitive-handoff-summary.json')
          control=load('/tmp/creative-europe/ft/ft-exact-evidence.json')
          control_receipt=load('/tmp/creative-europe/reconciliation/ft-reconciliation.json')

          watch.validate_watch_evidence(current_watch)
          watch_reconcile.validate_watch_reconciliation(watch_receipt)
          handoff.validate_handoff_summary(primary)
          competitive_handoff.validate_handoff_summary(competitive)
          exact.validate_exact_evidence(control)
          exact_reconcile.validate_receipt(control_receipt)

          preview_state=None
          preview_robots=None
          preview_path='/tmp/creative-europe/product-preview/ft-competitive-product-projection.json'
          if competitive.get('status_fact_admitted') is True:
              exact_comp=load('/tmp/creative-europe/competitive-handoff/current/ft-competitive-exact-evidence.json')
              admitted=load('/tmp/creative-europe/competitive-handoff/material-admission/ft-competitive-material-admission.json')
              preview=load(preview_path)
              competitive_admission.validate_admission(admitted)
              competitive_projection.validate_projection(preview)
              rebuilt=competitive_projection.build_projection(exact_comp, admitted)
              if rebuilt.get('projection_fingerprint') != preview.get('projection_fingerprint'):
                  raise SystemExit('FAIL competitive product preview is not deterministic')
              if preview.get('identity_key') != competitive.get('selected_identity_key'):
                  raise SystemExit('FAIL competitive product preview identity drift')
              if preview.get('publish_authorized') is not False or preview.get('distribution_authorized') is not False or preview.get('call_alert_authorized') is not False:
                  raise SystemExit('FAIL competitive product preview crossed publication/distribution boundary')
              preview_state=preview.get('observation_state')
              preview_robots=(preview.get('surface_policy') or {}).get('robots')
          elif os.path.exists(preview_path):
              raise SystemExit('FAIL competitive product preview exists without admitted status')

          material_flags=(
              'material_fact_use','open_call_authorized','deadline_authorized',
              'budget_authorized','eligibility_authorized','publish_authorized',
              'distribution_authorized'
          )
          if index.get('adapter_id') != 'CREATIVE_EUROPE_CALLS_V1':
              raise SystemExit('FAIL live index adapter identity drift')
          for key in material_flags:
              if index.get(key) is not False:
                  raise SystemExit(f'FAIL live index became authorizing: {key}')
          raw_hash=str((index.get('receipt') or {}).get('raw_sha256') or '')
          if not re.fullmatch(r'[0-9a-f]{64}', raw_hash):
              raise SystemExit('FAIL live index immutable raw hash missing')
          if index.get('publication_effect') != 'NONE' or index.get('canonical_corpus_mutation') is not False:
              raise SystemExit('FAIL live index publication boundary drift')

          stats=current_watch.get('stats') or {}
          print(json.dumps({
              'watch_source_health': current_watch.get('source_health'),
              'primary_candidate_count': stats.get('exact_reference_candidates'),
              'primary_conflicts_excluded': stats.get('conflicting_references_excluded'),
              'competitive_candidates': stats.get('linked_competitive_discovery_candidates'),
              'competitive_open_candidates_non_authorizing': stats.get('open_linked_competitive_candidates_non_authorizing'),
              'watch_reconciliation_state': watch_receipt.get('reconciliation_state'),
              'primary_handoff_state': primary.get('observation_state'),
              'competitive_handoff_state': competitive.get('observation_state'),
              'competitive_identity': competitive.get('selected_identity_key'),
              'competitive_exact_state': competitive.get('exact_candidate_observation_state'),
              'competitive_exact_status': competitive.get('exact_status_label'),
              'competitive_reconciliation_state': competitive.get('exact_semantic_reconciliation_state'),
              'competitive_material_ready_for_review': competitive.get('material_admission_ready_for_downstream_review'),
              'competitive_status_fact_admitted': competitive.get('status_fact_admitted'),
              'competitive_product_preview_state': preview_state,
              'competitive_product_preview_robots': preview_robots,
              'control_reconciliation_state': control_receipt.get('reconciliation_state'),
              'open_call_authorized': False,
              'call_alert_authorized': False,
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload bounded Creative Europe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-creative-europe-call-index-evidence
          path: /tmp/creative-europe
          retention-days: 7
          if-no-files-found: error
