name: VÂLCEA CLAR Artist Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/festival_lineups_2026.json'
      - 'valcea-clar/scripts/enrich_festival_artists.py'
      - '.github/workflows/valcea-clar-artist-intelligence.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: valcea-clar-artist-intelligence
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate artist seed contract
        run: |
          python valcea-clar/scripts/enrich_festival_artists.py --self-test
          python valcea-clar/scripts/enrich_festival_artists.py --check
      - name: Resolve verified external artist identities and links
        run: python valcea-clar/scripts/enrich_festival_artists.py
      - name: Persist public artist intelligence when materially changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- valcea-clar/site/runtime/artists.json; then
            echo 'Artist intelligence unchanged.'
            exit 0
          fi
          cp valcea-clar/site/runtime/artists.json /tmp/artists.json
          git config user.name 'vâlcea-clar-artist-intelligence[bot]'
          git config user.email 'valcea-clar-artist-intelligence@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p valcea-clar/site/runtime
            cp /tmp/artists.json valcea-clar/site/runtime/artists.json
            git add valcea-clar/site/runtime/artists.json
            if git diff --cached --quiet; then
              echo 'Artist intelligence already present on main.'
              exit 0
            fi
            git commit -m 'Refresh VÂLCEA CLAR festival artist profiles'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Could not persist artist intelligence after five attempts.' >&2
          exit 1
