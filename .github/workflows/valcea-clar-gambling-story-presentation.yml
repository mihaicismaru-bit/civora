name: VÂLCEA CLAR Gambling Story Presentation Compatibility Check

# Bespoke gambling presentation now runs inside overlay_runtime_export.py, the
# canonical final presentation boundary. Keep this workflow only for explicit QA.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/gambling_story_presentation.py'
      - 'valcea-clar/scripts/overlay_runtime_export.py'
      - '.github/workflows/valcea-clar-gambling-story-presentation.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate presentation module
        run: python -m py_compile valcea-clar/scripts/gambling_story_presentation.py
      - name: Validate canonical ownership
        run: |
          grep -Fq 'gambling_story_presentation.py' valcea-clar/scripts/overlay_runtime_export.py
          grep -Fq 'gambling_dossier_enricher_v2.py' .github/workflows/valcea-clar-fact-kernel.yml
          echo 'Gambling enrichment is owned by Fact Kernel; presentation is owned by overlay_runtime_export.py.'
