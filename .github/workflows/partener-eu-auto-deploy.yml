name: PARTENER.EU Auto Deploy

on:
  push:
    branches: [main]
    paths:
      - 'partener-eu/web/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: partener-eu-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: partener-eu/web
      - name: Deploy PARTENER.EU
        id: deployment
        uses: actions/deploy-pages@v4
