name: PARTENER.EU Auto Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'partener-eu/web/**'
      - '.github/workflows/partener-eu-auto-deploy.yml'
  workflow_run:
    workflows:
      - 'PARTENER.EU MIPE Ingestion'
      - 'PARTENER.EU MIPE Romania Collector'
      - 'PARTENER.EU MIPE Dual Relay'
      - 'PARTENER.EU MIPE Dual Cache'
      - 'PARTENER.EU AFIR Ingestion'
      - 'PARTENER.EU Decision Products'
      - 'PARTENER.EU Consultant Workspace v3 QA'
      - 'PARTENER.EU Editorial Daily Products'
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# All workflows that call actions/deploy-pages for PARTENER.EU share the same
# serialization lock and Pages environment. This prevents valid deployments
# from racing each other or being cancelled by a second deploy workflow.
concurrency:
  group: partener-eu-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: partener-eu/web
      - name: Deploy PARTENER.EU
        id: deployment
        uses: actions/deploy-pages@v4
