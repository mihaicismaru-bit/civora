name: PARTENER.EU Auto Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'partener-eu/web/**'
  workflow_run:
    workflows:
      - 'PARTENER.EU MIPE Ingestion'
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: partener-eu-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run events must deploy the canonical state produced on main,
          # not the workflow definition commit or a stale triggering checkout.
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: partener-eu/web
      - name: Deploy PARTENER.EU
        id: deployment
        uses: actions/deploy-pages@v4
