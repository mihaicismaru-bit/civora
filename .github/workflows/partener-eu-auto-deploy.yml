name: PARTENER.EU Auto Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'partener-eu/web/**'
      - '.github/workflows/partener-eu-auto-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployment is atomic: keep the public last-known-good until the newest
# main snapshot succeeds, while superseding stale queued snapshots.
concurrency:
  group: partener-eu-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate fail-closed public projection and STEP-LLL bridge
        run: |
          python partener-eu/ops/recover_decision_products_lkg.py
          node --check partener-eu/web/decision-intelligence-v2.js
          node --check partener-eu/web/step-lll-dossier-bridge-v2.js
          python partener-eu/ops/test_public_language.py
          grep -F 'step-lll-dossier-bridge-v2.js' partener-eu/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: partener-eu/web
      - name: Deploy PARTENER.EU
        id: deployment
        uses: actions/deploy-pages@v4
