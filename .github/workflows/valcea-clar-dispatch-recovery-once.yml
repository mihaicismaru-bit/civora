name: VÂLCEA CLAR dispatch recovery once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valcea-clar-dispatch-recovery-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Dispatch canonical live newsroom
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.txt -w '%{http_code}' -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/valcea-clar-newsroom-live.yml/dispatches" \
            -d '{"ref":"main"}')
          test "$code" = 204 || { cat /tmp/dispatch.txt; exit 1; }
      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vâlcea-clar-recovery[bot]'
          git config user.email 'valcea-clar-recovery@users.noreply.github.com'
          git rm .github/workflows/valcea-clar-dispatch-recovery-once.yml
          git commit -m 'Remove one-shot VÂLCEA CLAR recovery dispatcher'
          git push origin HEAD:main
