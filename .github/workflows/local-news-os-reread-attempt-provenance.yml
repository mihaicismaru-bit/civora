name: LOCAL NEWS OS Reread Attempt Provenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/social/authorization_sealed_harvest_receipt.py"
      - "local-news-os/social/fleet_metrics_reread_authorization_handoff.py"
      - "local-news-os/social/authorization_sealed_harvest_recovery.py"
      - "local-news-os/social/metrics_harvest_runtime.py"
      - "local-news-os/social/test_reread_attempt_provenance_binding.py"
      - "local-news-os/social/test_fleet_metrics_reread_authorization_handoff.py"
      - ".github/workflows/local-news-os-reread-attempt-provenance.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/social/authorization_sealed_harvest_receipt.py"
      - "local-news-os/social/fleet_metrics_reread_authorization_handoff.py"
      - "local-news-os/social/authorization_sealed_harvest_recovery.py"
      - "local-news-os/social/metrics_harvest_runtime.py"
      - "local-news-os/social/test_reread_attempt_provenance_binding.py"
      - "local-news-os/social/test_fleet_metrics_reread_authorization_handoff.py"
      - ".github/workflows/local-news-os-reread-attempt-provenance.yml"

permissions:
  contents: read

concurrency:
  group: local-news-os-reread-attempt-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile reread provenance boundary
        run: |
          python -m py_compile \
            local-news-os/social/authorization_sealed_harvest_receipt.py \
            local-news-os/social/fleet_metrics_reread_authorization_handoff.py \
            local-news-os/social/authorization_sealed_harvest_recovery.py \
            local-news-os/social/metrics_harvest_runtime.py \
            local-news-os/social/test_reread_attempt_provenance_binding.py

      - name: Run reread attempt provenance acceptance
        working-directory: local-news-os/social
        run: python test_reread_attempt_provenance_binding.py

      - name: Run explicit reread handoff regression
        working-directory: local-news-os/social
        run: python test_fleet_metrics_reread_authorization_handoff.py

      - name: Verify provenance boundary remains analytics-only and zero-paid
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'local-news-os/social')
          import authorization_sealed_harvest_receipt as receipt
          assert receipt.REREAD_ATTEMPT_PROVENANCE_ID == 'local-news-os-reread-attempt-provenance-v1'
          guards = receipt.reread_attempt_provenance_guards()
          required = {
              'explicit_single_use_handoff_required': True,
              'handoff_rechecked_at_claim': True,
              'handoff_rechecked_before_network': True,
              'provider_network_call_performed_by_binding': False,
              'credential_values_read_by_binding': False,
              'credential_values_persisted': False,
              'provider_payload_persisted': False,
              'publication_blocked_by_analytics': False,
              'zero_paid_dependency': True,
          }
          for key, expected in required.items():
              if guards.get(key) is not expected:
                  raise SystemExit(f'reread provenance guard mismatch: {key}={guards.get(key)!r}')
          print('REREAD_ATTEMPT_PROVENANCE_GUARDS_PASS')
          PY
