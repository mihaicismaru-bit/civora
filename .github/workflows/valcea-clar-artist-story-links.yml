name: VÂLCEA CLAR Artist Story Links Compatibility Check

# Story/profile linking now runs inside overlay_runtime_export.py, the canonical
# final presentation boundary. Keep only an explicit compatibility check here.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/link_artist_profiles.py'
      - 'valcea-clar/scripts/overlay_runtime_export.py'
      - '.github/workflows/valcea-clar-artist-story-links.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate artist linker
        run: |
          python -m py_compile valcea-clar/scripts/link_artist_profiles.py
          python valcea-clar/scripts/link_artist_profiles.py --self-test
      - name: Validate canonical ownership
        run: |
          grep -Fq 'link_artist_profiles.py' valcea-clar/scripts/overlay_runtime_export.py
          echo 'Artist story linking is owned by overlay_runtime_export.py.'
