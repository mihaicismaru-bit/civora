name: VÂLCEA CLAR Local Life Sync

on:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/ops/live-newsroom-trigger.json'
      - 'valcea-clar/scripts/sync_local_life_events.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valcea-clar-local-life-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Local Life writer
        run: python valcea-clar/scripts/sync_local_life_events.py --self-test
      - name: Materialize operator event deltas
        run: python valcea-clar/scripts/sync_local_life_events.py
      - name: Persist Local Life registry and route
        shell: bash
        run: |
          set -euo pipefail
          cp valcea-clar/editorial/local_life_events.json /tmp/local-life-events.json
          cp valcea-clar/site/runtime/unde-iesim/index.html /tmp/unde-iesim-index.html
          git config user.name 'vâlcea-clar-local-life[bot]'
          git config user.email 'valcea-clar-local-life@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p valcea-clar/editorial valcea-clar/site/runtime/unde-iesim
            cp /tmp/local-life-events.json valcea-clar/editorial/local_life_events.json
            cp /tmp/unde-iesim-index.html valcea-clar/site/runtime/unde-iesim/index.html
            git add valcea-clar/editorial/local_life_events.json valcea-clar/site/runtime/unde-iesim/index.html
            if git diff --cached --quiet; then
              echo 'Local Life state already current.'
              exit 0
            fi
            git commit -m 'Sync VÂLCEA CLAR Local Life event inventory'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
