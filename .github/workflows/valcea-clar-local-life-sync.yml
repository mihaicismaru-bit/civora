name: VÂLCEA CLAR Local Life Sync

on:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/ops/live-newsroom-trigger.json'
      - 'valcea-clar/editorial/local_life_surface_registry.json'
      - 'valcea-clar/editorial/local_life_entity_corrections.json'
      - 'valcea-clar/scripts/sync_local_life_events.py'
      - 'valcea-clar/scripts/repair_local_life_event_projection.py'
      - 'valcea-clar/scripts/sync_local_life_surfaces.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valcea-clar-local-life-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Local Life event writer
        run: |
          python valcea-clar/scripts/sync_local_life_events.py --self-test
          python valcea-clar/scripts/test_local_life_persistence.py
      - name: Persist Local Life registries and complete route tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vâlcea-clar-local-life[bot]'
          git config user.email 'valcea-clar-local-life@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Regenerate after each fetch, including a rejected-push retry.
            # A pre-fetch snapshot can overwrite another writer's newer state.
            python valcea-clar/scripts/sync_local_life_events.py
            python valcea-clar/scripts/repair_local_life_event_projection.py
            python valcea-clar/scripts/sync_local_life_surfaces.py
            # Persist only this writer's outputs; preserve other child routes.
            git add -A \
              valcea-clar/editorial/local_life_events.json \
              valcea-clar/site/runtime/unde-iesim/index.html \
              valcea-clar/site/runtime/unde-iesim/sport/index.html \
              valcea-clar/site/runtime/unde-iesim/cinema/index.html \
              valcea-clar/site/runtime/unde-iesim/meniul-zilei/index.html \
              valcea-clar/site/runtime/unde-iesim/fitness/index.html
            if git diff --cached --quiet; then
              echo 'Local Life state already current.'
              exit 0
            fi
            git commit -m 'Sync VÂLCEA CLAR Local Life complete surfaces'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
