# Trigger: 2026-08-21T12:31:00+03:00
name: VÂLCEA CLAR Manual Publish Now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'valcea-clar/editorial/manual_publish_queue.json'
      - '.github/workflows/valcea-clar-manual-publish-now.yml'

permissions:
  contents: write

concurrency:
  group: valcea-clar-manual-publish-now
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Publish verified manual queue atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'valcea-clar-manual-now[bot]'
          git config user.email 'valcea-clar-manual-now@users.noreply.github.com'
          queue=/tmp/valcea-manual-publish-queue.json
          cp valcea-clar/editorial/manual_publish_queue.json "$queue"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          root=Path('valcea-clar')
          queue=json.loads(Path('/tmp/valcea-manual-publish-queue.json').read_text(encoding='utf-8'))
          facts=queue.get('facts') or []
          assert facts, 'manual publish queue is empty'
          required={'id','status','section','priority','confidence','headline','dek','paragraphs','material_fact_gate','sources'}
          holds=json.loads((root/'editorial/publication_holds.json').read_text(encoding='utf-8'))
          held={str(x.get('story_id')) for x in holds.get('holds',[]) if x.get('public_projection') is False}
          registry_path=root/'editorial/facts_registry.json'
          registry=json.loads(registry_path.read_text(encoding='utf-8'))
          archive_path=root/'site/story_archive.json'
          archive=json.loads(archive_path.read_text(encoding='utf-8'))
          registry_by_id={str(x.get('id')):x for x in registry.get('facts',[]) if x.get('id')}
          stories=archive.setdefault('stories',[])
          archive_by_id={str(x.get('id')):x for x in stories if x.get('id')}
          now=datetime.now(timezone(timedelta(hours=3))).isoformat(timespec='seconds')

          published=[]
          for fact in facts:
              missing=required-set(fact)
              assert not missing, f"{fact.get('id')}: missing {sorted(missing)}"
              sid=str(fact['id'])
              assert fact['status'] in {'verified','approved_carry_forward'}
              assert int(fact['confidence']) >= 90
              assert fact.get('paragraphs') and fact.get('sources')
              assert sid not in held, f'{sid}: public projection held'
              registry_by_id[sid]=fact
              if sid not in archive_by_id:
                  row={
                      'id':sid,
                      'section':fact['section'],
                      'priority':int(fact['priority']),
                      'headline':fact['headline'],
                      'dek':fact['dek'],
                      'paragraphs':fact['paragraphs'],
                      'path':f'/stiri/{sid}/',
                      'canonical_url':f'https://valceaclar.ro/stiri/{sid}/',
                      'sources':fact['sources'],
                      'visual':fact.get('visual'),
                      'artist_profiles':fact.get('artist_profiles') or [],
                      'first_published_at':now,
                      'confidence':int(fact['confidence']),
                      'material_fact_gate':fact['material_fact_gate'],
                      'last_seen_at':now,
                      'last_seen_edition':'manual-publish-now',
                      'archive_status':'active',
                      'active_now':True,
                  }
                  stories.insert(0,row)
                  archive_by_id[sid]=row
              else:
                  row=archive_by_id[sid]
                  row.update({
                      'section':fact['section'],
                      'priority':int(fact['priority']),
                      'headline':fact['headline'],
                      'dek':fact['dek'],
                      'paragraphs':fact['paragraphs'],
                      'sources':fact['sources'],
                      'visual':fact.get('visual'),
                      'confidence':int(fact['confidence']),
                      'material_fact_gate':fact['material_fact_gate'],
                      'last_seen_at':now,
                      'archive_status':'active',
                      'active_now':True,
                  })
              published.append(sid)

          registry['facts']=list(registry_by_id.values())
          registry['manual_publish_bridge']={
              'enabled':True,
              'source':'editorial/manual_publish_queue.json',
              'policy':'human-requested verified stories publish atomically through canonical archive and runtime'
          }
          archive['story_count']=len(stories)
          archive['generated_at']=now
          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          archive_path.write_text(json.dumps(archive,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({'status':'PROMOTED','ids':published,'story_count':len(stories)})
          PY

            python valcea-clar/scripts/repair_continuous_frontpage.py --self-test
            python valcea-clar/scripts/repair_continuous_frontpage.py
            python valcea-clar/scripts/build_sites_export.py
            python valcea-clar/scripts/overlay_runtime_export.py

            python - <<'PY'
          import json
          from pathlib import Path
          root=Path('valcea-clar')
          queue=json.loads(Path('/tmp/valcea-manual-publish-queue.json').read_text(encoding='utf-8'))
          ids=[str(x['id']) for x in queue.get('facts') or []]
          manifest=json.loads((root/'site/runtime/stiri/manifest.json').read_text(encoding='utf-8'))
          feed=json.loads((root/'site/runtime/live-feed.json').read_text(encoding='utf-8'))
          manifest_ids={str(x.get('id')) for x in manifest.get('stories',[])}
          feed_ids={str(x.get('id')) for x in feed.get('stories',[])}
          for sid in ids:
              route=root/'site/runtime/stiri'/sid/'index.html'
              assert route.is_file() and route.stat().st_size>0, sid
              html=route.read_text(encoding='utf-8')
              assert sid in manifest_ids and sid in feed_ids
              fact=next(x for x in queue['facts'] if str(x['id'])==sid)
              assert fact['headline'] in html
          print({'status':'PASS','routes':ids})
          PY

            git add -- valcea-clar/editorial/facts_registry.json valcea-clar/site/story_archive.json valcea-clar/site/runtime
            if git diff --cached --quiet; then
              echo 'Manual queue already materialized.'
              exit 0
            fi
            git commit -m 'Publish VÂLCEA CLAR manual queue now'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced; retrying manual publication ${attempt}/5"
            sleep $((attempt * 2))
          done

          echo 'Manual publication could not be persisted safely.' >&2
          exit 1
