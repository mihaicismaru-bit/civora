name: PARTENER.EU LIFE Programme Proof

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/life_programme_intelligence_registry.json'
      - 'partener-eu/ingest/life_programme_intelligence.py'
      - 'partener-eu/ingest/life_programme_reconcile.py'
      - 'partener-eu/ops/test_life_programme_intelligence.py'
      - 'partener-eu/ops/test_life_programme_reconcile.py'
      - '.github/workflows/partener-eu-life-programme-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  life-programme-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile LIFE programme adapter reconciliation and regressions
        run: |
          python -m json.tool partener-eu/ingest/life_programme_intelligence_registry.json >/dev/null
          python -m py_compile \
            partener-eu/ingest/life_programme_intelligence.py \
            partener-eu/ingest/life_programme_reconcile.py \
            partener-eu/ops/test_life_programme_intelligence.py \
            partener-eu/ops/test_life_programme_reconcile.py

      - name: Run fail-closed LIFE programme regressions
        env:
          PYTHONPATH: partener-eu/ingest:partener-eu/ops
        run: |
          python partener-eu/ops/test_life_programme_intelligence.py
          python partener-eu/ops/test_life_programme_reconcile.py

      - name: Prepare replay root
        run: |
          ROOT=/tmp/partener-eu-life-programme-proof
          rm -rf "$ROOT"
          mkdir -p "$ROOT/current" "$ROOT/previous" "$ROOT/history"

      - name: Restore previous same-branch LIFE history
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-life-programme-proof
          SCRATCH=/tmp/partener-eu-life-programme-history-scan
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH" "$ROOT/previous"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$SCRATCH/artifacts.json"
          python - <<'PY' > "$SCRATCH/candidates.txt"
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/partener-eu-life-programme-history-scan/artifacts.json').read_text(encoding='utf-8'))
          head=os.environ['EXPECTED_HEAD_SHA']
          branch=os.environ['EXPECTED_HEAD_BRANCH']
          rows=[]
          for artifact in data.get('artifacts') or []:
              name=str(artifact.get('name') or '')
              if not (
                  name.startswith('partener-eu-life-programme-proof-')
                  or name.startswith('partener-eu-eu-direct-programme-intelligence-')
              ):
                  continue
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              if str(run.get('head_sha') or '') == head:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              rows.append((str(artifact.get('created_at') or ''), int(artifact.get('id') or 0), name))
          rows.sort(reverse=True)
          for _, artifact_id, name in rows[:30]:
              print(f'{artifact_id}\t{name}')
          PY
          RESTORED=""
          while IFS=$'\t' read -r CANDIDATE ARTIFACT_NAME; do
            [ -n "$CANDIDATE" ] || continue
            rm -f "$SCRATCH/previous.zip"
            rm -rf "$SCRATCH/unpacked"
            mkdir -p "$SCRATCH/unpacked"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE}/zip" > "$SCRATCH/previous.zip"
            unzip -q "$SCRATCH/previous.zip" -d "$SCRATCH/unpacked"
            PREVIOUS="$(python - "$SCRATCH/unpacked" <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          candidates=list(root.rglob('life-programme-intelligence.json'))
          def priority(path):
              text=path.as_posix().casefold()
              if '/history/' in text: return (0, text)
              if '/current/' in text: return (1, text)
              return (2, text)
          for path in sorted(candidates, key=priority):
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if data.get('schema') == 'PARTENER_EU_LIFE_PROGRAMME_INTELLIGENCE_V1' and data.get('source_family') == 'EU_DIRECT' and data.get('programme_families') == ['LIFE']:
                  print(path)
                  break
          PY
            )"
            if [ -n "$PREVIOUS" ]; then
              cp "$PREVIOUS" "$ROOT/previous/life-programme-intelligence.json"
              python - <<PY
          import json
          from pathlib import Path
          Path('$ROOT/previous/restore-metadata.json').write_text(json.dumps({
              'previous_found': True,
              'artifact_id': int('$CANDIDATE'),
              'artifact_name': '$ARTIFACT_NAME',
              'restore_reason': 'SAME_PROGRAMME_SOURCE_IDENTITY_CANDIDATE',
          }, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          PY
              RESTORED="$CANDIDATE"
              echo "Restored previous LIFE receipt candidate from artifact ${CANDIDATE}"
              break
            fi
          done < "$SCRATCH/candidates.txt"
          if [ -z "$RESTORED" ]; then
            printf '%s\n' '{"previous_found":false,"restore_reason":"NO_PREVIOUS_COMPATIBLE_ARTIFACT"}' > "$ROOT/previous/restore-metadata.json"
            echo "No previous same-branch LIFE receipt found; baseline mode retained."
          fi

      - name: Acquire fresh official LIFE programme intelligence
        run: |
          ROOT=/tmp/partener-eu-life-programme-proof
          python partener-eu/ingest/life_programme_intelligence.py \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-life-programme" \
            --live \
            --output "$ROOT/current/life-programme-intelligence.json"
          cp partener-eu/ingest/life_programme_intelligence_registry.json "$ROOT/current/registry.json"

      - name: Reconcile LIFE same-identity evidence non-authorizing
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/partener-eu-life-programme-proof
          ARGS=()
          if [ -f "$ROOT/previous/life-programme-intelligence.json" ]; then
            ARGS+=(--previous "$ROOT/previous/life-programme-intelligence.json")
          fi
          PYTHONPATH=partener-eu/ingest python partener-eu/ingest/life_programme_reconcile.py \
            "$ROOT/current/life-programme-intelligence.json" \
            "${ARGS[@]}" \
            --output "$ROOT/current/life-programme-reconciliation.json"

      - name: Enforce LIFE semantic and LKG boundary
        run: |
          python - <<'PY'
          import json, re, shutil, sys
          from pathlib import Path
          root=Path('/tmp/partener-eu-life-programme-proof')
          current=json.loads((root/'current/life-programme-intelligence.json').read_text(encoding='utf-8'))
          rec=json.loads((root/'current/life-programme-reconciliation.json').read_text(encoding='utf-8'))
          previous_path=root/'previous/life-programme-intelligence.json'
          previous=json.loads(previous_path.read_text(encoding='utf-8')) if previous_path.exists() else None
          if current.get('schema') != 'PARTENER_EU_LIFE_PROGRAMME_INTELLIGENCE_V1': sys.exit('FAIL LIFE schema drift')
          if current.get('parser_version') != 'LIFE_PROGRAMME_INTELLIGENCE_V1_1': sys.exit('FAIL LIFE parser version drift')
          if current.get('source_family') != 'EU_DIRECT' or current.get('programme_families') != ['LIFE']: sys.exit('FAIL LIFE family drift')
          if current.get('source_count') != 4: sys.exit('FAIL LIFE bounded source count drift')
          flags=(
              'material_fact_use','open_call_authorized','closed_call_authorized','deadline_authorized',
              'budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized',
              'call_alert_authorized','canonical_corpus_mutation',
          )
          for row in (current, rec):
              for key in flags:
                  if row.get(key) is not False: sys.exit(f'FAIL LIFE became authorizing: {key}')
              if row.get('publication_effect') != 'NONE': sys.exit('FAIL LIFE publication boundary drift')
          states={row['source_id']:row['observation_state'] for row in current['sources']}
          if states.get('LIFE_CINEA_CALLS_2026_INDEX') != 'CALL_INDEX_DISCOVERY': sys.exit('FAIL LIFE call index crossed discovery boundary')
          if states.get('LIFE_CINEA_WORK_PROGRAMME_2025_2027') != 'PROGRAMMING_PIPELINE': sys.exit('FAIL LIFE work programme lost pipeline boundary')
          healthy=current.get('source_health_state') == 'HEALTHY' and current.get('degraded_source_count') == 0
          if healthy:
              if current.get('healthy_source_count') != 4: sys.exit('FAIL LIFE healthy accounting drift')
              if not re.fullmatch(r'[0-9a-f]{64}', str(current.get('semantic_fingerprint') or '')): sys.exit('FAIL LIFE healthy semantic fingerprint missing')
              for source in current['sources']:
                  health=source['source_health']
                  if health.get('health_state') != 'HEALTHY' or health.get('http_status') != 200: sys.exit(f"FAIL LIFE healthy receipt drift: {source['source_id']}")
                  for key in ('raw_sha256','normalized_visible_text_sha256'):
                      if not re.fullmatch(r'[0-9a-f]{64}', str(health.get(key) or '')): sys.exit(f"FAIL LIFE provenance hash missing {key}: {source['source_id']}")
                  if not re.fullmatch(r'[0-9a-f]{64}', str(source.get('source_semantic_fingerprint') or '')): sys.exit(f"FAIL LIFE semantic hash missing: {source['source_id']}")
              allowed={
                  'BASELINE_CAPTURED_NON_AUTHORIZING','NO_CHANGE',
                  'LIFE_PROGRAMME_SEMANTIC_CHANGE_RECONCILED_NON_AUTHORIZING',
                  'SOURCE_HEALTH_RECOVERED_BASELINE_REFRESH_NON_AUTHORIZING',
                  'PARSER_VERSION_CHANGED_BASELINE_REFRESH_NON_AUTHORIZING',
              }
              if rec.get('reconciliation_state') not in allowed or rec.get('semantic_reconciliation_passed') is not True: sys.exit('FAIL LIFE healthy reconciliation drift')
          else:
              if current.get('source_health_state') != 'DEGRADED' or current.get('lkg_required') is not True: sys.exit('FAIL LIFE degraded current did not request LKG')
              if current.get('semantic_fingerprint') is not None: sys.exit('FAIL LIFE degraded current emitted semantic fingerprint')
              if rec.get('reconciliation_state') != 'CURRENT_SOURCE_HEALTH_DEGRADED_LKG_REQUIRED': sys.exit('FAIL LIFE degraded current did not fail closed')
              if rec.get('semantic_reconciliation_passed') is not False or rec.get('semantic_change_count') != 0 or rec.get('pipeline_watch_candidate') is not False: sys.exit('FAIL LIFE degraded current generated semantic change')
              if rec.get('lkg_reference_required') is not True: sys.exit('FAIL LIFE degraded current lost LKG requirement')
          if rec.get('lkg_reference_is_current_truth') is not False or rec.get('material_admission_ready_for_downstream_review') is not False: sys.exit('FAIL LIFE LKG/material boundary drift')

          history=root/'history'; history.mkdir(exist_ok=True)
          if healthy:
              shutil.copy2(root/'current/life-programme-intelligence.json', history/'life-programme-intelligence.json')
              selected='CURRENT_HEALTHY'
          elif previous is not None and previous.get('source_health_state') == 'HEALTHY':
              shutil.copy2(previous_path, history/'life-programme-intelligence.json')
              selected='PREVIOUS_HEALTHY_LKG'
          else:
              selected='NO_HEALTHY_LKG_AVAILABLE'
          (history/'history-selection.json').write_text(json.dumps({
              'selected': selected,
              'current_source_health_state': current.get('source_health_state'),
              'lkg_is_current_truth': False,
          }, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          print({
              'programme_family':'LIFE',
              'source_health_state':current.get('source_health_state'),
              'healthy_source_count':current.get('healthy_source_count'),
              'degraded_source_count':current.get('degraded_source_count'),
              'reconciliation_state':rec.get('reconciliation_state'),
              'semantic_change_count':rec.get('semantic_change_count'),
              'pipeline_watch_candidate':rec.get('pipeline_watch_candidate'),
              'history_selected':selected,
              'open_call_authorized':False,
              'publication_effect':'NONE',
          })
          PY

      - name: Upload replayable LIFE programme proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: partener-eu-life-programme-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/partener-eu-life-programme-proof
          if-no-files-found: error
          retention-days: 7
