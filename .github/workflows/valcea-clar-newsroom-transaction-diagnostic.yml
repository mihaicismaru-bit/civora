name: VÂLCEA CLAR Live Newsroom Transaction Diagnostic

# Explicit read-only production-path probe. Results are workflow artifacts only;
# diagnostics never mutate canonical repository state.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'valcea-clar/scripts/newsroom_transaction_diagnostic.py'
      - 'valcea-clar/scripts/overlay_runtime_export.py'
      - '.github/workflows/valcea-clar-newsroom-transaction-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: valcea-clar-newsroom-transaction-diagnostic-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve current SCM story id
        id: fact
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          doc=json.loads(Path('valcea-clar/editorial/facts_registry.json').read_text(encoding='utf-8'))
          rows=[row for row in doc.get('facts',[]) if row.get('auto_scope')=='scm_official_program_fact_kernel']
          print('story_id=' + (str(rows[-1].get('id')) if rows else ''))
          PY
      - name: Run canonical build/render dry-run
        if: steps.fact.outputs.story_id != ''
        run: |
          python valcea-clar/scripts/newsroom_transaction_diagnostic.py \
            --story-id "${{ steps.fact.outputs.story_id }}" \
            --output /tmp/newsroom_transaction_diagnostic.json
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valcea-clar-newsroom-transaction-diagnostic-${{ github.run_id }}
          path: /tmp/newsroom_transaction_diagnostic.json
          if-no-files-found: warn
          retention-days: 7
