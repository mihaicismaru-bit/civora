name: VÂLCEA CLAR APAVIL Scheduled Water Interruption References

on:
  pull_request:
    paths:
      - "valcea-clar/scripts/apavil_scheduled_water_interruption_reference_adapter.py"
      - ".github/workflows/valcea-clar-apavil-scheduled-water-interruption-references.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valcea-clar-apavil-scheduled-water-interruption-references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bounded adapter
        run: python -m py_compile valcea-clar/scripts/apavil_scheduled_water_interruption_reference_adapter.py
      - name: Run fail-closed self-test
        run: python valcea-clar/scripts/apavil_scheduled_water_interruption_reference_adapter.py --self-test
      - name: Verify live first-party source health
        shell: bash
        run: |
          python valcea-clar/scripts/apavil_scheduled_water_interruption_reference_adapter.py > /tmp/apavil.json
          python - <<'PY'
          import json
          with open("/tmp/apavil.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["state"] == "CLEAR", data
          assert data["reference_count"] >= 2, data
          assert data["content_contract"] == "FIRST_PARTY_SCHEDULED_WATER_INTERRUPTION_REFERENCE_ONLY"
          assert all(item["current_state_authorized"] is False for item in data["references"])
          print(f"live-source: clear ({data['reference_count']} current-year references)")
          PY
