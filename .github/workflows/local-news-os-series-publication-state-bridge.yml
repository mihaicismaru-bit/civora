name: LOCAL NEWS OS Series Publication-State Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "local-news-os/social/series_publication_state_bridge.py"
      - "local-news-os/social/test_series_publication_state_bridge.py"
      - "local-news-os/social/cadence_fatigue.py"
      - "local-news-os/social/native_series_compositor.py"
      - "local-news-os/social/series_visual_router.py"
      - "local-news-os/social/visual_router.py"
      - "local-news-os/social/content_atomizer.py"
      - "local-news-os/social/hook_engine.py"
      - "valcea-clar/social/channels/**"
      - ".github/workflows/local-news-os-series-publication-state-bridge.yml"
  push:
    branches: [main]
    paths:
      - "local-news-os/social/series_publication_state_bridge.py"
      - "local-news-os/social/test_series_publication_state_bridge.py"
      - "local-news-os/social/cadence_fatigue.py"
      - "local-news-os/social/native_series_compositor.py"
      - "local-news-os/social/series_visual_router.py"
      - "local-news-os/social/visual_router.py"
      - "local-news-os/social/content_atomizer.py"
      - "local-news-os/social/hook_engine.py"
      - "valcea-clar/social/channels/**"
      - ".github/workflows/local-news-os-series-publication-state-bridge.yml"

permissions:
  contents: read

concurrency:
  group: local-news-os-series-publication-state-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile recurring-series publication stack
        run: |
          python -m py_compile \
            local-news-os/social/content_atomizer.py \
            local-news-os/social/hook_engine.py \
            local-news-os/social/visual_router.py \
            local-news-os/social/cadence_fatigue.py \
            local-news-os/social/native_series_compositor.py \
            local-news-os/social/series_visual_router.py \
            local-news-os/social/series_publication_state_bridge.py \
            local-news-os/social/test_series_publication_state_bridge.py

      - name: Run Recurring Series Publication-State Bridge acceptance tests
        run: python local-news-os/social/test_series_publication_state_bridge.py

      - name: Validate series publication policy remains channel-native and fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('valcea-clar/social/series_registry.json').read_text(encoding='utf-8'))
          for channel_id in sorted(registry.get('channels', {})):
              if not channel_id.startswith('valcea-'):
                  raise SystemExit(f'{channel_id}: invalid channel namespace')
              platform = channel_id[len('valcea-'):]
              channel = json.loads(Path(f'valcea-clar/social/channels/{platform}.json').read_text(encoding='utf-8'))
              if channel.get('zero_paid_dependency') is not True:
                  raise SystemExit(f'{channel_id}: zero_paid_dependency must remain true')
              if (channel.get('metrics') or {}).get('observed_only') is not True:
                  raise SystemExit(f'{channel_id}: observed-only metrics required')
              if not isinstance(channel.get('cadence'), dict) or not isinstance(channel.get('fatigue'), dict):
                  raise SystemExit(f'{channel_id}: cadence/fatigue config required')
              print(f'{channel_id}: PASS')
          PY
