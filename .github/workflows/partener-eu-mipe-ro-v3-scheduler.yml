name: PARTENER.EU MIPE Romania v3 Scheduler

on:
  # Recurring ownership lives in PARTENER.EU MIPE Windows Crawl v3 itself.
  # Keep this bounded dispatcher only as a manual recovery path so two 3-hour
  # schedules cannot cancel each other through the shared crawler concurrency group.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: partener-eu-mipe-ro-v3-scheduler
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch bounded Romanian crawl on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/partener-eu-mipe-ro-crawl-v3.yml/dispatches" \
            -d '{"ref":"main","inputs":{"max_pages":"60","max_depth":"3","persist":"true"}}')
          cat /tmp/dispatch.json || true
          test "$code" = "204"
          echo "Romanian MIPE v3 crawl dispatched: HTTP $code"
