name: PARTENER.EU Cleanup Phase 7 Immutable Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/partener-cleanup-phase7-immutable-runtime-20260822'
    paths:
      - 'partener-eu/ops/apply_mipe_immutable_runtime_cleanup.py'
      - '.github/workflows/partener-eu-cleanup-phase7.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-cleanup-phase7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile fail-closed migration
        run: python -m py_compile partener-eu/ops/apply_mipe_immutable_runtime_cleanup.py
      - name: Apply immutable-runtime cleanup
        run: python partener-eu/ops/apply_mipe_immutable_runtime_cleanup.py
      - name: Regression-test immutable MIPE runtime
        run: |
          python -m py_compile partener-eu/ingest/mipe_resilient_ingest.py
          python -m py_compile partener-eu/ingest/mipe_direct_only_ingest.py
          python partener-eu/ops/test_mipe_resilient_ingest.py
          python partener-eu/ops/test_mipe_route_arbitration.py
      - name: Enforce cleanup contract
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          proof=json.loads((root/'partener-eu/ops/mipe_immutable_runtime_cleanup.json').read_text(encoding='utf-8'))
          assert proof['status']=='PASS', proof
          assert proof['sourceSha256']=='ad82649456a2aced555ffd43ae768ab275e4b02fb6a32acd6e152097280e500b'
          assert proof['canonicalHostedDirectOnlyGuardVerified'] is True
          assert proof['accessBridgeRetired'] is True
          assert proof['validationSourceMutationRemoved'] is True
          assert proof['dualRelaySourceMutationRemoved'] is True
          assert proof['remainingExecutableFixerReferencesBeforeDeletion']==[]
          assert not (root/'.github/workflows/partener-eu-mipe-access-bridge.yml').exists()
          for name in (
              'fix_mipe_resilient_classifier.py','fix_mipe_resilient_runtime.py',
              'fix_mipe_content_quality.py','fix_mipe_first_party_relay.py','fix_mipe_dual_relay.py',
          ):
              assert not (root/'partener-eu/ops'/name).exists(), name
          canonical=(root/'.github/workflows/partener-eu-mipe-ingest.yml').read_text(encoding='utf-8')
          assert 'run: python partener-eu/ingest/mipe_direct_only_ingest.py' in canonical
          validation=(root/'.github/workflows/partener-eu-validation.yml').read_text(encoding='utf-8')
          assert 'fix_mipe_resilient_classifier.py' not in validation
          assert 'partener-eu/ingest/mipe_resilient_ingest.py \\' not in validation
          dual=(root/'.github/workflows/partener-eu-mipe-dual-relay.yml').read_text(encoding='utf-8')
          assert 'fix_mipe_' not in dual
          assert 'workflow_dispatch:' in dual
          print('PARTENER MIPE immutable runtime cleanup: PASS')
          PY
      - name: Commit tested cleanup and proof to branch
        run: |
          set -euo pipefail
          git config user.name 'partener-cleanup-audit[bot]'
          git config user.email 'partener-cleanup-audit@users.noreply.github.com'
          git add -A -- \
            .github/workflows/partener-eu-validation.yml \
            .github/workflows/partener-eu-mipe-dual-relay.yml \
            .github/workflows/partener-eu-mipe-access-bridge.yml \
            .github/workflows/partener-eu-mipe-fixer-idempotence.yml \
            .github/workflows/partener-eu-mipe-fixer-materialize.yml \
            partener-eu/ops/fix_mipe_resilient_classifier.py \
            partener-eu/ops/fix_mipe_resilient_runtime.py \
            partener-eu/ops/fix_mipe_content_quality.py \
            partener-eu/ops/fix_mipe_first_party_relay.py \
            partener-eu/ops/fix_mipe_dual_relay.py \
            partener-eu/ops/audit_mipe_fixer_idempotence.py \
            partener-eu/ops/materialize_mipe_fixer_state.py \
            partener-eu/ops/audit_mipe_workflow_chain_equivalence.py \
            partener-eu/ops/mipe_immutable_runtime_cleanup.json
          if git diff --cached --quiet; then
            echo 'Immutable-runtime cleanup already applied.'
            exit 0
          fi
          git commit -m 'PARTENER cleanup: seal immutable MIPE runtime'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: partener-mipe-immutable-runtime-cleanup
          path: partener-eu/ops/mipe_immutable_runtime_cleanup.json
          if-no-files-found: error
