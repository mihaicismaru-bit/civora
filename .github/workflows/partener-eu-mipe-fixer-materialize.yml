name: PARTENER.EU MIPE Fixer Materialization

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/partener-cleanup-phase6-fixer-proof-20260822'
    paths:
      - 'partener-eu/ops/materialize_mipe_fixer_state.py'
      - 'partener-eu/ops/audit_mipe_fixer_idempotence.py'
      - 'partener-eu/ops/audit_mipe_workflow_chain_equivalence.py'
      - '.github/workflows/partener-eu-mipe-fixer-materialize.yml'

permissions:
  contents: write

concurrency:
  group: partener-eu-mipe-fixer-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile migration and proof helpers
        run: |
          python -m py_compile partener-eu/ops/materialize_mipe_fixer_state.py
          python -m py_compile partener-eu/ops/audit_mipe_fixer_idempotence.py
          python -m py_compile partener-eu/ops/audit_mipe_workflow_chain_equivalence.py
      - name: Materialize active runtime fixer chain
        run: python partener-eu/ops/materialize_mipe_fixer_state.py
      - name: Validate materialized source
        run: |
          python -m py_compile partener-eu/ingest/mipe_resilient_ingest.py
          python -m py_compile partener-eu/ingest/mipe_direct_only_ingest.py
          python partener-eu/ops/test_mipe_resilient_ingest.py
      - name: Prove full fixer-chain idempotence
        run: python partener-eu/ops/audit_mipe_fixer_idempotence.py
      - name: Audit each workflow fixer chain independently
        run: python partener-eu/ops/audit_mipe_workflow_chain_equivalence.py
      - name: Enforce full-chain immutable-source equivalence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('partener-eu/ops/mipe_fixer_idempotence.json').read_text(encoding='utf-8'))
          assert p['status']=='PASS', p
          assert p['beforeSha256']==p['afterSha256'], p
          assert p['mutated'] is False, p
          assert p['restorationVerified'] is True, p
          assert p['allFixersRan'] is True, p
          print('MIPE full fixer-chain equivalence: PASS', p['beforeSha256'])
          PY
      - name: Persist tested source and proof receipts before chain gate
        run: |
          set -euo pipefail
          git config user.name 'partener-cleanup-audit[bot]'
          git config user.email 'partener-cleanup-audit@users.noreply.github.com'
          git add \
            partener-eu/ingest/mipe_resilient_ingest.py \
            partener-eu/ops/mipe_fixer_materialization.json \
            partener-eu/ops/mipe_fixer_idempotence.json \
            partener-eu/ops/mipe_workflow_chain_equivalence.json
          if ! git diff --cached --quiet; then
            git commit -m 'PARTENER cleanup: persist MIPE workflow-chain proof'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'MIPE source and proof receipts unchanged.'
          fi
      - name: Enforce per-workflow immutable-source equivalence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('partener-eu/ops/mipe_workflow_chain_equivalence.json').read_text(encoding='utf-8'))
          assert p['restorationVerified'] is True, p
          failures=[row for row in p['chains'] if row['status']!='PASS']
          assert not failures, failures
          assert p['status']=='PASS', p
          print('MIPE workflow-chain equivalence: PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partener-mipe-fixer-materialization
          path: |
            partener-eu/ops/mipe_fixer_materialization.json
            partener-eu/ops/mipe_fixer_idempotence.json
            partener-eu/ops/mipe_workflow_chain_equivalence.json
          if-no-files-found: warn
