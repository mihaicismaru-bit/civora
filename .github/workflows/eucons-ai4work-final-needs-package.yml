name: EUCONS AI4WORK Final Needs Package Gate

on:
  pull_request:
    paths:
      - 'eucons/research/ai4work-step/final_needs_package_gate.py'
      - 'eucons/research/ai4work-step/render_needs_analysis_docx.py'
      - 'eucons/research/ai4work-step/test_final_needs_package_gate.py'
      - 'eucons/research/ai4work-step/SOURCE_REGISTER_SNAPSHOT_CONTRACT.json'
      - 'eucons/research/ai4work-step/adversarial_qa.py'
      - 'eucons/research/ai4work-step/need_ranking_engine.py'
      - 'eucons/research/ai4work-step/disclosure_control.py'
      - 'eucons/research/ai4work-step/nf06_preingest.py'
      - 'eucons/research/ai4work-step/NEED_ANALYSIS_PLAN_DRAFT.json'
      - 'eucons/research/ai4work-step/PRECOLLECTION_ANALYSIS_PLAN_LOCK_DRAFT.json'
      - 'eucons/research/ai4work-step/PROD_ACTIVATION_MANIFEST_DRAFT.json'
      - '.github/workflows/eucons-ai4work-final-needs-package.yml'
  push:
    branches: [main]
    paths:
      - 'eucons/research/ai4work-step/final_needs_package_gate.py'
      - 'eucons/research/ai4work-step/render_needs_analysis_docx.py'
      - 'eucons/research/ai4work-step/test_final_needs_package_gate.py'
      - 'eucons/research/ai4work-step/SOURCE_REGISTER_SNAPSHOT_CONTRACT.json'
      - 'eucons/research/ai4work-step/adversarial_qa.py'
      - 'eucons/research/ai4work-step/need_ranking_engine.py'
      - 'eucons/research/ai4work-step/disclosure_control.py'
      - 'eucons/research/ai4work-step/nf06_preingest.py'
      - 'eucons/research/ai4work-step/NEED_ANALYSIS_PLAN_DRAFT.json'
      - 'eucons/research/ai4work-step/PRECOLLECTION_ANALYSIS_PLAN_LOCK_DRAFT.json'
      - 'eucons/research/ai4work-step/PROD_ACTIVATION_MANIFEST_DRAFT.json'
      - '.github/workflows/eucons-ai4work-final-needs-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eucons-ai4work-final-needs-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-needs-package-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run final package tests (TEST TWIN is NON-EVIDENCE)
        working-directory: eucons/research/ai4work-step
        run: python -m unittest -v test_final_needs_package_gate.py
      - name: Assert source-register contract stays non-numeric and fail-closed
        working-directory: eucons/research/ai4work-step
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('SOURCE_REGISTER_SNAPSHOT_CONTRACT.json').read_text(encoding='utf-8'))
          assert contract['schema_version'] == 'eucons.ai4work_source_register_snapshot.v0.1'
          assert contract['test_twin_evidence_eligible'] is False
          rules = contract['prod_rules']
          assert rules['secondary_evidence_h1_h5_numeric_points'] == 0
          assert rules['project_activity_as_need_evidence'] is False
          assert rules['source_register_numeric_rank_eligible'] is False
          assert rules['source_register_may_change_numeric_h1_h5_order'] is False
          assert rules['test_twin_can_be_promoted'] is False
          print('PASS: source-register snapshot contract preserves the non-evidence/numeric boundary')
          PY
      - name: Assert approved method cannot self-authorize real collection or PROD release
        working-directory: eucons/research/ai4work-step
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          plan = json.loads((root / 'NEED_ANALYSIS_PLAN_DRAFT.json').read_text(encoding='utf-8'))
          lock = json.loads((root / 'PRECOLLECTION_ANALYSIS_PLAN_LOCK_DRAFT.json').read_text(encoding='utf-8'))
          frame = json.loads((root / 'COLLECTION_FRAME_DRAFT.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'PROD_ACTIVATION_MANIFEST_DRAFT.json').read_text(encoding='utf-8'))

          assert plan.get('status') == 'APPROVED_FOR_PROD'
          assert plan.get('approval', {}).get('approved_for_prod') is True
          assert frame.get('frame_status') == 'APPROVED_FOR_PROD'
          assert frame.get('approval', {}).get('approved_for_prod') is True
          assert lock.get('state') == 'LOCKED_BEFORE_PROD_ACTIVATION'
          assert re.fullmatch(r'[0-9a-f]{64}', lock.get('need_analysis_plan_sha256', ''))
          assert re.fullmatch(r'[0-9a-f]{64}', lock.get('collection_frame_sha256', ''))
          assert frame.get('collection_enabled') is False
          assert frame.get('nf06_handoff', {}).get('eligible_now') is False
          assert manifest.get('approved_for_prod') is False
          assert manifest.get('collection_enabled') is False
          assert manifest.get('real_collection_authorized') is False
          assert plan.get('test_twin_evidence_class') == 'TEST_TWIN_NON_EVIDENCE'
          assert plan.get('project_activity_as_need_evidence') is False
          print('PASS: final package mechanics use an approved locked method while real collection, NF06 and PROD release remain fail-closed')
          PY
