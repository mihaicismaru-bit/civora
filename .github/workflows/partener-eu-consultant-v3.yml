name: PARTENER.EU Consultant Workspace v3 QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'partener-eu/web/consultant-loader-v1.js'
      - 'partener-eu/web/consultant-workspace-v3.js'
      - 'partener-eu/web/consultant-workspace-v3.css'
      - 'partener-eu/web/consultant-onboarding-v3.js'
      - 'partener-eu/web/consultant-onboarding-v3.css'
      - 'partener-eu/web/consultant-mysmis-v1.js'
      - 'partener-eu/web/consultant-mysmis-v1.css'
      - 'partener-eu/web/mysmis-registry.js'
      - 'partener-eu/web/index.html'
      - 'partener-eu/ops/test_consultant_workspace_v3.py'
      - 'partener-eu/ops/test_consultant_crud_v4.py'
      - 'partener-eu/ops/test_consultant_runtime_v5.py'
      - '.github/workflows/partener-eu-consultant-v3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'partener-eu/web/consultant-loader-v1.js'
      - 'partener-eu/web/consultant-workspace-v3.js'
      - 'partener-eu/web/consultant-workspace-v3.css'
      - 'partener-eu/web/consultant-onboarding-v3.js'
      - 'partener-eu/web/consultant-onboarding-v3.css'
      - 'partener-eu/web/consultant-mysmis-v1.js'
      - 'partener-eu/web/consultant-mysmis-v1.css'
      - 'partener-eu/web/mysmis-registry.js'
      - 'partener-eu/web/index.html'
      - 'partener-eu/ops/test_consultant_workspace_v3.py'
      - 'partener-eu/ops/test_consultant_crud_v4.py'
      - 'partener-eu/ops/test_consultant_runtime_v5.py'
      - '.github/workflows/partener-eu-consultant-v3.yml'

concurrency:
  group: partener-eu-consultant-v3-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check partener-eu/web/consultant-loader-v1.js
          node --check partener-eu/web/consultant-workspace-v3.js
          node --check partener-eu/web/consultant-onboarding-v3.js
          node --check partener-eu/web/consultant-mysmis-v1.js
          node --check partener-eu/web/mysmis-registry.js

      - name: Product, CRUD, runtime and evidence contract
        run: |
          python partener-eu/ops/test_consultant_workspace_v3.py
          python partener-eu/ops/test_consultant_crud_v4.py
          python partener-eu/ops/test_consultant_runtime_v5.py
