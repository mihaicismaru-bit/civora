name: PARTENER.EU Programming Pipeline Projection CI

on:
  pull_request:
    paths:
      - 'partener-eu/ingest/interreg_programming_pipeline_registry.json'
      - 'partener-eu/ingest/interreg_programming_pipeline.py'
      - 'partener-eu/web/programming_pipeline_projection.py'
      - 'partener-eu/web/programming_pipeline_preview.py'
      - 'partener-eu/ops/test_programming_pipeline_projection.py'
      - 'partener-eu/ops/test_programming_pipeline_preview.py'
      - '.github/workflows/partener-eu-programming-pipeline-projection.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  projection-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout is exact event head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact event head verified: $ACTUAL_SHA"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate projection and accessible-preview syntax and fail-closed regression
        run: |
          python -m py_compile partener-eu/web/programming_pipeline_projection.py
          python -m py_compile partener-eu/web/programming_pipeline_preview.py
          python -m py_compile partener-eu/ops/test_programming_pipeline_projection.py
          python -m py_compile partener-eu/ops/test_programming_pipeline_preview.py
          python partener-eu/ops/test_programming_pipeline_projection.py
          python partener-eu/ops/test_programming_pipeline_preview.py

      - name: Restore exact-head reconciled Source Registry evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/partener-programming-projection/source-registry
          FOUND=""
          SOURCE_RUN_ID=""
          SOURCE_ARTIFACT_ID=""
          for ATTEMPT in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=partener-interreg-programming-pipeline-evidence&per_page=100" \
              > /tmp/partener-programming-projection/artifacts.json
            CANDIDATE="$(python - <<'PY'
          import json, os
          data=json.load(open('/tmp/partener-programming-projection/artifacts.json', encoding='utf-8'))
          head=os.environ['EXPECTED_HEAD_SHA']
          branch=os.environ['EXPECTED_HEAD_BRANCH']
          matches=[]
          for artifact in data.get('artifacts') or []:
              if artifact.get('expired') is True:
                  continue
              run=artifact.get('workflow_run') or {}
              if str(run.get('head_sha') or '') != head:
                  continue
              if branch and str(run.get('head_branch') or '') != branch:
                  continue
              matches.append((str(artifact.get('created_at') or ''), int(artifact.get('id') or 0), int(run.get('id') or 0)))
          matches.sort(reverse=True)
          if matches:
              _created, artifact_id, run_id=matches[0]
              print(f'{artifact_id} {run_id}')
          PY
          )"
            if [ -n "$CANDIDATE" ]; then
              SOURCE_ARTIFACT_ID="${CANDIDATE%% *}"
              SOURCE_RUN_ID="${CANDIDATE##* }"
              RUN_NAME="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.name // ""')"
              RUN_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha // ""')"
              RUN_CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.conclusion // ""')"
              if [ "$RUN_NAME" != "PARTENER.EU Source Registry CI" ]; then
                echo "Ignoring artifact from unexpected workflow: $RUN_NAME"
              elif [ "$RUN_HEAD" != "$EXPECTED_HEAD_SHA" ]; then
                echo "FAIL source-registry evidence head drift: $RUN_HEAD != $EXPECTED_HEAD_SHA" >&2
                exit 2
              elif [ "$RUN_CONCLUSION" = "success" ]; then
                FOUND="true"
                break
              elif [ "$RUN_CONCLUSION" = "failure" ] || [ "$RUN_CONCLUSION" = "cancelled" ] || [ "$RUN_CONCLUSION" = "timed_out" ] || [ "$RUN_CONCLUSION" = "action_required" ]; then
                echo "FAIL exact-head Source Registry run ended with $RUN_CONCLUSION" >&2
                exit 2
              fi
            fi
            echo "Waiting for successful exact-head Source Registry evidence (attempt $ATTEMPT/30)..."
            sleep 10
          done
          if [ "$FOUND" != "true" ]; then
            echo "FAIL no successful exact-head Source Registry evidence became available" >&2
            exit 2
          fi
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name partener-interreg-programming-pipeline-evidence \
            --dir /tmp/partener-programming-projection/source-registry
          test -s /tmp/partener-programming-projection/source-registry/interreg-programming-pipeline.json
          test -s /tmp/partener-programming-projection/source-registry/interreg-programming-reconciliation.json
          export SOURCE_RUN_ID SOURCE_ARTIFACT_ID
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('/tmp/partener-programming-projection')
          binding={
              'binding_id':'PROGRAMMING_PIPELINE_PROJECTION_SOURCE_REGISTRY_BINDING_V1',
              'expected_head_sha':os.environ['EXPECTED_HEAD_SHA'],
              'expected_head_branch':os.environ['EXPECTED_HEAD_BRANCH'],
              'source_registry_workflow_run_id':os.environ['SOURCE_RUN_ID'],
              'source_registry_artifact_id':os.environ['SOURCE_ARTIFACT_ID'],
              'source_registry_required_conclusion':'success',
              'projection_uses_persisted_reconciled_receipt':True,
              'duplicate_live_acquisition_in_projection_lane':False,
          }
          (root/'projection-source-binding.json').write_text(json.dumps(binding, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY

      - name: Build read-only PROGRAMARE VIITOARE projection from reconciled receipt
        run: |
          cp /tmp/partener-programming-projection/source-registry/interreg-programming-pipeline.json \
            /tmp/partener-programming-projection/interreg-programming-pipeline.json
          cp /tmp/partener-programming-projection/source-registry/interreg-programming-reconciliation.json \
            /tmp/partener-programming-projection/interreg-programming-reconciliation.json
          python partener-eu/web/programming_pipeline_projection.py \
            --snapshot /tmp/partener-programming-projection/interreg-programming-pipeline.json \
            --reconciliation /tmp/partener-programming-projection/interreg-programming-reconciliation.json \
            --output /tmp/partener-programming-projection/programming-pipeline-public-projection.json

      - name: Build accessible noindex PROGRAMARE VIITOARE preview
        run: |
          python partener-eu/web/programming_pipeline_preview.py \
            --projection /tmp/partener-programming-projection/programming-pipeline-public-projection.json \
            --output /tmp/partener-programming-projection/programming-pipeline-preview.html \
            --manifest /tmp/partener-programming-projection/programming-pipeline-preview-manifest.json

      - name: Validate live projection remains preview-only and non-authorizing
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('/tmp/partener-programming-projection/programming-pipeline-public-projection.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('projection_id') != 'PROGRAMMING_PIPELINE_PUBLIC_PROJECTION_V1':
              print('FAIL projection identity drift')
              sys.exit(2)
          if d.get('surface') != 'PROGRAMARE_VIITOARE_PIPELINE' or d.get('surface_state') != 'PREVIEW_READ_ONLY_NOT_PUBLISHED':
              print('FAIL pipeline preview surface drift')
              sys.exit(2)
          if d.get('card_count', 0) < 1 or len(d.get('cards') or []) != d.get('card_count'):
              print('FAIL projection card inventory')
              sys.exit(2)
          if len(d.get('coverage_gaps') or []) != d.get('coverage_gap_count'):
              print('FAIL coverage-gap inventory drift')
              sys.exit(2)
          for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized','call_alert_authorized'):
              if d.get(key) is not False:
                  print('FAIL projection became authorizing:', key, d.get(key))
                  sys.exit(2)
          if d.get('publication_effect') != 'NONE' or d.get('reader_copy_generated') is not False or d.get('seo_indexing_state') != 'NOINDEX_PREVIEW_ONLY':
              print('FAIL preview/publication boundary drift')
              sys.exit(2)
          allowed={'PROPOSAL','CONSULTATION','PROGRAMMING_PROCESS'}
          for card in d['cards']:
              if card.get('observation_state') not in allowed:
                  print('FAIL forbidden card state:', card.get('source_id'), card.get('observation_state'))
                  sys.exit(2)
              if card.get('open_confirmation_state') != 'NOT_CONFIRMED_MISSING_EXACT_CALL_EVIDENCE':
                  print('FAIL card open-confirmation boundary:', card.get('source_id'))
                  sys.exit(2)
              for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
                  if card.get(key) is not False:
                      print('FAIL card became authorizing:', card.get('source_id'), key)
                      sys.exit(2)
          required_gap_missing={'programme_specific_official_2028_2034_authority','bounded_official_programme_endpoint','programme_specific_semantic_reconciliation'}
          dedicated=set(d.get('programme_specific_covered_programme_ids') or [])
          for gap in d.get('coverage_gaps') or []:
              programme_id=gap.get('programme_id')
              if not programme_id or programme_id in dedicated:
                  print('FAIL framework-only coverage gap conflicts with dedicated coverage:', programme_id)
                  sys.exit(2)
              if gap.get('coverage_state') != 'FRAMEWORK_ONLY_RESEARCH_WATCH_NOT_ADMITTED':
                  print('FAIL framework-only coverage state drift:', programme_id, gap.get('coverage_state'))
                  sys.exit(2)
              if not required_gap_missing.issubset(set(gap.get('missing_for_programme_specific_admission') or [])):
                  print('FAIL coverage-gap proof requirements weakened:', programme_id)
                  sys.exit(2)
              for key in ('material_fact_use','open_call_authorized','deadline_authorized','budget_authorized','eligibility_authorized','publish_authorized','distribution_authorized'):
                  if gap.get(key) is not False:
                      print('FAIL coverage gap became authorizing:', programme_id, key)
                      sys.exit(2)
          print(json.dumps({
              'card_count': d['card_count'],
              'coverage_gap_count': d.get('coverage_gap_count'),
              'framework_only_programmes': [g.get('programme_id') for g in d.get('coverage_gaps') or []],
              'healthy_source_count': d.get('healthy_source_count'),
              'degraded_source_count': d.get('degraded_source_count'),
              'reconciliation_state': d.get('reconciliation_state'),
              'semantic_change_count': d.get('semantic_change_count'),
              'surface_state': d.get('surface_state'),
              'open_call_authorized': d.get('open_call_authorized'),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Validate accessible preview artifact stays noindex and bound to projection
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path('/tmp/partener-programming-projection')
          projection_path=root/'programming-pipeline-public-projection.json'
          preview_path=root/'programming-pipeline-preview.html'
          manifest_path=root/'programming-pipeline-preview-manifest.json'
          projection_raw=projection_path.read_bytes()
          preview_raw=preview_path.read_bytes()
          preview=preview_raw.decode('utf-8')
          projection=json.loads(projection_raw.decode('utf-8'))
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('preview_id') != 'PROGRAMMING_PIPELINE_ACCESSIBLE_PREVIEW_V1':
              print('FAIL accessible preview identity drift')
              sys.exit(2)
          if manifest.get('projection_id') != projection.get('projection_id'):
              print('FAIL accessible preview projection identity mismatch')
              sys.exit(2)
          if manifest.get('projection_sha256') != hashlib.sha256(projection_raw).hexdigest():
              print('FAIL accessible preview projection hash mismatch')
              sys.exit(2)
          if manifest.get('preview_html_sha256') != hashlib.sha256(preview_raw).hexdigest():
              print('FAIL accessible preview HTML hash mismatch')
              sys.exit(2)
          if manifest.get('card_count') != projection.get('card_count') or manifest.get('coverage_gap_count') != projection.get('coverage_gap_count'):
              print('FAIL accessible preview inventory mismatch')
              sys.exit(2)
          if '<meta name="robots" content="noindex,nofollow">' not in preview:
              print('FAIL accessible preview lost noindex')
              sys.exit(2)
          if 'Nu este o listă de apeluri deschise.' not in preview or 'Nu este apel deschis.' not in preview:
              print('FAIL accessible preview lost OPEN boundary copy')
              sys.exit(2)
          if any(card.get('observation_state') == 'CONSULTATION' and card.get('consultation_end_date') for card in projection.get('cards') or []):
              if 'Nu este termen de apel de finanțare.' not in preview:
                  print('FAIL consultation deadline could be confused with call deadline')
                  sys.exit(2)
          if 'OPEN_CALL' in preview:
              print('FAIL accessible preview renders forbidden OPEN_CALL token')
              sys.exit(2)
          for key in ('publish_authorized','distribution_authorized','call_alert_authorized'):
              if manifest.get(key) is not False:
                  print('FAIL accessible preview manifest became authorizing:', key)
                  sys.exit(2)
          if manifest.get('publication_effect') != 'NONE' or manifest.get('seo_indexing_state') != 'NOINDEX_PREVIEW_ONLY':
              print('FAIL accessible preview publication boundary drift')
              sys.exit(2)
          print(json.dumps({
              'preview_id': manifest['preview_id'],
              'card_count': manifest['card_count'],
              'coverage_gap_count': manifest['coverage_gap_count'],
              'projection_sha256': manifest['projection_sha256'],
              'preview_html_sha256': manifest['preview_html_sha256'],
              'seo_indexing_state': manifest['seo_indexing_state'],
              'publish_authorized': manifest['publish_authorized'],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload bounded projection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partener-programming-pipeline-projection-evidence
          path: /tmp/partener-programming-projection
          retention-days: 7
          if-no-files-found: error
