[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-presence-os"
version = "0.45.0"
description = "Pre-pilot TEXT/PHOTO public presence control plane"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0"]

[project.scripts]
public-presence-os = "public_presence_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
