<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>EUCONS — development preview</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f7f8fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}
    main{width:min(760px,100%);background:#fff;border:1px solid #e4e8ee;border-radius:20px;padding:48px;box-shadow:0 18px 50px rgba(20,31,48,.08)}
    .eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#526070}
    h1{font-size:clamp(2.3rem,7vw,4.6rem);line-height:.98;margin:.45rem 0 1.2rem;letter-spacing:-.05em}
    p{font-size:1.1rem;line-height:1.65;color:#4a5665;max-width:62ch}
    .status{display:inline-flex;margin-top:1.4rem;padding:.6rem .85rem;border-radius:999px;background:#eef1f5;font-weight:700;font-size:.85rem}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Euroconsult · EUCONS Commercial OS</div>
    <h1>Development preview</h1>
    <p>Această suprafață există pentru validarea autonomă a buildului EUCONS. Conținutul comercial public va fi activat numai după ce registrele de servicii, dovezi, persoane și cazuri trec porțile de verificare.</p>
    <div class="status">E00 · bootstrap</div>
  </main>
</body>
</html>
